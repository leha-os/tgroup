<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wall — Quản lý Dự án Thi công</title>
<style>
:root{--bg:#faf7f2;--card:#ffffff;--ink:#1a1410;--mut:#8a7f70;--line:#ece5d8;--pri:#e8930c;--pri-d:#c97a08;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0891b2;--radius:12px;--sh:0 1px 3px rgba(26,20,16,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
a{color:var(--pri);text-decoration:none}
button{font-family:inherit;cursor:pointer}
/* ===== LOGIN ===== */
#loginView{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow-y:auto;background:radial-gradient(900px 480px at 50% -40px,#fffdf6 0%,#f7f1e3 55%,#ece1c8 100%);padding:24px 16px}
.login-card{margin:auto;background:#fff;border-radius:18px;padding:36px 32px;width:400px;max-width:100%;box-shadow:0 18px 50px rgba(140,95,10,.20);border:1px solid #ece1c8;border-top:5px solid #f0ad1f}
.login-card h1{font-size:22px;margin:14px 0 4px;color:#1a1410;text-align:center}
.login-card p.sub{color:#8a7f70;font-size:13px;margin-bottom:22px;text-align:center}
.login-card .btn-pri{padding:13px;font-size:15px;width:100%}
.logo-badge{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;font-weight:800}
/* ===== FORM ===== */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#374151}
.inp,select.inp,textarea.inp{width:100%;padding:10px 12px;border:1px solid #d4dae6;border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
.inp:focus{outline:2px solid #fbd38d;border-color:var(--pri)}
textarea.inp{resize:vertical;min-height:70px}
.frm-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frm-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:9px;border:1px solid transparent;font-size:14px;font-weight:600;transition:.15s}
.btn-pri{background:#f0ad1f;color:#1a1410}.btn-pri:hover{background:#d99a10;color:#fff}
.btn-sec{background:#fff;border-color:#d4dae6;color:var(--ink)}.btn-sec:hover{background:#f1f5f9}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{background:#15803d}
.btn-bad{background:#fee2e2;color:#b91c1c;border-color:#fecaca}.btn-bad:hover{background:#fecaca}
.btn-warn{background:#fef3c7;color:#92400e;border-color:#fde68a}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:7px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* ===== APP SHELL ===== */
#appView{display:none;height:100vh;overflow:hidden}
.shell{display:flex;height:100vh}
.sidebar{width:264px;flex-shrink:0;background:#1a1d29;color:#d6cfc2;display:flex;flex-direction:column;transition:.2s;z-index:50}
.sb-brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
.sb-brand img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
.sb-brand .t1{font-size:14px;font-weight:800;color:#f0ad1f;letter-spacing:.3px;line-height:1.3}
.sb-brand .t2{font-size:10.5px;color:#8a7f70;margin-top:2px}
.sb-proj{margin:10px 18px 0;padding:8px 10px;background:rgba(240,173,31,.12);border:1px solid rgba(240,173,31,.4);border-radius:8px;font-size:12px;color:#f0ad1f;font-weight:700;display:none}
.sb-nav{flex:1;overflow-y:auto;padding:10px 12px}
.sb-sec{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:#6e6257;text-transform:uppercase;padding:12px 10px 6px}
.sb-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#d6cfc2;font-size:13.5px;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.sb-link:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-link.active{background:#f0ad1f;color:#1a1410;font-weight:700}
.sb-link .ic{display:none}
.sb-link .cnt{margin-left:auto;background:rgba(255,255,255,.1);font-size:11px;padding:1px 8px;border-radius:20px}
.sb-link.active .cnt{background:rgba(0,0,0,.18)}
.sb-sub{margin:2px 0 4px 20px;border-left:2px solid rgba(255,255,255,.1);padding-left:4px}
.sb-sub .sb-link{font-size:13px;padding:7px 10px}
.sb-quick{margin:4px 12px 8px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border-radius:10px;font-weight:700;justify-content:center}
.sb-quick:hover{filter:brightness(1.08);color:#fff}
.sb-user{border-top:1px solid rgba(255,255,255,.08);padding:12px}
.sb-user .row{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:#f0ad1f;color:#1a1410;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.sb-user .nm{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .rl{font-size:11px;color:#8a7f70}
.sb-logout{margin-top:10px;width:100%;background:none;border:1px solid rgba(255,255,255,.15);color:#d6cfc2;border-radius:8px;padding:8px;font-size:13px}
.sb-logout:hover{background:rgba(255,255,255,.06)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px}
.topbar h2{font-size:13px;color:var(--mut);font-weight:600}
.burger{display:none;background:none;border:none;font-size:22px}
.proj-pick{display:flex;align-items:center;gap:8px;margin-left:auto}
.proj-pick select{padding:8px 12px;border:1px solid #d4dae6;border-radius:8px;font-size:13px;max-width:280px}
#view{flex:1;overflow-y:auto;padding:24px}
.footer{text-align:center;padding:14px;color:var(--mut);font-size:12px;border-top:1px solid var(--line);background:var(--card)}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:700}
.page-head p{color:var(--mut);font-size:13px;margin-top:4px}
.page-actions{display:flex;gap:10px;flex-wrap:wrap}
/* ===== CARDS/STATS ===== */
.grid{display:grid;gap:14px}
.g7{grid-template-columns:repeat(7,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-h h3{font-size:15px;font-weight:700}
.card-h .sub{font-size:12px;color:var(--mut);margin-top:2px}
.card-b{padding:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);padding:16px;display:flex;gap:12px;align-items:flex-start;border-top:3px solid var(--pri)}
.stat .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.stat .lb{font-size:12px;color:var(--mut);font-weight:600}
.stat .vl{font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;word-break:break-word}
.stat .ic{display:none}
.qentry .qe .ic{display:none}
.search .inp{padding-left:12px;width:260px}
.login-logo{display:block;margin:0 auto 8px;width:150px;height:auto;background:#fff;border-radius:14px;padding:8px}
@media(max-width:900px){
.topbar{flex-wrap:nowrap;padding:10px 14px}
.proj-pick{margin-left:0;flex:1;min-width:0;display:flex;align-items:center;gap:8px}.proj-pick>span{flex-shrink:0;white-space:nowrap}
.proj-pick select{flex:1;min-width:0}
.proj-pick select{max-width:none;width:100%}
.stat .vl{font-size:16px}
.page-head h1{font-size:20px}
.tbl{font-size:12.5px}
.tbl th,.tbl td{padding:8px 10px}
.mback{padding:0;align-items:flex-end}
.modal{border-radius:16px 16px 0 0;width:100%;max-height:94vh;display:flex;flex-direction:column}
.m-body{overflow-y:auto}
.toolbar .search,.toolbar .search .inp{width:100%}
.qentry{grid-template-columns:repeat(2,1fr)}
.card-b{padding:14px}
.card-h{flex-wrap:wrap}
#view{padding:12px}
.stat{padding:12px}
.stat .vl{font-size:16px}
.btn{min-height:44px}
.inp,select.inp,textarea.inp{font-size:16px}
.tbl-wrap{margin:0 -14px;padding:0 14px}
.tbl{min-width:640px}
.kv{grid-template-columns:1fr;gap:2px}
.kv dt{font-size:11.5px}
.tabs{overflow-x:auto;white-space:nowrap}
.tab{flex-shrink:0}
.mback{padding:12px 0 0}
.modal{margin:auto auto 0}
.toast{left:16px;right:16px;bottom:16px}
.toast .t{text-align:center}
.topbar{gap:10px}
#syncPill{font-size:11px}
@media(max-width:900px){#syncPill{display:none}}
.login-card{padding:28px 22px}
.phieu-wrap{padding:22px 14px;margin:0}
.phieu-sign .box{padding:6px 2px 44px;font-size:10px}
.phieu-foot{gap:24px}
}
@media(max-width:480px){
.topbar h2{display:none}
.page-actions{width:100%}
.page-actions .btn{flex:1;justify-content:center}
.prog{min-width:0}
}
.st-info{border-top-color:var(--info)}.st-info .ic{background:#e0f2fe}
.st-warn{border-top-color:var(--warn)}.st-warn .ic{background:#fef3c7}
.st-bad{border-top-color:var(--bad)}.st-bad .ic{background:#fee2e2}
.st-ok{border-top-color:var(--ok)}.st-ok .ic{background:#dcfce7}
/* ===== TABLE ===== */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:10px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);background:#f8fafc;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#f8fafc}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.num{text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-green{background:#dcfce7;color:#166534}.b-amber{background:#fef3c7;color:#92400e}.b-red{background:#fee2e2;color:#991b1b}.b-blue{background:#dbeafe;color:#1e40af}.b-gray{background:#f1f5f9;color:#475569}.b-purple{background:#ede9fe;color:#5b21b6}
.linklike{background:none;border:none;color:var(--pri);font-weight:600;font-size:13.5px;padding:0}
.linklike:hover{text-decoration:underline}
.rowbtns{display:flex;gap:6px;justify-content:flex-end}
.iconbtn{background:#f1f5f9;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:13px}
.iconbtn:hover{background:#e2e8f0}
/* ===== MODAL ===== */
.mback{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:30px 16px;overflow-y:auto}
.mback.open{display:flex}
.modal{background:#fff;border-radius:14px;width:560px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease-out}
.modal.lg{width:760px}
@keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}}
.m-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.m-head h3{font-size:16px;font-weight:700}
.m-x{background:none;border:none;font-size:20px;color:var(--mut);line-height:1}
.m-body{padding:22px}
.m-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
/* ===== MISC ===== */
.toast{position:fixed;bottom:24px;right:24px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast .t{background:#0f1b33;color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s}
.kv{display:grid;grid-template-columns:180px 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--mut);font-weight:600}.kv dd{font-weight:600}
.alert{padding:12px 16px;border-radius:9px;font-size:13.5px;margin-bottom:16px}
.alert-red{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.alert-amber{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert-blue{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .inp,.toolbar select.inp{width:auto}
.search{position:relative}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .big{font-size:40px;margin-bottom:8px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--mut);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--pri);border-bottom-color:var(--pri)}
.prog{height:8px;background:#eef2f7;border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:6px;background:var(--ok)}
.prog.over i{background:var(--bad)}
.ledger-in{color:var(--ok);font-weight:700}.ledger-out{color:var(--bad);font-weight:700}
.qentry{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.qentry .qe{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 12px;text-align:center;cursor:pointer;transition:.15s}
.qentry .qe:hover{border-color:var(--pri);box-shadow:var(--sh);transform:translateY(-2px)}
.qentry .qe .ic{font-size:30px;margin-bottom:8px}
.qentry .qe .t{font-size:13px;font-weight:700}
@media(max-width:1100px){.g7{grid-template-columns:repeat(4,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
.sidebar{position:fixed!important;left:0;top:0;bottom:0;z-index:60;width:min(280px,84vw)!important;max-width:84vw;transform:translateX(-106%);transition:transform .22s ease;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:0 20px 20px 0}
.sidebar.open{transform:translateX(0)!important;box-shadow:0 0 50px rgba(0,0,0,.45)}
#sbBackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:59}
#sbBackdrop.show{display:block!important}
@media(max-width:900px){.topbar{position:sticky;top:0;z-index:40;background:#fff}}
.burger{display:flex!important;align-items:center;justify-content:center;min-width:44px;min-height:44px}
.g7,.g5,.g4,.g3{grid-template-columns:repeat(2,1fr)}
.grid>*{min-width:0}
.stat .vl{overflow-wrap:anywhere}
.g2{grid-template-columns:1fr}
#view{padding:14px}
.frm-row,.frm-row3{grid-template-columns:1fr}
}
/* ===== PHIẾU DNTT (y bản cũ) ===== */
.ptitle{text-align:center;font-size:20px;font-weight:800;text-decoration:underline;margin:10px 0 4px}
.pdate{text-align:center;margin-bottom:10px}
.ptbl{width:100%;border-collapse:collapse;margin:8px 0}
.ptbl td,.ptbl th{border:1px solid #000;padding:6px 8px;vertical-align:top}
.ptbl .ctr{text-align:center}
.ptbl .ul{text-decoration:underline;font-weight:700}
.ptbl .gray{background:#c0c0c0}
.psec{margin:8px 0 2px;font-weight:600}
.pdot{border-bottom:1px dotted #999;height:14px;margin:2px 0}
.prow{display:flex;align-items:flex-end;gap:8px;margin:8px 0}
.prow .lab{white-space:nowrap;font-weight:600}
.prow .dot{flex:1;border-bottom:1px dotted #999;height:14px}
.pfoot{margin-top:12px;border:1px solid #000;text-align:center;padding:8px;font-weight:700;font-size:12px}
.phieu-wrap{max-width:820px;margin:24px auto;background:#fff;padding:32px 42px;border:1px solid #ddd;font-family:Arial,sans-serif;color:#000;font-size:13px;line-height:1.5}
.phieu-head{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid #000;padding-bottom:10px;margin-bottom:6px}
.phieu-head .logo{width:70px;height:70px;flex-shrink:0;object-fit:contain}
.phieu-head .co{font-size:12.5px;line-height:1.5}
.phieu-title{text-align:center;font-size:20px;font-weight:800;margin:18px 0 20px;letter-spacing:1px}
.phieu-row{display:flex;gap:18px;margin:8px 0;flex-wrap:wrap}
.phieu-row .cell{flex:1;min-width:200px}
.phieu-row .lbl{color:#333}
.phieu-sign{display:flex;margin:22px 0;border:1px solid #000}
.phieu-sign .box{flex:1;text-align:center;padding:8px 4px 55px;border-left:1px solid #000;font-size:11px;font-weight:700;min-width:0}
.phieu-sign .box:first-child{border-left:none}
.phieu-money{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.phieu-money th,.phieu-money td{border:1px solid #000;padding:9px 8px;text-align:center}
.phieu-words{margin:10px 0}
.phieu-foot{display:flex;justify-content:flex-end;gap:60px;margin-top:18px;text-align:center;font-size:13px}
.phieu-modal-body{max-height:70vh;overflow-y:auto}
body.printing-phieu .sidebar,body.printing-phieu .topbar,body.printing-phieu .m-head,body.printing-phieu .m-foot{display:none!important}
body.printing-phieu .mback{position:static;padding:0;background:none}
body.printing-phieu .modal{box-shadow:none;width:100%;max-width:100%}
body.printing-phieu .phieu-wrap{border:none;margin:0;max-width:100%}
.phieu-title{text-align:center;font-size:20px;font-weight:800;margin:10px 0;letter-spacing:.5px}
.phieu-ngay{text-align:right;margin:4px 0;font-size:14px}
.phieu-tbl{width:100%;border-collapse:collapse;margin:6px 0;font-size:14px}
.phieu-tbl td{padding:5px 6px;vertical-align:top}
.phieu-sign6{display:grid;grid-template-columns:repeat(6,1fr);text-align:center;font-size:12.5px;margin:8px 0;min-height:64px}
.phieu-sign6 div{padding:4px 2px}
.phieu-sec{margin:8px 0 2px;font-size:14px}
.phieu-line{font-size:13.5px;margin:2px 0}
.phieu-blank{min-height:26px;border-bottom:1px dotted #999;margin:2px 0}
.phieu-sign2{display:flex;justify-content:space-between;margin:10px 0;font-size:14px}
.phieu-note{text-align:center;font-weight:800;font-size:13px;margin:12px 0 4px}
@media print{
.sidebar,.topbar,.page-actions,.toolbar,.toast,.noprint{display:none!important}
.mback{display:none!important}
body.printing-phieu #appView,body.printing-phieu #loginView{display:none!important}
body.printing-phieu .mback{display:block!important;position:static!important;padding:0!important;background:none!important}
body.printing-phieu .modal{box-shadow:none!important;width:100%!important;max-width:100%!important;margin:0!important;max-height:none!important}
body.printing-phieu .m-head,body.printing-phieu .m-foot{display:none!important}
body.printing-phieu .phieu-modal-body{max-height:none!important;overflow:visible!important}
body.printing-phieu{font-family:Arial,sans-serif!important}
body.printing-phieu .phieu-wrap{max-width:100%!important;margin:0!important;padding:8px 12px!important;font-size:10.5px!important;line-height:1.3!important;font-family:Arial,sans-serif!important}
body.printing-phieu .phieu-wrap *{font-family:Arial,sans-serif!important}
body.printing-phieu .ptbl{font-size:11px!important}
body.printing-phieu .ptbl td,body.printing-phieu .ptbl th{padding:3px 5px!important}
body.printing-phieu .psig td{height:44px!important}
body.printing-phieu .ptitle{font-size:16px!important;margin:6px 0 2px!important}
body.printing-phieu .psec{margin:5px 0 1px!important}
body.printing-phieu .pdot{height:10px!important}
body.printing-phieu .pfoot{margin-top:8px!important;padding:6px!important;font-size:11px!important}
@page{size:A4;margin:10mm}

<!-- ============ LOGIN ============ -->
<div id="loginView">
  <div class="login-card">
    <img id="loginLogo" class="login-logo" alt="THE WALL">
    <h1 style="text-align:center">THE WALL ARCHITECTURE</h1>
    <div class="fld"><label>Tên đăng nhập</label><input class="inp" id="lgUser" placeholder="Tên đăng nhập"></div>
    <div class="fld"><label>Mật khẩu</label><input class="inp" id="lgPass" type="password" placeholder="Mật khẩu"></div>
    <div id="lgErr" class="alert alert-red" style="display:none"></div>
    <button class="btn btn-pri btn-block" onclick="doLogin()">Đăng nhập</button>
  </div>
</div>
<!-- ============ APP ============ -->
<div id="appView">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside><div id="sbBackdrop" onclick="document.getElementById('sidebar').classList.remove('open');this.classList.remove('show')"></div>
    <div class="main">
      <div class="topbar">
        <button class="burger" onclick="var s=document.getElementById('sidebar'),b=document.getElementById('sbBackdrop'),o=s.classList.toggle('open');b.classList.toggle('show',o)" aria-label="Menu">☰</button>
        <h2>CÔNG TY TNHH TƯ VẤN THIẾT KẾ KIẾN TRÚC XÂY DỰNG BỨC TƯỜNG</h2>

      </div>

/* ================= CHARTS (SVG thuần, không lib) ================= */
function hbarChart(data,color){ // data:[{label,value}]
 const max=Math.max(...data.map(d=>d.value),1);
 return '<div style="display:flex;flex-direction:column;gap:10px">'+data.map(d=>'<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>'+esc(d.label)+'</span><b>'+fmtVND(d.value)+'</b></div><div class="prog"><i style="width:'+Math.round(100*d.value/max)+'%;background:'+color+'"></i></div></div>').join('')+'</div>';
}
function donutChart(data){ // data:[{label,value,color}]
 const total=data.reduce((s,d)=>s+d.value,0)||1;let acc=0;
 const segs=data.map(d=>{const p=d.value/total;const s='<circle cx="80" cy="80" r="56" fill="none" stroke="'+d.color+'" stroke-width="26" stroke-dasharray="'+(p*351.8).toFixed(1)+' 351.8" stroke-dashoffset="'+(-acc*351.8).toFixed(1)+'" transform="rotate(-90 80 80)"/>';acc+=p;return s;}).join('');
 return '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg width="160" height="160" viewBox="0 0 160 160">'+segs+'<text x="80" y="76" text-anchor="middle" font-size="13" fill="#8a7f70">Tổng</text><text x="80" y="98" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1410">'+fmtVND(total)+'</text></svg><div style="display:flex;flex-direction:column;gap:8px;font-size:12.5px">'+data.map(d=>'<div style="display:flex;align-items:center;gap:8px"><span style="width:12px;height:12px;border-radius:3px;background:'+d.color+'"></span>'+esc(d.label)+'<b style="margin-left:auto">'+Math.round(100*d.value/total)+'%</b></div>').join('')+'</div></div>';
}
/* ================= LEDGER ENGINE ================= */
function runLedger(rows,inKey,outKey){ // rows:[{date,desc,in,out}] -> [{...,balance}]
 let b=0;return rows.slice().sort((a,c)=>a.date<c.date?-1:1).map(r=>{b+=(r[inKey]||0)-(r[outKey]||0);return Object.assign({},r,{balance:b});});
}
/* chi tiêu 1 dự án = mua vật tư + chi phí + lương/ứng + thuê máy + trả NCC/nhà thầu... (dòng tiền ra thực tế) */
function projectSpent(pid){
 let s=0;
 DB.data.vendorTx.filter(t=>t.projectId===pid&&t.type==='payment').forEach(t=>s+=(+t.amount||0));
 DB.data.contractorTx.filter(t=>t.projectId===pid&&t.type==='payment').forEach(t=>s+=(+t.amount||0));
 DB.data.expenses.filter(t=>t.projectId===pid).forEach(t=>s+=(+t.amount||0));
 return s;
}
function projectLiab(pid){
 const vd=dueOf(DB.data.vendorTx.filter(t=>t.projectId===pid),'purchase','payment');
 const kd=dueOf(DB.data.contractorTx.filter(t=>t.projectId===pid),'entry','payment');
 const ed=0;
 const md=0;
 return {vendor:vd,contractor:kd,salary:ed,machine:md,total:vd+kd+ed+md};
}
function dueOf(rows,inT,outT){const i=rows.filter(r=>r.type===inT).reduce((s,r)=>s+(+r.amount||0),0);const o=rows.filter(r=>r.type===outT).reduce((s,r)=>s+(+r.amount||0),0);return Math.max(0,i-o);}
function projectRecv(pid){ // phải thu = bán/NT - đã nhận
 return dueOf(DB.data.clientTx.filter(t=>t.projectId===pid),'billed','received');
}

 h+='<div class="grid g4" style="margin-bottom:16px">'+stat('Ngân sách',fmtVND(p.budget),'','st-info')+stat('Đã chi',fmtVND(s),'','st-warn')+stat('Công nợ phải trả',fmtVND(l.total),'','st-bad')+stat('Còn lại',fmtVND(bal),'',bal<0?'st-bad':'st-ok')+'</div>';
 h+='<div class="grid g4" style="margin-bottom:16px">'+stat('Phải thu KH',fmtVND(recv),'','st-info')+stat('Nợ NCC',fmtVND(l.vendor),'','st-bad')+stat('Nợ nhà thầu',fmtVND(l.contractor),'','st-bad')+'</div>';

 DB.data.clientTx.filter(t=>t.projectId===pid).forEach(t=>{rows.push({date:t.date,desc:'Chủ đầu tư — '+t.note,in:t.type==='received'?t.amount:0,out:0});});

 const led=runLedger(rows,'in','out');
 h+='<div class="card"><div class="card-h"><div><h3>Dòng tiền dự án</h3><div class="sub">Ghi tăng = phát sinh phải trả/Ghi giảm = tiền đã chi • Số dư = còn nợ ròng</div></div></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ngày</th><th>Diễn giải</th><th class="num">Phát sinh</th><th class="num">Đã chi/trả</th><th class="num">Số dư nợ</th></tr></thead><tbody>';

 led.forEach(r=>{h+='<tr><td style="white-space:nowrap">'+fmtDate(r.date)+'</td><td>'+esc(r.desc)+'</td><td class="num ledger-in">'+(r.in?fmtVND(r.in):'—')+'</td><td class="num ledger-out">'+(r.out?fmtVND(r.out):'—')+'</td><td class="num"><b>'+fmtVND(r.balance)+'</b></td></tr>';});
 h+='</tbody></table></div></div>';
 $('#view').innerHTML=h;
}

/* ---- hỗ trợ route có tham số (#/vendors/v1 ...) ---- */
function nav(rebuild){
 let h=location.hash||'#/dashboard';
 if(rebuild!==false)buildSidebar();
 const parts=h.split('/');
 let fn=ROUTES[h];
 if(!fn&&parts.length>=3){
  const id=parts.slice(2).join('/');
  if(parts[1]==='projects')fn=()=>renderProjectLedger(id);
  else if(parts[1]==='vendors')fn=()=>renderPartnerLedger(PCFG.vendors,id);
  else if(parts[1]==='contractors')fn=()=>renderContractorLedger(id);
  else if(parts[1]==='bank')fn=()=>renderBankLedger(id);
  else if(parts[1]==='clients')fn=()=>renderPartnerLedger(PCFG.clients,id);
 }
 if(!fn)fn=ROUTES['#/dashboard'];
 $('#view').innerHTML='';fn();window.scrollTo(0,0);
}

function saveUser(id){const o={name:formVal('name'),username:formVal('username'),pass:formVal('pass'),role:formVal('role'),projectIds:formVal('projectIds')?[formVal('projectIds')]:[]};
 if(!o.name||!o.username||!o.pass){toast('Nhập đủ họ tên, tên đăng nhập, mật khẩu');return;}
 if(DB.data.users.some(x=>x.username===o.username&&x.id!==id)){toast('Tên đăng nhập đã tồn tại');return;}
 if(id)Object.assign(DB.data.users.find(x=>x.id===id),o);else DB.data.users.push(Object.assign({id:uid('u')},o));
 DB.log(id?'Sửa người dùng':'Thêm người dùng',o.name+' ('+o.role+')');DB.save();closeModal();nav(false);toast('Đã lưu');}

/* ================= MODULE CŨ: ĐỀ NGHỊ/PHÊ DUYỆT/DỰ TRÙ/PHÁT SINH ================= */
const LOAI_DN={mua_hang:'Mua hàng',thanh_toan:'Thanh toán',thue_thau:'Thuê thầu',nhan_cong:'Nhân công'};
const TT_DN={cho_duyet:['Chờ duyệt','b-amber'],da_duyet:['Đã duyệt','b-blue'],da_chi:['Đã chi','b-green'],tu_choi:['Từ chối','b-red']};
const TT_TU={cho_duyet:['Chờ duyệt','b-amber'],da_duyet:['Đã duyệt','b-blue'],da_quyet_toan:['Đã quyết toán','b-green']};
/* chuẩn hóa Việt <-> code cho cột loại/trạng thái (Sheet lưu tiếng Việt đầy đủ) */
const VI2CODE={};
Object.entries(LOAI_DN).forEach(e=>{VI2CODE[e[1]]=e[0];});
[TT_DN,TT_TU].forEach(m=>Object.entries(m).forEach(e=>{if(!VI2CODE[e[1][0]])VI2CODE[e[1][0]]=e[0];}));
VI2CODE['Chờ chi']='cho_chi';
const CODE2VI={};Object.entries(VI2CODE).forEach(e=>{if(!CODE2VI[e[1]])CODE2VI[e[1]]=e[0];});
const CODE_FIELDS={denghi:['loai','trangthai'],phatsinh:['trangthai'],dutru:['trangthai'],thanhtoan:['trangthai'],tamung:['trangthai']};
function toCode(k,o){const f=CODE_FIELDS[k];if(!f)return o;const c=Object.assign({},o);f.forEach(fd=>{if(typeof c[fd]==='string'&&VI2CODE[c[fd]])c[fd]=VI2CODE[c[fd]];});return c;}
/* chuẩn hóa số tiền: '8.500.000.000' -> 8500000000 (tránh NaN khi Sheet lưu dạng chữ) */
function toNum(v){if(typeof v==='number')return isNaN(v)?0:v;if(v==null||v==='')return 0;const n=parseFloat(String(v).replace(/[^\d-]/g,''));return isNaN(n)?0:n;}
const MONEY_FIELDS={projects:['budget'],denghi:['soluong','dongia','sotien'],phatsinh:['sotien'],dutru:['soluong','dongia','thanhtien'],thanhtoan:['sotien'],tamung:['sotien'],expenses:['amount'],vendorTx:['amount'],contractorTx:['amount'],bankTx:['amount'],clientTx:['amount']};
function normMoney(k,o){const f=MONEY_FIELDS[k];if(!f)return o;const c=Object.assign({},o);f.forEach(fd=>{if(fd in c)c[fd]=toNum(c[fd]);});return c;}
function toVI(k,o){const f=CODE_FIELDS[k];if(!f)return o;const c=Object.assign({},o);f.forEach(fd=>{if(typeof c[fd]==='string'&&CODE2VI[c[fd]])c[fd]=CODE2VI[c[fd]];});return c;}
function ttBadge(st,map){const m=(map||TT_DN)[st]||[st,'b-gray'];return '<span class="badge '+m[1]+'">'+m[0]+'</span>';}
let DN_F={loai:'',tt:''},DT_P='';

function saveDeNghi(id){
 const o={projectId:formVal('projectId'),date:formVal('date')||todayISO(),loai:formVal('loai'),hangmuc:formVal('hangmuc'),noidung:formVal('noidung'),soluong:+formVal('soluong')||0,dongia:+formVal('dongia')||0,ncc:formVal('ncc')};

 DB.log(ok?'Duyệt đề nghị':'Từ chối đề nghị',fmtVND(d.sotien)+' — '+d.noidung+(lydo?' ('+lydo+')':''));

function docSoTien(n){
 n=Math.round(n||0);if(n===0)return 'Không đồng';
 const dv=['','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
 function d3(x){let t=Math.floor(x/100),c=Math.floor(x%100/10),u=x%10,s='';
  if(t)s+=dv[t]+' trăm'+(c===0&&u?' linh':'');
  if(c){s+=(s?' ':'')+(c===1?'mười':dv[c]+' mươi');if(u===1)s+=' một';else if(u===5)s+=' lăm';else if(u)s+=' '+dv[u];}
  else if(u&&t)s+=' '+dv[u];return s;}
 let ty=Math.floor(n/1e9),tr=Math.floor(n%1e9/1e6),ng=Math.floor(n%1e6/1e3),d=n%1e3,p=[];
 if(ty)p.push(d3(ty)+' tỷ');if(tr)p.push(d3(tr)+' triệu');if(ng)p.push(d3(ng)+' nghìn');if(d||!p.length)p.push(d3(d));
 const s=p.join(' ');return s.charAt(0).toUpperCase()+s.slice(1)+' đồng';
}
function dnttCalc(id){
 const t=DB.data.thanhtoan.find(x=>x.id===id);if(!t)return null;
 const dn=DB.data.denghi.find(x=>x.id===t.denghiId)||{};
 const pr=DB.data.projects.find(x=>x.id===t.projectId)||{};
 const lk=DB.data.thanhtoan.filter(x=>x.projectId===t.projectId&&x.trangthai==='da_chi'&&x.id!==id).reduce((s,x)=>s+x.sotien,0);
 return {t:t,dn:dn,p:pr,lk:lk,conlai:(pr.budget||0)-lk-t.sotien};
}

/* Minimal real XLSX writer (store-only ZIP, no external deps) */
function xlsxMake(sheets){
  const enc=new TextEncoder();
  const CT=new Int32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);CT[n]=c;}
  function crc(b){let c=-1;for(let i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return (c^-1)>>>0;}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function colName(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}

  const STYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
  +'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
  +'<numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0"/></numFmts>'
  +'<fonts count="4">'
  +'<font><sz val="11"/><name val="Calibri"/></font>'
  +'<font><b/><sz val="16"/><name val="Calibri"/></font>'
  +'<font><b/><sz val="12"/><name val="Calibri"/></font>'
  +'<font><sz val="12"/><name val="Calibri"/></font>'
  +'</fonts>'
  +'<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFBBC04"/><bgColor indexed="64"/></patternFill></fill></fills>'
  +'<borders count="2">'
  +'<border><left/><right/><top/><bottom/><diagonal/></border>'
  +'<border><left style="thin"><color rgb="FF000000"/></left><right style="thin"><color rgb="FF000000"/></right><top style="thin"><color rgb="FF000000"/></top><bottom style="thin"><color rgb="FF000000"/></bottom><diagonal/></border>'
  +'</borders>'
  +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
  +'<cellXfs count="11">'
  +'<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
  +'<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'
  +'<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0"><alignment vertical="center" wrapText="1"/></xf>'
  +'<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0"><alignment vertical="center" wrapText="1"/></xf>'
  +'<xf numFmtId="0" fontId="3" fillId="0" borderId="1" xfId="0"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'
  +'<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'
  +'<xf numFmtId="0" fontId="3" fillId="0" borderId="1" xfId="0"><alignment vertical="center" wrapText="1"/></xf>'
  +'<xf numFmtId="164" fontId="2" fillId="0" borderId="1" xfId="0"><alignment horizontal="center" vertical="center"/></xf>'
  +'<xf numFmtId="164" fontId="3" fillId="0" borderId="1" xfId="0"><alignment horizontal="center" vertical="center"/></xf>'
  +'<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0"><alignment horizontal="right" vertical="center"/></xf>'
  +'<xf numFmtId="0" fontId="1" fillId="1" borderId="1" xfId="0"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'
  +'</cellXfs>'
  +'<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
  +'</styleSheet>';
  /* style index: 0=mặc định 1=tiêu đề 16 đậm giữa 2=đậm 12 trái 3=thường 12 trái
     4=thường 12 giữa viền 5=đậm 12 giữa 6=thường 12 trái viền 7=tiền đậm viền 8=tiền thường viền 9=thường 12 phải */

  function sheetXml(sh){
    let s='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      +'<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>'
      +'<pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="1"/>'
      +'<printOptions horizontalCentered="1"/>';
    if(sh.widths&&sh.widths.length){
      s+='<cols>';
      sh.widths.forEach((w,i)=>{s+='<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>';});
      s+='</cols>';
    }
    s+='<sheetData>';
    sh.rows.forEach((row,r)=>{
      const rn=r+1;
      const ht=(sh.heights&&sh.heights[rn])?(' ht="'+sh.heights[rn]+'" customHeight="1"'):'';
      s+='<row r="'+rn+'"'+ht+'>';
      row.forEach((cell,c)=>{
        if(cell==null||cell.v==null||cell.v==='')return;
        const ref=colName(c)+rn;
        const st=(cell.s!=null)?(' s="'+cell.s+'"'):'';
        if(typeof cell.v==='number'){
          s+='<c r="'+ref+'"'+st+'><v>'+cell.v+'</v></c>';
        }else{
          s+='<c r="'+ref+'"'+st+' t="inlineStr"><is><t>'+esc(cell.v)+'</t></is></c>';
        }
      });
      s+='</row>';
    });
    s+='</sheetData>';
    if(sh.merges&&sh.merges.length){
      s+='<mergeCells count="'+sh.merges.length+'">';
      sh.merges.forEach(m=>{s+='<mergeCell ref="'+m+'"/>';});
      s+='</mergeCells>';
    }
    s+='</worksheet>';
    return s;
  }

  const parts=[];
  parts.push(['[Content_Types].xml',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'

    +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    +sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')
    +'</Types>']);
  parts.push(['_rels/.rels',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
    +'</Relationships>']);
  parts.push(['xl/workbook.xml',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    +'<sheets>'+sheets.map((sh,i)=>'<sheet name="'+esc(sh.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets>'
    +'</workbook>']);
  parts.push(['xl/_rels/workbook.xml.rels',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')
    +'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    +'</Relationships>']);
  parts.push(['xl/styles.xml',STYLES]);
  sheets.forEach((sh,i)=>parts.push(['xl/worksheets/sheet'+(i+1)+'.xml',sheetXml(sh)]));

  // ZIP store-only
  const encFiles=parts.map(([name,xml])=>({name,data:enc.encode(xml)}));
  const chunks=[];const central=[];let off=0;
  function w16(v){chunks.push(new Uint8Array([v&255,(v>>8)&255]));}
  function w32(v){chunks.push(new Uint8Array([v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255]));}
  encFiles.forEach(f=>{
    const nm=enc.encode(f.name);const c=crc(f.data);
    const lh=new Uint8Array(30+nm.length);
    const dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);
    dv.setUint16(8,0,true);dv.setUint16(10,0,true);dv.setUint16(12,0,true);
    dv.setUint32(14,c,true);dv.setUint32(18,f.data.length,true);dv.setUint32(22,f.data.length,true);
    dv.setUint16(26,nm.length,true);dv.setUint16(28,0,true);
    lh.set(nm,30);
    chunks.push(lh);chunks.push(f.data);
    central.push({nm,c,size:f.data.length,off});
    off+=lh.length+f.data.length;
  });
  const cdStart=off;const cdChunks=[];
  central.forEach(e=>{
    const h=new Uint8Array(46+e.nm.length);
    const dv=new DataView(h.buffer);
    dv.setUint32(0,0x02014b50,true);dv.setUint16(4,20,true);dv.setUint16(6,20,true);
    dv.setUint16(8,0,true);dv.setUint16(10,0,true);dv.setUint16(12,0,true);dv.setUint16(14,0,true);
    dv.setUint32(16,e.c,true);dv.setUint32(20,e.size,true);dv.setUint32(24,e.size,true);
    dv.setUint16(28,e.nm.length,true);
    dv.setUint32(42,e.off,true);
    h.set(e.nm,46);
    cdChunks.push(h);
  });
  let cdLen=0;cdChunks.forEach(c=>cdLen+=c.length);
  const end=new Uint8Array(22);const edv=new DataView(end.buffer);
  edv.setUint32(0,0x06054b50,true);edv.setUint16(8,central.length,true);edv.setUint16(10,central.length,true);
  edv.setUint32(12,cdLen,true);edv.setUint32(16,cdStart,true);
  let total=off+cdLen+22;
  const out=new Uint8Array(total);let p=0;
  chunks.forEach(c=>{out.set(c,p);p+=c.length;});
  cdChunks.forEach(c=>{out.set(c,p);p+=c.length;});
  out.set(end,p);
  return out;
}
function xlsxDownload(sheets,filename){
  const data=xlsxMake(sheets);
  const blob=new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
  a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
}

 if(foot){const clean=String(foot).replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();const rf=new Array(n).fill(null);rf[0]={v:clean,s:2};R.push(rf);}
 const mg='A1:'+xlsxColL(n)+'1',mg2='A2:'+xlsxColL(n)+'2',mg3='A3:'+xlsxColL(n)+'3';

/* ================= API LAYER ================= */
const CFG_KEY='twpro_cfg';
let CFG={apiUrl:'',key:''};
function loadCfg(){try{Object.assign(CFG,JSON.parse(localStorage.getItem(CFG_KEY)||'{}'));}catch(e){}}
function saveCfg(){localStorage.setItem(CFG_KEY,JSON.stringify(CFG));}
function syncCfgForm(){
 const a=document.querySelector('#mBody [name="apiUrl"]')||document.querySelector('#view [name="apiUrl"]');
 const k=document.querySelector('#mBody [name="apiKey"]')||document.querySelector('#view [name="apiKey"]');
 let ch=false;
 if(a&&a.value.trim()!==CFG.apiUrl){CFG.apiUrl=a.value.trim();ch=true;}
 if(k&&k.value!==CFG.key){CFG.key=k.value;ch=true;}
 if(ch){saveCfg();renderSyncPill();}
}
const SYNC_MAP={projects:'DuAn',denghi:'DeNghi',phatsinh:'PhatSinh',dutru:'DuTru',thanhtoan:'ThanhToan',tamung:'TamUng',vendors:'NCC',vendorTx:'NCC_GD',contractors:'NhaThau',contractorTx:'NT_GD',bankAccounts:'Quy',bankTx:'Quy_GD',expenses:'ChiPhi',users:'Users',auditLogs:'LichSu',danhmuc:'DanhMuc',clients:'ChuDauTu',clientTx:'CDT_GD'};
let SYNC={connected:false,dirty:false,msg:'Chưa cấu hình'};
async function apiCall(action,params){
 if(!CFG.apiUrl)throw new Error('Chưa cấu hình API URL');
 const r=await fetch(CFG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action:action,key:CFG.key||''},params||{}))});
 const j=await r.json();if(j&&j.error)throw new Error(j.error);return j;
}
let pushTimer=null;
function markDirty(){SYNC.dirty=true;renderSyncPill();schedulePush();}
function schedulePush(){
 if(!CFG.apiUrl)return;
 clearTimeout(pushTimer);
 pushTimer=setTimeout(()=>{pushAll(true).catch(()=>{});},4000);
}
function renderSyncPill(){
 const el=$('#syncPill');if(!el)return;
 if(!CFG.apiUrl){el.innerHTML='<span class="badge b-gray">Chưa cấu hình API</span>';return;}
 if(SYNC.dirty){el.innerHTML='<span class="badge b-amber">Chưa đồng bộ</span>';return;}
 el.innerHTML='<span class="badge b-green">Đã đồng bộ</span>'+(SYNC.msg?' <span style="font-size:11px;color:var(--mut)">'+esc(SYNC.msg)+'</span>':'');
}
async function pullAll(silent){
 syncCfgForm();
 const d=await apiCall('pull',{});
 let n=0;
 Object.keys(SYNC_MAP).forEach(k=>{const sh=SYNC_MAP[k];if(d[sh]&&Array.isArray(d[sh])){DB.data[k]=d[sh].map(o=>normMoney(k,CODE_FIELDS[k]?toCode(k,o):o));n++;}});
 DB.save0=1;try{localStorage.setItem(DBKEY,JSON.stringify(DB.data));}catch(e){}
 SYNC.dirty=false;SYNC.connected=true;SYNC.msg='Lúc '+new Date().toLocaleTimeString('vi-VN');
 renderSyncPill();if(!silent)toast('Đã tải '+n+' bảng từ server');
 nav(false);
}
async function pushAll(silent){
 syncCfgForm();
 let n=0;
 for(const k of Object.keys(SYNC_MAP)){await apiCall('push',{sheet:SYNC_MAP[k],rows:(DB.data[k]||[]).map(o=>toVI(k,o))});n++;}
 SYNC.dirty=false;SYNC.connected=true;SYNC.msg='Lúc '+new Date().toLocaleTimeString('vi-VN');
 renderSyncPill();if(!silent)toast('Đã đẩy '+n+' bảng lên server');
 DB.log('Đồng bộ','Đẩy toàn bộ dữ liệu lên server');
}
async function diagSync(){
 let msg='API URL: '+(CFG.apiUrl?'Đã có':'TRỐNG - chưa cấu hình!')+'\n';
 if(!CFG.apiUrl){alert(msg+'\nVào Cài đặt nhập API URL giống trên máy tính.');return;}
 try{
   const d=await apiCall('pull',{});
   const sheets=Object.keys(d).filter(k=>Array.isArray(d[k]));
   msg+='Server trả về '+sheets.length+' bảng\n';
   sheets.forEach(k=>{msg+=k+': '+(d[k]?d[k].length:0)+' dòng\n';});
   const duan=d[SYNC_MAP.projects]||[];
   msg+='\nDự án trên server: '+duan.length;
   if(duan.length>0)msg+=' ('+duan.slice(0,3).map(x=>x.code||x.ma||'').join(', ')+')';
 }catch(e){msg+='LỖI: '+e.message;}
 alert(msg);
}
async function testApi(){
 syncCfgForm();
 try{const d=await apiCall('ping',{});SYNC.connected=true;renderSyncPill();toast('Kết nối OK — '+(d.time||'server phản hồi'));return true;}
 catch(e){toast('Lỗi kết nối: '+e.message);return false;}
}
/* ================= CÀI ĐẶT ================= */
ROUTES['#/caidat']=function(){
 if(!Auth.canAdmin()){location.hash='#/dashboard';return;}
 const mods=Object.keys(SYNC_MAP).map(k=>({k,sh:SYNC_MAP[k],n:(DB.data[k]||[]).length}));
 let h='<div class="page-head"><div><h1>Cài đặt</h1><p>Kết nối backend Google Apps Script • đồng bộ dữ liệu</p><p style="color:#999;font-size:11px">Bản dựng: 2026-10-09 19:35</p></div></div>';
 h+='<div class="grid g2" style="margin-bottom:16px"><div class="card"><div class="card-h"><div><h3>Kết nối API</h3><div class="sub">URL Web App đã Deploy (quyền Anyone)</div></div><span id="connDot"></span></div><div class="card-b">'
  +fld('API URL',inp('apiUrl',CFG.apiUrl,'text','placeholder="https://script.google.com/macros/s/.../exec"'))
  +fld('Access Key (nếu có)',inp('apiKey',CFG.key))
  +'<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-pri" onclick="saveApiCfg()">Lưu cấu hình</button><button class="btn btn-sec" onclick="testApi()">Kiểm tra kết nối</button></div></div></div>';
 h+='<div class="card"><div class="card-h"><div><h3>Đồng bộ dữ liệu</h3><div class="sub">Kéo/đẩy toàn bộ giữa máy và Google Sheet</div></div></div><div class="card-b">'
  +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><button class="btn btn-ok" onclick="pullAll().catch(e=>toast(\'Lỗi: \'+e.message))">Tải từ server</button><button class="btn btn-sec" onclick="diagSync()">Chẩn đoán</button><button class="btn btn-warn" onclick="if(confirm(\'Ghi đè toàn bộ sheet server bằng dữ liệu máy?\'))pushAll().catch(e=>toast(\'Lỗi: \'+e.message))">Đẩy lên server</button></div>'
  +'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Module</th><th>Sheet</th><th class="num">Số dòng (máy)</th></tr></thead><tbody>'
  +mods.map(m=>'<tr><td>'+m.k+'</td><td><span class="badge b-blue">'+m.sh+'</span></td><td class="num">'+m.n+'</td></tr>').join('')
  +'</tbody></table></div></div></div></div>';
 h+='<div class="card"><div class="card-h"><div><h3>Dữ liệu mẫu</h3><div class="sub">Khôi phục demo ban đầu</div></div></div><div class="card-b"><button class="btn btn-bad" onclick="if(confirm(\'Xóa hết dữ liệu hiện tại, về demo?\')){DB.reset();ensureArrays();nav(false);}">Khôi phục demo</button></div></div>';
 $('#view').innerHTML=h;
};
function saveApiCfg(){CFG.apiUrl=formVal('apiUrl');CFG.key=formVal('apiKey');saveCfg();renderSyncPill();toast('Đã lưu cấu hình');}
/* đảm bảo collection mới tồn tại khi mở bản cũ */
function ensureArrays(){let ch=false;Object.keys(SEED).forEach(k=>{if(!Array.isArray(DB.data[k])){DB.data[k]=JSON.parse(JSON.stringify(SEED[k]));ch=true;}});if(ch){try{localStorage.setItem(DBKEY,JSON.stringify(DB.data));}catch(e){}}}
/* tiền có dấu chấm khi nhập */
document.addEventListener('input',function(e){
 const t=e.target;if(!t.classList||!t.classList.contains('money'))return;
 const d=t.value.replace(/[^\d]/g,'').slice(0,15);
 t.value=d?new Intl.NumberFormat('vi-VN').format(+d):'';
});

/* ================= INIT ================= */
DB.load();
ensureArrays();
loadCfg();
$('#loginLogo').src=TW_LOGO;
DB._sv=DB.save;DB.save=function(){DB._sv();if(CFG.apiUrl)markDirty();};
const _doLogin=doLogin;
doLogin=async function(){
 const u=$('#lgUser').value.trim(),pw=$('#lgPass').value;
 if(CFG.apiUrl){
  try{const r=await apiCall('login',{username:u,pass:pw});
   if(r&&r.user){Auth.user={id:r.user.id,name:r.user.name||r.user.ho_ten,role:r.user.role||r.user.vai_tro,projectIds:r.user.projectIds||(r.user.du_an?[r.user.du_an]:[])};DB.log('Đăng nhập','qua server');saveSession();enterApp();pullAll(true).catch(()=>{});return;}
   $('#lgErr').style.display='block';$('#lgErr').textContent='Sai tên đăng nhập hoặc mật khẩu.';return;
  }catch(e){/* rớt về local */}
 }
 if(Auth.login(u,pw)){DB.log('Đăng nhập','Đăng nhập hệ thống');enterApp();}
 else{$('#lgErr').style.display='block';$('#lgErr').textContent='Sai tên đăng nhập hoặc mật khẩu.';}
};
$('#lgPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('#lgUser').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
const SES_KEY='twpro_session';
function saveSession(){try{localStorage.setItem(SES_KEY,JSON.stringify(Auth.user));}catch(e){}}
function clearSession(){try{localStorage.removeItem(SES_KEY);}catch(e){}}
function restoreSession(){
 try{
  const s=JSON.parse(localStorage.getItem(SES_KEY)||'null');
  if(!s||!s.id)return false;
  const f=DB.data.users.find(x=>x.id===s.id);
  Auth.user=f?{id:f.id,name:f.name,role:f.role,projectIds:f.projectIds||[]}:s;
  return !!Auth.user;
 }catch(e){return false;}
}
if(restoreSession()){enterApp();if(CFG.apiUrl)pullAll(true).catch(()=>{});}
else{showLogin();}
</script>
