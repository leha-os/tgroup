<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wall - Project Management System [DEMO]</title>
<style>
:root{--bg:#faf7f2;--card:#ffffff;--ink:#1a1410;--mut:#8a7f70;--line:#ece5d8;--pri:#e8930c;--pri-d:#c97a08;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0891b2;--radius:12px;--sh:0 1px 3px rgba(26,20,16,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;max-width:100vw}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;overflow-x:hidden;max-width:100vw}
a{color:var(--pri);text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;height:auto}
#loginView{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow-y:auto;background:radial-gradient(900px 480px at 50% -40px,#fffdf6 0%,#f7f1e3 55%,#ece1c8 100%);padding:24px 16px}
.login-card{margin:auto;background:#fff;border-radius:18px;padding:36px 32px;width:400px;max-width:100%;box-shadow:0 18px 50px rgba(140,95,10,.20);border:1px solid #ece1c8;border-top:5px solid #f0ad1f}
.login-card h1{font-size:22px;margin:14px 0 4px;color:#1a1410;text-align:center}
.login-card p.sub{color:#8a7f70;font-size:13px;margin-bottom:22px;text-align:center}
.login-card .btn-pri{padding:13px;font-size:15px;width:100%}
.logo-badge{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;font-weight:800}
.fld{margin-bottom:14px;min-width:0}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#374151}
.inp,select.inp,textarea.inp{width:100%;max-width:100%;padding:10px 12px;border:1px solid #d4dae6;border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);min-width:0}
.inp:focus{outline:2px solid #fbd38d;border-color:var(--pri)}
textarea.inp{resize:vertical;min-height:70px}
.frm-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frm-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:9px;border:1px solid transparent;font-size:14px;font-weight:600;transition:.15s;white-space:nowrap;max-width:100%}
.btn-pri{background:#f0ad1f;color:#1a1410}.btn-pri:hover{background:#d99a10;color:#fff}
.btn-sec{background:#fff;border-color:#d4dae6;color:var(--ink)}.btn-sec:hover{background:#f1f5f9}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{background:#15803d}
.btn-bad{background:#fee2e2;color:#b91c1c;border-color:#fecaca}.btn-bad:hover{background:#fecaca}
.btn-warn{background:#fef3c7;color:#92400e;border-color:#fde68a}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:7px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
#appView{display:none;height:100vh;height:100dvh;overflow:hidden;max-width:100vw}
.shell{display:flex;height:100vh;height:100dvh;max-width:100vw;width:100%;overflow:hidden}
.sidebar{width:264px;flex-shrink:0;background:#1a1d29;color:#d6cfc2;display:flex;flex-direction:column;z-index:50;overflow:hidden}
.sb-brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px;flex-shrink:0}
.sb-brand img{width:44px;height:44px;object-fit:contain;background:#1a1a1a;border-radius:8px;padding:4px;flex-shrink:0}
.sb-brand .t1{font-size:14px;font-weight:800;color:#f0ad1f;letter-spacing:.3px;line-height:1.3;word-break:break-word}
.sb-brand .t2{font-size:10.5px;color:#8a7f70;margin-top:2px}
.sb-proj{margin:10px 18px 0;padding:8px 10px;background:rgba(240,173,31,.12);border:1px solid rgba(240,173,31,.4);border-radius:8px;font-size:12px;color:#f0ad1f;font-weight:700;display:none;word-break:break-word}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px;-webkit-overflow-scrolling:touch}
.sb-nav-tools{display:flex;gap:6px;padding:0 0 8px}
.sb-nav-tools button{flex:1;min-width:0;padding:6px 5px;border:1px solid rgba(240,173,31,.28);border-radius:6px;background:rgba(240,173,31,.08);color:#f0ad1f;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.sb-nav-tools button:hover{background:rgba(240,173,31,.18)}
.sb-sec{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:#8c8073;text-transform:uppercase;padding:12px 10px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-sec-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:transparent;cursor:pointer;text-align:left;line-height:1.3}
.sb-sec-toggle:hover{color:#f0ad1f}
.sb-sec-arrow{font-size:16px;line-height:1;flex-shrink:0;color:#f0ad1f}
.sb-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#d6cfc2;font-size:13.5px;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left;min-width:0;overflow:hidden}
.sb-link:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-link.active{background:#f0ad1f;color:#1a1410;font-weight:700}
.sb-link .ic{display:none}
.sb-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sb-link .cnt{margin-left:auto;background:rgba(255,255,255,.1);font-size:11px;padding:1px 8px;border-radius:20px;flex-shrink:0}
.sb-link.active .cnt{background:rgba(0,0,0,.18)}
.sb-sub{margin:2px 0 4px 20px;border-left:2px solid rgba(255,255,255,.1);padding-left:4px}
.sb-sub .sb-link{font-size:13px;padding:7px 10px}
.sb-quick{margin:4px 12px 8px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border-radius:10px;font-weight:700;justify-content:center;flex-shrink:0}
.sb-quick:hover{filter:brightness(1.08);color:#fff}
.sb-user{border-top:1px solid rgba(255,255,255,.08);padding:12px;flex-shrink:0}
.sb-user .row{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;background:#f0ad1f;color:#1a1410;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.sb-user .nm{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sb-user .rl{font-size:11px;color:#8a7f70;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-logout{margin-top:10px;width:100%;background:none;border:1px solid rgba(255,255,255,.15);color:#d6cfc2;border-radius:8px;padding:8px;font-size:13px}
.sb-logout:hover{background:rgba(255,255,255,.06)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;width:100%;max-width:100%}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;flex-shrink:0;max-width:100%;min-width:0}
.topbar h2{font-size:13px;color:var(--mut);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.burger{display:none;background:none;border:none;font-size:22px;flex-shrink:0}
.proj-pick{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0;flex-shrink:1}
.proj-pick select{padding:8px 12px;border:1px solid #d4dae6;border-radius:8px;font-size:13px;max-width:280px;min-width:0}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px;max-width:100%;width:100%;box-sizing:border-box;-webkit-overflow-scrolling:touch}
.footer{text-align:center;padding:11px;color:var(--mut);font-size:10px;border-top:1px solid var(--line);background:var(--card);flex-shrink:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap;width:100%;max-width:100%;min-width:0}
.page-head h1{font-size:24px;font-weight:700;min-width:0;word-break:break-word}
.page-head p{color:var(--mut);font-size:13px;margin-top:4px;word-break:break-word}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;max-width:100%}
.grid{display:grid;gap:14px;width:100%;max-width:100%}
.grid>*{min-width:0}
.g7{grid-template-columns:repeat(7,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);min-width:0;max-width:100%;overflow:hidden}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-width:0}
.card-h h3{font-size:15px;font-weight:700;min-width:0;word-break:break-word}
.card-h .sub{font-size:12px;color:var(--mut);margin-top:2px;word-break:break-word}
.card-b{padding:20px;max-width:100%;min-width:0;overflow:hidden}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);padding:16px;display:flex;gap:12px;align-items:flex-start;border-top:3px solid var(--pri);min-width:0;max-width:100%}
.stat .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.stat .lb{font-size:12px;color:var(--mut);font-weight:600;word-break:break-word}
.stat .vl{font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;word-break:break-word;overflow-wrap:anywhere;min-width:0}
.stat .ic{display:none}
.qentry .qe .ic{display:none}
.search .inp{padding-left:12px;width:260px;max-width:100%}
.login-logo{display:block;margin:0 auto 8px;width:150px;height:auto;background:#1a1a1a;border-radius:14px;padding:12px}
.st-info{border-top-color:var(--info)}.st-info .ic{background:#e0f2fe}
.st-warn{border-top-color:var(--warn)}.st-warn .ic{background:#fef3c7}
.st-bad{border-top-color:var(--bad)}.st-bad .ic{background:#fee2e2}
.st-ok{border-top-color:var(--ok)}.st-ok .ic{background:#dcfce7}
.tbl-wrap{display:block;width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;position:relative}
.tbl-wrap::-webkit-scrollbar{height:6px}
.tbl-wrap::-webkit-scrollbar-thumb{background:#d4c9b3;border-radius:6px}
table.tbl{width:100%;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);border-collapse:collapse;font-size:14px;min-width:600px}
.tbl th,.tbl td{border:1px solid #cbd5e1;padding:10px 12px}
.tbl th{background:linear-gradient(135deg,#1a1d29,#2d3142);color:#f0ad1f;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.5px;text-align:left;padding:10px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);background:#f8fafc;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#f8fafc}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.num{text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-green{background:#dcfce7;color:#166534}.b-amber{background:#fef3c7;color:#92400e}.b-red{background:#fee2e2;color:#991b1b}.b-blue{background:#dbeafe;color:#1e40af}.b-gray{background:#f1f5f9;color:#475569}.b-purple{background:#ede9fe;color:#5b21b6}
.linklike{background:none;border:none;color:var(--pri);font-weight:600;font-size:13.5px;padding:0}
.linklike:hover{text-decoration:underline}
.rowbtns{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.iconbtn{background:#f1f5f9;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:13px}
.iconbtn:hover{background:#e2e8f0}
.mback{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:30px 16px;overflow-y:auto;overflow-x:hidden}
.mback.open{display:flex}
.modal{background:#fff;border-radius:14px;width:560px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease-out;max-width:min(560px,calc(100vw - 32px))}
.modal.lg{width:760px;max-width:min(760px,calc(100vw - 32px))}
@keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}}
.m-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.m-head h3{font-size:16px;font-weight:700;min-width:0;word-break:break-word}
.m-x{background:none;border:none;font-size:20px;color:var(--mut);line-height:1}
.m-body{padding:22px;max-width:100%;min-width:0;overflow-x:hidden}
.m-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;right:24px;z-index:400;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast .t{background:#0f1b33;color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s;word-break:break-word}
.kv{display:grid;grid-template-columns:180px 1fr;gap:8px 14px;font-size:13.5px;max-width:100%}
.kv dt{color:var(--mut);font-weight:600;word-break:break-word}.kv dd{font-weight:600;word-break:break-word;min-width:0}
.alert{padding:12px 16px;border-radius:9px;font-size:13.5px;margin-bottom:16px;word-break:break-word}
.alert-red{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.alert-amber{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert-blue{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;width:100%;max-width:100%;min-width:0}
.toolbar .inp,.toolbar select.inp{width:auto;min-width:0;max-width:100%}
.search{position:relative;min-width:0;max-width:100%}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .big{font-size:40px;margin-bottom:8px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;max-width:100%}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--mut);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;flex-shrink:0}
.tab.active{color:var(--pri);border-bottom-color:var(--pri)}
.prog{height:8px;background:#eef2f7;border-radius:6px;overflow:hidden;min-width:0}
.project-name{color:#9a4f00!important;font-weight:800!important}
.project-code{display:block;font-size:11px;color:#7e7b7b!important;font-weight:600;line-height:1.25}
.project-progress{min-width:108px}
.project-progress summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px;color:#7c4a13;font-size:12px;font-weight:700;padding:5px 7px;border:1px solid #ead8bd;border-radius:7px;background:#fffaf2;white-space:nowrap}
.project-progress summary::-webkit-details-marker{display:none}
.project-progress summary:before{content:'▸';font-size:18px;line-height:1;color:#9a4f00;transition:transform .15s}
.project-progress[open] summary:before{transform:rotate(90deg)}
.project-progress summary:focus-visible{outline:2px solid #f0ad1f;outline-offset:2px}
.prog i{display:block;height:100%;border-radius:6px;background:var(--ok)}
.prog.over i{background:var(--bad)}
.ledger-in{color:var(--ok);font-weight:700}.ledger-out{color:var(--bad);font-weight:700}
.qentry{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%;max-width:100%}
.qentry .qe{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 12px;text-align:center;cursor:pointer;transition:.15s;min-width:0;overflow:hidden}
.qentry .qe:hover{border-color:var(--pri);box-shadow:var(--sh);transform:translateY(-2px)}
.qentry .qe .ic{font-size:30px;margin-bottom:8px}
.qentry .qe .t{font-size:13px;font-weight:700;word-break:break-word}
.ptitle{text-align:center;font-size:20px;font-weight:800;text-decoration:underline;margin:10px 0 4px}
.pdate{text-align:center;margin-bottom:10px}
.ptbl{width:100%;border-collapse:collapse;margin:8px 0}
.ptbl td,.ptbl th{border:1px solid #000;padding:6px 8px;vertical-align:top}
.ptbl .ctr{text-align:center}
.ptbl .ul{text-decoration:underline;font-weight:700}
.ptbl .gray{background:#c0c0c0}
.ptbl-dntt{table-layout:fixed;width:100%}
.ptbl-dntt td{overflow-wrap:break-word;word-break:break-word}
.ptbl .sig-h td{text-align:center;font-weight:700}
.ptbl .sig-b td{height:74px}
.ptbl .money-h td{text-align:center}
.ptbl .money-v td{text-align:center}
.psec{margin:8px 0 2px;font-weight:600}
.pdot{border-bottom:1px dotted #999;height:14px;margin:2px 0}
.prow{display:flex;align-items:flex-end;gap:8px;margin:8px 0}
.prow .lab{white-space:nowrap;font-weight:600}
.prow .dot{flex:1;border-bottom:1px dotted #999;height:14px}
.pfoot{margin-top:12px;border:1px solid #000;text-align:center;padding:8px;font-weight:700;font-size:12px}
.phieu-wrap{max-width:820px;margin:24px auto;background:#fff;padding:32px 42px;border:1px solid #ddd;font-family:Arial,sans-serif;color:#000;font-size:13px;line-height:1.5;max-width:min(820px,100%)}
.phieu-head{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid #000;padding-bottom:10px;margin-bottom:6px}
.phieu-head .logo{width:70px;height:70px;flex-shrink:0;object-fit:contain}
.phieu-head .co{font-size:12.5px;line-height:1.5;min-width:0;word-break:break-word}
.phieu-title{text-align:center;font-size:20px;font-weight:800;margin:18px 0 20px;letter-spacing:1px}
.phieu-row{display:flex;gap:18px;margin:8px 0;flex-wrap:wrap}
.phieu-row .cell{flex:1;min-width:200px}
.phieu-row .lbl{color:#333}
.phieu-sign{display:flex;margin:22px 0;border:1px solid #000;flex-wrap:wrap}
.phieu-sign .box{flex:1;text-align:center;padding:8px 4px 55px;border-left:1px solid #000;font-size:11px;font-weight:700;min-width:0}
.phieu-sign .box:first-child{border-left:none}
.phieu-money{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.phieu-money th,.phieu-money td{border:1px solid #000;padding:9px 8px;text-align:center}
.phieu-words{margin:10px 0;word-break:break-word}
.phieu-foot{display:flex;justify-content:flex-end;gap:60px;margin-top:18px;text-align:center;font-size:13px;flex-wrap:wrap}
.phieu-modal-body{max-height:70vh;overflow-y:auto;overflow-x:hidden}
.phieu-tbl{width:100%;border-collapse:collapse;margin:6px 0;font-size:14px}
.phieu-tbl td{padding:5px 6px;vertical-align:top}
.phieu-sign6{display:grid;grid-template-columns:repeat(6,1fr);text-align:center;font-size:12.5px;margin:8px 0;min-height:64px}
.phieu-sign6 div{padding:4px 2px;min-width:0;word-break:break-word}
.phieu-sec{margin:8px 0 2px;font-size:14px}
.phieu-line{font-size:13.5px;margin:2px 0;word-break:break-word}
.phieu-blank{min-height:26px;border-bottom:1px dotted #999;margin:2px 0}
.phieu-sign2{display:flex;justify-content:space-between;margin:10px 0;font-size:14px;flex-wrap:wrap;gap:10px}
.phieu-note{text-align:center;font-weight:800;font-size:13px;margin:12px 0 4px}
@media(max-width:1100px){.g7{grid-template-columns:repeat(4,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .grid.g2,.grid.g3{grid-template-columns:1fr!important}
  .proj-pick .inp{max-width:130px!important;font-size:12px!important;padding:6px 8px!important}
  .proj-pick span{display:none!important}

 data:null,
 load(){try{const raw=localStorage.getItem(DBKEY);this.data=raw?JSON.parse(raw):JSON.parse(JSON.stringify(SEED));}catch(e){this.data=JSON.parse(JSON.stringify(SEED));}},

const SESSION_KEY='twpro_session_v1';
function saveSession(){
  try{
    if(!Auth || !Auth.user || !Auth.user.id || !Auth.user.role){localStorage.removeItem(SESSION_KEY);return false;}
    const u=Auth.user;
    localStorage.setItem(SESSION_KEY,JSON.stringify({
      user:{id:u.id||'',name:u.name||'',role:u.role||'',projectIds:Array.isArray(u.projectIds)?u.projectIds:[]},
      savedAt:Date.now()
    }));
    return true;
  }catch(e){console.warn('Không thể lưu phiên đăng nhập trên thiết bị này.',e);return false;}
}
function restoreSession(){
  try{
    const raw=localStorage.getItem(SESSION_KEY);
    if(!raw)return false;
    const parsed=JSON.parse(raw);
    const saved=parsed&&parsed.user;
    if(!saved || !saved.id || !saved.role){localStorage.removeItem(SESSION_KEY);return false;}
    const localUser=(DB.data.users||[]).find(x=>String(x.id)===String(saved.id));
    Auth.user={
      id:saved.id,
      name:(localUser&&localUser.name)||saved.name||saved.id,
      role:(localUser&&localUser.role)||saved.role,
      projectIds:Array.isArray(localUser&&localUser.projectIds)?localUser.projectIds:(Array.isArray(saved.projectIds)?saved.projectIds:[])
    };
    return true;
  }catch(e){try{localStorage.removeItem(SESSION_KEY);}catch(_){}return false;}
}
function clearSession(){try{localStorage.removeItem(SESSION_KEY);}catch(e){}}

Auth.can=function(perm){
 if(!this.user)return false;
 const u=DB.data.users.find(x=>String(x.id)===String(this.user.id));
 const role=(u&&u.role)||this.user.role||'';
 if(role==='Giám đốc')return true;
 if(u&&u.perms&&perm in u.perms)return !!u.perms[perm];
 const rp=ROLE_PERMS[role];
 if(rp==='*')return true;
 return Array.isArray(rp)&&rp.includes(perm);
};
Auth.assignedProjects=function(){
 if(!this.user)return [];
 const u=DB.data.users.find(x=>String(x.id)===String(this.user.id));
 if(!u)return null;
 if(u.role==='Giám đốc')return null;
 const ids=u.projectIds||[];
 if(!ids.length||ids.includes('*'))return null;
 return ids.filter(id=>DB.data.projects.some(p=>p.id===id));
};
function visibleProjects(){const ap=Auth.assignedProjects();return ap?DB.data.projects.filter(p=>ap.includes(p.id)):DB.data.projects;}
function doLogin(){
 const u=$('#lgUser').value.trim(),pw=$('#lgPass').value;
 if(!u||!pw){$('#lgErr').style.display='block';$('#lgErr').textContent='Nhập tên đăng nhập và mật khẩu.';return;}
 try{
   const usr=DB.data.users.find(x=>String(x.username||'').toLowerCase()===u.toLowerCase());
   if(usr && usr.pass===pw){
     Auth.user={id:usr.id,name:usr.name||usr.username||'Người dùng',role:usr.role,projectIds:usr.projectIds||[]};
     try{DB.log('Đăng nhập','Đăng nhập hệ thống');}catch(e){}
     try{saveSession();}catch(e){}
     enterApp();
     if(CFG && CFG.apiUrl) pullAll(true).catch(()=>{});
     return;
   }
 }catch(e){}
 if(typeof CFG!=='undefined' && CFG.apiUrl){
  apiCall('login',{username:u,pass:pw}).then(r=>{
   if(r&&r.user){Auth.user={id:r.user.id,name:r.user.name||r.user.ho_ten||r.user.id,role:r.user.role||r.user.vai_tro,projectIds:r.user.projectIds||(r.user.du_an?[r.user.du_an]:[])};DB.log('Đăng nhập','qua server');saveSession();enterApp();pullAll(true).catch(()=>{});}
   else{$('#lgErr').style.display='block';$('#lgErr').textContent='Sai tên đăng nhập hoặc mật khẩu.';}
  }).catch(()=>{
   $('#lgErr').style.display='block';$('#lgErr').textContent='Sai tên đăng nhập hoặc mật khẩu.';
  });
  return;
 }
 $('#lgErr').style.display='block';$('#lgErr').textContent='Sai tên đăng nhập hoặc mật khẩu.';
}

function hbarChart(data,color){
 const max=Math.max(...data.map(d=>d.value),1);
 return '<div style="display:flex;flex-direction:column;gap:10px">'+data.map(d=>'<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>'+esc(d.label)+'</span><b>'+fmtVND(d.value)+'</b></div><div class="prog"><i style="width:'+Math.round(100*d.value/max)+'%;background:'+color+'"></i></div></div>').join('')+'</div>';
}
function donutChart(data){
 const total=data.reduce((s,d)=>s+d.value,0)||1;let acc=0;
 const segs=data.map(d=>{const p=d.value/total;const s='<circle cx="80" cy="80" r="56" fill="none" stroke="'+d.color+'" stroke-width="26" stroke-dasharray="'+(p*351.8).toFixed(1)+' 351.8" stroke-dashoffset="'+(-acc*351.8).toFixed(1)+'" transform="rotate(-90 80 80)"/>';acc+=p;return s;}).join('');
 return '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg width="160" height="160" viewBox="0 0 160 160">'+segs+'<text x="80" y="76" text-anchor="middle" font-size="13" fill="#8a7f70">Tổng</text><text x="80" y="98" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1410">'+fmtVND(total)+'</text></svg><div style="display:flex;flex-direction:column;gap:8px;font-size:12.5px">'+data.map(d=>'<div style="display:flex;align-items:center;gap:8px"><span style="width:12px;height:12px;border-radius:3px;background:'+d.color+'"></span>'+esc(d.label)+'<b style="margin-left:auto">'+Math.round(100*d.value/total)+'%</b></div>').join('')+'</div></div>';
}
function runLedger(rows,inKey,outKey){
 let b=0;return rows.slice().sort((a,c)=>a.date<c.date?-1:1).map(r=>{b+=(r[inKey]||0)-(r[outKey]||0);return Object.assign({},r,{balance:b});});
}
function projectSpent(pid){
 let s=0;
 DB.data.vendorTx.filter(t=>t.projectId===pid&&t.type==='payment').forEach(t=>s+=(+t.amount||0));
 DB.data.contractorTx.filter(t=>t.projectId===pid&&t.type==='payment').forEach(t=>s+=(+t.amount||0));
 DB.data.expenses.filter(t=>t.projectId===pid).forEach(t=>s+=(+t.amount||0));
 return s;
}
function projectLiab(pid){
 const vd=dueOf(DB.data.vendorTx.filter(t=>t.projectId===pid),'purchase','payment');
 const kd=dueOf(DB.data.contractorTx.filter(t=>t.projectId===pid),'entry','payment');
 const ed=0;
 const md=0;
 return {vendor:vd,contractor:kd,salary:ed,machine:md,total:vd+kd+ed+md};
}
function dueOf(rows,inT,outT){const i=rows.filter(r=>r.type===inT).reduce((s,r)=>s+(+r.amount||0),0);const o=rows.filter(r=>r.type===outT).reduce((s,r)=>s+(+r.amount||0),0);return Math.max(0,i-o);}
function projectRecv(pid){return dueOf(DB.data.clientTx.filter(t=>t.projectId===pid),'billed','received');}

function userPerms(u){

 const base={};PERMS.forEach(g=>g.items.forEach(it=>base[it.k]=false));

 if(rp==='*')Object.keys(base).forEach(k=>base[k]=true);
 else if(Array.isArray(rp))rp.forEach(k=>{if(k in base)base[k]=true;});
 if(u.perms)Object.keys(u.perms).forEach(k=>{if(k in base)base[k]=!!u.perms[k];});
 return base;
}

function docSoTien(n){
 n=Math.round(n||0);if(n===0)return 'Không đồng';
 const dv=['','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
 function d3(x){let t=Math.floor(x/100),c=Math.floor(x%100/10),u=x%10,s='';
  if(t)s+=dv[t]+' trăm'+(c===0&&u?' linh':'');
  if(c){s+=(s?' ':'')+(c===1?'mười':dv[c]+' mươi');if(u===1)s+=' một';else if(u===5)s+=' lăm';else if(u)s+=' '+dv[u];}
  else if(u&&t)s+=' '+dv[u];return s;}
 let ty=Math.floor(n/1e9),tr=Math.floor(n%1e9/1e6),ng=Math.floor(n%1e6/1e3),d=n%1e3,p=[];
 if(ty)p.push(d3(ty)+' tỷ');if(tr)p.push(d3(tr)+' triệu');if(ng)p.push(d3(ng)+' nghìn');if(d||!p.length)p.push(d3(d));
 const s=p.join(' ');return s.charAt(0).toUpperCase()+s.slice(1)+' đồng';
}

function xlsxDownload(sheets,filename){
  const makeAndDownload=(logoData)=>{
  const data=xlsxMake(sheets,logoData||null);
  const blob=new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
  };
  try{
    if(typeof TW_LOGO==='string'&&TW_LOGO.indexOf('base64,')>0){makeAndDownload(TW_LOGO);return;}
    if(typeof TW_LOGO==='string'&&TW_LOGO){const im=new Image();im.onload=()=>{try{const cv=document.createElement('canvas');cv.width=im.naturalWidth||im.width;cv.height=im.naturalHeight||im.height;cv.getContext('2d').drawImage(im,0,0);makeAndDownload(cv.toDataURL('image/png'));}catch(e){makeAndDownload(null);}};im.onerror=()=>makeAndDownload(null);im.src=TW_LOGO;return;}
  }catch(e){}
  makeAndDownload(null);
}

function xlsTable(title,headers,rows,foot){

 h+='<h3>'+esc(title)+'</h3><table border="1"><thead><tr>'+headers.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';

function xlsxColL(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
function dlXlsxTable(title,headers,rows,foot,filename){
 const R=[];const n=headers.length;
 const rc=new Array(n).fill(null);rc[1]={v:'CÔNG TY TNHH KIẾN TRÚC XÂY DỰNG THE WALL',s:2};R.push(rc);
 const ra=new Array(n).fill(null);ra[1]={v:'Địa chỉ: 1086/4 Nguyễn Duy Trinh, P. Long Trường, TPHCM, Việt Nam',s:3};R.push(ra);
 const rt=new Array(n).fill(null);rt[1]={v:'Điện thoại: +848 3535 1905 - 0903 865 240',s:3};R.push(rt);
 const rw=new Array(n).fill(null);rw[1]={v:'Website: www.thewall.com.vn',s:3};R.push(rw);
 R.push(new Array(n).fill(null));R.push(new Array(n).fill(null));R.push(new Array(n).fill(null));
 const rti=new Array(n).fill(null);rti[0]={v:title.toUpperCase(),s:11};R.push(rti);
 const rnx=new Array(n).fill(null);rnx[0]={v:'Ngày xuất: '+new Date().toLocaleDateString('vi-VN'),s:3};R.push(rnx);
 const rh=new Array(n).fill(null);headers.forEach((h,i)=>{rh[i]={v:String(h).toUpperCase(),s:10};});R.push(rh);
 rows.forEach(row=>{const r=new Array(n).fill(null);row.forEach((v,i)=>{if(v==null||v==='')return;r[i]={v:(typeof v==='number'?v:String(v)),s:(typeof v==='number'?8:6)};});R.push(r);});
 if(foot){const rf=new Array(n).fill(null);if(typeof foot==='object'&&foot.total!=null){for(let i=0;i<n;i++)rf[i]={v:'',s:10};rf[n-2]={v:'Tổng cộng',s:10};rf[n-1]={v:foot.total,s:10};}else{const clean=String(foot).replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();const parts=clean.split(':');if(parts.length>1){for(let i=0;i<n;i++)rf[i]={v:'',s:10};rf[n-2]={v:parts[0].trim(),s:10};rf[n-1]={v:parts.slice(1).join(':').trim(),s:10};}else{rf[0]={v:clean,s:2};}}R.push(rf);}
 const colL=xlsxColL(n);
 const merges=['B1:'+colL+'1','B2:'+colL+'2','B3:'+colL+'3','B4:'+colL+'4','A8:'+colL+'8','A9:'+colL+'9'];
 xlsxDownload([{name:'DeNghi',widths:[11,7,14,13,12,27,7,14,17].slice(0,n),rows:R,merges:merges}],filename);
 toast('Đã xuất Excel (.xlsx)');
}

const SYNC_MAP={projects:'DuAn',denghi:'DeNghi',phatsinh:'PhatSinh',dutru:'DuTu',thanhtoan:'ThanhToan',tamung:'TamUng',vendors:'NCC',vendorTx:'NCC_GD',contractors:'NhaThau',contractorTx:'NT_GD',bankAccounts:'Quy',bankTx:'Quy_GD',expenses:'ChiPhi',users:'Users',auditLogs:'LichSu',danhmuc:'DanhMuc',clients:'ChuDauTu',clientTx:'CDT_GD'};
let SYNC={connected:false,dirty:false,msg:'Chưa cấu hình'};
async function apiCall(action,params){
 if(!CFG.apiUrl)throw new Error('Chưa cấu hình API URL');
 const r=await fetch(CFG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action:action,key:CFG.key||''},params||{}))});
 const j=await r.json();if(j&&j.error)throw new Error(j.error);return j;
}
let pushTimer=null;
function markDirty(){SYNC.dirty=true;renderSyncPill();schedulePush();}
function schedulePush(){
 if(!CFG.apiUrl)return;
 clearTimeout(pushTimer);
 pushTimer=setTimeout(()=>{pushAll(true).catch(()=>{});},4000);
}
function renderSyncPill(){
 const el=$('#syncPill');if(!el)return;
 if(!CFG.apiUrl){el.innerHTML='<span class="badge b-gray">Chưa cấu hình API</span>';return;}
 if(SYNC.dirty){el.innerHTML='<span class="badge b-amber">Chưa đồng bộ</span>';return;}
 el.innerHTML='<span class="badge b-green">Đã đồng bộ</span>'+(SYNC.msg?' <span style="font-size:11px;color:var(--mut)">'+esc(SYNC.msg)+'</span>':'');
}
async function pullAll(silent){
 syncCfgForm();
 const d=await apiCall('pull',{});
 let n=0;
 Object.keys(SYNC_MAP).forEach(k=>{const sh=SYNC_MAP[k];if(!(d[sh]&&Array.isArray(d[sh])))return;const rows=d[sh].map(o=>normMoney(k,CODE_FIELDS[k]?toCode(k,o):o));
  if(k==='users'){const byId=new Map(rows.map(u=>[String(u.id),u]));(DB.data.users||[]).forEach(u=>{if(!byId.has(String(u.id)))byId.set(String(u.id),u);});DB.data.users=[...byId.values()];}
  else DB.data[k]=rows;n++;});
 try{localStorage.setItem(DBKEY,JSON.stringify(DB.data));}catch(e){}
 SYNC.dirty=false;SYNC.connected=true;SYNC.msg='Lúc '+new Date().toLocaleTimeString('vi-VN');
 renderSyncPill();if(!silent)toast('Đã tải '+n+' bảng từ server');
 nav(false);
}
async function pushAll(silent){
 syncCfgForm();

 for(const k of Object.keys(SYNC_MAP)){await apiCall('push',{sheet:SYNC_MAP[k],rows:(DB.data[k]||[]).map(o=>toVI(k,o))});n++;}
 SYNC.dirty=false;SYNC.connected=true;SYNC.msg='Lúc '+new Date().toLocaleTimeString('vi-VN');
 renderSyncPill();if(!silent)toast('Đã đẩy '+n+' bảng lên server');

}

function tdEsc(v){return esc(v==null?'':String(v));}
function tdDate(v){const d=v?new Date(v+'T00:00:00'):null;return d&&!isNaN(d)?d:null;}
function tdDays(t){const a=tdDate(t.ngayBatDau),b=tdDate(t.ngayKetThuc);return a&&b?Math.max(1,Math.round((b-a)/86400000)+1):Math.max(1,+t.thoiLuong||1);}
function tdWeight(t){const w=+t.trongSo;return Number.isFinite(w)&&w>0?w:tdDays(t);}
function tdPct(t){return Math.max(0,Math.min(100,+t.phanTram||0));}
function tdPickPct(v){const el=document.getElementById('td_pct');if(el){el.value=v;tdSyncPctChips();}}
function tdSyncPctChips(){const el=document.getElementById('td_pct');if(!el)return;const v=+el.value||0;document.querySelectorAll('.td-pct-chip').forEach(c=>c.classList.toggle('active',+c.dataset.v===v));}
function tdPickTask(name){const el=document.getElementById('td_hm');if(el){el.value=name;el.focus();}}
function tdHmSelChange(init){var s=document.getElementById('td_hm_sel'),n=document.getElementById('td_hm');if(!s||!n)return;var v=s.value;if(v==='__new'){if(!init)n.value='';}else if(v){n.value=v;}n.style.display=(v&&v!=='__new')?'none':'';}
function tdStatus(t){if(tdPct(t)>=100)return'done';const end=tdDate(t.ngayKetThuc),start=tdDate(t.ngayBatDau),now=tdDate(todayISO());if(end&&now&&end<now)return'late';if(t.phuThuocId){const dep=(DB.data.tienDo||[]).find(x=>x.id===t.phuThuocId);if(dep&&tdPct(dep)<100)return'blocked';}if(start&&now&&start>now)return'upcoming';if(tdPct(t)>0)return'doing';return'todo';}
function tdStatusLabel(t){return({done:'Hoàn thành',late:'Trễ hạn',blocked:'Bị chặn',doing:'Đang thực hiện',upcoming:'Sắp bắt đầu',todo:'Chưa bắt đầu'})[tdStatus(t)];}
function tdTaskProgress(items){const valid=items||[];const total=valid.reduce((s,t)=>s+tdWeight(t),0);return total?Math.round(valid.reduce((s,t)=>s+tdPct(t)*tdWeight(t),0)/total):0;}
function tienDoProject(pid){return tdTaskProgress(tdItems(pid));}
function tienDoGiaiDoan(pid){const items=(DB.data.tienDo||[]).filter(t=>t.projectId===pid);const order=['chuanbi','ngam','tho','hoanthien','mep'];const names={chuanbi:'Chuẩn bị',ngam:'Phần ngầm',tho:'Phần thô',hoanthien:'Hoàn thiện',mep:'MEP & HT'};const active=order.find(g=>items.some(t=>(t.giaiDoan||'tho')===g&&tdPct(t)<100));return{avg:tienDoProject(pid),gd:active||'',gdl:active?names[active]:'Hoàn thành'};}
function tdViewSwitcher(cur){const views=[['#/tiendo','Dashboard'],['#/tiendo-list','Table'],['#/tiendo-kanban','Kanban'],['#/tiendo-gantt','Gantt'],['#/tiendo-calendar','Calendar'],['#/tiendo-split','Split']];return `<div class="td-view-switch noprint">${views.map(v=>`<button class="${cur===v[0]?'active':''}" onclick="location.hash='${v[0]}'">${v[1]}</button>`).join('')}</div>`;}
function tdPrintReport(){document.body.classList.add('printing-tiendo');window.print();}

function tdToolbar(extra=''){return `<div class="td-toolbar noprint">
<div class="td-date-range"><label>Từ <input id="tdFrom" type="date" value="${window._tdFrom||''}"></label><label>Đến <input id="tdTo" type="date" value="${window._tdTo||''}"></label><button class="btn btn-sec btn-sm" onclick="tdApplyRange()">Lọc ngày</button><button class="btn btn-ghost btn-sm" onclick="tdClearRange()">Xóa lọc</button></div>
<div class="td-tools"><div class="td-zoom"><span>🔍 Zoom</span><input type="range" min="60" max="100" step="10" value="${window._tdZoom||100}" oninput="setTdZoom(this.value)" aria-label="Thu phóng"><span id="tdZoomLb">${window._tdZoom||100}%</span><button class="btn btn-sec btn-sm" onclick="tdPrintReport()">🖨 In báo cáo</button></div><button class="btn btn-pri btn-sm" onclick="tienDoForm()">+ Hạng mục</button>${extra}</div>
</div>`;}
function tdApplyRange(){const a=document.getElementById('tdFrom')?.value||'',b=document.getElementById('tdTo')?.value||'';if(a&&b&&a>b){toast('Ngày bắt đầu phải trước hoặc bằng ngày kết thúc');return;}window._tdFrom=a;window._tdTo=b;const r=ROUTES[location.hash.split('/').length>2&&location.hash.startsWith('#/tiendo/')&&!['#/tiendo-list','#/tiendo-kanban','#/tiendo-gantt','#/tiendo-calendar','#/tiendo-split'].includes(location.hash)?'#/tiendo/:id':location.hash];if(r){if(location.hash.startsWith('#/tiendo/')&&!['#/tiendo-list','#/tiendo-kanban','#/tiendo-gantt','#/tiendo-calendar','#/tiendo-split'].includes(location.hash))r(location.hash.split('/')[2]);else r();}}
function tdClearRange(){window._tdFrom='';window._tdTo='';const a=document.getElementById('tdFrom'),b=document.getElementById('tdTo');if(a)a.value='';if(b)b.value='';tdApplyRange();}
function setTdZoom(v){window._tdZoom=+v;const lb=document.getElementById('tdZoomLb');if(lb)lb.textContent=v+'%';const sc=document.getElementById('tiendoScope');if(!sc)return;sc.className='';if(v!=100)sc.classList.add('zoom-'+v);}
function tdProject(pid){return(DB.data.projects||[]).find(p=>p.id===pid)||{};}
function tdItems(pid){return(DB.data.tienDo||[]).filter(t=>{if(pid&&t.projectId!==pid)return false;const from=window._tdFrom||'',to=window._tdTo||'';if(!from&&!to)return true;const a=t.ngayBatDau||'',b=t.ngayKetThuc||t.ngayBatDau||'';if(!a&&!b)return false;return (!from||b>=from)&&(!to||a<=to);});}
function tdDateRange(items){const ds=items.flatMap(t=>[tdDate(t.ngayBatDau),tdDate(t.ngayKetThuc)]).filter(Boolean);if(!ds.length){const n=new Date();return[new Date(n.getFullYear(),n.getMonth(),1),new Date(n.getFullYear(),n.getMonth()+2,0)];}let a=new Date(Math.min(...ds)),b=new Date(Math.max(...ds));a=new Date(a.getFullYear(),a.getMonth(),1);b=new Date(b.getFullYear(),b.getMonth()+1,0);return[a,b];}
function tdPhaseLabel(k){return({chuanbi:'Chuẩn bị',ngam:'Phần ngầm',tho:'Phần thô',hoanthien:'Hoàn thiện',mep:'MEP & HT'})[k]||'Khác';}
function tdPhaseOptions(selected){return[['chuanbi','Chuẩn bị'],['ngam','Phần ngầm'],['tho','Phần thô'],['hoanthien','Hoàn thiện'],['mep','MEP & HT']].map(x=>`<option value="${x[0]}" ${selected===x[0]?'selected':''}>${x[1]}</option>`).join('');}
function tdPrintHeader(title,project){const p=project||{};const hasProject=!!p.id;const period=(window._tdFrom||window._tdTo)?`${window._tdFrom?fmtDate(window._tdFrom):'Đầu kỳ'} → ${window._tdTo?fmtDate(window._tdTo):'Hiện tại'}`:'Toàn bộ thời gian';return `<div class="print-header"><div class="print-brand">THE WALL · PROJECT MANAGEMENT</div><h1>BÁO CÁO TIẾN ĐỘ DỰ ÁN — ${tdEsc(title)}</h1><div class="print-project-line"><b>Mã dự án:</b> ${tdEsc(hasProject?(p.code||'—'):'Tất cả dự án')} <span class="print-sep">|</span> <b>Tên dự án:</b> ${tdEsc(hasProject?(p.name||'—'):'Danh mục dự án')}</div><div class="meta"><span><b>Kỳ báo cáo:</b> ${tdEsc(period)}</span><span><b>Ngày in:</b> ${todayVN()}</span><span><b>Người in:</b> ${tdEsc(Auth.user&&Auth.user.name||'Chưa xác định')}</span><span><b>Số hạng mục:</b> ${(DB.data.tienDo||[]).filter(t=>!hasProject||t.projectId===p.id).length}</span></div></div>`;}
ROUTES['#/tiendo']=function(){const projs=(typeof visibleProjects==='function'?visibleProjects():DB.data.projects)||[];const all=tdItems();const items=all.filter(t=>projs.some(p=>p.id===t.projectId));const pct=tdTaskProgress(items);const late=items.filter(t=>tdStatus(t)==='late');let h=tdPrintHeader('TỔNG QUAN TIẾN ĐỘ THI CÔNG');h+=`<div class="page-head"><div><h1>Tiến độ dự án</h1><p>Theo dõi tiến độ có trọng số, mốc thời gian và hạng mục trễ hạn.</p></div></div>`+tdViewSwitcher('#/tiendo')+tdToolbar()+`<div id="tiendoScope"><div class="grid g4" style="margin:14px 0"><div class="stat"><div class="lb">Tiến độ danh mục</div><div class="vl">${pct}%</div></div><div class="stat"><div class="lb">Dự án theo dõi</div><div class="vl">${projs.length}</div></div><div class="stat"><div class="lb">Hạng mục đang làm</div><div class="vl">${items.filter(t=>tdStatus(t)==='doing').length}</div></div><div class="stat"><div class="lb">Hạng mục trễ</div><div class="vl" style="color:${late.length?'#dc2626':'inherit'}">${late.length}</div></div></div><div class="project-overview-grid">`;
let prow='';projs.forEach(p=>{const its=items.filter(t=>t.projectId===p.id);const pp=tdTaskProgress(its);const statuses=its.filter(t=>tdStatus(t)==='late').length;const range=its.length?`${fmtDate(its.map(t=>t.ngayBatDau).filter(Boolean).sort()[0])||'—'} → ${fmtDate(its.map(t=>t.ngayKetThuc).filter(Boolean).sort().slice(-1)[0])||'—'}`:`${fmtDate(p.start)||'—'} → ${fmtDate(p.end)||'—'}`;h+=`<div class="project-overview-card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div style="font-size:11px;color:#8b6b43;font-weight:800">${tdEsc(p.code||'')}</div><h3>${tdEsc(p.name)}</h3></div><strong style="font-size:22px;color:${statuses?'#c2410c':'#a16207'}">${pp}%</strong></div><div class="phase-bar" style="height:9px;margin:10px 0"><i style="width:${pp}%"></i></div><div style="font-size:11px;color:#64748b;display:flex;justify-content:space-between;gap:8px"><span>${its.length} hạng mục</span><span>${statuses?statuses+' trễ hạn':'Không có hạng mục trễ'}</span></div><div style="font-size:11px;color:#64748b;margin-top:5px">${range}</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-sm btn-sec" onclick="location.hash='#/tiendo/${p.id}'">Mở dự án</button><button class="btn btn-sm btn-pri" onclick="tienDoForm('${p.id}')">+ Hạng mục</button></div></div>`;prow+=`<tr><td><b>${tdEsc(p.code||'')}</b><br>${tdEsc(p.name)}</td><td class="num">${its.length}</td><td class="num">${statuses||'—'}</td><td><div class="prog"><i style="width:${pp}%"></i></div><b>${pp}%</b></td><td style="white-space:nowrap">${range}</td></tr>`;});if(!projs.length)h+='<div class="empty">Chưa có dự án được phân quyền.</div>';h+='</div><div class="print-only"><table class="tbl print-tbl"><thead><tr><th>Dự án</th><th class="num">Hạng mục</th><th class="num">Trễ hạn</th><th style="width:32%">Tiến độ</th><th>Thời gian</th></tr></thead><tbody>'+prow+'</tbody></table></div></div>';document.getElementById('view').innerHTML=h;};
ROUTES['#/tiendo-list']=function(){const projs=(typeof visibleProjects==='function'?visibleProjects():DB.data.projects)||[];const allowed=new Set(projs.map(p=>p.id));const items=tdItems().filter(t=>allowed.has(t.projectId)).sort((a,b)=>(a.ngayBatDau||'9999').localeCompare(b.ngayBatDau||'9999')||(a.giaiDoan||'').localeCompare(b.giaiDoan||''));let h=tdPrintHeader('DANH SÁCH HẠNG MỤC TIẾN ĐỘ')+`<div class="page-head"><div><h1>Danh sách hạng mục</h1><p>${items.length} hạng mục · tiến độ tổng hợp có trọng số theo thời lượng / trọng số nhập.</p></div></div>`+tdViewSwitcher('#/tiendo-list')+tdToolbar()+'<div id="tiendoScope"><div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Dự án</th><th>Giai đoạn</th><th>Hạng mục</th><th>Thời gian</th><th>Trọng số</th><th>Tiến độ</th><th>Trạng thái</th><th></th></tr></thead><tbody>';
items.forEach(t=>{const p=tdProject(t.projectId);const st=tdStatus(t);h+=`<tr><td><b>${tdEsc(p.code||'')}</b><div style="font-size:11px;color:#64748b">${tdEsc(p.name||'')}</div></td><td>${tdEsc(tdPhaseLabel(t.giaiDoan))}</td><td><b>${tdEsc(t.hangMuc)}</b>${t.phuThuocId?`<div style="font-size:10px;color:#64748b">Phụ thuộc: ${tdEsc((DB.data.tienDo||[]).find(x=>x.id===t.phuThuocId)?.hangMuc||'Không tìm thấy')}</div>`:''}</td><td style="white-space:nowrap;font-size:11px">${fmtDate(t.ngayBatDau)||'—'}<br>→ ${fmtDate(t.ngayKetThuc)||'—'}<div style="color:#64748b">${tdDays(t)} ngày</div></td><td>${tdWeight(t)}</td><td><div class="prog" style="width:95px"><i style="width:${tdPct(t)}%"></i></div><small>${tdPct(t)}%</small></td><td><span class="k-status ${st}">${tdStatusLabel(t)}</span></td><td><button class="btn btn-sm btn-sec" onclick="tienDoForm('${t.projectId}','${t.id}')">Sửa</button></td></tr>`;});if(!items.length)h+='<tr><td colspan="8" class="empty">Chưa có hạng mục tiến độ.</td></tr>';h+='</tbody></table></div></div></div>';document.getElementById('view').innerHTML=h;};
ROUTES['#/tiendo-kanban']=function(){const projects=(typeof visibleProjects==='function'?visibleProjects():DB.data.projects)||[];const allow=new Set(projects.map(p=>p.id));const items=tdItems().filter(t=>allow.has(t.projectId));const cols=[['todo','Chưa bắt đầu','#94a3b8'],['upcoming','Sắp bắt đầu','#64748b'],['blocked','Bị chặn','#7c3aed'],['doing','Đang thực hiện','#d97706'],['late','Trễ hạn','#dc2626'],['done','Hoàn thành','#16a34a']];let h=tdPrintHeader('KANBAN TIẾN ĐỘ')+`<div class="page-head"><div><h1>Bảng tiến độ Kanban</h1><p>Trạng thái được suy ra từ phần trăm thực hiện và ngày kế hoạch.</p></div></div>`+tdViewSwitcher('#/tiendo-kanban')+tdToolbar()+'<div id="tiendoScope"><div class="kanban">';cols.forEach(c=>{const list=items.filter(t=>tdStatus(t)===c[0]);h+=`<div class="kanban-col"><div class="kanban-col-header"><span class="kanban-col-title">${c[1]}</span><span class="cnt">${list.length}</span></div><div class="kanban-col-body">${list.map(t=>{const p=tdProject(t.projectId);return `<div class="kanban-item" style="--acc:${c[2]}" onclick="tienDoForm('${t.projectId}','${t.id}')"><div class="k-title">${tdEsc(t.hangMuc)}</div><div class="k-proj">${tdEsc(p.code||'')} · ${tdEsc(p.name||'')}</div><div class="k-bar"><i style="width:${tdPct(t)}%;background:${c[2]}"></i></div><div class="k-foot"><span>${tdPct(t)}%</span><span>${fmtDate(t.ngayKetThuc)||'Chưa có ngày'}</span></div></div>`;}).join('')||'<div style="font-size:11px;color:#94a3b8;padding:8px">Không có hạng mục</div>'}</div></div>`;});h+='</div></div>';document.getElementById('view').innerHTML=h;};

function ensureArrays(){
 let ch=false;
 Object.keys(SEED).forEach(k=>{if(!Array.isArray(DB.data[k])||(k==='danhmuc'&&DB.data[k].length===0)){DB.data[k]=JSON.parse(JSON.stringify(SEED[k]));ch=true;}});
 try{
  ['users','projects','vendors','contractors','vendorTx','contractorTx','bankAccounts','bankTx'].forEach(col=>{
    if(!Array.isArray(SEED[col])||!Array.isArray(DB.data[col])) return;
    const existing = new Set(DB.data[col].map(x=>x.id));
    SEED[col].forEach(item=>{
      if(!existing.has(item.id)){
        DB.data[col].push(JSON.parse(JSON.stringify(item)));
        ch=true;
      }
    });
  });
 }catch(e){}
 // Fix role cũ viết HOA (GIÁM ĐỐC → Giám đốc) + tên rỗng → tránh menu rỗng, session fail
 try{
  const ROLE_FIX={'GIÁM ĐỐC':'Giám đốc','KẾ TOÁN':'Kế toán','THỦ QUỸ':'Thủ Quỹ','QUẢN LÝ DỰ ÁN':'Quản Lý Dự Án','NHÂN VIÊN MUA HÀNG':'Nhân viên mua hàng','CHỈ HUY CÔNG TRÌNH':'Chỉ huy công trình'};
  (DB.data.users||[]).forEach(u=>{
   if(ROLE_FIX[u.role]){u.role=ROLE_FIX[u.role];ch=true;}
   if(u.id==='u1'&&!u.name){u.name='Lê Hà';ch=true;}
  });
 }catch(e){}
 try{
  const MAP={'dang_thi_cong':'Đang thi công','chuan_bi':'Chuẩn bị','hoan_thanh':'Hoàn thành','tam_dung':'Tạm dừng','da_huy':'Đã hủy'};
  if(Array.isArray(DB.data.projects)){
   DB.data.projects.forEach(p=>{
    if(MAP[p.status]){p.status=MAP[p.status]; ch=true;}
   });
  }
 }catch(e){}
 if(ch){try{localStorage.setItem(DBKEY,JSON.stringify(DB.data));}catch(e){}}
}

 t.value=d?new Intl.NumberFormat('vi-VN').format(+d):'';
 if(d){const fmt=t.value;let seen=0,idx=digitsBefore===0?0:fmt.length;

  try{t.setSelectionRange(idx,idx);}catch(_){}}
});

 const TARGET='select:not([multiple]):not([data-native-dropdown="true"])';
 let active=null;
 const escText=(v)=>String(v==null?'':v);
 function getState(sel){return sel.__twDropdown||null;}
 function position(st){
  if(!st||!st.menu.classList.contains('open'))return;
  const r=st.btn.getBoundingClientRect(), gap=5, pad=8;
  const below=window.innerHeight-r.bottom-pad, above=r.top-pad;
  const openUp=below<150&&above>below;
  const maxH=Math.max(100,Math.min(280,(openUp?above:below)-gap));
  st.menu.style.position='fixed';
  st.menu.style.left=Math.max(8,Math.min(r.left,window.innerWidth-r.width-8))+'px';
  st.menu.style.width=Math.min(r.width,window.innerWidth-16)+'px';
  st.menu.style.maxHeight=maxH+'px';
  st.menu.style.top=openUp?'auto':(r.bottom+gap)+'px';
  st.menu.style.bottom=openUp?(window.innerHeight-r.top+gap)+'px':'auto';
 }
 function close(st){
  st=st||active;if(!st)return;
  st.menu.classList.remove('open');st.btn.setAttribute('aria-expanded','false');
  st.menu.style.display='none';
  if(active===st)active=null;
 }
 function sync(sel){
  const st=getState(sel);if(!st)return;
  const opts=Array.from(sel.options||[]), chosen=opts.find(o=>o.value===sel.value)||opts[0];
  st.btn.textContent=chosen?chosen.textContent:'Choose…';
  const arrow=document.createElement('span');arrow.className='tw-select-chevron';arrow.setAttribute('aria-hidden','true');arrow.textContent='⌄';st.btn.appendChild(arrow);
  st.btn.disabled=!!sel.disabled;
  st.btn.setAttribute('aria-expanded',String(st.menu.classList.contains('open')));
  st.menu.replaceChildren();
  opts.forEach((o,i)=>{
   const b=document.createElement('button');b.type='button';b.className='tw-select-option'+(o.value===sel.value?' selected':'');
   b.setAttribute('role','option');b.setAttribute('aria-selected',String(o.value===sel.value));b.disabled=!!o.disabled;b.textContent=o.textContent;b.dataset.index=String(i);
   b.addEventListener('click',()=>{
    if(b.disabled)return;
    const next=sel.options[i];if(!next)return;
    const changed=sel.value!==next.value;sel.value=next.value;
    if(changed)sel.dispatchEvent(new Event('change',{bubbles:true}));
    sync(sel);close(st);st.btn.focus({preventScroll:true});
   });
   st.menu.appendChild(b);
  });
  if(st.menu.classList.contains('open'))position(st);
 }
 function enhance(sel){
  if(sel.dataset.twEnhanced==='1'||!sel.parentNode||sel.multiple)return;
  sel.dataset.twEnhanced='1';
  sel.classList.add('tw-native-select');
  sel.setAttribute('aria-hidden','true');
  sel.tabIndex=-1;
  const wrap=document.createElement('div');wrap.className='tw-select-wrap';
  sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);
  const btn=document.createElement('button');btn.type='button';btn.className='tw-select-trigger';btn.setAttribute('aria-haspopup','listbox');btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-label',sel.getAttribute('aria-label')||sel.name||'Select an option');
  const menu=document.createElement('div');menu.className='tw-select-menu';menu.setAttribute('role','listbox');menu.style.display='none';
  document.body.appendChild(menu);
  wrap.appendChild(btn);
  const st={sel,wrap,btn,menu};sel.__twDropdown=st;
  sel.addEventListener('change',()=>sync(sel));
  btn.addEventListener('click',()=>{
   if(sel.disabled)return;
   if(active&&active!==st)close(active);
   if(menu.classList.contains('open')){close(st);return;}
   active=st;sync(sel);menu.style.display='block';menu.classList.add('open');btn.setAttribute('aria-expanded','true');position(st);
  });
  btn.addEventListener('keydown',e=>{
   if(e.key==='ArrowDown'||e.key==='Enter'||e.key===' '){e.preventDefault();if(!menu.classList.contains('open'))btn.click();const cur=menu.querySelector('.tw-select-option.selected')||menu.querySelector('.tw-select-option:not(:disabled)');if(cur)cur.focus();}
  });
  menu.addEventListener('keydown',e=>{
   const items=Array.from(menu.querySelectorAll('.tw-select-option:not(:disabled)')),i=items.indexOf(document.activeElement);
   if(e.key==='Escape'){e.preventDefault();close(st);btn.focus();}
   else if(e.key==='ArrowDown'){e.preventDefault();items[Math.min(items.length-1,i+1)]?.focus();}
   else if(e.key==='ArrowUp'){e.preventDefault();items[Math.max(0,i-1)]?.focus();}
   else if(e.key==='Home'){e.preventDefault();items[0]?.focus();}
   else if(e.key==='End'){e.preventDefault();items[items.length-1]?.focus();}
  });
  sync(sel);
 }
 function scan(root){
  if(!root||!root.querySelectorAll)return;
  if(root.matches&&root.matches(TARGET))enhance(root);
  root.querySelectorAll(TARGET).forEach(enhance);
 }
 document.addEventListener('click',e=>{if(active&&!active.wrap.contains(e.target)&&!active.menu.contains(e.target))close(active);});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&active){const st=active;close(st);st.btn.focus();}});
 window.addEventListener('resize',()=>{if(active)position(active);});
 window.addEventListener('scroll',()=>{if(active)position(active);},true);
 const style=document.createElement('style');
 style.textContent=`
 .tw-select-wrap{position:relative;width:100%;min-width:0;display:block}
 .tw-select-wrap>select.tw-native-select{position:absolute!important;left:0!important;top:0!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important;margin:0!important;padding:0!important}
 .tw-select-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-width:0;min-height:34px;padding:6px 10px;border:1px solid #d9dfe8;border-radius:8px;background:#fff;color:#263244;font-family:inherit;font-size:13px;font-weight:500;line-height:1.3;text-align:left;white-space:nowrap;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.04);cursor:pointer;}
 .tw-select-trigger:before{content:none!important}.tw-select-trigger:after{content:none!important}
 .tw-select-trigger:not(:disabled):hover{border-color:#b8c3d3;background:#fbfcfe}
 .tw-select-trigger:focus-visible{outline:2px solid rgba(59,130,246,.35);outline-offset:1px;border-color:#6b91cf}
 .tw-select-trigger:disabled{opacity:.55;cursor:not-allowed}
 .tw-select-trigger:first-letter{min-width:0}
 .tw-select-chevron{flex:0 0 auto;color:#738096;font-size:15px;margin-left:6px}
 .tw-select-menu{z-index:2147483000;display:none;overflow:auto;padding:4px;background:#fff;border:1px solid #dbe2eb;border-radius:10px;box-shadow:0 12px 30px rgba(15,23,42,.18);overscroll-behavior:contain;}
 .tw-select-menu.open{display:block}
 .tw-select-option{display:block;width:100%;border:0;border-radius:6px;background:transparent;padding:7px 9px;text-align:left;font-family:inherit;font-size:13px;font-weight:400;line-height:1.35;color:#273449;white-space:normal;overflow-wrap:anywhere;cursor:pointer}
 .tw-select-option:hover,.tw-select-option:focus-visible{outline:none;background:#edf4ff;color:#174ea6}
 .tw-select-option.selected{background:#e8f0fe;color:#174ea6;font-weight:700}
 .tw-select-option:disabled{opacity:.4;cursor:not-allowed}
 .toolbar .tw-select-wrap{width:auto;min-width:120px;max-width:100%}
 .page-actions .tw-select-wrap{min-width:150px;max-width:280px}
 .proj-pick .tw-select-wrap{flex:1;min-width:0;max-width:280px}
 @media(max-width:700px){.tw-select-trigger{min-height:32px;padding:5px 8px;font-size:12px}.tw-select-option{padding:8px 9px;font-size:13px}.toolbar .tw-select-wrap{min-width:0;flex:1}}
 @media print{.tw-select-trigger,.tw-select-menu{display:none!important}}
 `;
 document.head.appendChild(style);
 scan(document);
 const mo=new MutationObserver(records=>records.forEach(r=>{
  if(r.target&&r.target.matches&&r.target.matches('select.tw-native-select'))sync(r.target);
  r.addedNodes.forEach(n=>{if(n.nodeType===1)scan(n);});
 }));
 mo.observe(document.body,{childList:true,subtree:true});
})();
</script>
