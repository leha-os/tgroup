<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wall — Quản lý Dự án Thi công</title>
<style>
:root{--bg:#faf7f2;--card:#ffffff;--ink:#1a1410;--mut:#8a7f70;--line:#ece5d8;--pri:#e8930c;--pri-d:#c97a08;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0891b2;--radius:12px;--sh:0 1px 3px rgba(26,20,16,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
a{color:var(--pri);text-decoration:none}
button{font-family:inherit;cursor:pointer}
/* ===== LOGIN ===== */
#loginView{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow-y:auto;background:radial-gradient(900px 480px at 50% -40px,#fffdf6 0%,#f7f1e3 55%,#ece1c8 100%);padding:24px 16px}
.login-card{margin:auto;background:#fff;border-radius:18px;padding:36px 32px;width:400px;max-width:100%;box-shadow:0 18px 50px rgba(140,95,10,.20);border:1px solid #ece1c8;border-top:5px solid #f0ad1f}
.login-card h1{font-size:22px;margin:14px 0 4px;color:#1a1410;text-align:center}
.login-card p.sub{color:#8a7f70;font-size:13px;margin-bottom:22px;text-align:center}
.login-card .btn-pri{padding:13px;font-size:15px;width:100%}
.logo-badge{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;font-weight:800}
/* ===== FORM ===== */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#374151}
.inp,select.inp,textarea.inp{width:100%;padding:10px 12px;border:1px solid #d4dae6;border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
.inp:focus{outline:2px solid #fbd38d;border-color:var(--pri)}
textarea.inp{resize:vertical;min-height:70px}
.frm-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frm-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:9px;border:1px solid transparent;font-size:14px;font-weight:600;transition:.15s}
.btn-pri{background:#f0ad1f;color:#1a1410}.btn-pri:hover{background:#d99a10;color:#fff}
.btn-sec{background:#fff;border-color:#d4dae6;color:var(--ink)}.btn-sec:hover{background:#f1f5f9}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{background:#15803d}
.btn-bad{background:#fee2e2;color:#b91c1c;border-color:#fecaca}.btn-bad:hover{background:#fecaca}
.btn-warn{background:#fef3c7;color:#92400e;border-color:#fde68a}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:7px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* ===== APP SHELL ===== */
#appView{display:none;height:100vh;overflow:hidden}
.shell{display:flex;height:100vh}
.sidebar{width:264px;flex-shrink:0;background:#1a1d29;color:#d6cfc2;display:flex;flex-direction:column;transition:.2s;z-index:50}
.sb-brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
.sb-brand img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
.sb-brand .t1{font-size:14px;font-weight:800;color:#f0ad1f;letter-spacing:.3px;line-height:1.3}
.sb-brand .t2{font-size:10.5px;color:#8a7f70;margin-top:2px}
.sb-proj{margin:10px 18px 0;padding:8px 10px;background:rgba(240,173,31,.12);border:1px solid rgba(240,173,31,.4);border-radius:8px;font-size:12px;color:#f0ad1f;font-weight:700;display:none}
.sb-nav{flex:1;overflow-y:auto;padding:10px 12px}
.sb-sec{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:#6e6257;text-transform:uppercase;padding:12px 10px 6px}
.sb-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#d6cfc2;font-size:13.5px;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.sb-link:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-link.active{background:#f0ad1f;color:#1a1410;font-weight:700}
.sb-link .ic{display:none}
.sb-link .cnt{margin-left:auto;background:rgba(255,255,255,.1);font-size:11px;padding:1px 8px;border-radius:20px}
.sb-link.active .cnt{background:rgba(0,0,0,.18)}
.sb-sub{margin:2px 0 4px 20px;border-left:2px solid rgba(255,255,255,.1);padding-left:4px}
.sb-sub .sb-link{font-size:13px;padding:7px 10px}
.sb-quick{margin:4px 12px 8px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border-radius:10px;font-weight:700;justify-content:center}
.sb-quick:hover{filter:brightness(1.08);color:#fff}
.sb-user{border-top:1px solid rgba(255,255,255,.08);padding:12px}
.sb-user .row{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:#f0ad1f;color:#1a1410;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.sb-user .nm{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .rl{font-size:11px;color:#8a7f70}
.sb-logout{margin-top:10px;width:100%;background:none;border:1px solid rgba(255,255,255,.15);color:#d6cfc2;border-radius:8px;padding:8px;font-size:13px}
.sb-logout:hover{background:rgba(255,255,255,.06)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px}
.topbar h2{font-size:13px;color:var(--mut);font-weight:600}
.burger{display:none;background:none;border:none;font-size:22px}
.proj-pick{display:flex;align-items:center;gap:8px;margin-left:auto}
.proj-pick select{padding:8px 12px;border:1px solid #d4dae6;border-radius:8px;font-size:13px;max-width:280px}
#view{flex:1;overflow-y:auto;padding:24px}
.footer{text-align:center;padding:14px;color:var(--mut);font-size:12px;border-top:1px solid var(--line);background:var(--card)}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:700}
.page-head p{color:var(--mut);font-size:13px;margin-top:4px}
.page-actions{display:flex;gap:10px;flex-wrap:wrap}
/* ===== CARDS / STATS ===== */
.grid{display:grid;gap:14px}
.g7{grid-template-columns:repeat(7,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-h h3{font-size:15px;font-weight:700}
.card-h .sub{font-size:12px;color:var(--mut);margin-top:2px}
.card-b{padding:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);padding:16px;display:flex;gap:12px;align-items:flex-start;border-top:3px solid var(--pri)}
.stat .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.stat .lb{font-size:12px;color:var(--mut);font-weight:600}
.stat .vl{font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;word-break:break-word}
.stat .ic{display:none}
.qentry .qe .ic{display:none}
.search .inp{padding-left:12px;width:260px}
.login-logo{display:block;margin:0 auto 8px;width:150px;height:auto;background:#fff;border-radius:14px;padding:8px}
@media(max-width:900px){
.topbar{flex-wrap:wrap;padding:10px 14px}
.proj-pick{margin-left:0;width:100%}
.proj-pick select{max-width:none;width:100%}
.stat .vl{font-size:16px}
.page-head h1{font-size:20px}
.tbl{font-size:12.5px}
.tbl th,.tbl td{padding:8px 10px}
.mback{padding:0;align-items:flex-end}
.modal{border-radius:16px 16px 0 0;width:100%;max-height:94vh;display:flex;flex-direction:column}
.m-body{overflow-y:auto}
.toolbar .search,.toolbar .search .inp{width:100%}
.qentry{grid-template-columns:repeat(2,1fr)}
.card-b{padding:14px}
.card-h{flex-wrap:wrap}
#view{padding:12px}
.stat{padding:12px}
.stat .vl{font-size:16px}
.btn{min-height:44px}
.inp,select.inp,textarea.inp{font-size:16px}
.tbl-wrap{margin:0 -14px;padding:0 14px}
.tbl{min-width:640px}
.kv{grid-template-columns:1fr;gap:2px}
.kv dt{font-size:11.5px}
.tabs{overflow-x:auto;white-space:nowrap}
.tab{flex-shrink:0}
.mback{padding:12px 0 0}
.modal{margin:auto auto 0}
.toast{left:16px;right:16px;bottom:16px}
.toast .t{text-align:center}
.topbar{gap:10px}
#syncPill{font-size:11px}
.login-card{padding:28px 22px}
.phieu-wrap{padding:22px 14px;margin:0}
.phieu-sign .box{padding:6px 2px 44px;font-size:10px}
.phieu-foot{gap:24px}
}
@media(max-width:480px){
.topbar h2{display:none}
.page-actions{width:100%}
.page-actions .btn{flex:1;justify-content:center}
.prog{min-width:0}
}
.st-info{border-top-color:var(--info)}.st-info .ic{background:#e0f2fe}
.st-warn{border-top-color:var(--warn)}.st-warn .ic{background:#fef3c7}
.st-bad{border-top-color:var(--bad)}.st-bad .ic{background:#fee2e2}
.st-ok{border-top-color:var(--ok)}.st-ok .ic{background:#dcfce7}
/* ===== TABLE ===== */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:10px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);background:#f8fafc;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#f8fafc}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.num{text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-green{background:#dcfce7;color:#166534}.b-amber{background:#fef3c7;color:#92400e}.b-red{background:#fee2e2;color:#991b1b}.b-blue{background:#dbeafe;color:#1e40af}.b-gray{background:#f1f5f9;color:#475569}.b-purple{background:#ede9fe;color:#5b21b6}
.linklike{background:none;border:none;color:var(--pri);font-weight:600;font-size:13.5px;padding:0}
.linklike:hover{text-decoration:underline}
.rowbtns{display:flex;gap:6px;justify-content:flex-end}
.iconbtn{background:#f1f5f9;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:13px}
.iconbtn:hover{background:#e2e8f0}
/* ===== MODAL ===== */
.mback{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:30px 16px;overflow-y:auto}
.mback.open{display:flex}
.modal{background:#fff;border-radius:14px;width:560px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease-out}
.modal.lg{width:760px}
@keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}}
.m-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.m-head h3{font-size:16px;font-weight:700}
.m-x{background:none;border:none;font-size:20px;color:var(--mut);line-height:1}
.m-body{padding:22px}
.m-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
/* ===== MISC ===== */
.toast{position:fixed;bottom:24px;right:24px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast .t{background:#0f1b33;color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s}
.kv{display:grid;grid-template-columns:180px 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--mut);font-weight:600}.kv dd{font-weight:600}
.alert{padding:12px 16px;border-radius:9px;font-size:13.5px;margin-bottom:16px}
.alert-red{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.alert-amber{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert-blue{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .inp,.toolbar select.inp{width:auto}
.search{position:relative}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .big{font-size:40px;margin-bottom:8px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--mut);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--pri);border-bottom-color:var(--pri)}
.prog{height:8px;background:#eef2f7;border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:6px;background:var(--ok)}
.prog.over i{background:var(--bad)}
.ledger-in{color:var(--ok);font-weight:700}.ledger-out{color:var(--bad);font-weight:700}
.qentry{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.qentry .qe{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 12px;text-align:center;cursor:pointer;transition:.15s}
.qentry .qe:hover{border-color:var(--pri);box-shadow:var(--sh);transform:translateY(-2px)}
.qentry .qe .ic{font-size:30px;margin-bottom:8px}
.qentry .qe .t{font-size:13px;font-weight:700}
@media(max-width:1100px){.g7{grid-template-columns:repeat(4,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
.sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}
.sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
.burger{display:block}
.g7,.g4,.g3{grid-template-columns:repeat(2,1fr)}
.g2{grid-template-columns:1fr}
#view{padding:14px}
.frm-row,.frm-row3{grid-template-columns:1fr}
}
/* ===== PHIẾU DNTT (y bản cũ) ===== */
.phieu-wrap{max-width:820px;margin:24px auto;background:#fff;padding:32px 42px;border:1px solid #ddd;font-family:"Times New Roman",Arial,serif;color:#000;font-size:13px;line-height:1.5}
.phieu-head{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid #000;padding-bottom:10px;margin-bottom:6px}
.phieu-head .logo{width:70px;height:70px;flex-shrink:0;object-fit:contain}
.phieu-head .co{font-size:12.5px;line-height:1.5}
.phieu-title{text-align:center;font-size:20px;font-weight:800;margin:18px 0 20px;letter-spacing:1px}
.phieu-row{display:flex;gap:18px;margin:8px 0;flex-wrap:wrap}
.phieu-row .cell{flex:1;min-width:200px}
.phieu-row .lbl{color:#333}
.phieu-sign{display:flex;margin:22px 0;border:1px solid #000}
.phieu-sign .box{flex:1;text-align:center;padding:8px 4px 55px;border-left:1px solid #000;font-size:11px;font-weight:700;min-width:0}
.phieu-sign .box:first-child{border-left:none}
.phieu-money{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.phieu-money th,.phieu-money td{border:1px solid #000;padding:9px 8px;text-align:center}
.phieu-words{margin:10px 0}
.phieu-foot{display:flex;justify-content:flex-end;gap:60px;margin-top:18px;text-align:center;font-size:13px}
.phieu-modal-body{max-height:70vh;overflow-y:auto}
body.printing-phieu .sidebar,body.printing-phieu .topbar,body.printing-phieu .m-head,body.printing-phieu .m-foot{display:none!important}
body.printing-phieu .mback{position:static;padding:0;background:none}
body.printing-phieu .modal{box-shadow:none;width:100%;max-width:100%}
body.printing-phieu .phieu-wrap{border:none;margin:0;max-width:100%}
@media print{
.sidebar,.topbar,.page-actions,.toolbar,.mback,.toast,.noprint{display:none!important}
#view{padding:0;overflow:visible}
.main{overflow:visible}
.card{box-shadow:none;break-inside:avoid}
body{background:#fff}
}
</style>
</head>
<body>
<!-- ============ LOGIN ============ -->
<div id="loginView">
  <div class="login-card">
    <img id="loginLogo" class="login-logo" alt="THE WALL">
    <h1 style="text-align:center">THE WALL ARCHITECTURE</h1>
    <div class="fld"><label>Tên đăng nhập</label><input class="inp" id="lgUser" placeholder="Tên đăng nhập"></div>
    <div class="fld"><label>Mật khẩu</label><input class="inp" id="lgPass" type="password" placeholder="Mật khẩu"></div>
    <div id="lgErr" class="alert alert-red" style="display:none"></div>
    <button class="btn btn-pri btn-block" onclick="doLogin()">Đăng nhập</button>
  </div>
</div>
<!-- ============ APP ============ -->
<div id="appView">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <button class="burger" onclick="document.getElementById('sidebar').classList.toggle('open')"></button>
        <h2>CÔNG TY TNHH TƯ VẤN THIẾT KẾ KIẾN TRÚC XÂY DỰNG BỨC TƯỜNG</h2>
        <div class="proj-pick noprint"><span style="font-size:12.5px;color:var(--mut);font-weight:600">Dự án:</span><select id="projPick" class="inp" onchange="setProject(this.value)"></select></div>
      </div>
      <div id="view"></div>
      <div class="footer">© 2026 Tgroup Ecosystem · WeWall Group | Le Ha<br>Hệ thống Quản lý Dự án Nội bộ v1.0.0</div>
    </div>
  </div>
</div>
<div class="mback" id="mback"><div class="modal" id="modal">
  <div class="m-head"><h3 id="mTitle"></h3><button class="m-x" onclick="closeModal()"></button></div>
  <div class="m-body" id="mBody"></div>
  <div class="m-foot" id="mFoot"></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
/* =====================================================================
   THE WALL — Quản lý tài chính công trình xây dựng
   (bản Việt của Project Ledger Pro)
   Single-file app. Dữ liệu demo lưu localStorage, sẵn sàng gắn backend.

/* ================= CHARTS (SVG thuần, không lib) ================= */
function hbarChart(data,color){ // data:[{label,value}]
 const max=Math.max(...data.map(d=>d.value),1);
 return '<div style="display:flex;flex-direction:column;gap:10px">'+data.map(d=>'<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>'+esc(d.label)+'</span><b>'+fmtVND(d.value)+'</b></div><div class="prog"><i style="width:'+Math.round(100*d.value/max)+'%;background:'+color+'"></i></div></div>').join('')+'</div>';
}
function donutChart(data){ // data:[{label,value,color}]
 const total=data.reduce((s,d)=>s+d.value,0)||1;let acc=0;
 const segs=data.map(d=>{const p=d.value/total;const s='<circle cx="80" cy="80" r="56" fill="none" stroke="'+d.color+'" stroke-width="26" stroke-dasharray="'+(p*351.8).toFixed(1)+' 351.8" stroke-dashoffset="'+(-acc*351.8).toFixed(1)+'" transform="rotate(-90 80 80)"/>';acc+=p;return s;}).join('');
 return '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg width="160" height="160" viewBox="0 0 160 160">'+segs+'<text x="80" y="76" text-anchor="middle" font-size="13" fill="#8a7f70">Tổng</text><text x="80" y="98" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1410">'+fmtVND(total)+'</text></svg><div style="display:flex;flex-direction:column;gap:8px;font-size:12.5px">'+data.map(d=>'<div style="display:flex;align-items:center;gap:8px"><span style="width:12px;height:12px;border-radius:3px;background:'+d.color+'"></span>'+esc(d.label)+'<b style="margin-left:auto">'+Math.round(100*d.value/total)+'%</b></div>').join('')+'</div></div>';
}
/* ================= LEDGER ENGINE ================= */
function runLedger(rows,inKey,outKey){ // rows:[{date,desc,in,out}] -> [{...,balance}]
 let b=0;return rows.slice().sort((a,c)=>a.date<c.date?-1:1).map(r=>{b+=(r[inKey]||0)-(r[outKey]||0);return Object.assign({},r,{balance:b});});
}
/* chi tiêu 1 dự án = mua vật tư + chi phí + lương/ứng + thuê máy + trả NCC/nhà thầu... (dòng tiền ra thực tế) */
function projectSpent(pid){
 let s=0;
 DB.data.vendorTx.filter(t=>t.projectId===pid&&t.type==='payment').forEach(t=>s+=t.amount);
 DB.data.contractorTx.filter(t=>t.projectId===pid&&t.type==='payment').forEach(t=>s+=t.amount);
 DB.data.employeeTx.filter(t=>t.projectId===pid&&(t.type==='payment'||t.type==='advance')).forEach(t=>s+=t.amount);
 DB.data.machineTx.filter(t=>t.projectId===pid&&t.type==='payment').forEach(t=>s+=t.amount);
 DB.data.expenses.filter(t=>t.projectId===pid).forEach(t=>s+=t.amount);
 return s;
}
function projectLiab(pid){
 const vd=dueOf(DB.data.vendorTx.filter(t=>t.projectId===pid),'purchase','payment');
 const kd=dueOf(DB.data.contractorTx.filter(t=>t.projectId===pid),'entry','payment');
 const ed=dueOf(DB.data.employeeTx.filter(t=>t.projectId===pid),'accrual','payment')+DB.data.employeeTx.filter(t=>t.projectId===pid&&t.type==='advance').reduce((s,t)=>s+t.amount,0);
 const md=dueOf(DB.data.machineTx.filter(t=>t.projectId===pid),'usage','payment');
 return {vendor:vd,contractor:kd,salary:ed,machine:md,total:vd+kd+ed+md};
}
function dueOf(rows,inT,outT){const i=rows.filter(r=>r.type===inT).reduce((s,r)=>s+r.amount,0);const o=rows.filter(r=>r.type===outT).reduce((s,r)=>s+r.amount,0);return Math.max(0,i-o);}
function projectRecv(pid){ // phải thu = bán/NT - đã nhận
 return dueOf(DB.data.customerTx.filter(t=>t.projectId===pid),'sale','payment')+dueOf(DB.data.clientTx.filter(t=>t.projectId===pid),'billed','received');
}

function renderProjectLedger(pid){
 const p=DB.data.projects.find(x=>x.id===pid);if(!p){location.hash='#/projects';return;}
 const s=projectSpent(pid),l=projectLiab(pid),recv=projectRecv(pid),bal=p.budget-s;
 let h='<div class="page-head"><div><h1>Sổ cái: '+esc(p.code+' • '+p.name)+'</h1><p>'+esc(p.client||'')+' • '+fmtDate(p.start)+' → '+fmtDate(p.end)+' • '+statusBadge(p.status)+'</p></div><div class="page-actions"><button class="btn btn-sec" onclick="location.hash=\'#/projects\'">← Danh sách</button><button class="btn btn-sec" onclick="window.print()">In</button></div></div>';
 if(s>p.budget)h+='<div class="alert alert-red">Dự án đã <b>vượt ngân sách</b> '+(fmtVND(s-p.budget))+' ('+Math.round(100*s/p.budget)+'% ngân sách)</div>';
 const stat=(lb,vl,ic,cls)=>'<div class="stat '+cls+'"><div class="ic">'+ic+'</div><div><div class="lb">'+lb+'</div><div class="vl">'+vl+'</div></div></div>';
 h+='<div class="grid g4" style="margin-bottom:16px">'+stat('Ngân sách',fmtVND(p.budget),'','st-info')+stat('Đã chi',fmtVND(s),'','st-warn')+stat('Công nợ phải trả',fmtVND(l.total),'','st-bad')+stat('Còn lại',fmtVND(bal),'',bal<0?'st-bad':'st-ok')+'</div>';
 h+='<div class="grid g4" style="margin-bottom:16px">'+stat('Phải thu KH',fmtVND(recv),'','st-info')+stat('Nợ NCC',fmtVND(l.vendor),'','st-bad')+stat('Nợ nhà thầu',fmtVND(l.contractor),'','st-bad')+stat('Nợ lương + máy',fmtVND(l.salary+l.machine),'‍','st-warn')+'</div>';
 // dòng tiền
 const rows=[];
 DB.data.vendorTx.filter(t=>t.projectId===pid).forEach(t=>{const v=DB.data.vendors.find(x=>x.id===t.vendorId);rows.push({date:t.date,desc:'NCC '+((v&&v.name)||'')+' — '+t.note,in:t.type==='purchase'?t.amount:0,out:t.type==='payment'?t.amount:0});});
 DB.data.contractorTx.filter(t=>t.projectId===pid).forEach(t=>{const k=DB.data.contractors.find(x=>x.id===t.contractorId);rows.push({date:t.date,desc:'Nhà thầu '+((k&&k.name)||'')+' — '+t.note,in:t.type==='entry'?t.amount:0,out:t.type==='payment'?t.amount:0});});
 DB.data.employeeTx.filter(t=>t.projectId===pid).forEach(t=>{const e=DB.data.employees.find(x=>x.id===t.employeeId);rows.push({date:t.date,desc:'NV '+((e&&e.name)||'')+' — '+t.note,in:t.type==='accrual'?t.amount:0,out:(t.type==='payment'||t.type==='advance')?t.amount:0});});
 DB.data.machineTx.filter(t=>t.projectId===pid).forEach(t=>{const m=DB.data.machines.find(x=>x.id===t.machineId);rows.push({date:t.date,desc:'Máy '+((m&&m.name)||'')+' — '+t.note,in:t.type==='usage'?t.amount:0,out:t.type==='payment'?t.amount:0});});
 DB.data.customerTx.filter(t=>t.projectId===pid).forEach(t=>{rows.push({date:t.date,desc:'Khách hàng — '+t.note,in:t.type==='payment'?t.amount:0,out:0});});
 DB.data.clientTx.filter(t=>t.projectId===pid).forEach(t=>{rows.push({date:t.date,desc:'Chủ đầu tư — '+t.note,in:t.type==='received'?t.amount:0,out:0});});
 DB.data.expenses.filter(t=>t.projectId===pid).forEach(t=>{rows.push({date:t.date,desc:'Chi phí ['+t.category+'] — '+t.note,in:0,out:t.amount});});
 const led=runLedger(rows,'in','out');
 h+='<div class="card"><div class="card-h"><div><h3>Dòng tiền dự án</h3><div class="sub">Ghi tăng = phát sinh phải trả / Ghi giảm = tiền đã chi • Số dư = còn nợ ròng</div></div></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ngày</th><th>Diễn giải</th><th class="num">Phát sinh</th><th class="num">Đã chi/trả</th><th class="num">Số dư nợ</th></tr></thead><tbody>';
 if(!led.length)h+='<tr><td colspan="5"><div class="empty">Chưa có giao dịch</div></td></tr>';
 led.forEach(r=>{h+='<tr><td style="white-space:nowrap">'+fmtDate(r.date)+'</td><td>'+esc(r.desc)+'</td><td class="num ledger-in">'+(r.in?fmtVND(r.in):'—')+'</td><td class="num ledger-out">'+(r.out?fmtVND(r.out):'—')+'</td><td class="num"><b>'+fmtVND(r.balance)+'</b></td></tr>';});
 h+='</tbody></table></div></div>';
 $('#view').innerHTML=h;
}

function nav(rebuild){
 let h=location.hash||'#/dashboard';
 if(rebuild!==false)buildSidebar();
 const parts=h.split('/');
 let fn=ROUTES[h];
 if(!fn&&parts.length>=3){
  const id=parts.slice(2).join('/');
  if(parts[1]==='projects')fn=()=>renderProjectLedger(id);
  else if(parts[1]==='vendors')fn=()=>renderPartnerLedger(PCFG.vendors,id);
  else if(parts[1]==='customers')fn=()=>renderPartnerLedger(PCFG.customers,id);
  else if(parts[1]==='contractors')fn=()=>renderContractorLedger(id);
  else if(parts[1]==='employees')fn=()=>renderEmployeeLedger(id);
  else if(parts[1]==='machinery')fn=()=>renderMachineLedger(id);
  else if(parts[1]==='bank')fn=()=>renderBankLedger(id);
  else if(parts[1]==='clients')fn=()=>renderPartnerLedger(PCFG.clients,id);
  else if(parts[1]==='stock'&&parts[2]==='consumable')fn=()=>renderItemLedger(parts[3]);
  else if(parts[1]==='stock'&&parts[2]==='nonconsumable')fn=()=>renderNCItemLedger(parts[3]);
 }
 if(!fn)fn=ROUTES['#/dashboard'];
 $('#view').innerHTML='';fn();window.scrollTo(0,0);
}

 let h='<div class="page-head"><div><h1>Nhà thầu</h1><p>'+list.length+' đội khoán • khối lượng nghiệm thu và tạm ứng</p></div><div class="page-actions"><button class="btn btn-pri" onclick="contractorForm()">+ Thêm nhà thầu</button></div></div>';
 h+='<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Đội / Tổ</th><th>Dự án</th><th class="num">Khối lượng NT</th><th class="num">Đã tạm ứng</th><th class="num">Còn phải trả</th><th></th></tr></thead><tbody>';
 list.forEach(o=>{const txs=DB.data.contractorTx.filter(t=>t.contractorId===o.id);
  const inn=txs.filter(t=>t.type==='entry').reduce((s,t)=>s+t.amount,0),out=txs.filter(t=>t.type==='payment').reduce((s,t)=>s+t.amount,0),due=Math.max(0,inn-out);
  h+='<tr><td><a class="linklike" href="#/contractors/'+o.id+'"><b>'+esc(o.name)+'</b></a><div style="font-size:11.5px;color:var(--mut)">'+esc(o.phone||'')+'</div></td><td>'+esc(projCode(o.projectId))+'</td><td class="num">'+fmtVND(inn)+'</td><td class="num">'+fmtVND(out)+'</td><td class="num" style="font-weight:700;color:'+(due>0?'var(--bad)':'var(--ok)')+'">'+fmtVND(due)+'</td><td><div class="rowbtns"><button class="iconbtn" onclick="contractorTxForm(\''+o.id+'\')"></button><button class="iconbtn" onclick="contractorForm(\''+o.id+'\')"></button><button class="iconbtn" onclick="delObj(\'contractors\',\''+o.id+'\',\'Xóa '+esc(o.name)+'?\')"></button></div></td></tr>';});
 h+='</tbody></table></div></div>';$('#view').innerHTML=h;
};
function contractorForm(id){
 const o=id?DB.data.contractors.find(x=>x.id===id):{name:'',phone:'',note:'',projectId:SEL.projectId||''};
 const projs=Auth.isSM()?DB.data.projects.filter(p=>Auth.user.projectIds.includes(p.id)):DB.data.projects;
 openModal((id?'Sửa':'Thêm')+' nhà thầu',fld('Tên đội/tổ',inp('name',o.name))+'<div class="frm-row">'+fld('Điện thoại',inp('phone',o.phone))+fld('Dự án',sel('projectId',projs.map(p=>({v:p.id,t:p.code+' • '+p.name})),o.projectId))+'</div>'+fld('Ghi chú',txa('note',o.note)),
 '<button class="btn btn-sec" onclick="closeModal()">Hủy</button><button class="btn btn-pri" onclick="saveContractor(\''+(id||'')+'\')">Lưu</button>');
}
function saveContractor(id){const o={name:formVal('name'),phone:formVal('phone'),projectId:formVal('projectId'),note:formVal('note')};if(!o.name){toast('Nhập tên');return;}
 if(id)Object.assign(DB.data.contractors.find(x=>x.id===id),o);else DB.data.contractors.push(Object.assign({id:uid('k')},o));
 DB.log(id?'Sửa nhà thầu':'Thêm nhà thầu',o.name);DB.save();closeModal();nav(false);toast('Đã lưu');}
function contractorTxForm(oid){
 const o=DB.data.contractors.find(x=>x.id===oid);
 openModal('Ghi giao dịch — '+esc(o.name),fld('Loại',sel('type',[{v:'entry',t:'Nghiệm thu khối lượng'},{v:'payment',t:'Tạm ứng / Thanh toán'}],'entry'))+'<div class="frm-row">'+fld('Ngày',inp('date',todayISO(),'date'))+fld('Số tiền (VND)',inp('amount','','number','min="0"'))+'</div>'+fld('Diễn giải',txa('note','')),
 '<button class="btn btn-sec" onclick="closeModal()">Hủy</button><button class="btn btn-pri" onclick="saveContractorTx(\''+oid+'\')">Lưu</button>');
}
function saveContractorTx(oid){const o=DB.data.contractors.find(x=>x.id===oid);
 const t={id:uid('kt'),contractorId:oid,projectId:o.projectId||SEL.projectId||'',date:formVal('date')||todayISO(),type:formVal('type'),amount:+formVal('amount')||0,note:formVal('note')};
 if(!t.amount){toast('Nhập số tiền');return;}
 if(t.type==='payment'){const inn=DB.data.contractorTx.filter(x=>x.contractorId===oid&&x.type==='entry').reduce((s,x)=>s+x.amount,0);const out=DB.data.contractorTx.filter(x=>x.contractorId===oid&&x.type==='payment').reduce((s,x)=>s+x.amount,0);
  if(t.amount>(inn-out)){if(!confirm('Số tiền vượt khối lượng đã nghiệm thu ('+fmtVND(inn-out)+'). Vẫn ghi?'))return;}}
 DB.data.contractorTx.push(t);DB.log('Giao dịch nhà thầu',(t.type==='entry'?'Nghiệm thu ':'Tạm ứng ')+fmtVND(t.amount)+' — '+o.name);DB.save();closeModal();nav(false);toast('Đã ghi');}
function renderContractorLedger(id){
 const o=DB.data.contractors.find(x=>x.id===id);if(!o){location.hash='#/contractors';return;}
 const txs=DB.data.contractorTx.filter(t=>t.contractorId===id).map(t=>({date:t.date,desc:(t.type==='entry'?'Nghiệm thu: ':'Tạm ứng: ')+t.note,in:t.type==='entry'?t.amount:0,out:t.type==='payment'?t.amount:0,id:t.id}));
 const led=runLedger(txs,'in','out');const due=led.length?led[led.length-1].balance:0;
 let h='<div class="page-head"><div><h1>Sổ cái: '+esc(o.name)+'</h1><p>'+esc(projCode(o.projectId))+'</p></div><div class="page-actions"><button class="btn btn-sec" onclick="location.hash=\'#/contractors\'">← Danh sách</button><button class="btn btn-pri" onclick="contractorTxForm(\''+id+'\')">Ghi giao dịch</button><button class="btn btn-sec" onclick="window.print()">In</button></div></div>';
 h+='<div class="grid g3" style="margin-bottom:16px"><div class="stat st-info"><div class="ic"></div><div><div class="lb">Khối lượng nghiệm thu</div><div class="vl">'+fmtVND(txs.reduce((s,t)=>s+t.in,0))+'</div></div></div><div class="stat st-ok"><div class="ic"></div><div><div class="lb">Đã tạm ứng</div><div class="vl">'+fmtVND(txs.reduce((s,t)=>s+t.out,0))+'</div></div></div><div class="stat '+(due>0?'st-bad':'st-ok')+'"><div class="ic"></div><div><div class="lb">Còn phải trả</div><div class="vl">'+fmtVND(due)+'</div></div></div></div>';
 h+='<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ngày</th><th>Diễn giải</th><th class="num">Nghiệm thu</th><th class="num">Tạm ứng</th><th class="num">Còn lại</th><th></th></tr></thead><tbody>';
 led.forEach(r=>{h+='<tr><td style="white-space:nowrap">'+fmtDate(r.date)+'</td><td>'+esc(r.desc)+'</td><td class="num ledger-in">'+(r.in?fmtVND(r.in):'—')+'</td><td class="num ledger-out">'+(r.out?fmtVND(r.out):'—')+'</td><td class="num"><b>'+fmtVND(r.balance)+'</b></td><td><div class="rowbtns"><button class="iconbtn" onclick="delTx(\'contractorTx\',\''+r.id+'\')"></button></div></td></tr>';});
 h+='</tbody></table></div></div>';$('#view').innerHTML=h;
}

 h+='</tbody></table></div></div>';$('#view').innerHTML=h;
}

function saveDeNghi(id){
 const o={projectId:formVal('projectId'),date:formVal('date')||todayISO(),loai:formVal('loai'),hangmuc:formVal('hangmuc'),noidung:formVal('noidung'),soluong:+formVal('soluong')||0,dongia:+formVal('dongia')||0,ncc:formVal('ncc')};
 o.sotien=Math.round(o.soluong*o.dongia);
 if(!o.noidung||!o.sotien){toast('Nhập nội dung và đơn giá');return;}
 if(id){const d=DB.data.denghi.find(x=>x.id===id);if(d.trangthai!=='cho_duyet'){toast('Chỉ sửa được đề nghị chờ duyệt');return;}Object.assign(d,o);DB.log('Sửa đề nghị',o.noidung);}
 else{DB.data.denghi.push(Object.assign({id:uid('dn'),trangthai:'cho_duyet',nguoitao:Auth.user.name,nguoiduyet:'',lydo:''},o));DB.log('Tạo đề nghị','['+LOAI_DN[o.loai]+'] '+fmtVND(o.sotien)+' — '+o.noidung);}

function duyetDN(id,ok){
 const d=DB.data.denghi.find(x=>x.id===id);if(!d)return;
 let lydo='';

 d.trangthai=ok?'da_duyet':'tu_choi';d.nguoiduyet=Auth.user.name;d.lydo=lydo||'';
 DB.log(ok?'Duyệt đề nghị':'Từ chối đề nghị',fmtVND(d.sotien)+' — '+d.noidung+(lydo?' ('+lydo+')':''));
 DB.save();nav(false);toast(ok?'Đã duyệt':'Đã từ chối');
}

function docSoTien(n){
 n=Math.round(n||0);if(n===0)return 'Không đồng';
 const dv=['','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
 function d3(x){let t=Math.floor(x/100),c=Math.floor(x%100/10),u=x%10,s='';
  if(t)s+=dv[t]+' trăm'+(c===0&&u?' linh':'');
  if(c){s+=(s?' ':'')+(c===1?'mười':dv[c]+' mươi');if(u===1)s+=' một';else if(u===5)s+=' lăm';else if(u)s+=' '+dv[u];}
  else if(u&&t)s+=' '+dv[u];return s;}
 let ty=Math.floor(n/1e9),tr=Math.floor(n%1e9/1e6),ng=Math.floor(n%1e6/1e3),d=n%1e3,p=[];
 if(ty)p.push(d3(ty)+' tỷ');if(tr)p.push(d3(tr)+' triệu');if(ng)p.push(d3(ng)+' nghìn');if(d||!p.length)p.push(d3(d));
 const s=p.join(' ');return s.charAt(0).toUpperCase()+s.slice(1)+' đồng';
}

function dlXls(html,filename){
 const blob=new Blob(["\ufeff"+html],{type:'application/vnd.ms-excel;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function xlsTable(title,headers,rows,foot){
 let h='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body>';
 h+='<h3>'+esc(title)+'</h3><table border="1"><thead><tr>'+headers.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
 rows.forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+esc(c==null?'':c)+'</td>').join('')+'</tr>';});
 h+='</tbody></table>'+(foot?'<p>'+foot+'</p>':'')+'</body></html>';return h;
}

const SYNC_MAP={projects:'DuAn',denghi:'DeNghi',phatsinh:'PhatSinh',dutru:'DuTru',thanhtoan:'ThanhToan',tamung:'TamUng',vendors:'NCC',vendorTx:'NCC_GD',customers:'KhachHang',customerTx:'KH_GD',contractors:'NhaThau',contractorTx:'NT_GD',employees:'NhanVien',employeeTx:'NV_GD',machines:'MayMoc',machineTx:'May_GD',consumables:'VatTu',consumableTx:'Kho_GD',nonconsumables:'CCDC',nonconsumableTx:'CCDC_GD',bankAccounts:'Quy',bankTx:'Quy_GD',expenses:'ChiPhi',users:'Users',auditLogs:'LichSu',danhmuc:'DanhMuc',clients:'ChuDauTu',clientTx:'CDT_GD'};
let SYNC={connected:false,dirty:false,msg:'Chưa cấu hình'};
async function apiCall(action,params){
 if(!CFG.apiUrl)throw new Error('Chưa cấu hình API URL');
 const r=await fetch(CFG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action:action,key:CFG.key||''},params||{}))});
 const j=await r.json();if(j&&j.error)throw new Error(j.error);return j;
}
function markDirty(){SYNC.dirty=true;renderSyncPill();}
function renderSyncPill(){
 const el=$('#syncPill');if(!el)return;
 if(!CFG.apiUrl){el.innerHTML='<span class="badge b-gray">Chưa cấu hình API</span>';return;}
 if(SYNC.dirty){el.innerHTML='<span class="badge b-amber">Chưa đồng bộ</span>';return;}
 el.innerHTML='<span class="badge b-green">Đã đồng bộ</span>'+(SYNC.msg?' <span style="font-size:11px;color:var(--mut)">'+esc(SYNC.msg)+'</span>':'');
}
async function pullAll(silent){
 const d=await apiCall('pull',{});
 let n=0;
 Object.keys(SYNC_MAP).forEach(k=>{const sh=SYNC_MAP[k];if(d[sh]&&Array.isArray(d[sh])){DB.data[k]=d[sh];n++;}});
 DB.save0=1;try{localStorage.setItem(DBKEY,JSON.stringify(DB.data));}catch(e){}
 SYNC.dirty=false;SYNC.connected=true;SYNC.msg='Lúc '+new Date().toLocaleTimeString('vi-VN');
 renderSyncPill();if(!silent)toast('Đã tải '+n+' bảng từ server');
 nav(false);
}
async function pushAll(){
 let n=0;
 for(const k of Object.keys(SYNC_MAP)){await apiCall('push',{sheet:SYNC_MAP[k],rows:DB.data[k]||[]});n++;}
 SYNC.dirty=false;SYNC.connected=true;SYNC.msg='Lúc '+new Date().toLocaleTimeString('vi-VN');
 renderSyncPill();toast('Đã đẩy '+n+' bảng lên server');
 DB.log('Đồng bộ','Đẩy toàn bộ dữ liệu lên server');
}

 try{const d=await apiCall('ping',{});SYNC.connected=true;renderSyncPill();toast('Kết nối OK — '+(d.time||'server phản hồi'));return true;}
