<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f0ad1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Wall — Quản lý Dự án Thi công</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#f0ad1f; --gold-dark:#a87b12; --gold-bg:#fdf3dc;
  --bg:#eef1f5; --card:#fff; --text:#1f2937; --muted:#6b7280;
  --border:#e5e7eb; --red:#d92d20; --red-bg:#fef3f2;
  --green:#12805c; --green-bg:#ecfdf3; --amber:#b54708; --amber-bg:#fffaeb;
  --blue:#175cd3; --blue-bg:#eff8ff; --gray-bg:#f3f4f6;
  --sidebar:#1a1d29;
  /* Tông nâu-đen hiện đại */
  --head-bg:linear-gradient(135deg,#1a1410 0%,#2d2118 50%,#1a1410 100%);
  --head-accent:#f0ad1f;
  --tab-active:linear-gradient(135deg,#f0ad1f,#e09a0a);
}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.hidden{display:none!important}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit}

.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--sidebar);color:#cbd5e1;flex-shrink:0;padding:16px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .logo{padding:0 18px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.sidebar .logo img{width:40px;height:40px;border-radius:8px;background:#fff;padding:3px;object-fit:contain}
.sidebar .logo b{color:var(--gold);font-size:15px;display:block;line-height:1.2}
.sidebar .logo small{font-size:11px;color:#94a3b8}
/* Sidebar: chỉ hiện 1 dòng THE WALL ARCHITECTURE màu cam */
/* Mobile: hiện đủ 2 dòng */
@media(max-width:900px){
  .sidebar .logo .logo-sub{font-size:11px;color:#94a3b8}
}
.side-nav{display:flex;flex-direction:column;padding:0 10px}
.nav-label{font-size:10px;letter-spacing:1.5px;color:#64748b;padding:14px 10px 6px;font-weight:700;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:#cbd5e1;font-size:13.5px;cursor:pointer;border:none;background:none;text-align:left;width:100%;font-weight:500;transition:background .15s}
.nav-item .ic{width:22px;text-align:center;font-style:normal;font-size:15px;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--gold);color:#1b1b1b;font-weight:700}
.nav-item.active .ic{opacity:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;color:var(--text)}
.topbar h1{color:var(--text);font-size:17px;font-weight:800;letter-spacing:.3px}
.topbar .crumb{color:var(--muted);font-size:12px}
.topbar .logo-img{height:38px;width:auto}
/* Nút hamburger kiểu mới */
.menu-toggle{display:none;align-items:center;justify-content:center;width:40px;height:40px;border:none;background:none;color:var(--text);font-size:22px;cursor:pointer;flex-shrink:0}
@media(max-width:900px){.menu-toggle{display:flex}}
/* Brand trong topbar: chỉ hiện trên mobile */
.topbar-brand{display:none}
@media(max-width:900px){
  .topbar-brand{display:block;color:#fff;line-height:1.2;margin-right:auto}
  .topbar-brand b{font-size:14px;display:block;letter-spacing:.5px;color:var(--gold)}
  .topbar-brand small{font-size:10px;color:var(--gold);letter-spacing:1px}
}
.topbar h1{font-size:17px;font-weight:700}
.topbar .crumb{font-size:12.5px;color:var(--muted)}
.topbar .userbox{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1b1b1b;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.content{padding:22px 24px;flex:1}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;padding:10px 0}
  .sidebar .logo{padding:0 14px 12px}
  .side-nav{flex-direction:row;overflow-x:auto;padding:0 8px}
  .nav-label{display:none}
  .nav-item{white-space:nowrap;padding:8px 12px;font-size:13px}
  .nav-item .ic{display:none}
}

.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h2{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card .desc{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.grid{display:grid;gap:14px}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px}
/* Khung cảnh báo dashboard */
.alert-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.alert-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}.alert-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.alert-card .a-head{padding:10px 16px;color:#fff;font-weight:800;font-size:14px}
.alert-card.a-red .a-head{background:linear-gradient(120deg,#c0392b,#e05252)}
.alert-card.a-amber .a-head{background:linear-gradient(120deg,#c47b12,#f0ad1f)}
.alert-card.a-blue .a-head{background:linear-gradient(120deg,#155bb5,#2f80ed)}
.alert-card .a-body{padding:8px 16px;max-height:190px;overflow-y:auto}
.alert-card .a-row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed #eee;font-size:13px}
.alert-card .a-row:last-child{border-bottom:none}
.alert-card .a-empty{padding:12px 0;color:var(--muted);font-size:13px}
.alert-card .a-total{display:flex;justify-content:space-between;padding:8px 0;font-weight:700;border-top:2px solid var(--border)}
@media(max-width:900px){.alert-cards{grid-template-columns:1fr}}
.kpi .k-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.kpi .k-value{font-size:20px;font-weight:800;margin-top:4px;color:var(--text)}
.kpi .k-sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.k-red .k-value{color:var(--red)}
.kpi.k-green .k-value{color:var(--green)}
.kpi.k-blue .k-value{color:var(--blue)}
.kpi.k-gold .k-value{color:var(--gold-dark)}
.kpi.k-amber .k-value{color:var(--amber)}

.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
.tbl tbody tr[data-goto],.tbl tbody tr[data-ma]{cursor:pointer}
.tbl tbody tr[data-goto]:hover,.tbl tbody tr[data-ma]:hover{background:var(--gold-bg)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.tbl th{background:#f8fafc;text-align:left;padding:10px 12px;font-weight:700;color:#475569;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle}
.tbl tr:hover td{background:#fafbfc}
.tbl tr.row-alert td{background:var(--red-bg)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .actions{text-align:right;white-space:nowrap}
.tbl .muted{color:var(--muted);font-size:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn-primary{background:var(--gold);color:#1b1b1b}
.btn-primary:hover{background:var(--gold-dark);color:#fff}
.btn-ghost{background:#fff;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--gray-bg)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#b42318}
.btn-success{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.f-group{margin-bottom:12px}
.f-group label{display:block;font-weight:600;font-size:12.5px;margin-bottom:5px;color:#374151}
.f-group input,.f-group select,.f-group textarea{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,173,31,.2)}
.f-row{display:flex;gap:12px}
.f-row .f-group{flex:1}
@media(max-width:640px){.f-row{flex-direction:column}}

.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-green{background:var(--green-bg);color:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gray{background:var(--gray-bg);color:#475569}
.b-gold{background:var(--gold-bg);color:var(--gold-dark)}

.prog{height:8px;background:var(--gray-bg);border-radius:999px;overflow:hidden;flex:1;min-width:80px}
.prog > i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .3s}
.prog.red > i{background:var(--red)}
.prog.green > i{background:var(--green)}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;z-index:240;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:760px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-head{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:15.5px;font-weight:700}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1;padding:0 4px}
.modal-body{padding:20px 22px;max-height:65vh;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:250;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast-msg{background:#0f172a;color:#fff;padding:11px 20px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;animation:slideUp .25s}
.toast-msg.error{background:#b42318}
.toast-msg.success{background:#12805c}
.toast-msg.info{background:#175cd3}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.empty{padding:32px;text-align:center;color:var(--muted);font-size:13px}
.text-red{color:var(--red)!important;font-weight:700}
.text-green{color:var(--green)!important;font-weight:700}
.text-muted{color:var(--muted)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--gray-bg);padding:3px 10px;border-radius:999px;font-size:12px;color:#475569}
.chip.gold{background:var(--gold-bg);color:var(--gold-dark)}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--gold-dark);border-bottom-color:var(--gold)}

#printRoot{display:none}
.print-bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:12px 24px;display:flex;gap:8px;z-index:60}
.phieu-wrap{max-width:820px;margin:24px auto;background:#fff;padding:32px 42px;border:1px solid var(--border);font-family:"Times New Roman",Arial,sans-serif;color:#000;font-size:13px;line-height:1.5}
.phieu-head{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid #000;padding-bottom:10px;margin-bottom:6px}
.phieu-head .logo{width:70px;height:70px;flex-shrink:0;object-fit:contain}
.phieu-head .co{font-size:12.5px;line-height:1.5}
.phieu-head .co b{font-size:14px;display:block;text-transform:uppercase;margin-bottom:2px}
.phieu-title{text-align:center;font-size:20px;font-weight:800;margin:18px 0 20px;letter-spacing:1px}
.phieu-line{display:flex;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.phieu-line .cell{flex:1;min-width:180px}
.phieu-sign{display:flex;margin:22px 0;border:1px solid #000}
.phieu-sign .box{flex:1;text-align:center;padding:8px 4px 55px;border-left:1px solid #000;font-size:11px;font-weight:700;min-width:0}
.phieu-sign .box:first-child{border-left:none}
.phieu-bank{border:1px solid #000;padding:10px 14px;margin:12px 0;font-size:13px;line-height:1.85}
.phieu-bank .t{font-weight:800;margin-bottom:6px;text-transform:uppercase}
.phieu-money{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.phieu-money th,.phieu-money td{border:1px solid #000;padding:9px 8px;text-align:center}
.phieu-money th{background:#f2f4f7;font-size:12px}
.phieu-section{font-weight:800;margin-top:14px;font-size:13px}
.phieu-underline{border-bottom:1px dotted #333;height:22px;margin:4px 0 10px}
.phieu-note{text-align:center;font-weight:800;margin-top:22px;font-size:12px;text-transform:uppercase}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body.printing-phieu #modalRoot .modal-overlay{background:none;position:static;padding:0}
  body.printing-phieu #modalRoot .modal{box-shadow:none;width:100%;max-width:none}
  body.printing-phieu #modalRoot .modal-head,
  body.printing-phieu #modalRoot .modal-foot{display:none!important}
  body.printing-phieu #modalRoot .modal-body{max-height:none;overflow:visible;padding:0}
  body.printing-phieu .app,
  body.printing-phieu #toast,
  body.printing-phieu #offlineBanner,
  body.printing-phieu #printRoot{display:none!important}
  body:not(.printing-phieu)>*:not(#printRoot):not(#modalRoot){display:none!important}
  #printRoot{display:block!important}
  .print-bar{display:none!important}
  .phieu-wrap{max-width:none;margin:0;border:none;padding:0;font-size:12px}
  .phieu-modal-body .phieu-wrap{margin:0}
}
/* Modal phiếu in: rộng hơn modal thường */
.phieu-modal-body .phieu-wrap{margin:0 auto;max-width:100%}
.footer{text-align:center;padding:16px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);background:var(--bg);z-index:30}
/* Đảm bảo footer luôn dưới đáy */
html,body{height:100%}
.app{display:flex;min-height:100dvh}
.main{display:flex;flex-direction:column;flex:1;min-height:100dvh}
.content{flex:1 0 auto}
.footer{flex-shrink:0;margin-top:auto;text-align:center;padding:16px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);background:var(--bg)}

/* ========== MOBILE FIX (bổ sung) ========== */
@media(max-width:900px){
  /* Topbar gọn trên mobile: chỉ giữ nút menu + tiêu đề + avatar */
  .userbox #globalSearch{display:none}
  .userbox #userName, .userbox #userRole{display:none}
  .topbar{gap:8px;padding:10px 12px}
  .topbar h1{font-size:17px}
  .topbar .crumb{display:none}
  /* Đệm đáy tránh thanh điều hướng điện thoại che nội dung */
  .content{padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px))}
  .footer{padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px))}
  /* Nút hamburger */
  .menu-toggle{display:flex !important;align-items:center;justify-content:center;
    width:44px;height:44px;border:none;background:var(--gold);color:#1a1d29;
    border-radius:10px;font-size:20px;cursor:pointer;flex-shrink:0}
  .sidebar{position:fixed !important;left:0;top:0;bottom:0;z-index:200;width:270px !important;
    height:100vh !important;transform:translateX(-105%);transition:transform .25s ease;
    flex-direction:column !important;padding:16px 0 !important;box-shadow:8px 0 30px rgba(0,0,0,.25)}
  .sidebar.open{transform:translateX(0)}
  .side-nav{flex-direction:column !important;overflow-y:auto !important;padding:0 !important}
  .nav-label{display:block !important}
  .nav-item{white-space:normal !important;padding:11px 18px !important;font-size:14px !important}
  .nav-item .ic{display:inline-block !important}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:199}
  .sidebar-backdrop.show{display:block}
  .topbar{flex-wrap:wrap;gap:8px}
  .topbar h1{font-size:17px}
  /* Bảng cuộn ngang */
  .tbl{min-width:640px}
  .tbl th,.tbl td{padding:9px 10px;font-size:13px;white-space:nowrap}
  .tbl td.wrap,.tbl th.wrap{white-space:normal;min-width:140px}
  /* Nút đủ to để bấm */
  .btn{min-height:44px;padding:11px 18px;font-size:14.5px}
  .btn-sm{min-height:38px;padding:8px 14px;font-size:13.5px}
  /* Cards xếp dọc */
  .kpi-grid{grid-template-columns:repeat(2,1fr) !important}
  .grid-2{grid-template-columns:1fr !important}
  /* Modal full màn hình */
  .modal{width:calc(100vw - 24px) !important;max-width:560px;max-height:92vh;overflow-y:auto}
  .modal-body{max-height:calc(92vh - 140px);overflow-y:auto}
  /* Form */
  .f-group input,.f-group select,.f-group textarea{font-size:16px !important;min-height:44px}
  /* Trang chi tiết */
  .proj-head{flex-direction:column;align-items:flex-start !important;gap:10px}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:1fr 1fr !important;gap:8px}
  .kpi{padding:12px}
  .kpi .v{font-size:19px}
  .content{padding:12px}
  .card{padding:14px}
}
.menu-toggle{display:flex !important;align-items:center;justify-content:center;width:40px;height:40px;border:none;background:none;color:var(--text);font-size:22px;cursor:pointer;flex-shrink:0}
@media(min-width:901px){.menu-toggle{display:none!important}.sidebar-backdrop{display:none !important}}

/* ========== NÂNG CẤP 2026-10-08: CSS hiện đại + redesign (C3/C5) ========== */
:root{color-scheme:light dark}

/* --- Class còn thiếu của bản cũ (bổ sung style, không đổi giao diện gốc) --- */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:16px;container-type:inline-size;container-name:kpis}
@container kpis (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr);gap:10px}}
.kpi{transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,24,40,.08)}
.kpi .k-value{font-variant-numeric:tabular-nums}
.kpi:has(.k-value.text-red){border-color:var(--red)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat-item{background:var(--gray-bg);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--muted)}
.stat-item b{display:block;font-size:17px;color:var(--text);margin-top:2px;font-variant-numeric:tabular-nums}
.back-link{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:18px;color:var(--text)}
.back-link:hover{background:var(--gray-bg)}
.progress{height:8px;background:var(--gray-bg);border-radius:999px;overflow:hidden;flex:1;min-width:80px}
.progress>div{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .3s}
.progress.red>div{background:var(--red)}
.prog-cell{display:flex;align-items:center;gap:8px}
.pct{font-size:12px;color:var(--muted);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.note-box{background:var(--blue-bg);border:1px solid #b2ddff;color:#1849a9;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.check-panel{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:12px}
.check-row{display:flex;gap:10px;padding:8px 14px;border-top:1px solid var(--border);font-size:13px}
.check-row:first-child{border-top:none}
.check-row .q{flex:1;color:var(--muted)}
.check-row .a{font-weight:700}
.check-row.okk .a{color:var(--green)}
.check-row.warn .a{color:var(--red)}
.f-inline{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.f-inline .f-group{margin-bottom:0;min-width:150px}
.dash-time{text-align:right;color:var(--muted);font-size:12px;margin-top:10px}
.dyn-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px;padding:10px;border:1px dashed var(--border);border-radius:8px}
/* Bản nháp gọn: 1 dòng mỗi vật tư */
.draft-head,.draft-row{display:grid;grid-template-columns:1.2fr 1.6fr .6fr 1fr 1fr 32px;gap:6px;align-items:center}
.draft-head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:6px 0;border-bottom:2px solid var(--border);margin-bottom:6px}
.draft-row{padding:6px 0;border-bottom:1px dashed var(--border)}
.draft-row input,.draft-row select{width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:7px;font-size:13px}
.draft-row .drTt{font-weight:700;text-align:right;font-size:13px}
.draft-total{text-align:right;margin:10px 0;font-size:15px}
@media(max-width:640px){.draft-head{display:none}.draft-row{grid-template-columns:1fr 1fr;row-gap:8px}}
.desc{color:var(--muted);font-size:12.5px;margin-bottom:8px}
.print-actions{display:flex;gap:8px;margin-bottom:14px}
/* --- Skeleton shimmer thay chữ "Đang tải" --- */
.skel{border-radius:8px;background:linear-gradient(90deg,var(--gray-bg) 25%,#e8ecf1 50%,var(--gray-bg) 75%);background-size:200% 100%;animation:skelShimmer 1.2s infinite linear;min-height:18px;margin-bottom:10px}
@keyframes skelShimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.skel-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
/* --- Phân trang --- */
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}
.pg-info{font-size:12.5px;color:var(--muted)}
.pg-num.btn-primary{color:#1b1b1b}
/* --- Diff dự trù (A4) --- */
.diff-new td{background:#e9f9ef!important}
.diff-del td{background:#fdeceb!important}
.diff-chg td{background:#fff7e6!important}
.diff-tag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px;white-space:nowrap}
.diff-new .diff-tag{background:var(--green);color:#fff}
.diff-del .diff-tag{background:var(--red);color:#fff}
.diff-chg .diff-tag{background:var(--amber);color:#fff}
.diff-old{color:var(--muted);text-decoration:line-through}
.diff-arrow{color:var(--amber);font-weight:800;margin:0 4px}
/* --- Banner offline (C4) --- */
#offlineBanner{position:fixed;top:0;left:0;right:0;z-index:300;background:#7c2d12;color:#fff;
  padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:13.5px;font-weight:600}
#offlineBanner button{background:#fff;color:#7c2d12;border:none;border-radius:6px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:13px}
/* --- Widget cần xử lý (A6) --- */
.widget-urgent{margin-bottom:18px}
.widget-urgent .w-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px;cursor:pointer}
.widget-urgent .w-row:last-child{border-bottom:none}
.widget-urgent .w-row:hover{color:var(--gold-dark)}
.widget-urgent .w-more{display:block;text-align:right;font-size:12.5px;margin-top:6px;color:var(--blue);cursor:pointer}
/* --- Biểu đồ --- */
.chart-box{position:relative;height:260px;margin-top:6px}
.chart-box.sm{height:220px}
/* --- Bottom tab bar mobile (C5) --- */
.tabbar{display:none}
.sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:210}
.sheet-overlay.show{display:block}
.sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:211;background:var(--card);
  border-radius:18px 18px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:70dvh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet.show{display:block;animation:sheetUp .25s ease}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .sh-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 10px;border:none;background:none;
  font-size:15px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);cursor:pointer;text-align:left}
.sheet .sh-item:last-child{border-bottom:none}
.sheet .sh-item .ic{width:26px;text-align:center;font-size:17px;color:var(--gold-dark)}
.sheet .sh-label{font-size:11px;letter-spacing:1.5px;color:var(--muted);font-weight:700;text-transform:uppercase;padding:12px 10px 4px}
/* --- Micro-animation --- */
.card{transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(16,24,40,.09)}
.btn{transition:transform .12s ease,background .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.nav-item{transition:background .18s,color .18s,transform .18s}
.nav-item:hover{transform:translateX(2px)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
/* --- Report PDF (A5) --- */
.rp-wrap{max-width:820px;margin:0 auto;background:#fff;color:#000;font-family:"Times New Roman",Arial,sans-serif;font-size:13px;line-height:1.5}
.rp-sign{display:flex;margin-top:34px}
.rp-sign .box{flex:1;text-align:center;font-size:12px;font-weight:700;padding-bottom:60px}
/* --- Dark mode (C3) --- */
@media (prefers-color-scheme: dark){
  :root{--bg:#12141c;--card:#1a1d29;--text:#e5e7eb;--muted:#9ca3af;--border:#2b3040;--gray-bg:#232736;--gold-bg:#3a2c10}
  body{background:var(--bg);color:var(--text)}
  .topbar{background:rgba(26,29,41,.85)}
  .tbl th{background:#20242f;color:#9ca3af}
  table.tbl{background:var(--card)}
  .tbl tr:hover td{background:#20242f}
  .tbl td{border-top-color:var(--border)}
  .f-group input,.f-group select,.f-group textarea{background:#232736;color:var(--text);border-color:var(--border)}
  .modal{background:#1a1d29}
  .btn-ghost{background:#232736;border-color:var(--border);color:var(--text)}
  .btn-ghost:hover{background:#2b3040}
  .back-link{background:#232736;color:var(--text)}
  .stat-item{background:#232736}
  .stat-item b{color:var(--text)}
  .note-box{background:#16283f;border-color:#1e3a5f;color:#9cc3ff}
  .sheet{background:#1a1d29}
  .skel{background:linear-gradient(90deg,#232736 25%,#2e3448 50%,#232736 75%);background-size:200% 100%}
  .alert-card .a-row{border-bottom-color:#2b3040}
  .phieu-wrap{background:#fff;color:#000}
}
/* --- Desktop polish: sidebar bo góc + glassmorphism (C5) --- */
@media(min-width:901px){
  .sidebar{border-radius:16px;margin:12px 0 12px 12px;height:calc(100dvh - 24px);top:12px;
    box-shadow:0 12px 32px rgba(0,0,0,.18)}
  .topbar{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .app{gap:0}
}
@media(min-width:901px) and (prefers-color-scheme: dark){
  .topbar{background:rgba(26,29,41,.85)}
}
/* --- :has() cho trạng thái (C3) --- */
.kpi:has(.k-value.text-red){border-color:var(--red)}
.a-row:has(.text-red){font-weight:600}
/* --- Mobile: sidebar trượt, hamburger luôn hiện --- */
@media(max-width:900px){
  .menu-toggle{display:flex!important}
  .content{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:205;background:var(--head-bg);
    border-top:2px solid var(--head-accent);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -4px 18px rgba(0,0,0,.25)}
  .tabbar .tb-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;
    font-size:10.5px;font-weight:600;color:#a89880;cursor:pointer;padding:6px 2px;font-family:inherit}
  .tabbar .tb-item .ic{font-size:20px;font-style:normal;line-height:1}
  .tabbar .tb-item.active{color:var(--gold)}
  .tabbar .tb-item.active .ic{filter:drop-shadow(0 0 6px rgba(240,173,31,.6))}
  .tabbar .tb-item.active{color:var(--gold-dark)}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media print{
  .print-actions{display:none!important}
  .rp-wrap{padding:0}
  @page{size:A4 portrait;margin:12mm}
}

</style>

/* ---------- Gọi API (đúng CONTRACT: Content-Type text/plain, tránh preflight) ---------- */
async function api(action, params){
  params = params || {};
  const payload = Object.assign({ action: action }, params);
  if (action !== 'login') payload.token = localStorage.getItem(LS_TOKEN);
  let res;
  try {
    res = await fetch(apiUrl(), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
  } catch (e) {
    e.networkError = true;
    throw new Error('Không kết nối được máy chủ. Kiểm tra lại API_URL và đường truyền mạng.');
  }
  let j;
  try { j = await res.json(); }
  catch (e) { throw new Error('Máy chủ trả về dữ liệu không hợp lệ.'); }
  if (!j.ok) {
    if (j.error === 'Hết phiên đăng nhập') {
      const e = new Error('Hết phiên đăng nhập'); e.sessionExpired = true;
      logout();
      throw e;
    }
    throw new Error(j.error || 'Lỗi không xác định từ máy chủ.');
  }
  return j.data;
}
/* ---------- API cache 5 phút (B1) + offline-first (C4) ---------- */
const apiCache = {};
const READ_RE = /^(list|get|fetch)/i;
const WRITE_RE = /^(create|approve|reject|settle|save|submit|delete|markPaid|changePassword|setUserStatus|setSheetLink|clearSheetLink|setProjectSheet)/i;
const CACHE_TTL = 5 * 60 * 1000;
function cacheKey(action, params){ return action + '|' + JSON.stringify(params || {}); }
function clearApiCache(){ for (const k in apiCache) delete apiCache[k]; }
function invalidateCache(prefix){
  Object.keys(apiCache).forEach(k => { if (k === prefix || k.indexOf(prefix + '|') === 0) delete apiCache[k]; });
}
function hashStr(s){
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
function offlineSave(action, params, data){
  try {
    localStorage.setItem('tw_offline_' + action + '_' + hashStr(JSON.stringify(params || {})),
      JSON.stringify({ data: data, ts: Date.now() }));
  } catch (e) {}
}
function offlineRead(action, params){
  try {
    const raw = localStorage.getItem('tw_offline_' + action + '_' + hashStr(JSON.stringify(params || {})));
    if (!raw) return null;
    return JSON.parse(raw).data;
  } catch (e) { return null; }
}
function showOfflineBanner(){ const b = $('offlineBanner'); if (b) b.classList.remove('hidden'); }
function hideOfflineBanner(){ const b = $('offlineBanner'); if (b) b.classList.add('hidden'); }
async function safeApi(action, params, opts){
  opts = opts || {};
  const isRead = READ_RE.test(action);
  const key = cacheKey(action, params);
  if (isRead && !opts.force && apiCache[key] && (Date.now() - apiCache[key].ts < CACHE_TTL))
    return apiCache[key].data;
  try {
    const data = await api(action, params);
    if (WRITE_RE.test(action)) { clearApiCache(); state.fullData = null; }
    else if (isRead) { apiCache[key] = { data: data, ts: Date.now() }; offlineSave(action, params, data); }
    hideOfflineBanner();
    return data;
  } catch (e) {
    if (e.sessionExpired) return null;
    if (isRead && e.networkError) {
      const old = offlineRead(action, params);
      if (old != null) { showOfflineBanner(); toast('Đang offline — hiển thị dữ liệu cũ.', 'info'); return old; }
    }
    toast(e.message, 'error');
    return null;
  }
}

    }));

function openDraftModal(pre){
  const rows = pre && pre.length ? pre : [{ hang_muc:'', vat_tu:'', so_luong:'', don_gia:'' }];
  openModal('Tạo bản nháp dự trù mới',
    '<div class="desc">Mỗi dòng 1 vật tư. Thành tiền = SL × đơn giá (tự tính).</div>' +
    '<div class="draft-head"><span>Hạng mục</span><span>Vật tư / CV</span><span>SL</span><span>Đơn giá</span><span>Thành tiền</span><span></span></div>' +
    '<div id="draftRows"></div>' +
    '<button class="btn btn-ghost btn-sm" id="drAdd">+ Thêm dòng</button>' +
    '<div class="draft-total">Tổng: <b id="drTong">0</b> đ</div>' +
    '<div class="f-group mt16"><label>Ghi chú / lý do tạo bản này</label><input id="drNote" placeholder="Lý do"></div>',
    '<button class="btn btn-ghost" id="mCancel">Hủy</button>' +
    '<button class="btn btn-primary" id="mSave">Lưu bản nháp</button>');
  $('mCancel').onclick = closeModal;
  const tinhTong = () => {
    let t = 0;
    document.querySelectorAll('#draftRows .draft-row').forEach(r => {
      const sl = parseMoney(r.querySelector('.drSl').value);
      const dg = parseMoney(r.querySelector('.drDg').value);
      const tt = sl * dg;
      r.querySelector('.drTt').textContent = tt ? fmt(tt) : '—';
      t += tt;
    });
    $('drTong').textContent = fmt(t);
  };
  const addRow = it => {
    it = it || {};
    const div = document.createElement('div');
    div.className = 'draft-row';
    div.innerHTML =
      '<div>' + hmSelectHtml('drHm' + Date.now() + Math.floor(Math.random()*9999), it.hang_muc || '') + '</div>' +
      '<div><input class="drVt" placeholder="Vật tư / công việc" value="' + esc(it.vat_tu || '') + '"></div>' +
      '<div><input class="drSl" type="text" inputmode="numeric" placeholder="SL" value="' + esc(it.so_luong == null ? '' : it.so_luong) + '"></div>' +
      '<div><input class="drDg" type="text" inputmode="numeric" placeholder="Đơn giá" value="' + esc(it.don_gia == null ? '' : it.don_gia) + '"></div>' +
      '<div class="drTt num">—</div>' +
      '<button class="btn btn-ghost btn-sm drDel" title="Xóa dòng">×</button>';
    const selId = div.querySelector('select').id;
    div.querySelector('.drDel').onclick = () => { div.remove(); tinhTong(); };
    const slI = div.querySelector('.drSl'), dgI = div.querySelector('.drDg');
    formatMoneyInput(slI); formatMoneyInput(dgI);
    slI.addEventListener('input', tinhTong); dgI.addEventListener('input', tinhTong);
    hmSelectBind(selId);
    // Lưu id select để đọc giá trị khi lưu
    div.dataset.hmId = selId;
    $('draftRows').appendChild(div);
    tinhTong();
  };
  rows.forEach(addRow);
  $('drAdd').onclick = () => addRow({});
  $('mSave').onclick = async () => {
    const items = [];
    document.querySelectorAll('#draftRows .draft-row').forEach(r => {
      const hm = hmSelectVal(r.dataset.hmId);
      if (!hm) return;
      items.push({ hang_muc: hm, vat_tu: r.querySelector('.drVt').value.trim(),
        so_luong: parseMoney(r.querySelector('.drSl').value),
        don_gia: parseMoney(r.querySelector('.drDg').value) });
    });
    if (!items.length) { toast('Nhập ít nhất một dòng có hạng mục.', 'error'); return; }
    closeModal();
    toast('Đã lưu bản nháp.', 'success');
    const r = await safeApi('saveDuTru', { ma_du_an: state.project.ma_du_an,
      items: items, ghi_chu: $('drNote').value.trim() });
    if (r) loadDuTru();
  };
}

/* ================= PHIẾU ĐỀ NGHỊ THANH TOÁN (chuẩn công ty) ================= */
function docSoTien(n){
  n = Math.round(Math.abs(Number(n) || 0));
  if (n === 0) return 'Không đồng';
  const chu = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const doc3 = x => {
    let s = '', tram = Math.floor(x / 100), du = x % 100;
    const chuc = Math.floor(du / 10), don = du % 10;
    if (tram) { s = chu[tram] + ' trăm'; if (chuc === 0 && don) s += ' lẻ'; }
    if (chuc > 1) {
      s += (s ? ' ' : '') + chu[chuc] + ' mươi';
      if (don === 1) s += ' mốt'; else if (don === 5) s += ' lăm'; else if (don) s += ' ' + chu[don];
    } else if (chuc === 1) {
      s += (s ? ' ' : '') + 'mười';
      if (don === 5) s += ' lăm'; else if (don) s += ' ' + chu[don];
    } else if (don) s += (s ? ' ' : '') + chu[don];
    return s;
  };
  const parts = [];
  const ty = Math.floor(n / 1e9), tr = Math.floor((n % 1e9) / 1e6),
        ng = Math.floor((n % 1e6) / 1e3), dv = n % 1e3;
  if (ty) parts.push(doc3(ty) + ' tỷ');
  if (tr) parts.push(doc3(tr) + ' triệu');
  if (ng) parts.push(doc3(ng) + ' nghìn');
  if (dv || !parts.length) parts.push(doc3(dv));
  const s = parts.join(' ');
  return s.charAt(0).toUpperCase() + s.slice(1) + ' đồng';
}

/* Xuất Excel chung: HTML table → .xls, UTF-8, tên file có mã dự án + ngày */
function ngayFile(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
}
function xuatXlsChung(tenFile, tieuDe, headers, rows, moneyCols){
  try {
    if (typeof XLSX === 'undefined') { toast('Chưa tải được thư viện Excel. Kiểm tra mạng.', 'error'); return; }
    const cfg = getConfig();
    const maDA = (state.project && state.project.ma_du_an) || 'duan';
    const tenDA = (state.project && state.project.ten_du_an) || '';
    const fileName = tenFile + '_' + maDA + '_' + ngayFile() + '.xlsx';
    const nC = headers.length;
    const aoa = [];
    aoa.push([cfg.coName]);
    aoa.push([cfg.coAddr]);
    aoa.push([]);
    aoa.push([tieuDe]);
    aoa.push(['Dự án: ' + maDA + (tenDA ? ' — ' + tenDA : '') + '    |    Ngày xuất: ' + new Date().toLocaleDateString('vi-VN')]);
    aoa.push([]);
    aoa.push(headers);
    (rows || []).forEach(r => aoa.push(r.map(c => c == null ? '' : c)));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    // Gộp ô tiêu đề (dòng 0,3,4)
    ws['!merges'] = [
      { s: { r: 0, c: 0 }, e: { r: 0, c: nC - 1 } },
      { s: { r: 3, c: 0 }, e: { r: 3, c: nC - 1 } },
      { s: { r: 4, c: 0 }, e: { r: 4, c: nC - 1 } }
    ];
    // Độ rộng cột
    ws['!cols'] = headers.map((h, i) => {
      let mx = String(h || '').length;
      (rows || []).forEach(r => { const l = String(r[i] == null ? '' : r[i]).length; if (l > mx) mx = l; });
      return { wch: Math.min(45, Math.max(14, mx + 3)) };
    });
    // Freeze pane dưới dòng header
    ws['!freeze'] = 'A8';
    const thin = { style: 'thin', color: { rgb: 'B0B0B0' } };
    const borderAll = { top: thin, bottom: thin, left: thin, right: thin };
    const cellAt = (r, c) => XLSX.utils.encode_cell({ r: r, c: c });
    // Tên công ty + tiêu đề: đậm, size lớn
    [0, 3].forEach(r => { const cl = ws[cellAt(r, 0)]; if (cl) cl.s = { font: { bold: true, sz: 14, color: { rgb: '8B5E00' } }, alignment: { horizontal: 'center', vertical: 'center' } }; });
    // Header bảng: nền vàng đậm + chữ trắng in đậm + border
    const hr = 6;
    headers.forEach((h, i) => {
      const cl = ws[cellAt(hr, i)];
      if (cl) cl.s = {
        fill: { fgColor: { rgb: 'B45309' } },
        font: { bold: true, color: { rgb: 'FFFFFF' }, sz: 11 },
        alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
        border: borderAll
      };
    });
    ws['!rows'] = []; ws['!rows'][hr] = { hpt: 28 };
    // Dữ liệu: border + format số cho cột tiền
    const mc = moneyCols || [];
    for (let r = hr + 1; r < hr + 1 + (rows || []).length; r++) {
      for (let c = 0; c < nC; c++) {
        const cl = ws[cellAt(r, c)];
        if (!cl) continue;
        cl.s = cl.s || {};
        cl.s.border = borderAll;
        cl.s.alignment = { vertical: 'center', wrapText: true };
        if (mc.includes(c) && typeof cl.v === 'number') {
          cl.s.numFmt = '#,##0';
          cl.s.alignment = Object.assign(cl.s.alignment, { horizontal: 'right' });
        }
      }
      // Dòng zebra
      if ((r - hr) % 2 === 0) {
        for (let c = 0; c < nC; c++) {
          const cl = ws[cellAt(r, c)];
          if (cl) { cl.s = cl.s || {}; cl.s.fill = { fgColor: { rgb: 'FFF8E7' } }; }
        }
      }
    }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Du lieu');
    XLSX.writeFile(wb, fileName);
    toast('Đã xuất ' + fileName, 'success');
  } catch(e) {
    toast('Lỗi xuất Excel: ' + e.message, 'error');
  }
}
/* Xuất Excel: file .xls dạng HTML table, có BOM để tiếng Việt không lỗi font */
function exportXls(d){
  const items = d.items || [];
  const tong = d.tong || {};
  let h = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">' +
    '<head><meta charset="UTF-8"></head><body>' +
    '<h3>Báo cáo đề nghị — ' + esc(state.project.ma_du_an + ' — ' + state.project.ten_du_an) + '</h3>' +
    '<table border="1"><thead><tr>' +
    ['Ngày','Loại','Hạng mục','Nội dung','Số lượng','Đơn giá','Thành tiền','Nhà cung cấp','Trạng thái','Người tạo']
      .map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>';
  items.forEach(x => {
    h += '<tr><td>' + esc(x.ngay_de_nghi || '') + '</td>' +
      '<td>' + esc(LOAI_DN[x.loai] || x.loai || '') + '</td>' +
      '<td>' + esc(x.hang_muc || '') + '</td>' +
      '<td>' + esc(x.noi_dung || x.mo_ta || '') + '</td>' +
      '<td>' + esc(String(x.so_luong == null ? '' : x.so_luong)) + '</td>' +
      '<td>' + esc(String(x.don_gia == null ? '' : x.don_gia)) + '</td>' +
      '<td>' + esc(String(x.so_tien == null ? '' : x.so_tien)) + '</td>' +
      '<td>' + esc(x.nha_cung_cap || '') + '</td>' +
      '<td>' + esc((TT_DN[x.trang_thai] || [x.trang_thai])[0]) + '</td>' +
      '<td>' + esc(x.nguoi_tao || '') + '</td></tr>';
  });
  h += '</tbody></table><p><b>Tổng số đề nghị:</b> ' + (tong.so_luong_muc != null ? tong.so_luong_muc : items.length) +
    ' &nbsp; <b>Tổng tiền:</b> ' + (tong.tong_tien || 0) + '</p></body></html>';
  const blob = new Blob(['﻿' + h], { type: 'application/vnd.ms-excel;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'baocao_' + state.project.ma_du_an + '_' + ngayFile() + '.xls';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function optimisticRow(btn, map, statusKey, msg, apiFn, reloadFn){

  const tr = btn.closest ? btn.closest('tr') : null;
  if (tr) {
    const tds = tr.querySelectorAll('td');
    for (let i = 0; i < tds.length; i++) {

/* ---------- Phân trang (B5) ---------- */
function pagerBar(pg, pages){
  if (pages <= 1) return '';
  let nums = '';
  const start = Math.max(1, Math.min(pages - 4, pg - 2));
  for (let i = start; i < start + 5 && i <= pages; i++)
    nums += '<button class="btn btn-ghost btn-sm pg-num' + (i === pg ? ' btn-primary' : '') + '" data-pg="' + i + '"' +
      (i === pg ? ' disabled' : '') + '>' + i + '</button>';
  return '<div class="pager">' +
    '<button class="btn btn-ghost btn-sm" data-pg="' + (pg - 1) + '"' + (pg <= 1 ? ' disabled' : '') + '>&larr; Trước</button>' +
    nums +
    '<button class="btn btn-ghost btn-sm" data-pg="' + (pg + 1) + '"' + (pg >= pages ? ' disabled' : '') + '>Sau &rarr;</button>' +
    '<span class="pg-info">Trang ' + pg + '/' + pages + '</span></div>';
}
function paginateRender(list, pg, perPage){
  perPage = perPage || 25;
  const pages = Math.max(1, Math.ceil(list.length / perPage));
  pg = Math.max(1, Math.min(pg || 1, pages));
  return { rows: list.slice((pg - 1) * perPage, pg * perPage), pg: pg, pages: pages, bar: pagerBar(pg, pages) };
}

state.charts = {};
function chartTheme(){
  if (typeof Chart === 'undefined') return;
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  Chart.defaults.color = dark ? '#c3c9d6' : '#5b6472';
  Chart.defaults.borderColor = dark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.08)';
  Chart.defaults.font.family = '"Segoe UI", system-ui, sans-serif';
}
function drawChart(id, cfg){
  if (typeof Chart === 'undefined') return;
  const cv = $(id);
  if (!cv) return;
  chartTheme();
  if (state.charts[id]) { try { state.charts[id].destroy(); } catch (e) {} }
  try { state.charts[id] = new Chart(cv, cfg); } catch (e) {}
}
function drawPieCoCau(id, dm, ck, chi, cl){
  drawChart(id, {
    type: 'pie',
    data: { labels: ['Định mức', 'Cam kết', 'Đã chi', 'Còn lại'],
      datasets: [{ data: [Number(dm) || 0, Number(ck) || 0, Number(chi) || 0, Number(cl) || 0],
        backgroundColor: ['#2f80ed', '#f0ad1f', '#12b76a', '#98a2b3'] }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom' },
        tooltip: { callbacks: { label: c => ' ' + c.label + ': ' + fmt(c.parsed) + ' đ' } } } }
  });
}
function monthKey(s){
  let m = String(s || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return m[3] + '-' + String(m[2]).padStart(2, '0');
  m = String(s || '').match(/(\d{4})-(\d{1,2})-\d{1,2}/);
  if (m) return m[1] + '-' + String(m[2]).padStart(2, '0');
  return null;
}
function veBieuDoThang(canvasId, cardId, items){
  const agg = {};
  (items || []).forEach(t => {
    const k = monthKey(t.ngay);
    if (!k) return;
    agg[k] = (agg[k] || 0) + Number(t.so_tien || 0);
  });
  const keys = Object.keys(agg).sort().slice(-6);
  const card = $(cardId);
  if (!keys.length) { if (card) card.style.display = 'none'; return; } // không có dữ liệu tháng → ẩn
  if (card) card.style.display = '';
  drawChart(canvasId, {
    type: 'bar',
    data: { labels: keys.map(k => 'T' + Number(k.slice(5)) + '/' + k.slice(0, 4)),
      datasets: [{ label: 'Chi tiêu (đ)', data: keys.map(k => agg[k]),
        backgroundColor: '#f0ad1f', borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => ' ' + fmt(c.parsed.y) + ' đ' } } },
      scales: { y: { ticks: { callback: v => (v >= 1e6 ? (v / 1e6) + 'tr' : v) } } } }
  });
}
async function veBieuDoThangGlobal(projects){

function diffDuTruHtml(va, vb, showSame){
  if (!va || !vb) return '<div class="empty">Chọn 2 phiên bản để so sánh.</div>';
  if (String(va.phien_ban) === String(vb.phien_ban)) return '<div class="empty">Hai bản giống nhau — chọn 2 phiên bản khác nhau.</div>';
  const key = i => (i.hang_muc || '') + '|' + (i.vat_tu || '');
  const mapA = {}, mapB = {};
  (va.items || []).forEach(i => { mapA[key(i)] = i; });
  (vb.items || []).forEach(i => { mapB[key(i)] = i; });
  const keys = Array.from(new Set([...Object.keys(mapA), ...Object.keys(mapB)])).sort();
  let rows = '', nNew = 0, nDel = 0, nChg = 0;
  keys.forEach(k => {
    const a = mapA[k], b = mapB[k];
    const idx = k.indexOf('|');
    const hm = k.slice(0, idx), vt = k.slice(idx + 1);
    if (a && !b) {
      nNew++;
      rows += '<tr class="diff-new"><td><b>' + esc(hm) + '</b><span class="diff-tag">Mới</span></td>' +
        '<td>' + esc(vt) + '</td><td class="num">' + fmt(a.so_luong) + '</td>' +
        '<td class="num">' + fmt(a.don_gia) + '</td><td class="num"><b>' + fmt(a.thanh_tien) + '</b></td></tr>';
    } else if (!a && b) {
      nDel++;
      rows += '<tr class="diff-del"><td><b>' + esc(hm) + '</b><span class="diff-tag">Đã xóa</span></td>' +
        '<td>' + esc(vt) + '</td><td class="num">' + fmt(b.so_luong) + '</td>' +
        '<td class="num">' + fmt(b.don_gia) + '</td><td class="num"><b>' + fmt(b.thanh_tien) + '</b></td></tr>';
    } else {
      const slChg = Number(a.so_luong) !== Number(b.so_luong);
      const dgChg = Number(a.don_gia) !== Number(b.don_gia);
      if (slChg || dgChg) {
        nChg++;
        rows += '<tr class="diff-chg"><td><b>' + esc(hm) + '</b><span class="diff-tag">Thay đổi</span></td>' +
          '<td>' + esc(vt) + '</td>' +
          '<td class="num">' + (slChg ? '<span class="diff-old">' + fmt(b.so_luong) + '</span><span class="diff-arrow">→</span><b>' + fmt(a.so_luong) + '</b>' : fmt(a.so_luong)) + '</td>' +
          '<td class="num">' + (dgChg ? '<span class="diff-old">' + fmt(b.don_gia) + '</span><span class="diff-arrow">→</span><b>' + fmt(a.don_gia) + '</b>' : fmt(a.don_gia)) + '</td>' +
          '<td class="num"><b>' + fmt(a.thanh_tien) + '</b></td></tr>';
      } else if (showSame) {
        rows += '<tr><td><b>' + esc(hm) + '</b></td><td>' + esc(vt) + '</td>' +
          '<td class="num">' + fmt(a.so_luong) + '</td><td class="num">' + fmt(a.don_gia) + '</td>' +
          '<td class="num">' + fmt(a.thanh_tien) + '</td></tr>';
      }
    }
  });
  if (!rows) return '<div class="empty">Hai phiên bản giống nhau hoàn toàn.</div>';
  return '<div class="desc">So sánh <b>v' + esc(String(va.phien_ban)) + '</b> (mới) với <b>v' + esc(String(vb.phien_ban)) + '</b> (cũ): ' +
    nNew + ' dòng mới · ' + nDel + ' dòng đã xóa · ' + nChg + ' dòng thay đổi.</div>' +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Hạng mục</th><th>Vật tư / Công việc</th>' +
    '<th class="num">Số lượng</th><th class="num">Đơn giá</th><th class="num">Thành tiền (bản mới)</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>';
}

/* ================= A6 — WIDGET "CẦN XỬ LÝ NGAY" ================= */
function parseVnDate(s){
  let m = String(s || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  m = String(s || '').match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return null;
}
function soNgayTu(d){
  if (!d) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((t - d) / 86400000);
}
async function fillWidgetCanXuLy(list){
  const box = $('widgetCanXuLy');

  const cu = [];
  if (inbox) {
    const push = (arr, loai, getNgay, getMoTa) => (arr || []).forEach(x => {
      const age = soNgayTu(parseVnDate(getNgay(x)));
      if (age != null && age > 2) cu.push({ loai: loai, ma: x.ma_du_an, moTa: getMoTa(x), age: age });
    });
    push(inbox.du_tru, 'Dự trù', x => x.ngay_tao, x => 'v' + x.phien_ban + ' — ' + fmt(x.tong) + ' đ');
    push(inbox.de_nghi, 'Đề nghị', x => x.ngay_de_nghi, x => (x.noi_dung || '') + ' — ' + fmt(x.so_tien) + ' đ');
    push(inbox.phat_sinh, 'Phát sinh', x => x.ngay_tao, x => (x.ly_do || '') + ' — ' + fmt(x.so_tien) + ' đ');
    push(inbox.thanh_toan, 'Thanh toán', x => x.ngay_tao, x => (x.noi_dung || '') + ' — ' + fmt(x.so_tien) + ' đ');
  }
  document.title = cu.length > 0 ? '(' + cu.length + ') Quản lý Dự án' : 'Quản lý Dự án';
  const grp = (cls, label, n, rows, more) =>
    '<div class="alert-card ' + cls + '" style="margin-bottom:12px"><div class="a-head">' + label + ' (' + n + ')</div>' +

  box.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', () => goPage('approval')));
}

      lk.rel = 'manifest';
      lk.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));

      at.rel = 'apple-touch-icon'; at.href = LOGO_BT;
      document.head.appendChild(at);
    }

  try {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      const PAGE = location.href.split('#')[0].replace(/'/g, "\\'");
      const swCode = "var P='" + PAGE + "';" +
        "self.addEventListener('install',function(e){self.skipWaiting();" +
        "e.waitUntil(caches.open('qlda-v1').then(function(c){return c.add(P).catch(function(){});}));});" +
        "self.addEventListener('fetch',function(e){" +
        "e.respondWith(caches.match(e.request).then(function(r){return r||fetch(e.request).then(function(res){" +
        "var cp=res.clone();caches.open('qlda-v1').then(function(c){try{c.put(e.request,cp);}catch(_){}});return res;" +
        "}).catch(function(){return caches.match(P);});}));});";
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'text/javascript' }))).catch(function(){});

  } catch (e) {}
}

  });
  $('sheet').innerHTML = html;
  $('sheet').classList.add('show');
  $('sheetOverlay').classList.add('show');
  $('sheet').querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => goPage(b.dataset.page)));
}
function closeSheet(){
  const s = $('sheet'), o = $('sheetOverlay');
  if (s) s.classList.remove('show');
  if (o) o.classList.remove('show');
}

/* Refresh trang hiện tại (dùng cho kéo-refresh) */
function refreshCurrentPage(){
  _apiCache = {};
  if (state.page === 'dashboard') { loadTongQuanChung(); loadProjectsInto('dashProjWrap'); }
  else goPage(state.page, {project: state.project});
}
/* Công nghệ mới: rung phản hồi + kéo refresh + thanh tiến trình */
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms || 10); } catch(e){} }
document.addEventListener('click', function(e){
  if (e.target.closest('.btn, .tb-item, .nav-item')) buzz(8);
}, {passive:true});
// Thanh tiến trình trên cùng khi tải
(function(){
  const bar = document.createElement('div');
  bar.id = 'loadBar';
  bar.style.cssText = 'position:fixed;top:0;left:0;height:3px;width:0;z-index:9999;background:linear-gradient(90deg,#f0ad1f,#ffd76a);transition:width .3s,opacity .4s;box-shadow:0 0 8px rgba(240,173,31,.7)';
  document.body.appendChild(bar);
  let t;
  window._loadStart = function(){ bar.style.opacity='1'; bar.style.width='30%';
    clearTimeout(t); t=setTimeout(()=>bar.style.width='75%', 800); };
  window._loadDone = function(){ bar.style.width='100%'; clearTimeout(t);
    setTimeout(()=>{ bar.style.opacity='0'; setTimeout(()=>bar.style.width='0',400); }, 250); };
})();
// Bọc safeApi để hiện thanh tiến trình
const _safeApi = safeApi;
safeApi = async function(action, params){
  window._loadStart();
  try { return await _safeApi(action, params); }
  finally { window._loadDone(); }
};
// Kéo xuống để refresh (mobile)
(function(){
  let startY = 0, pulling = false;
  const content = document.getElementById('content');
  if (!content) return;
  content.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, {passive:true});
  content.addEventListener('touchmove', e => {
    if (content.scrollTop === 0 && e.touches[0].clientY - startY > 90 && !pulling) {
      pulling = true; buzz(20);
      if (typeof refreshCurrentPage === 'function') refreshCurrentPage();
      setTimeout(()=>pulling=false, 1500);
    }
  }, {passive:true});
})();

</script>
