<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ thống Quản lý Dự án Thi công — The Wall</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#f0ad1f; --gold-dark:#a87b12; --gold-bg:#fdf3dc;
  --bg:#f4f2ec; --card:#fff; --text:#232323; --muted:#6b7686;
  --border:#e2ddcf; --red:#d92d20; --red-bg:#fef3f2;
  --green:#12805c; --green-bg:#ecfdf3; --amber:#b54708; --amber-bg:#fffaeb;
  --gray-bg:#f2f4f7;
}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.hidden{display:none!important}
.f-group{margin-bottom:14px}
.f-group label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.f-group input,.f-group select,.f-group textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,173,31,.25)}
.f-row{display:flex;gap:12px}
.f-row .f-group{flex:1}
.f-inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.f-inline .f-group{margin-bottom:0;min-width:150px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:8px;border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-primary{background:var(--gold);color:#1b1b1b}
.btn-primary:hover{background:var(--gold-dark);color:#fff}
.btn-ghost{background:#fff;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--gray-bg)}
.btn-danger{background:var(--red);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-sm{padding:5px 12px;font-size:13px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:inset 0 3px 0 var(--gold);flex-wrap:wrap;gap:10px}
.topbar .brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px}
.topbar .brand small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.topbar .userbox{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.container{max-width:1280px;margin:0 auto;padding:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.card h2{font-size:16px;margin-bottom:4px}
.card .desc{color:var(--muted);font-size:13px;margin-bottom:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.card-head h2{margin:0}
.layout{display:flex;gap:20px;align-items:flex-start}
.tabs{background:linear-gradient(180deg,#242424,#101010);padding:14px 10px;display:flex;flex-direction:column;gap:2px;min-width:230px;position:sticky;top:76px;border-radius:10px;flex-shrink:0}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:#a08c5a;padding:12px 12px 6px;text-transform:uppercase}
.tab{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:13.5px;font-weight:500;color:#cfc8b4;cursor:pointer;border-left:3px solid transparent;background:none;border-top:none;border-right:none;border-bottom:none;font-family:inherit;text-align:left;width:100%;border-radius:8px}
.tab .ico{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.07);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;font-style:normal}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab.active{color:#fff;border-left-color:var(--gold);background:rgba(240,173,31,.16);font-weight:700}
.tab.active .ico{background:var(--gold);color:#1b1b1b}
.tabpanes{flex:1;min-width:0}
@media(max-width:768px){.layout{flex-direction:column}.tabs{position:static;min-width:0;width:100%;flex-direction:row;overflow-x:auto;padding:8px}.tab{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;width:auto}.nav-label{display:none}.tab .ico{display:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px}
.kpi .k-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .k-value{font-size:20px;font-weight:700;margin-top:6px}
.kpi.k-red .k-value{color:var(--red)}
.kpi.k-green .k-value{color:var(--green)}
.kpi.k-blue .k-value{color:var(--gold-dark)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:var(--gray-bg);text-align:left;padding:10px 12px;font-weight:600;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle}
.tbl tr.row-alert td{background:var(--red-bg)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .actions{white-space:nowrap;text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-blue{background:var(--gold-bg);color:var(--gold-dark)}
.b-green{background:var(--green-bg);color:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gray{background:var(--gray-bg);color:var(--muted)}
.check-panel{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:16px 0}
.check-row{display:flex;padding:10px 14px;border-top:1px solid var(--border);font-size:13.5px}
.check-row:first-child{border-top:none}
.check-row .q{width:230px;flex-shrink:0;font-weight:600;color:var(--muted)}
.check-row .a{font-weight:600}
.check-row.warn{background:var(--red-bg)}
.check-row.warn .a{color:var(--red)}
.check-row.okk .a{color:var(--green)}
.progress{height:8px;background:var(--gray-bg);border-radius:999px;overflow:hidden;min-width:100px}
.progress > div{height:100%;background:var(--gold);border-radius:999px}
.progress.red > div{background:var(--red)}
.modal-overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:720px;max-width:100%;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:16px}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.dyn-row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-end;flex-wrap:wrap}
.dyn-row .f-group{margin-bottom:0}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast-msg{background:#101828;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:90vw}
.toast-msg.error{background:#b42318}
.toast-msg.success{background:#12805c}
.empty{padding:32px;text-align:center;color:var(--muted);font-size:14px}
.mt8{margin-top:8px}.mt16{margin-top:16px}
.text-red{color:var(--red);font-weight:700}
.text-green{color:var(--green);font-weight:700}
.text-muted{color:var(--muted)}
.back-link{background:none;border:none;color:var(--gold-dark);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;padding:0}
.proj-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;justify-content:space-between;width:100%}
.proj-head .info h2{font-size:18px}
.proj-head .info .meta{color:var(--muted);font-size:13px}
.note-box{background:var(--gold-bg);border:1px solid #fedf89;color:#7a5a10;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat-item{background:var(--gray-bg);border-radius:8px;padding:12px 14px;font-size:13.5px}
.stat-item b{font-size:18px;display:block}
@media(max-width:640px){.container{padding:16px}.f-row{flex-direction:column}.kpi .k-value{font-size:17px}}
.gantt-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px}
.gantt-label{width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.gantt-bar{flex:1;position:relative;height:22px;background:var(--gray-bg);border-radius:4px;overflow:hidden}
.gantt-bar>i{position:absolute;height:100%;display:block;font-style:normal}
.gantt-bar .gantt-bg{background:rgba(240,173,31,.45);border-radius:4px}
.gantt-bar .gantt-fill{background:var(--green);border-radius:4px}
.gantt-pct{width:44px;text-align:right;font-weight:700;flex-shrink:0}
#printRoot{display:none}
.print-actions{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:12px 24px;display:flex;gap:10px;z-index:60;flex-wrap:wrap}
.phieu-wrap{max-width:840px;margin:24px auto;background:#fff;padding:32px 42px;border:1px solid var(--border);font-family:"Times New Roman",Arial,sans-serif;color:#000;font-size:13.5px;line-height:1.5}
.phieu-head{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid #000;padding-bottom:10px;margin-bottom:6px}
.phieu-head .logo{width:70px;height:70px;flex-shrink:0}
.phieu-head .co{font-size:12.5px;line-height:1.5}
.phieu-head .co b{font-size:14px;display:block;text-transform:uppercase;margin-bottom:2px}
.phieu-title{text-align:center;font-size:20px;font-weight:800;margin:18px 0 20px;letter-spacing:1px}
.phieu-line{display:flex;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.phieu-line .cell{flex:1;min-width:180px}
.phieu-sign{display:flex;margin:22px 0;border:1px solid #000}
.phieu-sign .box{flex:1;text-align:center;padding:8px 4px 55px;border-left:1px solid #000;font-size:11.5px;font-weight:700;min-width:0;line-height:1.3}
.phieu-sign .box:first-child{border-left:none}
.phieu-bank{border:1px solid #000;padding:10px 14px;margin:12px 0;font-size:13px;line-height:1.85}
.phieu-bank .t{font-weight:800;margin-bottom:6px;font-size:13px;text-transform:uppercase}
.phieu-money{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.phieu-money th,.phieu-money td{border:1px solid #000;padding:9px 8px;text-align:center}
.phieu-money th{background:#f2f4f7;font-size:12px;font-weight:700}
.phieu-section{font-weight:800;margin-top:14px;font-size:13px}
.phieu-underline{border-bottom:1px dotted #333;height:22px;margin:4px 0 10px}
.phieu-note{text-align:center;font-weight:800;margin-top:22px;font-size:12px;text-transform:uppercase}
.phieu-addr{text-align:center;font-size:11.5px;color:#444;margin-top:6px}
@media print{@page{size:A4 portrait;margin:10mm}body{background:#fff}body > *:not(#printRoot){display:none!important}#printRoot{display:block!important}.print-actions{display:none!important}.phieu-wrap{max-width:none;margin:0;border:none;padding:0;font-size:12px}}
</style>
</head>
<body>

<!-- ============ DANH SÁCH DỰ ÁN ============ -->
<div id="screen-projects" class="screen">
  <div class="topbar">
    <div class="brand">
      <span id="topLogo" style="display:inline-block;width:34px;height:34px"></span>
      <div>Quản lý Dự án Thi công<small id="roleLabel"></small></div>
    </div>
    <div class="userbox">
      <span id="userLabel"></span>
      <button class="btn btn-ghost btn-sm" id="btnPass">Đổi mật khẩu</button>
    </div>
  </div>
  <div class="container">
    <div id="tongQuanBox" style="margin-bottom:16px"></div>
    <div class="card">
      <div class="card-head">
        <h2>Danh sách dự án</h2>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input id="prjSearch" placeholder="Tìm mã / tên / KH / PM..." style="padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;min-width:220px">
          <button class="btn btn-primary btn-sm" id="btnNewProject">+ Tạo dự án</button>
        </div>
      </div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Mã dự án</th><th>Tên dự án</th><th>Khách hàng</th><th>PM</th><th>Bắt đầu</th><th>Kết thúc</th><th>Trạng thái</th><th></th></tr></thead>
        <tbody id="projectRows"><tr><td colspan="8" class="empty">Đang tải...</td></tr></tbody>
      </table></div>
    </div>
  </div>
</div>

<!-- ============ CHI TIẾT DỰ ÁN ============ -->
<div id="screen-detail" class="screen hidden">
  <div class="topbar">
    <div class="brand">
      <span id="topLogo2" style="display:inline-block;width:34px;height:34px"></span>
      <div>Quản lý Dự án Thi công<small id="roleLabel2"></small></div>
    </div>
    <div class="userbox">
      <span id="userLabel2"></span>
      <button class="btn btn-ghost btn-sm" id="btnPass2">Đổi mật khẩu</button>
    </div>
  </div>
  <div class="container" style="padding-bottom:0">
    <div class="proj-head">
      <button class="back-link" id="btnBack">&larr; Danh sách dự án</button>
      <div class="info" style="flex:1"><h2 id="projName"></h2><div class="meta" id="projMeta"></div></div>
    </div>
  </div>
  <div class="container layout">
    <div class="tabs" id="tabBar">
      <div class="nav-label">Quản lý</div>
      <button class="tab hidden" data-tab="tongquan"><i class="ico">◈</i>Tổng quan</button>
      <button class="tab hidden" data-tab="dutru"><i class="ico">▤</i>Dự trù/Định mức</button>
      <button class="tab hidden" data-tab="muahang"><i class="ico">▦</i>Mua hàng/Chi phí</button>
      <button class="tab hidden" data-tab="phatsinh"><i class="ico">✦</i>Phát sinh</button>
      <button class="tab hidden" data-tab="tiendo"><i class="ico">◔</i>Tiến độ</button>
      <div class="nav-label">Phê duyệt & Thanh toán</div>
      <button class="tab hidden" data-tab="pheduyet"><i class="ico">✓</i>Phê duyệt</button>
      <button class="tab hidden" data-tab="thanhtoan"><i class="ico">₫</i>Thanh toán</button>
      <div class="nav-label">Báo cáo</div>
      <button class="tab hidden" data-tab="baocao"><i class="ico">▥</i>Báo cáo</button>
      <button class="tab hidden" data-tab="sheet"><i class="ico">⌗</i>Google Sheets</button>
      <button class="tab hidden" data-tab="lichsu"><i class="ico">◷</i>Lịch sử</button>
      <div class="nav-label">Hệ thống</div>
      <button class="tab hidden" data-tab="admin"><i class="ico">⚙</i>Quản trị</button>
    </div>
    <div class="tabpanes">
      <div id="tab-tongquan" class="tabpane hidden"></div>
      <div id="tab-dutru" class="tabpane hidden"></div>
      <div id="tab-muahang" class="tabpane hidden"></div>
      <div id="tab-phatsinh" class="tabpane hidden"></div>
      <div id="tab-tiendo" class="tabpane hidden"></div>
      <div id="tab-pheduyet" class="tabpane hidden"></div>
      <div id="tab-thanhtoan" class="tabpane hidden"></div>
      <div id="tab-baocao" class="tabpane hidden"></div>
      <div id="tab-sheet" class="tabpane hidden"></div>
      <div id="tab-lichsu" class="tabpane hidden"></div>
      <div id="tab-admin" class="tabpane hidden"></div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="printRoot"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   CẤU HÌNH API
   ===================================================================== */
var API_URL = 'https://script.google.com/macros/s/AKfycbxKOHzq2PRcuXrsUymhl69NgY66byJTTwUzkxjdWQDZw4j25p-YIJABPwYi-J6IplDsuw/exec';

/* User mặc định — vào thẳng app */
var CURRENT_USER = {
  username: 'admin',
  ho_ten: 'Quản trị viên',
  vai_tro: 'Admin',
  bo_phan: 'Ban Giám đốc',
  trang_thai: 'active'
};

/* Logo The Wall — SVG đơn giản, không cần file ngoài */
var LOGO_BT = "data:image/svg+xml;charset=utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
  '<rect width="100" height="100" rx="10" fill="#1b1b1b"/>' +
  '<rect x="6" y="6" width="88" height="88" rx="6" fill="none" stroke="#f0ad1f" stroke-width="2"/>' +
  '<text x="50" y="52" font-family="Georgia,serif" font-size="30" font-weight="900" fill="#f0ad1f" text-anchor="middle" letter-spacing="1">TW</text>' +
  '<text x="50" y="76" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#f0ad1f" text-anchor="middle" letter-spacing="2">THE WALL</text>' +
  '</svg>'
);

/* Hằng số */
var LS_TOKEN = 'qlda_token';
var LS_USER  = 'qlda_user';
var ROLE_LABEL = { Admin:'Quản trị viên', QuanLy:'Quản lý dự án', MuaHang:'Mua hàng',
  KeToan:'Kế toán', Approver:'Người phê duyệt', Viewer:'Chỉ xem' };
var LOAI_DN = { mua_hang:'Mua hàng', thanh_toan:'Thanh toán', thue_thau:'Thuê thầu', nhan_cong:'Nhân công' };
var TT_DN = { cho_duyet:['Chờ duyệt','b-amber'], da_duyet:['Đã duyệt (cam kết)','b-blue'],
  da_chi:['Đã chi','b-green'], tu_choi:['Từ chối','b-red'] };
var TT_DT = { nhap:['Nháp','b-gray'], cho_duyet:['Chờ duyệt','b-amber'],
  da_duyet:['Đã duyệt (đã khóa)','b-green'], khoa_luu:['Lưu trữ','b-gray'] };
var TT_PS = { cho_duyet:['Chờ duyệt','b-amber'], da_duyet:['Đã duyệt','b-green'], tu_choi:['Từ chối','b-red'] };
var TT_TD = { chua_bat_dau:['Chưa bắt đầu','b-gray'], dang_lam:['Đang làm','b-blue'], hoan_thanh:['Hoàn thành','b-green'] };
var TT_TT = { cho_duyet:['Chờ duyệt','b-amber'], da_duyet:['Đã duyệt','b-green'],
  tu_choi:['Từ chối','b-red'], da_chi:['Đã chi','b-blue'] };
var TT_DA = { dang_lam:['Đang làm','b-blue'], tam_dung:['Tạm dừng','b-amber'],
  hoan_thanh:['Hoàn thành','b-green'], huy:['Đã hủy','b-red'] };

/* State */
var state = {
  user: CURRENT_USER,
  projects: [], project: null, tab: 'tongquan',
  hangMucs: [], mhHienThi: [], ttHienThi: []
};

/* Tiện ích */
function $(id){ return document.getElementById(id); }
function fmt(n){ return (Number(n) || 0).toLocaleString('vi-VN'); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function badge(val, map){
  var m = map[val] || [val, 'b-gray'];
  return '<span class="badge ' + m[1] + '">' + esc(m[0]) + '</span>';
}
function R(){ return state.user.vai_tro; }
function can(){
  var roles = Array.prototype.slice.call(arguments);
  return roles.indexOf(R()) !== -1;
}
function toast(msg, type){
  var t = document.createElement('div');
  t.className = 'toast-msg' + (type ? ' ' + type : '');
  t.textContent = msg;
  $('toast').appendChild(t);
  setTimeout(function(){ t.remove(); }, 3200);
}

/* =====================================================================
   API
   ===================================================================== */
function api(action, params){
  params = params || {};
  var payload = Object.assign({ action: action }, params);
  payload.token = localStorage.getItem(LS_TOKEN) || 'NO_TOKEN';
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(function(res){
    return res.json();
  }).then(function(j){
    if (!j.ok) throw new Error(j.error || 'Lỗi từ máy chủ.');
    return j.data;
  }).catch(function(e){
    if (e.message && e.message.indexOf('Lỗi') === 0) throw e;
    throw new Error('Không kết nối được máy chủ. Kiểm tra API_URL.');
  });
}
function safeApi(action, params){
  return api(action, params).catch(function(e){
    toast(e.message, 'error');
    return null;
  });
}

function openProject(ma){
  var p = state.projects.find(function(x){ return x.ma_du_an === ma; });
  if (!p) return;
  state.project = p;
  $('projName').textContent = p.ma_du_an + ' — ' + p.ten_du_an;
  $('projMeta').textContent = [
    p.khach_hang ? 'KH: ' + p.khach_hang : '',
    p.pm ? 'PM: ' + p.pm : '',
    (p.ngay_bat_dau || '') + ' → ' + (p.ngay_ket_thuc || ''),
    p.trang_thai ? (TT_DA[p.trang_thai] || [p.trang_thai])[0] : ''
  ].filter(Boolean).join(' · ');
  document.querySelectorAll('#tabBar .tab').forEach(function(b){ b.classList.remove('hidden'); });
  showScreen('screen-detail');
  switchTab('tongquan');
}

function switchTab(name){
  state.tab = name;
  document.querySelectorAll('#tabBar .tab').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab === name);
  });
  Object.keys(TAB_LOADERS).forEach(function(t){
    var el = $('tab-' + t); if (el) el.classList.add('hidden');
  });
  $('tab-' + name).classList.remove('hidden');
  TAB_LOADERS[name]();
}

        don_gia: Number(r.querySelector('.drDg').value) || 0
      });
    });
    if (!items.length) { toast('Nhập ít nhất 1 dòng.', 'error'); return; }
    safeApi('saveDuTru', { ma_du_an: state.project.ma_du_an, items: items, ghi_chu: $('drNote').value.trim() })
      .then(function(r){ if (r) { closeModal(); toast('Đã lưu.', 'success'); loadDuTru(); } });

function docSoTien(n){
  n = Math.round(Math.abs(Number(n) || 0));
  if (n === 0) return 'Không đồng';
  var chu = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  function doc3(x){
    var s = '', tram = Math.floor(x / 100), du = x % 100;
    var chuc = Math.floor(du / 10), don = du % 10;
    if (tram) { s = chu[tram] + ' trăm'; if (chuc === 0 && don) s += ' lẻ'; }
    if (chuc > 1) {
      s += (s ? ' ' : '') + chu[chuc] + ' mươi';
      if (don === 1) s += ' mốt'; else if (don === 5) s += ' lăm'; else if (don) s += ' ' + chu[don];
    } else if (chuc === 1) {
      s += (s ? ' ' : '') + 'mười';
      if (don === 5) s += ' lăm'; else if (don) s += ' ' + chu[don];
    } else if (don) s += (s ? ' ' : '') + chu[don];
    return s;
  }
  var parts = [];
  var ty = Math.floor(n / 1e9), tr = Math.floor((n % 1e9) / 1e6),
      ng = Math.floor((n % 1e6) / 1e3), dv = n % 1e3;
  if (ty) parts.push(doc3(ty) + ' tỷ');
  if (tr) parts.push(doc3(tr) + ' triệu');
  if (ng) parts.push(doc3(ng) + ' nghìn');
  if (dv || !parts.length) parts.push(doc3(dv));
  var s = parts.join(' ');
  return s.charAt(0).toUpperCase() + s.slice(1) + ' đồng';
}

/* =====================================================================
   XUẤT EXCEL CHUNG
   ===================================================================== */
function ngayFile(){
  var d = new Date();
  var p = function(n){ return String(n).padStart(2, '0'); };
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate());
}
function xuatXlsChung(tenFile, tieuDe, headers, rows){
  var h = '<html xmlns:o="urn:schemas-microsoft-com:office:office"><head><meta charset="UTF-8"></head><body>' +
    '<h3>' + esc(tieuDe) + '</h3>' +
    '<table border="1" cellpadding="6"><thead><tr>' +
    headers.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
  rows.forEach(function(r){
    h += '<tr>' + r.map(function(c){ return '<td>' + esc(c == null ? '' : c) + '</td>'; }).join('') + '</tr>';
  });
  h += '</tbody></table></body></html>';
  var blob = new Blob(['\ufeff' + h], { type: 'application/vnd.ms-excel;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = tenFile + '_' + (state.project ? state.project.ma_du_an : '') + '_' + ngayFile() + '.xls';
  a.click();
}

      (url ? '<button class="btn btn-ghost btn-sm" id="btnClearSheet">Xóa</button>' : '') +
      '</div></div>';
    el.innerHTML = html;
    $('btnSaveSheet').onclick = function(){
      var u = $('shUrl').value.trim();
      if (u && u.indexOf('https://docs.google.com/') !== 0) { toast('Link không hợp lệ.', 'error'); return; }
      safeApi('updateProject', { ma_du_an: state.project.ma_du_an, sheet_url: u }).then(function(r){
        if (r) { state.project.sheet_url = u; toast('Đã lưu.', 'success'); loadSheet(); }
      });
    };
    var bs = $('btnSync'); if (bs) bs.onclick = function(){
      toast('Đang đồng bộ...');
      safeApi('syncFromSheet', { ma_du_an: state.project.ma_du_an }).then(function(r){
        if (r) { toast('Đồng bộ xong.', 'success'); loadSheet(); }
      });
    };
    var bc = $('btnClearSheet'); if (bc) bc.onclick = function(){
      if (!confirm('Xóa kết nối?')) return;
      safeApi('updateProject', { ma_du_an: state.project.ma_du_an, sheet_url: '' }).then(function(r){
        if (r) { state.project.sheet_url = ''; toast('Đã xóa.', 'success'); loadSheet(); }
      });
    };
  });
}

/* =====================================================================
   TAB LỊCH SỬ
   ===================================================================== */
function loadLichSu(){
  var el = $('tab-lichsu');
  el.innerHTML = '<div class="empty">Đang tải...</div>';
  safeApi('getLichSu', { ma_du_an: state.project.ma_du_an, gioi_han: 100 }).then(function(d){
    if (!d) return;
    var list = d.list || d || [];
    var html = '<div class="card"><div class="card-head"><h2>Lịch sử thay đổi</h2></div>';
    if (!list.length) html += '<div class="empty">Chưa có lịch sử.</div>';
    else {
      html += '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>Thời gian</th><th>Người làm</th><th>Hành động</th><th>Đối tượng</th><th>Lý do</th></tr></thead><tbody>';
      list.forEach(function(x){
        html += '<tr><td>' + esc(x.thoi_gian || '') + '</td>' +
          '<td><b>' + esc(x.username || '') + '</b></td>' +
          '<td>' + esc(x.hanh_dong || '') + '</td>' +
          '<td>' + esc(x.doi_tuong || '') + '</td>' +
          '<td>' + esc(x.ly_do || '') + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';
    el.innerHTML = html;
  });
}

/* =====================================================================
   TAB ADMIN
   ===================================================================== */
function loadAdmin(){
  var el = $('tab-admin');
  el.innerHTML = '<div class="empty">Đang tải...</div>';
  safeApi('listUsers').then(function(d){
    if (!d) return;
    var list = d.users || d || [];
    var html = '<div class="card"><div class="card-head"><h2>Quản lý người dùng</h2>' +
      '<button class="btn btn-primary btn-sm" id="btnNewUser">+ Tạo user</button></div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tên đăng nhập</th><th>Họ tên</th>' +
      '<th>Vai trò</th><th>Trạng thái</th></tr></thead><tbody>';
    if (!list.length) html += '<tr><td colspan="4" class="empty">Chưa có user.</td></tr>';
    list.forEach(function(u){
      var locked = u.trang_thai !== 'active';
      html += '<tr><td><b>' + esc(u.username) + '</b></td><td>' + esc(u.ho_ten || '') + '</td>' +
        '<td>' + esc(ROLE_LABEL[u.vai_tro] || u.vai_tro || '') + '</td>' +
        '<td>' + (locked ? '<span class="badge b-red">Khóa</span>' : '<span class="badge b-green">Hoạt động</span>') + '</td></tr>';
    });
    html += '</tbody></table></div></div>';
    el.innerHTML = html;
  });
}

document.addEventListener('DOMContentLoaded', function(){

  ['topLogo','topLogo2'].forEach(function(id){
    var el = $(id);
    if (el) el.innerHTML = '<img src="' + LOGO_BT + '" style="width:100%;height:100%;object-fit:contain" alt="TW">';
  });

  // Tên user
  var lbl = CURRENT_USER.ho_ten + ' (' + (ROLE_LABEL[CURRENT_USER.vai_tro] || CURRENT_USER.vai_tro) + ')';
  $('userLabel').textContent = lbl;
  $('userLabel2').textContent = lbl;
  $('roleLabel').textContent = ROLE_LABEL[CURRENT_USER.vai_tro] || CURRENT_USER.vai_tro;
  $('roleLabel2').textContent = ROLE_LABEL[CURRENT_USER.vai_tro] || CURRENT_USER.vai_tro;

  // Sự kiện
  $('btnBack').addEventListener('click', function(){ showScreen('screen-projects'); });
  $('btnNewProject').addEventListener('click', function(){ openProjectModal(); });
  $('btnPass').addEventListener('click', function(){ toast('Chức năng đổi mật khẩu tạm ẩn.', 'error'); });
  $('btnPass2').addEventListener('click', function(){ toast('Chức năng đổi mật khẩu tạm ẩn.', 'error'); });
  document.querySelectorAll('#tabBar .tab').forEach(function(b){
    b.addEventListener('click', function(){ switchTab(b.dataset.tab); });
  });
  var s = $('prjSearch');
  if (s) s.addEventListener('input', function(){ loadProjects(); });

  // VÀO THẲNG DASHBOARD
  showScreen('screen-projects');
  loadProjects();
});
</script>
