<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wall — Quản lý Dự án Thi công</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#f0ad1f; --gold-dark:#a87b12; --gold-bg:#fdf3dc;
  --bg:#eef1f5; --card:#fff; --text:#1f2937; --muted:#6b7280;
  --border:#e5e7eb; --red:#d92d20; --red-bg:#fef3f2;
  --green:#12805c; --green-bg:#ecfdf3; --amber:#b54708; --amber-bg:#fffaeb;
  --blue:#175cd3; --blue-bg:#eff8ff; --gray-bg:#f3f4f6;
  --sidebar:#1a1d29;
}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.hidden{display:none!important}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit}

.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--sidebar);color:#cbd5e1;flex-shrink:0;padding:16px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .logo{padding:0 18px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.sidebar .logo img{width:40px;height:40px;border-radius:8px;background:#fff;padding:3px;object-fit:contain}
.sidebar .logo b{color:#fff;font-size:15px;display:block;line-height:1.2}
.sidebar .logo small{font-size:11px;color:#94a3b8}
.side-nav{display:flex;flex-direction:column;padding:0 10px}
.nav-label{font-size:10px;letter-spacing:1.5px;color:#64748b;padding:14px 10px 6px;font-weight:700;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:#cbd5e1;font-size:13.5px;cursor:pointer;border:none;background:none;text-align:left;width:100%;font-weight:500;transition:background .15s}
.nav-item .ic{width:22px;text-align:center;font-style:normal;font-size:15px;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--gold);color:#1b1b1b;font-weight:700}
.nav-item.active .ic{opacity:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:40}
.topbar h1{font-size:17px;font-weight:700}
.topbar .crumb{font-size:12.5px;color:var(--muted)}
.topbar .userbox{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1b1b1b;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.content{padding:22px 24px;flex:1}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;padding:10px 0}
  .sidebar .logo{padding:0 14px 12px}
  .side-nav{flex-direction:row;overflow-x:auto;padding:0 8px}
  .nav-label{display:none}
  .nav-item{white-space:nowrap;padding:8px 12px;font-size:13px}
  .nav-item .ic{display:none}
}

.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h2{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card .desc{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.grid{display:grid;gap:14px}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi .k-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.kpi .k-value{font-size:20px;font-weight:800;margin-top:4px;color:var(--text)}
.kpi .k-sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.k-red .k-value{color:var(--red)}
.kpi.k-green .k-value{color:var(--green)}
.kpi.k-blue .k-value{color:var(--blue)}
.kpi.k-gold .k-value{color:var(--gold-dark)}
.kpi.k-amber .k-value{color:var(--amber)}

.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.tbl th{background:#f8fafc;text-align:left;padding:10px 12px;font-weight:700;color:#475569;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle}
.tbl tr:hover td{background:#fafbfc}
.tbl tr.row-alert td{background:var(--red-bg)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .actions{text-align:right;white-space:nowrap}
.tbl .muted{color:var(--muted);font-size:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn-primary{background:var(--gold);color:#1b1b1b}
.btn-primary:hover{background:var(--gold-dark);color:#fff}
.btn-ghost{background:#fff;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--gray-bg)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#b42318}
.btn-success{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.f-group{margin-bottom:12px}
.f-group label{display:block;font-weight:600;font-size:12.5px;margin-bottom:5px;color:#374151}
.f-group input,.f-group select,.f-group textarea{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,173,31,.2)}
.f-row{display:flex;gap:12px}
.f-row .f-group{flex:1}
@media(max-width:640px){.f-row{flex-direction:column}}

.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-green{background:var(--green-bg);color:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gray{background:var(--gray-bg);color:#475569}
.b-gold{background:var(--gold-bg);color:var(--gold-dark)}

.prog{height:8px;background:var(--gray-bg);border-radius:999px;overflow:hidden;flex:1;min-width:80px}
.prog > i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .3s}
.prog.red > i{background:var(--red)}
.prog.green > i{background:var(--green)}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:760px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-head{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:15.5px;font-weight:700}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1;padding:0 4px}
.modal-body{padding:20px 22px;max-height:65vh;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast-msg{background:#0f172a;color:#fff;padding:11px 20px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;animation:slideUp .25s}
.toast-msg.error{background:#b42318}
.toast-msg.success{background:#12805c}
.toast-msg.info{background:#175cd3}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.empty{padding:32px;text-align:center;color:var(--muted);font-size:13px}
.text-red{color:var(--red)!important;font-weight:700}
.text-green{color:var(--green)!important;font-weight:700}
.text-muted{color:var(--muted)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--gray-bg);padding:3px 10px;border-radius:999px;font-size:12px;color:#475569}
.chip.gold{background:var(--gold-bg);color:var(--gold-dark)}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--gold-dark);border-bottom-color:var(--gold)}

#printRoot{display:none}
.print-bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:12px 24px;display:flex;gap:8px;z-index:60}
.phieu-wrap{max-width:820px;margin:24px auto;background:#fff;padding:32px 42px;border:1px solid var(--border);font-family:"Times New Roman",Arial,sans-serif;color:#000;font-size:13px;line-height:1.5}
.phieu-head{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid #000;padding-bottom:10px;margin-bottom:6px}
.phieu-head .logo{width:70px;height:70px;flex-shrink:0;object-fit:contain}
.phieu-head .co{font-size:12.5px;line-height:1.5}
.phieu-head .co b{font-size:14px;display:block;text-transform:uppercase;margin-bottom:2px}
.phieu-title{text-align:center;font-size:20px;font-weight:800;margin:18px 0 20px;letter-spacing:1px}
.phieu-line{display:flex;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.phieu-line .cell{flex:1;min-width:180px}
.phieu-sign{display:flex;margin:22px 0;border:1px solid #000}
.phieu-sign .box{flex:1;text-align:center;padding:8px 4px 55px;border-left:1px solid #000;font-size:11px;font-weight:700;min-width:0}
.phieu-sign .box:first-child{border-left:none}
.phieu-bank{border:1px solid #000;padding:10px 14px;margin:12px 0;font-size:13px;line-height:1.85}
.phieu-bank .t{font-weight:800;margin-bottom:6px;text-transform:uppercase}
.phieu-money{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.phieu-money th,.phieu-money td{border:1px solid #000;padding:9px 8px;text-align:center}
.phieu-money th{background:#f2f4f7;font-size:12px}
.phieu-section{font-weight:800;margin-top:14px;font-size:13px}
.phieu-underline{border-bottom:1px dotted #333;height:22px;margin:4px 0 10px}
.phieu-note{text-align:center;font-weight:800;margin-top:22px;font-size:12px;text-transform:uppercase}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  .print-bar{display:none!important}
  .phieu-wrap{max-width:none;margin:0;border:none;padding:0;font-size:12px}
}
.footer{text-align:center;padding:16px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);margin-top:24px}
</style>
</head>

/* =====================================================================
   HELPERS
   ===================================================================== */
function $(id){ return document.getElementById(id); }
function fmt(n){ return (Number(n)||0).toLocaleString('vi-VN'); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function badge(val, map){
  var m = map[val] || [val, 'b-gray'];
  return '<span class="badge '+m[1]+'">'+esc(m[0])+'</span>';
}
function toast(msg, type){
  var t = document.createElement('div');
  t.className = 'toast-msg' + (type?' '+type:'');
  t.textContent = msg;
  $('toast').appendChild(t);
  setTimeout(function(){ t.remove(); }, 3500);
}

/* =====================================================================
   API
   ===================================================================== */
function api(action, params){
  params = params || {};
  var payload = Object.assign({ action: action, token: TOKEN }, params);
  return fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json(); })
    .then(function(j){
      if (!j.ok) throw new Error(j.error || 'Lỗi máy chủ');
      return j.data;
    })
    .catch(function(e){
      if (e.message && e.message.indexOf('Lỗi') !== 0 && e.message.indexOf('Không') !== 0 && e.message.indexOf('Sai') !== 0) {
        throw new Error('Không kết nối được máy chủ. Kiểm tra API_URL và deploy.');
      }
      throw e;
    });
}
function safeApi(action, params){
  return api(action, params).catch(function(e){ toast(e.message, 'error'); return null; });
}

function renderMenu(){
  var html = '';
  MENU.forEach(function(g){
    html += '<div class="nav-label">'+g.group+'</div>';
    g.items.forEach(function(it){
      html += '<button class="nav-item'+(state.page===it.key?' active':'')+'" data-page="'+it.key+'">'+
        '<i class="ic">'+it.icon+'</i>'+it.label+'</button>';
    });
  });
  $('sideNav').innerHTML = html;
  $('sideNav').querySelectorAll('button[data-page]').forEach(function(b){
    b.addEventListener('click', function(){ goPage(b.dataset.page); });
  });
}

/* =====================================================================
   ROUTER
   ===================================================================== */
function goPage(page, params){
  state.page = page;
  if (params && params.project) state.project = params.project;
  renderMenu();

  var titles = {
    dashboard:'Dashboard', projects:'Dự án', budget:'Dự trù / Định mức',
    cost:'Mua hàng / Chi phí', variation:'Phát sinh', progress:'Tiến độ',
    approval:'Phê duyệt', payment:'Thanh toán', reports:'Báo cáo',
    history:'Lịch sử', users:'Người dùng', settings:'Cài đặt'
  };
  $('pageTitle').textContent = titles[page] || page;
  var crumb = state.project ? (state.project.ma_du_an + ' — ' + state.project.ten_du_an) : 'Toàn hệ thống';
  $('pageCrumb').textContent = crumb;

  var renderers = {
    dashboard: renderDashboard, projects: renderProjects, budget: renderBudget,
    cost: renderCost, variation: renderVariation, progress: renderProgress,
    approval: renderApproval, payment: renderPayment, reports: renderReports,
    history: renderHistory, users: renderUsers, settings: renderSettings
  };
  (renderers[page] || renderDashboard)();
}

   ===================================================================== */
function kpi(label, val, cls, suffix, sub){
  return '<div class="kpi k-'+cls+'"><div class="k-label">'+esc(label)+'</div>'+
    '<div class="k-value">'+val+' '+(suffix||'')+'</div>'+
    (sub?'<div class="k-sub">'+esc(sub)+'</div>':'')+'</div>';
}
function statBox(label, val, color){
  var cls = color==='red' ? 'text-red' : '';
  return '<div class="kpi"><div class="k-label">'+esc(label)+'</div>'+
    '<div class="k-value '+cls+'">'+val+'</div></div>';
}

function renderDashboard(){
  var c = $('content');
  c.innerHTML = '<div class="empty">Đang tải dashboard...</div>';
  safeApi('getTongQuan').then(function(d){
    if (!d) { c.innerHTML = '<div class="empty">Không tải được dashboard.</div>'; return; }
    var list = d.projects || d || [];
    var T = function(f){ return list.reduce(function(s,x){ return s+Number(x[f]||0); },0); };
    var html = '';
    html += '<div class="grid g4" style="margin-bottom:16px">' +
      kpi('Tổng định mức', fmt(T('tong_dinh_muc')), 'gold', 'đ', list.length + ' dự án') +
      kpi('Đã cam kết',    fmt(T('tong_cam_ket')), 'blue', 'đ', 'chưa chi') +
      kpi('Đã chi',        fmt(T('tong_da_chi')), 'green', 'đ', 'thực tế') +
      kpi('Vượt ngân sách',fmt(T('tong_vuot')), 'red', 'đ', 'cần xử lý') +
      '</div>';

    html += '<div class="card"><div class="card-head"><h2>Chi tiết theo dự án</h2>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn btn-ghost btn-sm" id="btnSeed">📥 Nạp dự án mẫu Mỹ Phú</button>' +
      '<button class="btn btn-primary btn-sm" onclick="openProjectModal()">+ Dự án mới</button>' +
      '</div></div>';
    if (!list.length) {
      html += '<div class="empty">Chưa có dự án nào. Bấm "📥 Nạp dự án mẫu" để có dữ liệu test ngay, hoặc "+ Dự án mới" để tạo thủ công.</div>';
    } else {
      html += '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>Mã DA</th><th>Tên dự án</th><th class="num">Định mức</th><th class="num">Cam kết</th>' +
        '<th class="num">Đã chi</th><th class="num">Còn lại</th><th class="num">Vượt</th>' +
        '<th class="num">Chờ duyệt</th><th></th></tr></thead><tbody>';
      list.forEach(function(p){
        var alert = Number(p.tong_vuot)>0 || Number(p.so_viec_tre)>0;
        html += '<tr'+(alert?' class="row-alert"':'')+'>'+
          '<td><b>'+esc(p.ma_du_an)+'</b></td>'+
          '<td>'+esc(p.ten_du_an||'')+'</td>'+
          '<td class="num">'+fmt(p.tong_dinh_muc)+'</td>'+
          '<td class="num">'+fmt(p.tong_cam_ket)+'</td>'+
          '<td class="num">'+fmt(p.tong_da_chi)+'</td>'+
          '<td class="num'+(Number(p.tong_con_lai)<0?' text-red':' text-green')+'">'+fmt(p.tong_con_lai)+'</td>'+
          '<td class="num'+(Number(p.tong_vuot)>0?' text-red':'')+'">'+fmt(p.tong_vuot)+'</td>'+
          '<td class="num">'+Number(p.cho_duyet||0)+'</td>'+
          '<td class="actions"><button class="btn btn-primary btn-sm" data-open="'+esc(p.ma_du_an)+'">Mở</button></td>'+
          '</tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';
    c.innerHTML = html;

    var bs = $('btnSeed');
    if (bs) bs.addEventListener('click', seedProject);

    c.querySelectorAll('button[data-open]').forEach(function(b){
      b.addEventListener('click', function(){
        var p = state.projects.find(function(x){ return x.ma_du_an===b.dataset.open; });

        goPage('projects', {project:p});

/* =====================================================================
   NẠP DỮ LIỆU MẪU
   ===================================================================== */
function seedProject(){
  if (!confirm('Nạp dự án mẫu "Mỹ Phú — Cải tạo mở rộng"?\n\nSẽ tạo dự án + ' + SEED_PROJECT.items.length + ' dòng dự trù.\n\nTiếp tục?')) return;
  var btn = $('btnSeed');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Đang nạp...'; }
  toast('Bước 1/2: Tạo dự án...', 'info');

  safeApi('createProject', {
    ma_du_an: SEED_PROJECT.ma_du_an,
    ten_du_an: SEED_PROJECT.ten_du_an,
    khach_hang: SEED_PROJECT.khach_hang,
    pm: SEED_PROJECT.pm,
    ngay_bat_dau: SEED_PROJECT.ngay_bat_dau,
    ngay_ket_thuc: SEED_PROJECT.ngay_ket_thuc,
    gia_tri_hop_dong: SEED_PROJECT.gia_tri_hop_dong,
    mo_ta: SEED_PROJECT.mo_ta
  }).then(function(r){
    if (!r) { if (btn) { btn.disabled = false; btn.textContent = '📥 Nạp dự án mẫu Mỹ Phú'; } return; }
    toast('Bước 2/2: Tạo ' + SEED_PROJECT.items.length + ' dòng dự trù...', 'info');
    return safeApi('saveDuTru', {
      ma_du_an: SEED_PROJECT.ma_du_an,
      items: SEED_PROJECT.items
    }).then(function(r2){
      if (btn) { btn.disabled = false; btn.textContent = '📥 Nạp dự án mẫu Mỹ Phú'; }
      if (r2) {
        toast('✅ Đã nạp xong dự án Mỹ Phú (' + SEED_PROJECT.items.length + ' dòng)!', 'success');
        safeApi('listProjects').then(function(d){
          if (d) state.projects = d.projects || d || [];
        });
        goPage('dashboard');
      }
    });
  });
}

function loadProjectTab(tab){
  var el = $('prjTabBody');

  var fns = {
    tongquan: ptTongQuan, dutru: ptDuTru, muahang: ptMuaHang,
    phatsinh: ptPhatSinh, tiendo: ptTienDo, pheduyet: ptPheDuyet,
    thanhtoan: ptThanhToan, baocao: ptBaoCao, lichsu: ptLichSu
  };
  (fns[tab] || ptTongQuan)(el);
}

/* ----- DỰ TRÙ ----- */
function ptDuTru(el){
  safeApi('getDuTru', { ma_du_an: state.project.ma_du_an }).then(function(d){
    if (!d) return;
    var active = d.active, versions = d.versions || [];
    state.hangMucs = active && active.items ? active.items.map(function(i){return i.hang_muc;}).filter(function(v,i,a){return a.indexOf(v)===i;}) : [];
    var html = '<div class="card"><div class="card-head">' +
      '<h2>Bản dự trù đang áp dụng</h2>' +
      '<div style="display:flex;gap:6px">' +
      (active && active.items ? '<button class="btn btn-ghost btn-sm" id="btnXlsDT">Xuất Excel</button>' : '') +
      '<button class="btn btn-primary btn-sm" id="btnNewDT">+ Bản nháp mới</button>' +
      '</div></div>';
    if (active && active.items && active.items.length) {
      var tong = active.items.reduce(function(s,i){return s+Number(i.thanh_tien||0);},0);
      html += '<div class="desc">Phiên bản v'+esc(active.phien_ban)+' — đã khóa. Muốn sửa tạo bản nháp mới.</div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>Hạng mục</th><th>Vật tư / Công việc</th><th>ĐVT</th>' +
        '<th class="num">SL</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th></tr></thead><tbody>' +
        active.items.map(function(it){
          return '<tr><td><b>'+esc(it.hang_muc)+'</b></td><td>'+esc(it.vat_tu||'')+'</td>'+
            '<td>'+esc(it.don_vi||'')+'</td><td class="num">'+fmt(it.so_luong)+'</td>'+
            '<td class="num">'+fmt(it.don_gia)+'</td><td class="num"><b>'+fmt(it.thanh_tien)+'</b></td></tr>';
        }).join('') +
        '<tr style="background:var(--gold-bg)"><td colspan="5" class="num"><b>TỔNG</b></td>' +
        '<td class="num"><b>'+fmt(tong)+'</b></td></tr>' +
        '</tbody></table></div>';
    } else {
      html += '<div class="empty">Chưa có dự trù. Bấm "+ Bản nháp mới" để tạo.</div>';
    }
    html += '</div>';
    html += '<div class="card"><h2>Lịch sử phiên bản</h2>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th>Version</th><th>Trạng thái</th><th>Người tạo</th><th>Ngày</th><th></th></tr></thead><tbody>';
    if (!versions.length) html += '<tr><td colspan="5" class="empty">Chưa có phiên bản.</td></tr>';
    versions.forEach(function(v){
      var act = '';
      if (v.trang_thai === 'nhap') act = '<button class="btn btn-ghost btn-sm" data-dt="submit" data-v="'+v.phien_ban+'">Trình duyệt</button>';
      else if (v.trang_thai === 'cho_duyet') act = '<button class="btn btn-success btn-sm" data-dt="approve" data-v="'+v.phien_ban+'">Duyệt & khóa</button>';
      html += '<tr><td><b>v'+esc(v.phien_ban)+'</b></td><td>'+badge(v.trang_thai, TT_DT)+'</td>'+
        '<td>'+esc(v.nguoi_tao||'')+'</td><td>'+esc(v.ngay_tao||'')+'</td>'+
        '<td class="actions">'+act+'</td></tr>';
    });
    html += '</tbody></table></div></div>';
    el.innerHTML = html;
    $('btnNewDT').onclick = function(){ openDraftModal(active ? active.items : []); };
    var bx = $('btnXlsDT');
    if (bx && active && active.items) bx.onclick = function(){
      xls('dutru', 'Dự trù — '+state.project.ma_du_an,
        ['Hạng mục','Vật tư/CV','ĐVT','SL','Đơn giá','Thành tiền'],
        active.items.map(function(it){return [it.hang_muc, it.vat_tu||'', it.don_vi||'', it.so_luong, it.don_gia, it.thanh_tien];}));
    };
    el.querySelectorAll('button[data-dt]').forEach(function(b){
      b.addEventListener('click', function(){
        var v = b.dataset.v, act = b.dataset.dt;
        if (act==='submit') {
          if (!confirm('Trình duyệt v'+v+'?')) return;
          safeApi('submitDuTru', {ma_du_an:state.project.ma_du_an, phien_ban:Number(v)})
            .then(function(r){ if(r){toast('Đã trình duyệt.','success'); loadProjectTab('dutru');} });
        } else {
          if (!confirm('Duyệt & khóa v'+v+'?')) return;
          safeApi('approveDuTru', {ma_du_an:state.project.ma_du_an, phien_ban:Number(v)})
            .then(function(r){ if(r){toast('Đã duyệt.','success'); loadProjectTab('dutru');} });
        }
      });
    });
  });
}

function openDraftModal(pre){
  var rows = pre && pre.length ? pre : [{hang_muc:'',vat_tu:'',don_vi:'',so_luong:'',don_gia:''}];
  openModal('Tạo bản nháp dự trù',
    '<div class="desc">Điền hạng mục → vật tư → ĐVT → SL → đơn giá.</div>'+
    '<div id="draftRows"></div>'+
    '<button class="btn btn-ghost btn-sm" id="dtAdd">+ Thêm dòng</button>',
    '<button class="btn btn-ghost" id="mCancel">Hủy</button>'+
    '<button class="btn btn-primary" id="mSave">Lưu nháp</button>');
  $('mCancel').onclick = closeModal;
  function addRow(it){
    it = it || {};
    var div = document.createElement('div');
    div.className = 'f-row';
    div.style.marginBottom = '8px';
    div.innerHTML =
      '<div class="f-group" style="flex:2"><input class="dtHm" placeholder="Hạng mục" value="'+esc(it.hang_muc||'')+'"></div>'+
      '<div class="f-group" style="flex:3"><input class="dtVt" placeholder="Vật tư/CV" value="'+esc(it.vat_tu||'')+'"></div>'+
      '<div class="f-group" style="flex:1"><input class="dtDv" placeholder="ĐVT" value="'+esc(it.don_vi||'')+'"></div>'+
      '<div class="f-group" style="flex:1"><input class="dtSl" type="number" placeholder="SL" value="'+esc(it.so_luong||'')+'"></div>'+
      '<div class="f-group" style="flex:1.5"><input class="dtDg" type="number" placeholder="ĐG" value="'+esc(it.don_gia||'')+'"></div>'+
      '<button class="btn btn-ghost btn-sm dtDel" style="align-self:flex-start;margin-top:22px">×</button>';
    div.querySelector('.dtDel').onclick = function(){ div.remove(); };
    $('draftRows').appendChild(div);
  }
  rows.forEach(addRow);
  $('dtAdd').onclick = function(){ addRow({}); };
  $('mSave').onclick = function(){
    var items = [];
    document.querySelectorAll('#draftRows .f-row').forEach(function(r){
      var hm = r.querySelector('.dtHm').value.trim();
      if (!hm) return;
      items.push({
        hang_muc: hm,
        vat_tu: r.querySelector('.dtVt').value.trim(),
        don_vi: r.querySelector('.dtDv').value.trim(),
        so_luong: Number(r.querySelector('.dtSl').value)||0,
        don_gia: Number(r.querySelector('.dtDg').value)||0
      });
    });
    if (!items.length) { toast('Nhập ít nhất 1 dòng có hạng mục.', 'error'); return; }
    safeApi('saveDuTru', {ma_du_an:state.project.ma_du_an, items:items})
      .then(function(r){ if(r){closeModal(); toast('Đã lưu.','success'); loadProjectTab('dutru');} });
  };
}

function ptMuaHang(el){

    if (!d) return;

    var html = '<div class="card"><div class="card-head"><h2>Đề nghị mua hàng / chi phí</h2>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<input id="mhKw" placeholder="Tìm..." style="padding:6px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px">' +
      '<select id="mhTt" style="padding:6px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px">' +
      '<option value="">Tất cả trạng thái</option>' +
      Object.keys(TT_DN).map(function(k){return '<option value="'+k+'">'+TT_DN[k][0]+'</option>';}).join('') + '</select>' +
      '<select id="mhHm" style="padding:6px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px">' +
      '<option value="">Tất cả hạng mục</option>' +
      hms.map(function(h){return '<option value="'+esc(h)+'">'+esc(h)+'</option>';}).join('') + '</select>' +
      '<button class="btn btn-primary btn-sm" id="btnNewDN">+ Tạo</button>' +
      '<button class="btn btn-ghost btn-sm" id="btnXlsMH">Excel</button>' +
      '</div></div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th>Ngày</th><th>Loại</th><th>Hạng mục</th><th>Nội dung</th>' +
      '<th class="num">SL</th><th class="num">ĐG</th><th class="num">Thành tiền</th>' +
      '<th>NCC</th><th>Trạng thái</th><th></th></tr></thead>' +
      '<tbody id="mhRows"></tbody></table></div></div>';
    el.innerHTML = html;
    function render(){
      var tt = $('mhTt').value, hm = $('mhHm').value, kw = ($('mhKw').value||'').toLowerCase();
      var rows = list.filter(function(x){ return (!tt||x.trang_thai===tt) && (!hm||x.hang_muc===hm); });
      if (kw) rows = rows.filter(function(x){
        return (x.noi_dung||'').toLowerCase().indexOf(kw)!==-1 ||
               (x.nha_cung_cap||'').toLowerCase().indexOf(kw)!==-1;
      });
      state.mhHienThi = rows;
      $('mhRows').innerHTML = rows.length ? rows.map(function(x){
        var act = '';
        if (x.trang_thai==='cho_duyet')
          act = '<button class="btn btn-success btn-sm" data-a="ok" data-id="'+x.id+'">Duyệt</button> ' +
                '<button class="btn btn-danger btn-sm" data-a="no" data-id="'+x.id+'">Từ chối</button>';
        else if (x.trang_thai==='da_duyet')
          act = '<button class="btn btn-primary btn-sm" data-a="tt" data-id="'+x.id+'">Tạo phiếu TT</button>';
        return '<tr'+(x.vuot_dinh_muc?' class="row-alert"':'')+'>' +
          '<td>'+esc(x.ngay_de_nghi||'')+'</td>' +
          '<td>'+esc(LOAI_DN[x.loai]||x.loai||'')+'</td>' +
          '<td><b>'+esc(x.hang_muc||'')+'</b></td>' +
          '<td>'+esc(x.noi_dung||'')+'</td>' +
          '<td class="num">'+fmt(x.so_luong)+'</td>' +
          '<td class="num">'+fmt(x.don_gia)+'</td>' +
          '<td class="num"><b>'+fmt(x.so_tien)+'</b></td>' +
          '<td>'+esc(x.nha_cung_cap||'')+'</td>' +
          '<td>'+badge(x.trang_thai, TT_DN)+'</td>' +
          '<td class="actions">'+act+'</td></tr>';
      }).join('') : '<tr><td colspan="10" class="empty">Không có đề nghị.</td></tr>';
      el.querySelectorAll('button[data-a]').forEach(function(b){
        b.addEventListener('click', function(){
          var id = b.dataset.id, a = b.dataset.a;
          if (a==='ok') {
            if (!confirm('Duyệt đề nghị này?')) return;
            safeApi('approveDeNghi', {id:id}).then(function(r){ if(r){toast('Đã duyệt.','success'); loadProjectTab('muahang');} });
          } else if (a==='no') {
            var ly = prompt('Lý do từ chối:'); if (ly===null) return;
            safeApi('rejectDeNghi', {id:id, ly_do:ly}).then(function(r){ if(r){toast('Đã từ chối.','success'); loadProjectTab('muahang');} });
          } else if (a==='tt') {
            openThanhToanModal(id);
          }
        });
      });
    }
    render();
    $('mhTt').onchange = render;
    $('mhHm').onchange = render;
    $('mhKw').oninput = render;
    $('btnNewDN').onclick = openDeNghiModal;
    $('btnXlsMH').onclick = function(){
      xls('muahang', 'Mua hàng — '+state.project.ma_du_an,
        ['Ngày','Loại','Hạng mục','Nội dung','SL','ĐG','Thành tiền','NCC','Trạng thái'],
        (state.mhHienThi||[]).map(function(x){
          return [x.ngay_de_nghi||'', LOAI_DN[x.loai]||x.loai||'', x.hang_muc||'', x.noi_dung||'',
            x.so_luong, x.don_gia, x.so_tien, x.nha_cung_cap||'', (TT_DN[x.trang_thai]||[x.trang_thai])[0]];
        }));
    };
  });
}

function openTienDoModal(list){
  var rows = list && list.length ? list : [{hang_muc:'',cong_viec:'',nguoi_phu_trach:'',ngay_bat_dau:'',ngay_ket_thuc:'',phan_tram:0}];
  openModal('Cập nhật tiến độ',

    '<div id="tdRows"></div>' +
    '<button class="btn btn-ghost btn-sm" id="tdAdd">+ Thêm công việc</button>',
    '<button class="btn btn-ghost" id="mCancel">Hủy</button>' +
    '<button class="btn btn-primary" id="mSave">Lưu</button>');
  $('mCancel').onclick = closeModal;
  function addRow(t){
    t = t || {};
    var div = document.createElement('div');
    div.className = 'f-row';
    div.style.marginBottom = '8px';
    div.innerHTML =
      '<div class="f-group" style="flex:2"><input class="tdHm" placeholder="Hạng mục" value="'+esc(t.hang_muc||'')+'"></div>'+
      '<div class="f-group" style="flex:3"><input class="tdCv" placeholder="Công việc" value="'+esc(t.cong_viec||'')+'"></div>'+
      '<div class="f-group" style="flex:2"><input class="tdPt" placeholder="Phụ trách" value="'+esc(t.nguoi_phu_trach||'')+'"></div>'+
      '<div class="f-group"><input class="tdBd" type="date" value="'+esc(t.ngay_bat_dau||'')+'"></div>'+
      '<div class="f-group"><input class="tdKt" type="date" value="'+esc(t.ngay_ket_thuc||'')+'"></div>'+
      '<div class="f-group" style="max-width:70px"><input class="tdPc" type="number" placeholder="%" value="'+esc(t.phan_tram||'')+'"></div>'+
      '<button class="btn btn-ghost btn-sm tdDel" style="align-self:flex-start;margin-top:22px">×</button>';
    div.querySelector('.tdDel').onclick = function(){ div.remove(); };
    $('tdRows').appendChild(div);
  }
  rows.forEach(addRow);
  $('tdAdd').onclick = function(){ addRow({}); };
  $('mSave').onclick = function(){
    var items = [];
    document.querySelectorAll('#tdRows .f-row').forEach(function(r){
      var cv = r.querySelector('.tdCv').value.trim();
      if (!cv) return;
      items.push({
        hang_muc: r.querySelector('.tdHm').value.trim(),
        cong_viec: cv,
        nguoi_phu_trach: r.querySelector('.tdPt').value.trim(),
        ngay_bat_dau: r.querySelector('.tdBd').value,
        ngay_ket_thuc: r.querySelector('.tdKt').value,
        phan_tram: Number(r.querySelector('.tdPc').value)||0,
        trang_thai: 'dang_lam'
      });
    });
    if (!items.length) { toast('Nhập ít nhất 1 công việc.','error'); return; }
    safeApi('saveTienDo', {ma_du_an:state.project.ma_du_an, items:items})
      .then(function(r){ if(r){closeModal(); toast('Đã lưu.','success'); loadProjectTab('tiendo');} });

    html += '</div>';

    html += '<div class="card"><h2>Phát sinh chờ duyệt ('+pss.length+')</h2>';
    if (!pss.length) html += '<div class="empty">Không có.</div>';

      pss.forEach(function(x){
        html += '<tr><td><b>'+esc(x.hang_muc||'')+'</b></td>' +
          '<td>'+esc(x.ly_do||'')+'</td>' +
          '<td class="num"><b>'+fmt(x.so_tien)+'</b></td>' +
          '<td class="actions">' +
          '<button class="btn btn-success btn-sm" data-k="ps_ok" data-id="'+x.id+'">Duyệt</button> ' +
          '<button class="btn btn-danger btn-sm" data-k="ps_no" data-id="'+x.id+'">Từ chối</button></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';

    var tts = d.thanh_toan||[];
    html += '<div class="card"><h2>Phiếu thanh toán chờ duyệt ('+tts.length+')</h2>';
    if (!tts.length) html += '<div class="empty">Không có.</div>';
    else {
      html += '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>Mã</th><th>Nội dung</th><th class="num">Số tiền</th><th></th></tr></thead><tbody>';
      tts.forEach(function(x){
        html += '<tr><td><b>'+esc(x.id)+'</b></td>' +
          '<td>'+esc(x.noi_dung||'')+'</td>' +
          '<td class="num"><b>'+fmt(x.so_tien)+'</b></td>' +
          '<td class="actions">' +
          '<button class="btn btn-success btn-sm" data-k="tt_ok" data-id="'+x.id+'">Duyệt</button> ' +
          '<button class="btn btn-danger btn-sm" data-k="tt_no" data-id="'+x.id+'">Từ chối</button></td></tr>';

        var k = b.dataset.k, id = b.dataset.id, v = b.dataset.v;
        var ok = k.indexOf('_ok')!==-1 || k==='dt';
        if (ok && !confirm('Xác nhận duyệt?')) return;
        var ly = '';
        if (!ok) { ly = prompt('Lý do từ chối:'); if (ly===null) return; }
        var p;
        if (k==='dt') p = safeApi('approveDuTru', {ma_du_an:state.project.ma_du_an, phien_ban:Number(v)});
        else if (k.indexOf('dn_')===0) p = ok ? safeApi('approveDeNghi', {id:id}) : safeApi('rejectDeNghi', {id:id, ly_do:ly});
        else if (k.indexOf('ps_')===0) p = ok ? safeApi('approvePhatSinh', {id:id}) : safeApi('rejectPhatSinh', {id:id, ly_do:ly});
        else if (k.indexOf('tt_')===0) p = ok ? safeApi('approveThanhToan', {id:id}) : safeApi('rejectThanhToan', {id:id, ly_do:ly});
        if (p) p.then(function(r){ if(r){toast(ok?'Đã duyệt.':'Đã từ chối.','success'); loadProjectTab('pheduyet');} });
      });
    });
  });
}

function docSoTien(n){
  n = Math.round(Math.abs(Number(n)||0));
  if (!n) return 'Không đồng';
  var chu = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  function d3(x){
    var s='', t=Math.floor(x/100), du=x%100, c=Math.floor(du/10), d=du%10;
    if (t){ s=chu[t]+' trăm'; if(!c&&d) s+=' lẻ'; }
    if (c>1){ s+=(s?' ':'')+chu[c]+' mươi'; if(d===1)s+=' mốt'; else if(d===5)s+=' lăm'; else if(d)s+=' '+chu[d]; }
    else if (c===1){ s+=(s?' ':'')+'mười'; if(d===5)s+=' lăm'; else if(d)s+=' '+chu[d]; }
    else if (d) s+=(s?' ':'')+chu[d];
    return s;
  }
  var p=[], ty=Math.floor(n/1e9), tr=Math.floor((n%1e9)/1e6), ng=Math.floor((n%1e6)/1e3), dv=n%1e3;
  if (ty) p.push(d3(ty)+' tỷ');
  if (tr) p.push(d3(tr)+' triệu');
  if (ng) p.push(d3(ng)+' nghìn');
  if (dv||!p.length) p.push(d3(dv));
  var s = p.join(' ');
  return s.charAt(0).toUpperCase()+s.slice(1)+' đồng';
}
