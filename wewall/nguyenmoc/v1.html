<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nguyễn Mộc - Chấm Công Thợ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDF8F3; --text:#4E342E; --accent:#FF6F00; --muted:#8D6E63; --border:#EDE2D8; --dark:#3E2723;
  --active-bg:#FFE0B2; --card:#fff;
}
*{box-sizing:border-box; font-family:Inter,Arial,sans-serif}
body{margin:0; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column}
.hidden{display:none!important}
.card{background:var(--card); border:1px solid var(--border); border-radius:20px; box-shadow:0 2px 12px rgba(78,52,46,.06); padding:16px}
.badge{padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; display:inline-block}
.badge.duyet{background:#E8F5E9; color:#2E7D32}
.badge.cho{background:#FFF8E1; color:#F57F17}
.badge.tuchoi{background:#FFEBEE; color:#C62828}

/* Layout */
#app{display:flex; min-height:100vh}
#sidebar{width:120px; background:#fff; border-right:1px solid var(--border); position:fixed; left:0; top:0; bottom:0; display:flex; flex-direction:column; padding:12px 8px; gap:6px; z-index:20}
#sidebar .logo{font-weight:800; font-size:13px; text-align:center; line-height:1.2; margin-bottom:8px; color:var(--dark)}
#sidebar button{border:none; background:transparent; padding:10px 6px; border-radius:12px; font-size:13px; color:var(--text); cursor:pointer; text-align:center; font-weight:600}
#sidebar button.active{background:var(--active-bg); color:var(--dark)}
#main{margin-left:120px; flex:1; padding:16px 16px 90px 16px; max-width:100%}
footer{position:fixed; bottom:0; left:120px; right:0; background:var(--dark); color:#fff; font-size:11px; text-align:center; padding:8px 6px; line-height:1.4; z-index:15}
footer div{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* Login */
#loginPage{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg)}
.login-box{width:100%; max-width:380px}
.login-header{text-align:center; margin-bottom:18px}
.login-header h1{margin:0; font-size:26px; letter-spacing:.5px; color:var(--dark)}
.login-header p{margin:2px 0; font-size:13px; color:var(--muted)}
.tabs{display:flex; gap:8px; margin-bottom:12px}
.tabs button{flex:1; padding:10px; border-radius:12px; border:1px solid var(--border); background:#fff; font-weight:700; cursor:pointer}
.tabs button.active{background:var(--dark); color:#fff}
.input{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); font-size:15px; outline:none}
.btn{width:100%; padding:12px; border-radius:14px; border:none; background:var(--accent); color:#fff; font-weight:800; font-size:15px; cursor:pointer}
.btn:disabled{opacity:.5}
.demo-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px}
.demo-grid button{padding:8px; border-radius:10px; border:1px dashed var(--border); background:#fff; font-size:12px; cursor:pointer}

/* Bang cong grid */
.table-wrap{overflow:auto; border:1px solid var(--border); border-radius:16px; background:#fff}
table{border-collapse:collapse; width:100%; min-width:900px}
thead th{background:var(--text); color:#fff; padding:8px 4px; font-size:11px; position:sticky; top:0; z-index:2}
th.sticky-left{position:sticky; left:0; z-index:3; background:var(--text)}
th.sticky-right{position:sticky; right:0; z-index:3}
th.sticky-right.sum{background:var(--dark)}
td.sticky-left{position:sticky; left:0; background:#fff; z-index:1; width:180px; min-width:180px; font-weight:700; text-align:left!important; padding-left:10px!important}
td.sticky-right{position:sticky; background:#fff; z-index:1}
tr:nth-child(even) td{background:#FFFBF7}
td{padding:6px 4px; border:1px solid var(--border); text-align:center; font-size:12px; min-width:36px}
td.co{background:#E8F5E9} td.cho-cell{background:#FFF8E1} td.x{background:#FFEBEE}
.bottom-sheet{position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:20px 20px 0 0; max-height:70vh; overflow:auto; padding:12px; z-index:100; border:1px solid var(--border); box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:99}
.search{width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px}
.avatar{width:48px; height:48px; border-radius:50%; object-fit:cover; background:#eee}
@media(max-width:768px){
  #sidebar{width:100%; height:auto; position:fixed; bottom:50px; top:auto; flex-direction:row; overflow:auto; border-right:none; border-top:1px solid var(--border); padding:6px}
  #sidebar .logo{display:none}
  #sidebar button{white-space:nowrap}
  #main{margin-left:0; padding-bottom:120px}
  footer{left:0; bottom:0}
}
</style>
</head>
<body>

<div id="loginPage">
  <div class="login-box">
    <div class="login-header">
      <h1>NGUYỄN MỘC</h1>
      <p>CÔNG TY TNHH SXTM</p>
      <p style="font-weight:800; color:var(--accent)">CHẤM CÔNG THỢ</p>
    </div>
    <div class="card">
      <div class="tabs">
        <button id="tabMa" class="active" onclick="setLoginTab('ma')">Mã thợ</button>
        <button id="tabSdt" onclick="setLoginTab('sdt')">Số điện thoại</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px">
        <input id="inpId" class="input" placeholder="Mã thợ (vd: nbatam)">
        <input id="inpPass" type="password" class="input" placeholder="Mật khẩu">
        <button class="btn" onclick="doLogin()">Đăng nhập</button>
        <div id="loginMsg" style="font-size:12px; color:#C62828; text-align:center"></div>
      </div>
      <div class="demo-grid">
        <button onclick="demoLogin('Thợ')">Xem thử: Thợ</button>
        <button onclick="demoLogin('Quản Lý')">Xem thử: Quản Lý</button>
        <button onclick="demoLogin('Kế Toán')">Xem thử: Kế Toán</button>
        <button onclick="demoLogin('Giám đốc')">Xem thử: Giám đốc</button>
      </div>
      <div style="margin-top:10px">
        <details><summary style="font-size:12px; cursor:pointer">Cấu hình kết nối</summary>
          <div style="display:flex; flex-direction:column; gap:6px; margin-top:8px">
            <input id="cfgUrl" class="input" placeholder="Web App URL (https://script.google.com/...)">
            <input id="cfgKey" class="input" placeholder="API Key">
            <button class="btn" style="background:var(--dark)" onclick="saveCfg()">Lưu cấu hình</button>
          </div>
        </details>
      </div>
    </div>
    <div style="text-align:center; font-size:11px; margin-top:12px; color:var(--muted)">© 2026 WeWall Group · Nguyen Moc Co. LTD | Le Ha<br>Hệ thống Chấm công Nội bộ v1.0.0</div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="sidebar">
    <div class="logo">NGUYỄN<br>MỘC</div>
    <div id="nav"></div>
    <button style="margin-top:auto" onclick="logout()">Đăng xuất</button>
  </div>
  <div id="main"></div>
  <footer>
    <div>© 2026 WeWall Group · Nguyen Moc Co. LTD | Le Ha</div>
    <div>Hệ thống Chấm công Nội bộ v1.0.0</div>
  </footer>
</div>

<div id="sheetRoot"></div>

<script>
const LS_KEY='nm_session_v1'; const CFG_KEY='nm_cfg_v1';
let cfg = JSON.parse(localStorage.getItem(CFG_KEY)||'{}');
let session = JSON.parse(localStorage.getItem(LS_KEY)||'null');
let currentUser=null; let loginTab='ma'; let demoMode=false;
let currentThang = new Date().toISOString().slice(0,7);

document.getElementById('cfgUrl').value = cfg.url||'';
document.getElementById('cfgKey').value = cfg.apiKey||'';

function setLoginTab(t){
  loginTab=t;
  document.getElementById('tabMa').classList.toggle('active', t==='ma');
  document.getElementById('tabSdt').classList.toggle('active', t==='sdt');
  document.getElementById('inpId').placeholder = t==='ma' ? 'Mã thợ (vd: nbatam)' : 'Số điện thoại';
}
function saveCfg(){
  cfg.url = document.getElementById('cfgUrl').value.trim();
  cfg.apiKey = document.getElementById('cfgKey').value.trim();
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
  alert('Đã lưu cấu hình');
}
async function api(action, extra={}){
  if(!cfg.url || !cfg.apiKey){ throw new Error('Chưa cấu hình Web App URL / API Key'); }
  const body = {apiKey: cfg.apiKey, token: session?.token, action, ...extra};
  const res = await fetch(cfg.url, {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(body)});
  const j = await res.json();
  if(!j.ok) throw new Error(j.error||'Lỗi API');
  return j.data!==undefined? j.data : j;
}
function fmtMoney(n){
  if(n==null||n==='') return '';
  const num = Number(String(n).replace(/[^0-9]/g,''));
  if(isNaN(num)) return n;
  return num.toLocaleString('vi-VN')+'₫';
}
function parseDonGiaInput(v, fullMode){
  let s = String(v).replace(/[^0-9]/g,'');
  if(!s) return 0;
  if(fullMode) return Number(s);
  return Number(s)*1000;
}
function formatPhone(d){
  let s = String(d||'').replace(/\D/g,'');
  if(s.length==10) return s.slice(0,3)+' '+s.slice(3,7)+' '+s.slice(7);
  return d;
}
function showApp(){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderNav();
  route('dashboard');
}
function renderNav(){
  const quyen = currentUser?.quyen||[];
  const vaiTro = currentUser?.vaiTro||'Thợ';
  const allTabs = [
    {id:'dashboard', label:'Dashboard', need:null},
    {id:'chamcong', label:'Chấm công', need:null, tho:true},
    {id:'lichsu', label:'Lịch sử', need:null, tho:true},
    {id:'duyet', label:'Duyệt công', need:'duyet_cong'},
    {id:'bangcong', label:'Bảng công', need:'bang_cong'},
    {id:'dstho', label:'Danh sách thợ', need:'nhan_su'},
    {id:'dukien', label:'Dự kiến trả', need:'dashboard'},
    {id:'thongke', label:'Thống kê', need:'thong_ke'},
    {id:'nhatky', label:'Nhật ký', need:'cai_dat'},
    {id:'cauhinh', label:'Cấu hình', need:'cai_dat'},
    {id:'thongtin', label:'Thông tin', need:null, tho:true},
  ];
  let tabs = [];
  if(vaiTro==='Thợ'){
    tabs = allTabs.filter(t=>t.tho);
  }else{
    tabs = allTabs.filter(t=>{
      if(t.need===null) return true;
      return quyen.includes(t.need) || vaiTro==='Giám đốc';
    });
    // Thợ tabs luôn có thêm cho quản lý nếu muốn
    if(!tabs.find(x=>x.id==='chamcong')) tabs.splice(1,0, allTabs.find(x=>x.id==='chamcong'));
  }
  document.getElementById('nav').innerHTML = tabs.map(t=>`<button id="nav-${t.id}" onclick="route('${t.id}')">${t.label}</button>`).join('');
}
async function route(id){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));
  const nb = document.getElementById('nav-'+id); if(nb) nb.classList.add('active');
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card">Đang tải...</div>';
  try{
    if(id==='dashboard') await pageDashboard();
    else if(id==='chamcong') await pageChamCong();
    else if(id==='lichsu') await pageLichSu();
    else if(id==='duyet') await pageDuyet();
    else if(id==='bangcong') await pageBangCong();
    else if(id==='dstho') await pageDsTho();
    else if(id==='dukien') await pageDuKien();
    else if(id==='thongke') await pageThongKe();
    else if(id==='nhatky') await pageNhatKy();
    else if(id==='cauhinh') await pageCauHinh();
    else if(id==='thongtin') await pageThongTin();
  }catch(e){ main.innerHTML = `<div class="card" style="color:#C62828">${e.message}</div>`; }
}
async function doLogin(){
  const ident = document.getElementById('inpId').value.trim();
  const pass = document.getElementById('inpPass').value;
  document.getElementById('loginMsg').textContent='';
  if(!ident||!pass){ document.getElementById('loginMsg').textContent='Nhập đủ thông tin'; return; }
  try{
    const data = await api('login', {maTho: ident, matKhau: pass});
    session = {token: data.token, han: Date.now()+7*24*3600*1000};
    localStorage.setItem(LS_KEY, JSON.stringify(session));
    currentUser = data.tho;
    demoMode=false;
    showApp();
  }catch(e){ document.getElementById('loginMsg').textContent=e.message; }
}
function demoLogin(role){
  demoMode=true;
  currentUser={maTho:'DEMO', hoTen:'Demo '+role, sdt:'0980000000', vaiTro:role, quyen: role==='Giám đốc'?['dashboard','bang_cong','sua_cong','duyet_cong','nhan_su','thong_ke','xuat_excel','cai_dat']: role==='Quản Lý'?['dashboard','bang_cong','duyet_cong','nhan_su','thong_ke','xuat_excel']: role==='Kế Toán'?['dashboard','bang_cong','thong_ke','xuat_excel']:[] , donGia:300000};
  session={token:'demo', han: Date.now()+3600*1000};
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('main').innerHTML = '<div class="card" style="background:#FFF8E1">Đang ở chế độ <b>Xem thử: '+role+'</b> - không ghi backend. <button onclick="location.reload()">Thoát xem thử</button></div>';
  renderNav();
  route('dashboard');
}
async function checkSession(){
  if(!session) return false;
  if(Date.now() > session.han){ localStorage.removeItem(LS_KEY); return false; }
  if(session.token==='demo') return false;
  try{
    const me = await api('me', {});
    currentUser = me;
    return true;
  }catch(e){
    // lỗi mạng thì giữ session
    if(String(e.message).includes('fetch') || String(e.message).includes('Network')){
      return true;
    }
    return false;
  }
}
function logout(){ localStorage.removeItem(LS_KEY); location.reload(); }

// ===== PAGES =====
async function pageDashboard(){
  const main=document.getElementById('main');
  if(demoMode){ main.innerHTML='<div class="card">Dashboard demo - Dự kiến trả thợ tháng, thợ đi làm hôm nay/tổng, chờ duyệt...</div>'; return; }
  const d = await api('dashboard',{});
  const gioMo = await api('get_config_public',{}).then(r=>r.gioMo||'05:00').catch(()=> '05:00');
  main.innerHTML = `
  ${demoMode?'<div class="card" style="background:#FFF8E1">Xem thử</div>':''}
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
    <div class="card"><div style="font-size:12px; color:var(--muted)">Thợ đi làm hôm nay</div><div style="font-size:22px; font-weight:800">${d.diLamHomNay}/${d.tongTho}</div></div>
    <div class="card"><div style="font-size:12px; color:var(--muted)">Chờ duyệt</div><div style="font-size:22px; font-weight:800; color:#F57F17">${d.choDuyet}</div></div>
    <div class="card"><div style="font-size:12px">Tổng công đã duyệt tháng ${d.thang}</div><div style="font-size:22px; font-weight:800; color:#2E7D32">${d.tongDaDuyetThang}</div></div>
    <div class="card"><div style="font-size:12px">Tạm tính tháng này (bạn)</div><div style="font-size:18px; font-weight:800">${fmtMoney(d.tamTinhThang)}<br><small style="font-weight:400; font-size:11px">tạm tính, chưa phải lương chốt</small></div></div>
  </div>
  ${d.thieuDonGia.length? `<div class="card" style="margin-top:12px"><b>Cảnh báo:</b> ${d.thieuDonGia.length} thợ chưa có đơn giá: ${d.thieuDonGia.map(x=>x.hoTen).join(', ')}</div>`:''}
  <div class="card" style="margin-top:12px">Giờ mở chấm công: <b>${gioMo}</b></div>
  `;
}

async function pageChamCong(){
  const main=document.getElementById('main');
  const today = new Date().toLocaleDateString('vi-VN',{weekday:'long', day:'2-digit', month:'2-digit', year:'numeric'});
  const gioMo = await api('get_config_public',{}).then(r=>r.gioMo||'05:00').catch(()=> '05:00');
  const nowH = new Date().getHours()*60 + new Date().getMinutes();
  const [gm, gp] = gioMo.split(':').map(Number); const moMins = gm*60+(gp||0);
  const isOpen = nowH >= moMins;
  const lichSu = demoMode?[]: await api('lich_su',{thang: currentThang}).catch(()=>[]);
  const daChamHomNay = lichSu.some(r=> r.ngayCong===new Date().toISOString().slice(0,10));
  const tamTinh = demoMode?0: await api('dashboard',{}).then(d=>d.tamTinhThang).catch(()=>0);

  main.innerHTML = `
  <div class="card" style="text-align:center">
    <div style="font-size:13px; color:var(--muted)">${today}</div>
    <div style="font-weight:800; margin-top:4px">${currentUser.hoTen} • ${currentUser.maTho} • ${formatPhone(currentUser.sdt)}</div>
    <div style="margin:14px 0">
      <button class="btn" style="padding:18px; font-size:18px; border-radius:18px" ${(!isOpen||daChamHomNay)?'disabled':''} onclick="handleChamCongClick()">${daChamHomNay?'ĐÃ CHẤM HÔM NAY':'CHẤM CÔNG HÔM NAY'}</button>
      ${!isOpen? `<div style="margin-top:8px; color:#F57F17; font-size:12px">Chưa đến giờ chấm công (sau ${gioMo})</div>` : ''}
      ${daChamHomNay? `<div style="margin-top:8px; color:#2E7D32; font-size:12px">Bạn đã chấm công hôm nay</div>`:''}
    </div>
    <div class="card" style="background:#FFFBF7">Tạm tính tháng này: <b>${fmtMoney(tamTinh)}</b><br><small>tạm tính, chưa phải lương chốt</small></div>
  </div>
  <div class="card" style="margin-top:12px">
    <b>Lịch sử gần đây</b>
    <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px">
      ${lichSu.slice(0,5).map(r=>`<div style="display:flex; justify-content:space-between; font-size:13px"><span>${r.ngayCong}</span><span class="badge ${r.trangThai==='Đã duyệt'?'duyet': r.trangThai==='Chờ duyệt'?'cho':'tuchoi'}">${r.trangThai}</span></div>`).join('') || '<small>Chưa có</small>'}
    </div>
  </div>
  `;
}

async function handleChamCongClick(){
  if(demoMode){ alert('Demo không ghi backend'); return; }
  if(!navigator.geolocation){ if(!confirm('Không lấy được GPS, vẫn chấm công?')) return; doCham({}); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    doCham({viDo: pos.coords.latitude, kinhDo: pos.coords.longitude, doChinhXac: pos.coords.accuracy});
  }, err=>{ if(confirm('GPS lỗi: '+err.message+' - Vẫn chấm công?')) doCham({}); }, {enableHighAccuracy:true, timeout:10000});
}
async function doCham(gps){
  try{
    const res = await api('cham_cong',{...gps, ngayCong: new Date().toISOString().slice(0,10)});
    alert('Chấm công thành công: '+res.ngayCong);
    route('chamcong');
  }catch(e){ alert(e.message); }
}

async function pageLichSu(){
  const main=document.getElementById('main');
  if(demoMode){ main.innerHTML='<div class="card">Lịch sử demo</div>'; return; }
  const data = await api('lich_su',{thang: currentThang});
  main.innerHTML = `
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center">
      <b>Lịch sử chấm công - ${currentThang}</b>
      <input type="month" value="${currentThang}" onchange="currentThang=this.value; route('lichsu')" style="padding:6px; border-radius:8px; border:1px solid var(--border)">
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:12px">
      ${data.map(r=>`
        <div style="border:1px solid var(--border); border-radius:14px; padding:10px">
          <div style="display:flex; justify-content:space-between"><b>${r.ngayCong}</b><span class="badge ${r.trangThai==='Đã duyệt'?'duyet': r.trangThai==='Chờ duyệt'?'cho':'tuchoi'}">${r.trangThai}</span></div>
          <div style="font-size:12px; color:var(--muted)">Gửi: ${new Date(r.thoiDiemGui).toLocaleString('vi-VN')} ${r.viDo?`• GPS ${Number(r.viDo).toFixed(4)}, ${Number(r.kinhDo).toFixed(4)} (±${r.doChinhXac}m)`:''}</div>
          ${r.viDo? `<div style="margin-top:6px"><a href="https://maps.google.com/?q=${r.viDo},${r.kinhDo}" target="_blank" style="font-size:12px; color:var(--accent)">📍 Bản đồ</a> <iframe style="width:100%; height:140px; border:none; border-radius:10px; margin-top:6px" loading="lazy" src="https://maps.google.com/maps?q=${r.viDo},${r.kinhDo}&z=15&output=embed"></iframe></div>`:''}
          ${r.lyDoTuChoi? `<div style="font-size:12px; color:#C62828; margin-top:4px">Lý do từ chối: ${r.lyDoTuChoi}</div>`:''}
        </div>
      `).join('') || '<small>Không có dữ liệu</small>'}
    </div>
  </div>
  `;
}

async function pageDuyet(){
  const main=document.getElementById('main');
  if(demoMode){ main.innerHTML='<div class="card">Duyệt công demo</div>'; return; }
  const all = await api('lich_su',{thang: currentThang}); // sẽ lấy tất cả nếu quyền

  let choDuyet=[];

async function xuatExcel(){
  const data = window._bangData; if(!data) return;
  let csv = ['Mã thợ,Họ tên,'+Array.from({length:31},(_,i)=>i+1).join(',')+',Đã duyệt,Đơn giá,Tạm tính'];
  data.rows.forEach(r=>{ csv.push([r.maTho, `"${r.hoTen}"`, ...r.days, r.daDuyet, r.donGia, r.tamTinh].join(',')); });
  const blob = new Blob([csv.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='bang_cong_'+currentThang+'.csv'; a.click();
}

async function submitTho(isEdit){
  const ma=document.getElementById('fMa').value.trim(); const ten=document.getElementById('fTen').value.trim(); const sdt=document.getElementById('fSdt').value.trim(); const email=document.getElementById('fEmail').value.trim(); const vaiTro=document.getElementById('fVaiTro').value; const donGiaRaw=document.getElementById('fDonGia').value; const full=document.getElementById('fFull').checked; const phanLoai=document.getElementById('fPhanLoai').value; const ghiChu=document.getElementById('fGhiChu').value;
  const quyen=[...document.querySelectorAll('.bottom-sheet input[type=checkbox][value]')].filter(c=>c.checked && c.value).map(c=>c.value);
  let donGia = parseDonGiaInput(donGiaRaw, full);
  let anhUrl='';
  const fileInput=document.getElementById('fAnh');
  if(fileInput.files[0]){
    anhUrl = await resizeImage(fileInput.files[0]);
  }
  try{
    await api('upsert_tho',{tho:{maTho:ma, hoTen:ten, sdt:sdt, email:email, vaiTro:vaiTro, donGia:donGia, phanLoai:phanLoai, quyen:quyen, ghiChu:ghiChu, anh: anhUrl||undefined}});
    alert('Đã lưu'); closeSheet(); route('dstho');
  }catch(e){ alert(e.message); }
}
function resizeImage(file){
  return new Promise(res=>{
    const img=new Image(); const reader=new FileReader();
    reader.onload=e=>{ img.src=e.target.result; img.onload=()=>{ const canvas=document.createElement('canvas'); const max=400; let w=img.width, h=img.height; if(w>max||h>max){ const ratio=Math.min(max/w,max/h); w*=ratio; h*=ratio; } canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h); res(canvas.toDataURL('image/jpeg',0.7)); }; }; reader.readAsDataURL(file);
  });
}
