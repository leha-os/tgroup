<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nguyễn Mộc - Chấm Công</title>
  <style>
    /* =========================================================
       ZONE 09 — CSS / DESIGN TOKENS
       ========================================================= */
    :root {
      --bg-color: #FDF8F3;
      --text-brown: #4E342E;
      --accent-orange: #FF6F00;
      --accent-light: #FFE0B2;
      --light-brown: #8D6E63;
      --border-color: #EDE2D8;
      --dark-brown: #3E2723;
      
      --badge-duyet-bg: #E8F5E9; --badge-duyet-txt: #2E7D32;
      --badge-cho-bg: #FFF8E1; --badge-cho-txt: #F57F17;
      --badge-tu-choi-bg: #FFEBEE; --badge-tu-choi-txt: #C62828;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-brown); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }

    /* --- TYPOGRAPHY & UTILITIES --- */
    h2 { color: var(--dark-brown); font-size: 24px; font-weight: bold; margin-bottom: 5px; }
    p.subtitle { color: var(--light-brown); font-size: 13px; margin-bottom: 25px; line-height: 1.4; }
    
    /* --- CARD COMPONENT --- */
    .card {
      background: #FFFFFF;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(62, 39, 35, 0.04);
      padding: 30px;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    /* --- FORMS & INPUTS --- */
    .input-group { margin-bottom: 15px; }
    .input-group input {
      width: 100%; padding: 14px 16px; border-radius: 12px;
      border: 1px solid var(--border-color); background: #FAFAFA;
      font-size: 15px; color: var(--text-brown); transition: all 0.3s;
    }
    .input-group input:focus { border-color: var(--accent-orange); outline: none; background: #FFF; box-shadow: 0 0 0 3px rgba(255, 111, 0, 0.1); }
    
    .btn {
      background: var(--accent-orange); color: #FFF; border: none; padding: 16px; 
      border-radius: 12px; font-size: 16px; font-weight: bold; width: 100%; 
      cursor: pointer; transition: transform 0.1s, background 0.3s;
      box-shadow: 0 4px 12px rgba(255, 111, 0, 0.2);
    }
    .btn:active { transform: scale(0.98); }
    .btn:hover { background: #E66400; }

    /* --- LAYOUT: MAIN APP --- */
    #app-screen { display: none; flex: 1; display: flex; padding-bottom: 50px; }
    
    /* Sidebar trái 120px */
    .sidebar {
      width: 120px; background: #FFF; border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; align-items: center; padding-top: 20px;
      position: fixed; top: 0; bottom: 50px; left: 0; z-index: 10;
    }
    .nav-item {
      width: 100%; text-align: center; padding: 20px 0; color: var(--light-brown);
      font-size: 14px; font-weight: bold; cursor: pointer; border-left: 4px solid transparent;
      transition: all 0.2s;
    }
    .nav-item.active { background: var(--accent-light); color: var(--dark-brown); border-left-color: var(--accent-orange); }

    /* Main Content */
    .main-content {
      margin-left: 120px; flex: 1; padding: 20px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }

    /* Big Check-in Button */
    .check-in-btn-wrapper { text-align: center; margin: 30px 0; }
    .check-in-circle {
      width: 200px; height: 200px; border-radius: 50%; background: var(--accent-orange);
      color: #FFF; display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(255, 111, 0, 0.3); border: 8px solid #FFF; cursor: pointer;
      margin: 0 auto; transition: transform 0.2s;
    }
    .check-in-circle:active { transform: scale(0.95); box-shadow: 0 5px 15px rgba(255, 111, 0, 0.2); }
    .check-in-circle span { font-size: 22px; font-weight: bold; }
    .check-in-circle small { font-size: 12px; margin-top: 5px; opacity: 0.8; }

    /* Badges */
    .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; }
    .badge-cho { background: var(--badge-cho-bg); color: var(--badge-cho-txt); }
    .badge-duyet { background: var(--badge-duyet-bg); color: var(--badge-duyet-txt); }

    /* Footer */
    .footer {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--dark-brown);
      color: #FFF; text-align: center; padding: 12px 20px; font-size: 11px; z-index: 20;
    }

    /* RESPONSIVE MOBILE */
    @media (max-width: 600px) {
      .sidebar { width: 100%; height: 60px; top: auto; bottom: 50px; flex-direction: row; border-right: none; border-top: 1px solid var(--border-color); padding: 0; }
      .nav-item { padding: 0; display: flex; align-items: center; justify-content: center; height: 100%; border-left: none; border-top: 4px solid transparent; }
      .nav-item.active { border-left-color: transparent; border-top-color: var(--accent-orange); }
      .main-content { margin-left: 0; padding-bottom: 110px; padding-top: 30px; }
      #login-screen { padding: 20px; display: flex; align-items: center; min-height: 100vh; }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       ZONE 08 — UI / HTML (MÀN HÌNH ĐĂNG NHẬP)
       ========================================================= -->
  <div id="login-screen" style="display: flex; flex-direction: column; justify-content: center; flex: 1;">
    <div class="card" style="text-align: center;">
      <h2>NGUYỄN MỘC</h2>
      <p class="subtitle">CÔNG TY TNHH SXTM<br>CHẤM CÔNG THỢ</p>
      
      <div class="input-group">
        <input type="text" id="username" placeholder="Mã thợ hoặc Số điện thoại" autocomplete="off">
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Mật khẩu">
      </div>
      
      <button class="btn" onclick="login()" style="margin-top: 10px;">ĐĂNG NHẬP</button>
      
      <div style="margin-top: 20px; font-size: 13px; color: var(--light-brown);">
        <span style="cursor: pointer; text-decoration: underline;">Xem thử quyền Thợ</span>
      </div>
    </div>
  </div>

  <!-- =========================================================
       ZONE 08 — UI / HTML (MÀN HÌNH CHÍNH - APP)
       ========================================================= -->
  <div id="app-screen" style="display: none;">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="nav-item active">Chấm công</div>
      <div class="nav-item">Lịch sử</div>
      <div class="nav-item">Thông tin</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="card" style="max-width: 500px; text-align: center; padding: 40px 20px;">
        <h3 style="color: var(--text-brown); margin-bottom: 5px;">Xin chào, <span style="color: var(--accent-orange);">NBA Tâm</span></h3>
        <p style="color: var(--light-brown); font-size: 14px;">Thứ Năm, 10 Tháng 10, 2026</p>

        <div class="check-in-btn-wrapper">
          <div class="check-in-circle" onclick="chamCong()">
            <span>CHẤM CÔNG</span>
            <small>HÔM NAY</small>
          </div>
        </div>

        <div style="margin-top: 20px;">
          <p style="font-size: 14px; margin-bottom: 10px;">Trạng thái hôm nay:</p>
          <span class="badge badge-cho">Chờ duyệt lúc 07:15</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Cố định -->
  <div class="footer">
    © 2026 WeWall Group · Nguyen Moc Co. LTD | Le Ha<br>
    Hệ thống Chấm công Nội bộ v1.0.0
  </div>

  <!-- =========================================================
       ZONE 10 — JAVASCRIPT / INTERACTION
       ========================================================= -->
  <script>
    function login() {
      // Demo chuyển màn hình mượt mà
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'flex';
      document.body.style.backgroundColor = 'var(--bg-color)';
    }

    function chamCong() {
      alert('Đã lấy tọa độ GPS. Đang gửi dữ liệu chấm công...');
      // Logic xử lý Fetch POST
    }
  </script>

</body>
</html>
