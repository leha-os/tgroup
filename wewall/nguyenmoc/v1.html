<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nguyễn Mộc - App Chấm Công</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#F8F5F0; --nau:#3E2723; --nau-dam:#1E1410; --cam:#FF6F00;
  --nau-nhat:#9C8B84; --vien:#EFE6DD; --kem:#FFFBF7; --vien-mo:#F3E9DE;
  --xanh:#1B8A3D; --xanh-bg:#E8F6EC; --xanh-vien:#C6EAD0;
  --vang:#C07A00; --vang-bg:#FFF6D6; --do:#D93025; --do-bg:#FDECEA;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; letter-spacing:0!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:#231915;
  font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size:14.5px; line-height:1.55; min-height:100vh;
}
.hidden{display:none!important}

/* Topbar - clean, no blur */
.topbar{
  background:#fff; color:var(--nau-dam);
  padding:12px 18px; position:sticky; top:0; z-index:40;
  margin-left:244px; border-bottom:1px solid var(--vien);
}
.topbar .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.topbar .t1{font-size:14px;font-weight:800}
.topbar .t2{font-size:11px;color:var(--nau-nhat)}
#tbUser{font-weight:700;font-size:13px}
#tbDate{background:var(--bg); border:1px solid var(--vien); padding:4px 10px; border-radius:999px; font-size:11px}

/* Nav toggle */
.nav-toggle{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--vien);
  background:#fff; cursor:pointer; display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;
}
.nav-toggle span{width:18px;height:2px;background:var(--nau-dam);border-radius:99px;display:block}
.nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:55;display:none}
.nav-overlay.open{display:block}

/* Side nav - rounded, slide animation, no icon */
.nav{
  position:fixed; left:12px; top:12px; bottom:12px; width:220px;
  background:linear-gradient(180deg,#211610 0%,#2F201B 100%);
  border:1px solid rgba(255,255,255,.08); z-index:60;
  display:flex; flex-direction:column; border-radius:20px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
  overflow:hidden;
  transition:transform .42s cubic-bezier(.32,.72,0,1);
}
.nav::before{
  content:"NGUYEN MOC\A WEWALL GROUP\A➔ CONG TY TNHH\A SXTM NGUYEN MOC";
  white-space:pre;
  font-weight:800;
  font-size:11px;
  line-height:1.45;
  color:#fff;
  padding:16px 14px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
}
.nav-in{display:flex;flex-direction:column;gap:4px;padding:12px 10px;height:100%;overflow-y:auto}
.nav button{ text-transform:uppercase; font-size:11.5px; 
  border:none; background:transparent; color:rgba(255,255,255,.62);
  font-size:13.5px; font-weight:600; display:flex; align-items:center;
  padding:11px 14px; cursor:pointer; border-radius:12px; text-align:left;
  min-height:44px; width:100%; transition:all .18s ease;
}
.nav button:hover{background:rgba(255,255,255,.06); color:#fff}
.nav button.on{background:#FF6F00; color:#fff; box-shadow:0 6px 16px rgba(255,111,0,.32)}
/* ensure no icon pseudo */
.nav button::before{content:none!important; display:none!important}

/* Content */
#view{margin-left:244px; min-height:100vh}
body.no-nav #view{margin-left:0}
body.no-nav .topbar{margin-left:0}
body.no-nav .nav{display:none!important}
body.no-nav .nav-overlay{display:none!important}
.view{max-width:820px;margin:0 auto;padding:18px 14px 90px}

/* Footer */
.cty-footer{
  position:fixed; bottom:0; left:244px; right:0; z-index:30;
  background:rgba(248,245,240,.94); text-align:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  color:var(--nau-nhat); font-size:11px; line-height:1.5; border-top:1px solid var(--vien-mo);
}
body.no-nav .cty-footer{left:0}

/* Card */
.card{
  background:#fff; border:1px solid var(--vien); border-radius:18px;
  padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.04); margin-bottom:12px;
}
.card h3{margin:0 0 10px;font-size:14.5px;font-weight:700;color:var(--nau-dam)}
.muted{color:var(--nau-nhat);font-size:12.5px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;transition:all .15s}
.btn-cam{background:#FF6F00;color:#fff;width:100%;font-weight:700}
.btn-nau{background:var(--nau-dam);color:#fff}
.btn-trang{background:#fff;color:var(--nau-dam);border:1px solid var(--vien)}
.btn-xanh{background:var(--xanh);color:#fff}
.btn-do{background:var(--do);color:#fff}
.btn-vang{background:#FFB020;color:#3E2723;font-weight:700}
.btn-sm{padding:8px 12px;font-size:13px;min-height:36px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2>*{flex:1; min-width:100px}

/* Form */
label.lbl{display:block;font-size:11px;font-weight:700;color:var(--nau-nhat);margin:12px 0 6px;text-transform:uppercase}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=month],textarea{
  width:100%;border:1px solid var(--vien);border-radius:12px;padding:11px 12px;font-size:14.5px;color:var(--nau-dam);background:#fff;
}
input:focus,textarea:focus{outline:none;border-color:var(--cam);box-shadow:0 0 0 3px rgba(255,111,0,.15)}

/* Badge */
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
.b-cho{background:var(--vang-bg);color:var(--vang)}
.b-duyet{background:var(--xanh-bg);color:var(--xanh)}
.b-tc{background:var(--do-bg);color:var(--do)}
.chip{display:inline-block;background:#fff;border:1px solid var(--vien);color:var(--nau);border-radius:999px;padding:4px 10px;font-size:11px;margin:2px 4px 2px 0}

/* Avatar */
.av{border-radius:50%;object-fit:cover;background:var(--vien);flex:none}

/* Table */
.bc-wrap{overflow:auto;border:1px solid var(--vien);border-radius:14px;background:#fff}
table.bc{border-collapse:collapse;width:100%;min-width:1000px;font-size:11px}
table.bc thead{background:var(--nau);color:#fff}
table.bc th{padding:8px 6px;font-weight:700}
table.bc th.tho{position:sticky;left:0;background:var(--nau);z-index:2;min-width:140px;text-align:left;padding-left:10px}
table.bc th.ngay{width:36px;text-align:center}
table.bc th.tong{position:sticky;right:196px;background:var(--nau-dam);z-index:2;text-align:center;min-width:52px}
table.bc th.dongia{position:sticky;right:104px;background:var(--nau-dam);z-index:2;text-align:center;min-width:92px}
table.bc th.thanhtien{position:sticky;right:0;background:var(--nau-dam);z-index:2;text-align:center;min-width:104px}
table.bc tbody tr{border-bottom:1px solid var(--vien)}
table.bc tbody tr:nth-child(even){background:var(--kem)}
table.bc td{padding:4px;border-right:1px solid rgba(245,237,230,.7)}
table.bc td.tho{position:sticky;left:0;background:#fff;z-index:1;border-right:1px solid var(--vien);padding:8px}
table.bc td.o{text-align:center;font-weight:700}
table.bc td.o1{background:var(--xanh-bg);color:var(--xanh)}
table.bc td.oc{background:var(--vang-bg);color:var(--vang)}
table.bc td.ox{background:var(--do-bg);color:var(--do)}
table.bc td.tong{position:sticky;right:196px;background:var(--bg);z-index:1;font-weight:800;text-align:center;border-left:1px solid var(--vien)}
table.bc td.dongia{position:sticky;right:104px;background:var(--bg);z-index:1;font-weight:700;text-align:center;border-left:1px solid var(--vien)}
table.bc td.thanhtien{position:sticky;right:0;background:var(--bg);z-index:1;font-weight:800;text-align:center;border-left:1px solid var(--vien)}

/* List */
.item{background:#fff;border:1px solid var(--vien);border-radius:12px;padding:10px;margin-bottom:8px}
.item .r1{display:flex;align-items:center;gap:10px}

/* Bottom sheet */
#sheetOv{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:200;display:none}
#sheetOv.open{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);background:#fff;border-radius:18px 18px 0 0;z-index:201;width:100%;max-width:560px;max-height:78vh;display:none;flex-direction:column;transition:transform .32s cubic-bezier(.32,.72,0,1);box-shadow:0 -8px 24px rgba(0,0,0,.12)}
.sheet.open{display:flex;transform:translateX(-50%) translateY(0)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--vien)}
.sheet-h b{color:var(--nau-dam);font-size:16px}
.sheet-x{border:none;background:#EFE9DD;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--nau)}
.sheet-s{padding:10px 16px;border-bottom:1px solid var(--vien)}
.sheet-l{overflow-y:auto;padding:8px 12px 24px}
.sheet-o{width:100%;display:flex;justify-content:space-between;align-items:center;border:none;background:none;padding:13px 10px;font-size:15px;color:var(--nau);border-bottom:1px solid var(--vien-mo);cursor:pointer;text-align:left}
.sheet-o.sel{background:var(--kem);color:var(--nau-dam);font-weight:700}
.dd-btn{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--vien);border-radius:12px;padding:12px;font-size:15px;background:#fff;color:var(--nau);cursor:pointer;margin-bottom:4px}
.dd-btn .arw{font-size:12px}

/* Modal */
#modalOv{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
#modalOv.open{display:flex}
.modal{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:18px;box-shadow:0 16px 40px rgba(0,0,0,.18)}

/* Toast / loading */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--nau-dam);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:300;display:none;max-width:90vw}
#loading{position:fixed;inset:0;background:rgba(248,245,240,.7);z-index:250;display:none;align-items:center;justify-content:center}
.spin{width:36px;height:36px;border:3px solid var(--vien);border-top-color:var(--cam);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#errBox{position:fixed;left:12px;right:12px;bottom:96px;z-index:290;display:none;max-width:520px;margin:0 auto}
.err-in{background:#fff;border:1px solid var(--do);border-left:5px solid var(--do);border-radius:12px;padding:12px 14px;color:var(--nau);box-shadow:0 4px 14px rgba(0,0,0,.12)}

/* Login - fix khung */
.login-wrap{max-width:420px;margin:0 auto;padding:48px 20px 20px;text-align:center}
.brand-nm{font-size:22px;font-weight:800;color:var(--nau)}
.brand-sub{font-size:11px;color:var(--nau-nhat);margin-top:4px;font-weight:600}
.brand-pill{display:inline-block;margin-top:12px;padding:5px 14px;border-radius:999px;background:var(--nau);color:#fff;font-size:11px;font-weight:700}
.login-tabs{display:flex;background:#fff;border:1px solid var(--vien);border-radius:12px;overflow:hidden;margin:18px 0 4px}
.login-tabs button{flex:1;border:none;background:none;padding:12px;font-size:14px;font-weight:700;color:var(--nau-nhat);cursor:pointer}
.login-tabs button.on{background:var(--nau);color:#fff}
.login-card{background:#fff;border:1px solid var(--vien);border-radius:18px;padding:20px;margin-top:12px;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.04)}

/* Misc */
.view{max-width:640px;margin:0 auto;padding:12px 12px 84px}
.big-check{width:100%;border:none;border-radius:18px;background:var(--cam);color:#fff;font-size:16px;font-weight:800;padding:16px;cursor:pointer}
.big-check:disabled{background:#BCAAA4}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#fff;border:1px solid var(--vien);border-radius:14px;padding:10px}
.stat .n{font-size:19px;font-weight:800;color:var(--nau-dam)}
.stat .l{font-size:11px;color:var(--nau-nhat);margin-top:2px}
.warn-box{background:var(--vang-bg);border:1px solid #FFE0B2;border-radius:12px;padding:12px;font-size:13px}
.ok-box{background:var(--xanh-bg);border:1px solid var(--xanh-vien);border-radius:12px;padding:12px;font-size:13px}
.chot-box{margin-top:14px;background:var(--xanh-bg);border:1px solid var(--xanh-vien);border-radius:12px;padding:12px}
.chot-box .t{font-size:12px;font-weight:700;color:var(--xanh)}
.chot-item{font-size:11px;background:#fff;border-radius:8px;padding:8px;border:1px solid var(--xanh-vien);margin-top:6px;display:flex;justify-content:space-between}
.q-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--vien-mo);font-size:13px}
.q-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--cam)}
pre.log{background:var(--nau-dam);color:#FFE0B2;border-radius:12px;padding:12px;font-size:11px;overflow:auto;max-height:220px}

/* Mobile - drawer */
@media (max-width: 900px){
  .nav-toggle{display:flex}
  .nav{left:0;top:0;bottom:0;width:240px;max-width:82vw;border-radius:0 18px 18px 0;transform:translateX(-102%);box-shadow:12px 0 28px rgba(0,0,0,.18)}
  .nav.open{transform:translateX(0)}
  #view,.topbar,.cty-footer{margin-left:0!important;left:0!important}
  .topbar{padding:10px 12px}
  .view{padding:12px 12px 84px}
}
</style>

</head>
<body>
<div id="topbar" class="topbar hidden">
  <div class="row">
    <button id="navToggle" class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    <div><div class="t1">NGUYỄN MỘC</div><div class="t2">App Chấm Công</div></div>
    <div style="text-align:right"><div id="tbUser" style="font-weight:700;font-size:13px"></div><div id="tbDate" class="t2"></div></div>
  </div>
</div>
<div id="view"></div>
<div id="nav" class="nav hidden"><div class="nav-in" id="navIn"></div></div><div id="navOverlay" class="nav-overlay"></div>
<div class="cty-footer">© 2026 WeWall Group · Nguyen Moc Co. LTD | Le Ha<br>Hệ thống Chấm công Nội bộ v1.0.0</div>
<!-- Máy tính cầm tay: ĐÃ BỎ 2026-10-10 theo yêu cầu (giữ code JS/CSS, đánh dấu không sử dụng) -->
<div id="sheetOv"></div>
<div class="sheet" id="sheet"><div class="sheet-h"><b id="sheetT"></b><button class="sheet-x" id="sheetX">✕</button></div><div class="sheet-s hidden" id="sheetS"><input type="text" id="sheetQ" placeholder="Tìm kiếm..."></div><div class="sheet-l" id="sheetL"></div></div>
<div id="modalOv"><div class="modal" id="modalBox"></div></div>
<div id="errBox"><div class="err-in"><b style="color:var(--do)">⚠ Lỗi</b><div id="errMsg" style="margin-top:4px"></div><div class="row2" style="margin-top:10px"><button class="btn btn-sm btn-nau" id="errRetry">Thử lại</button><button class="btn btn-sm btn-trang" id="errClose">Đóng</button></div></div></div>
<div id="toast"></div>
<div id="loading"><div class="spin"></div></div>
<script>
"use strict";
/* =====================================================================
   NGUYỄN MỘC - APP CHẤM CÔNG (frontend vanilla JS, giao diện theo mẫu)
   Backend: Google Apps Script — POST JSON {key, action, token, ...}
   ===================================================================== */
var CFG_KEY='nm_cfg', SES_KEY='nm_sess2';
var cfg=null, sess=null, APP={gioMo:'05:00'};
var THU=['CN','T2','T3','T4','T5','T6','T7'];
var TEN_QUYEN={dashboard:'Xem Dashboard',bang_cong:'Xem Bảng Công',sua_cong:'Sửa Công',duyet_cong:'Duyệt Công',nhan_su:'Quản Lý Nhân Sự',thong_ke:'Xem Thống Kê',xuat_excel:'Xuất Excel',cai_dat:'Quản Lý Cài Đặt'};
/* Việt hóa mã kỹ thuật hiển thị cho người dùng (mục 8, 2026-10-10) */
var TEN_HANH_DONG={SETUP:'Khởi tạo hệ thống',DANG_NHAP:'Đăng nhập',CHAM_CONG:'Chấm công',DUYET:'Duyệt công',TU_CHOI:'Từ chối',DUYET_SHEET:'Duyệt trên sheet',TU_CHOI_SHEET:'Từ chối trên sheet',DUYET_HANG_LOAT:'Duyệt hàng loạt',CHOT_CONG:'Chốt công',DIEU_CHINH_SAU_CHOT:'Điều chỉnh sau chốt',XUAT_EXCEL:'Xuất Excel',VIET_BANG_CONG:'Ghi bảng công',TONG_DU_KIEN:'Tính dự kiến trả thợ',THEM_THO:'Thêm thợ',CAP_NHAT_THO:'Cập nhật thợ',KHOA_THO:'Khóa thợ',MO_THO:'Mở khóa thợ',DAT_LAI_MAT_KHAU:'Đặt lại mật khẩu',SUA_QUYEN:'Sửa quyền',UPLOAD_ANH:'Tải ảnh đại diện',DOI_SHEET:'Đổi file dữ liệu',DOI_API_KEY:'Đổi API key',LUU_CAU_HINH:'Lưu cấu hình',CHAN_SUA_GOC:'Chặn sửa cột gốc'};
var TEN_CAU_HINH={GIO_MO_CHAM_CONG:'Giờ mở chấm công',TOA_DO_XUONG:'Tọa độ xưởng',BAN_KINH_M:'Bán kính (m)'};
var DS_QUYEN=['dashboard','bang_cong','sua_cong','duyet_cong','nhan_su','thong_ke','xuat_excel','cai_dat'];
var TEN_VAITRO={GiamDoc:'Giám đốc',QuanLy:'Quản lý',KeToan:'Kế toán',Tho:'Thợ'};
/* ---------------- utils ---------------- */
function $(id){ return document.getElementById(id); }
function pad(n){ return (n<10?'0':'')+n; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtNum(n){ return Number(n||0).toLocaleString('vi-VN'); }
function fmtTien(n){ return Number(n||0).toLocaleString('vi-VN')+'₫'; }
function fmtNgayVN(y){ var p=String(y||'').split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(y||''); }
function thangJS(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function homNayText(){ var d=new Date(); return THU[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function tenVaiTro(v){ return TEN_VAITRO[v]||v||'—'; }
function badge(tt){ tt=tenTT(tt); if(tt==='Đã duyệt') return '<span class="badge b-duyet">Đã duyệt</span>'; if(tt==='Từ chối') return '<span class="badge b-tc">Từ chối</span>'; return '<span class="badge b-cho">Chờ duyệt</span>'; }
function tenTT(ky){ if(ky==='cho_duyet') return 'Chờ duyệt'; if(ky==='da_duyet') return 'Đã duyệt'; if(ky==='tu_choi') return 'Từ chối'; return ky||''; }
function dinhDangSdt(s){ var d=String(s||'').replace(/[^0-9]/g,''); if(d.length===10&&d.charAt(0)==='0') return d.slice(0,3)+' '+d.slice(3,7)+' '+d.slice(7); return String(s||''); }
function coQ(ma){ if(!sess||!sess.user) return false; if(sess.user.vaiTro==='GiamDoc') return true; return (sess.user.quyen||[]).indexOf(ma)>=0; }
function laGiamDoc(){ return sess&&sess.user&&sess.user.vaiTro==='GiamDoc'; }
function avatarHTML(url,ten,sz){ sz=sz||44; var t=esc(ten||'?'); if(url) return '<img class="av" width="'+sz+'" height="'+sz+'" src="'+esc(url)+'">'; var c=t.trim().charAt(0).toUpperCase()||'?'; return '<span class="av" style="width:'+sz+'px;height:'+sz+'px;display:inline-flex;align-items:center;justify-content:center;background:var(--nau);color:#fff;font-weight:800;font-size:'+Math.round(sz*0.42)+'px">'+esc(c)+'</span>'; }
function loadLS(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function saveLS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
/* ---------------- toast / err / loading ---------------- */
var toastT=null;
function toast(m){ var t=$('toast'); t.textContent=m; t.style.display='block'; if(toastT) clearTimeout(toastT); toastT=setTimeout(function(){ t.style.display='none'; },2600); }
var retryFn=null;
function showErr(m,retry){ $('errMsg').textContent=m; $('errBox').style.display='block'; $('errRetry').style.display=retry?'':'none'; retryFn=retry||null; }
function hideErr(){ $('errBox').style.display='none'; retryFn=null; }
function setLoading(on){ $('loading').style.display=on?'flex':'none'; }
/* ---------------- API ---------------- */
function api(action,data,silent){
  data=data||{}; if(!silent) hideErr(); setLoading(true);
  var payload={key:cfg.apiKey,action:action,token:(sess&&sess.token)||''};
  for(var k in data) payload[k]=data[k];
  var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  var timer=setTimeout(function(){ if(ctrl) ctrl.abort(); },25000);
  var p=fetch(cfg.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:ctrl?ctrl.signal:undefined})
    .then(function(r){ return r.text(); }).then(function(t){ var j; try{ j=JSON.parse(t); }catch(e){ throw new Error('May chu tra ve khong hop le. Kiem tra URL /exec.'); } if(!j.ok){ var e2=new Error(j.error||'Loi khong xac dinh.'); e2.auth=!!j.auth; throw e2; } return j; });
  return p.then(function(j){ clearTimeout(timer); setLoading(false); return j; },
    function(err){
      clearTimeout(timer); setLoading(false);
      if(silent) throw err;
      var m='';
      if(err && err.name==='AbortError'){ m='Het thoi gian cho 25s. Kiem tra: URL /exec dung chua, Deploy -> Anyone, mang.'; }
      else if(err && err.message && err.message.toLowerCase().indexOf('aborted')>=0){ m='Ket noi bi ngat (aborted). Kiem tra URL /exec va quyen Anyone.'; }
      else if(err && err.message && err.message.indexOf('Failed to fetch')>=0){ m='Khong ket noi duoc. Kiem tra URL /exec va Deploy Anyone.'; }
      else { m=(err&&err.message)||'Loi ket noi.'; }
      if(err&&err.auth){ dangXuat(); showErr(m); }
      else showErr(m, function(){ api(action,data).then(function(){}).catch(function(){}); });
      throw err;
    });
}

/* ---------------- máy tính: ĐÃ BỎ 2026-10-10 theo yêu cầu (giữ code, đánh dấu không sử dụng)
var calcExp='';
function calcInit(){
  var keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
  var g=$('calcG'); g.innerHTML='';
  keys.forEach(function(k){
    var b=document.createElement('button'); b.textContent=k;
    if('÷×−+%'.indexOf(k)>=0) b.className='op';
    if(k==='=') b.className='eq';
    b.onclick=function(){ calcNhan(k); };
    g.appendChild(b);
  });
}
function calcNhan(k){
  if(k==='C') calcExp='';
  else if(k==='⌫') calcExp=calcExp.slice(0,-1);
  else if(k==='='){ try{ var r=Function('"use strict";return ('+calcExp.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100')+')')(); calcExp=String(Math.round(r*1e10)/1e10); }catch(e){ calcExp=''; } }
  else calcExp+=k;
  $('calcD').textContent=calcExp||'0';
}
------------------------------------------------------------------ */
/* ---------------- nhập tiền kiểu nghìn đồng ---------------- */
function ganNhapTien(inputId,cheDoId){
  var inp=$(inputId);
  inp.addEventListener('input',function(){
    var cheDo=$(cheDoId)?$(cheDoId).checked:false;
    var d=inp.value.replace(/[^0-9]/g,'');
    if(!d){ inp.dataset.val=''; return; }
    var v=cheDo?parseInt(d,10):parseInt(d,10)*1000;
    inp.dataset.val=String(v);
    inp.value=fmtNum(v);
  });
}
function tienLay(inputId){ var el=$(inputId); return el&&el.dataset.val?parseInt(el.dataset.val,10)||0:0; }
/* ---------------- GPS ---------------- */
function layViTri(cb){
  if(!navigator.geolocation){ cb(null); return; }
  navigator.geolocation.getCurrentPosition(function(p){ cb({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}); },
    function(){ cb(null); },{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
function mapLink(lat,lng){ return 'https://www.google.com/maps?q='+lat+','+lng; }
function mapEmbed(lat,lng){ return '<iframe width="100%" height="180" style="border:0;border-radius:12px;margin-top:8px" loading="lazy" src="https://www.google.com/maps?q='+lat+','+lng+'&z=16&output=embed"></iframe>'; }

  $('btnOut').onclick=dangXuat;
  $('btnDoiAnh').onclick=function(){ $('fileAnh').click(); };
  $('fileAnh').onchange=function(){
    var f=this.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        var cv=document.createElement('canvas'), mx=512, w=img.width, hh=img.height;
        if(w>mx||hh>mx){ var r=Math.min(mx/w,mx/hh); w=Math.round(w*r); hh=Math.round(hh*r); }
        cv.width=w; cv.height=hh; cv.getContext('2d').drawImage(img,0,0,w,hh);
        var du=cv.toDataURL('image/jpeg',0.85);
        api('uploadAnh',{maTho:u.maTho,dataUrl:du}).then(function(j){
          u.anhUrl='https://drive.google.com/thumbnail?id='+j.fileId+'&sz=w200';

        }).catch(function(){});
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
}

      +'<div class="q-row"><span class="muted" style="width:130px">Trigger duyệt</span><b>'+(j.trigger?'✓ Đang bật':'✗ Chưa bật')+'</b></div>'
      +'<div class="q-row"><span class="muted" style="width:130px">Giờ mở chấm công</span><b>'+esc(APP.gioMo)+'</b></div>';
  }).catch(function(){});

function suaCauHinh(khoa,giaTri){
  moModal('<h3 style="margin-top:0">'+esc(TEN_CAU_HINH[khoa]||khoa)+'</h3><label class="lbl">Giá trị'+(khoa==='GIO_MO_CHAM_CONG'?' (định dạng HH:MM, VD: 05:00)':'')+'</label><input type="text" id="chVal" value="'+esc(giaTri)+'"><div class="row2" style="margin-top:12px"><button class="btn btn-cam" id="btnChOk">Lưu</button><button class="btn btn-trang" onclick="dongModal()">Hủy</button></div>');
  $('btnChOk').onclick=function(){
    var v=$('chVal').value.trim();
    if(khoa==='GIO_MO_CHAM_CONG'&&!/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(v)){ toast('Giờ mở phải dạng HH:MM (VD: 05:00).'); return; }
    api('luuCauHinh',{khoa:khoa,giaTri:v}).then(function(){ dongModal(); toast('Đã lưu.'); if(khoa==='GIO_MO_CHAM_CONG') APP.gioMo=v; taiCauHinh(); }).catch(function(){});
  };
}

function init(){
  // Máy tính đã bỏ 2026-10-10: calcInit(); $('calcFab').onclick=... (giữ code, không sử dụng)
  $('sheetX').onclick=dongSheet; $('sheetOv').onclick=dongSheet;
  $('sheetQ').addEventListener('input',function(){ veSheetOpts(null,this.value); });
  $('modalOv').addEventListener('click',function(e){ if(e.target===$('modalOv')) dongModal(); });
  $('errClose').onclick=hideErr;
  $('errRetry').onclick=function(){ hideErr(); if(retryFn) retryFn(); };
  cfg=loadLS(CFG_KEY); sess=loadLS(SES_KEY);
  if(!cfg||!cfg.apiUrl||!cfg.apiKey){ veConfig(); return; }
  if(sess&&sess.token&&sess.han&&sess.han>Date.now()){
    // Phiên còn hạn 7 ngày: gọi 'me' ngầm để làm mới; lỗi mạng thì GIỮ session vào app,
    // chỉ đăng xuất khi server báo token không hợp lệ/hết hạn.
    api('me',{},true).then(function(j){
      sess.user=j.user; APP.gioMo=j.gioMo||'05:00'; saveLS(SES_KEY,sess); veShell();
    }).catch(function(err){
      if(err&&err.auth){ sess=null; try{localStorage.removeItem(SES_KEY);}catch(e){} veLogin(); }
      else veShell();
    });
  }else{ sess=null; try{localStorage.removeItem(SES_KEY);}catch(e){} veLogin(); }
}
document.addEventListener('DOMContentLoaded',init);
</script>

<script>
(function(){
  var btn=document.getElementById('navToggle');
  var nav=document.getElementById('nav');
  var ov=document.getElementById('navOverlay');
  if(!nav||!ov) return;
  function openNav(){ nav.classList.add('open'); ov.classList.add('open'); }
  function closeNav(){ nav.classList.remove('open'); ov.classList.remove('open'); }
  function toggleNav(){ nav.classList.toggle('open'); ov.classList.toggle('open'); }
  if(btn){
    btn.addEventListener('click', function(e){ e.stopPropagation(); toggleNav(); });
  }
  ov.addEventListener('click', closeNav);
  var navIn=document.getElementById('navIn');
  if(navIn){
    navIn.addEventListener('click', function(ev){
      if(ev.target.closest('button')){
        setTimeout(closeNav,150);
      }
    });
  }
  // Swipe gesture: vuốt phải từ mép trái để mở, vuốt trái để đóng
  var startX=0, startY=0, isTracking=false;
  var EDGE=36; // vùng mép trái cho phép vuốt
  var THRESHOLD=72; // khoảng vuốt tối thiểu
  var RESTRAINT=80; // giới hạn lệch dọc

  document.addEventListener('touchstart', function(e){
    if(document.body.classList.contains('no-nav')) return;
    if(e.touches.length!==1) return;
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    // chỉ track khi bắt đầu từ mép trái (mở) hoặc đang mở (đóng)
    if(startX < EDGE || nav.classList.contains('open')){
      isTracking=true;
    }
  }, {passive:true});

  document.addEventListener('touchmove', function(e){
    if(!isTracking) return;
    // không can thiệp khi đang cuộn dọc mạnh trong bảng
  }, {passive:true});

  document.addEventListener('touchend', function(e){
    if(!isTracking) return;
    isTracking=false;
    if(document.body.classList.contains('no-nav')) return;
    var endX = (e.changedTouches && e.changedTouches[0].clientX) || 0;
    var endY = (e.changedTouches && e.changedTouches[0].clientY) || 0;
    var dx = endX - startX;
    var dy = Math.abs(endY - startY);
    if(dy > RESTRAINT) return; // bỏ qua vuốt chéo/dọc
    if(dx > THRESHOLD && startX < EDGE){
      // vuốt phải từ mép -> mở
      openNav();
    }else if(dx < -THRESHOLD && nav.classList.contains('open')){
      // vuốt trái khi đang mở -> đóng
      closeNav();
    }
  }, {passive:true});
})();
</script>
