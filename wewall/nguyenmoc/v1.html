<style>
:root{--bg:#FDF8F3;--text:#4E342E;--accent:#FF6F00;--light:#8D6E63;--border:#e8d9cb;--dark:#3E2723;--card:#fff;--radius:10px}

body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;line-height:1.5}
button,input{font-family:inherit}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 12px rgba(78,52,46,.07);padding:16px}
.btn{border:none;border-radius:6px;padding:11px 18px;font-weight:700;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#FF8F33);color:#fff;box-shadow:0 4px 14px rgba(255,111,0,.28);border:1px solid rgba(255,111,0,.2)}
.btn-excel{background:linear-gradient(135deg,#1D6F42,#2FA35F);color:#fff;box-shadow:0 4px 14px rgba(29,111,66,.28);border:1px solid rgba(29,111,66,.2)}
.btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text)}
.badge{font-size:11px;padding:5px 11px;border-radius:6px;font-weight:800;display:inline-flex;align-items:center;border:1px solid transparent}
.b-daduyet{background:#E8F5E9;color:#2E7D32;border-color:#C8E6C9}
.b-choduyet{background:#FFF8E1;color:#EF6C00;border-color:#FFECB3}.b-danglam{background:#E3F2FD;color:#1565C0;border-color:#BBDEFB}
.b-tuchoi{background:#FFEBEE;color:#C62828;border-color:#FFCDD2}
#app-layout{display:flex;min-height:100vh;background:var(--bg)}
#sidebar{width:160px;min-width:160px;background:#fff;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:2px 0 10px rgba(78,52,46,.06)}
#sidebar .side-btn{width:100%;text-align:left;padding:10px 14px;border-radius:6px;border:1px solid var(--border);background:#FFF8F3;color:var(--text);font-size:13px;font-weight:700;cursor:pointer;transition:.18s;text-transform:uppercase;letter-spacing:.4px}
#sidebar .side-btn.active{background:#3E2723;color:#fff;border-color:#3E2723;box-shadow:0 2px 8px rgba(62,39,35,.25);font-weight:800}
#sidebar .side-btn:hover:not(.active){background:#FFF3E0;border-color:#FFCC80}
#main{flex:1;padding:0;max-width:1200px;overflow:hidden}
#main-inner{padding:16px}
.app-header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
.app-header b{letter-spacing:.3px}
footer#global-footer{position:fixed;bottom:0;left:0;right:0;background:#f8f8f8;border-top:1px solid var(--border);text-align:center;font-size:10px;line-height:1.3;padding:6px 4px;z-index:50;color:var(--light)}
.login-wrap{max-width:420px;margin:24px auto}
.login-brand{text-align:center;padding:18px 12px}
.login-brand h1{font-size:22px;letter-spacing:1px}
.login-brand p{font-size:12px;color:var(--light)}
.tabs{display:flex;gap:6px;margin:12px 0;padding:4px;background:#EFEBE9;border-radius:6px}
.tab{flex:1;padding:10px 14px;border-radius:6px;text-align:center;font-weight:800;cursor:pointer;font-size:13px;color:#3E2723;border:1px solid transparent;transition:.18s;text-transform:uppercase;letter-spacing:.4px}
.tab.active{background:#fff;color:#2A1A14;border-color:#3E2723;box-shadow:0 2px 8px rgba(0,0,0,.12);font-weight:900}
.input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:15px;transition:.18s}

.field{margin-bottom:12px}

.big-btn{width:100%;padding:18px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#FF8F33);color:#fff;font-size:17px;font-weight:900;border:none;cursor:pointer;box-shadow:0 8px 20px rgba(255,111,0,.32);transition:.18s}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px}
.stat .label{font-size:12px;color:var(--light)}
.stat .value{font-size:20px;font-weight:900;margin-top:4px}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:500px}
th,td{border:1px solid var(--border);padding:8px 6px;text-align:center;font-size:12px;white-space:nowrap}
.compact td,.compact th{padding:5px 6px}
thead th{background:var(--dark);color:#fff;position:sticky;top:0;z-index:2}
.sticky-left{position:sticky;left:0;z-index:3;background:#fff}
.sticky-left.head{background:var(--dark)}

.col-dongia{right:400px !important}
.col-tc{right:300px !important}
.col-dc{right:200px !important}
.col-com{right:100px !important}
.col-thanhtien{right:0 !important}

td.cell-co{background:#E8F5E9}
td.cell-cho{background:#FFF8E1}
td.cell-khong{background:#FFEBEE}
.row-alt{background:#FFFBF7}
.bottom-sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:12px 12px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.18);z-index:100;max-height:72vh;overflow:auto;padding:16px;transform:translateY(100%);transition:.28s cubic-bezier(.32,.72,0,1)}

.sheet-backdrop{position:fixed;inset:0;background:rgba(60,40,30,.35);backdrop-filter:blur(3px);z-index:99;display:none}
.sheet-backdrop.open{display:block}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 18px;border-radius:6px;font-size:13px;z-index:200;display:none;box-shadow:0 8px 20px rgba(0,0,0,.2);font-weight:600}

.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--border);background:#eee}

let raCaPhuCap={};
function openRaCaForm(){
 const sess=getSession();if(!sess)return;const rec=getRecords().find(r=>r.sdt===sess.user.sdt&&r.ngayCong===todayYMD());if(!rec||rec.gioRa){toast('Chưa vào ca');return;}
 const now=new Date();const gioRa=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
 raCaPhuCap={};DM_PHU_CAP.forEach((p,i)=>{raCaPhuCap[i]=0;});
 const tcGoiY=tinhTangCaGio(gioRa,todayYMD(),rec.gioVao);rcGioRa=gioRa; // gợi ý giờ TC theo quy định chị chốt 17/10 (CN tính từ 7:30)
 const comTruaAuto=gioRa>'11:30'?1:0;rcComTruaAuto=comTruaAuto; // NM confirm: cơm trưa 1 suất/ngày công, ra ca lúc/trước 11:30 thì 0
 document.getElementById('bottomSheet').innerHTML=`<div style="max-height:70vh;overflow:auto"><h3>Ra ca — ${fmtDateDDMMYYYY(todayYMD())}</h3><div style="font-size:13px;color:var(--light)">Vào ca: ${rec.gioVao} · Ra ca: ${gioRa}</div> <div class="field"><label style="font-weight:800">Phụ cấp</label>${DM_PHU_CAP.map((p,i)=> i===0?'':i===1?`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)"><span>${p.ten} — ${fmtMoney(p.gia)}</span><span style="display:flex;gap:6px;align-items:center"><label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="rc_xang1" style="width:18px;height:18px" onchange="capNhatTienPC()"> Đã đi</label><b id="rc_tien_xang1" style="min-width:70px;text-align:right">0₫</b></span></div>`:i===2?`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)"><span>${p.ten} — ${fmtMoney(p.gia)}</span><span style="display:flex;gap:6px;align-items:center"><button class="btn btn-ghost" style="padding:4px 10px" onclick="pcDoi(${i},-1)">−</button><b id="pc_sl_${i}">0</b><button class="btn btn-ghost" style="padding:4px 10px" onclick="pcDoi(${i},1)">+</button><b id="pc_tt_${i}" style="min-width:70px;text-align:right">0₫</b></span></div>`:`<div><div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0 2px"><span>${p.ten} — ${fmtMoney(p.gia)}</span><span style="display:flex;gap:6px;align-items:center"><b id="rc_ctc_sl">Tự động: ${tcGoiY>2?1:0} suất</b><b id="rc_tien_ctc" style="min-width:70px;text-align:right">${fmtMoney(tcGoiY>2?p.gia:0)}</b></span></div><div style="font-style:italic;font-size:11px;color:var(--light);padding:0 0 8px;border-bottom:1px solid var(--border)">(Khi tăng ca trên 2 giờ)</div></div>`).join('')}<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0"><span>${DM_PHU_CAP[0].ten} — ${fmtMoney(DM_PHU_CAP[0].gia)}</span><span style="display:flex;gap:6px;align-items:center"><b>Tự động: ${comTruaAuto} suất</b><b id="rc_tien_com" style="min-width:70px;text-align:right">${fmtMoney(comTruaAuto*DM_PHU_CAP[0].gia)}</b></span></div></div>

function pcDoi(i,d){raCaPhuCap[i]=Math.max(0,(raCaPhuCap[i]||0)+d);document.getElementById('pc_sl_'+i).textContent=raCaPhuCap[i];document.getElementById('pc_tt_'+i).textContent=fmtMoney(raCaPhuCap[i]*DM_PHU_CAP[i].gia);capNhatTienPC();}
function capNhatTienTC(){const sess=getSession();if(!sess)return;const el=document.getElementById('rc_tctien');if(!el)return;const v=parseFloat(document.getElementById('rc_tc').value||'0');el.textContent=fmtMoney(tinhTienTangCa(sess.user.donGia||0,isNaN(v)?0:v,todayYMD(),rcGioRa));capNhatTienPC();}
let rcComTruaAuto=0;let rcGioRa='';
function capNhatTienPC(){const com=document.getElementById('rc_tien_com');if(com)com.textContent=fmtMoney((rcComTruaAuto||0)*DM_PHU_CAP[0].gia);const x1=document.getElementById('rc_tien_xang1');if(x1)x1.textContent=fmtMoney(document.getElementById('rc_xang1')?.checked?DM_PHU_CAP[1].gia:0);const tc=parseFloat(document.getElementById('rc_tc')?.value||'0');const ctc=(isNaN(tc)?0:tc)>2?1:0;const sl=document.getElementById('rc_ctc_sl');if(sl)sl.textContent='Tự động: '+ctc+' suất';const ct=document.getElementById('rc_tien_ctc');if(ct)ct.textContent=fmtMoney(ctc*DM_PHU_CAP[3].gia);}
function xacNhanRaCa(gioRa){
 const sess=getSession();if(!sess)return;
 const ghichu=(document.getElementById('rc_ghichu')||{}).value||'';
 const tcGio=parseFloat((document.getElementById('rc_tc')||{}).value||'0'); // giờ TC thợ nhập/sửa trên form
 if(!ghichu.trim()){toast('Nhập ghi chú tình trạng công việc');return;}
 const recs=getRecords();const rec=recs.find(r=>r.sdt===sess.user.sdt&&r.ngayCong===todayYMD());if(!rec||rec.gioRa)return;
 const save=(lat,lng,acc)=>{
  rec.gioRa=gioRa;rec.tangCaGio=isNaN(tcGio)?0:tcGio;rec.tangCaTien=tinhTienTangCa(sess.user.donGia||0,rec.tangCaGio,rec.ngayCong,gioRa);rec.ghiChu=ghichu.trim();rec.trangThai='cho_duyet';rec.thoiDiemGui=nowStr();
  rec.viDoRa=lat;rec.kinhDoRa=lng;rec.doChinhXacRa=acc;
  raCaPhuCap[1]=document.getElementById('rc_xang1')?.checked?1:0; // Xăng xe điểm 1: tick chọn, không chọn số lượng
  raCaPhuCap[3]=rec.tangCaGio>2?1:0; // Cơm tăng ca: tự động 1 suất khi TC trên 2h, không chọn số lượng
  rec.phuCap=DM_PHU_CAP.map((p,i)=>({ten:p.ten,gia:p.gia,soLuong:raCaPhuCap[i]||0,thanhTien:(raCaPhuCap[i]||0)*p.gia})).filter(p=>p.soLuong>0);
  const ct=DM_PHU_CAP.find(p=>p.ten==='Cơm');if(gioRa>'11:30'&&ct)rec.phuCap.push({ten:ct.ten,gia:ct.gia,soLuong:1,thanhTien:ct.gia}); // Cơm tự động 1 suất, ra ca lúc/trước 11:30 thì 0
  rec.updatedAt=new Date().toISOString();LocalDB.save(KEYS.records,recs);(window.syncPushOne?syncPushOne(rec):0);closeSheet();toast('Đã ra ca lúc '+gioRa);render();
 };
 if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>save(p.coords.latitude,p.coords.longitude,p.coords.accuracy),()=>save(null,null,null),{enableHighAccuracy:true,timeout:5000});}else save(null,null,null);
}

function renderTheoDoiCa(el,user){

 el.innerHTML=`<div class="card"><div style="display:flex;gap:8px;flex-wrap:nowrap;align-items:center"><b>Hôm nay</b><input type="date" class="input" style="width:132px" value="${theoDoiNgay}" onchange="theoDoiNgay=this.value;renderTheoDoiCa(document.getElementById('viewContent'), getSession().user)"><button class="btn btn-excel" onclick="exportTheoNgayExcel()">Báo cáo cuối ngày</button></div><div style="margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div class="card stat" style="background:#FFF3E0"><div class="label">Vào ca / Đã ra ca</div><div class="value">${daRa} / ${daVao}</div></div><div class="card stat" style="background:#FFF3E0"><div class="label">Tăng ca / Tiền tăng ca</div><div class="value">${fmtGio(tcGio)}</div><div style="font-size:11px;color:var(--light)">${fmtMoney(tcTien)}</div></div><div class="card stat" style="background:#FFF3E0"><div class="label">Tổng phụ cấp</div><div class="value">${fmtMoney(pcTien)}</div></div></div><div style="margin-top:12px;display:grid;gap:10px">${recs.map(r=>{const u=getUsers().find(x=>x.sdt===r.sdt);const hasGPSRa=r.viDoRa&&r.kinhDoRa;return `<div class="card" style="border-left:4px solid ${r.gioRa?'#2E7D32':'var(--accent)'};padding:12px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><b>${u?.hoTen||''}</b><span class="badge ${r.gioRa?'b-daduyet':'b-choduyet'}">${r.gioRa?'Đã ra ca':'Đang làm'}</span></div><div style="font-size:12px;color:var(--light)">${fmtPhone(u?.sdt||'')} · ${u?.boPhan||''} · <b>Vào:</b> ${r.gioVao||'—'}${r.viDo&&r.kinhDo?` (<a href="https://maps.google.com/?q=${r.viDo},${r.kinhDo}" target="_blank">vị trí</a>)`:''} · <b>Ra:</b> ${r.gioRa||'—'}${hasGPSRa?` (<a href="https://maps.google.com/?q=${r.viDoRa},${r.kinhDoRa}" target="_blank">vị trí</a>)`:''}</div>${(r.maDuAn||[]).length?`<div style="font-size:12px;margin-top:6px"><b>Mã DA:</b> ${r.maDuAn.join(' <b style="margin:0 6px">|</b> ')}</div>`:''}${(r.phuCap||[]).length?`<div style="font-size:12px"><b>Phụ cấp:</b> ${(r.phuCap||[]).map(p=>p.ten+' ×'+p.soLuong+' = '+fmtMoney(p.thanhTien)).join(', ')}</div>`:''}${(r.tangCaGio||0)>0?`<div style="font-size:12px">Tăng ca: ${fmtGio(r.tangCaGio)} = ${fmtMoney(r.tangCaTien)}</div>`:''}${r.ghiChu?`<div style="font-size:13px;margin-top:6px;background:#FFFBF7;border:1px solid var(--border);border-radius:6px;padding:8px">${r.ghiChu}</div>`:''}</div>`;}).join('')||'<div style="text-align:center;padding:20px;color:var(--light)">Chưa có ca làm ngày này</div>'}</div></div>`;

function duyetOne(id,ok){if(!ok){const re=prompt('Lý do từ chối:');if(!re)return;updateStatus(id,'tu_choi',re);}else updateStatus(id,'da_duyet','');}
async function duyetAll(){const recs=getRecords().filter(r=>r.trangThai==='cho_duyet');if(!recs.length)return;if(!await nmConfirm(`Duyệt ${recs.length} bản ghi?`))return;recs.forEach(r=>updateStatus(r.maBanGhi,'da_duyet','',true));toast(`Đã duyệt ${recs.length}`);render();}
function updateStatus(ma,tt,ly,silent){const recs=getRecords();const i=recs.findIndex(r=>r.maBanGhi===ma);if(i<0)return;recs[i].trangThai=tt;recs[i].nguoiDuyet=fmtNguoiDuyet(getSession().user);recs[i].thoiDiemDuyet=nowStr();recs[i].lyDoTuChoi=ly||'';recs[i].updatedAt=new Date().toISOString();LocalDB.save(KEYS.records,recs);(window.syncPushOne?syncPushOne(recs[i]):0);if(!silent){toast(tt==='da_duyet'?'Đã duyệt':'Đã từ chối');render();}}
let bangThang=monthKey();
function renderBangCong(el,user){
 const usersTho=getUsers().filter(u=>u.vaiTro==='Tho');const records=getRecords();const[y,m]=bangThang.split('-').map(Number);const dim=new Date(y,m,0).getDate();
 el.innerHTML=`<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="month" class="input" style="width:160px" value="${bangThang}" onchange="bangThang=this.value;renderBangCong(document.getElementById('viewContent'), getSession().user)"><button class="btn btn-excel" onclick="openExportSheet('bangcong')">Xuất file Excel</button></div><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th class="sticky-left head" style="min-width:180px;left:0">Thợ</th>${Array.from({length:dim},(_,i)=>`<th>${i+1}</th>`).join('')}<th class="sticky-right col-tong">Tổng</th><th class="sticky-right col-dongia">Đơn giá</th><th class="sticky-right col-tc">Tăng ca</th><th class="sticky-right col-dc">Di chuyển</th><th class="sticky-right col-com">Cơm</th><th class="sticky-right col-thanhtien">Thành tiền</th></tr></thead><tbody>${usersTho.map((u,ui)=>{const byDay={};records.forEach(r=>{if(r.sdt===u.sdt&&r.ngayCong.startsWith(bangThang)){byDay[Number(r.ngayCong.slice(8,10))]=r;}});let tong=0,tienTC=0,tienDC=0,tienCom=0;Object.values(byDay).forEach(r=>{if(r.trangThai==='da_duyet'){tong++;tienTC+=(r.tangCaTien||0);(r.phuCap||[]).forEach(p=>{if(p.ten.startsWith('Xăng xe'))tienDC+=p.thanhTien||0;if(p.ten.startsWith('Cơm'))tienCom+=p.thanhTien||0;});}});return `<tr class="${ui%2===0?'row-alt':''}"><td class="sticky-left" style="text-align:left"><b>${u.hoTen}</b><br><small>${u.boPhan||''}</small></td>${Array.from({length:dim},(_,i)=>{const r=byDay[i+1];let cls='',txt='';if(r){if(r.trangThai==='da_duyet'){cls='cell-co';txt='✓';}else if(r.trangThai==='cho_duyet'){cls='cell-cho';txt='C';}else{cls='cell-khong';txt='X';}}return `<td class="${cls}">${txt}</td>`;}).join('')}<td class="sticky-right col-tong">${tong}</td><td class="sticky-right col-dongia">${fmtMoney(u.donGia)}</td><td class="sticky-right col-tc">${fmtMoney(tienTC)}</td><td class="sticky-right col-dc">${fmtMoney(tienDC)}</td><td class="sticky-right col-com">${fmtMoney(tienCom)}</td><td class="sticky-right col-thanhtien">${fmtMoney(tong*(u.donGia||0)+tienTC+tienDC+tienCom)}</td></tr>`;}).join('')}</tbody></table></div></div>`;
}

  let html=`<div style="padding:14px 18px;border-radius:6px;background:linear-gradient(135deg,#FFF3E0,#FFE0B2);color:#3E2723;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b>Tổng hợp từ 01/${targetMonth.slice(5,7)} đến ${fmtDateDDMMYYYY(duKienNgay)}</b><span style="display:flex;gap:6px"><span class="badge" style="background:#fff;color:#3E2723">${tongTho} thợ</span><span class="badge" style="background:#fff;color:#3E2723">${tongCong} công</span><span class="badge" style="background:#3E2723;color:#fff">${fmtMoney(tongTien)}</span></span></div>`;
  Object.entries(groups).forEach(([loai,list])=>{
    const sumTho=list.length;const sumCong=list.reduce((s,x)=>s+x.cong,0);const sumTien=list.reduce((s,x)=>s+x.tien,0);
    html+=`<div class="card" style="padding:0;overflow:hidden;border-radius:10px"><div style="padding:12px 16px;background:#FFF3E0;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="badge" style="background:#FFE0B2;color:#3E2723;font-size:13px;padding:7px 14px">${loai}</span><span style="color:var(--light)">•</span><span style="display:flex;gap:6px"><span class="badge" style="background:#fff">${sumTho} thợ</span><span class="badge" style="background:#fff">${sumCong} công</span><span class="badge b-choduyet" style="background:#fff">${fmtMoney(sumTien)}</span></span></div><div class="table-wrap" style="border:none;border-radius:0"><table class="compact"><thead><tr><th style="text-align:left;padding-left:16px">Họ tên</th><th>Tổng</th><th>Đơn giá</th><th>Tăng ca</th><th>Di chuyển</th><th>Cơm</th><th>Thành tiền</th></tr></thead><tbody>${list.map(({u,cong,tien,tc,dc,com},i)=>`<tr class="${i%2===0?'row-alt':''}"><td style="text-align:left;padding-left:16px"><b>${u.hoTen}</b><br><small style="color:var(--light)">${fmtPhone(u.sdt)}</small></td><td><b>${cong}</b></td><td>${fmtMoney(u.donGia)}</td><td>${fmtMoney(tc)}</td><td>${fmtMoney(dc)}</td><td>${fmtMoney(com)}</td><td><b>${fmtMoney(tien)}</b></td></tr>`).join('')}</tbody></table></div></div>`;
  });
  if(!Object.keys(groups).length)html+=`<div class="card" style="text-align:center;color:var(--light)">Chưa có công đã duyệt trong tháng ${targetMonth}</div>`;
  content.innerHTML=html;
}

<script>
function nmShowModal(msg,buttons){return new Promise(res=>{const m=document.getElementById('nmModal');document.getElementById('nmModalMsg').textContent=msg;const bb=document.getElementById('nmModalBtns');bb.innerHTML='';buttons.forEach(b=>{const btn=document.createElement('button');btn.className='btn '+(b.cls||'nm-btn-ok');btn.textContent=b.text;btn.onclick=()=>{m.style.display='none';res(b.val);};bb.appendChild(btn);});m.style.display='flex';});}
function nmAlert(msg){return nmShowModal(msg,[{text:'Đã hiểu',val:true,cls:'nm-btn-ok'}]);}
function nmConfirm(msg){return nmShowModal(msg,[{text:'Hủy',val:false,cls:'nm-btn-cancel'},{text:'Xác nhận',val:true,cls:'nm-btn-ok'}]);}
