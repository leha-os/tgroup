<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NGUYỄN MỘC - CHẤM CÔNG THỢ</title>
<style>
:root{--bg:#FDF8F3;--text:#4E342E;--accent:#FF6F00;--light:#8D6E63;--border:#EDE2D8;--dark:#3E2723;--card:#fff;--radius:20px}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;line-height:1.5}
button,input{font-family:inherit}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 12px rgba(78,52,46,.07);padding:16px}
.btn{border:none;border-radius:999px;padding:11px 18px;font-weight:700;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#FF8F33);color:#fff;box-shadow:0 4px 14px rgba(255,111,0,.28);border:1px solid rgba(255,111,0,.2)}
.btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text)}
.badge{font-size:11px;padding:5px 11px;border-radius:999px;font-weight:800;display:inline-flex;align-items:center;border:1px solid transparent}
.b-daduyet{background:#E8F5E9;color:#2E7D32;border-color:#C8E6C9}
.b-choduyet{background:#FFF8E1;color:#EF6C00;border-color:#FFECB3}
.b-tuchoi{background:#FFEBEE;color:#C62828;border-color:#FFCDD2}
#app-layout{display:flex;min-height:100vh;background:var(--bg)}
#sidebar{width:150px;min-width:150px;background:#fff;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
#sidebar .side-btn{width:100%;text-align:left;padding:11px 14px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--text);font-size:13px;font-weight:650;margin-bottom:6px;cursor:pointer;transition:.18s}
#sidebar .side-btn.active{background:#FFE0B2;color:var(--dark);border-color:#FFCC80;box-shadow:0 2px 8px rgba(255,111,0,.15);font-weight:800}
#sidebar .side-btn:hover:not(.active){background:#FFF3E0}
#main{flex:1;padding:0;max-width:1200px;overflow:hidden}
#main-inner{padding:16px}
.app-header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
.app-header b{letter-spacing:.3px}
footer#global-footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);text-align:center;font-size:11px;line-height:1.4;padding:8px 4px;z-index:50;color:var(--light)}
.login-wrap{max-width:420px;margin:24px auto}
.login-brand{text-align:center;padding:18px 12px}
.login-brand h1{font-size:22px;letter-spacing:1px}
.login-brand p{font-size:12px;color:var(--light)}
.tabs{display:flex;gap:6px;margin:12px 0;padding:4px;background:#EFEBE9;border-radius:999px}
.tab{flex:1;padding:10px 14px;border-radius:999px;text-align:center;font-weight:700;cursor:pointer;font-size:13px;color:var(--light);border:1px solid transparent;transition:.18s}
.tab.active{background:#fff;color:var(--dark);border-color:var(--border);box-shadow:0 2px 8px rgba(0,0,0,.08);font-weight:800}
.input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:15px;transition:.18s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,111,0,.15)}
.field{margin-bottom:12px}
.field .err{color:#C62828;font-size:12px;margin-top:4px;min-height:14px}
.big-btn{width:100%;padding:18px;border-radius:999px;background:linear-gradient(135deg,var(--accent),#FF8F33);color:#fff;font-size:17px;font-weight:900;border:none;cursor:pointer;box-shadow:0 8px 20px rgba(255,111,0,.32);transition:.18s}
.big-btn:disabled{background:#BDBDBD;box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px}
.stat .label{font-size:12px;color:var(--light)}
.stat .value{font-size:20px;font-weight:900;margin-top:4px}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:16px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:500px}
th,td{border:1px solid var(--border);padding:8px 6px;text-align:center;font-size:12px;white-space:nowrap}
thead th{background:var(--dark);color:#fff;position:sticky;top:0;z-index:2}
.sticky-left{position:sticky;left:0;z-index:3;background:#fff}
.sticky-left.head{background:var(--dark)}
th.sticky-right,td.sticky-right{position:sticky;right:0;z-index:3}
.col-tong{right:200px !important}
.col-dongia{right:100px !important}
.col-thanhtien{right:0 !important}
th.col-tong,th.col-dongia,th.col-thanhtien{background:#3E2723;color:#fff}
td.col-tong,td.col-dongia,td.col-thanhtien{background:#3E2723;color:#fff;font-weight:700}
td.cell-co{background:#E8F5E9}
td.cell-cho{background:#FFF8E1}
td.cell-khong{background:#FFEBEE}
.row-alt{background:#FFFBF7}
.bottom-sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.18);z-index:100;max-height:72vh;overflow:auto;padding:16px;transform:translateY(100%);transition:.28s cubic-bezier(.32,.72,0,1)}
.bottom-sheet.open{transform:translateY(0)}
.sheet-backdrop{position:fixed;inset:0;background:rgba(60,40,30,.35);backdrop-filter:blur(3px);z-index:99;display:none}
.sheet-backdrop.open{display:block}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;z-index:200;display:none;box-shadow:0 8px 20px rgba(0,0,0,.2);font-weight:600}
.toast.show{display:block}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--border);background:#eee}
.demo-banner{background:#FFF8E1;border:1px dashed #F57F17;padding:8px 14px;border-radius:999px;font-size:12px;text-align:center;margin-bottom:10px;font-weight:600}
@media(max-width:768px){#app-layout{flex-direction:column}#sidebar{width:100%;min-width:100%;height:auto;display:flex;flex-direction:row;gap:8px;overflow:auto;position:static;padding:10px}#sidebar .side-btn{white-space:nowrap;width:auto;padding:9px 14px}#main-inner{padding:12px}}
</style>
</head>

 app.innerHTML=`<div class="login-brand"><h1>NGUYỄN MỘC</h1><p>CÔNG TY TNHH SẢN XUẤT THƯƠNG MẠI NGUYỄN MỘC</p></div><div class="login-wrap"><div class="card" style="text-align:center"><div style="font-weight:900;margin:8px 0 14px">CHẤM CÔNG THỢ</div><div class="tabs"><div class="tab ${loginMode==='maTho'?'active':''}" onclick="setLoginMode('maTho')">Mã thợ</div><div class="tab ${loginMode==='sdt'?'active':''}" onclick="setLoginMode('sdt')">Số điện thoại</div></div><div class="field"><input id="loginId" class="input" placeholder="${loginMode==='maTho'?'Nhập mã thợ (vd nbatam)':'Nhập SĐT'}"></div><div class="field"><input id="loginPw" class="input" type="password" placeholder="Mật khẩu"></div><div id="loginErr" class="err" style="text-align:left"></div><button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doLogin()">Đăng nhập</button><div style="margin-top:16px;border-top:1px dashed var(--border);padding-top:12px"><div style="font-size:12px;color:var(--light);margin-bottom:8px">Xem thử nhanh</div><div class="grid2"><button class="btn btn-ghost" onclick="demoLogin('Tho')">Thợ</button><button class="btn btn-ghost" onclick="demoLogin('QuanLy')">Quản Lý</button><button class="btn btn-ghost" onclick="demoLogin('KeToan')">Kế Toán</button><button class="btn btn-ghost" onclick="demoLogin('GiamDoc')">Giám đốc</button></div></div></div></div>`;
}
function setLoginMode(m){loginMode=m;renderLogin();}
function doLogin(){
 const id=document.getElementById('loginId').value.trim();const pw=document.getElementById('loginPw').value;const users=getUsers();let u=null;
 if(loginMode==='maTho'){u=users.find(x=>x.maTho.toLowerCase()===id.toLowerCase()&&x.matKhau===pw);}else{const norm=normalizePhone(id);u=users.find(x=>normalizePhone(x.sdt)===norm&&x.matKhau===pw);}
 if(!u){document.getElementById('loginErr').textContent='Sai mã/SĐT hoặc mật khẩu';return;}
 if(u.trangThai!=='hoat_dong'){document.getElementById('loginErr').textContent='Tài khoản đã bị khóa';return;}
 demoBanner=false;setSession(u);render();
}
function demoLogin(r){const users=getUsers();let u;if(r==='Tho')u=users.find(x=>x.vaiTro==='Tho');else if(r==='QuanLy')u=users.find(x=>x.vaiTro==='QuanLy');else if(r==='KeToan')u=users.find(x=>x.vaiTro==='KeToan');else u=users.find(x=>x.vaiTro==='GiamDoc');demoBanner=true;setSession(u);render();}
function renderTho(user){
 const records=getRecords().filter(r=>r.maTho===user.maTho);const curM=monthKey();const daDuyet=records.filter(r=>r.trangThai==='da_duyet'&&r.ngayCong.startsWith(curM));const choDuyet=records.filter(r=>r.trangThai==='cho_duyet'&&r.ngayCong.startsWith(curM));const tongCong=daDuyet.length;const tien=(user.donGia||0)*tongCong;const today=todayYMD();const daChamHomNay=records.some(r=>r.ngayCong===today);const cauhinh=getCauHinh();const gioMo=cauhinh.GIO_MO_CHAM_CONG||'05:00';const now=new Date();const[hM,mM]=gioMo.split(':').map(Number);const moPhut=hM*60+mM;const nowPhut=now.getHours()*60+now.getMinutes();const chuaDenGio=nowPhut<moPhut;
 document.getElementById('app').innerHTML=`<div id="app-layout"><div id="main" style="max-width:520px;margin:0 auto;width:100%"><div class="app-header"><b>CÔNG TY TNHH SXTM NGUYỄN MỘC</b><button class="btn btn-ghost" style="padding:6px 12px" onclick="logout()">Thoát</button></div><div id="main-inner">${demoBanner?'<div class="demo-banner">Xem thử - Tài khoản Thợ</div>':''}<div class="card" style="margin-bottom:12px"><div style="font-weight:900">Xin chào, ${user.hoTen}</div><div style="font-size:12px;color:var(--light)">${user.maTho} · ${fmtPhone(user.sdt)} · ${user.phanLoai}</div></div><div class="tabs"><div class="tab ${thoTab==='chamcong'?'active':''}" onclick="thoTab='chamcong';render()">Chấm công</div><div class="tab ${thoTab==='thongtin'?'active':''}" onclick="thoTab='thongtin';render()">Thông tin</div></div>${thoTab==='chamcong'?`<div class="card" style="margin-top:10px"><button class="big-btn" ${daChamHomNay||chuaDenGio?'disabled':''} onclick="chamCong()">${daChamHomNay?'Đã chấm công':'CHẤM CÔNG HÔM NAY'}</button>${chuaDenGio?`<div style="color:#C62828;text-align:center;margin-top:8px;font-size:13px">Chưa đến giờ chấm công (sau ${gioMo})</div>`:''}${daChamHomNay?'<div style="text-align:center;color:#2E7D32;margin-top:8px;font-size:13px">Cảm ơn đã chấm công, vui lòng chờ quản lý duyệt</div>':''}</div><div class="grid2" style="margin-top:10px"><div class="card stat"><div class="label">1. Số công hiện tại</div><div class="value">${tongCong}</div><div style="font-size:11px;color:var(--light)">đã duyệt tháng này</div></div><div class="card stat"><div class="label">2. Số tiền dự kiến</div><div class="value">${fmtMoney(tien)}</div><div style="font-size:11px;color:var(--light)">tạm tính</div></div></div><div class="card" style="margin-top:10px;cursor:pointer" onclick="toggleChoDuyet()"><div style="display:flex;justify-content:space-between"><b>3. Số công chờ duyệt</b><b>${choDuyet.length}</b></div><div id="choDuyetList" style="display:none;margin-top:10px">${choDuyet.length===0?'<div style="font-size:13px;color:var(--light)">Không có</div>':choDuyet.map(r=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span>${r.ngayCong}</span><span class="badge b-choduyet">Chờ duyệt</span></div>`).join('')}</div></div><div class="card" style="margin-top:10px"><div style="font-size:12px;color:var(--light)">Lịch sử gần đây</div>${records.slice(0,8).map(r=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f0eb"><span>${r.ngayCong}</span><span class="badge ${r.trangThai==='da_duyet'?'b-daduyet':r.trangThai==='cho_duyet'?'b-choduyet':'b-tuchoi'}">${r.trangThai==='da_duyet'?'Đã duyệt':r.trangThai==='cho_duyet'?'Chờ duyệt':'Từ chối'}</span></div>`).join('')}</div>`:`<div class="card" style="margin-top:12px;padding:0;overflow:hidden;border-radius:20px"><div style="padding:16px 18px;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#FFFBF7,#FFF3E0);border-bottom:1px solid var(--border)"><img src="${user.anhDataUrl||''}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12);background:#eee" onerror="this.style.display='none'"><div style="flex:1"><div style="font-weight:900;font-size:16px">${user.hoTen}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><span class="badge" style="background:#fff">${user.maTho}</span><span class="badge" style="background:#3E2723;color:#fff">${user.phanLoai}</span><span class="badge" style="background:#fff">${fmtPhone(user.sdt)}</span></div></div></div><div style="padding:4px 0"><div style="display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid #f5f0eb"><span style="font-size:12px;color:var(--light);font-weight:700">5. HỌ TÊN / MÃ / SĐT</span><span style="font-weight:800;text-align:right">${user.hoTen}<br><small style="font-weight:400;color:var(--light)">${user.maTho} • ${fmtPhone(user.sdt)}</small></span></div><div style="display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid #f5f0eb"><span style="font-size:12px;color:var(--light);font-weight:700">6. NGÀY VÀO LÀM</span><span class="badge" style="background:#E8F5E9;color:#2E7D32;font-size:12px;padding:6px 12px">${user.ngayVaoLam||'—'}</span></div><div style="display:flex;justify-content:space-between;align-items:center;padding:12px 18px"><span style="font-size:12px;color:var(--light);font-weight:700">7. LƯƠNG NGÀY / PHÂN LOẠI</span><span style="text-align:right"><b style="font-size:15px">${fmtMoney(user.donGia)}</b><br><small class="badge" style="background:#FFE0B2;margin-top:4px">${user.phanLoai}</small></span></div></div></div>`}</div></div></div>`;
}
function toggleChoDuyet(){const el=document.getElementById('choDuyetList');el.style.display=el.style.display==='none'?'block':'none';}
function chamCong(){
 const sess=getSession();if(!sess)return;const user=sess.user;const today=todayYMD();const recs=getRecords();if(recs.some(r=>r.maTho===user.maTho&&r.ngayCong===today)){toast('Đã chấm công hôm nay');return;}
 const save=(lat,lng,acc)=>{const nr={maBanGhi:genId('BG'),maTho:user.maTho,ngayCong:today,thoiDiemGui:nowStr(),trangThai:'cho_duyet',nguoiDuyet:'',thoiDiemDuyet:'',lyDoTuChoi:'',viDo:lat,kinhDo:lng,doChinhXac:acc};recs.unshift(nr);LocalDB.save(KEYS.records,recs);toast('Cảm ơn đã chấm công');render();};
 if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>save(p.coords.latitude,p.coords.longitude,p.coords.accuracy),()=>save(null,null,null),{enableHighAccuracy:true,timeout:5000});}else save(null,null,null);
}
const MENU=[{id:'duyet',label:'Duyệt công',perm:'duyet_cong'},{id:'dashboard',label:'Dashboard',perm:'dashboard'},{id:'bangcong',label:'Bảng công',perm:'bang_cong'},{id:'dstho',label:'Danh sách thợ',perm:'nhan_su'},{id:'dukien',label:'Dự kiến trả thợ',perm:'thong_ke'}];
function renderQuanLy(user){
 const allowed=MENU.filter(m=>hasPerm(user,m.perm));const cur=allowed.find(x=>x.id===currentView)?currentView:(allowed[0]?.id||'duyet');currentView=cur;
 document.getElementById('app').innerHTML=`<div id="app-layout"><div id="sidebar">${allowed.map(m=>`<button class="side-btn ${m.id===cur?'active':''}" onclick="switchView('${m.id}')">${m.label}</button>`).join('')}<button class="side-btn" onclick="logout()" style="margin-top:auto;color:#C62828">Đăng xuất</button></div><div id="main"><div class="app-header"><b>CÔNG TY TNHH SXTM NGUYỄN MỘC</b></div><div id="main-inner">${demoBanner?'<div class="demo-banner">Xem thử - '+user.vaiTro+'</div>':''}<div id="viewContent"></div></div></div></div>`;
 renderView(user,cur);
}
function switchView(id){currentView=id;renderQuanLy(getSession().user);}
function logout(){clearSession();render();}
function renderView(user,view){
 const el=document.getElementById('viewContent');
 if(view==='dashboard')renderDashboard(el,user);
 else if(view==='duyet')renderDuyet(el,user);
 else if(view==='bangcong')renderBangCong(el,user);
 else if(view==='dstho')renderDsTho(el,user);
 else if(view==='dukien')renderDuKien(el,user);
}
function renderDashboard(el,user){
 const records=getRecords();const users=getUsers().filter(u=>u.vaiTro==='Tho'&&u.trangThai==='hoat_dong');const curM=monthKey();const daDuyet=records.filter(r=>r.trangThai==='da_duyet'&&r.ngayCong.startsWith(curM));const choDuyet=records.filter(r=>r.trangThai==='cho_duyet');const tongTien=daDuyet.reduce((s,r)=>{const u=getUsers().find(x=>x.maTho===r.maTho);return s+(u?.donGia||0);},0);const today=todayYMD();const diLam=new Set(records.filter(r=>r.ngayCong===today&&r.trangThai!=='tu_choi').map(r=>r.maTho)).size;
 el.innerHTML=`<div class="grid2"><div class="card stat"><div class="label">Dự kiến trả thợ tháng</div><div class="value">${fmtMoney(tongTien)}</div></div><div class="card stat"><div class="label">Thợ đi làm hôm nay / Tổng</div><div class="value">${diLam} / ${users.length}</div></div><div class="card stat"><div class="label">Chờ duyệt</div><div class="value">${choDuyet.length}</div></div><div class="card stat"><div class="label">Tổng công đã duyệt</div><div class="value">${daDuyet.length}</div></div></div>`;
}
function renderDuyet(el,user){
 let recs=getRecords().filter(r=>r.trangThai==='cho_duyet');recs.sort((a,b)=>new Date(b.thoiDiemGui)-new Date(a.thoiDiemGui));
 el.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h3>📍 Duyệt công (${recs.length})</h3><button class="btn btn-primary" onclick="duyetAll()">Duyệt hết (${recs.length})</button></div><div style="margin-top:12px;display:grid;gap:12px">${recs.map(r=>{
   const u=getUsers().find(x=>x.maTho===r.maTho);const hasGPS=r.viDo&&r.kinhDo;
   return `<div class="card" style="border-left:4px solid var(--accent);padding:12px"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge" style="background:#E3F2FD;color:#1565C0">📍 ${hasGPS? r.viDo.toFixed(5)+', '+r.kinhDo.toFixed(5) : 'Không GPS'}</span>${hasGPS?`<a href="https://maps.google.com/?q=${r.viDo},${r.kinhDo}" target="_blank" class="btn btn-ghost" style="padding:4px 10px;font-size:12px">Bản đồ</a>`:''}</div><div style="margin-top:8px;font-weight:800">${u?.hoTen||r.maTho} <small style="color:var(--light)">${u?.phanLoai||''}</small></div><div style="font-size:12px;color:var(--light)">${r.maTho} · ${fmtPhone(u?.sdt||'')} · ${r.ngayCong}</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-primary" style="flex:1" onclick="duyetOne('${r.maBanGhi}',true)">✓ Duyệt</button><button class="btn btn-ghost" style="flex:1" onclick="duyetOne('${r.maBanGhi}',false)">✕ Từ chối</button></div></div>`;
 }).join('') || '<div style="text-align:center;padding:20px;color:var(--light)">Không có bản ghi chờ duyệt ✅</div>'}</div></div>`;
}
function duyetOne(id,ok){if(!ok){const re=prompt('Lý do từ chối:');if(!re)return;updateStatus(id,'tu_choi',re);}else updateStatus(id,'da_duyet','');}
function duyetAll(){const recs=getRecords().filter(r=>r.trangThai==='cho_duyet');if(!recs.length)return;if(!confirm(`Duyệt ${recs.length} bản ghi?`))return;recs.forEach(r=>updateStatus(r.maBanGhi,'da_duyet','',true));toast(`Đã duyệt ${recs.length}`);render();}
function updateStatus(ma,tt,ly,silent){const recs=getRecords();const i=recs.findIndex(r=>r.maBanGhi===ma);if(i<0)return;recs[i].trangThai=tt;recs[i].nguoiDuyet=getSession().user.maTho;recs[i].thoiDiemDuyet=nowStr();recs[i].lyDoTuChoi=ly||'';LocalDB.save(KEYS.records,recs);if(!silent){toast(tt==='da_duyet'?'Đã duyệt':'Đã từ chối');render();}}
let bangThang=monthKey();
function renderBangCong(el,user){
 const usersTho=getUsers().filter(u=>u.vaiTro==='Tho');const records=getRecords();const[y,m]=bangThang.split('-').map(Number);const dim=new Date(y,m,0).getDate();
 el.innerHTML=`<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="month" class="input" style="width:160px" value="${bangThang}" onchange="bangThang=this.value;renderBangCong(document.getElementById('viewContent'), getSession().user)"><button class="btn btn-primary" onclick="exportBangCSV()">Xuất CSV</button></div><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th class="sticky-left head" style="min-width:180px;left:0">Thợ</th>${Array.from({length:dim},(_,i)=>`<th>${i+1}</th>`).join('')}<th class="sticky-right col-tong">Tổng</th><th class="sticky-right col-dongia">Đơn giá</th><th class="sticky-right col-thanhtien">Thành tiền</th></tr></thead><tbody>${usersTho.map((u,ui)=>{const byDay={};records.forEach(r=>{if(r.maTho===u.maTho&&r.ngayCong.startsWith(bangThang)){byDay[Number(r.ngayCong.slice(8,10))]=r;}});let tong=0;Object.values(byDay).forEach(r=>{if(r.trangThai==='da_duyet')tong++;});return `<tr class="${ui%2===0?'row-alt':''}"><td class="sticky-left" style="text-align:left"><b>${u.hoTen}</b><br><small>${u.maTho} - ${u.phanLoai}</small></td>${Array.from({length:dim},(_,i)=>{const r=byDay[i+1];let cls='',txt='';if(r){if(r.trangThai==='da_duyet'){cls='cell-co';txt='✓';}else if(r.trangThai==='cho_duyet'){cls='cell-cho';txt='C';}else{cls='cell-khong';txt='X';}}return `<td class="${cls}">${txt}</td>`;}).join('')}<td class="sticky-right col-tong">${tong}</td><td class="sticky-right col-dongia">${fmtMoney(u.donGia)}</td><td class="sticky-right col-thanhtien">${fmtMoney(tong*(u.donGia||0))}</td></tr>`;}).join('')}</tbody></table></div></div>`;
}
function exportBangCSV(){const usersTho=getUsers().filter(u=>u.vaiTro==='Tho');const records=getRecords();const[y,m]=bangThang.split('-').map(Number);const dim=new Date(y,m,0).getDate();let csv='\uFEFFThợ,Mã,Phân loại,'+Array.from({length:dim},(_,i)=>i+1).join(',')+',Tổng,Đơn giá,Thành tiền\n';usersTho.forEach(u=>{const byDay={};records.forEach(r=>{if(r.maTho===u.maTho&&r.ngayCong.startsWith(bangThang)){byDay[Number(r.ngayCong.slice(8,10))]=r;}});let tong=0;Object.values(byDay).forEach(r=>{if(r.trangThai==='da_duyet')tong++;});const row=[`"${u.hoTen}"`,u.maTho,u.phanLoai];for(let d=1;d<=dim;d++){const r=byDay[d];row.push(r?(r.trangThai==='da_duyet'?'1':r.trangThai==='cho_duyet'?'C':'X'):'');}row.push(tong,u.donGia,tong*(u.donGia||0));csv+=row.join(',')+'\n';});downloadFile(csv,`bang_cong_${bangThang}.csv`,'text/csv;');}
function downloadFile(c,n,t){const b=new Blob([c],{type:t});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);}

function dieuChinhSauChot(){}
let filterLoai='all';
function renderDsTho(el,user){
 let list=getUsers().filter(u=>u.vaiTro==='Tho');if(filterLoai!=='all')list=list.filter(u=>u.phanLoai===filterLoai);
 el.innerHTML=`<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="openThoForm()">+ Thêm thợ</button><button class="btn btn-ghost" onclick="exportThoCSV()">Xuất CSV</button><button class="btn btn-ghost" onclick="openBottomSheetLoai()">Lọc: ${filterLoai==='all'?'Tất cả ('+getUsers().filter(u=>u.vaiTro==='Tho').length+')':filterLoai}</button></div><div style="margin-top:12px;display:grid;gap:10px">${list.map(u=>`<div class="card" style="display:flex;gap:12px;align-items:center"><img src="${u.anhDataUrl||''}" class="avatar" onerror="this.style.display='none'"><div style="flex:1"><div style="font-weight:800">${u.hoTen} - ${u.maTho}</div><div style="font-size:12px">${fmtPhone(u.sdt)} · ${u.phanLoai} · ${fmtMoney(u.donGia)}</div></div><div style="display:flex;gap:6px"><button class="btn btn-ghost" style="padding:6px 10px" onclick="openThoForm('${u.maTho}')">Sửa</button><button class="btn btn-ghost" style="padding:6px 10px" onclick="toggleKhoa('${u.maTho}')">${u.trangThai==='hoat_dong'?'Khóa':'Mở'}</button></div></div>`).join('')}</div></div>`;
}
function exportThoCSV(){let csv='\uFEFFMã thợ,Họ tên,SĐT,Phân loại,Đơn giá,Ngày vào làm\n';getUsers().filter(u=>u.vaiTro==='Tho').forEach(u=>{csv+=`${u.maTho},"${u.hoTen}",${u.sdt},${u.phanLoai},${u.donGia},${u.ngayVaoLam}\n`;});downloadFile(csv,'danh_sach_tho.csv','text/csv;');}
function openBottomSheetLoai(){const loais=['all','Thợ sơn','Thợ gỗ','Thợ nề','Thợ hàn sắt','Thợ quảng cáo','Thợ alu','Thợ dán decal','Thợ in bạt','Thợ led điện','Thợ CNC','Thợ thiết kế','Lái xe','Khối văn phòng'];const s=document.getElementById('bottomSheet');s.innerHTML=`<h4>Chọn phân loại</h4>${loais.map(l=>`<div style="padding:12px;border-bottom:1px solid var(--border);cursor:pointer" onclick="chonLoai('${l}')">${l==='all'?'Tất cả':l}</div>`).join('')}`;openSheet();}

let editingMaTho=null;
function openThoForm(maTho){
 editingMaTho=maTho||null;const users=getUsers();const u=maTho?users.find(x=>x.maTho===maTho):null;
 document.getElementById('bottomSheet').innerHTML=`<div style="max-height:70vh;overflow:auto"><h3>${u?'Sửa thợ':'Thêm thợ'}</h3><div class="field"><label>Mã thợ *</label><input id="f_maTho" class="input" value="${u?.maTho||''}" ${u?'disabled':''}></div><div class="field"><label>Họ tên *</label><input id="f_hoTen" class="input" value="${u?.hoTen||''}"></div><div class="field"><label>SĐT *</label><input id="f_sdt" class="input" value="${u?fmtPhone(u.sdt):''}"></div><div class="field"><label>Phân loại</label><select id="f_phanLoai" class="input"><option ${u?.phanLoai==='Thợ sơn'?'selected':''}>Thợ sơn</option><option ${u?.phanLoai==='Thợ quảng cáo'?'selected':''}>Thợ quảng cáo</option><option ${u?.phanLoai==='Thợ hàn sắt'?'selected':''}>Thợ hàn sắt</option><option ${u?.phanLoai==='Thợ gỗ'?'selected':''}>Thợ gỗ</option><option ${u?.phanLoai==='Thợ nề'?'selected':''}>Thợ nề</option><option ${u?.phanLoai==='Thợ alu'?'selected':''}>Thợ alu</option><option ${u?.phanLoai==='Thợ dán decal'?'selected':''}>Thợ dán decal</option><option ${u?.phanLoai==='Thợ in bạt'?'selected':''}>Thợ in bạt</option><option ${u?.phanLoai==='Thợ led điện'?'selected':''}>Thợ led điện</option><option ${u?.phanLoai==='Thợ CNC'?'selected':''}>Thợ CNC</option><option ${u?.phanLoai==='Thợ thiết kế'?'selected':''}>Thợ thiết kế</option><option ${u?.phanLoai==='Lái xe'?'selected':''}>Lái xe</option><option ${u?.phanLoai==='Khối văn phòng'?'selected':''}>Khối văn phòng</option></select></div><div class="field"><label>Đơn giá</label><input id="f_donGia" class="input" type="number" value="${u?.donGia||''}"></div><div class="field"><label>Ngày vào làm</label><input id="f_ngayVao" type="date" class="input" value="${u?.ngayVaoLam||todayYMD()}"></div><button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="saveTho()">Lưu</button></div>`;openSheet();
}
function saveTho(){const maTho=document.getElementById('f_maTho').value.trim();const hoTen=document.getElementById('f_hoTen').value.trim();const sdt=normalizePhone(document.getElementById('f_sdt').value);const phanLoai=document.getElementById('f_phanLoai').value;const donGia=parseInt(document.getElementById('f_donGia').value||'0');const ngayVao=document.getElementById('f_ngayVao').value;const users=getUsers();let user;if(editingMaTho){user=users.find(u=>u.maTho===editingMaTho);user.hoTen=hoTen;user.sdt=sdt;user.phanLoai=phanLoai;user.donGia=donGia;user.ngayVaoLam=ngayVao;}else{user={maTho,hoTen,sdt,vaiTro:'Tho',trangThai:'hoat_dong',donGia,phanLoai,quyen:[],anhDataUrl:'',matKhau:'123456',ngayVaoLam:ngayVao};users.push(user);}LocalDB.save(KEYS.users,users);closeSheet();toast('Lưu thành công');render();}
function toggleKhoa(ma){const users=getUsers();const u=users.find(x=>x.maTho===ma);u.trangThai=u.trangThai==='hoat_dong'?'khoa':'hoat_dong';LocalDB.save(KEYS.users,users);render();}
let duKienNgay=todayYMD();
function renderDuKien(el,user){
  const records=getRecords(); const usersTho=getUsers().filter(u=>u.vaiTro==='Tho');
  el.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-weight:900;font-size:15px">Dự kiến trả thợ</span><input type="date" id="duKienDate" class="input" style="width:168px;height:38px" value="${duKienNgay}" onchange="duKienNgay=this.value;renderDuKien(document.getElementById('viewContent'), getSession().user)"></div><div id="duKienContent"></div></div>`;
  const targetMonth=duKienNgay.slice(0,7);
  const recs=records.filter(r=>r.trangThai==='da_duyet' && r.ngayCong.startsWith(targetMonth));
  const byTho={}; recs.forEach(r=>{ byTho[r.maTho]=(byTho[r.maTho]||0)+1; });
  const groups={}; let tongTho=0, tongCong=0, tongTien=0;
  usersTho.forEach(u=>{const cong=byTho[u.maTho]||0;if(cong===0)return;const tien=cong*(u.donGia||0);if(!groups[u.phanLoai])groups[u.phanLoai]=[];groups[u.phanLoai].push({u,cong,tien});tongTho++;tongCong+=cong;tongTien+=tien;});
  const content=document.getElementById('duKienContent');
  let html=`<div style="padding:14px 18px;border-radius:999px;background:linear-gradient(135deg,#3E2723,#5D4037);color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b>Tổng hợp đến ${duKienNgay}</b><span style="display:flex;gap:6px"><span class="badge" style="background:rgba(255,255,255,.14);color:#fff">${tongTho} thợ</span><span class="badge" style="background:rgba(255,255,255,.14);color:#fff">${tongCong} công</span><span class="badge" style="background:#FFE0B2;color:#3E2723">${fmtMoney(tongTien)}</span></span></div>`;
  Object.entries(groups).forEach(([loai,list])=>{
    const sumTho=list.length;const sumCong=list.reduce((s,x)=>s+x.cong,0);const sumTien=list.reduce((s,x)=>s+x.tien,0);
    html+=`<div class="card" style="padding:0;overflow:hidden;border-radius:20px"><div style="padding:12px 16px;background:#FFFBF7;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap"><span style="font-weight:900">${loai}</span><span style="color:var(--light)">•</span><span style="display:flex;gap:6px"><span class="badge" style="background:#fff">${sumTho} thợ</span><span class="badge" style="background:#fff">${sumCong} công</span><span class="badge b-choduyet" style="background:#fff">${fmtMoney(sumTien)}</span></span></div><div class="table-wrap" style="border:none;border-radius:0"><table><thead><tr><th style="text-align:left;padding-left:16px">Họ tên</th><th>Tổng</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead><tbody>${list.map(({u,cong,tien},i)=>`<tr class="${i%2===0?'row-alt':''}"><td style="text-align:left;padding-left:16px"><b>${u.hoTen}</b><br><small style="color:var(--light)">${u.maTho} · ${fmtPhone(u.sdt)}</small></td><td><b>${cong}</b></td><td>${fmtMoney(u.donGia)}</td><td><b>${fmtMoney(tien)}</b></td></tr>`).join('')}</tbody></table></div></div>`;
  });
  if(!Object.keys(groups).length)html+=`<div class="card" style="text-align:center;color:var(--light)">Chưa có công đã duyệt trong tháng ${targetMonth}</div>`;
  content.innerHTML=html;
}
window.setLoginMode=setLoginMode;window.doLogin=doLogin;window.demoLogin=demoLogin;window.logout=logout;window.switchView=switchView;window.chamCong=chamCong;window.toggleChoDuyet=toggleChoDuyet;window.duyetOne=duyetOne;window.duyetAll=duyetAll;window.chonLoai=chonLoai;window.openBottomSheetLoai=openBottomSheetLoai;window.closeSheet=closeSheet;window.openSheet=openSheet;window.openThoForm=openThoForm;window.saveTho=saveTho;window.toggleKhoa=toggleKhoa;window.renderBangCong=renderBangCong;window.renderDuKien=renderDuKien;window.exportBangCSV=exportBangCSV;window.exportThoCSV=exportThoCSV;
render();
</script>
