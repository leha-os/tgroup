<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NGUYỄN MỘC - CHẤM CÔNG THỢ v2</title>
<style>
:root{
  --bg:#FDF8F3; --text:#4E342E; --accent:#FF6F00; --light:#8D6E63; --border:#EDE2D8; --dark:#3E2723;
  --card:#FFFFFF; --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px}
button,input{font-family:inherit}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 12px rgba(78,52,46,.07);padding:16px}
.btn{border:none;border-radius:999px;padding:11px 18px;font-weight:700;cursor:pointer;transition:all .18s ease;letter-spacing:.1px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#FF8F33);color:#fff;box-shadow:0 4px 14px rgba(255,111,0,.28);border:1px solid rgba(255,111,0,.2)}
.btn-primary:hover{box-shadow:0 6px 18px rgba(255,111,0,.36);transform:translateY(-1px)}
.btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text);box-shadow:0 1px 4px rgba(78,52,46,.06)}
.btn-ghost:hover{background:#FFFBF7;border-color:#D7CCC8}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.badge{font-size:11px;padding:5px 11px;border-radius:999px;font-weight:800;display:inline-flex;align-items:center;gap:4px;border:1px solid transparent}
.b-daduyet{background:#E8F5E9;color:#2E7D32;border-color:#C8E6C9}
.b-choduyet{background:#FFF8E1;color:#EF6C00;border-color:#FFECB3}
.b-tuchoi{background:#FFEBEE;color:#C62828;border-color:#FFCDD2}
.top-brand{text-align:center;padding:18px 12px}
.top-brand h1{font-size:22px;letter-spacing:1px}
.top-brand p{font-size:12px;color:var(--light)}
#app-layout{display:flex;min-height:calc(100vh - 70px)}
#sidebar{width:132px;min-width:132px;background:#fff;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow:auto;padding:12px 10px}
#sidebar .side-btn{width:100%;text-align:left;padding:11px 14px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--text);font-size:13px;font-weight:650;margin-bottom:7px;cursor:pointer;transition:.18s;display:flex;align-items:center}
#sidebar .side-btn.active{background:#FFE0B2;color:var(--dark);border-color:#FFCC80;box-shadow:0 2px 8px rgba(255,111,0,.15);font-weight:800}
#sidebar .side-btn:hover:not(.active){background:#FFF3E0}
#main{flex:1;padding:14px;max-width:100%;overflow:hidden}
footer#global-footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);text-align:center;font-size:11px;line-height:1.4;padding:8px 4px;z-index:50;color:var(--light)}
.login-wrap{max-width:420px;margin:10px auto}
.tabs{display:flex;gap:6px;margin:12px 0;padding:4px;background:#EFEBE9;border-radius:999px}
.tab{flex:1;padding:10px 14px;border-radius:999px;border:1px solid transparent;background:transparent;text-align:center;font-weight:700;cursor:pointer;transition:.18s;font-size:13px;color:var(--light)}
.tab.active{background:#fff;color:var(--dark);border-color:var(--border);box-shadow:0 2px 8px rgba(0,0,0,.08);font-weight:800}
.input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:15px;transition:.18s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,111,0,.15)}
.field{margin-bottom:12px}
.field .err{color:#C62828;font-size:12px;margin-top:4px;min-height:14px}
.big-btn{width:100%;padding:18px;border-radius:999px;background:linear-gradient(135deg,var(--accent),#FF8F33);color:#fff;font-size:17px;font-weight:900;border:none;cursor:pointer;letter-spacing:.5px;box-shadow:0 8px 20px rgba(255,111,0,.32);transition:.18s}
.big-btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(255,111,0,.38)}
.big-btn:disabled{background:#BDBDBD;box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px}
.stat .label{font-size:12px;color:var(--light)}
.stat .value{font-size:20px;font-weight:900;margin-top:4px}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:16px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:500px}
th,td{border:1px solid var(--border);padding:8px 6px;text-align:center;font-size:12px;white-space:nowrap}
thead th{background:var(--dark);color:#fff;position:sticky;top:0;z-index:2}
.sticky-left{position:sticky;left:0;z-index:3;background:#fff}
.sticky-left.head{background:var(--dark)}
th.sticky-right,td.sticky-right{position:sticky;right:0;z-index:3}
.col-tong{right:200px !important}
.col-dongia{right:100px !important}
.col-thanhtien{right:0 !important}
th.col-tong,th.col-dongia,th.col-thanhtien{background:#3E2723;color:#fff}
td.col-tong,td.col-dongia,td.col-thanhtien{background:#3E2723;color:#fff;font-weight:700}
td.cell-co{background:#E8F5E9}
td.cell-cho{background:#FFF8E1}
td.cell-khong{background:#FFEBEE}
.row-alt{background:#FFFBF7}
.bottom-sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.18);z-index:100;max-height:70vh;overflow:auto;padding:16px;transform:translateY(100%);transition:.28s cubic-bezier(.32,.72,0,1)}
.bottom-sheet.open{transform:translateY(0)}
.sheet-backdrop{position:fixed;inset:0;background:rgba(60,40,30,.35);backdrop-filter:blur(3px);z-index:99;display:none}
.sheet-backdrop.open{display:block}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;z-index:200;display:none;box-shadow:0 8px 20px rgba(0,0,0,.2);font-weight:600}
.toast.show{display:block}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--border);background:#eee}
.demo-banner{background:#FFF8E1;border:1px dashed #F57F17;padding:8px 14px;border-radius:999px;font-size:12px;text-align:center;margin-bottom:10px;font-weight:600}
@media(max-width:768px){#app-layout{flex-direction:column}#sidebar{width:100%;min-width:100%;height:auto;display:flex;gap:8px;overflow:auto;position:static;padding:10px}#sidebar .side-btn{white-space:nowrap;width:auto;padding:9px 14px}#main{padding:10px}}
</style>
</head>
<body>
<div id="topBrand" class="top-brand" style="display:none"><h1>NGUYỄN MỘC</h1><p>CÔNG TY TNHH SẢN XUẤT THƯƠNG MẠI NGUYỄN MỘC</p></div>
<div id="app"></div>
<div id="sheetBackdrop" class="sheet-backdrop" onclick="closeSheet()"></div>
<div id="bottomSheet" class="bottom-sheet"></div>
<div id="toast" class="toast"></div>
<footer id="global-footer"><div>© 2026 WeWall Group · Nguyen Moc Co. LTD | Le Ha</div><div>Hệ thống Chấm công Nội bộ</div></footer>
<script>
const LocalDB={load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},save(k,v){localStorage.setItem(k,JSON.stringify(v))}};
const KEYS={users:'nm2_users',records:'nm2_records',chot:'nm2_chot',audit:'nm2_audit',cauhinh:'nm2_cauhinh',session:'nm2_session'};
function fmtMoney(v){if(v==null||isNaN(v))return'0₫';return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'₫';}
function fmtPhone(s){if(!s)return'';const d=s.replace(/\D/g,'');if(d.length!==10)return s;return d.slice(0,3)+' '+d.slice(3,7)+' '+d.slice(7);}
function fmtPhoneInput(v){const d=v.replace(/\D/g,'').slice(0,10);if(d.length<=3)return d;if(d.length<=7)return d.slice(0,3)+' '+d.slice(3);return d.slice(0,3)+' '+d.slice(3,7)+' '+d.slice(7);}
function normalizePhone(s){return(s||'').replace(/\D/g,'');}
function nowStr(){return new Date().toISOString();}
function todayYMD(){const d=new Date();return d.toISOString().slice(0,10);}
function monthKey(d=new Date()){return d.toISOString().slice(0,7);}
function genId(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function seedIfNeeded(){
 if(LocalDB.load(KEYS.users))return;
 const users=[
  {maTho:'nbatam',hoTen:'NBA Tâm',sdt:'0784944886',vaiTro:'GiamDoc',trangThai:'hoat_dong',donGia:0,phanLoai:'Quản lý',quyen:['dashboard','bang_cong','sua_cong','duyet_cong','nhan_su','thong_ke','xuat_excel','cai_dat'],anhDataUrl:'',matKhau:'admin123',ngayVaoLam:'2024-01-15'},
  {maTho:'QL001',hoTen:'Nguyễn Văn Quản',sdt:'0901234567',vaiTro:'QuanLy',trangThai:'hoat_dong',donGia:0,phanLoai:'Quản lý',quyen:['dashboard','bang_cong','duyet_cong','nhan_su','thong_ke','xuat_excel'],anhDataUrl:'',matKhau:'123456',ngayVaoLam:'2024-03-01'},
  {maTho:'KT001',hoTen:'Trần Thị Kế',sdt:'0907654321',vaiTro:'KeToan',trangThai:'hoat_dong',donGia:0,phanLoai:'Kế toán',quyen:['dashboard','bang_cong','thong_ke','xuat_excel'],anhDataUrl:'',matKhau:'123456',ngayVaoLam:'2024-02-10'},
  {maTho:'T001',hoTen:'Lê Văn Sơn',sdt:'0981112222',vaiTro:'Tho',trangThai:'hoat_dong',donGia:350000,phanLoai:'Thợ sơn',quyen:[],anhDataUrl:'',matKhau:'123456',ngayVaoLam:'2024-05-12'},
  {maTho:'T002',hoTen:'Phạm Thị Gỗ',sdt:'0982223333',vaiTro:'Tho',trangThai:'hoat_dong',donGia:300000,phanLoai:'Thợ gỗ',quyen:[],anhDataUrl:'',matKhau:'123456',ngayVaoLam:'2024-06-20'},
  {maTho:'T003',hoTen:'Hoàng Văn Nề',sdt:'0983334444',vaiTro:'Tho',trangThai:'hoat_dong',donGia:400000,phanLoai:'Thợ nề',quyen:[],anhDataUrl:'',matKhau:'123456',ngayVaoLam:'2025-01-08'},
  {maTho:'T004',hoTen:'Đỗ Thị Mai',sdt:'0984445555',vaiTro:'Tho',trangThai:'hoat_dong',donGia:250000,phanLoai:'Thợ sơn',quyen:[],anhDataUrl:'',matKhau:'123456',ngayVaoLam:'2024-11-02'},
  {maTho:'T005',hoTen:'Bùi Văn Tùng',sdt:'0985556666',vaiTro:'Tho',trangThai:'hoat_dong',donGia:320000,phanLoai:'Thợ gỗ',quyen:[],anhDataUrl:'',matKhau:'123456',ngayVaoLam:'2025-03-15'},
 ];
 LocalDB.save(KEYS.users,users);
 LocalDB.save(KEYS.cauhinh,{GIO_MO_CHAM_CONG:'05:00',CONG_TOI_DA_NGAY:1});
 const curM=monthKey();const records=[];const statuses=['da_duyet','cho_duyet','tu_choi'];const lyDos=['Trùng ca','Ảnh mờ','Sai vị trí'];
 for(let i=0;i<15;i++){const tho=users[3+(i%5)];const day=String(1+(i%20)).padStart(2,'0');const ngayCong=`${curM}-${day}`;const st=statuses[i%3];records.push({maBanGhi:genId('BG'),maTho:tho.maTho,ngayCong,thoiDiemGui:new Date().toISOString(),trangThai:st,nguoiDuyet:st!=='cho_duyet'?'QL001':'',thoiDiemDuyet:st!=='cho_duyet'?new Date().toISOString():'',lyDoTuChoi:st==='tu_choi'?lyDos[i%3]:'',viDo:10.762622+Math.random()*0.01,kinhDo:106.660172+Math.random()*0.01,doChinhXac:20});}
 LocalDB.save(KEYS.records,records);LocalDB.save(KEYS.chot,[]);LocalDB.save(KEYS.audit,[]);
}
seedIfNeeded();
function getUsers(){return LocalDB.load(KEYS.users)||[]}
function getRecords(){return LocalDB.load(KEYS.records)||[]}
function getCauHinh(){return LocalDB.load(KEYS.cauhinh)||{GIO_MO_CHAM_CONG:'05:00',CONG_TOI_DA_NGAY:1}}
function getSession(){const s=LocalDB.load(KEYS.session);if(!s)return null;if(new Date(s.han)<new Date())return null;return s;}
function setSession(user){LocalDB.save(KEYS.session,{user,han:new Date(Date.now()+7*24*3600*1000).toISOString()})}
function clearSession(){localStorage.removeItem(KEYS.session)}
function addAudit(hanhDong,maBanGhi,chiTiet){const a=LocalDB.load(KEYS.audit)||[];a.unshift({thoiDiem:nowStr(),nguoiThucHien:(getSession()?.user?.maTho||'system'),hanhDong,maBanGhi,chiTiet});LocalDB.save(KEYS.audit,a)}
function hasPerm(user,perm){if(!user)return false;if(user.vaiTro==='GiamDoc')return true;return(user.quyen||[]).includes(perm)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
let loginMode='maTho';let demoBanner=false;let currentView='duyet';let thoTab='chamcong';
function render(){const sess=getSession();if(!sess){renderLogin();return}const user=sess.user;document.getElementById('topBrand').style.display='none';if(user.vaiTro==='Tho'&&(!user.quyen||user.quyen.length===0)){renderTho(user);}else{renderQuanLy(user);}}
function renderLogin(){
 document.getElementById('topBrand').style.display='block';
 const app=document.getElementById('app');
 app.innerHTML=`<div class="login-wrap"><div class="card" style="text-align:center"><h2 style="font-size:20px">NGUYỄN MỘC</h2><div style="font-size:12px;color:var(--light)">CÔNG TY TNHH SXTM</div><div style="font-weight:900;margin:8px 0 14px">CHẤM CÔNG THỢ</div><div class="tabs"><div class="tab ${loginMode==='maTho'?'active':''}" onclick="setLoginMode('maTho')">Mã thợ</div><div class="tab ${loginMode==='sdt'?'active':''}" onclick="setLoginMode('sdt')">Số điện thoại</div></div><div class="field"><input id="loginId" class="input" placeholder="${loginMode==='maTho'?'Nhập mã thợ (vd nbatam)':'Nhập SĐT'}" inputmode="${loginMode==='maTho'?'text':'tel'}"></div><div class="field"><input id="loginPw" class="input" type="password" placeholder="Mật khẩu"></div><div id="loginErr" class="err" style="text-align:left"></div><button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doLogin()">Đăng nhập</button><div style="margin-top:16px;border-top:1px dashed var(--border);padding-top:12px"><div style="font-size:12px;color:var(--light);margin-bottom:8px">Xem thử nhanh</div><div class="grid2"><button class="btn btn-ghost" onclick="demoLogin('Tho')">Thợ</button><button class="btn btn-ghost" onclick="demoLogin('QuanLy')">Quản Lý</button><button class="btn btn-ghost" onclick="demoLogin('KeToan')">Kế Toán</button><button class="btn btn-ghost" onclick="demoLogin('GiamDoc')">Giám đốc</button></div></div></div></div>`;
}
function setLoginMode(m){loginMode=m;renderLogin();}
function doLogin(){
 const id=document.getElementById('loginId').value.trim();const pw=document.getElementById('loginPw').value;const users=getUsers();let u=null;
 if(loginMode==='maTho'){u=users.find(x=>x.maTho.toLowerCase()===id.toLowerCase()&&x.matKhau===pw);}else{const norm=normalizePhone(id);u=users.find(x=>normalizePhone(x.sdt)===norm&&x.matKhau===pw);}
 if(!u){document.getElementById('loginErr').textContent='Sai mã/SĐT hoặc mật khẩu';return;}
 if(u.trangThai!=='hoat_dong'){document.getElementById('loginErr').textContent='Tài khoản đã bị khóa';return;}
 demoBanner=false;setSession(u);render();
}
function demoLogin(role){
 const users=getUsers();let u;if(role==='Tho')u=users.find(x=>x.vaiTro==='Tho');else if(role==='QuanLy')u=users.find(x=>x.vaiTro==='QuanLy');else if(role==='KeToan')u=users.find(x=>x.vaiTro==='KeToan');else u=users.find(x=>x.vaiTro==='GiamDoc');
 demoBanner=true;setSession(u);render();
}
function renderTho(user){
 const records=getRecords().filter(r=>r.maTho===user.maTho);const curM=monthKey();const daDuyet=records.filter(r=>r.trangThai==='da_duyet'&&r.ngayCong.startsWith(curM));const choDuyet=records.filter(r=>r.trangThai==='cho_duyet'&&r.ngayCong.startsWith(curM));const tongCong=daDuyet.length;const tien=(user.donGia||0)*tongCong;const today=todayYMD();const daChamHomNay=records.some(r=>r.ngayCong===today);const cauhinh=getCauHinh();const gioMo=cauhinh.GIO_MO_CHAM_CONG||'05:00';const now=new Date();const[hM,mM]=gioMo.split(':').map(Number);const moPhut=hM*60+mM;const nowPhut=now.getHours()*60+now.getMinutes();const chuaDenGio=nowPhut<moPhut;
 const app=document.getElementById('app');
 app.innerHTML=`<div id="app-layout"><div id="main" style="max-width:520px;margin:0 auto;width:100%">${demoBanner?'<div class="demo-banner">Xem thử - Tài khoản Thợ</div>':''}<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:900">Xin chào, ${user.hoTen}</div><button class="btn btn-ghost" style="padding:6px 12px" onclick="logout()">Thoát</button></div><div style="font-size:12px;color:var(--light)">${user.maTho} · ${fmtPhone(user.sdt)}</div></div><div class="tabs"><div class="tab ${thoTab==='chamcong'?'active':''}" onclick="thoTab='chamcong';render()">Chấm công</div><div class="tab ${thoTab==='thongtin'?'active':''}" onclick="thoTab='thongtin';render()">Thông tin</div></div>${thoTab==='chamcong'?`<div class="card" style="margin-top:10px"><button id="btnCham" class="big-btn" ${daChamHomNay||chuaDenGio?'disabled':''} onclick="chamCong()">${daChamHomNay?'Đã chấm công':'CHẤM CÔNG HÔM NAY'}</button>${chuaDenGio?`<div style="color:#C62828;text-align:center;margin-top:8px;font-size:13px">Chưa đến giờ chấm công (sau ${gioMo})</div>`:''}${daChamHomNay?'<div style="text-align:center;color:#2E7D32;margin-top:8px;font-size:13px">Cảm ơn đã chấm công, vui lòng chờ quản lý duyệt</div>':''}</div><div class="grid2" style="margin-top:10px"><div class="card stat"><div class="label">1. Số công hiện tại</div><div class="value">${tongCong}</div><div style="font-size:11px;color:var(--light)">đã duyệt tháng này</div></div><div class="card stat"><div class="label">2. Số tiền dự kiến</div><div class="value">${fmtMoney(tien)}</div><div style="font-size:11px;color:var(--light)">tạm tính, chưa phải lương chốt</div></div></div><div class="card" style="margin-top:10px;cursor:pointer" onclick="toggleChoDuyet()"><div style="display:flex;justify-content:space-between"><div><b>3. Số công chờ quản lý duyệt</b></div><b>${choDuyet.length}</b></div><div id="choDuyetList" style="display:none;margin-top:10px">${choDuyet.length===0?'<div style="font-size:13px;color:var(--light)">Không có</div>':choDuyet.map(r=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span>${r.ngayCong}</span><span class="badge b-choduyet">Chờ duyệt</span></div>`).join('')}</div></div><div class="card" style="margin-top:10px"><div style="font-size:12px;color:var(--light)">Lịch sử gần đây</div>${records.slice(0,8).map(r=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f0eb"><span>${r.ngayCong}</span><span class="badge ${r.trangThai==='da_duyet'?'b-daduyet':r.trangThai==='cho_duyet'?'b-choduyet':'b-tuchoi'}">${r.trangThai==='da_duyet'?'Đã duyệt':r.trangThai==='cho_duyet'?'Chờ duyệt':'Từ chối'}</span>${r.viDo?`<a href="https://maps.google.com/?q=${r.viDo},${r.kinhDo}" target="_blank" style="font-size:11px;color:var(--accent)">Bản đồ</a>`:''}</div>`).join('')}</div>`:`<div class="card" style="margin-top:10px"><div style="display:flex;gap:12px;align-items:center;margin-bottom:12px"><img src="${user.anhDataUrl||''}" class="avatar" onerror="this.style.display='none'"><div><div style="font-weight:900">${user.hoTen}</div><div style="font-size:12px;color:var(--light)">${user.maTho} · ${fmtPhone(user.sdt)}</div></div></div><div style="padding:8px 0"><b>5. Họ tên, mã thợ, SĐT</b><div>${user.hoTen} - ${user.maTho} - ${fmtPhone(user.sdt)}</div></div><div style="padding:8px 0;border-top:1px solid var(--border)"><b>6. Ngày vào làm</b><div>${user.ngayVaoLam||''}</div></div><div style="padding:8px 0;border-top:1px solid var(--border)"><b>7. Lương ngày</b><div>${fmtMoney(user.donGia)}</div></div></div>`}</div></div>`;
}
function toggleChoDuyet(){const el=document.getElementById('choDuyetList');el.style.display=el.style.display==='none'?'block':'none';}
function chamCong(){
 const sess=getSession();if(!sess)return;const user=sess.user;const today=todayYMD();const recs=getRecords();if(recs.some(r=>r.maTho===user.maTho&&r.ngayCong===today)){toast('Đã chấm công hôm nay');return;}
 const cauhinh=getCauHinh();const[hM,mM]=cauhinh.GIO_MO_CHAM_CONG.split(':').map(Number);const now=new Date();if(now.getHours()*60+now.getMinutes()<hM*60+mM){toast('Chưa đến giờ chấm công');return;}
 const saveRecord=(lat,lng,acc)=>{const nr={maBanGhi:genId('BG'),maTho:user.maTho,ngayCong:today,thoiDiemGui:nowStr(),trangThai:'cho_duyet',nguoiDuyet:'',thoiDiemDuyet:'',lyDoTuChoi:'',viDo:lat,kinhDo:lng,doChinhXac:acc};recs.unshift(nr);LocalDB.save(KEYS.records,recs);addAudit('Gửi chấm công',nr.maBanGhi,`Ngày ${today}`);toast('Cảm ơn đã chấm công, vui lòng chờ quản lý duyệt');render();};
 if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{saveRecord(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy);},()=>{saveRecord(null,null,null);},{enableHighAccuracy:true,timeout:5000});}else{saveRecord(null,null,null);}
}
const MENU=[
  {id:'duyet',label:'Duyệt công',perm:'duyet_cong'},
  {id:'dashboard',label:'Dashboard',perm:'dashboard'},
  {id:'bangcong',label:'Bảng công',perm:'bang_cong'},
  {id:'dstho',label:'Danh sách thợ',perm:'nhan_su'},
  {id:'dukien',label:'Dự kiến trả thợ',perm:'thong_ke'},
];
function renderQuanLy(user){
 const allowed=MENU.filter(m=>hasPerm(user,m.perm));const cur=allowed.find(x=>x.id===currentView)?currentView:(allowed[0]?.id||'duyet');currentView=cur;
 const app=document.getElementById('app');
 app.innerHTML=`<div id="app-layout"><div id="sidebar">${allowed.map(m=>`<button class="side-btn ${m.id===cur?'active':''}" onclick="switchView('${m.id}')">${m.label}</button>`).join('')}<button class="side-btn" onclick="logout()" style="margin-top:16px;color:#C62828">Đăng xuất</button></div><div id="main"><div style="margin-bottom:8px"><b>CÔNG TY TNHH SẢN XUẤT THƯƠNG MẠI NGUYỄN MỘC</b></div>${demoBanner?'<div class="demo-banner">Xem thử - '+user.vaiTro+'</div>':''}<div id="viewContent"></div></div></div>`;
 renderView(user,cur);
}
function switchView(id){currentView=id;const sess=getSession();renderQuanLy(sess.user);}
function logout(){clearSession();render();}
function renderView(user,view){
 const el=document.getElementById('viewContent');
 if(view==='dashboard')renderDashboard(el,user);
 else if(view==='duyet')renderDuyet(el,user);
 else if(view==='bangcong')renderBangCong(el,user);
 else if(view==='dstho')renderDsTho(el,user);
 else if(view==='dukien')renderDuKien(el,user);
}
function renderDashboard(el,user){
 const records=getRecords();const users=getUsers().filter(u=>u.vaiTro==='Tho'&&u.trangThai==='hoat_dong');const curM=monthKey();const daDuyet=records.filter(r=>r.trangThai==='da_duyet'&&r.ngayCong.startsWith(curM));const choDuyet=records.filter(r=>r.trangThai==='cho_duyet');const tongTien=daDuyet.reduce((s,r)=>{const u=getUsers().find(x=>x.maTho===r.maTho);return s+(u?.donGia||0);},0);const today=todayYMD();const diLam=new Set(records.filter(r=>r.ngayCong===today&&r.trangThai!=='tu_choi').map(r=>r.maTho)).size;const chuaDonGia=users.filter(u=>!u.donGia).length;
 el.innerHTML=`<div class="grid2"><div class="card stat"><div class="label">Dự kiến trả thợ tháng (tạm tính)</div><div class="value">${fmtMoney(tongTien)}</div></div><div class="card stat"><div class="label">Thợ đi làm hôm nay / Tổng số</div><div class="value">${diLam} / ${users.length}</div></div><div class="card stat"><div class="label">Số bản ghi chờ duyệt</div><div class="value">${choDuyet.length}</div></div><div class="card stat"><div class="label">Tổng công đã duyệt tháng</div><div class="value">${daDuyet.length}</div></div></div>${chuaDonGia?`<div class="card" style="margin-top:10px;border-color:#F57F17;background:#FFF8E1">Cảnh báo: ${chuaDonGia} thợ chưa có đơn giá</div>`:''}`;
}
function renderDuyet(el,user){
 let recs=getRecords().filter(r=>r.trangThai==='cho_duyet');recs.sort((a,b)=>new Date(b.thoiDiemGui)-new Date(a.thoiDiemGui));
 el.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h3>📍 Duyệt công (${recs.length})</h3><button class="btn btn-primary" onclick="duyetAll()">Duyệt hàng loạt (${recs.length})</button></div><div style="margin-top:8px;font-size:12px;color:var(--light)">Vị trí GPS đưa lên đầu để duyệt nhanh</div><div style="margin-top:12px;display:grid;gap:12px">${recs.map(r=>{
   const u=getUsers().find(x=>x.maTho===r.maTho);const timeAgo=Math.floor((Date.now()-new Date(r.thoiDiemGui))/60000);const agoTxt=timeAgo<60?`${timeAgo} phút trước`:`${Math.floor(timeAgo/60)} giờ trước`;const hasGPS=r.viDo&&r.kinhDo;
   return `<div class="card" style="border-left:4px solid var(--accent);padding:12px"><div style="display:flex;justify-content:space-between;gap:8px"><div style="flex:1"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="badge" style="background:#E3F2FD;color:#1565C0;border-color:#90CAF9">📍 ${hasGPS? r.viDo.toFixed(5)+', '+r.kinhDo.toFixed(5) : 'Không có GPS'}</span>${hasGPS?`<a href="https://maps.google.com/?q=${r.viDo},${r.kinhDo}" target="_blank" class="btn btn-ghost" style="padding:4px 10px;font-size:12px">🗺️ Bản đồ</a><span style="font-size:11px;color:var(--light)">±${Math.round(r.doChinhXac||0)}m</span>`:''}</div><div style="margin-top:8px;font-weight:800;font-size:15px">${u?.hoTen||r.maTho} <small style="font-weight:400;color:var(--light)">${u?.phanLoai||''}</small></div><div style="font-size:12px;color:var(--light)">${r.maTho} · ${fmtPhone(u?.sdt||'')} · Ngày công: <b style="color:var(--text)">${r.ngayCong}</b> · ${agoTxt}</div></div></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-primary" style="flex:1" onclick="duyetOne('${r.maBanGhi}',true)">✓ Duyệt</button><button class="btn btn-ghost" style="flex:1" onclick="duyetOne('${r.maBanGhi}',false)">✕ Từ chối</button></div></div>`;
 }).join('') || '<div style="text-align:center;padding:20px;color:var(--light)">Không có bản ghi chờ duyệt ✅</div>'}</div></div>`;
}
function duyetOne(id,ok){if(!ok){const reason=prompt('Nhập lý do từ chối (bắt buộc):');if(!reason)return;updateRecordStatus(id,'tu_choi',reason);}else{updateRecordStatus(id,'da_duyet','');}}
function duyetAll(){const recs=getRecords().filter(r=>r.trangThai==='cho_duyet');if(recs.length===0)return;if(!confirm(`Duyệt ${recs.length} bản ghi?`))return;recs.forEach(r=>updateRecordStatus(r.maBanGhi,'da_duyet','',true));toast(`Đã duyệt ${recs.length} bản ghi`);render();}
function updateRecordStatus(maBanGhi,trangThai,lyDo,silent){if(!hasPerm(getSession().user,'duyet_cong')){toast('Không có quyền duyệt');return;}const recs=getRecords();const idx=recs.findIndex(r=>r.maBanGhi===maBanGhi);if(idx<0)return;recs[idx].trangThai=trangThai;recs[idx].nguoiDuyet=getSession().user.maTho;recs[idx].thoiDiemDuyet=nowStr();recs[idx].lyDoTuChoi=lyDo||'';LocalDB.save(KEYS.records,recs);addAudit(trangThai==='da_duyet'?'Duyệt công':'Từ chối công',maBanGhi,lyDo||'');if(!silent){toast(trangThai==='da_duyet'?'Đã duyệt':'Đã từ chối');render();}else LocalDB.save(KEYS.records,recs);}
let bangThang=monthKey();
function renderBangCong(el,user){
 const usersTho=getUsers().filter(u=>u.vaiTro==='Tho');const records=getRecords();const[y,m]=bangThang.split('-').map(Number);const daysInMonth=new Date(y,m,0).getDate();const canSua=hasPerm(user,'sua_cong');const chots=LocalDB.load(KEYS.chot)||[];const daChot=chots.find(c=>c.thang===bangThang);
 el.innerHTML=`<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input type="month" id="bangThangInput" class="input" style="width:160px" value="${bangThang}" onchange="bangThang=this.value;renderBangCong(document.getElementById('viewContent'), getSession().user)"><button class="btn btn-primary" onclick="exportBangCSV()">Xuất CSV</button><button class="btn btn-ghost" onclick="chotThang()" ${daChot?'disabled':''}>${daChot?'Đã chốt':'Chốt tháng'}</button>${daChot&&canSua?'<button class="btn btn-ghost" onclick="dieuChinhSauChot()">Điều chỉnh sau chốt</button>':''}</div><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th class="sticky-left head" style="min-width:180px;left:0">Thợ</th>${Array.from({length:daysInMonth},(_,i)=>`<th>${i+1}</th>`).join('')}<th class="sticky-right col-tong" style="min-width:50px">Tổng</th><th class="sticky-right col-dongia" style="min-width:100px">Đơn giá</th><th class="sticky-right col-thanhtien" style="min-width:120px">Thành tiền</th></tr></thead><tbody>${usersTho.map((u,ui)=>{const recByDay={};records.forEach(r=>{if(r.maTho===u.maTho&&r.ngayCong.startsWith(bangThang)){const d=Number(r.ngayCong.slice(8,10));recByDay[d]=r;}});let tong=0;Object.values(recByDay).forEach(r=>{if(r.trangThai==='da_duyet')tong++;});return `<tr class="${ui%2===0?'row-alt':''}"><td class="sticky-left" style="text-align:left;font-weight:700">${u.hoTen}<br><small>${u.maTho}</small></td>${Array.from({length:daysInMonth},(_,i)=>{const d=i+1;const r=recByDay[d];let cls='';let txt='';if(r){if(r.trangThai==='da_duyet'){cls='cell-co';txt='✓';}else if(r.trangThai==='cho_duyet'){cls='cell-cho';txt='C';}else{cls='cell-khong';txt='X';}}return `<td class="${cls}" title="${r?r.trangThai:''}">${txt}</td>`;}).join('')}<td class="sticky-right col-tong" style="right:200px">${tong}</td><td class="sticky-right col-dongia" style="right:100px">${fmtMoney(u.donGia)}</td><td class="sticky-right col-thanhtien">${fmtMoney(tong*(u.donGia||0))}</td></tr>`;}).join('')}</tbody></table></div></div>`;
}
function exportBangCSV(){const usersTho=getUsers().filter(u=>u.vaiTro==='Tho');const records=getRecords();const[y,m]=bangThang.split('-').map(Number);const dim=new Date(y,m,0).getDate();let csv='\uFEFFThợ,Mã,'+Array.from({length:dim},(_,i)=>i+1).join(',')+',Tổng,Đơn giá,Thành tiền\n';usersTho.forEach(u=>{const byDay={};records.forEach(r=>{if(r.maTho===u.maTho&&r.ngayCong.startsWith(bangThang)){const d=Number(r.ngayCong.slice(8,10));byDay[d]=r;}});let tong=0;Object.values(byDay).forEach(r=>{if(r.trangThai==='da_duyet')tong++;});const row=[`"${u.hoTen}"`,u.maTho];for(let d=1;d<=dim;d++){const r=byDay[d];row.push(r?(r.trangThai==='da_duyet'?'1':r.trangThai==='cho_duyet'?'C':'X'):'');}row.push(tong,u.donGia,tong*(u.donGia||0));csv+=row.join(',')+'\n';});downloadFile(csv,`bang_cong_${bangThang}.csv`,'text/csv;charset=utf-8;');}
function downloadFile(content,name,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
function chotThang(){if(!hasPerm(getSession().user,'bang_cong')){toast('Không có quyền');return;}const note=prompt('Ghi chú chốt tháng (nếu có):')||'';const chots=LocalDB.load(KEYS.chot)||[];const records=getRecords().filter(r=>r.ngayCong.startsWith(bangThang));chots.push({thang:bangThang,thoiDiemChot:nowStr(),nguoiChot:getSession().user.maTho,duLieu:records,ghiChu:note});LocalDB.save(KEYS.chot,chots);addAudit('Chốt tháng','',bangThang);toast('Đã chốt tháng '+bangThang);render();}
function dieuChinhSauChot(){if(!hasPerm(getSession().user,'sua_cong')){toast('Không có quyền sửa');return;}const lyDo=prompt('Nhập lý do điều chỉnh sau chốt (bắt buộc):');if(!lyDo)return;addAudit('Điều chỉnh sau chốt','',bangThang+' - '+lyDo);toast('Đã ghi nhận điều chỉnh: '+lyDo);}
let filterLoai='all';
function renderDsTho(el,user){
 const allUsers=getUsers();let list=allUsers.filter(u=>u.vaiTro==='Tho');if(filterLoai!=='all')list=list.filter(u=>u.phanLoai===filterLoai);
 el.innerHTML=`<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="openThoForm()">+ Thêm thợ</button><button class="btn btn-ghost" onclick="exportThoCSV()">Xuất CSV</button><button class="btn btn-ghost" onclick="openBottomSheetLoai()">Lọc: ${filterLoai==='all'?'Tất cả':filterLoai}</button></div><div style="margin-top:12px;display:grid;gap:10px">${list.map(u=>`<div class="card" style="display:flex;gap:12px;align-items:center"><img src="${u.anhDataUrl||''}" class="avatar" onerror="this.style.display='none'"><div style="flex:1"><div style="font-weight:800">${u.hoTen} - ${u.maTho} <span style="font-weight:400;color:var(--light)">${u.trangThai==='khoa'?'[Khóa]':''}</span></div><div style="font-size:12px">${fmtPhone(u.sdt)} · ${u.phanLoai} · ${fmtMoney(u.donGia)} · Vào làm ${u.ngayVaoLam||''}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost" style="padding:6px 10px" onclick="openThoForm('${u.maTho}')">Sửa</button><button class="btn btn-ghost" style="padding:6px 10px" onclick="toggleKhoa('${u.maTho}')">${u.trangThai==='hoat_dong'?'Khóa':'Mở'}</button><button class="btn btn-ghost" style="padding:6px 10px" onclick="resetMk('${u.maTho}')">Reset MK</button></div></div>`).join('')}</div></div>`;
}
function exportThoCSV(){const users=getUsers().filter(u=>u.vaiTro==='Tho');let csv='\uFEFFMã thợ,Họ tên,SĐT,Phân loại,Đơn giá,Ngày vào làm,Trạng thái\n';users.forEach(u=>{csv+=`${u.maTho},"${u.hoTen}",${u.sdt},${u.phanLoai},${u.donGia},${u.ngayVaoLam},${u.trangThai}\n`;});downloadFile(csv,'danh_sach_tho.csv','text/csv;charset=utf-8;');}
function openBottomSheetLoai(){const loais=['all','Thợ sơn','Thợ gỗ','Thợ nề','Quản lý','Kế toán'];const sheet=document.getElementById('bottomSheet');sheet.innerHTML=`<h4>Chọn phân loại</h4><input id="searchLoai" class="input" placeholder="Tìm..." oninput="filterSheet(this.value)" style="margin:8px 0">${loais.map(l=>`<div class="sheet-item" data-val="${l}" onclick="chonLoai('${l}')" style="padding:12px;border-bottom:1px solid var(--border);cursor:pointer">${l==='all'?'Tất cả':l}</div>`).join('')}`;openSheet();}
function filterSheet(q){document.querySelectorAll('.sheet-item').forEach(el=>{el.style.display=el.dataset.val.toLowerCase().includes(q.toLowerCase())?'block':'none';});}
function chonLoai(l){filterLoai=l;closeSheet();render();}
function openSheet(){document.getElementById('bottomSheet').classList.add('open');document.getElementById('sheetBackdrop').classList.add('open');}
function closeSheet(){document.getElementById('bottomSheet').classList.remove('open');document.getElementById('sheetBackdrop').classList.remove('open');}
let editingMaTho=null;
function openThoForm(maTho){
 editingMaTho=maTho||null;const users=getUsers();const u=maTho?users.find(x=>x.maTho===maTho):null;
 const sheet=document.getElementById('bottomSheet');
 sheet.innerHTML=`<div style="max-height:70vh;overflow:auto"><h3>${u?'Sửa thợ':'Thêm thợ'}</h3><div class="field"><label>Mã thợ *</label><input id="f_maTho" class="input" value="${u?.maTho||''}" ${u?'disabled':''}><div class="err" id="e_maTho"></div></div><div class="field"><label>Họ tên *</label><input id="f_hoTen" class="input" value="${u?.hoTen||''}"><div class="err" id="e_hoTen"></div></div><div class="field"><label>SĐT *</label><input id="f_sdt" class="input" inputmode="tel" value="${u?fmtPhone(u.sdt):''}" oninput="this.value=fmtPhoneInput(this.value);validateTho()"><div class="err" id="e_sdt"></div></div><div class="field"><label>Phân loại</label><div class="input" onclick="openLoaiForForm()" id="f_phanLoai_display">${u?.phanLoai||'Thợ sơn'}</div><input type="hidden" id="f_phanLoai" value="${u?.phanLoai||'Thợ sơn'}"></div><div class="field"><label>Đơn giá (gõ 300 = 300.000) *</label><input id="f_donGia" class="input" inputmode="numeric" value="${u?Math.round((u.donGia||0)/1000):''}" placeholder="gõ 300 = 300.000" oninput="validateTho()"><div style="font-size:12px;color:var(--light)" id="f_donGia_preview"></div><div class="err" id="e_donGia"></div></div><div class="field"><label>Ngày vào làm</label><input id="f_ngayVao" type="date" class="input" value="${u?.ngayVaoLam||todayYMD()}"></div><div class="field"><label>Avatar</label><input id="f_avatar" type="file" accept="image/*" class="input" onchange="handleAvatar(this)"><img id="f_avatar_prev" src="${u?.anhDataUrl||''}" class="avatar" style="margin-top:6px;${u?.anhDataUrl?'':'display:none'}"></div><div class="field"><label>Quyền (8 quyền)</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px" id="quyenBox"></div></div><div class="field"><label>Mật khẩu ${u?' (để trống giữ nguyên)':''}</label><input id="f_mk" class="input" type="text" value=""></div><button id="btnSaveTho" class="btn btn-primary" style="width:100%;margin-top:12px" onclick="saveTho()" disabled>Lưu</button></div>`;
 openSheet();const quyenList=[['dashboard','Xem Dashboard'],['bang_cong','Xem Bảng Công'],['sua_cong','Sửa Công'],['duyet_cong','Duyệt Công'],['nhan_su','Quản Lý Nhân Sự'],['thong_ke','Xem Thống Kê'],['xuat_excel','Xuất Excel'],['cai_dat','Quản Lý Cài Đặt']];const box=document.getElementById('quyenBox');box.innerHTML=quyenList.map(([k,label])=>`<label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" value="${k}" ${u?.quyen?.includes(k)?'checked':''}> ${label}</label>`).join('');validateTho();
}
let tempAvatarDataUrl='';
function handleAvatar(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const max=200;let w=img.width,h=img.height;if(w>h){if(w>max){h*=max/w;w=max;}}else{if(h>max){w*=max/h;h=max;}}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);tempAvatarDataUrl=canvas.toDataURL('image/jpeg',0.7);const prev=document.getElementById('f_avatar_prev');if(prev){prev.src=tempAvatarDataUrl;prev.style.display='block';}};img.src=e.target.result;};reader.readAsDataURL(file);}
function openLoaiForForm(){const loais=['Thợ sơn','Thợ gỗ','Thợ nề','Quản lý','Kế toán'];const sheet2=document.createElement('div');sheet2.innerHTML=loais.map(l=>`<div style="padding:12px;border-bottom:1px solid var(--border);cursor:pointer" onclick="document.getElementById('f_phanLoai').value='${l}';document.getElementById('f_phanLoai_display').textContent='${l}';closeSheet();openThoForm(editingMaTho)">${l}</div>`).join('');document.getElementById('bottomSheet').innerHTML='<h4>Chọn phân loại</h4>'+sheet2.innerHTML;}
function validateTho(){const maTho=document.getElementById('f_maTho')?.value.trim();const hoTen=document.getElementById('f_hoTen')?.value.trim();const sdtRaw=document.getElementById('f_sdt')?.value||'';const sdt=normalizePhone(sdtRaw);const donGiaRaw=document.getElementById('f_donGia')?.value.trim();let ok=true;if(!maTho){document.getElementById('e_maTho').textContent='Mã thợ không được trống';ok=false;}else document.getElementById('e_maTho').textContent='';if(!hoTen){document.getElementById('e_hoTen').textContent='Họ tên không được trống';ok=false;}else document.getElementById('e_hoTen').textContent='';if(sdt.length!==10){document.getElementById('e_sdt').textContent='SĐT phải đủ 10 số';ok=false;}else document.getElementById('e_sdt').textContent='';const dg=parseInt(donGiaRaw||'0');if(isNaN(dg)||dg<0){document.getElementById('e_donGia').textContent='Đơn giá không hợp lệ';ok=false;}else{document.getElementById('e_donGia').textContent='';const preview=document.getElementById('f_donGia_preview');if(preview){const real=dg>=1000?dg:dg*1000;preview.textContent=fmtMoney(real);}}const btn=document.getElementById('btnSaveTho');if(btn)btn.disabled=!ok;return ok;}
function saveTho(){if(!validateTho())return;const btn=document.getElementById('btnSaveTho');btn.textContent='Đang lưu...';btn.disabled=true;const maTho=document.getElementById('f_maTho').value.trim();const hoTen=document.getElementById('f_hoTen').value.trim();const sdt=normalizePhone(document.getElementById('f_sdt').value);const phanLoai=document.getElementById('f_phanLoai').value;const donGiaRaw=parseInt(document.getElementById('f_donGia').value.trim()||'0');const donGia=donGiaRaw>=1000?donGiaRaw:donGiaRaw*1000;const ngayVao=document.getElementById('f_ngayVao').value;const mk=document.getElementById('f_mk').value;const quyen=Array.from(document.querySelectorAll('#quyenBox input:checked')).map(i=>i.value);const users=getUsers();if(!editingMaTho&&users.some(u=>u.maTho===maTho)){toast('Mã thợ đã tồn tại');btn.disabled=false;btn.textContent='Lưu';return;}let user;if(editingMaTho){user=users.find(u=>u.maTho===editingMaTho);user.hoTen=hoTen;user.sdt=sdt;user.phanLoai=phanLoai;user.donGia=donGia;user.ngayVaoLam=ngayVao;user.quyen=quyen;if(tempAvatarDataUrl)user.anhDataUrl=tempAvatarDataUrl;if(mk)user.matKhau=mk;}else{user={maTho,hoTen,sdt,vaiTro:'Tho',trangThai:'hoat_dong',donGia,phanLoai,quyen,anhDataUrl:tempAvatarDataUrl||'',matKhau:mk||'123456',ngayVaoLam:ngayVao};users.push(user);}LocalDB.save(KEYS.users,users);addAudit(editingMaTho?'Sửa nhân sự':'Thêm nhân sự',maTho,hoTen);tempAvatarDataUrl='';closeSheet();toast('Lưu thành công');render();}
function toggleKhoa(maTho){if(!confirm('Xác nhận khóa/mở tài khoản?'))return;const users=getUsers();const u=users.find(x=>x.maTho===maTho);if(!u)return;u.trangThai=u.trangThai==='hoat_dong'?'khoa':'hoat_dong';LocalDB.save(KEYS.users,users);addAudit(u.trangThai==='khoa'?'Khóa tài khoản':'Mở tài khoản',maTho,'');render();}
function resetMk(maTho){if(!confirm('Đặt lại mật khẩu về 123456?'))return;const users=getUsers();const u=users.find(x=>x.maTho===maTho);u.matKhau='123456';LocalDB.save(KEYS.users,users);addAudit('Đặt lại mật khẩu',maTho,'');toast('Đã reset về 123456');}
let duKienNgay=todayYMD();
function renderDuKien(el,user){
  const records=getRecords(); const usersTho=getUsers().filter(u=>u.vaiTro==='Tho');
  el.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-weight:900;font-size:15px">Dự kiến trả thợ</span><input type="date" id="duKienDate" class="input" style="width:168px;height:38px" value="${duKienNgay}" onchange="duKienNgay=this.value;renderDuKien(document.getElementById('viewContent'), getSession().user)"></div><div id="duKienContent"></div></div>`;
  const targetMonth=duKienNgay.slice(0,7);
  const recs=records.filter(r=>r.trangThai==='da_duyet' && r.ngayCong.startsWith(targetMonth));
  const byTho={}; recs.forEach(r=>{ byTho[r.maTho]=(byTho[r.maTho]||0)+1; });
  const groups={}; let tongTho=0, tongCong=0, tongTien=0;
  usersTho.forEach(u=>{
    const cong=byTho[u.maTho]||0;
    if(cong===0) return;
    const tien=cong*(u.donGia||0);
    if(!groups[u.phanLoai]) groups[u.phanLoai]=[];
    groups[u.phanLoai].push({u, cong, tien});
    tongTho++; tongCong+=cong; tongTien+=tien;
  });
  const content=document.getElementById('duKienContent');
  let html=`<div style="padding:14px 18px;border-radius:999px;background:linear-gradient(135deg,#3E2723,#5D4037);color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 6px 16px rgba(0,0,0,.18)"><b>Tổng hợp đến ${duKienNgay}</b><span style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge" style="background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.2)">${tongTho} thợ</span><span class="badge" style="background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.2)">${tongCong} công</span><span class="badge" style="background:#FFE0B2;color:#3E2723">${fmtMoney(tongTien)}</span></span></div>`;
  Object.entries(groups).forEach(([loai, list])=>{
    const sumTho=list.length;
    const sumCong=list.reduce((s,x)=>s+x.cong,0);
    const sumTien=list.reduce((s,x)=>s+x.tien,0);
    html+=`<div class="card" style="padding:0;overflow:hidden;border-radius:20px"><div style="padding:12px 16px;background:#FFFBF7;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-weight:900">${loai}</span><span style="color:var(--light)">•</span><span style="display:flex;gap:6px"><span class="badge" style="background:#fff">${sumTho} thợ</span><span class="badge" style="background:#fff">${sumCong} công</span><span class="badge b-choduyet" style="background:#fff">${fmtMoney(sumTien)}</span></span></div><div class="table-wrap" style="border:none;border-radius:0"><table style="min-width:500px"><thead><tr><th style="text-align:left;padding-left:16px">Họ tên</th><th>Tổng</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead><tbody>${list.map(({u,cong,tien},i)=>`<tr class="${i%2===0?'row-alt':''}"><td style="text-align:left;padding-left:16px"><b>${u.hoTen}</b><br><small style="color:var(--light)">${u.maTho} · ${fmtPhone(u.sdt)}</small></td><td><b>${cong}</b></td><td>${fmtMoney(u.donGia)}</td><td><b>${fmtMoney(tien)}</b></td></tr>`).join('')}</tbody></table></div></div>`;
  });
  if(Object.keys(groups).length===0){html+=`<div class="card" style="text-align:center;color:var(--light)">Chưa có công đã duyệt trong tháng ${targetMonth}</div>`;}
  content.innerHTML=html;
}
window.setLoginMode=setLoginMode;window.doLogin=doLogin;window.demoLogin=demoLogin;window.logout=logout;window.switchView=switchView;window.chamCong=chamCong;window.toggleChoDuyet=toggleChoDuyet;window.duyetOne=duyetOne;window.duyetAll=duyetAll;window.chonLoai=chonLoai;window.openBottomSheetLoai=openBottomSheetLoai;window.filterSheet=filterSheet;window.closeSheet=closeSheet;window.openSheet=openSheet;window.openThoForm=openThoForm;window.handleAvatar=handleAvatar;window.validateTho=validateTho;window.saveTho=saveTho;window.toggleKhoa=toggleKhoa;window.resetMk=resetMk;window.exportBangCSV=exportBangCSV;window.chotThang=chotThang;window.dieuChinhSauChot=dieuChinhSauChot;window.exportThoCSV=exportThoCSV;window.openLoaiForForm=openLoaiForForm;window.renderBangCong=renderBangCong;window.renderDuKien=renderDuKien;
render();
</script>
