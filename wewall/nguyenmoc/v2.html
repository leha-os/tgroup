*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 12px rgba(78,52,46,.07);padding:16px}
.btn{border:none;border-radius:999px;padding:11px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}

#sidebar{width:150px;min-width:150px;background:#fff;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
#sidebar .side-btn{width:100%;text-align:left;padding:11px 14px;border-radius:999px;border:1px solid transparent;background:transparent;font-size:13px;font-weight:650;margin-bottom:6px;cursor:pointer}
#sidebar .side-btn.active{background:#FFE0B2;color:var(--dark);border-color:#FFCC80;font-weight:800}
#main{flex:1;padding:0;max-width:1400px;overflow:hidden}#main-inner{padding:16px}
.app-header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
footer#global-footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);text-align:center;font-size:11px;padding:8px 4px;z-index:50;color:var(--light)}
.login-wrap{max-width:420px;margin:24px auto}.login-brand{text-align:center;padding:18px 12px}.login-brand h1{font-size:22px}
.tabs{display:flex;gap:6px;margin:12px 0;padding:4px;background:#EFEBE9;border-radius:999px}.tab{flex:1;padding:10px 14px;border-radius:999px;text-align:center;font-weight:700;cursor:pointer;font-size:13px;color:var(--light)}.tab.active{background:#fff;color:var(--dark);border:1px solid var(--border)}
.input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:15px}
.field{margin-bottom:12px}.err{color:#C62828;font-size:12px;min-height:14px}
.big-btn{width:100%;padding:18px;border-radius:999px;background:linear-gradient(135deg,var(--accent),#FF8F33);color:#fff;font-size:17px;font-weight:900;border:none;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px}.stat .label{font-size:12px;color:var(--light)}.stat .value{font-size:20px;font-weight:900;margin-top:4px}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:16px;background:#fff}table{border-collapse:collapse;width:100%;min-width:600px}th,td{border:1px solid var(--border);padding:8px 6px;text-align:center;font-size:12px;white-space:nowrap}thead th{background:var(--dark);color:#fff;position:sticky;top:0}
.sticky-left{position:sticky;left:0;background:#fff}.col-tong{right:200px !important}.col-dongia{right:100px !important}.col-thanhtien{right:0 !important}th.sticky-right,td.sticky-right{position:sticky;right:0}th.col-tong,th.col-dongia,th.col-thanhtien{background:#3E2723;color:#fff}td.col-tong,td.col-dongia,td.col-thanhtien{background:#3E2723;color:#fff;font-weight:700}td.cell-co{background:#E8F5E9}td.cell-cho{background:#FFF8E1}td.cell-khong{background:#FFEBEE}.row-alt{background:#FFFBF7}
.bottom-sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.18);z-index:100;max-height:72vh;overflow:auto;padding:16px;transform:translateY(100%);transition:.28s}.bottom-sheet.open{transform:translateY(0)}.sheet-backdrop{position:fixed;inset:0;background:rgba(60,40,30,.35);z-index:99;display:none}.sheet-backdrop.open{display:block}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;z-index:200;display:none}.toast.show{display:block}
.demo-banner{background:#FFF8E1;border:1px dashed #F57F17;padding:8px 14px;border-radius:999px;font-size:12px;text-align:center;margin-bottom:10px;font-weight:600}

function renderTho(user){const records=getRecords().filter(r=>r.maTho===user.maTho);const curM=monthKey();const daDuyet=records.filter(r=>r.trangThai==='da_duyet'&&r.ngayCong.startsWith(curM));document.getElementById('app').innerHTML=`<div id="app-layout"><div id="main" style="max-width:520px;margin:0 auto;width:100%"><div class="app-header"><b>CÔNG TY TNHH SXTM NGUYỄN MỘC</b><button class="btn btn-ghost" onclick="logout()">Thoát</button></div><div id="main-inner"><div class="card"><b>Xin chào ${user.hoTen}</b></div></div></div></div>`;}
const MENU=[{id:'duyet',label:'Duyệt công',perm:'duyet_cong'},{id:'dashboard',label:'Dashboard',perm:'dashboard'},{id:'bangcong',label:'Bảng công',perm:'bang_cong'},{id:'dstho',label:'Danh sách thợ',perm:'nhan_su'},{id:'dukien',label:'Dự kiến trả thợ',perm:'thong_ke'}];
function renderQuanLy(user){const allowed=MENU.filter(m=>hasPerm(user,m.perm));const cur=allowed.find(x=>x.id===currentView)?currentView:(allowed[0]?.id||'duyet');currentView=cur;document.getElementById('app').innerHTML=`<div id="app-layout"><div id="sidebar">${allowed.map(m=>`<button class="side-btn ${m.id===cur?'active':''}" onclick="switchView('${m.id}')">${m.label}</button>`).join('')}<button class="side-btn" onclick="logout()" style="margin-top:auto;color:#C62828">Đăng xuất</button></div><div id="main"><div class="app-header"><b>CÔNG TY TNHH SXTM NGUYỄN MỘC</b><span style="font-size:11px">${user.hoTen}</span></div><div id="main-inner"><div id="viewContent"></div></div></div></div>`;renderView(user,cur);}
function switchView(id){currentView=id;renderQuanLy(getSession().user);}function logout(){clearSession();render();}
function renderView(user,view){const el=document.getElementById('viewContent');if(view==='duyet')renderDuyet(el,user);else if(view==='bangcong')renderBangCong(el,user);else if(view==='dstho')renderDsTho(el,user);else if(view==='dukien')renderDuKien(el,user);else if(view==='dashboard')renderDashboard(el,user);}
function renderDashboard(el,user){const records=getRecords();const users=getUsers().filter(u=>u.vaiTro==='Tho');const curM=monthKey();const daDuyet=records.filter(r=>r.trangThai==='da_duyet'&&r.ngayCong.startsWith(curM));const tong=daDuyet.reduce((s,r)=>{const u=getUsers().find(x=>x.maTho===r.maTho);return s+(u?.donGia||0);},0);el.innerHTML=`<div class="card">Tổng: ${fmtMoney(tong)} - ${users.length} thợ</div>`;}
function renderDuyet(el,user){let recs=getRecords().filter(r=>r.trangThai==='cho_duyet');el.innerHTML=`<div class="card"><h3>Duyệt công (${recs.length})</h3>${recs.map(r=>{const u=getUsers().find(x=>x.maTho===r.maTho);return `<div class="card" style="margin-top:8px"><b>${u?.hoTen||r.maTho}</b> - ${r.ngayCong}<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-primary" onclick="duyetOne('${r.maBanGhi}',true)">Duyệt</button><button class="btn btn-ghost" onclick="duyetOne('${r.maBanGhi}',false)">Từ chối</button></div></div>`;}).join('')||'Không có'}</div>`;}
function duyetOne(id,ok){updateStatus(id,ok?'da_duyet':'tu_choi',ok?'':'Từ chối');}
function updateStatus(ma,tt,ly){const recs=getRecords();const i=recs.findIndex(r=>r.maBanGhi===ma);if(i<0)return;recs[i].trangThai=tt;recs[i].lyDoTuChoi=ly;LocalDB.save(KEYS.records,recs);toast('Đã cập nhật');render();}
let bangThang=monthKey();
function renderBangCong(el,user){
 const usersTho=getUsers().filter(u=>u.vaiTro==='Tho');const records=getRecords();const[y,m]=bangThang.split('-').map(Number);const dim=new Date(y,m,0).getDate();
 el.innerHTML=`<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="month" class="input" style="width:160px" value="${bangThang}" onchange="bangThang=this.value;renderBangCong(document.getElementById('viewContent'), getSession().user)"><button class="btn btn-primary" onclick="exportExcelDep()">Xuất file Excel</button></div><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th class="sticky-left head" style="min-width:180px;left:0">Thợ</th>${Array.from({length:dim},(_,i)=>`<th>${i+1}</th>`).join('')}<th class="sticky-right col-tong">Tổng</th><th class="sticky-right col-dongia">Đơn giá</th><th class="sticky-right col-thanhtien">Thành tiền</th></tr></thead><tbody>${usersTho.map((u,ui)=>{const byDay={};records.forEach(r=>{if(r.maTho===u.maTho&&r.ngayCong.startsWith(bangThang)){byDay[Number(r.ngayCong.slice(8,10))]=r;}});let tong=0;Object.values(byDay).forEach(r=>{if(r.trangThai==='da_duyet')tong++;});return `<tr class="${ui%2===0?'row-alt':''}"><td class="sticky-left" style="text-align:left"><b>${u.hoTen}</b><br><small>${u.maTho}</small></td>${Array.from({length:dim},(_,i)=>{const r=byDay[i+1];let txt='';if(r){if(r.trangThai==='da_duyet')txt='1';else if(r.trangThai==='cho_duyet')txt='C';else txt='X';}return `<td>${txt}</td>`;}).join('')}<td class="sticky-right col-tong">${tong}</td><td class="sticky-right col-dongia">${fmtMoney(u.donGia)}</td><td class="sticky-right col-thanhtien">${fmtMoney(tong*(u.donGia||0))}</td></tr>`;}).join('')}</tbody></table></div></div>`;
}

 const records=getRecords();

 const colCount = 3 + dim + 3;
 ws.mergeCells(1,1,1,colCount); const r1=ws.getCell(1,1); r1.value='CÔNG TY TNHH SẢN XUẤT THƯƠNG MẠI NGUYỄN MỘC'; r1.font={name:'Arial',size:14,bold:true}; r1.alignment={horizontal:'center'}; ws.getRow(1).height=22;
 ws.mergeCells(2,1,2,colCount); ws.getCell(2,1).value='Add: 62/7 Đường Long Thuận, Phường Trường Thạnh, TP.Thủ Đức'; ws.getCell(2,1).font={name:'Arial',size:11,italic:true,color:{argb:'FF808080'}}; ws.getCell(2,1).alignment={horizontal:'center'};
 ws.mergeCells(3,1,3,colCount); ws.getCell(3,1).value='Tel: 028 36201795 - 0906 933199'; ws.getCell(3,1).font={name:'Arial',size:11,italic:true,color:{argb:'FF808080'}}; ws.getCell(3,1).alignment={horizontal:'center'};
 ws.mergeCells(4,1,4,colCount); ws.getCell(4,1).value='Website: www.nguyenmoc.com.vn'; ws.getCell(4,1).font={name:'Arial',size:11,italic:true,color:{argb:'FF808080'}}; ws.getCell(4,1).alignment={horizontal:'center'};
 ws.getRow(5).height=8; ws.getRow(6).height=8;
 ws.mergeCells(7,1,7,colCount); ws.getCell(7,1).value='Ngày xuất: '+new Date().toLocaleDateString('vi-VN'); ws.getCell(7,1).font={name:'Arial',size:11,italic:true,color:{argb:'FF808080'}}; ws.getCell(7,1).alignment={horizontal:'right'};
 ws.mergeCells(8,1,8,colCount); const r8=ws.getCell(8,1); r8.value='BẢNG CHẤM CÔNG THÁNG '+String(m).padStart(2,'0')+'/'+y; r8.font={name:'Arial',size:12,bold:true,color:{argb:'FFFFFFFF'}}; r8.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF5D4037'}}; r8.alignment={horizontal:'center',vertical:'middle'}; ws.getRow(8).height=40;
 const header=['Stt','Mã thợ','Họ tên',...Array.from({length:dim},(_,i)=>String(i+1)),'Tổng công','Lương 1 ngày','Tổng lương'];
 const row9=ws.getRow(9); header.forEach((h,i)=>{const c=row9.getCell(i+1); c.value=h; c.font={name:'Arial',size:11,bold:true}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFBBDEFB'}}; c.alignment={horizontal:'center'}; c.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};}); row9.height=22;
 let rIdx=10;
 usersTho.forEach((u,idx)=>{
   const byDay={}; records.forEach(rec=>{if(rec.maTho===u.maTho&&rec.ngayCong.startsWith(bangThang)){byDay[Number(rec.ngayCong.slice(8,10))]=rec;}});
   let tong=0; Object.values(byDay).forEach(rr=>{if(rr.trangThai==='da_duyet')tong++;});
   const row=ws.getRow(rIdx);
   const values=[idx+1,u.maTho,u.hoTen,...Array.from({length:dim},(_,i)=>{const rec=byDay[i+1]; if(!rec) return ''; if(rec.trangThai==='da_duyet') return 1; if(rec.trangThai==='cho_duyet') return 'C'; return 'X';}),tong,u.donGia,tong*(u.donGia||0)];
   values.forEach((v,i)=>{const c=row.getCell(i+1); c.value=v; c.font={name:'Arial',size:11}; c.alignment={horizontal:i>=3 && i<3+dim?'center':(i===2?'left':'center')}; c.border={top:{style:'thin',color:{argb:'FFB0BEC5'}},left:{style:'thin',color:{argb:'FFB0BEC5'}},bottom:{style:'thin',color:{argb:'FFB0BEC5'}},right:{style:'thin',color:{argb:'FFB0BEC5'}}}; if(rIdx%2===0){c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE3F2FD'}};}});
   rIdx++;
 });
 // === HÀNG TỔNG CỘNG - đảm bảo hiện ===
 const rowTotal=ws.getRow(rIdx);
 // Merge 3 cột đầu để ghi TỔNG CỘNG
 ws.mergeCells(rIdx,1,rIdx,3);
 const cTong = rowTotal.getCell(1);

 // Gán style cho toàn bộ hàng tổng
 for(let i=1;i<=colCount;i++){

   c.font={name:'Arial',size:11,bold:true,color:{argb:'FF000000'}};
   c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFBBDEFB'}};

 rowTotal.getCell(3+dim+1).value=sumTong;

 rowTotal.getCell(3+dim+3).font={name:'Arial',size:11,bold:true};

 const fileName='BangCong_NguyenMoc_'+bangThang.replace('-','')+'.xlsx';
 const buf=await wb.xlsx.writeBuffer(); const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=fileName; a.click(); URL.revokeObjectURL(url); toast('Đã xuất '+fileName+' - 1 file duy nhất');
}
let filterLoai='all';
function renderDsTho(el,user){let list=getUsers().filter(u=>u.vaiTro==='Tho');if(filterLoai!=='all')list=list.filter(u=>u.phanLoai===filterLoai);el.innerHTML=`<div class="card"><div style="display:flex;gap:8px"><button class="btn btn-primary" onclick="toast('Thêm thợ')">+ Thêm thợ</button></div><div style="margin-top:12px;display:grid;gap:10px">${list.map(u=>`<div class="card"><b>${u.hoTen} - ${u.maTho}</b> - ${u.phanLoai}</div>`).join('')}</div></div>`;}
function renderDuKien(el,user){el.innerHTML=`<div class="card">Dự kiến - xuất từ bảng công</div>`;}
function hasPerm(u,p){if(!u)return false;if(u.vaiTro==='GiamDoc')return true;return(u.quyen||[]).includes(p)}
function openSheet(){document.getElementById('bottomSheet').classList.add('open');document.getElementById('sheetBackdrop').classList.add('open');}
function closeSheet(){document.getElementById('bottomSheet').classList.remove('open');document.getElementById('sheetBackdrop').classList.remove('open');}

render();
