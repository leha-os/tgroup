<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nguyễn Mộc - App Chấm Công</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{ --bg:#FDF8F3; --text:#4E342E; --orange:#FF6F00; --light:#8D6E63; --border:#EDE2D8; --dark:#3E2723; --card:#FFFFFF; --ok:#2E7D32; --okbg:#E8F5E9; --wait:#F57F17; --waitbg:#FFF8E1; --nobg:#FFEBEE; --no:#C62828; --radius:20px }
*{box-sizing:border-box;margin:0;padding:0;font-family:"Be Vietnam Pro",Inter,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
button,input{font-family:inherit}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 8px 24px rgba(62,39,35,.06),0 2px 8px rgba(62,39,35,.04);padding:18px}
.btn{border:none;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;transition:.15s}
.btn-dark{background:var(--dark);color:#fff}.btn-dark:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(62,39,35,.3)}
.btn-orange{background:var(--orange);color:#fff}
.btn-ghost{background:#FFF3E0;color:var(--dark);border:1px solid var(--border)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.2px}
.b-ok{background:var(--okbg);color:var(--ok);border:1px solid #C8E6C9}
.b-wait{background:var(--waitbg);color:var(--wait);border:1px solid #FFECB3}
.b-no{background:var(--nobg);color:var(--no);border:1px solid #FFCDD2}

/* LOGIN */
#loginScreen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 600px at 20% 10%,#FFE0B2 0%,transparent 60%),radial-gradient(700px 500px at 90% 90%,#D7CCC8 0%,transparent 60%),var(--bg)}
.login-wrap{width:100%;max-width:440px}
.brand-top{text-align:center;margin-bottom:18px}
.brand-top .l1{font-weight:900;letter-spacing:2px;font-size:34px;line-height:1}
.brand-top .l2{font-size:12px;letter-spacing:3px;color:var(--light);margin-top:4px}
.brand-top .l3{margin-top:14px;font-weight:900;font-size:22px;color:var(--dark);letter-spacing:.5px;background:#fff;border:1px solid var(--border);display:inline-block;padding:6px 14px;border-radius:999px}
.tabs{display:flex;gap:8px;margin:16px 0 12px}
.tab{flex:1;padding:11px;border-radius:999px;border:1px solid var(--border);background:#fff;text-align:center;cursor:pointer;font-weight:700;font-size:13px}
.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.field label{font-size:12px;font-weight:700;color:var(--light);margin-bottom:6px;display:block}
.field input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:14px;background:#fff;outline:none}
.field input:focus{border-color:var(--dark);box-shadow:0 0 0 3px #EFEBE9}
.login-actions .btn{width:100%;padding:14px;font-size:15px}
.quick{margin-top:18px}
.quick-title{text-align:center;font-size:11px;font-weight:800;color:var(--light);letter-spacing:1.5px;margin-bottom:10px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-note{margin-top:12px;text-align:center;font-size:11px;color:var(--light)}

/* APP */
#app{display:none}
.sidebar{position:fixed;left:0;top:0;bottom:44px;width:120px;background:#fff;border-right:1px solid var(--border);padding:10px 8px;display:flex;flex-direction:column;gap:5px;z-index:10;overflow:auto}
.sb-brand{padding:10px 4px 12px;text-align:center;border-bottom:1px dashed var(--border);margin-bottom:6px}
.sb-brand b{font-size:13px;letter-spacing:1px;display:block;line-height:1.1}
.sb-brand small{font-size:10px;color:var(--light);letter-spacing:.8px}
.nav-btn{width:100%;padding:10px 4px;border:none;background:transparent;border-radius:12px;cursor:pointer;font-weight:700;font-size:12.5px;line-height:1.2;color:var(--text);text-align:center;transition:.12s}
.nav-btn:hover{background:#FFF3E0}
.nav-btn.active{background:#FFE0B2;color:var(--dark);box-shadow:inset 0 0 0 1px #FFCC80}
.nav-btn.hidden{display:none!important}
.main{margin-left:120px;padding:20px 18px 64px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.topbar h2{font-size:22px;font-weight:900;letter-spacing:-.3px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi-label{font-size:11px;font-weight:700;color:var(--light);letter-spacing:.4px;text-transform:uppercase}
.kpi-val{font-size:22px;font-weight:900;margin-top:6px}
.footer{position:fixed;bottom:0;left:0;right:0;height:44px;background:#fff;border-top:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--light);z-index:20;line-height:1.2}

.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:16px;background:#fff;max-width:100%}
table{border-collapse:separate;border-spacing:0;min-width:100%}
thead th{background:var(--dark);color:#fff;position:sticky;top:0;z-index:2;padding:9px 6px;font-size:11px;letter-spacing:.3px;white-space:nowrap}
th.sl,td.sl{position:sticky;left:0;z-index:3}
th.sl{z-index:5;background:var(--dark)}
td.sl{background:#fff;min-width:180px;max-width:180px;border-right:1px solid var(--border)}
td.sr, th.sr{position:sticky;z-index:3}
th.sr{background:var(--dark)!important}
td.sr{background:#FFFBF7!important;font-weight:800;border-left:1px solid var(--border)}
.grid-cell{width:36px;height:36px;text-align:center;font-size:12px;border-right:1px solid #F5EDE6;border-bottom:1px solid #F5EDE6;cursor:pointer}
.cell-ok{background:#E8F5E9}
.cell-wait{background:#FFF8E1}
.cell-no{background:#FFEBEE}
.row-alt td.sl{background:#FFFBF7}
.row-alt .grid-cell{background:#FFFBF7}
.row-alt .cell-ok{background:#DFF1DF}
.input{padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:#fff;outline:none}
.input:focus{border-color:var(--dark)}
.search-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.bottom-sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--border);max-height:72vh;overflow:auto;z-index:100;padding:16px;display:none;box-shadow:0 -12px 40px rgba(62,39,35,.18)}
.bottom-sheet.open{display:block}
.bs-item{padding:12px 8px;border-bottom:1px solid #F5EDE6;cursor:pointer;font-weight:600}
.bs-item:hover{background:#FFF8E1}

.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#EFEBE9;border:1px solid var(--border);display:grid;place-items:center;font-weight:900}
.cham-btn{width:100%;padding:22px;border-radius:20px;background:linear-gradient(180deg,#FF8F3D,#FF6F00);color:#fff;border:none;font-size:20px;font-weight:900;cursor:pointer;letter-spacing:.3px;box-shadow:0 10px 20px rgba(255,111,0,.28)}
.cham-btn:disabled{background:#D7CCC8;box-shadow:none;cursor:not-allowed}
.cham-btn:active{transform:scale(.99)}

@media(max-width:860px){.sidebar{position:static;width:100%;flex-direction:row;flex-wrap:wrap;height:auto;border-right:none;border-bottom:1px solid var(--border)}.main{margin-left:0}}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-wrap">
    <div class="brand-top"><div class="l1">NGUYỄN MỘC</div><div class="l2">CÔNG TY TNHH SXTM</div><div class="l3">CHẤM CÔNG THỢ</div></div>
    <div class="card">
      <div class="tabs"><div class="tab active" id="tabMa" onclick="setTab('ma')">Mã thợ</div><div class="tab" id="tabSdt" onclick="setTab('sdt')">Số điện thoại</div></div>
      <div class="field"><label id="lblLogin">Mã thợ</label><input id="inpLogin" placeholder="vd: nbatam"></div>
      <div class="field" style="margin-top:10px"><label>Mật khẩu</label><input id="inpPass" type="password" placeholder="••••••"></div>
      <div class="login-actions" style="margin-top:14px"><button class="btn btn-dark" onclick="doLogin()">Đăng nhập</button></div>
      <div class="quick"><div class="quick-title">XEM THỬ NHANH</div><div class="quick-grid"><button class="btn btn-ghost" onclick="quickLogin('tho')">Thợ</button><button class="btn btn-ghost" onclick="quickLogin('quanly')">Quản Lý</button><button class="btn btn-ghost" onclick="quickLogin('ketoan')">Kế Toán</button><button class="btn btn-ghost" onclick="quickLogin('giamdoc')">Giám đốc</button></div></div>
      <div class="demo-note">Bản LOCAL - dữ liệu lưu trình duyệt - không cần mạng</div>
    </div>
  </div>
</div>

<div id="app">
  <div class="sidebar">
    <div class="sb-brand"><b>NGUYỄN MỘC</b><small>CHẤM CÔNG</small></div>
    <button class="nav-btn" data-perm="dashboard" onclick="nav('dashboard')">Dashboard</button>
    <button class="nav-btn" data-perm="duyet_cong" onclick="nav('duyet')">Duyệt Công</button>
    <button class="nav-btn" data-perm="bang_cong" onclick="nav('bangcong')">Bảng Công</button>
    <button class="nav-btn" data-perm="thong_ke" onclick="nav('dukien')">Dự Kiến Trả</button>
    <button class="nav-btn" data-perm="nhan_su" onclick="nav('nhansu')">Danh Sách Thợ</button>
    <button class="nav-btn" data-perm="thong_ke" onclick="nav('thongke')">Thống Kê</button>
    <button class="nav-btn" data-perm="cai_dat" onclick="nav('nhatky')">Nhật Ký</button>
    <button class="nav-btn" data-perm="cai_dat" onclick="nav('cauhinh')">Cấu Hình</button>
    <button class="nav-btn" data-perm="xuat_excel" onclick="nav('saoluu')">Sao Lưu</button>
    <button class="nav-btn" id="navThoCham" onclick="nav('tho_cham')">Chấm Công</button>
    <button class="nav-btn" id="navThoTT" onclick="nav('tho_tt')">Thông Tin</button>
    <div style="margin-top:auto;padding-top:10px;border-top:1px dashed var(--border)">
      <div id="meInfo" style="font-size:11px;line-height:1.35"></div>
      <button class="btn btn-ghost" style="width:100%;margin-top:8px;padding:8px" onclick="logout()">Đăng xuất</button>
    </div>
  </div>
  <div class="main" id="main"></div>
  <div class="footer"><div>© 2026 WeWall Group · Nguyen Moc Co. LTD | Le Ha</div><div>Hệ thống Chấm công Nội bộ</div></div>
</div>

<div id="bs" class="bottom-sheet"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b id="bsTitle">Chọn</b><button class="btn btn-dark" onclick="closeBS()">Đóng</button></div><input id="bsSearch" class="input" style="width:100%;margin-bottom:10px" placeholder="Tìm kiếm..." oninput="renderBS()"><div id="bsList"></div></div>

<script>
const LocalDB={load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},save(k,v){localStorage.setItem(k,JSON.stringify(v))}};
const K={users:'nm2_users',records:'nm2_records',chot:'nm2_chot',audit:'nm2_audit',cauhinh:'nm2_cauhinh',session:'nm2_session'};
function fmtMoney(v){if(v==null||isNaN(v)||v===0) return '0₫'; return Number(v).toLocaleString('vi-VN')+'₫'}
function fmtPhone(s){if(!s)return'';s=s.replace(/\D/g,'');if(s.length>=10)return s.slice(0,3)+' '+s.slice(3,6)+' '+s.slice(6,10)+(s.length>10?' '+s.slice(10):'');return s}
function parseMoneyInput(val){let raw=(val+'').replace(/[^\d]/g,'');if(!raw)return 0;if(window._fullMoney)return parseInt(raw);let n=parseInt(raw);if(n>=100000)return n;return n*1000}
function todayStr(){return new Date().toISOString().slice(0,10)}
function nowISO(){return new Date().toISOString()}
function normalizePhone(s){return (s||'').replace(/\D/g,'')}
function seedIfEmpty(){
 if(LocalDB.load(K.users)) return;
 const users=[
  {maTho:'nbatam',hoTen:'NBA Tâm',sdt:'0784944886',vaiTro:'Giám đốc',trangThai:'Hoạt động',donGia:0,phanLoai:'Quản lý',quyen:['dashboard','bang_cong','sua_cong','duyet_cong','nhan_su','thong_ke','xuat_excel','cai_dat'],anhDataUrl:'',matKhau:'admin123',ngayVaoLam:'2023-01-01'},
  {maTho:'ql01',hoTen:'Nguyễn Quản Lý',sdt:'0912345678',vaiTro:'Quản Lý',trangThai:'Hoạt động',donGia:0,phanLoai:'Quản lý',quyen:['dashboard','bang_cong','duyet_cong','nhan_su','thong_ke','xuat_excel'],anhDataUrl:'',matKhau:'123456',ngayVaoLam:'2024-02-15'},
  {maTho:'kt01',hoTen:'Trần Kế Toán',sdt:'0923456789',vaiTro:'Kế Toán',trangThai:'Hoạt động',donGia:0,phanLoai:'Kế toán',quyen:['dashboard','bang_cong','thong_ke','xuat_excel'],anhDataUrl:'',matKhau:'123456',ngayVaoLam:'2024-03-10'},
  {maTho:'tho01',hoTen:'Lê Văn Sơn',sdt:'0983351744',vaiTro:'Thợ',trangThai:'Hoạt động',donGia:320000,phanLoai:'Thợ sơn',quyen:[],anhDataUrl:'',matKhau:'123456',ngayVaoLam:'2024-06-12'},
  {maTho:'tho02',hoTen:'Phạm Minh Gỗ',sdt:'0978123456',vaiTro:'Thợ',trangThai:'Hoạt động',donGia:350000,phanLoai:'Thợ gỗ',quyen:[],anhDataUrl:'',matKhau:'123456',ngayVaoLam:'2024-07-01'},
  {maTho:'tho03',hoTen:'Hoàng Văn Nề',sdt:'0967123456',vaiTro:'Thợ',trangThai:'Hoạt động',donGia:280000,phanLoai:'Thợ nề',quyen:[],anhDataUrl:'',matKhau:'123456',ngayVaoLam:'2025-01-20'},
  {maTho:'tho04',hoTen:'Trần Thị Hương',sdt:'0938123456',vaiTro:'Thợ',trangThai:'Hoạt động',donGia:300000,phanLoai:'Thợ sơn',quyen:[],anhDataUrl:'',matKhau:'123456',ngayVaoLam:'2024-09-05'},
  {maTho:'tho05',hoTen:'Đỗ Văn Khéo',sdt:'0948123456',vaiTro:'Thợ',trangThai:'Hoạt động',donGia:400000,phanLoai:'Thợ gỗ',quyen:[],anhDataUrl:'',matKhau:'123456',ngayVaoLam:'2024-11-11'},
 ];
 LocalDB.save(K.users,users);
 const rec=[]; const ym=new Date().toISOString().slice(0,7); const sts=['Đã duyệt','Chờ duyệt','Từ chối']; const rs=['Không đủ hình ảnh','Sai vị trí','Thiếu thông tin'];
 for(let i=0;i<15;i++){ const ma=users[3+(i%5)].maTho; const d=1+Math.floor(Math.random()*28); const ngay=ym+'-'+String(d).padStart(2,'0'); const st=sts[i%3]; rec.push({maBanGhi:'BG'+Date.now()+i,maTho:ma,ngayCong:ngay,thoiDiemGui:new Date(ym+'-'+String(d).padStart(2,'0')+'T08:00:00').toISOString(),trangThai:st,nguoiDuyet:st!=='Chờ duyệt'?'ql01':'',thoiDiemDuyet:st!=='Chờ duyệt'?nowISO():'',lyDoTuChoi:st==='Từ chối'?rs[i%3]:'',viDo:10.7626+Math.random()*0.01,kinhDo:106.66+Math.random()*0.01,doChinhXac:10+Math.random()*50}); }
 LocalDB.save(K.records,rec); LocalDB.save(K.chot,[]); LocalDB.save(K.audit,[{thoiDiem:nowISO(),nguoiThucHien:'system',hanhDong:'Khởi tạo dữ liệu',maBanGhi:'',chiTiet:'Seed lần đầu'}]); LocalDB.save(K.cauhinh,{GIO_MO_CHAM_CONG:'05:00',CONG_TOI_DA_NGAY:1});
}
seedIfEmpty();
let session=null, loginMode='ma';
function setTab(m){loginMode=m;document.getElementById('tabMa').classList.toggle('active',m==='ma');document.getElementById('tabSdt').classList.toggle('active',m==='sdt');document.getElementById('lblLogin').textContent=m==='ma'?'Mã thợ':'Số điện thoại';}
function loadSession(){const s=LocalDB.load(K.session);if(s&&new Date(s.han)>new Date()){session=s;showApp();}}
loadSession();
function doLogin(){const inp=document.getElementById('inpLogin').value.trim();const pass=document.getElementById('inpPass').value;const users=LocalDB.load(K.users)||[];let u=null;if(loginMode==='ma')u=users.find(x=>x.maTho.toLowerCase()===inp.toLowerCase()&&x.matKhau===pass);else{const np=normalizePhone(inp);u=users.find(x=>normalizePhone(x.sdt)===np&&x.matKhau===pass);}if(!u){alert('Sai thông tin đăng nhập');return;}if(u.trangThai!=='Hoạt động'){alert('Tài khoản đã khóa');return;}session={user:u,han:new Date(Date.now()+7*24*3600*1000).toISOString(),demo:false};LocalDB.save(K.session,session);showApp();}
function quickLogin(role){const users=LocalDB.load(K.users);let ma={tho:'tho01',quanly:'ql01',ketoan:'kt01',giamdoc:'nbatam'}[role];let u=users.find(x=>x.maTho===ma);session={user:u,han:new Date(Date.now()+7*24*3600*1000).toISOString(),demo:true};LocalDB.save(K.session,session);showApp();}
function logout(){localStorage.removeItem(K.session);session=null;document.getElementById('app').style.display='none';document.getElementById('loginScreen').style.display='grid';}
function hasPerm(p){if(!session)return false;if(session.user.vaiTro==='Giám đốc')return true;return (session.user.quyen||[]).includes(p);}
function showApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';document.getElementById('meInfo').innerHTML=`<b>${session.user.hoTen}</b><br><small>${session.user.maTho} · ${session.user.vaiTro}</small>${session.demo?'<div class="badge b-wait" style="margin-top:6px">Xem thử</div>':''}`;const isTho=session.user.vaiTro==='Thợ';document.querySelectorAll('.sidebar .nav-btn[data-perm]').forEach(btn=>{const perm=btn.getAttribute('data-perm');btn.classList.toggle('hidden',!hasPerm(perm));});document.getElementById('navThoCham').classList.toggle('hidden',!isTho);document.getElementById('navThoTT').classList.toggle('hidden',!isTho);if(isTho)nav('tho_cham');else nav('dashboard');}
let currentView='';function nav(v){currentView=v;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(b=>{if(b.getAttribute('onclick')?.includes(`'${v}'`))b.classList.add('active');});const main=document.getElementById('main');if(v==='dashboard')renderDashboard(main);else if(v==='duyet')renderDuyet(main);else if(v==='bangcong')renderBangCong(main);else if(v==='nhansu')renderNhanSu(main);else if(v==='dukien')renderDuKien(main);else if(v==='thongke')renderThongKe(main);else if(v==='nhatky')renderNhatKy(main);else if(v==='cauhinh')renderCauHinh(main);else if(v==='saoluu')renderSaoLuu(main);else if(v==='tho_cham')renderThoCham(main);else if(v==='tho_tt')renderThoTT(main);}
function getUsers(){return LocalDB.load(K.users)||[]}function getRecords(){return LocalDB.load(K.records)||[]}function getCauHinh(){return LocalDB.load(K.cauhinh)||{GIO_MO_CHAM_CONG:'05:00',CONG_TOI_DA_NGAY:1}}function addAudit(h,m,c){const a=LocalDB.load(K.audit)||[];a.unshift({thoiDiem:nowISO(),nguoiThucHien:session?.user?.maTho||'system',hanhDong:h,maBanGhi:m||'',chiTiet:c||''});LocalDB.save(K.audit,a);}
let bsState={options:[],onSelect:null};function openBS(t,opts,onSel){bsState={options:opts,onSelect:onSel};document.getElementById('bsTitle').textContent=t;document.getElementById('bsSearch').value='';document.getElementById('bs').classList.add('open');renderBS();}function closeBS(){document.getElementById('bs').classList.remove('open');}function renderBS(){const q=(document.getElementById('bsSearch').value||'').toLowerCase();const list=document.getElementById('bsList');list.innerHTML='';bsState.options.filter(o=>(o.label||'').toLowerCase().includes(q)).forEach(o=>{const d=document.createElement('div');d.className='bs-item';d.textContent=o.label;d.onclick=()=>{closeBS();bsState.onSelect(o);};list.appendChild(d);});}

function renderDashboard(main){
 if(!hasPerm('dashboard')){main.innerHTML='<div class="card">Không có quyền Xem Dashboard</div>';return;}
 const users=getUsers().filter(u=>u.vaiTro==='Thợ'&&u.trangThai==='Hoạt động');const records=getRecords();const ym=new Date().toISOString().slice(0,7);
 const recMonth=records.filter(r=>r.ngayCong.startsWith(ym)&&r.trangThai==='Đã duyệt');const cho=records.filter(r=>r.trangThai==='Chờ duyệt').length;const homNay=records.filter(r=>r.ngayCong===todayStr()&&r.trangThai==='Đã duyệt').length;
 let tongTien=0;recMonth.forEach(r=>{const u=getUsers().find(x=>x.maTho===r.maTho);if(u)tongTien+=u.donGia;});const chuaDonGia=getUsers().filter(u=>u.vaiTro==='Thợ'&&(!u.donGia||u.donGia===0)).length;
 main.innerHTML=`<div class="topbar"><h2>Dashboard</h2><span class="badge b-wait">${ym}</span></div>
 <div class="kpi-grid">
  <div class="card"><div class="kpi-label">Dự kiến trả thợ tháng</div><div class="kpi-val">${fmtMoney(tongTien)}</div><div style="font-size:11px;color:var(--light);margin-top:4px">tạm tính, chưa phải lương chốt</div></div>
  <div class="card"><div class="kpi-label">Thợ đi làm hôm nay / Tổng</div><div class="kpi-val">${homNay} / ${users.length}</div><div style="margin-top:8px;height:6px;background:#EFEBE9;border-radius:999px;overflow:hidden"><div style="width:${users.length?homNay/users.length*100:0}%;height:100%;background:var(--ok)"></div></div></div>
  <div class="card"><div class="kpi-label">Chờ duyệt</div><div class="kpi-val">${cho}</div><button class="btn btn-ghost" style="margin-top:8px" onclick="nav('duyet')">Đi duyệt →</button></div>
  <div class="card"><div class="kpi-label">Tổng công đã duyệt tháng</div><div class="kpi-val">${recMonth.length}</div></div>
 </div>${chuaDonGia?`<div class="card" style="margin-top:12px;border-color:#FFCDD2;background:#FFEBEE"><b style="color:var(--no)">⚠ ${chuaDonGia} thợ chưa có đơn giá</b> — vào Danh Sách Thợ để cập nhật</div>`:''}`;
}
function renderDuyet(main){
 if(!hasPerm('duyet_cong')){main.innerHTML='<div class="card">Không có quyền</div>';return;}
 const rec=getRecords().filter(r=>r.trangThai==='Chờ duyệt').sort((a,b)=>b.thoiDiemGui.localeCompare(a.thoiDiemGui));
 main.innerHTML=`<div class="topbar"><h2>Duyệt Công</h2><button class="btn btn-orange" onclick="duyetAll()">Duyệt hàng loạt (${rec.length})</button></div><div class="card" style="padding:0;overflow:hidden"><div style="overflow:auto"><table><thead><tr><th>Mã thợ</th><th>Họ tên</th><th>Ngày công</th><th>Giờ gửi</th><th>Vị trí</th><th>Hành động</th></tr></thead><tbody>${rec.map(r=>{const u=getUsers().find(x=>x.maTho===r.maTho);return `<tr><td><b>${r.maTho}</b></td><td>${u?.hoTen||''}</td><td>${r.ngayCong}</td><td>${new Date(r.thoiDiemGui).toLocaleString('vi-VN')}</td><td>${r.viDo?`<a href="https://maps.google.com/?q=${r.viDo},${r.kinhDo}" target="_blank">Bản đồ</a>`:'—'}</td><td><button class="btn btn-dark" onclick="duyetOne('${r.maBanGhi}',true)">Duyệt</button> <button class="btn btn-ghost" onclick="tuChoi('${r.maBanGhi}')">Từ chối</button></td></tr>`}).join('')||'<tr><td colspan=6 style="padding:20px;text-align:center;color:var(--light)">Không có bản ghi chờ duyệt</td></tr>'}</tbody></table></div></div>`;
}
function duyetOne(id){const rec=getRecords();const r=rec.find(x=>x.maBanGhi===id);if(!r)return;r.trangThai='Đã duyệt';r.nguoiDuyet=session.user.maTho;r.thoiDiemDuyet=nowISO();LocalDB.save(K.records,rec);addAudit('Duyệt công',id,`Duyệt ${r.maTho} ${r.ngayCong}`);renderDuyet(document.getElementById('main'));}
function tuChoi(id){const ly=prompt('Lý do từ chối:');if(!ly)return;const rec=getRecords();const r=rec.find(x=>x.maBanGhi===id);r.trangThai='Từ chối';r.lyDoTuChoi=ly;r.nguoiDuyet=session.user.maTho;r.thoiDiemDuyet=nowISO();LocalDB.save(K.records,rec);addAudit('Từ chối công',id,ly);renderDuyet(document.getElementById('main'));}
function duyetAll(){if(!confirm('Duyệt tất cả chờ duyệt?'))return;const rec=getRecords();let c=0;rec.forEach(r=>{if(r.trangThai==='Chờ duyệt'){r.trangThai='Đã duyệt';r.nguoiDuyet=session.user.maTho;r.thoiDiemDuyet=nowISO();c++;}});LocalDB.save(K.records,rec);addAudit('Duyệt hàng loạt','',`${c} bản ghi`);renderDuyet(document.getElementById('main'));}
function renderBangCong(main){
 if(!hasPerm('bang_cong')){main.innerHTML='<div class="card">Không có quyền</div>';return;}
 const ymDefault=new Date().toISOString().slice(0,7);
 main.innerHTML=`<div class="topbar"><h2>Bảng Công</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="month" id="bcThang" class="input" value="${ymDefault}" onchange="renderBangCongGrid()"><button class="btn btn-dark" onclick="chotThang()">Chốt tháng</button><button class="btn btn-ghost" onclick="xuatCSV()">Xuất CSV</button></div></div><div id="bcGrid"></div>`;
 renderBangCongGrid();
}
function renderBangCongGrid(){
 const thang=document.getElementById('bcThang')?.value;if(!thang)return;const year=+thang.slice(0,4),month=+thang.slice(5,7);const days=new Date(year,month,0).getDate();const users=getUsers().filter(u=>u.vaiTro==='Thợ');const records=getRecords().filter(r=>r.ngayCong.startsWith(thang));const chotList=LocalDB.load(K.chot)||[];const daChot=chotList.find(c=>c.thang===thang);
 let html=`<div class="table-wrap"><table><thead><tr><th class="sl">Thợ</th>`;for(let d=1;d<=days;d++)html+=`<th>${d}</th>`;html+=`<th class="sr" style="right:216px">Tổng</th><th class="sr" style="right:108px">Đơn giá</th><th class="sr" style="right:0">Thành tiền</th></tr></thead><tbody>`;
 users.forEach((u,idx)=>{let tong=0;let row=`<tr class="${idx%2===1?'row-alt':''}"><td class="sl"><b>${u.hoTen}</b><br><small style="color:var(--light)">${u.maTho} · ${u.phanLoai}</small></td>`;for(let d=1;d<=days;d++){const dayStr=thang+'-'+String(d).padStart(2,'0');const rs=records.filter(r=>r.maTho===u.maTho&&r.ngayCong===dayStr);const ok=rs.find(r=>r.trangThai==='Đã duyệt');const cho=rs.find(r=>r.trangThai==='Chờ duyệt');const no=rs.find(r=>r.trangThai==='Từ chối');let cls='',txt='';if(ok){cls='cell-ok';txt='✓';tong++;}else if(cho){cls='cell-wait';txt='C';}else if(no){cls='cell-no';txt='X';}row+=`<td class="grid-cell ${cls}" title="${ok?'Đã duyệt':cho?'Chờ duyệt':no?'Từ chối: '+no.lyDoTuChoi:''}" onclick="handleCell('${u.maTho}','${dayStr}','${thang}')">${txt}</td>`;}const thanh=tong*(u.donGia||0);row+=`<td class="sr" style="right:216px">${tong}</td><td class="sr" style="right:108px;font-size:11px">${fmtMoney(u.donGia)}</td><td class="sr" style="right:0;font-size:11px">${fmtMoney(thanh)}<br><small style="font-weight:400;color:var(--light)">tạm tính</small></td></tr>`;html+=row;});
 html+=`</tbody></table></div>`;if(daChot)html+=`<div class="card" style="margin-top:10px">Đã chốt ${thang} lúc ${new Date(daChot.thoiDiemChot).toLocaleString('vi-VN')} bởi ${daChot.nguoiChot}. ${daChot.ghiChu||''}</div>`;
 document.getElementById('bcGrid').innerHTML=html;
}
function handleCell(maTho,ngayCong,thang){
 const chotList=LocalDB.load(K.chot)||[];const daChot=chotList.find(c=>c.thang===thang);if(daChot&&!hasPerm('sua_cong')){alert('Tháng đã chốt, chỉ quyền Sửa Công được điều chỉnh');return;}
 if(daChot&&hasPerm('sua_cong')){const ly=prompt('Điều chỉnh sau chốt - Nhập lý do bắt buộc:');if(!ly)return;const rec=getRecords();const ex=rec.find(r=>r.maTho===maTho&&r.ngayCong===ngayCong&&r.trangThai==='Đã duyệt');if(ex){if(confirm('Xóa công đã duyệt ngày này?')){rec.splice(rec.indexOf(ex),1);LocalDB.save(K.records,rec);addAudit('Điều chỉnh sau chốt - xóa công',ex.maBanGhi,ly);}}else{rec.push({maBanGhi:'BG'+Date.now(),maTho,ngayCong,thoiDiemGui:nowISO(),trangThai:'Đã duyệt',nguoiDuyet:session.user.maTho,thoiDiemDuyet:nowISO(),lyDoTuChoi:'',viDo:null,kinhDo:null,doChinhXac:null});LocalDB.save(K.records,rec);addAudit('Điều chỉnh sau chốt - thêm công','',`${maTho} ${ngayCong} - ${ly}`);}renderBangCongGrid();return;}
 if(hasPerm('duyet_cong')){const rec=getRecords().filter(r=>r.maTho===maTho&&r.ngayCong===ngayCong&&r.trangThai==='Chờ duyệt');if(rec.length&&confirm(`Duyệt ${rec.length} bản ghi chờ của ${maTho} ngày ${ngayCong}?`)){const all=getRecords();rec.forEach(r=>{const rr=all.find(x=>x.maBanGhi===r.maBanGhi);rr.trangThai='Đã duyệt';rr.nguoiDuyet=session.user.maTho;rr.thoiDiemDuyet=nowISO();});LocalDB.save(K.records,all);renderBangCongGrid();}}
}
function chotThang(){if(!hasPerm('sua_cong')&&!hasPerm('bang_cong')){alert('Không có quyền');return;}const thang=document.getElementById('bcThang').value;if(!confirm(`Chốt tháng ${thang}?`))return;const ghiChu=prompt('Ghi chú chốt:')||'';const records=getRecords().filter(r=>r.ngayCong.startsWith(thang));const chotList=LocalDB.load(K.chot)||[];chotList.push({thang,thoiDiemChot:nowISO(),nguoiChot:session.user.maTho,duLieu:records,ghiChu});LocalDB.save(K.chot,chotList);addAudit('Chốt tháng','',thang);renderBangCongGrid();}
function xuatCSV(){const thang=document.getElementById('bcThang').value;const year=+thang.slice(0,4),month=+thang.slice(5,7),days=new Date(year,month,0).getDate();const users=getUsers().filter(u=>u.vaiTro==='Thợ');const records=getRecords().filter(r=>r.ngayCong.startsWith(thang));let csv='\uFEFFMa tho,Ho ten,Phan loai,';for(let d=1;d<=days;d++)csv+=d+',';csv+='Tong,Don gia,Thanh tien (tam tinh)\n';users.forEach(u=>{let tong=0;let row=`${u.maTho},${u.hoTen},${u.phanLoai},`;for(let d=1;d<=days;d++){const dayStr=thang+'-'+String(d).padStart(2,'0');const ok=records.find(r=>r.maTho===u.maTho&&r.ngayCong===dayStr&&r.trangThai==='Đã duyệt');if(ok){row+='1,';tong++;}else row+=',';}row+=`${tong},${u.donGia},${tong*u.donGia}\n`;csv+=row;});const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`bang_cong_${thang}.csv`;a.click();}
function renderNhanSu(main){
 if(!hasPerm('nhan_su')){main.innerHTML='<div class="card">Không có quyền</div>';return;}
 main.innerHTML=`<div class="topbar"><h2>Danh Sách Thợ</h2><div style="display:flex;gap:8px"><button class="btn btn-orange" onclick="themTho()">Thêm thợ</button><button class="btn btn-ghost" onclick="xuatThoCSV()">Xuất CSV</button></div></div><div class="search-row"><input id="nsSearch" class="input" placeholder="Tìm tên, mã, SĐT..." oninput="renderNhanSuList()"><div id="nsFilterLoai" class="input" style="cursor:pointer" onclick="openPhanLoaiFilter()">Tất cả phân loại</div></div><div id="nsList"></div>`;window._nsLoai=null;renderNhanSuList();
}
function renderNhanSuList(){
 const q=(document.getElementById('nsSearch')?.value||'').toLowerCase();const users=getUsers().filter(u=>{if(window._nsLoai&&u.phanLoai!==window._nsLoai)return false;if(!q)return true;return (u.hoTen+u.maTho+u.sdt+u.phanLoai).toLowerCase().includes(q);});
 const cont=document.getElementById('nsList');cont.innerHTML=users.map(u=>`<div class="card" style="display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap"><div class="avatar">${u.anhDataUrl?`<img src="${u.anhDataUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:u.hoTen[0]}</div><div style="flex:1;min-width:200px"><b>${u.hoTen}</b> <span class="badge ${u.trangThai==='Hoạt động'?'b-ok':'b-no'}">${u.trangThai}</span><br><small style="color:var(--light)">${u.maTho} · ${u.vaiTro} · ${u.phanLoai} · ${fmtPhone(u.sdt)} · Vào làm: ${u.ngayVaoLam||''}<br>Đơn giá: ${fmtMoney(u.donGia)} · MK: ${u.matKhau} (plaintext demo)</small></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-dark" onclick="suaTho('${u.maTho}')">Sửa</button><button class="btn btn-ghost" onclick="khoaTho('${u.maTho}')">${u.trangThai==='Hoạt động'?'Khóa':'Mở'}</button><button class="btn btn-ghost" onclick="resetMK('${u.maTho}')">Reset MK</button><button class="btn btn-ghost" onclick="suaQuyen('${u.maTho}')">Quyền</button></div></div>`).join('');
}
function openPhanLoaiFilter(){const opts=[{label:'Tất cả phân loại',value:null},{label:'Thợ sơn',value:'Thợ sơn'},{label:'Thợ gỗ',value:'Thợ gỗ'},{label:'Thợ nề',value:'Thợ nề'},{label:'Quản lý',value:'Quản lý'},{label:'Kế toán',value:'Kế toán'}];openBS('Chọn phân loại',opts.map(o=>({label:o.label,value:o.value})),o=>{window._nsLoai=o.value;document.getElementById('nsFilterLoai').textContent=o.label;renderNhanSuList();});}
function themTho(){const ma=prompt('Mã thợ:');if(!ma)return;const ten=prompt('Họ tên:');if(!ten)return;const sdt=prompt('SĐT 10 số:');if(!sdt)return;const phanLoai=prompt('Phân loại (Thợ sơn/Thợ gỗ/Thợ nề):','Thợ sơn')||'Thợ sơn';const donGiaStr=prompt('Đơn giá (gõ 300 = 300.000):','300');const donGia=parseMoneyInput(donGiaStr);const ngayVao=prompt('Ngày vào làm YYYY-MM-DD:',todayStr())||todayStr();const users=getUsers();users.push({maTho:ma,hoTen:ten,sdt,vaiTro:'Thợ',trangThai:'Hoạt động',donGia,phanLoai,quyen:[],anhDataUrl:'',matKhau:'123456',ngayVaoLam:ngayVao});LocalDB.save(K.users,users);addAudit('Thêm nhân sự','',ma);renderNhanSuList();}
function suaTho(ma){const users=getUsers();const u=users.find(x=>x.maTho===ma);if(!u)return;const ten=prompt('Họ tên:',u.hoTen);if(ten)u.hoTen=ten;const sdt=prompt('SĐT:',u.sdt);if(sdt)u.sdt=sdt;const donGiaStr=prompt(`Đơn giá hiện ${u.donGia} (gõ 300=300.000, gõ "full" để đổi chế độ nhập đủ số):`,u.donGia);if(donGiaStr){if(donGiaStr==='full'){window._fullMoney=!window._fullMoney;alert('Chế độ full: '+window._fullMoney);}else u.donGia=parseMoneyInput(donGiaStr);}const pl=prompt('Phân loại:',u.phanLoai);if(pl)u.phanLoai=pl;const nv=prompt('Ngày vào làm:',u.ngayVaoLam||'');if(nv)u.ngayVaoLam=nv;if(confirm('Đổi avatar?')){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=e=>{const f=e.target.files[0];const fr=new FileReader();fr.onload=()=>{u.anhDataUrl=fr.result;LocalDB.save(K.users,users);renderNhanSuList();};fr.readAsDataURL(f);};inp.click();}LocalDB.save(K.users,users);addAudit('Sửa nhân sự','',ma);renderNhanSuList();}
function khoaTho(ma){const users=getUsers();const u=users.find(x=>x.maTho===ma);u.trangThai=u.trangThai==='Hoạt động'?'Khóa':'Hoạt động';LocalDB.save(K.users,users);addAudit(u.trangThai==='Khóa'?'Khóa nhân sự':'Mở nhân sự','',ma);renderNhanSuList();}
function resetMK(ma){const users=getUsers();const u=users.find(x=>x.maTho===ma);u.matKhau='123456';LocalDB.save(K.users,users);alert('Đã đặt lại MK 123456');addAudit('Đặt lại mật khẩu','',ma);}
function suaQuyen(ma){const all=[{k:'dashboard',label:'Xem Dashboard'},{k:'bang_cong',label:'Xem Bảng Công'},{k:'sua_cong',label:'Sửa Công'},{k:'duyet_cong',label:'Duyệt Công'},{k:'nhan_su',label:'Quản Lý Nhân Sự'},{k:'thong_ke',label:'Xem Thống Kê'},{k:'xuat_excel',label:'Xuất Excel'},{k:'cai_dat',label:'Quản Lý Cài Đặt'}];const users=getUsers();const u=users.find(x=>x.maTho===ma);let html=`<div class="card"><h3>Sửa quyền: ${u.hoTen}</h3><div style="display:grid;gap:8px;margin-top:12px">`;all.forEach(p=>{const ck=(u.quyen||[]).includes(p.k)?'checked':'';html+=`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" value="${p.k}" ${ck}> ${p.label} (${p.k})</label>`;});html+=`</div><button class="btn btn-dark" style="margin-top:12px" onclick="luuQuyen('${ma}')">Lưu</button></div>`;document.getElementById('main').innerHTML=html;}
function luuQuyen(ma){const checks=document.querySelectorAll('#main input[type=checkbox]:checked');const quyen=Array.from(checks).map(c=>c.value);const users=getUsers();const u=users.find(x=>x.maTho===ma);u.quyen=quyen;LocalDB.save(K.users,users);addAudit('Sửa quyền','',ma+' -> '+quyen.join(','));nav('nhansu');}
function xuatThoCSV(){let csv='\uFEFFMa tho,Ho ten,SDT,Vai tro,Phan loai,Don gia,Ngay vao lam,Trang thai\n';getUsers().forEach(u=>{csv+=`${u.maTho},${u.hoTen},${u.sdt},${u.vaiTro},${u.phanLoai},${u.donGia},${u.ngayVaoLam||''},${u.trangThai}\n`;});const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='danh_sach_tho.csv';a.click();}
function renderDuKien(main){if(!hasPerm('thong_ke')){main.innerHTML='<div class="card">Không có quyền</div>';return;}main.innerHTML=`<div class="topbar"><h2>Dự Kiến Trả Thợ</h2><input type="month" id="dkThang" class="input" value="${new Date().toISOString().slice(0,7)}" onchange="renderDuKienData()"></div><div id="dkData"></div>`;renderDuKienData();}
function renderDuKienData(){const thang=document.getElementById('dkThang').value;const records=getRecords().filter(r=>r.ngayCong.startsWith(thang)&&r.trangThai==='Đã duyệt');const users=getUsers().filter(u=>u.vaiTro==='Thợ');const byLoai={};let tongC=0,tongT=0;users.forEach(u=>{const cong=records.filter(r=>r.maTho===u.maTho).length;if(!cong)return;const tien=cong*(u.donGia||0);tongC+=cong;tongT+=tien;if(!byLoai[u.phanLoai])byLoai[u.phanLoai]={soTho:0,tongCong:0,tongTien:0,list:[]};byLoai[u.phanLoai].soTho++;byLoai[u.phanLoai].tongCong+=cong;byLoai[u.phanLoai].tongTien+=tien;byLoai[u.phanLoai].list.push({u,cong,tien});});let html=`<div class="kpi-grid">`;Object.entries(byLoai).forEach(([loai,d])=>{html+=`<div class="card"><b>${loai}</b><br>Số thợ: ${d.soTho}<br>Tổng công: ${d.tongCong}<br>Tổng tiền: ${fmtMoney(d.tongTien)} <small style="color:var(--light)">tạm tính</small></div>`;});html+=`</div><div class="card" style="margin-top:12px"><b>Tổng: ${tongC} công - ${fmtMoney(tongT)} (tạm tính, chưa phải lương chốt)</b></div><div class="card" style="margin-top:12px;overflow:auto"><table><thead><tr><th>Mã</th><th>Họ tên</th><th>Phân loại</th><th>Công</th><th>Đơn giá</th><th>Thành tiền tạm tính</th></tr></thead><tbody>`;users.forEach(u=>{const cong=records.filter(r=>r.maTho===u.maTho).length;if(cong)html+=`<tr><td>${u.maTho}</td><td>${u.hoTen}</td><td>${u.phanLoai}</td><td>${cong}</td><td>${fmtMoney(u.donGia)}</td><td>${fmtMoney(cong*u.donGia)}</td></tr>`;});html+=`</tbody></table></div>`;document.getElementById('dkData').innerHTML=html;}
function renderThongKe(main){if(!hasPerm('thong_ke')){main.innerHTML='<div class="card">Không có quyền</div>';return;}main.innerHTML=`<div class="topbar"><h2>Thống Kê</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="month" id="tkThang" class="input" value="${new Date().toISOString().slice(0,7)}" onchange="renderThongKeData()"><button class="btn btn-ghost" onclick="openTkTho()">Theo thợ + năm</button><button class="btn btn-ghost" onclick="openTkLoai()">Theo phân loại + năm</button></div></div><div id="tkData"></div>`;renderThongKeData();}
function renderThongKeData(){const thang=document.getElementById('tkThang').value;const rec=getRecords().filter(r=>r.ngayCong.startsWith(thang)&&r.trangThai==='Đã duyệt');const users=getUsers();let byTho={};rec.forEach(r=>{byTho[r.maTho]=(byTho[r.maTho]||0)+1;});let html=`<div class="card"><h3>Theo tháng ${thang}</h3><div style="overflow:auto"><table><thead><tr><th>Thợ</th><th>Công</th><th>Tiền tạm tính</th></tr></thead><tbody>`;Object.entries(byTho).forEach(([ma,cong])=>{const u=users.find(x=>x.maTho===ma);html+=`<tr><td>${u?.hoTen||ma}</td><td>${cong}</td><td>${fmtMoney((u?.donGia||0)*cong)}</td></tr>`;});html+=`</tbody></table></div></div>`;document.getElementById('tkData').innerHTML=html;}
function openTkTho(){const users=getUsers().filter(u=>u.vaiTro==='Thợ');openBS('Chọn thợ',users.map(u=>({label:u.hoTen+' ('+u.maTho+')',value:u.maTho})),o=>{const nam=prompt('Nhập năm YYYY:',new Date().getFullYear());if(!nam)return;const rec=getRecords().filter(r=>r.maTho===o.value&&r.ngayCong.startsWith(nam)&&r.trangThai==='Đã duyệt');const byM={};rec.forEach(r=>{const m=r.ngayCong.slice(0,7);byM[m]=(byM[m]||0)+1;});let html=`<div class="card"><h3>Thợ ${o.value} - năm ${nam}: ${rec.length} công</h3><table><thead><tr><th>Tháng</th><th>Công</th></tr></thead><tbody>`;Object.entries(byM).forEach(([m,c])=>{html+=`<tr><td>${m}</td><td>${c}</td></tr>`;});html+=`</tbody></table></div>`;document.getElementById('tkData').innerHTML=html;});}
function openTkLoai(){const loais=[...new Set(getUsers().map(u=>u.phanLoai))];openBS('Chọn phân loại',loais.map(l=>({label:l,value:l})),o=>{const nam=prompt('Nhập năm YYYY:',new Date().getFullYear());if(!nam)return;const users=getUsers().filter(u=>u.phanLoai===o.value);const rec=getRecords().filter(r=>r.ngayCong.startsWith(nam)&&r.trangThai==='Đã duyệt'&&users.some(u=>u.maTho===r.maTho));const byM={};rec.forEach(r=>{const m=r.ngayCong.slice(0,7);byM[m]=(byM[m]||0)+1;});let html=`<div class="card"><h3>Phân loại ${o.value} - năm ${nam}: ${rec.length} công</h3><table><thead><tr><th>Tháng</th><th>Công</th></tr></thead><tbody>`;Object.entries(byM).forEach(([m,c])=>{html+=`<tr><td>${m}</td><td>${c}</td></tr>`;});html+=`</tbody></table></div>`;document.getElementById('tkData').innerHTML=html;});}
function renderNhatKy(main){if(!hasPerm('cai_dat')){main.innerHTML='<div class="card">Không có quyền</div>';return;}const audit=LocalDB.load(K.audit)||[];main.innerHTML=`<div class="topbar"><h2>Nhật Ký</h2></div><div class="card" style="padding:0;overflow:hidden"><div style="overflow:auto"><table><thead><tr><th>Thời điểm</th><th>Người thực hiện</th><th>Hành động</th><th>Mã bản ghi</th><th>Chi tiết</th></tr></thead><tbody>${audit.map(a=>`<tr><td>${new Date(a.thoiDiem).toLocaleString('vi-VN')}</td><td>${a.nguoiThucHien}</td><td>${a.hanhDong}</td><td>${a.maBanGhi}</td><td>${a.chiTiet}</td></tr>`).join('')}</tbody></table></div></div>`;}
function renderCauHinh(main){if(!hasPerm('cai_dat')){main.innerHTML='<div class="card">Không có quyền Quản Lý Cài Đặt</div>';return;}const cfg=getCauHinh();main.innerHTML=`<div class="topbar"><h2>Cấu Hình</h2></div><div class="card" style="max-width:420px"><div class="field"><label>Giờ Mở Chấm Công (Giờ mở chấm công)</label><input id="cfgGio" class="input" value="${cfg.GIO_MO_CHAM_CONG}" type="time"></div><div class="field" style="margin-top:10px"><label>Công Tối Đa Ngày (Công tối đa/ngày)</label><input id="cfgCong" class="input" value="${cfg.CONG_TOI_DA_NGAY}" type="number" min="1"></div><button class="btn btn-dark" style="margin-top:14px" onclick="saveCauHinh()">Lưu Cấu Hình</button></div>`;}
function saveCauHinh(){const gio=document.getElementById('cfgGio').value;const cong=+document.getElementById('cfgCong').value;LocalDB.save(K.cauhinh,{GIO_MO_CHAM_CONG:gio,CONG_TOI_DA_NGAY:cong});addAudit('Lưu cấu hình','',`Giờ mở ${gio}, công tối đa ${cong}`);alert('Đã lưu');}
function renderSaoLuu(main){main.innerHTML=`<div class="topbar"><h2>Sao Lưu</h2></div><div class="card" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-dark" onclick="taiBackup()">Tải backup JSON</button><label class="btn btn-ghost" style="cursor:pointer">Khôi phục từ file JSON<input type="file" id="restoreFile" accept=".json" style="display:none" onchange="khoiPhuc(event)"></label></div>`;}
function taiBackup(){const data={users:LocalDB.load(K.users),records:LocalDB.load(K.records),chot:LocalDB.load(K.chot),audit:LocalDB.load(K.audit),cauhinh:LocalDB.load(K.cauhinh)};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`nm2_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();}
function khoiPhuc(e){const file=e.target.files[0];if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const data=JSON.parse(fr.result);if(data.users)LocalDB.save(K.users,data.users);if(data.records)LocalDB.save(K.records,data.records);if(data.chot)LocalDB.save(K.chot,data.chot);if(data.audit)LocalDB.save(K.audit,data.audit);if(data.cauhinh)LocalDB.save(K.cauhinh,data.cauhinh);alert('Khôi phục xong');addAudit('Khôi phục backup','','');}catch(err){alert('File lỗi');}};fr.readAsText(file);}
function renderThoCham(main){
 const cfg=getCauHinh();const now=new Date();const curH=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');const canCham=curH>=cfg.GIO_MO_CHAM_CONG;
 const rec=getRecords().filter(r=>r.maTho===session.user.maTho);const todayRec=rec.find(r=>r.ngayCong===todayStr());const thang=new Date().toISOString().slice(0,7);
 const daDuyetThang=rec.filter(r=>r.ngayCong.startsWith(thang)&&r.trangThai==='Đã duyệt').length;const choDuyet=rec.filter(r=>r.trangThai==='Chờ duyệt');const me=getUsers().find(u=>u.maTho===session.user.maTho);const tien=daDuyetThang*(me?.donGia||0);
 main.innerHTML=`<div class="topbar"><h2>Chấm Công</h2><span class="badge b-wait">${todayStr()} · mở từ ${cfg.GIO_MO_CHAM_CONG}</span></div>
 <div class="card" style="text-align:center;padding:28px"><div style="font-size:12px;color:var(--light);margin-bottom:14px">${!canCham?`Chưa đến giờ chấm công (sau ${cfg.GIO_MO_CHAM_CONG})`:'Sẵn sàng chấm công'}</div><button class="cham-btn" ${!canCham||todayRec?'disabled':''} onclick="chamCong()">${todayRec?'ĐÃ CHẤM HÔM NAY':'CHẤM CÔNG HÔM NAY'}</button>${todayRec?`<div style="margin-top:12px"><span class="badge ${todayRec.trangThai==='Đã duyệt'?'b-ok':todayRec.trangThai==='Chờ duyệt'?'b-wait':'b-no'}">${todayRec.trangThai}</span> ${todayRec.viDo?`<a href="https://maps.google.com/?q=${todayRec.viDo},${todayRec.kinhDo}" target="_blank" style="margin-left:8px">Bản đồ</a>`:''}</div>`:''}</div>
 <div class="kpi-grid" style="margin-top:12px"><div class="card"><div class="kpi-label">Số công hiện tại (đã duyệt, tháng này)</div><div class="kpi-val">${daDuyetThang}</div></div><div class="card"><div class="kpi-label">Số tiền dự kiến</div><div class="kpi-val">${fmtMoney(tien)}</div><div style="font-size:11px;color:var(--light)">tạm tính = lương ngày × công đã duyệt</div></div><div class="card" style="cursor:pointer" onclick="toggleCho()"><div class="kpi-label">Số công chờ quản lý duyệt</div><div class="kpi-val">${choDuyet.length}</div><small style="color:var(--light)">Bấm vào xem chi tiết</small></div></div><div id="choDetail" style="display:none;margin-top:12px" class="card"><h3>Chi tiết chờ duyệt</h3><div style="margin-top:8px">${choDuyet.map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between"><span>${r.ngayCong} - ${r.trangThai}</span>${r.viDo?`<a href="https://maps.google.com/?q=${r.viDo},${r.kinhDo}" target="_blank">Bản đồ</a>`:''}</div>`).join('')||'Không có'}</div></div>`;
}
function toggleCho(){const d=document.getElementById('choDetail');d.style.display=d.style.display==='none'?'block':'none';}
function chamCong(){
 const cfg=getCauHinh();const curH=new Date().toTimeString().slice(0,5);if(curH<cfg.GIO_MO_CHAM_CONG){alert(`Chưa đến giờ chấm công (sau ${cfg.GIO_MO_CHAM_CONG})`);return;}
 const all=getRecords();if(all.find(r=>r.maTho===session.user.maTho&&r.ngayCong===todayStr())){alert('Đã chấm hôm nay');return;}
 const saveRec=(viDo,kinhDo,acc,note)=>{const rec={maBanGhi:'BG'+Date.now(),maTho:session.user.maTho,ngayCong:todayStr(),thoiDiemGui:nowISO(),trangThai:'Chờ duyệt',nguoiDuyet:'',thoiDiemDuyet:'',lyDoTuChoi:'',viDo,kinhDo,doChinhXac:acc};const arr=LocalDB.load(K.records)||[];arr.push(rec);LocalDB.save(K.records,arr);addAudit('Chấm công',rec.maBanGhi,note||`GPS ${viDo},${kinhDo}`);renderThoCham(document.getElementById('main'));};
 if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>saveRec(p.coords.latitude,p.coords.longitude,p.coords.accuracy),err=>saveRec(null,null,null,`Không lấy được GPS: ${err.message}`));}else saveRec(null,null,null,'Không hỗ trợ GPS');
}
function renderThoTT(main){const u=getUsers().find(x=>x.maTho===session.user.maTho);main.innerHTML=`<div class="topbar"><h2>Thông Tin</h2></div><div class="card" style="display:flex;gap:14px;align-items:center"><div class="avatar" style="width:64px;height:64px;font-size:22px">${u.anhDataUrl?`<img src="${u.anhDataUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:u.hoTen[0]}</div><div><b style="font-size:18px">${u.hoTen}</b><br><small style="color:var(--light)">Mã thợ: ${u.maTho} · SĐT: ${fmtPhone(u.sdt)}<br>Ngày vào làm: ${u.ngayVaoLam||''}<br>Lương ngày: ${fmtMoney(u.donGia)}</small><br><small style="color:var(--light)">tạm tính, chưa phải lương chốt</small></div></div>`;}
</script>
</body>
</html>
