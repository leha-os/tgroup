<!--
/*
KEYWORD MAP - Ctrl+F để tìm nhanh
THEME_GLOBAL -> màu chung, font, radius toàn site
BG_CONFIG -> nền đen đậm + hạt bronze đậm, chỉnh độ đậm ở đây
CENTER_CONFIG -> chữ giữa THIS PAGE IS BEING UPDATED / LEHA
renderBG() -> canvas đậm, chạm
renderCenter() -> khối giữa in hoa
mountApp() -> chạy

QUICK EDIT:
Đậm nhạt hạt -> BG_CONFIG.particleColor / lineColor
Nhiều hạt hơn -> BG_CONFIG.particleCount
Chạm mạnh hơn -> BG_CONFIG.interactiveRadius + repelForce
Đổi chữ -> CENTER_CONFIG.content.title / byLine
*/
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TGROUP MASTER 2027-2030</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050505; --ink:#F7F2E8; --ink-dim:rgba(247,242,232,.5);
    --bronze-1:#C6A27A; --bronze-2:#B88A5A; --bronze-3:#8C6A4A;
  }
  html,body{margin:0; height:100%; background:var(--bg); overflow:hidden}
  #bg{position:fixed; inset:0; width:100%; height:100%; background:var(--bg)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app" style="position:relative; z-index:2; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px"></div>
<script>
// ================= ZONE 0: THEME_GLOBAL =================
const THEME_GLOBAL = {
  colors: {
    bg: "#050505", // đen đậm đặc - pure black
    ink: "#F7F2E8", // chữ trắng ngà
    inkDim: "rgba(247,242,232,0.5)", // chữ mờ
    bronze1: "#C6A27A", // bronze sáng - dùng cho hạt
    bronze2: "#B88A5A", // bronze giữa
    bronze3: "#8C6A4A", // bronze đậm
    line: "rgba(198,162,122,0.28)" // line bronze đậm hơn cũ
  },
  fonts: {
    display: "'Instrument Serif', serif",
    sans: "'Space Grotesk', sans-serif",
    mono: "'JetBrains Mono', monospace"
  },
  radius: { lg:"24px", md:"14px" },
  shadow: { glow:"0 0 24px rgba(198,162,122,0.35)" },
  motion: { ease:"cubic-bezier(.16,1,.3,1)", dur:"700ms" }
};

// ================= ZONE 1: CONFIG =================
// // SECTION 1: BG_CONFIG - BRIEF: Nền đen đậm chạm mạnh | Dark intense touch bg - Là nền chính | What it is: intense particle field
// // EDITABLE: Chỉnh ở BG_CONFIG | Edit at BG_CONFIG
// // FIX AT: Nếu đổi màu chung sửa ở THEME_GLOBAL Search: THEME_GLOBAL
const BG_CONFIG = {
  particleCount: 90, // số hạt - tăng đậm từ 48 lên 90
  particleColor: "rgba(198,162,122,0.62)", // màu hạt - đậm hơn 0.28 -> 0.62
  particleSize: 2.4, // size hạt - to hơn cho đậm
  lineColor: "rgba(198,162,122,0.20)", // màu dây - đậm hơn 0.08 -> 0.20
  lineDistance: 168, // khoảng cách nối dây
  speed: 0.62, // tốc độ - nhanh hơn xíu cho sống động
  interactiveRadius: 240, // vùng chạm - tăng 170 -> 240 cho nhạy
  repelForce: 0.018, // lực đẩy khi chạm - tăng mạnh
  rippleColor: "#C6A27A", // màu gợn khi click
  rippleMax: 260, // gợn loang to hơn
  blockTilt: 8 // khối giữa nghiêng mạnh hơn
};

// // SECTION 2: CENTER_CONFIG - BRIEF: Chữ giữa in hoa tiếng Anh | Center uppercase English - Là thông báo | What it is: maintenance message
// // EDITABLE: Chỉnh ở CENTER_CONFIG | Edit at CENTER_CONFIG
// // FIX AT: Nếu đổi màu chung sửa ở THEME_GLOBAL Search: THEME_GLOBAL
const CENTER_CONFIG = {
  content: {
    kicker: "TGROUP MASTER 2027-2030", // kicker trên
    title: "THIS PAGE IS<br>BEING UPDATED", // chữ chính - TIẾNG ANH IN HOA
    byLine: "", // chữ by - in hoa theo yêu cầu
    sub: "LEHA" // sub nhỏ cho sang
  },
  colors: {
    kicker: THEME_GLOBAL.colors.bronze1, // kicker bronze sáng
    title: THEME_GLOBAL.colors.ink, // title trắng
    by: THEME_GLOBAL.colors.bronze1, // Le Ha bronze sáng
    sub: THEME_GLOBAL.colors.inkDim // sub mờ
  },
  layout: { maxW:"680px", gap:"22px" }
};

// ================= ZONE 2: COMPONENT =================
// // SECTION 1: renderBG - BRIEF: Dựng nền đen đậm chạm | Build intense black touch - Là canvas | What it is: canvas logic
// // EDITABLE: Chỉnh ở BG_CONFIG | Edit at BG_CONFIG
// // FIX AT: Nếu đổi màu chung sửa ở THEME_GLOBAL Search: THEME_GLOBAL
function renderBG(){
  const c=document.getElementById('bg'), ctx=c.getContext('2d');
  let w,h, particles=[], mouse={x:-9999,y:-9999,active:false}, ripples=[];
  function resize(){ w=c.width=innerWidth; h=c.height=innerHeight; }
  resize(); addEventListener('resize',resize);
  for(let i=0;i<BG_CONFIG.particleCount;i++) particles.push({x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-.5)*BG_CONFIG.speed, vy:(Math.random()-.5)*BG_CONFIG.speed});
  function move(x,y){ mouse.x=x; mouse.y=y; mouse.active=true; }
  addEventListener('mousemove',e=>move(e.clientX,e.clientY));
  addEventListener('touchmove',e=>{ if(e.touches[0]) move(e.touches[0].clientX,e.touches[0].clientY); }, {passive:true});
  addEventListener('touchstart',e=>{ if(e.touches[0]){ move(e.touches[0].clientX,e.touches[0].clientY); ripples.push({x:e.touches[0].clientX,y:e.touches[0].clientY,r:0,a:0.7}); } }, {passive:true});
  addEventListener('click',e=> ripples.push({x:e.clientX,y:e.clientY,r:0,a:0.65}));
  addEventListener('mouseleave',()=> mouse.active=false);

  function frame(){
    ctx.fillStyle=THEME_GLOBAL.colors.bg; ctx.fillRect(0,0,w,h);
    // orb bronze đậm phía sau cho sâu
    const orb=ctx.createRadialGradient(w*0.5,h*0.55,0,w*0.5,h*0.55,Math.max(w,h)*0.65);
    orb.addColorStop(0,'rgba(198,162,122,0.14)'); orb.addColorStop(0.4,'rgba(184,138,90,0.06)'); orb.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=orb; ctx.fillRect(0,0,w,h);

    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>w) p.vx*=-1; if(p.y<0||p.y>h) p.vy*=-1;
      if(mouse.active){ const dx=p.x-mouse.x, dy=p.y-mouse.y, d=Math.hypot(dx,dy); if(d<BG_CONFIG.interactiveRadius){ const f=(BG_CONFIG.interactiveRadius-d)/BG_CONFIG.interactiveRadius; p.x+=dx*BG_CONFIG.repelForce*f; p.y+=dy*BG_CONFIG.repelForce*f; } }
      ctx.beginPath(); ctx.arc(p.x,p.y,BG_CONFIG.particleSize,0,Math.PI*2); ctx.fillStyle=BG_CONFIG.particleColor; ctx.shadowColor=BG_CONFIG.particleColor; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
    });
    for(let i=0;i<particles.length;i++) for(let j=i+1;j<particles.length;j++){
      const a=particles[i], b=particles[j], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<BG_CONFIG.lineDistance){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.strokeStyle=BG_CONFIG.lineColor; ctx.lineWidth=1.1*(1-d/BG_CONFIG.lineDistance); ctx.stroke(); }
    }
    ripples=ripples.filter(r=>r.a>0.02);
    ripples.forEach(r=>{
      ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.strokeStyle=`rgba(198,162,122,${r.a})`; ctx.lineWidth=2; ctx.stroke();
      ctx.beginPath(); ctx.arc(r.x,r.y,r.r*0.6,0,Math.PI*2); ctx.strokeStyle=`rgba(198,162,122,${r.a*0.5})`; ctx.lineWidth=1; ctx.stroke();
      r.r+=3.2; r.a*=0.972;
    });
    requestAnimationFrame(frame);
  }
  frame();
  // tilt card
  addEventListener('mousemove',e=>{
    const el=document.getElementById('center-card'); if(!el) return;
    const rx=(e.clientY-innerHeight/2)/innerHeight*-BG_CONFIG.blockTilt, ry=(e.clientX-innerWidth/2)/innerWidth*BG_CONFIG.blockTilt;
    el.style.transform=`perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg)`;
  });
}

// // SECTION 2: renderCenter - BRIEF: Dựng chữ giữa in hoa | Build uppercase center - Là text chính | What it is: centered text
// // EDITABLE: Chỉnh ở CENTER_CONFIG | Edit at CENTER_CONFIG
// // FIX AT: Nếu đổi màu chung sửa ở THEME_GLOBAL Search: THEME_GLOBAL
function renderCenter(){
  const C=CENTER_CONFIG;
  return `<main id="center-card" style="max-width:${C.layout.maxW}; width:100%; text-align:center; transition:transform 0.6s ${THEME_GLOBAL.motion.ease}">
    <div style="display:flex; flex-direction:column; align-items:center; gap:${C.layout.gap}">
      <p style="font-family:${THEME_GLOBAL.fonts.mono}; font-size:px; letter-spacing:.32em; color:${C.colors.kicker}; font-weight:600">${C.content.kicker}</p>
      <div style="width:56px; height:1.5px; background:${THEME_GLOBAL.colors.line}"></div>
      <h1 style="font-family:${THEME_GLOBAL.fonts.sans}; font-size:clamp(34px,6vw,66px); line-height:.88; font-weight:800; letter-spacing:-.04em; color:${C.colors.title}; text-transform:uppercase">${C.content.title}</h1>
      <p style="font-family:${THEME_GLOBAL.fonts.display}; font-size:clamp(28px,4vw,42px); font-style:italic; color:${C.colors.by}; letter-spacing:.08em; font-weight:400; margin-top:-4px; text-transform:uppercase">${C.content.byLine}</p>
      <p style="font-family:${THEME_GLOBAL.fonts.mono}; font-size:20px; letter-spacing:.26em; color:${C.colors.sub}; margin-top:12px; text-transform:uppercase">${C.content.sub}</p>
      <div style="margin-top:22px; width:8px; height:8px; border-radius:50%; background:${THEME_GLOBAL.colors.bronze1}; box-shadow:${THEME_GLOBAL.shadow.glow}"></div>
    </div>
  </main>`;
}
function mountApp(){ document.getElementById('app').innerHTML=renderCenter(); renderBG(); }
mountApp();
</script>
</body>
</html>
