// // SECTION 3: TEXT_ANIM_CONFIG - BRIEF: Motion chữ êm | Soft text reveal - Là animation fadeUp chậm | What it is: text anim
// // EDITABLE: Chỉnh ở TEXT_ANIM_CONFIG | Edit at TEXT_ANIM_CONFIG
// // FIX AT: Nếu đổi màu chung sửa ở THEME_GLOBAL Search: THEME_GLOBAL
const TEXT_ANIM_CONFIG = {
  duration: "1100ms", // chậm hơn cho êm
  stagger: "120ms", // cách nhau 120ms
  ease: "cubic-bezier(.16,1,.3,1)"
};

// ================= ZONE 2: COMPONENT =================
// // SECTION 1: renderHero - BRIEF: Dựng trang đen motion êm | Build soft black page - Là trang duy nhất | What it is: hero soft
// // EDITABLE: Chỉnh ở HERO_CONFIG | Edit at HERO_CONFIG
// // FIX AT: Nếu đổi màu chung sửa ở THEME_GLOBAL Search: THEME_GLOBAL
function renderHero(){
  const H = HERO_CONFIG.content;
  const C = THEME_GLOBAL.colors;
  return `
  <section style="position:relative; background:${C.bg}; min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; color:white">
    <!-- BG êm -->
    <div style="position:absolute; inset:0; pointer-events:none">
      <div style="position:absolute; inset:0; background:${BG_CONFIG.radial}; animation:breathe ${BG_CONFIG.breatheDuration} ease-in-out infinite"></div>
      <canvas id="dust" style="position:absolute; inset:0; width:100%; height:100%"></canvas>
      <div style="position:absolute; inset:0; opacity:${BG_CONFIG.noiseOpacity}; background-image:url(\"data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E\")"></div>
    </div>

    <div style="position:relative; z-index:2; width:100%; max-width:1200px; padding:24px; display:flex; flex-direction:column; align-items:center; text-align:center">
      <!-- logo float êm -->
      <div style="width:132px; height:132px; border-radius:28px; overflow:hidden; background:#000; border:1px solid rgba(255,255,255,0.10); box-shadow:0 20px 80px rgba(0,0,0,0.5); animation:floatSoft 6s ease-in-out infinite">
        <img src="${H.logo}" alt="TGroup Logo" style="width:100%; height:100%; object-fit:cover">
      </div>

      <div style="margin-top:44px; display:flex; flex-direction:column; align-items:center; gap:18px">
        <h2 class="display" style="font-size:clamp(36px,6vw,72px); line-height:0.9; letter-spacing:-0.03em; font-weight:500; animation:fadeUp ${TEXT_ANIM_CONFIG.duration} ${TEXT_ANIM_CONFIG.ease} both">${H.title}</h2>
        
        <p class="serif" style="font-size:clamp(18px,2.6vw,26px); font-weight:300; color:${C.ink90}; max-width:640px; line-height:1.3; animation:fadeUp ${TEXT_ANIM_CONFIG.duration} ${TEXT_ANIM_CONFIG.ease} ${TEXT_ANIM_CONFIG.stagger} both">${H.subVN}</p>
        
        <div style="width:80px; height:1px; background:linear-gradient(90deg, transparent, ${C.bronze1}, transparent); margin:8px 0; animation:fadeUp ${TEXT_ANIM_CONFIG.duration} ${TEXT_ANIM_CONFIG.ease} calc(${TEXT_ANIM_CONFIG.stagger}*2) both"></div>
        
        <h1 class="display" style="font-size:clamp(32px,6.5vw,64px); line-height:0.9; letter-spacing:-0.02em; font-weight:500; color:${C.bronze1}; text-transform:uppercase; animation:fadeUp ${TEXT_ANIM_CONFIG.duration} ${TEXT_ANIM_CONFIG.ease} calc(${TEXT_ANIM_CONFIG.stagger}*3) both">${H.mainEN}</h1>
        
        <p class="display" style="font-size:clamp(28px,4.5vw,48px); font-style:italic; color:${C.ink}; letter-spacing:0.04em; margin-top:2px; animation:fadeUp ${TEXT_ANIM_CONFIG.duration} ${TEXT_ANIM_CONFIG.ease} calc(${TEXT_ANIM_CONFIG.stagger}*4) both">${H.byLine}</p>
      </div>

      <div style="margin-top:48px; display:flex; flex-direction:column; align-items:center; gap:12px; animation:fadeUp ${TEXT_ANIM_CONFIG.duration} ${TEXT_ANIM_CONFIG.ease} calc(${TEXT_ANIM_CONFIG.stagger}*5) both">
        <div style="width:6px; height:6px; border-radius:50%; background:${C.bronze1}; box-shadow:0 0 18px rgba(198,162,122,0.35)"></div>
        <p class="sans" style="font-size:12px; letter-spacing:0.15em; text-transform:uppercase; color:${C.ink40}">${H.footer}</p>
      </div>
    </div>

    <div style="position:absolute; bottom:0; left:0; right:0; height:1px; background:linear-gradient(90deg, transparent, rgba(198,162,122,0.22), transparent)"></div>
  </section>`;
}

function initDust(){
  const c = document.getElementById('dust');
  if(!c) return;
  const ctx = c.getContext('2d');
  let w,h, particles=[];
  function resize(){ w=c.width=innerWidth; h=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);
  for(let i=0;i<BG_CONFIG.particleCount;i++) particles.push({x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-0.5)*BG_CONFIG.particleSpeed, vy:(Math.random()-0.5)*BG_CONFIG.particleSpeed});
  function frame(){
    ctx.clearRect(0,0,w,h);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0) p.x=w; if(p.x>w) p.x=0; if(p.y<0) p.y=h; if(p.y>h) p.y=0;
      ctx.beginPath(); ctx.arc(p.x,p.y,BG_CONFIG.particleSize,0,Math.PI*2); ctx.fillStyle=BG_CONFIG.particleColor; ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  frame();
}

function mount(){ document.getElementById('app').innerHTML=renderHero(); initDust(); }
mount();
</script>
</body>
</html>
