function tgParseGvizDate(v){

    let d=v.getDate(), m=v.getMonth()+1, y=v.getFullYear();
    return `${String(d).padStart(2,"0")}/${String(m).padStart(2,"0")}/${y}`;

      let m=/Date\((\d+),(\d+),(\d+)/.exec(str);
      if(m){
        let y=parseInt(m[1]), mo=parseInt(m[2]), d=parseInt(m[3]);

    if(dm){
      let d=parseInt(dm[1]), mo=parseInt(dm[2]), y=parseInt(dm[3]);

  }catch{return null;}
