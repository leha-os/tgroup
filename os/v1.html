/* v1.1 PRO: company cards, group sections, motion */
.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:#1E5A44;border-radius:3px}.sidebar::-webkit-scrollbar-track{background:transparent}
.company-band{height:6px}
.company-card{padding:18px}
.company-card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(30,26,15,.13);border-color:#D3B45C}
.company-card .mono{width:52px;height:52px;font-size:15px;border-radius:8px}
.company-name{font-size:15px}
.company-legal{font-size:11px;color:#8a877d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:290px;margin-top:3px}
.group-badge{font-size:10.5px;font-weight:800;letter-spacing:0;color:#fff;padding:5px 9px;border-radius:20px;white-space:nowrap;align-self:flex-start}
.company-meta4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 12px}
.company-meta4 small{display:block;color:#8a877d;font-size:8.5px;letter-spacing:0;margin-bottom:4px}
.company-meta4 strong{font-size:14px}
.company-leader{display:flex;gap:9px;align-items:center;padding:10px 0;border-top:1px solid #f0eee8}
.company-leader small{display:block;color:#8a877d;font-size:8.5px;letter-spacing:0}
.company-leader strong{font-size:12.5px}
.group-section-head{font-size:17px;font-weight:800;letter-spacing:0;display:flex;align-items:center;gap:10px;margin:22px 0 13px;padding-left:12px;border-left:5px solid #D3B45C;color:#1A1A1A}
.group-section-head span{font-size:12px;color:#8a877d;font-weight:600;letter-spacing:0}
.detail-hero .mono{width:72px;height:72px;font-size:20px;border-radius:10px}
.detail-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi,.alert-card,.panel{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.kpi:hover,.alert-card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(30,26,15,.13);border-color:#D3B45C}
.btn{transition:all .18s ease}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.nav button{transition:all .18s ease}.nav button:hover{transform:translateX(2px)}
.content{animation:viewIn .45s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.progress span,.mini-bar span{transform-origin:left;animation:barGrow .9s ease both}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{transform-origin:bottom;animation:barUp .8s ease both}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.donut{animation:donutIn 1s ease both}
@keyframes donutIn{from{transform:rotate(-25deg);opacity:.35}to{transform:rotate(0);opacity:1}}
.modal{animation:modalIn .28s ease both}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal-backdrop{animation:fadeIn .25s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.toast{animation:toastIn .3s ease both}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.task-card,.company-card{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}

/* ===== TGROUP OS v1.2.0 — Lớp trình bày Command Center ===== */
:root{--shadow:0 10px 30px rgba(24,32,18,.08),0 2px 6px rgba(24,32,18,.05);--shadow-lg:0 18px 42px rgba(7,35,26,.16),0 4px 12px rgba(24,32,18,.07)}
body{font-size:13.5px}
.content{padding:28px 30px 38px}
.page-head h1{font-size:31px;letter-spacing:0}
.page-head{margin-bottom:22px}
.kpi-num{font-size:38px;letter-spacing:0}
.kpi,.panel,.company-card,.alert-card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.kpi:hover,.company-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.panel-head h3{font-size:13.5px;letter-spacing:0}
thead th{position:sticky;top:0;z-index:2;background:#faf9f5}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{transition:background .12s ease}
.nav-badge{margin-left:auto;background:linear-gradient(160deg,#BE9638 0%,#D9B968 55%,#BE9638 100%);color:#2A2005;font-size:10.5px;font-weight:850;border-radius:20px;padding:2px 7px;line-height:1.5;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.avatar{background:linear-gradient(135deg,#efe0ae,#d9be6a);color:#6d5510}
.btn.primary{background:linear-gradient(160deg,#D3B45C 0%,#DFBE6E 55%,#D3B45C 100%);border-color:#B08D1E;box-shadow:0 2px 8px rgba(201,162,39,.35)}
.status{letter-spacing:0}
/* Hero */
.hero{position:relative;border-radius:18px;padding:26px 28px 24px;color:#E7ECE7;background:radial-gradient(640px 300px at 88% -10%,rgba(201,162,39,.30),transparent 60%),radial-gradient(520px 280px at 4% 118%,rgba(46,125,50,.38),transparent 62%),linear-gradient(120deg,#072219,#0C392D 55%,#11472E);overflow:hidden;margin-bottom:17px;box-shadow:var(--shadow-lg)}
.hero:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.028) 46px 47px);pointer-events:none}
.hero-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
.hero .eyebrow{color:#F0E2B4;margin-bottom:8px}
.hero h2{font-size:31px;line-height:1.12;margin:0 0 7px;font-weight:850;letter-spacing:0;color:#fff}
.hero .hsub{color:#BCD2C0;font-size:12.5px;max-width:640px;line-height:1.6}
.hero-date{text-align:right;color:#cfe0d2;font-size:12px;line-height:1.7}
.hero-date b{display:block;color:#F0E2B4;font-size:15px;letter-spacing:0}
.hero-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:21px;position:relative;z-index:1}
.hero-kpi{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:15px 16px 13px;cursor:pointer;transition:background .15s ease,transform .15s ease}
.hero-kpi:hover{background:rgba(255,255,255,.10);transform:translateY(-2px)}
.hk-top{font-size:11.5px;letter-spacing:0;color:#CFE0D2;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.hk-num{font-size:41px;font-weight:850;line-height:1.06;margin:7px 0 2px;background:linear-gradient(180deg,#DFBE6E,#D3B45C);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:0}
.hk-sub{font-size:11.5px;color:#A9C3AE}
.spark{display:flex;align-items:flex-end;gap:3px;height:24px;margin-top:10px}
.spark i{flex:1;background:linear-gradient(180deg,rgba(244,215,122,.95),rgba(201,162,39,.55));border-radius:2px 2px 0 0;min-height:3px}
/* Dieu hanh hom nay */
.today-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:17px}
.today-card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease;min-width:0}
.today-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.today-card.red{border-top-color:rgba(255,255,255,.15)}.today-card.blue{border-top-color:rgba(255,255,255,.15)}.today-card.green{border-top-color:rgba(255,255,255,.15)}
.tc-top{font-size:11.5px;font-weight:850;letter-spacing:0;color:#A8873A;display:flex;justify-content:space-between;align-items:center}
.tc-big{font-size:25px;font-weight:850;letter-spacing:0;margin:7px 0 3px;color:var(--ink)}
.tc-item{font-size:12px;color:#5D5B54;padding:2.5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-item b{color:#2D2D2A}
/* Co cau tap doan */
.group-band{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:17px}
.gb-block{border-radius:15px;padding:18px 19px;color:#fff;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease}
.gb-block:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.gb-block:after{content:"";position:absolute;right:-24px;top:-24px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.09)}
.gb-block .gb-name{font-size:12.5px;font-weight:850;letter-spacing:0}
.gb-block .gb-num{font-size:35px;font-weight:850;letter-spacing:0;margin:8px 0 2px}
.gb-block .gb-sub{font-size:12px;opacity:.85;line-height:1.6}
.gb-wp{background:linear-gradient(120deg,#0A2E21,#17503D)}
.gb-ww{background:linear-gradient(120deg,#0A2E21,#17503D)}
.gb-sh{background:linear-gradient(120deg,#33332E,#5A5A52)}
/* Bang xep hang / bars */
.bar-mini{height:6px;background:#EF EDE6;background:#EFEDE6;border-radius:99px;overflow:hidden;min-width:96px}
.bar-mini i{display:block;height:100%;background:linear-gradient(90deg,#DDBB45,#A38322);border-radius:99px}
.rank-mono{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:12px;flex:0 0 auto}
/* Cover band cong ty */
.company-band{height:64px;margin:-15px -15px 13px;background:linear-gradient(115deg,var(--co),color-mix(in srgb,var(--co) 55%,#0C3B2E));display:flex;align-items:flex-end;justify-content:flex-end;padding:8px 12px;overflow:hidden}
.company-band span{font-size:34px;font-weight:900;letter-spacing:0;color:rgba(255,255,255,.35);line-height:1}
/* Login stats */
.login-stats{display:flex;gap:30px;margin-top:34px;flex-wrap:wrap}
.login-stats b{display:block;font-size:27px;font-weight:850;background:linear-gradient(180deg,#DFBE6E,#D3B45C);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.login-stats span{font-size:10.5px;letter-spacing:0;color:#BCD2C0;font-weight:800}
/* Switch tu dong hoa */
.switch{width:45px;height:25px;border-radius:99px;background:#D8D4C6;border:0;position:relative;transition:background .15s ease;flex:0 0 auto;padding:0}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s ease;box-shadow:0 1px 4px rgba(0,0,0,.28)}
.switch.on{background:#2E7D32}
.switch.on:after{left:23px}
.rule-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.rule-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px}
.rule-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
.rule-head b{font-size:12.5px;line-height:1.45}
.rule-meta{display:grid;gap:5px;font-size:12px;color:#5D5B54;line-height:1.55}

.chan{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;background:#EEF3EE;color:#2E7D32;white-space:nowrap}

/* Lich sinh nhat */
.view-toggle{display:inline-flex;background:#EF EDE6;background:#EFEDE6;border-radius:9px;padding:3px;gap:3px}
.view-toggle button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:750;color:#777}
.view-toggle button.active{background:#fff;color:#5D4911;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.cal-title{font-size:16px;font-weight:850;letter-spacing:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow{text-align:center;font-size:11px;font-weight:850;letter-spacing:0;color:#A8873A;padding:5px 0}
.cal-cell{min-height:98px;border:1px solid var(--line);border-radius:11px;padding:7px;background:#fff;min-width:0}

.cal-cell.today .cal-day{color:#A8873A}
.cal-chip{display:flex;align-items:center;gap:5px;background:#F7F1DA;border:1px solid #EADFAE;border-radius:20px;padding:2px 8px 2px 2px;font-size:10.5px;font-weight:750;cursor:pointer;margin-bottom:4px;max-width:100%;overflow:hidden;white-space:nowrap}
.cal-chip:hover{background:#F1E7C3}
.cal-chip .avatar{width:18px;height:18px;font-size:8px;flex:0 0 auto}
.cal-more{font-size:10.5px;color:#A8873A;font-weight:850;padding-left:4px}
/* Lich tap doan */
.year-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.month-cell{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 14px;min-width:0}
.month-cell h4{margin:0 0 9px;font-size:13px;font-weight:850;letter-spacing:0;color:#0C3B2E}
.evt{display:flex;gap:7px;font-size:11.5px;padding:3.5px 0;line-height:1.45;color:#45443F}
.evt i{width:8px;height:8px;border-radius:50%;margin-top:4px;flex:0 0 auto}
.evt small{display:block;color:#999;font-size:10.5px}
.evt-none{font-size:11.5px;color:#B9B6AA;padding:3px 0}
/* Stepper quy trinh */
.steps{display:grid}
.step{display:flex;gap:14px;position:relative;padding:0 0 20px}
.step:before{content:"";position:absolute;left:15px;top:36px;bottom:1px;width:2px;background:#E7E2D2}
.step:last-child:before{display:none}
.step:last-child{padding-bottom:2px}
.step-n{width:32px;height:32px;border-radius:50%;background:linear-gradient(160deg,#12492F,#0C3B2E);color:#F0E2B4;font-weight:850;display:grid;place-items:center;flex:0 0 auto;z-index:1;font-size:12.5px;box-shadow:0 3px 8px rgba(12,59,46,.3)}
.step-body{flex:1;min-width:0;padding-top:5px}
.step-body b{font-size:12.5px}
.step-role{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;background:#F4F1E7;color:#756326;margin-left:8px;white-space:nowrap}
.step-body p{margin:5px 0 0;color:#5D5B54;font-size:12.5px;line-height:1.6}
.proc-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.proc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease}
.proc-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.proc-card .pc-ico{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#efe0ae,#d9be6a);display:grid;place-items:center;font-size:17px;color:#6d5510;margin-bottom:11px}
.proc-card b{font-size:13px;display:block;margin-bottom:5px}
.proc-card p{margin:0;color:#777;font-size:12px;line-height:1.6}
/* Phieu luong / ca nhan */
.ring{width:104px;height:104px;border-radius:50%;position:relative;flex:0 0 auto}
.ring:after{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%}
.ring-c{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c b{font-size:16px}.ring-c span{font-size:10px;color:#888}
.slip-row{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px dashed #E7E2D2;font-size:13px}
.slip-row.total{border-bottom:0;border-top:2px solid var(--gold);font-weight:850;font-size:13.5px;margin-top:4px;padding-top:12px}
.me-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1180px){.hero-kpis,.today-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.year-grid,.proc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rule-grid,.me-grid{grid-template-columns:1fr}.group-band{grid-template-columns:1fr}}
@media (max-width:720px){.hero-kpis,.today-grid,.year-grid,.proc-grid{grid-template-columns:1fr}.cal-cell{min-height:74px}.hero{padding:20px}.hero h2{font-size:24px}}

function pageLabel(p){const map={overview:'Tổng quan',companies:'Công ty thành viên',projects:'Dự án',tasks:'Công việc',employees:'Nhân sự & danh bạ',clients:'Khách hàng',suppliers:'Nhà cung cấp',warehouses:'Kho',materials:'Vật tư',budgets:'Ngân sách',vouchers:'Chứng từ',payments:'Thanh toán',leave:'Nghỉ phép',attendance:'Chấm công','daily-plans':'Kế hoạch ngày',forms:'Biểu mẫu in',notifications:'Thông báo',audit:'Lịch sử hệ thống',settings:'Cài đặt',worker:'Tổng quan thợ',search:'Kết quả tìm kiếm',attention:'Trung tâm cần chú ý',meetings:'Họp Ban Giám đốc','meeting-detail':'Chi tiết cuộc họp',okr:'OKR toàn Group',cashflow:'Ngân sách & dòng tiền',risks:'Rủi ro & bản đồ nhiệt',radar:'Radar hết hạn',contracts:'Hợp đồng',orgchart:'Sơ đồ tổ chức',pipeline:'Pipeline khách hàng',payroll:'Lương & thu nhập',automation:'Tự động hóa',myspace:'Không gian của tôi',birthdays:'Sinh nhật nhân sự','group-calendar':'Lịch tập đoàn',processes:'Quy trình & Quy chế'};return map[p]||p}
function setPage(p){if(!allowed(p)){toast('Vai trò hiện tại không có quyền truy cập module này.');return}currentPage=p;selectedCompany=null;selectedProject=null;selectedEmployee=null;render() }function go(p){if(!allowed(p)){toast('Tài khoản của bạn không có quyền xem mục này');return}setPage(p);document.getElementById('sidebar')?.classList.remove('open')}function render(){if(!loginVisible&&!allowed(currentPage))currentPage=landingPage();const root=document.getElementById('app');root.innerHTML=shell();if(loginVisible)renderLogin();requestAnimationFrame(animateKPIs);}
function toggleMenu(){document.getElementById('sidebar')?.classList.toggle('open')}function doLogout(){sessionStorage.removeItem('tgroup_os_session');sessionStorage.removeItem('tgroup_os_user');sessionStorage.removeItem('tgroup_os_intro');loginVisible=true;currentUser=USERS[0];render()}

function toast(msg){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3200)}function pageHead(title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">TGROUP ECOSYSTEM / ${esc(pageLabel(currentPage))}</div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}function btn(label,onclick,cls=''){return `<button class="btn ${cls}" onclick="${onclick}">${label}</button>`}function status(s){return `<span class="status ${statusClass(s)}">${esc(s)}</span>`}function progressCell(n){if(n==null)return '<span style="color:#888">Chưa có dữ liệu</span>';return `<div class="progress-cell"><div><span>Tiến độ</span><b>${n}%</b></div><div class="progress"><span style="width:${Math.max(0,Math.min(100,n))}%"></span></div></div>`}
function renderPage(){if(!allowed(currentPage))currentPage=landingPage();switch(currentPage){case'overview':return renderOverview();case'companies':return selectedCompany?renderCompanyDetail(selectedCompany):renderCompanies();case'projects':return selectedProject?renderProjectDetail(selectedProject):renderProjects();case'tasks':return renderTasks();case'employees':return selectedEmployee?renderEmployeeDetail(selectedEmployee):renderEmployees();case'clients':return renderClients();case'suppliers':return renderSuppliers();case'warehouses':return renderWarehouses();case'materials':return renderMaterials();case'budgets':return renderBudgets();case'vouchers':return renderVouchers();case'payments':return renderPayments();case'leave':return renderLeave();case'attendance':return renderAttendance();case'daily-plans':return renderDailyPlans();case'forms':return renderForms();case'notifications':return renderNotifications();case'audit':return renderAudit();case'settings':return renderSettings();case'worker':return renderWorker();case'attention':return renderAttention();case'meetings':return renderMeetings();case'meeting-detail':return renderMeetingDetail();case'okr':return renderOKR();case'cashflow':return renderCashflow();case'risks':return renderRisks();case'radar':return renderRadar();case'contracts':return renderContracts();case'orgchart':return renderOrgchart();case'pipeline':return renderPipeline();case'payroll':return renderPayroll();case'automation':return renderAutomation();case'myspace':return renderMySpace();case'birthdays':return renderBirthdays();case'group-calendar':return renderGroupCalendar();case'community':return renderCommunity();case'processes':return renderProcesses();case'search':return renderSearch();case'handbook-weplus':return renderHandbook('weplus');case'handbook-wewall':return renderHandbook('wewall');default:return renderOverview()}}
function sparkBars(vals){let max=Math.max(...vals,1);return `<span class="spark">${vals.map(v=>`<i style="height:${Math.max(12,Math.round(v/max*100))}%"></i>`).join('')}</span>`}
function areaChartSVG(months){let ks=Object.keys(months).sort();if(!ks.length)return '<div class="empty">Chưa có dữ liệu dòng tiền theo tháng.</div>';let vals=ks.map(k=>months[k]);let max=Math.max(...vals,1);let W=560,H=150,PL=6,PB=20,PT=12;let x=i=>PL+i*(W-PL*2)/Math.max(1,ks.length-1);let y=v=>PT+(H-PT-PB)*(1-v/max);let pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');let area=`${PL},${H-PB} ${pts} ${x(vals.length-1)},${H-PB}`;return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block"><defs><linearGradient id="cfGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D3B45C" stop-opacity=".38"/><stop offset="1" stop-color="#D3B45C" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#cfGrad)"/><polyline points="${pts}" fill="none" stroke="#A38322" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.4" fill="#fff" stroke="#A38322" stroke-width="2"/><text x="${x(i)}" y="${H-5}" text-anchor="${i===0?'start':i===vals.length-1?'end':'middle'}" font-size="10" fill="#8a877d">${ks[i].slice(5)}/${ks[i].slice(2,4)}</text><text x="${x(i)}" y="${Math.max(10,y(v)-9)}" text-anchor="${i===0?'start':i===vals.length-1?'end':'middle'}" font-size="9.5" font-weight="700" fill="#6d5510">${(v/1e9).toFixed(2).replace('.',',')} tỷ</text>`).join('')}</svg>`}
function renderOverview(){let comps=visibleCompanies(),full=['Developer','Chủ tịch','HR','Kế toán'].includes(currentUser.role),projects=allProjects().filter(p=>full||comps.some(c=>c.id===p.companyId)),emps=db.employees.filter(e=>full||e.companyId==null||comps.some(c=>c.id===e.companyId)),clients=db.clients.filter(c=>full||comps.some(c=>c.id===c.companyId)),headCount=emps.length;
let grp=e=>{let c=db.operating_units.find(x=>x.id===e.companyId);return c?c.group:''},wp=emps.filter(e=>grp(e)==='WePlus Group').length,ww=emps.filter(e=>grp(e)==='WeWall Group').length,shared=headCount-wp-ww;

function renderWarehouses(){return `${pageHead('Quản lý kho','Kho xưởng Thủ Đức và Kho trụ sở.',btn('＋ Phiếu nhập / xuất','openModal(\'movement\')','primary'))}<div class="grid companies-grid">${db.warehouses.map(w=>`<div class="panel"><div class="panel-head"><div><h3>${esc(w.name)}</h3><p>${esc(w.address)}</p></div><span class="tag">${db.materials.filter(m=>m.warehouseId===w.id).length} vật tư</span></div><div class="detail-stat"><small>SỐ MÃ VẬT TƯ</small><strong>${db.materials.filter(m=>m.warehouseId===w.id).length}</strong></div><div style="margin-top:12px">${btn('Xem vật tư',`listCompany='all';go('materials')`)}</div></div>`).join('')}</div><div class="panel"><div class="panel-head"><h3>LỊCH SỬ NHẬP / XUẤT</h3><span class="tag">${db.stock_movements.length} giao dịch</span></div>${movementTable(db.stock_movements)}</div>`}
function movementTable(list){return `<div class="table-wrap"><table><thead><tr><th>NGÀY</th><th>VẬT TƯ</th><th>KHO</th><th>LOẠI</th><th>SỐ LƯỢNG</th><th>DỰ ÁN</th><th>NGƯỜI THỰC HIỆN</th></tr></thead><tbody>${list.map(m=>`<tr><td>${fmtDate(m.date)}</td><td>${esc(db.materials.find(x=>x.id===m.materialId)?.name||m.materialId)}</td><td>${esc(db.warehouses.find(x=>x.id===m.warehouseId)?.name||'—')}</td><td>${status(m.type)}</td><td>${m.quantity}</td><td>${esc(db.projects.find(p=>p.id===m.projectId)?.name||'—')}</td><td>${esc(m.user||'—')}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có giao dịch kho.</td></tr>'}</tbody></table></div>`}
function renderMaterials(){return `${pageHead('Vật tư & tồn kho','Nhóm gỗ, sắt và inox, sơn, nhôm kính, vật tư sự kiện.',btn('＋ Nhập / xuất kho','openModal(\'movement\')','primary')+btn('＋ Thêm vật tư','openModal(\'material\')'))}<div class="notice"><b>Lưu ý:</b> Khi xuất kho vượt tồn hiện tại, hệ thống sẽ chặn giao dịch.</div><div class="filters"><input placeholder="Tìm vật tư…" value="${esc(listFilter)}" oninput="listFilter=this.value;render()"><select onchange="listCompany=this.value;render()"><option value="all">Tất cả kho</option>${db.warehouses.map(w=>`<option value="${w.id}" ${listCompany===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>VẬT TƯ</th><th>NHÓM</th><th>KHO</th><th>TỒN ĐẦU KỲ</th><th>TỒN HIỆN TẠI</th><th></th></tr></thead><tbody>${db.materials.filter(m=>norm([m.name,m.category].join(' ')).includes(norm(listFilter))&&(listCompany==='all'||m.warehouseId===listCompany)).map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.category)}</td><td>${esc(db.warehouses.find(w=>w.id===m.warehouseId)?.name||'—')}</td><td>${m.opening}</td><td><b>${m.stock}</b></td><td>${btn('Điều chỉnh',`openModal('material','${m.id}')`,'small')}</td></tr>`).join('')}</tbody></table></div></div><div class="section-title">LỊCH SỬ VẬT TƯ</div><div class="panel">${movementTable(db.stock_movements)}</div>`}
function renderBudgets(){let rows=db.budgets.filter(b=>norm([b.name,companyName(b.companyId),b.projectId].join(' ')).includes(norm(listFilter)));return `${pageHead('Ngân sách & dự trù','Chỉ tính các bản ghi có số tiền thực tế; chứng từ duyệt sẽ cập nhật số đã chi.',btn('＋ Tạo dự trù','openModal(\'budget\')','primary')+btn('In bảng dự trù','printForm(\'budget\')'))}<div class="filters"><input placeholder="Tìm dự trù / dự án…" value="${esc(listFilter)}" oninput="listFilter=this.value;render()"></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>HẠNG MỤC / DỰ TRÙ</th><th>CÔNG TY</th><th>DỰ ÁN</th><th>DỰ TRÙ</th><th>ĐÃ CHI</th><th>CÒN LẠI</th><th>TRẠNG THÁI</th></tr></thead><tbody>${rows.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(companyName(b.companyId))}</td><td>${esc(db.projects.find(p=>p.id===b.projectId)?.name||'—')}</td><td>${fmtMoney(b.amount)}</td><td>${fmtMoney(b.spent||0)}</td><td>${fmtMoney(Number(b.amount)-(Number(b.spent)||0))}</td><td>${status(b.status||'Đang theo dõi')}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có bản ghi ngân sách thực tế.</td></tr>'}</tbody></table></div></div>`}
function renderVouchers(){return `${pageHead('Chứng từ','Trạng thái: Chờ duyệt, Đã duyệt, Đã chi, Từ chối.',btn('＋ Tạo chứng từ','openModal(\'voucher\')','primary'))}<div class="filters"><input placeholder="Tìm chứng từ…" value="${esc(listFilter)}" oninput="listFilter=this.value;render()"><select onchange="window.voucherStatus=this.value;render()"><option value="all">Tất cả trạng thái</option>${['Chờ duyệt','Đã duyệt','Đã chi','Từ chối'].map(s=>`<option ${window.voucherStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>SỐ PHIẾU</th><th>TÊN CHỨNG TỪ</th><th>DỰ ÁN</th><th>HẠNG MỤC DỰ TRÙ</th><th>SỐ TIỀN</th><th>TRẠNG THÁI</th><th>NGƯỜI TẠO</th><th>THAO TÁC</th></tr></thead><tbody>${db.vouchers.filter(v=>norm([v.name,v.id].join(' ')).includes(norm(listFilter))&&(!window.voucherStatus||window.voucherStatus==='all'||v.status===window.voucherStatus)).map(v=>`<tr><td>${esc(v.number||v.id)}</td><td>${esc(v.name)}</td><td>${esc(db.projects.find(p=>p.id===v.projectId)?.name||'—')}</td><td>${esc(db.budget_items.find(b=>b.id===v.budgetItemId)?.name||'—')}</td><td>${fmtMoney(v.amount)}</td><td>${status(v.status)}</td><td>${esc(v.createdBy||'—')}</td><td>${v.status==='Chờ duyệt'?btn('Duyệt',`approveVoucher('${v.id}')`,'small primary')+' '+btn('Từ chối',`rejectVoucher('${v.id}')`,'small'):btn('In',`printForm('voucher','${v.id}')`,'small')}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có chứng từ.</td></tr>'}</tbody></table></div></div>`}
function renderPayments(){return `${pageHead('Thanh toán','Theo dõi các khoản thanh toán gắn chứng từ và dự án.',btn('＋ Ghi nhận thanh toán','openModal(\'payment\')','primary'))}<div class="panel"><div class="table-wrap"><table><thead><tr><th>NGÀY</th><th>NỘI DUNG</th><th>CHỨNG TỪ</th><th>SỐ TIỀN</th><th>TRẠNG THÁI</th></tr></thead><tbody>${db.payments.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(p.name)}</td><td>${esc(db.vouchers.find(v=>v.id===p.voucherId)?.number||'—')}</td><td>${fmtMoney(p.amount)}</td><td>${status(p.status||'Đã ghi nhận')}</td></tr>`).join('')||'<tr><td colspan="5">Chưa có khoản thanh toán.</td></tr>'}</tbody></table></div></div>`}

function renderAttendance(){return `${pageHead('Chấm công','Tổng quan theo ngày và đơn vị. Quy định Nguyễn Mộc: 07:30–17:00; tăng ca 1,5 và 2,0.',btn('Ghi nhận vào/ra ca','punchClock()','primary')+btn('Xuất CSV','exportCSV(\'attendance_records\')'))}<div class="grid kpis"><div class="kpi"><div class="kpi-top">BẢN GHI HÔM NAY</div><div class="kpi-num">${db.attendance_records.filter(a=>a.date===today()).length}</div></div><div class="kpi"><div class="kpi-top">ĐÃ VÀO CA</div><div class="kpi-num">${db.attendance_records.filter(a=>a.date===today()&&a.checkIn).length}</div></div><div class="kpi"><div class="kpi-top">ĐÃ RA CA</div><div class="kpi-num">${db.attendance_records.filter(a=>a.date===today()&&a.checkOut).length}</div></div><div class="kpi"><div class="kpi-top">TĂNG CA</div><div class="kpi-num">${db.attendance_records.filter(a=>a.overtime).length}</div></div></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>NHÂN SỰ</th><th>NGÀY</th><th>VÀO CA</th><th>RA CA</th><th>TĂNG CA</th><th>GHI CHÚ</th></tr></thead><tbody>${db.attendance_records.slice().reverse().map(a=>`<tr><td>${esc(a.employeeName||a.employeeId)}</td><td>${fmtDate(a.date)}</td><td>${esc(a.checkIn||'—')}</td><td>${esc(a.checkOut||'—')}</td><td>${esc(a.overtime||'—')}</td><td>${esc(a.note||'—')}</td></tr>`).join('')||'<tr><td colspan="6">Chưa có bản ghi chấm công.</td></tr>'}</tbody></table></div></div>`}
function renderDailyPlans(){return `${pageHead('Kế hoạch công việc ngày','Theo ngày, tổ, dự án và người phụ trách.',btn('＋ Tạo kế hoạch','openModal(\'daily\')','primary'))}<div class="panel"><div class="table-wrap"><table><thead><tr><th>NGÀY</th><th>CÔNG VIỆC</th><th>TỔ / CÔNG TY</th><th>DỰ ÁN</th><th>NGƯỜI PHỤ TRÁCH</th><th>TRẠNG THÁI</th></tr></thead><tbody>${db.daily_plans.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(p.name)}</td><td>${esc(p.team||'—')}</td><td>${esc(db.projects.find(x=>x.id===p.projectId)?.name||'—')}</td><td>${esc(p.owner||'—')}</td><td>${status(p.status||'Chưa bắt đầu')}</td></tr>`).join('')||'<tr><td colspan="6">Chưa có kế hoạch ngày.</td></tr>'}</tbody></table></div></div>`}

function renderNotifications(){let notices=[...db.notifications];let birthdays=db.employees.filter(e=>e.birthDate&&e.birthDate.slice(5)===today().slice(5));return `${pageHead('Thông báo nội bộ','Thông báo vận hành và sinh nhật được tính từ dữ liệu nhân sự đã import.',btn('＋ Tạo thông báo','openModal(\'notification\')','primary'))}<div class="panel"><div class="panel-head"><h3>SINH NHẬT HÔM NAY</h3><span class="tag">${birthdays.length}</span></div>${birthdays.map(e=>`<p>${esc(e.name)} · ${esc(companyName(e.companyId))}</p>`).join('')||'<div class="empty">Chưa có dữ liệu sinh nhật phù hợp.</div>'}</div><div class="panel" style="margin-top:14px"><div class="panel-head"><h3>THÔNG BÁO</h3><span class="tag">${notices.length}</span></div>${notices.slice().reverse().map(n=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(n.title)}</b><p style="color:#777;margin:6px 0">${esc(n.body||'')}</p><small style="color:#999">${fmtDate(n.date||today())} · ${esc(n.author||'—')}</small></div>`).join('')||'<div class="empty">Chưa có thông báo nội bộ.</div>'}</div>`}

function renderAudit(){return `${pageHead('Lịch sử hệ thống','Audit log ghi thao tác tạo, sửa, xóa, duyệt, nhập kho, xuất kho.',btn('Xuất CSV','exportCSV(\'audit_log\')'))}<div class="filters"><input placeholder="Lọc người thao tác, hành động, đối tượng…" value="${esc(listFilter)}" oninput="listFilter=this.value;render()"></div><div class="panel">${auditTable(db.audit_log.filter(a=>norm([a.user,a.action,a.entity,a.detail].join(' ')).includes(norm(listFilter))))}</div>`}
function renderSettings(){return `${pageHead('Cài đặt hệ thống','Cấu hình dùng chung toàn hệ thống.',btn('Lưu cài đặt','saveSettings()','primary'))}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="panel"><h3>QUY ĐỊNH CHẤM CÔNG</h3><div class="field"><label>Ngày lễ mặc định</label><input id="setting-holidays" type="number" value="${db.settings.holidays}"></div><div class="field"><label>Hệ số tăng ca 1</label><input id="setting-ot15" type="number" step="0.1" value="${db.settings.overtime15}"></div><div class="field"><label>Hệ số tăng ca 2</label><input id="setting-ot20" type="number" step="0.1" value="${db.settings.overtime20}"></div><div class="field"><label>Hạn mức duyệt (VND)</label><input id="setting-limit" type="number" placeholder="Chưa thiết lập" value="${db.settings.approvalLimit??''}"></div></div><div class="panel"><h3>DỮ LIỆU & SAO LƯU</h3><p style="color:#777">Lưu tại trình duyệt hiện tại bằng localStorage. Không đồng bộ giữa thiết bị.</p><div class="actions" style="margin-top:12px">${btn('Xuất JSON','exportData()','primary')}${btn('Nhập JSON','document.getElementById(\'import-file\').click()')}<input type="file" id="import-file" class="hidden" accept="application/json,.json" onchange="importData(this.files[0])">${btn('Nạp lại dữ liệu gốc','resetData()','danger')}</div><p style="font-size:11px;color:#999;margin-top:14px">Dữ liệu được lưu trong trình duyệt của thiết bị này.</p></div><div class="panel"><h3>PHÁP NHÂN</h3><p>${db.legal_entities.length} bản ghi pháp nhân. Cấu trúc pháp nhân tách khỏi công ty thành viên.</p>${btn('＋ Thêm pháp nhân','openModal(\'legal\')')}</div><div class="panel"><h3>TÀI KHOẢN / VAI TRÒ</h3>${USERS.map(u=>`<p style="border-bottom:1px solid var(--line);padding-bottom:8px">${esc(u.name)} <span style="float:right">${status(u.role)}</span></p>`).join('')}</div></div>`}
function renderWorker(){let mine=db.attendance_records.filter(a=>(a.employeeName||a.employeeId)===currentUser.name);return `${pageHead('Chấm công nhân sự','Giao diện tối giản cho vai trò Thợ.', '')}<div class="detail-hero" style="margin-bottom:18px"><div class="avatar" style="width:54px;height:54px">${initials(currentUser.name)}</div><div><h2>${esc(currentUser.name)}</h2><div class="sub">${esc(companyName(currentUser.companyId))} · Vai trò Thợ</div></div></div><div class="worker-actions"><button class="worker-action" onclick="punchClock('in')"><span class="big">↘</span>VÀO CA</button><button class="worker-action" onclick="punchClock('out')"><span class="big">↗</span>RA CA</button><button class="worker-action" onclick="openModal('leave')"><span class="big">▤</span>XIN NGHỈ PHÉP</button><button class="worker-action" onclick="go('attendance')"><span class="big">◷</span>XEM CÔNG</button></div><div class="section-title">CHẤM CÔNG GẦN ĐÂY</div><div class="panel">${mine.length?`<div class="table-wrap"><table><thead><tr><th>NGÀY</th><th>VÀO CA</th><th>RA CA</th><th>GHI CHÚ</th></tr></thead><tbody>${mine.slice().reverse().map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${esc(a.checkIn||'—')}</td><td>${esc(a.checkOut||'—')}</td><td>${esc(a.note||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có bản ghi chấm công.</div>'}</div>`}
function renderSearch(){let q=norm(globalQuery);if(!q)return `${pageHead('Tìm kiếm toàn Group','Tìm theo tên không dấu trên các danh mục đã nạp.','')}<div class="empty">Nhập từ khóa ở ô tìm kiếm phía trên.</div>`;let groups=[['Công ty',db.operating_units.filter(x=>norm([x.name,x.leader,x.group].join(' ')).includes(q)).map(x=>({name:x.name,sub:x.group,action:`openCompany('${x.id}')`}))],['Dự án',db.projects.filter(x=>norm([x.name,x.owner,companyName(x.companyId)].join(' ')).includes(q)).map(x=>({name:x.name,sub:companyName(x.companyId),action:`openProject('${x.id}')`}))],['Nhân sự',db.employees.filter(x=>norm([x.name,x.position,x.email].join(' ')).includes(q)).map(x=>({name:x.name,sub:companyName(x.companyId),action:`openEmployee('${x.id}')`}))],['Khách hàng',db.clients.filter(x=>norm([x.name,companyName(x.companyId)].join(' ')).includes(q)).map(x=>({name:x.name,sub:companyName(x.companyId),action:`go('clients')`}))],['Cuộc họp',(db.meetings||[]).filter(x=>norm([x.title,x.location].join(' ')).includes(q)).map(x=>({name:x.title,sub:fmtDate(x.date),action:`openMeeting('${x.id}')`}))],['Nghị quyết',(db.resolutions||[]).filter(x=>norm([x.code,x.title,x.content].join(' ')).includes(q)).map(x=>({name:x.code+' — '+x.title,sub:x.status,action:`go('meetings')`}))],['Hợp đồng',(db.contracts||[]).filter(x=>norm([x.code,x.partner].join(' ')).includes(q)).map(x=>({name:x.code+' — '+x.partner,sub:companyName(x.companyId),action:`go('contracts')`}))]];return `${pageHead('Kết quả tìm kiếm',`Từ khóa: “${esc(globalQuery)}”`,'')}${groups.map(([g,items])=>`<div class="section-title">${g}<span>${items.length} kết quả</span></div><div class="panel">${items.map(x=>`<div style="padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px"><div><b>${esc(x.name)}</b><div class="sub" style="margin-top:4px">${esc(x.sub)}</div></div>${btn('Mở',x.action,'small')}</div>`).join('')||'<div class="empty">Không có kết quả.</div>'}</div>`).join('')}`}
function openCreateMenu(){showModal('Tạo mới',`<div class="grid" style="grid-template-columns:repeat(2,1fr)">${[['project','Dự án'],['task','Công việc'],['employee','Nhân sự'],['client','Khách hàng'],['voucher','Chứng từ'],['leave','Đơn nghỉ phép'],['daily','Kế hoạch ngày'],['movement','Nhập / xuất kho']].map(([t,n])=>`<button class="worker-action" onclick="closeModal();openModal('${t}')">${n}</button>`).join('')}</div>`)}
function openModal(type,id=null,extra=null){let item=null;const map={company:'operating_units',project:'projects',employee:'employees',client:'clients',supplier:'suppliers',material:'materials'};if(map[type]&&id)item=db[map[type]].find(x=>x.id===id);modalState={type,id,extra,item};let title=({company:'Công ty thành viên',project:'Dự án',task:'Công việc',employee:'Nhân sự',client:'Khách hàng',supplier:'Nhà cung cấp',material:'Vật tư',movement:'Phiếu nhập / xuất kho',budget:'Dự trù ngân sách',voucher:'Chứng từ',payment:'Thanh toán',leave:'Đơn xin nghỉ phép',daily:'Kế hoạch công việc ngày',notification:'Thông báo',legal:'Pháp nhân'})[type]||'Tạo bản ghi';let fields='';const f=(name,label,kind='text',value='',opts=null,required=false,span=false)=>`<div class="field ${span?'span2':''}"><label>${label}${required?' *':''}</label>${kind==='select'?`<select name="${name}" ${required?'required':''}>${(opts||[]).map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:kind==='textarea'?`<textarea name="${name}" ${required?'required':''}>${esc(value)}</textarea>`:`<input name="${name}" type="${kind}" value="${esc(value)}" ${required?'required':''} ${kind==='number'?'step="any"':''}>`}</div>`;const companyOpts=db.operating_units.map(c=>({value:c.id,label:c.name}));const projectOpts=db.projects.map(p=>({value:p.id,label:p.name}));const employeeOpts=[{value:currentUser.name,label:currentUser.name},...db.employees.map(e=>({value:e.name,label:e.name}))];const warehouseOpts=db.warehouses.map(w=>({value:w.id,label:w.name}));const materialOpts=db.materials.map(m=>({value:m.id,label:m.name+' (tồn '+m.stock+')'}));const voucherOpts=db.vouchers.map(v=>({value:v.id,label:v.number||v.name}));const statusOpts=['Chờ duyệt','Đã duyệt','Đã chi','Từ chối'].map(x=>({value:x,label:x}));
switch(type){case'company':fields=f('name','Tên đơn vị','text',item?.name||'',null,true)+f('group','Group','select',item?.group||'WePlus Group',['WePlus Group','WeWall Group'].map(x=>({value:x,label:x})),true)+f('leader','Người phụ trách','text',item?.leader||'',null,true)+f('legal','Pháp nhân','text',item?.legal||'')+f('industry','Ngành nghề','text',item?.industry||'')+f('count','Số nhân sự','number',item?.count??'')+f('color','Màu nhận diện','text',item?.color||'#D3B45C')+f('short','Monogram','text',item?.short||'',null,true);break;
case'project':fields=f('name','Tên dự án','text',item?.name||'',null,true)+f('companyId','Đơn vị','select',item?.companyId||extra||db.operating_units[0]?.id,companyOpts,true)+f('owner','Người phụ trách chính','text',item?.owner||'',null,true)+f('status','Trạng thái','select',item?.status||'Đang chuẩn bị',['Đang chuẩn bị','Đang thực hiện','Đã hoàn thành','Trễ hạn','Tạm dừng'].map(x=>({value:x,label:x})),true)+f('start','Ngày bắt đầu','date',item?.start||'')+f('end','Ngày kết thúc','date',item?.end||'')+f('progress','Tiến độ (%)','number',item?.progress??'')+f('budget','Ngân sách (VND)','number',item?.budget??'')+f('note','Ghi chú','textarea',item?.note||'',null,false,true);break;
case'task':fields=f('name','Tên công việc','text','',null,true)+f('projectId','Dự án','select',extra||db.projects[0]?.id,projectOpts,true)+f('owner','Người phụ trách','text',currentUser.name,null,true)+f('due','Hạn hoàn thành','date',today())+f('status','Trạng thái','select','Chưa bắt đầu',['Chưa bắt đầu','Đang thực hiện','Hoàn thành'].map(x=>({value:x,label:x})))+f('note','Ghi chú','textarea','',null,false,true);break;
case'employee':fields=f('name','Họ và tên','text',item?.name||'',null,true)+f('companyId','Đơn vị','select',item?.companyId||db.operating_units[0]?.id,companyOpts,true)+f('position','Chức vụ','text',item?.position||'')+f('phone','Số điện thoại','tel',item?.phone||'')+f('email','Email','email',item?.email||'')+f('birthDate','Ngày sinh','date',item?.birthDate||'')+f('startDate','Ngày vào làm','date',item?.startDate||'');break;
case'client':fields=f('name','Tên khách hàng / đối tác','text',item?.name||'',null,true)+f('companyId','Đơn vị phụ trách','select',item?.companyId||db.operating_units[0]?.id,companyOpts,true)+f('industry','Ngành','text',item?.industry||'')+f('contact','Người liên hệ','text',item?.contact||'')+f('history','Lịch sử làm việc','textarea',item?.history||'',null,false,true);break;
case'supplier':fields=f('name','Tên nhà cung cấp','text','',null,true)+f('category','Nhóm hàng / dịch vụ','text','')+f('contact','Người liên hệ','text','')+f('phone','Điện thoại','tel','')+f('email','Email','email','')+f('note','Ghi chú','textarea','',null,false,true);break;
case'material':fields=f('name','Tên vật tư','text',item?.name||'',null,true)+f('category','Nhóm vật tư','select',item?.category||'Gỗ',['Gỗ','Sắt và inox','Sơn','Nhôm kính','Vật tư sự kiện'].map(x=>({value:x,label:x})),true)+f('warehouseId','Kho','select',item?.warehouseId||'wh-workshop',warehouseOpts,true)+f('opening','Tồn đầu kỳ','number',item?.opening??0,null,true)+f('stock','Tồn hiện tại','number',item?.stock??0,null,true);break;
case'movement':fields=f('type','Loại giao dịch','select','Nhập',[{value:'Nhập',label:'Nhập kho'},{value:'Xuất',label:'Xuất kho'}],true)+f('materialId','Vật tư','select',db.materials[0]?.id,materialOpts,true)+f('warehouseId','Kho','select',db.materials[0]?.warehouseId||'wh-workshop',warehouseOpts,true)+f('quantity','Số lượng','number','',null,true)+f('projectId','Dự án nhận (nếu xuất)','select','',[{value:'',label:'Không gắn dự án'},...projectOpts])+f('date','Ngày','date',today(),null,true)+f('note','Ghi chú','textarea','',null,false,true);break;
case'budget':fields=f('name','Tên hạng mục dự trù','text','',null,true)+f('companyId','Đơn vị','select',db.operating_units[0]?.id,companyOpts,true)+f('projectId','Dự án','select',extra||'', [{value:'',label:'Không gắn dự án'},...projectOpts])+f('amount','Số tiền dự trù (VND)','number','',null,true)+f('status','Trạng thái','select','Đang theo dõi',[{value:'Đang theo dõi',label:'Đang theo dõi'},{value:'Đã duyệt',label:'Đã duyệt'}]);break;
case'voucher':fields=f('name','Tên chứng từ','text','',null,true)+f('kind','Loại biểu mẫu','select','expense',FORMS.map(([value,label])=>({value,label})),true)+f('companyId','Đơn vị','select',db.operating_units[0]?.id,companyOpts,true)+f('projectId','Dự án','select',extra||'', [{value:'',label:'Không gắn dự án'},...projectOpts])+f('budgetItemId','Hạng mục dự trù','select','',[{value:'',label:'Không gắn hạng mục'},...db.budget_items.map(b=>({value:b.id,label:b.name}))])+f('amount','Số tiền (VND)','number','',null,true)+f('note','Diễn giải','textarea','',null,false,true);break;
case'payment':fields=f('name','Nội dung thanh toán','text','',null,true)+f('voucherId','Chứng từ','select',db.vouchers[0]?.id||'',voucherOpts,true)+f('amount','Số tiền (VND)','number','',null,true)+f('date','Ngày thanh toán','date',today(),null,true)+f('status','Trạng thái','select','Đã ghi nhận',[{value:'Đã ghi nhận',label:'Đã ghi nhận'},{value:'Chờ thanh toán',label:'Chờ thanh toán'}]);break;
case'leave':fields=f('employeeName','Nhân sự','text',currentUser.name,null,true)+f('type','Loại nghỉ','select','Phép năm',['Phép năm','Nghỉ không lương','Nghỉ ốm','Khác'].map(x=>({value:x,label:x})))+f('start','Từ ngày','date',today(),null,true)+f('end','Đến ngày','date',today(),null,true)+f('reason','Lý do','textarea','',null,true,true);break;
case'daily':fields=f('name','Công việc','text','',null,true)+f('date','Ngày','date',today(),null,true)+f('team','Tổ / đơn vị','text','')+f('projectId','Dự án','select','',[{value:'',label:'Không gắn dự án'},...projectOpts])+f('owner','Người phụ trách','text',currentUser.name,null,true)+f('status','Trạng thái','select','Chưa bắt đầu',['Chưa bắt đầu','Đang thực hiện','Hoàn thành'].map(x=>({value:x,label:x})))+f('note','Ghi chú','textarea','',null,false,true);break;
case'notification':fields=f('title','Tiêu đề','text','',null,true)+f('body','Nội dung','textarea','',null,true,true)+f('date','Ngày','date',today());break;
case'legal':fields=f('name','Tên pháp nhân','text','',null,true)+f('taxCode','Mã số thuế','text','')+f('address','Địa chỉ','text',CONFIG.ORG.hq)+f('phone','Điện thoại','tel','')+f('email','Email','email','');break;
}
showModal(title,`<form id="record-form" onsubmit="event.preventDefault();saveRecord()"><div class="form-grid">${fields}</div><input type="hidden" name="__type" value="${type}"><input type="hidden" name="__id" value="${id||''}"><input type="hidden" name="__extra" value="${extra||''}"></form>`,true)}
function showModal(title,body,withForm=false){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="btn small" onclick="closeModal()">Đóng ×</button></div><div class="modal-body">${body}</div>${withForm?'<div class="modal-foot"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="document.getElementById(\'record-form\').requestSubmit()">Lưu bản ghi</button></div>':''}</div></div>`}function closeModal(){document.getElementById('modal-root').innerHTML='';modalState=null}
function saveRecord(){let form=document.getElementById('record-form');if(!form.reportValidity())return;let fd=new FormData(form),x=Object.fromEntries(fd.entries()),type=x.__type,id=x.__id,extra=x.__extra;delete x.__type;delete x.__id;delete x.__extra;for(let k of ['count','progress','budget','amount','opening','stock','quantity'])if(x[k]!==undefined&&x[k]!=='')x[k]=Number(x[k]);else if(x[k]==='')x[k]=null;if(x.start&&x.end&&x.end<x.start){toast('Ngày kết thúc không được trước ngày bắt đầu.');return}if(type==='project'&&(!(Number(x.budget)>0))){toast('Ngân sách dự án phải lớn hơn 0.');return}if(type==='project'&&x.progress!=null&&(x.progress<0||x.progress>100)){toast('Tiến độ phải từ 0 đến 100%.');return}if(type==='project'&&x.budget==null){toast('Ngân sách dự án phải lớn hơn 0.');return}
let coll=({company:'operating_units',project:'projects',employee:'employees',client:'clients',supplier:'suppliers',material:'materials',task:'tasks',budget:'budgets',voucher:'vouchers',payment:'payments',leave:'leave_requests',daily:'daily_plans',notification:'notifications',legal:'legal_entities'})[type];if(type==='movement'){let m=db.materials.find(a=>a.id===x.materialId);if(!m){toast('Không tìm thấy vật tư.');return}if(x.type==='Xuất'&&Number(x.quantity)>m.stock){toast(`Không thể xuất ${x.quantity}; tồn hiện tại chỉ ${m.stock}.`);return}if(!(Number(x.quantity)>0)){toast('Số lượng phải lớn hơn 0.');return}m.stock+=x.type==='Nhập'?Number(x.quantity):-Number(x.quantity);let rec={id:uid('move'),...x,quantity:Number(x.quantity),user:currentUser.name};db.stock_movements.push(rec);audit(x.type==='Nhập'?'Nhập kho':'Xuất kho','stock_movements',rec.id,`${m.name}: ${x.quantity}; tồn mới ${m.stock}`);closeModal();render();toast('Đã ghi nhận giao dịch kho.');return}
if(type==='voucher'){x.id=id||uid('vch');x.number='CT-'+String(db.vouchers.length+1).padStart(4,'0');x.status='Chờ duyệt';x.createdBy=currentUser.name;x.createdAt=today();}if(type==='leave'){if(x.end<x.start){toast('Ngày kết thúc không được trước ngày bắt đầu.');return}x.id=id||uid('leave');x.employeeId=x.employeeName;x.status='Chờ duyệt';x.createdAt=today()}if(type==='daily')x.id=id||uid('daily');if(type==='notification'){x.id=id||uid('notice');x.author=currentUser.name}if(type==='task'){x.id=id||uid('task');x.projectId=x.projectId||extra}if(type==='payment')x.id=id||uid('payment');if(type==='budget'){x.id=id||uid('budget');x.spent=0}if(type==='legal')x.id=id||uid('legal');if(type==='company'){x.id=id||uid('unit');x.count=x.count==null?null:x.count;x.clients=[];x.shared=false}if(type==='project'){x.id=id||uid('project');x.progress=x.progress==null?null:x.progress;x.budget=Number(x.budget);x.note=x.note||'';if(!x.name.trim()){toast('Tên dự án là bắt buộc.');return}}if(type==='employee')x.id=id||uid('emp');if(type==='client'){x.id=id||uid('client');x.source='Người dùng nhập'}if(type==='supplier')x.id=id||uid('supplier');if(type==='material'){x.id=id||uid('mat');x.illustrative=false}
if(!coll){toast('Không xác định được loại bản ghi.');return}let existing=id?db[coll].findIndex(z=>z.id===id):-1;if(existing>=0){db[coll][existing]={...db[coll][existing],...x};audit('Sửa',coll,id,`Cập nhật ${x.name||x.title||x.employeeName||id}`)}else{db[coll].push(x);audit('Tạo',coll,x.id,`Tạo ${x.name||x.title||x.employeeName||type}`)}if(type==='project'&&x.companyId){let c=db.operating_units.find(c=>c.id===x.companyId);if(c)c.projectCount=db.projects.filter(p=>p.companyId===c.id).length}closeModal();render();toast('Đã lưu bản ghi.')}
function approveVoucher(id){let v=db.vouchers.find(x=>x.id===id);if(!v||v.status!=='Chờ duyệt')return;if(!(Number(v.amount)>0)){toast('Số tiền chứng từ phải lớn hơn 0.');return}v.status='Đã duyệt';v.approvedBy=currentUser.name;v.approvedAt=new Date().toISOString();if(v.budgetItemId){let b=db.budget_items.find(x=>x.id===v.budgetItemId);if(b)b.spent=(b.spent||0)+Number(v.amount)}if(v.projectId){let p=db.projects.find(x=>x.id===v.projectId);if(p){p.spent=(p.spent||0)+Number(v.amount);let b=db.budgets.find(x=>x.projectId===p.id);if(b)b.spent=(b.spent||0)+Number(v.amount)}}audit('Duyệt','vouchers',id,`Đã duyệt ${v.number} số tiền ${fmtMoney(v.amount)}; cập nhật đã chi theo dự án / hạng mục nếu có liên kết`);render();toast('Đã duyệt chứng từ và cập nhật số đã chi nếu có liên kết ngân sách.')}
function rejectVoucher(id){let v=db.vouchers.find(x=>x.id===id);if(!v)return;v.status='Từ chối';audit('Từ chối','vouchers',id,v.number);render();toast('Đã từ chối chứng từ.')}
function decideLeave(id,statusValue){let l=db.leave_requests.find(x=>x.id===id);if(!l)return;l.status=statusValue;audit(statusValue==='Đã duyệt'?'Duyệt đơn nghỉ phép':'Từ chối đơn nghỉ phép','leave_requests',id,`${l.employeeName}: ${fmtDate(l.start)} – ${fmtDate(l.end)}`);render();toast('Đã cập nhật trạng thái đơn nghỉ phép.')}
function punchClock(mode){let date=today(),name=currentUser.name,rec=db.attendance_records.find(a=>a.date===date&&(a.employeeName||a.employeeId)===name);if(!rec){rec={id:uid('att'),date,employeeId:name,employeeName:name,companyId:currentUser.companyId};db.attendance_records.push(rec)}let time=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',hour12:false});if(mode==='out'||(!mode&&rec.checkIn&&!rec.checkOut)){rec.checkOut=time;audit('Ra ca','attendance_records',rec.id,`${name} ra ca lúc ${time}`);toast('Đã ghi nhận ra ca lúc '+time)}else{if(rec.checkIn){toast('Đã có giờ vào ca hôm nay.');return}rec.checkIn=time;audit('Vào ca','attendance_records',rec.id,`${name} vào ca lúc ${time}`);toast('Đã ghi nhận vào ca lúc '+time)}render()}
function saveSettings(){db.settings.holidays=Number(document.getElementById('setting-holidays').value)||11;db.settings.overtime15=Number(document.getElementById('setting-ot15').value)||1.5;db.settings.overtime20=Number(document.getElementById('setting-ot20').value)||2;let lim=document.getElementById('setting-limit').value;db.settings.approvalLimit=lim===''?null:Number(lim);audit('Cập nhật','settings','settings','Cập nhật cài đặt');render();toast('Đã lưu cài đặt.')}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});downloadBlob(blob,'tgroup-os-data-'+today()+'.json');audit('Xuất dữ liệu','settings','export','Xuất toàn bộ dữ liệu JSON');toast('Đã tạo bản xuất JSON.')}
function exportCSV(key){let rows=db[key]||[];if(!rows.length){toast('Danh mục chưa có dữ liệu để xuất.');return}let cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];let csv='\ufeff'+[cols.join(','),...rows.map(r=>cols.map(c=>'"'+String(typeof r[c]==='object'?JSON.stringify(r[c]):r[c]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`tgroup-${key}-${today()}.csv`);audit('Xuất CSV',key,key,`Xuất ${rows.length} bản ghi`)}function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(file){if(!file)return;const reader=new FileReader();reader.onload=async()=>{try{let incoming=JSON.parse(reader.result);if(!incoming||typeof incoming!=='object'||!Array.isArray(incoming.operating_units))throw Error('Sai cấu trúc');if(!await appConfirm({title:'Nhập dữ liệu?',msg:'Dữ liệu nhập vào sẽ thay thế dữ liệu hiện tại trong trình duyệt.',ok:'Nhập dữ liệu',danger:true}))return;db={...clone(SEED),...incoming,settings:{...SEED.settings,...incoming.settings}};saveDB();audit('Nhập dữ liệu','settings','import',file.name);render();toast('Đã nhập dữ liệu JSON.')}catch(e){toast('Không thể nhập: file JSON sai cấu trúc.')}};reader.readAsText(file)}async function resetData(){if(!await appConfirm({title:'Nạp lại dữ liệu gốc?',msg:'Thao tác sẽ xóa các bản ghi đã tạo trong trình duyệt và khôi phục dữ liệu gốc ban đầu.',ok:'Nạp lại',danger:true}))return;db=clone(SEED);saveDB();audit('Nạp lại dữ liệu gốc','settings','reset','Reset dữ liệu seed');render();toast('Đã nạp lại dữ liệu gốc.')}
function printForm(type,id=null){let rec=id?db.vouchers.find(v=>v.id===id):null;let title=(FORMS.find(x=>x[0]===type)||['','Biểu mẫu'])[1];let legal=db.legal_entities[0]?.name||'Tgroup Ecosystem';let number=rec?.number||'Số: —';let project=db.projects.find(p=>p.id===rec?.projectId);let rows=[];if(type==='budget')rows=db.budgets.map((b,i)=>[i+1,b.name,db.projects.find(p=>p.id===b.projectId)?.name||'',fmtMoney(b.amount),fmtMoney(b.spent||0)]);else if(type==='voucher'||rec)rows=[[1,rec?.name||title,project?.name||'',rec?.note||'',fmtMoney(rec?.amount)]];else if(type==='attendance')rows=db.attendance_records.filter(a=>a.date.slice(0,7)===today().slice(0,7)).map((a,i)=>[i+1,a.employeeName,fmtDate(a.date),a.checkIn||'',a.checkOut||'']);else if(type==='leave')rows=[['1',currentUser.name,'—','—','—']];else if(type==='daily')rows=db.daily_plans.filter(p=>p.date===today()).map((p,i)=>[i+1,p.name,p.team||'',p.owner||'',p.status||'']);else if(type==='stockin'||type==='stockout')rows=db.stock_movements.filter(m=>m.type===(type==='stockin'?'Nhập':'Xuất')).map((m,i)=>[i+1,db.materials.find(x=>x.id===m.materialId)?.name||'',m.quantity,fmtDate(m.date),m.note||'']);else rows=[['1','—','','','']];let headers=type==='budget'?['STT','Hạng mục','Dự án','Dự trù','Đã chi']:type==='attendance'?['STT','Nhân sự','Ngày','Vào ca','Ra ca']:type==='leave'?['STT','Nhân sự','Từ ngày','Đến ngày','Lý do']:type==='daily'?['STT','Công việc','Tổ / đơn vị','Người phụ trách','Trạng thái']:['STT','Nội dung','Chi tiết','Ghi chú','Số tiền / số lượng'];let html=`<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;color:#111;margin:24mm 15mm;font-size:13px}.head{text-align:center;border-bottom:2px solid #222;padding-bottom:12px}.head h2{font-size:18px;margin:12px 0}.meta{display:flex;justify-content:space-between;margin:15px 0}.context{margin:20px 0;line-height:2}table{width:100%;border-collapse:collapse}th,td{border:1px solid #777;padding:8px;text-align:left}th{text-align:center;background:#eee}.sign{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center;margin-top:55px}.sign div{font-weight:bold}.sign small{display:block;margin-top:65px;font-weight:normal}@media print{body{margin:12mm}}</style></head><body><div class="head"><b>${esc(legal)}</b><div>${esc(CONFIG.ORG.hq)}</div><div>Điện thoại: —</div><h2>${esc(title.toUpperCase())}</h2></div><div class="meta"><span>${esc(number)}</span><span>Ngày: ${fmtDate(today())}</span></div><div class="context">Đơn vị: ${esc(rec?companyName(rec.companyId):'—')}<br>Dự án: ${esc(project?.name||'—')}<br>Người lập: ${esc(rec?.createdBy||currentUser.name)}</div><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${headers.length}" style="height:100px"></td></tr>`}</tbody></table><p>Ghi chú: ${esc(rec?.note||'—')}</p><div class="sign"><div>Người lập<small>(Ký, ghi rõ họ tên)</small></div><div>Trưởng bộ phận<small>(Ký, ghi rõ họ tên)</small></div><div>Kế toán<small>(Ký, ghi rõ họ tên)</small></div><div>Giám đốc<small>(Ký, ghi rõ họ tên)</small></div></div><script>window.onload=()=>window.print()<\/script></body></html>`;let w=window.open('','_blank');if(!w){toast('Trình duyệt chặn cửa sổ in. Cho phép pop-up để in biểu mẫu.');return}w.document.open();w.document.write(html);w.document.close();audit('Mở in biểu mẫu','forms',id||type,title)}

function showSysFake(i){_sfPending=i;let pool=["<span class='c'>// tgroup-os core - restricted module, do not distribute</span>","<span class='k'>const</span> db = loadStore(<span class='t'>'tgroup_os'</span>);","<span class='k'>function</span> render(){ root.innerHTML = shell(); }","<span class='k'>if</span>(!allowed(currentPage)) <span class='k'>return</span> landingPage();","session.verify(token) -&gt; <span class='r'>0x2F HELD</span>","{\"module\":\"payroll\",\"guard\":\"restricted\",\"level\":5}","<span class='c'>// [kernel] role=DEVELOPER requires elevated grant</span>","audit(<span class='t'>'ACCESS'</span>, role, checksum(db));","<span class='k'>await</span> enclave.unlock(key) <span class='c'>// key: NOT PRESENT</span>","grant matrix: [dev:*, chair:ro, hr:scope=people]","<span class='k'>for</span>(<span class='k'>const</span> u <span class='k'>of</span> units) sync(u.id, {deep:<span class='k'>true</span>});","pipe(cashflow).reduce(aggregate, seed=0x0);","<span class='c'>// integrity check ............ sha256 OK</span>","routes.mount(<span class='t'>'/core'</span>, guard(role &gt;= DEV));","<span class='k'>throw</span> <span class='t'>'ERR_SYS_0x2F: session held by security layer'</span>","watch(attendance).on(<span class='t'>'anomaly'</span>, escalate);","<span class='k'>const</span> LEDGER = Object.freeze(db.vouchers);","migrate(schema v14 -&gt; v15) ... pending approval","<span class='c'>// 122 records / 9 units / checksum matched</span>","rbac.enforce(<span class='t'>'legal_entities'</span>, READONLY);"];let ov=document.createElement('div');ov.id='sysfake';ov.innerHTML='<div class="sf-top"><span><b>TGROUP OS</b> - CORE / RESTRICTED</span><button class="sf-back" onclick="hideSysFake()">EXIT</button></div><div class="sf-code" id="sf-log"></div><div class="sf-status" id="sf-err"><span>ACCESS: DEVELOPER - ENCRYPTED</span><span class="r">ERR_SYS_0x2F - SESSION HELD</span></div>';document.body.appendChild(ov);let log=document.getElementById('sf-log'),k=0;let push=()=>{let d=document.createElement('div');d.innerHTML='<span class="n">'+String(++k).padStart(4,'0')+'</span>'+pool[Math.floor(Math.random()*pool.length)];log.appendChild(d);while(log.children.length>80)log.removeChild(log.firstChild)};for(let n=0;n<26;n++)push();_sfLogTimer=setInterval(push,120);document.getElementById('sf-err').addEventListener('click',()=>{_sfTaps++;clearTimeout(_sfTapTimer);_sfTapTimer=setTimeout(()=>_sfTaps=0,2500);if(_sfTaps>=5){sessionStorage.setItem('tgroup_os_sysok','1');let p=_sfPending;hideSysFake();if(p!=null)doLoginIndex(p)}})}

function animateKPIs(){document.querySelectorAll('[data-count]').forEach(el=>{let target=Number(el.dataset.count)||0;if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=target.toLocaleString('vi-VN');return}let t0=null,dur=900;function step(t){if(t0==null)t0=t;let p=Math.max(0,Math.min(1,(t-t0)/dur)),e=1-Math.pow(1-p,3);el.textContent=Math.round(target*e).toLocaleString('vi-VN');if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)})}

function nextBirthdayIn(e){if(!e.birthDate)return null;let b=new Date(e.birthDate+'T00:00:00');if(isNaN(b))return null;let t=new Date(today()+'T00:00:00'),n=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());return Math.round((n-t)/86400000)}
function attentionItems(){let items=[],T=today();
db.tasks.filter(t=>t.due&&t.due<T&&t.status!=='Hoàn thành').forEach(t=>items.push({tag:'VIỆC QUÁ HẠN',label:t.name,sub:'Phụ trách: '+(t.owner||'—')+' · Hạn '+fmtDate(t.due),action:"go('tasks')"}));
db.projects.filter(p=>p.end&&p.end<T&&p.status!=='Đã hoàn thành').forEach(p=>items.push({tag:'DỰ ÁN TRỄ',label:p.name,sub:companyName(p.companyId)+' · Kết thúc '+fmtDate(p.end),action:`openProject('${p.id}')`}));
let pv=db.vouchers.filter(v=>v.status==='Chờ duyệt');if(pv.length)items.push({tag:'CHỨNG TỪ',label:pv.length+' chứng từ đang chờ duyệt',sub:pv.map(v=>v.number).join(', '),action:"go('vouchers')"});
let pl=db.leave_requests.filter(x=>x.status==='Chờ duyệt');if(pl.length)items.push({tag:'NGHỈ PHÉP',label:pl.length+' đơn nghỉ phép đang chờ duyệt',sub:pl.map(x=>x.employeeName).join(', '),action:"go('leave')"});
db.materials.filter(m=>Number(m.stock)<10).forEach(m=>items.push({tag:'TỒN KHO THẤP',label:m.name,sub:'Tồn hiện tại: '+m.stock+' '+(m.unit||''),action:"go('materials')"}));
db.employees.forEach(e=>{let d=nextBirthdayIn(e);if(d!=null&&d<=7)items.push({tag:'SINH NHẬT',label:'Sinh nhật '+e.name,sub:companyName(e.companyId)+' · '+(d===0?'Hôm nay':'Còn '+d+' ngày'),action:`openEmployee('${e.id}')`})});
(db.meetings||[]).forEach(m=>{let d=daysUntil(m.date);if(d!=null&&d>=0&&d<=7)items.push({tag:'CUỘC HỌP',label:m.title,sub:fmtDate(m.date)+' · '+(m.time||''),action:`openMeeting('${m.id}')`})});
(db.contracts||[]).forEach(c=>{let d=daysUntil(c.endDate);if(d!=null&&d>=0&&d<=30)items.push({tag:'HỢP ĐỒNG',label:c.code+' — '+c.partner,sub:'Hết hạn '+fmtDate(c.endDate)+' (còn '+d+' ngày)',action:"go('contracts')"})});
return items}

const PAY_PERIODS=[{id:'2026-09',label:'09/2026',status:'Đã chi trả'},{id:'2026-10',label:'10/2026',status:'Đã duyệt'}];
const PAY_BASE={engage:14500000,eplus:15500000,enabler:12500000,golfcare:13500000,'nguyenmoc-ads':12000000,thewall:16500000,buctuong:15000000,'nguyenmoc-interior':11500000,greenwall:11000000,shared:18000000};
const PAY_ALLOW={engage:.10,eplus:.10,enabler:.09,golfcare:.10,'nguyenmoc-ads':.09,thewall:.11,buctuong:.10,'nguyenmoc-interior':.08,greenwall:.08,shared:.12};
const PAY_OT={engage:.10,eplus:.06,enabler:.12,golfcare:.09,'nguyenmoc-ads':.10,thewall:.05,buctuong:.05,'nguyenmoc-interior':.18,greenwall:.08,shared:.02};
const PAY_ROLE_BASE={'Developer':30000000,'Chủ tịch':60000000,'Giám đốc công ty':38000000,'HR':22000000,'Kế toán':20000000};
function payHash(str){let h=7;for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0}return h}
function payUnit(cid,period){let base0=PAY_BASE[cid]||12000000;let h=payHash(cid+'|'+period);let base=Math.round(base0*(1+((h%5)-2)*0.004)/1000)*1000;let allow=Math.round(base*(PAY_ALLOW[cid]||.10)/1000)*1000;let ot=Math.round(base*(PAY_OT[cid]||.06)*(0.9+((h>>3)%5)*0.05)/1000)*1000;let ded=Math.round(base*0.105/1000)*1000;return{base,allow,ot,ded,net:base+allow+ot-ded}}
function payrollRows(period){let rows=db.operating_units.map(c=>{let n=db.employees.filter(e=>e.companyId===c.id).length;let u=payUnit(c.id,period);return{cid:c.id,name:c.name,color:c.color,n,base:u.base*n,allow:u.allow*n,ot:u.ot*n,ded:u.ded*n,net:u.net*n}});let sn=db.employees.filter(e=>!e.companyId).length;if(sn){let u=payUnit('shared',period);rows.push({cid:'shared',name:'Khối dùng chung',color:'#666666',n:sn,base:u.base*sn,allow:u.allow*sn,ot:u.ot*sn,ded:u.ded*sn,net:u.net*sn})}return rows}
function payslipFor(user,period){let base0=PAY_ROLE_BASE[user.role]||15000000;let h=payHash(user.name+'|'+period);let base=Math.round(base0*(1+((h%3)-1)*0.003)/1000)*1000;let allow=Math.round(base*0.10/1000)*1000;let otR=user.role==='Giám đốc công ty'?0.08:user.role==='Developer'?0.05:0.03;let ot=Math.round(base*otR/1000)*1000;let ded=Math.round(base*0.105/1000)*1000;return{base,allow,ot,ded,net:base+allow+ot-ded}}
function renderPayroll(){let per=PAY_PERIODS.find(p=>p.id===payrollPeriod)||PAY_PERIODS[PAY_PERIODS.length-1];let rows=payrollRows(per.id);let T=rows.reduce((a,r)=>({n:a.n+r.n,base:a.base+r.base,allow:a.allow+r.allow,ot:a.ot+r.ot,ded:a.ded+r.ded,net:a.net+r.net}),{n:0,base:0,allow:0,ot:0,ded:0,net:0});let maxNet=Math.max(1,...rows.map(r=>r.net));return `${pageHead('Lương & thu nhập','Quỹ lương toàn Group theo kỳ, tổng hợp từ bảng lương của từng đơn vị.',`<div class="filters" style="margin:0">${PAY_PERIODS.map(p=>`<button class="btn ${payrollPeriod===p.id?'primary':''}" onclick="payrollPeriod='${p.id}';render()">Kỳ ${p.label}</button>`).join('')}</div>`)}<div class="grid kpis"><div class="kpi"><div class="kpi-top">TỔNG QUỸ LƯƠNG KỲ ${per.label}</div><div class="kpi-num" style="font-size:27px">${fmtMoney(T.net)}</div><div class="kpi-foot"><span>Tổng thực lãnh toàn Group</span></div></div><div class="kpi"><div class="kpi-top">SỐ NGƯỜI NHẬN LƯƠNG</div><div class="kpi-num" data-count="${T.n}">${T.n}</div><div class="kpi-foot"><span>Nhân sự trong danh bạ toàn Group</span></div></div><div class="kpi"><div class="kpi-top">THỰC LÃNH BÌNH QUÂN</div><div class="kpi-num" style="font-size:27px">${fmtMoney(T.n?Math.round(T.net/T.n):0)}</div><div class="kpi-foot"><span>Bình quân một nhân sự trong kỳ</span></div></div><div class="kpi"><div class="kpi-top">TRẠNG THÁI KỲ LƯƠNG</div><div style="margin:13px 0 8px">${status(per.status)}</div><div class="kpi-foot"><span>Kỳ lương ${per.label} · ${rows.filter(r=>r.n>0).length} đơn vị có nhân sự</span></div></div></div><div class="panel"><div class="panel-head"><div><h3>BẢNG LƯƠNG THEO ĐƠN VỊ — KỲ ${per.label}</h3><p>Khấu trừ bảo hiểm gồm BHXH, BHYT, BHTN theo tỷ lệ quy định trên lương cơ bản</p></div><span class="tag">${T.n} nhân sự</span></div><div class="table-wrap"><table><thead><tr><th>CÔNG TY</th><th class="num">SỐ NV</th><th class="num">LƯƠNG CƠ BẢN</th><th class="num">PHỤ CẤP</th><th class="num">TĂNG CA</th><th class="num">KHẤU TRỪ BẢO HIỂM</th><th class="num">THỰC LÃNH</th><th>TỶ TRỌNG QUỸ LƯƠNG</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="person"><span class="rank-mono" style="background:${r.color}1f;color:${r.color}">${esc(r.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</span><strong>${esc(r.name)}</strong></div></td><td class="num">${r.n}</td><td class="num">${fmtMoney(r.base)}</td><td class="num">${fmtMoney(r.allow)}</td><td class="num">${fmtMoney(r.ot)}</td><td class="num">${fmtMoney(r.ded)}</td><td class="num"><b>${fmtMoney(r.net)}</b></td><td><div class="bar-mini"><i style="width:${Math.round(r.net/maxNet*100)}%"></i></div></td></tr>`).join('')}<tr style="background:#FAF6E9"><td><b>TỔNG TOÀN GROUP</b></td><td class="num"><b>${T.n}</b></td><td class="num"><b>${fmtMoney(T.base)}</b></td><td class="num"><b>${fmtMoney(T.allow)}</b></td><td class="num"><b>${fmtMoney(T.ot)}</b></td><td class="num"><b>${fmtMoney(T.ded)}</b></td><td class="num"><b>${fmtMoney(T.net)}</b></td><td></td></tr></tbody></table></div></div>`}

('Xem hồ sơ nhân sự',`openEmployee('${inDir.id}')`):''}</div><div class="grid me-grid" style="margin-top:15px"><div class="panel"><div class="panel-head"><h3>VIỆC CỦA TÔI</h3><span class="tag">${myTasks.length} việc · ${overT.length} quá hạn</span></div>${myTasks.length?myTasks.map(t=>`<div class="slip-row"><span>${esc(t.name)}<br><small style="color:#999">Hạn ${fmtDate(t.due)}</small></span><span>${status(t.status)}</span></div>`).join(''):`<div class="empty"><strong>Chưa có việc được giao</strong>Danh sách việc của bạn đang trống.</div>`}<div style="margin-top:11px">${btn('Đi tới Công việc',"go('tasks')")}</div></div><div class="panel"><div class="panel-head"><h3>NGHỈ PHÉP CỦA TÔI</h3><span class="tag">Năm 2026</span></div><div style="display:flex;gap:17px;align-items:center"><div class="ring" style="background:conic-gradient(#D3B45C 0 ${pctUsed}%,#EFEDE6 ${pctUsed}% 100%)"><div class="ring-c"><b>${remain}</b><span>ngày còn lại</span></div></div><div style="flex:1"><div class="slip-row"><span>Quỹ phép năm</span><b>${bal.total} ngày</b></div><div class="slip-row"><span>Đã sử dụng</span><b>${bal.used} ngày</b></div><div class="slip-row" style="border:0"><span>Còn lại</span><b>${remain} ngày</b></div></div></div>${myLeave.length?myLeave.map(l=>`<div class="slip-row"><span>${esc(l.type)} · ${fmtDate(l.start)} → ${fmtDate(l.end)}</span><span>${status(l.status)}</span></div>`).join(''):''}<div style="margin-top:11px">${btn('Đi tới Nghỉ phép',"go('leave')")}</div></div><div class="panel"><div class="panel-head"><h3>PHIẾU LƯƠNG CỦA TÔI — KỲ ${per.label}</h3>${status(per.status)}</div><div class="slip-row"><span>Lương cơ bản</span><b>${fmtMoney(slip.base)}</b></div><div class="slip-row"><span>Phụ cấp</span><b>${fmtMoney(slip.allow)}</b></div><div class="slip-row"><span>Tăng ca</span><b>${fmtMoney(slip.ot)}</b></div><div class="slip-row"><span>Khấu trừ bảo hiểm</span><b>− ${fmtMoney(slip.ded)}</b></div><div class="slip-row total"><span>THỰC LÃNH</span><span>${fmtMoney(slip. function renderBirthdays(){let all=db.employees.filter(e=>e.birthDate);let list=bdFiltered();let upcoming=list.map(e=>({e,d:nextBirthdayIn(e)})).filter(x=>x.d>=0&&x.d<=30).sort((a,b)=>a.d-b.d);let depts=[...new Set(db.employees.map(e=>e.dept).filter(Boolean))];let monthNames=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];let filterBar=`<div class="filters"><div class="view-toggle"><button class="${bdView==='calendar'?'active':''}" onclick="bdView='calendar';render()">Lịch</button><button class="${bdView==='list'?'active':''}" onclick="bdView='list';render()">Danh sách</button></div>${bdView==='list'?`<select onchange="bdMonth=this.value;render()"><option value="all">Tất cả các tháng</option>${monthNames.map((m,i)=>`<option value="${i}" ${String(bdMonth)===String(i)?'selected':''}>${m}</option>`).join('')}</select>`:''}<select onchange="bdCompany=this.value;render()"><option value="all">Tất cả công ty</option>${db.operating_units.map(c=>`<option value="${c.id}" ${bdCompany===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}<option value="__shared" ${bdCompany==='__shared'?'selected':''}>Khối dùng chung</option></select><select onchange="bdDept=this.value;render()"><option value="all">Tất cả phòng ban</option>${depts.map(d=>`<option value="${esc(d)}" ${bdDept===d?'selected':''}>${esc(d)}</option>`).join('')}</select><span class="tag">${list.length} người có sinh nhật theo bộ lọc</span></div>`;let upcomingHtml=`<div class="panel" style="margin-bottom:15px"><div class="panel-head"><h3>SẮP TỚI TRONG 30 NGÀY</h3><span class="tag">${upcoming.length} người</span></div>${upcoming.length?`<div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:9px">${upcoming.map(x=>`<div class="attn-item" onclick="openEmployee('${x.e.id}')"><span class="avatar">${initials(x.e.name)}</span><div style="min-width:0"><b>${esc(x.e.name)}</b><div style="color:#8a877d;font-size:12px;margin-top:2px">${esc(companyName(x.e.companyId))} · ${x.e.birthDate.slice(8,10)}/${x.e.birthDate.slice(5,7)} · ${x.d===0?'Hôm nay':'Còn '+x.d+' ngày'}</div></div></div>`).join('')}</div>`:'<div class="empty">Không có sinh nhật nào trong 30 ngày tới theo bộ lọc hiện tại.</div>'}</div>`;let body='';if(bdView==='calendar'){let first=new Date(bdCalY,bdCalM,1);let startOff=(first.getDay()+6)%7;let dim=new Date(bdCalY,bdCalM+1,0).getDate();let prevDim=new Date(bdCalY,bdCalM,0).getDate();let cells=[];for(let i=0;i<startOff;i++)cells.push({d:prevDim-startOff+1+i,dim:true});for(let d=1;d<=dim;d++)cells.push({d,dim:false});while(cells.length%7)cells.push({d:cells.length-dim-startOff+1,dim:true});let t=new Date();let isThisMonth=t.getFullYear()===bdCalY&&t.getMonth()===bdCalM;body=`<div class="panel"><div class="cal-head"><button class="btn small" onclick="bdNavMonth(-1)">‹</button><span class="cal-title">${monthNames[bdCalM]} ${bdCalY}</span><button class="btn small" onclick="bdNavMonth(1)">›</button><button class="btn small" onclick="bdGoToday()">Hôm nay</button><span class="sub">Bấm vào từng người để mở hồ sơ nhân sự 360°</span></div><div class="cal-grid">${['T2','T3','T4','T5','T6','T7','CN'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells.map(c=>{let people=c.dim?[]:list.filter(e=>Number(e.birthDate.slice(5,7))===bdCalM+1&&Number(e.birthDate.slice(8,10))===c.d);return `<div class="cal-cell ${c.dim?'dim':''} ${isThisMonth&&!c.dim&&c.d===t.getDate()?'today':''}"><div class="cal-day">${c.d}</div>${people.slice(0,3).map(x=>`<span class="cal-chip" onclick="openEmployee('${x.id}')"><span class="avatar">${initials(x.name)}</span>${esc(bdShortName(x.name))}</span>`).join('')}${people.length>3?`<div class="cal-more">+${people.length-3} người nữa</div>`:''}</div>`}).join('')}</div></div>`}else{let months={};list.forEach(e=>{let m=Number(e.birthDate.slice(5,7))-1;if(bdMonth!=='all'&&Number(bdMonth)!==m)return;(months[m]=months[m]||[]).push(e)});body=Object.keys(months).sort((a,b)=>a-b wewall:{cls:'wall',name:'Handbook WeWall Group',desc:'Sổ tay vận hành của WeWall Group — khối thiết kế, thi công và sản xuất trong hệ sinh thái Tgroup.',units:'4 đơn vị: The Wall, Bức Tường, Nguyễn Mộc — Khối Nội thất, Green Wall',chapters:[
['Giới thiệu WeWall Group',['WeWall Group phụ trách thiết kế kiến trúc, nội thất, thi công và cảnh quan.','Sổ tay áp dụng cho văn phòng và đội thi công của 4 đơn vị thành viên.','Quy trình chi tiết thực hiện theo hệ thống Quản lý dự án và các quy chế ban hành kèm theo.']],
['Cơ cấu và vai trò dự án',['Giám đốc đơn vị chịu trách nhiệm toàn bộ dự án được giao.','Quản lý dự án điều phối tiến độ, dự trù và nhà thầu; tổ trưởng chịu trách nhiệm tổ thi công.','Mọi thay đổi dự trù phải lập phiên bản mới và được duyệt trước khi thực hiện.']],
['Quy trình dự án chuẩn',['Bước 1: Lập dự trù và định mức theo hạng mục.','Bước 2: Trình duyệt dự trù; dự trù đã duyệt được khóa làm căn cứ đối chiếu.','Bước 3: Đề nghị mua vật tư và chi phí tự đối chiếu với dự trù đã khóa.','Bước 4: Thi công theo kế hoạch ngày; cập nhật tiến độ và nhật ký công trường.','Bước 5: Nghiệm thu, quyết toán và lưu hồ sơ dự án.']],
['An toàn lao động và công trường',['Tuân thủ quy định an toàn tại công trường; trang bị bảo hộ đầy đủ trước khi vào ca.','Sự cố an toàn báo ngay cho Quản lý dự án và Giám đốc đơn vị.','Khu vực thi công phải có biển báo và che chắn theo quy định.']],

['Chứng từ, thanh toán và ngân sách',['Chứng từ chi phải đủ hóa đơn, đề nghị và xác nhận nghiệm thu khối lượng.','Thanh toán theo hạn mức phê duyệt của từng cấp quản lý.','Dòng tiền dự án theo dõi tại mục Ngân sách và dòng tiền trong hệ thống.']],
['Chấm công và tính lương Nguyễn Mộc',['Giờ hành chính 7:30–17:00, Thứ 2 đến Thứ 7.','Tăng ca: hệ số 1,5 trong tuần sau 17:00 và Chủ nhật trong giờ hành chính; hệ số 2,0 Chủ nhật sau 17:00.','Phụ cấp: xăng xe 30.000đ cho điểm đầu, cộng 15.000đ từ điểm thứ hai; cơm trưa 30.000đ; cơm tăng ca 20.000đ khi tăng ca trên 2 giờ.','Chấm công qua ứng dụng; quên chấm công báo Quản lý trong ngày hôm sau để xem xét tính công.']],

lass="panel-head"><div><h3>${openD.code} — ${esc(openD.name).toUpperCase()}</h3><p>${esc(openD.owner)} · ${esc(openD.eff)}</p></div><button class="btn small" onclick="docOpen='';render()">Đóng</button></div><p style="line-height:1.7;color:#45443F">${esc(openD.sum)}</p><div class="steps" style="margin-top:8px">${openD.points.map(pt=>`<div class="tc-item" style="white-space:normal;padding:6px 0;border-bottom:1px dashed #E7E2D2">• ${esc(pt)}</div>`).join('')}</div></div>`:''}`}

window.addEventListener('resize',all);window.addEventListener('orientationchange',all);
new MutationObserver(function(){all()}).observe(document.documentElement,{childList:true,subtree:true});
