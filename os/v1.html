.attn-item:hover{border-color:#C9A227;transform:translateY(-1px);box-shadow:0 8px 20px rgba(30,26,15,.08)}
.attn-item .tag{font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:20px;background:#F3E9C8;color:#8A6D1F;white-space:nowrap}
.heat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.heat-cell{border-radius:10px;padding:14px 10px;text-align:center;font-weight:800;font-size:12px;border:1px solid var(--line)}
.pipe-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.pipe-col{background:#FBFAF6;border:1px solid var(--line);border-radius:14px;padding:12px}
.pipe-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;cursor:pointer;transition:all .18s ease}
.pipe-card:hover{border-color:#C9A227;transform:translateY(-1px)}
.org-node{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px}
.org-kids{margin:10px 0 4px 18px;padding-left:16px;border-left:2px solid #E7DFC4;display:grid;gap:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-d{border:1px solid var(--line);border-radius:9px;padding:8px;min-height:56px;font-size:11px;background:#fff}
.cal-d.today{border-color:#C9A227;background:#FFFBEB}
.cal-dot{display:block;margin-top:5px;font-size:9.5px;font-weight:700;color:#8A6D1F}
.agenda-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.cf-bar{height:10px;border-radius:6px;background:#EDEBE2;overflow:hidden;min-width:120px}
.cf-bar i{display:block;height:100%;border-radius:6px}
@media(max-width:900px){.pipe-grid{grid-template-columns:1fr}}

function toast(msg){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3200)}function pageHead(title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">TGROUP ECOSYSTEM / ${esc(pageLabel(currentPage))}</div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}function btn(label,onclick,cls=''){return `<button class="btn ${cls}" onclick="${onclick}">${label}</button>`}function status(s){return `<span class="status ${statusClass(s)}">${esc(s)}</span>`}function progressCell(n){if(n==null)return '<span style="color:#888">Chưa có dữ liệu</span>';return `<div class="progress-cell"><div><span>Tiến độ</span><b>${n}%</b></div><div class="progress"><span style="width:${Math.max(0,Math.min(100,n))}%"></span></div></div>`}
function renderPage(){switch(currentPage){case'overview':return renderOverview();case'companies':return selectedCompany?renderCompanyDetail(selectedCompany):renderCompanies();case'projects':return selectedProject?renderProjectDetail(selectedProject):renderProjects();case'tasks':return renderTasks();case'employees':return selectedEmployee?renderEmployeeDetail(selectedEmployee):renderEmployees();case'clients':return renderClients();case'suppliers':return renderSuppliers();case'warehouses':return renderWarehouses();case'materials':return renderMaterials();case'budgets':return renderBudgets();case'vouchers':return renderVouchers();case'payments':return renderPayments();case'leave':return renderLeave();case'attendance':return renderAttendance();case'daily-plans':return renderDailyPlans();case'forms':return renderForms();case'notifications':return renderNotifications();case'audit':return renderAudit();case'settings':return renderSettings();case'worker':return renderWorker();case'attention':return renderAttention();case'meetings':return renderMeetings();case'meeting-detail':return renderMeetingDetail();case'okr':return renderOKR();case'cashflow':return renderCashflow();case'risks':return renderRisks();case'radar':return renderRadar();case'contracts':return renderContracts();case'orgchart':return renderOrgchart();case'pipeline':return renderPipeline();case'search':return renderSearch();default:return renderOverview()}}
function renderOverview(){let comps=visibleCompanies(),full=['Dev','Chủ tịch','HR','Kế toán'].includes(currentUser.role),projects=allProjects().filter(p=>full||comps.some(c=>c.id===p.companyId)),emps=db.employees.filter(e=>full||e.companyId==null||comps.some(c=>c.id===e.companyId)),clients=db.clients.filter(c=>full||comps.some(c=>c.id===c.companyId)),vouchers=db.vouchers.filter(x=>x.status==='Chờ duyệt'),late=projects.filter(p=>p.status==='Trễ hạn'),headCount=emps.length;
let grp=e=>{let c=db.operating_units.find(x=>x.id===e.companyId);return c?c.group:''},wp=emps.filter(e=>grp(e)==='WePlus Group').length,ww=emps.filter(e=>grp(e)==='WeWall Group').length,shared=headCount-wp-ww;

return `${pageHead('Tổng quan tập đoàn',`Xin chào ${esc(currentUser.role)} · ${esc(currentUser.name)} · ${fmtDate(today())}`,btn('＋ Tạo mới','openCreateMenu()','primary')+btn('Xuất dữ liệu','exportData()'))}<div class="grid kpis">${kpis.map(k=>`<div class="kpi" onclick="go('${k[5]}')"><div class="kpi-top">${k[0]}<span class="kpi-icon">${k[3]}</span></div><div class="kpi-num" data-count="${k[1]}">0</div><div class="kpi-foot"><span>${k[2]}</span>${k[4]!=null?`<b>${Math.round(k[4])}%</b>`:''}</div>${k[4]!=null?`<div class="mini-bar"><span style="width:${Math.min(100,k[4])}%"></span></div>`:''}</div>`).join('')}</div><div class="grid alerts"><div class="alert-card"><div class="alert-head">Vượt / sắp vượt dự trù <span class="alert-count">${over.length}</span></div><ul class="alert-list">${over.length?over.map(b=>`<li><span class="dot"></span>${esc(b.name)} · ${fmtMoney(b.spent-b.amount)} vượt</li>`).join(''):'<li><span class="dot"></span>Không có dự án vượt dự trù.</li>'}</ul></div><div class="alert-card red"><div class="alert-head">Dự án trễ <span class="alert-count">${late.length}</span></div><ul class="alert-list">${late.length?late.map(p=>`<li><span class="dot"></span>${esc(p.name)}</li>`).join(''):'<li><span class="dot"></span>Không có dự án trễ hạn.</li>'}</ul></div><div class="alert-card blue"><div class="alert-head">Chờ duyệt <span class="alert-count">${vouchers.length}</span></div><ul class="alert-list">${vouchers.length?vouchers.slice(0,3).map(v=>`<li><span class="dot"></span>${esc(v.name)} · Chờ duyệt</li>`).join(''):'<li><span class="dot"></span>Không có chứng từ chờ duyệt.</li>'}</ul></div></div><div class="grid charts"><div class="panel"><div class="panel-head"><div><h3>CƠ CẤU NHÂN SỰ THEO GROUP</h3><p>Theo danh bạ nhân sự toàn hệ sinh thái</p></div><span class="tag">${headCount} nhân sự</span></div><div class="chart-area"><div class="donut" style="background:conic-gradient(#c9a227 0 ${p1}%,#6b4f2e ${p1}% ${p2}%,#999 ${p2}% 100%)"><div class="donut-center"><strong data-count="${headCount}">0</strong><span>nhân sự</span></div></div><div class="legend">${[['WePlus Group',wp,'#c9a227'],['WeWall Group',ww,'#6b4f2e'],['Khối dùng chung',shared,'#999']].map(x=>`<div class="legend-row"><span class="legend-name"><i style="background:${x[2]}"></i>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div></div><div class="panel"><div class="panel-head"><div><h3>NHÂN SỰ THEO ĐƠN VỊ</h3><p>Số nhân sự theo danh bạ, đối chiếu hồ sơ HR</p></div><span class="tag">Số lượng</span></div><div class="bar-chart">${unitBars.map(([n,v])=>`<div class="bar-item"><div class="bar" style="height:${v/maxBar*78}%"><em>${v}</em></div><div class="bar-label">${n}</div></div>`).join('')}</div></div></div><div class="section-title">ĐƠN VỊ VẬN HÀNH <span>${db.operating_units.length} đơn vị · bấm thẻ để xem 360°</span></div><div class="grid companies-grid">${db.operating_units.map(companyCard).join('')}</div><div class="section-title">DỰ ÁN TOÀN GROUP <span>${projects.length} dự án</span></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>DỰ ÁN</th><th>ĐƠN VỊ</th><th>PHỤ TRÁCH CHÍNH</th><th>TRẠNG THÁI</th><th>TIẾN ĐỘ</th><th>NGÂN SÁCH</th></tr></thead><tbody>${projects.slice(0,10).map(projectRow).join('')}</tbody></table></div><div style="padding-top:12px">${btn('Xem toàn bộ dự án','go(\'projects\')')}</div></div><div class="footer">© 2026 Tgroup Ecosystem · Hệ điều hành tập đoàn · Phiên bản 1.1.0</div>`}

function renderProjects(){let ps=allProjects().filter(p=>{let q=norm([p.name,p.id,p.owner,companyName(p.companyId)].join(' '));return q.includes(norm(listFilter))&&(listCompany==='all'||p.companyId===listCompany)});return `${pageHead('Quản lý dự án','Danh sách dự án theo đơn vị thực hiện.',btn('＋ Tạo dự án','openModal(\'project\')','primary')+btn('Xuất CSV','exportCSV(\'projects\')'))}<div class="filters"><input placeholder="Tìm tên dự án, người phụ trách…" value="${esc(listFilter)}" oninput="listFilter=this.value;render()"><select onchange="listCompany=this.value;render()"><option value="all">Tất cả đơn vị</option>${db.operating_units.map(c=>`<option value="${c.id}" ${listCompany===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select onchange="window.projectStatus=this.value;render()"><option value="all">Tất cả trạng thái</option>${['Đang chuẩn bị','Đang thực hiện','Đã hoàn thành','Trễ hạn','Tạm dừng'].map(s=>`<option ${window.projectStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="panel"><div class="panel-head"><div><h3>DANH SÁCH DỰ ÁN</h3><p>${ps.length} bản ghi · Dữ liệu chưa có không được tính vào tổng</p></div><span class="tag">Bảng</span></div><div class="table-wrap"><table><thead><tr><th>DỰ ÁN</th><th>ĐƠN VỊ</th><th>PHỤ TRÁCH CHÍNH</th><th>BẮT ĐẦU</th><th>KẾT THÚC</th><th>TRẠNG THÁI</th><th>TIẾN ĐỘ</th><th>NGÂN SÁCH</th><th></th></tr></thead><tbody>${ps.filter(p=>!window.projectStatus||window.projectStatus==='all'||p.status===window.projectStatus).map(p=>`<tr><td><div class="person"><div class="avatar">${initials(p.name)}</div><div><strong><a href="#" onclick="event.preventDefault();openProject('${p.id}')" style="color:inherit">${esc(p.name)}</a></strong><small>${esc(p.id)}</small></div></div></td><td>${esc(companyName(p.companyId))}</td><td>${esc(p.owner||'Chưa phân công')}</td><td>${fmtDate(p.start)}</td><td>${fmtDate(p.end)}</td><td>${status(p.status)}</td><td>${progressCell(p.progress)}</td><td>${fmtMoney(p.budget)}</td><td><button class="btn small" onclick="openProject('${p.id}')">Mở</button></td></tr>`).join('')}</tbody></table></div></div>`}
function renderProjectDetail(id){let p=db.projects.find(x=>x.id===id);if(!p)return renderProjects();let tasks=db.tasks.filter(t=>t.projectId===id),members=db.project_members.filter(m=>m.projectId===id),vouchers=db.vouchers.filter(v=>v.projectId===id),movements=db.stock_movements.filter(m=>m.projectId===id);let tabs=['Tổng quan','Công việc','Thành viên','Ngân sách','Kho đã xuất','Biểu mẫu','Lịch sử'];return `${pageHead('Chi tiết dự án','Quản lý dự án 360°',btn('← Danh sách','selectedProject=null;render()')+btn('Sửa dự án',`openModal('project','${id}')`,'primary'))}<div class="detail-hero"><div class="mono" style="--co:${db.operating_units.find(c=>c.id===p.companyId)?.color||'#c9a227'};color:${db.operating_units.find(c=>c.id===p.companyId)?.color||'#c9a227'}">${initials(p.name)}</div><div style="flex:1"><h2>${esc(p.name)}</h2><div class="sub">${esc(companyName(p.companyId))} · ${esc(p.id)}</div><div style="margin-top:8px">${status(p.status)}</div></div></div><div class="detail-stats"><div class="detail-stat"><small>PHỤ TRÁCH CHÍNH</small><strong style="font-size:11px">${esc(p.owner||'Chưa phân công')}</strong></div><div class="detail-stat"><small>NGÀY BẮT ĐẦU</small><strong style="font-size:13px">${fmtDate(p.start)}</strong></div><div class="detail-stat"><small>NGÀY KẾT THÚC</small><strong style="font-size:13px">${fmtDate(p.end)}</strong></div><div class="detail-stat"><small>NGÂN SÁCH</small><strong style="font-size:13px">${fmtMoney(p.budget)}</strong></div></div><div class="tabs">${tabs.map(t=>`<button class="${detailTab===t?'active':''}" onclick="detailTab='${t}';render()">${t} <span style="color:#999">${t==='Công việc'?tasks.length:t==='Thành viên'?members.length:t==='Biểu mẫu'?vouchers.length:''}</span></button>`).join('')}</div>${detailTab==='Tổng quan'?`<div class="grid" style="grid-template-columns:1fr 1fr"><div class="panel"><h3>TIẾN ĐỘ</h3><p>${progressCell(p.progress)}</p><p>${esc(p.note||'Chưa có ghi chú.')}</p></div><div class="panel"><h3>NGÂN SÁCH DỰ ÁN</ /p><p>Hạng mục dự trù: ${db.budget_items.filter(x=>x.projectId===id).length}</p><p>Chứng từ: ${vouchers.length}</p></div>`:detailTab==='Kho đã xuất'?`<div class="panel"><div class="table-wrap"><table><thead><tr><th>VẬT TƯ</th><th>LOẠI</th><th>SỐ LƯỢNG</th><th>NGÀY</th></tr></thead><tbody>${movements.map(m=>`<tr><td>${esc(db.materials.find(x=>x.id===m.materialId)?.name||m.materialId)}</td><td>${esc(m.type)}</td><td>${m.quantity}</td><td>${fmtDate(m.date)}</td></tr>`).join('')||'<tr><td colspan="4">Chưa có giao dịch kho gắn dự án.</td></tr>'}</tbody></table></div></div>`:detailTab==='Biểu mẫu'?`<div class="panel">${vouchers.map(v=>`<p>${esc(v.name)} · ${fmtMoney(v.amount)} · ${status(v.status)}</p>`).join('')||'Chưa có chứng từ gắn dự án.'}<p>${btn('Tạo chứng từ','openModal(\'voucher\',null,\''+id+'\')')}</p></div>`:`<div class="panel">${auditTable(db.audit_log.filter(a=>a.entityId===id))}</div>`}`}
function renderTasks(){let list=db.tasks.filter(t=>norm([t.name,t.owner,db.projects.find(p=>p.id===t.projectId)?.name].join(' ')).includes(norm(listFilter)));return `${pageHead('Công việc','Theo dõi nhiệm vụ, người phụ trách, hạn hoàn thành và trạng thái.',btn('＋ Tạo công việc','openModal(\'task\')','primary'))}<div class="filters"><input placeholder="Tìm công việc, dự án, người phụ trách…" value="${esc(listFilter)}" oninput="listFilter=this.value;render()"><select onchange="window.taskStatus=this.value;render()"><option value="all">Tất cả trạng thái</option>${['Chưa bắt đầu','Đang thực hiện','Hoàn thành'].map(s=>`<option ${window.taskStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>CÔNG VIỆC</th><th>DỰ ÁN</th><th>NGƯỜI PHỤ TRÁCH CHÍNH</th><th>HẠN</th><th>TRẠNG THÁI</th></tr></thead><tbody>${list.filter(t=>!window.taskStatus||window.taskStatus==='all'||t.status===window.taskStatus).map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(db.projects.find(p=>p.id===t.projectId)?.name||'—')}</td><td>${esc(t.owner||'Chưa phân công')}</td><td>${fmtDate(t.due)}</td><td>${status(t.status)}</td></tr>`).join('')||'<tr><td colspan="5">Chưa có công việc. Có thể tạo từ đây hoặc trong tab Công việc của dự án.</td></tr>'}</tbody></table></div></div>`}
function employeeTable(list){return `<div class="table-wrap"><table><thead><tr><th>NHÂN SỰ</th><th>ĐƠN VỊ</th><th>CHỨC VỤ</th><th>ĐIỆN THOẠI</th><th>EMAIL</th><th></th></tr></thead><tbody>${list.map(e=>`<tr><td><div class="person"><div class="avatar">${initials(e.name)}</div><div><strong><a href="#" onclick="event.preventDefault();openEmployee('${e.id}')" style="color:inherit">${esc(e.name)}</a></strong><small>${fmtDate(e.birthDate)}</small></div></div></td><td>${esc(companyName(e.companyId))}</td><td>${esc(e.position||'—')}</td><td>${currentUser.role==='Dev'||currentUser.role==='Chủ tịch'||currentUser.role==='HR'?esc(e.phone||'—'):'••••••••'}</td><td>${esc(e.email||'—')}</td><td>${btn('Mở',`openEmployee('${e.id}')`,'small')}</td></tr>`).join('')}</tbody></table></div>`}

function renderEmployeeDetail(id){let e=db.employees.find(x=>x.id===id);if(!e)return renderEmployees();return `${pageHead('Hồ sơ nhân sự 360°','Thông tin và lịch sử công việc',btn('← Danh bạ','selectedEmployee=null;render()')+btn('Sửa hồ sơ',`openModal('employee','${id}')`,'primary'))}<div class="detail-hero"><div class="avatar" style="width:58px;height:58px;font-size:18px">${initials(e.name)}</div><div><h2>${esc(e.name)}</h2><div class="sub">${esc(e.position||'Chưa cập nhật chức vụ')} · ${esc(companyName(e.companyId))}</div></div></div><div class="tabs">${['Hồ sơ','Dự án','Chấm công','Nghỉ phép','Lịch sử'].map(t=>`<button class="${detailTab===t?'active':''}" onclick="detailTab='${t}';render()">${t}</button>`).join('')}</div><div class="panel">${detailTab==='Hồ sơ'?`<p><b>Điện thoại:</b> ${esc(e.phone||'—')}</p><p><b>Email:</b> ${esc(e.email||'—')}</p><p><b>Ngày sinh:</b> ${fmtDate(e.birthDate)}</p><p><b>Ngày vào làm:</b> ${fmtDate(e.startDate)}</p>`:detailTab==='Dự án'?db.project_members.filter(m=>m.employeeId===id).map(m=>`<p>${esc(db.projects.find(p=>p.id===m.projectId)?.name||m.projectId)}</p>`).join('')||'Chưa có dự án được gán.':detailTab==='Chấm công'?db.attendance_records.filter(a=>a.employeeId===id).map(a=>`<p>${fmtDate(a.date)} · ${esc(a.checkIn||'—')} – ${esc(a.checkOut||'—')}</p>`).join('')||'Chưa có bản ghi chấm công.':detailTab==='Nghỉ phép'?db.leave_requests.filter(a=>a.employeeId===id).map(a=>`<p>${fmtDate(a.start)} – ${fmtDate(a.end)} · ${status(a.status)}</p>`).join('')||'Chưa có đơn nghỉ phép.':auditTable(db.audit_log.filter(a=>a.entityId===id))}</div>`}
function renderClients(){let list=db.clients.filter(c=>norm([c.name,c.industry,c.contact,companyName(c.companyId)].join(' ')).includes(norm(listFilter))&&(listCompany==='all'||c.companyId===listCompany));return `${pageHead('Khách hàng','Danh mục khách hàng theo đơn vị phụ trách.',btn('＋ Thêm khách hàng','openModal(\'client\')','primary')+btn('Xuất CSV','exportCSV(\'clients\')'))}<div class="filters"><input placeholder="Tìm khách hàng không dấu…" value="${esc(listFilter)}" oninput="listFilter=this.value;render()"><select onchange="listCompany=this.value;render()"><option value="all">Tất cả đơn vị</option>${db.operating_units.map(c=>`<option value="${c.id}" ${listCompany===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>KHÁCH HÀNG / ĐỐI TÁC</th><th>ĐƠN VỊ PHỤ TRÁCH</th><th>NGÀNH</th><th>NGƯỜI LIÊN HỆ</th><th>DỰ ÁN ĐÃ GẮN</th><th>NGUỒN</th><th></th></tr></thead><tbody>${list.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(companyName(c.companyId))}</td><td>${esc(c.industry||'Chưa có dữ liệu')}</td><td>${esc(c.contact||'Chưa có dữ liệu')}</td><td>${db.projects.filter(p=>p.companyId===c.companyId&&norm(p.name).includes(norm(c.name))).length}</td><td>${esc(c.source||'Người dùng nhập')}</td><td>${btn('Sửa',`openModal('client','${c.id}')`,'small')}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderSuppliers(){return `${pageHead('Nhà cung cấp','Danh sách nhà cung cấp theo đơn vị.',btn('＋ Thêm nhà cung cấp','openModal(\'supplier\')','primary'))}<div class="panel">${db.suppliers.length?`<div class="table-wrap"><table><thead><tr><th>TÊN NHÀ CUNG CẤP</th><th>NHÓM</th><th>LIÊN HỆ</th><th>GHI CHÚ</th></tr></thead><tbody>${db.suppliers.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.category||'—')}</td><td>${esc(s.contact||'—')}</td><td>${esc(s.note||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><strong>Chưa có nhà cung cấp</strong>Danh sách sẽ được cập nhật khi có nhà cung cấp mới.</div>'}</div>`}

function movementTable(list){return `<div class="table-wrap"><table><thead><tr><th>NGÀY</th><th>VẬT TƯ</th><th>KHO</th><th>LOẠI</th><th>SỐ LƯỢNG</th><th>DỰ ÁN</th><th>NGƯỜI THỰC HIỆN</th></tr></thead><tbody>${list.map(m=>`<tr><td>${fmtDate(m.date)}</td><td>${esc(db.materials.find(x=>x.id===m.materialId)?.name||m.materialId)}</td><td>${esc(db.warehouses.find(x=>x.id===m.warehouseId)?.name||'—')}</td><td>${status(m.type)}</td><td>${m.quantity}</td><td>${esc(db.projects.find(p=>p.id===m.projectId)?.name||'—')}</td><td>${esc(m.user||'—')}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có giao dịch kho.</td></tr>'}</tbody></table></div>`}
function renderMaterials(){return `${pageHead('Vật tư & tồn kho','Nhóm gỗ, sắt và inox, sơn, nhôm kính, vật tư sự kiện.',btn('＋ Nhập / xuất kho','openModal(\'movement\')','primary')+btn('＋ Thêm vật tư','openModal(\'material\')'))}<div class="notice"><b>Lưu ý:</b> Khi xuất kho vượt tồn hiện tại, hệ thống sẽ chặn giao dịch.</div><div class="filters"><input placeholder="Tìm vật tư…" value="${esc(listFilter)}" oninput="listFilter=this.value;render()"><select onchange="listCompany=this.value;render()"><option value="all">Tất cả kho</option>${db.warehouses.map(w=>`<option value="${w.id}" ${listCompany===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>VẬT TƯ</th><th>NHÓM</th><th>KHO</th><th>TỒN ĐẦU KỲ</th><th>TỒN HIỆN TẠI</th><th></th></tr></thead><tbody>${db.materials.filter(m=>norm([m.name,m.category].join(' ')).includes(norm(listFilter))&&(listCompany==='all'||m.warehouseId===listCompany)).map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.category)}</td><td>${esc(db.warehouses.find(w=>w.id===m.warehouseId)?.name||'—')}</td><td>${m.opening}</td><td><b>${m.stock}</b></td><td>${btn('Điều chỉnh',`openModal('material','${m.id}')`,'small')}</td></tr>`).join('')}</tbody></table></div></div><div class="section-title">LỊCH SỬ VẬT TƯ</div><div class="panel">${movementTable(db.stock_movements)}</div>`}
function renderBudgets(){let rows=db.budgets.filter(b=>norm([b.name,companyName(b.companyId),b.projectId].join(' ')).includes(norm(listFilter)));return `${pageHead('Ngân sách & dự trù','Chỉ tính các bản ghi có số tiền thực tế; chứng từ duyệt sẽ cập nhật số đã chi.',btn('＋ Tạo dự trù','openModal(\'budget\')','primary')+btn('In bảng dự trù','printForm(\'budget\')'))}<div class="filters"><input placeholder="Tìm dự trù / dự án…" value="${esc(listFilter)}" oninput="listFilter=this.value;render()"></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>HẠNG MỤC / DỰ TRÙ</th><th>ĐƠN VỊ</th><th>DỰ ÁN</th><th>DỰ TRÙ</th><th>ĐÃ CHI</th><th>CÒN LẠI</th><th>TRẠNG THÁI</th></tr></thead><tbody>${rows.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(companyName(b.companyId))}</td><td>${esc(db.projects.find(p=>p.id===b.projectId)?.name||'—')}</td><td>${fmtMoney(b.amount)}</td><td>${fmtMoney(b.spent||0)}</td><td>${fmtMoney(Number(b.amount)-(Number(b.spent)||0))}</td><td>${status(b.status||'Đang theo dõi')}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có bản ghi ngân sách thực tế.</td></tr>'}</tbody></table></div></div>`}
function renderVouchers(){return `${pageHead('Chứng từ','Trạng thái: Chờ duyệt, Đã duyệt, Đã chi, Từ chối.',btn('＋ Tạo chứng từ','openModal(\'voucher\')','primary'))}<div class="filters"><input placeholder="Tìm chứng từ…" value="${esc(listFilter)}" oninput="listFilter=this.value;render()"><select onchange="window.voucherStatus=this.value;render()"><option value="all">Tất cả trạng thái</option>${['Chờ duyệt','Đã duyệt','Đã chi','Từ chối'].map(s=>`<option ${window.voucherStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>SỐ PHIẾU</th><th>TÊN CHỨNG TỪ</th><th>DỰ ÁN</th><th>HẠNG MỤC DỰ TRÙ</th><th>SỐ TIỀN</th><th>TRẠNG THÁI</th><th>NGƯỜI TẠO</th><th>THAO TÁC</th></tr></thead><tbody>${db.vouchers.filter(v=>norm([v.name,v.id].join(' ')).includes(norm(listFilter))&&(!window.voucherStatus||window.voucherStatus==='all'||v.status===window.voucherStatus)).map(v=>`<tr><td>${esc(v.number||v.id)}</td><td>${esc(v.name)}</td><td>${esc(db.projects.find(p=>p.id===v.projectId)?.name||'—')}</td><td>${esc(db.budget_items.find(b=>b.id===v.budgetItemId)?.name||'—')}</td><td>${fmtMoney(v.amount)}</td><td>${status(v.status)}</td><td>${esc(v.createdBy||'—')}</td><td>${v.status==='Chờ duyệt'?btn('Duyệt',`approveVoucher('${v.id}')`,'small primary')+' '+btn('Từ chối',`rejectVoucher('${v.id}')`,'small'):btn('In',`printForm('voucher','${v.id}')`,'small')}</td></tr>`).join('')||'<tr><td colspan="8">Chưa có chứng từ.</td></tr>'}</tbody></table></div></div>`}
function renderPayments(){return `${pageHead('Thanh toán','Theo dõi các khoản thanh toán gắn chứng từ và dự án.',btn('＋ Ghi nhận thanh toán','openModal(\'payment\')','primary'))}<div class="panel"><div class="table-wrap"><table><thead><tr><th>NGÀY</th><th>NỘI DUNG</th><th>CHỨNG TỪ</th><th>SỐ TIỀN</th><th>TRẠNG THÁI</th></tr></thead><tbody>${db.payments.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(p.name)}</td><td>${esc(db.vouchers.find(v=>v.id===p.voucherId)?.number||'—')}</td><td>${fmtMoney(p.amount)}</td><td>${status(p.status||'Đã ghi nhận')}</td></tr>`).join('')||'<tr><td colspan="5">Chưa có khoản thanh toán.</td></tr>'}</tbody></table></div></div>`}
function renderLeave(){let rows=db.leave_requests.filter(x=>currentUser.role==='Nhân viên'?x.employeeId===currentUser.name||x.employeeName===currentUser.name:true);return `${pageHead('Nghỉ phép','Tạo đơn, duyệt / từ chối và ghi lịch sử nhân sự.',btn('＋ Tạo đơn nghỉ phép','openModal(\'leave\')','primary'))}<div class="panel"><div class="table-wrap"><table><thead><tr><th>NHÂN SỰ</th><th>LOẠI NGHỈ</th><th>TỪ NGÀY</th><th>ĐẾN NGÀY</th><th>LÝ DO</th><th>TRẠNG THÁI</th><th>THAO TÁC</th></tr></thead><tbody>${rows.map(l=>`<tr><td>${esc(l.employeeName||l.employeeId)}</td><td>${esc(l.type)}</td><td>${fmtDate(l.start)}</td><td>${fmtDate(l.end)}</td><td>${esc(l.reason||'—')}</td><td>${status(l.status)}</td><td>${l.status==='Chờ duyệt'&&['Dev','Chủ tịch','HR','Giám đốc công ty'].includes(currentUser.role)?btn('Duyệt',`decideLeave('${l.id}','Đã duyệt')`,'small primary')+' '+btn('Từ chối',`decideLeave('${l.id}','Từ chối')`,'small'):''}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có đơn nghỉ phép.</td></tr>'}</tbody></table></div></div>`}
function renderAttendance(){return `${pageHead('Chấm công','Tổng quan theo ngày và đơn vị. Quy định Nguyễn Mộc: 07:30–17:00; tăng ca 1,5 và 2,0.',btn('Ghi nhận vào/ra ca','punchClock()','primary')+btn('Xuất CSV','exportCSV(\'attendance_records\')'))}<div class="grid kpis"><div class="kpi"><div class="kpi-top">BẢN GHI HÔM NAY</div><div class="kpi-num">${db.attendance_records.filter(a=>a.date===today()).length}</div></div><div class="kpi"><div class="kpi-top">ĐÃ VÀO CA</div><div class="kpi-num">${db.attendance_records.filter(a=>a.date===today()&&a.checkIn).length}</div></div><div class="kpi"><div class="kpi-top">ĐÃ RA CA</div><div class="kpi-num">${db.attendance_records.filter(a=>a.date===today()&&a.checkOut).length}</div></div><div class="kpi"><div class="kpi-top">TĂNG CA</div><div class="kpi-num">${db.attendance_records.filter(a=>a.overtime).length}</div></div></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>NHÂN SỰ</th><th>NGÀY</th><th>VÀO CA</th><th>RA CA</th><th>TĂNG CA</th><th>GHI CHÚ</th></tr></thead><tbody>${db.attendance_records.slice().reverse().map(a=>`<tr><td>${esc(a.employeeName||a.employeeId)}</td><td>${fmtDate(a.date)}</td><td>${esc(a.checkIn||'—')}</td><td>${esc(a.checkOut||'—')}</td><td>${esc(a.overtime||'—')}</td><td>${esc(a.note||'—')}</td></tr>`).join('')||'<tr><td colspan="6">Chưa có bản ghi chấm công.</td></tr>'}</tbody></table></div></div>`}
function renderDailyPlans(){return `${pageHead('Kế hoạch công việc ngày','Theo ngày, tổ, dự án và người phụ trách.',btn('＋ Tạo kế hoạch','openModal(\'daily\')','primary'))}<div class="panel"><div class="table-wrap"><table><thead><tr><th>NGÀY</th><th>CÔNG VIỆC</th><th>TỔ / ĐƠN VỊ</th><th>DỰ ÁN</th><th>NGƯỜI PHỤ TRÁCH</th><th>TRẠNG THÁI</th></tr></thead><tbody>${db.daily_plans.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(p.name)}</td><td>${esc(p.team||'—')}</td><td>${esc(db.projects.find(x=>x.id===p.projectId)?.name||'—')}</td><td>${esc(p.owner||'—')}</td><td>${status(p.status||'Chưa bắt đầu')}</td></tr>`).join('')||'<tr><td colspan="6">Chưa có kế hoạch ngày.</td></tr>'}</tbody></table></div></div>`}
const FORMS=[['budget','Bảng dự trù'],['purchase','Đề nghị mua hàng'],['expense','Đề nghị chi'],['advance','Đề nghị tạm ứng'],['payment','Đề nghị thanh toán'],['stockin','Phiếu nhập kho'],['stockout','Phiếu xuất kho'],['leave','Đơn xin nghỉ phép'],['attendance','Bảng chấm công tháng'],['daily','Kế hoạch công việc ngày'],['report','Báo cáo cuối ngày']];function renderForms(){return `${pageHead('Biểu mẫu & in ấn','Mở xem trước, in A4; mẫu đang dùng cấu trúc nghiệp vụ chung. File QLDA chuẩn chưa có trong bộ tệp hiện tại.', '')}<div class="notice">Biểu mẫu phát hành theo pháp nhân của từng đơn vị. Chọn biểu mẫu để xem trước và in.</div><div class="grid companies-grid">${FORMS.map(([id,name])=>`<div class="panel"><div class="panel-head"><div><h3>${name.toUpperCase()}</h3><p>Mẫu A4 · Có vùng ký duyệt</p></div><span class="tag">PDF / In</span></div><p style="color:#777;font-size:11px">Biểu mẫu ${name.toLowerCase()} theo nghiệp vụ TGROUP OS.</p>${btn('Xem trước & in',`printForm('${id}')`,'primary')}</div>`).join('')}</div>`}
function renderNotifications(){let notices=[...db.notifications];let birthdays=db.employees.filter(e=>e.birthDate&&e.birthDate.slice(5)===today().slice(5));return `${pageHead('Thông báo nội bộ','Thông báo vận hành và sinh nhật được tính từ dữ liệu nhân sự đã import.',btn('＋ Tạo thông báo','openModal(\'notification\')','primary'))}<div class="panel"><div class="panel-head"><h3>SINH NHẬT HÔM NAY</h3><span class="tag">${birthdays.length}</span></div>${birthdays.map(e=>`<p>${esc(e.name)} · ${esc(companyName(e.companyId))}</p>`).join('')||'<div class="empty">Chưa có dữ liệu sinh nhật phù hợp.</div>'}</div><div class="panel" style="margin-top:14px"><div class="panel-head"><h3>THÔNG BÁO</h3><span class="tag">${notices.length}</span></div>${notices.slice().reverse().map(n=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(n.title)}</b><p style="color:#777;margin:6px 0">${esc(n.body||'')}</p><small style="color:#999">${fmtDate(n.date||today())} · ${esc(n.author||'—')}</small></div>`).join('')||'<div class="empty">Chưa có thông báo nội bộ.</div>'}</div>`}
function auditTable(list){return `<div class="table-wrap"><table><thead><tr><th>THỜI GIAN</th><th>NGƯỜI THAO TÁC</th><th>HÀNH ĐỘNG</th><th>ĐỐI TƯỢNG</th><th>NỘI DUNG</th></tr></thead><tbody>${list.slice(0,200).map(a=>`<tr><td>${esc(new Date(a.at).toLocaleString('vi-VN'))}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.entity)}</td><td>${esc(a.detail||a.entityId||'—')}</td></tr>`).join('')||'<tr><td colspan="5">Chưa có lịch sử thao tác.</td></tr>'}</tbody></table></div>`}
function renderAudit(){return `${pageHead('Lịch sử hệ thống','Audit log ghi thao tác tạo, sửa, xóa, duyệt, nhập kho, xuất kho.',btn('Xuất CSV','exportCSV(\'audit_log\')'))}<div class="filters"><input placeholder="Lọc người thao tác, hành động, đối tượng…" value="${esc(listFilter)}" oninput="listFilter=this.value;render()"></div><div class="panel">${auditTable(db.audit_log.filter(a=>norm([a.user,a.action,a.entity,a.detail].join(' ')).includes(norm(listFilter))))}</div>`}
function renderSettings(){return `${pageHead('Cài đặt hệ thống','Cấu hình dùng chung toàn hệ thống.',btn('Lưu cài đặt','saveSettings()','primary'))}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="panel"><h3>QUY ĐỊNH CHẤM CÔNG</h3><div class="field"><label>Ngày lễ mặc định</label><input id="setting-holidays" type="number" value="${db.settings.holidays}"></div><div class="field"><label>Hệ số tăng ca 1</label><input id="setting-ot15" type="number" step="0.1" value="${db.settings.overtime15}"></div><div class="field"><label>Hệ số tăng ca 2</label><input id="setting-ot20" type="number" step="0.1" value="${db.settings.overtime20}"></div><div class="field"><label>Hạn mức duyệt (VND)</label><input id="setting-limit" type="number" placeholder="Chưa thiết lập" value="${db.settings.approvalLimit??''}"></div></div><div class="panel"><h3>DỮ LIỆU & SAO LƯU</h3><p style="color:#777">Lưu tại trình duyệt hiện tại bằng localStorage. Không đồng bộ giữa thiết bị.</p><div class="actions" style="margin-top:12px">${btn('Xuất JSON','exportData()','primary')}${btn('Nhập JSON','document.getElementById(\'import-file\').click()')}<input type="file" id="import-file" class="hidden" accept="application/json,.json" onchange="importData(this.files[0])">${btn('Nạp lại dữ liệu gốc','resetData()','danger')}</div><p style="font-size:10px;color:#999;margin-top:14px">Dữ liệu được lưu trong trình duyệt của thiết bị này.</p></div><div class="panel"><h3>PHÁP NHÂN</h3><p>${db.legal_entities.length} bản ghi pháp nhân. Cấu trúc pháp nhân tách khỏi đơn vị vận hành.</p>${btn('＋ Thêm pháp nhân','openModal(\'legal\')')}</div><div class="panel"><h3>TÀI KHOẢN / VAI TRÒ</h3>${USERS.map(u=>`<p style="border-bottom:1px solid var(--line);padding-bottom:8px">${esc(u.name)} <span style="float:right">${status(u.role)}</span></p>`).join('')}</div></div>`}
function renderWorker(){let mine=db.attendance_records.filter(a=>(a.employeeName||a.employeeId)===currentUser.name);return `${pageHead('Chấm công nhân sự','Giao diện tối giản cho vai trò Thợ.', '')}<div class="detail-hero" style="margin-bottom:18px"><div class="avatar" style="width:54px;height:54px">${initials(currentUser.name)}</div><div><h2>${esc(currentUser.name)}</h2><div class="sub">${esc(companyName(currentUser.companyId))} · Vai trò Thợ</div></div></div><div class="worker-actions"><button class="worker-action" onclick="punchClock('in')"><span class="big">↘</span>VÀO CA</button><button class="worker-action" onclick="punchClock('out')"><span class="big">↗</span>RA CA</button><button class="worker-action" onclick="openModal('leave')"><span class="big">▤</span>XIN NGHỈ PHÉP</button><button class="worker-action" onclick="go('attendance')"><span class="big">◷</span>XEM CÔNG</button></div><div class="section-title">CHẤM CÔNG GẦN ĐÂY</div><div class="panel">${mine.length?`<div class="table-wrap"><table><thead><tr><th>NGÀY</th><th>VÀO CA</th><th>RA CA</th><th>GHI CHÚ</th></tr></thead><tbody>${mine.slice().reverse().map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${esc(a.checkIn||'—')}</td><td>${esc(a.checkOut||'—')}</td><td>${esc(a.note||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có bản ghi chấm công.</div>'}</div>`}
function renderSearch(){let q=norm(globalQuery);if(!q)return `${pageHead('Tìm kiếm toàn Group','Tìm theo tên không dấu trên các danh mục đã nạp.','')}<div class="empty">Nhập từ khóa ở ô tìm kiếm phía trên.</div>`;let groups=[['Công ty',db.operating_units.filter(x=>norm([x.name,x.leader,x.group].join(' ')).includes(q)).map(x=>({name:x.name,sub:x.group,action:`openCompany('${x.id}')`}))],['Dự án',db.projects.filter(x=>norm([x.name,x.owner,companyName(x.companyId)].join(' ')).includes(q)).map(x=>({name:x.name,sub:companyName(x.companyId),action:`openProject('${x.id}')`}))],['Nhân sự',db.employees.filter(x=>norm([x.name,x.position,x.email].join(' ')).includes(q)).map(x=>({name:x.name,sub:companyName(x.companyId),action:`openEmployee('${x.id}')`}))],['Khách hàng',db.clients.filter(x=>norm([x.name,companyName(x.companyId)].join(' ')).includes(q)).map(x=>({name:x.name,sub:companyName(x.companyId),action:`go('clients')`}))],['Cuộc họp',(db.meetings||[]).filter(x=>norm([x.title,x.location].join(' ')).includes(q)).map(x=>({name:x.title,sub:fmtDate(x.date),action:`openMeeting('${x.id}')`}))],['Nghị quyết',(db.resolutions||[]).filter(x=>norm([x.code,x.title,x.content].join(' ')).includes(q)).map(x=>({name:x.code+' — '+x.title,sub:x.status,action:`go('meetings')`}))],['Hợp đồng',(db.contracts||[]).filter(x=>norm([x.code,x.partner].join(' ')).includes(q)).map(x=>({name:x.code+' — '+x.partner,sub:companyName(x.companyId),action:`go('contracts')`}))]];return `${pageHead('Kết quả tìm kiếm',`Từ khóa: “${esc(globalQuery)}”`,'')}${groups.map(([g,items])=>`<div class="section-title">${g}<span>${items.length} kết quả</span></div><div class="panel">${items.map(x=>`<div style="padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px"><div><b>${esc(x.name)}</b><div class="sub" style="margin-top:4px">${esc(x.sub)}</div></div>${btn('Mở',x.action,'small')}</div>`).join('')||'<div class="empty">Không có kết quả.</div>'}</div>`).join('')}`}
function openCreateMenu(){showModal('Tạo mới',`<div class="grid" style="grid-template-columns:repeat(2,1fr)">${[['project','Dự án'],['task','Công việc'],['employee','Nhân sự'],['client','Khách hàng'],['voucher','Chứng từ'],['leave','Đơn nghỉ phép'],['daily','Kế hoạch ngày'],['movement','Nhập / xuất kho']].map(([t,n])=>`<button class="worker-action" onclick="closeModal();openModal('${t}')">${n}</button>`).join('')}</div>`)}
function openModal(type,id=null,extra=null){let item=null;const map={company:'operating_units',project:'projects',employee:'employees',client:'clients',supplier:'suppliers',material:'materials'};if(map[type]&&id)item=db[map[type]].find(x=>x.id===id);modalState={type,id,extra,item};let title=({company:'Đơn vị vận hành',project:'Dự án',task:'Công việc',employee:'Nhân sự',client:'Khách hàng',supplier:'Nhà cung cấp',material:'Vật tư',movement:'Phiếu nhập / xuất kho',budget:'Dự trù ngân sách',voucher:'Chứng từ',payment:'Thanh toán',leave:'Đơn xin nghỉ phép',daily:'Kế hoạch công việc ngày',notification:'Thông báo',legal:'Pháp nhân'})[type]||'Tạo bản ghi';let fields='';const f=(name,label,kind='text',value='',opts=null,required=false,span=false)=>`<div class="field ${span?'span2':''}"><label>${label}${required?' *':''}</label>${kind==='select'?`<select name="${name}" ${required?'required':''}>${(opts||[]).map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:kind==='textarea'?`<textarea name="${name}" ${required?'required':''}>${esc(value)}</textarea>`:`<input name="${name}" type="${kind}" value="${esc(value)}" ${required?'required':''} ${kind==='number'?'step="any"':''}>`}</div>`;const companyOpts=db.operating_units.map(c=>({value:c.id,label:c.name}));const projectOpts=db.projects.map(p=>({value:p.id,label:p.name}));const employeeOpts=[{value:currentUser.name,label:currentUser.name},...db.employees.map(e=>({value:e.name,label:e.name}))];const warehouseOpts=db.warehouses.map(w=>({value:w.id,label:w.name}));const materialOpts=db.materials.map(m=>({value:m.id,label:m.name+' (tồn '+m.stock+')'}));const voucherOpts=db.vouchers.map(v=>({value:v.id,label:v.number||v.name}));const statusOpts=['Chờ duyệt','Đã duyệt','Đã chi','Từ chối'].map(x=>({value:x,label:x}));
switch(type){case'company':fields=f('name','Tên đơn vị','text',item?.name||'',null,true)+f('group','Group','select',item?.group||'WePlus Group',['WePlus Group','WeWall Group'].map(x=>({value:x,label:x})),true)+f('leader','Người phụ trách','text',item?.leader||'',null,true)+f('legal','Pháp nhân','text',item?.legal||'')+f('industry','Ngành nghề','text',item?.industry||'')+f('count','Số nhân sự','number',item?.count??'')+f('color','Màu nhận diện','text',item?.color||'#C9A227')+f('short','Monogram','text',item?.short||'',null,true);break;
case'project':fields=f('name','Tên dự án','text',item?.name||'',null,true)+f('companyId','Đơn vị','select',item?.companyId||extra||db.operating_units[0]?.id,companyOpts,true)+f('owner','Người phụ trách chính','text',item?.owner||'',null,true)+f('status','Trạng thái','select',item?.status||'Đang chuẩn bị',['Đang chuẩn bị','Đang thực hiện','Đã hoàn thành','Trễ hạn','Tạm dừng'].map(x=>({value:x,label:x})),true)+f('start','Ngày bắt đầu','date',item?.start||'')+f('end','Ngày kết thúc','date',item?.end||'')+f('progress','Tiến độ (%)','number',item?.progress??'')+f('budget','Ngân sách (VND)','number',item?.budget??'')+f('note','Ghi chú','textarea',item?.note||'',null,false,true);break;
case'task':fields=f('name','Tên công việc','text','',null,true)+f('projectId','Dự án','select',extra||db.projects[0]?.id,projectOpts,true)+f('owner','Người phụ trách','text',currentUser.name,null,true)+f('due','Hạn hoàn thành','date',today())+f('status','Trạng thái','select','Chưa bắt đầu',['Chưa bắt đầu','Đang thực hiện','Hoàn thành'].map(x=>({value:x,label:x})))+f('note','Ghi chú','textarea','',null,false,true);break;
case'employee':fields=f('name','Họ và tên','text',item?.name||'',null,true)+f('companyId','Đơn vị','select',item?.companyId||db.operating_units[0]?.id,companyOpts,true)+f('position','Chức vụ','text',item?.position||'')+f('phone','Số điện thoại','tel',item?.phone||'')+f('email','Email','email',item?.email||'')+f('birthDate','Ngày sinh','date',item?.birthDate||'')+f('startDate','Ngày vào làm','date',item?.startDate||'');break;
case'client':fields=f('name','Tên khách hàng / đối tác','text',item?.name||'',null,true)+f('companyId','Đơn vị phụ trách','select',item?.companyId||db.operating_units[0]?.id,companyOpts,true)+f('industry','Ngành','text',item?.industry||'')+f('contact','Người liên hệ','text',item?.contact||'')+f('history','Lịch sử làm việc','textarea',item?.history||'',null,false,true);break;
case'supplier':fields=f('name','Tên nhà cung cấp','text','',null,true)+f('category','Nhóm hàng / dịch vụ','text','')+f('contact','Người liên hệ','text','')+f('phone','Điện thoại','tel','')+f('email','Email','email','')+f('note','Ghi chú','textarea','',null,false,true);break;
case'material':fields=f('name','Tên vật tư','text',item?.name||'',null,true)+f('category','Nhóm vật tư','select',item?.category||'Gỗ',['Gỗ','Sắt và inox','Sơn','Nhôm kính','Vật tư sự kiện'].map(x=>({value:x,label:x})),true)+f('warehouseId','Kho','select',item?.warehouseId||'wh-workshop',warehouseOpts,true)+f('opening','Tồn đầu kỳ','number',item?.opening??0,null,true)+f('stock','Tồn hiện tại','number',item?.stock??0,null,true);break;
case'movement':fields=f('type','Loại giao dịch','select','Nhập',[{value:'Nhập',label:'Nhập kho'},{value:'Xuất',label:'Xuất kho'}],true)+f('materialId','Vật tư','select',db.materials[0]?.id,materialOpts,true)+f('warehouseId','Kho','select',db.materials[0]?.warehouseId||'wh-workshop',warehouseOpts,true)+f('quantity','Số lượng','number','',null,true)+f('projectId','Dự án nhận (nếu xuất)','select','',[{value:'',label:'Không gắn dự án'},...projectOpts])+f('date','Ngày','date',today(),null,true)+f('note','Ghi chú','textarea','',null,false,true);break;
case'budget':fields=f('name','Tên hạng mục dự trù','text','',null,true)+f('companyId','Đơn vị','select',db.operating_units[0]?.id,companyOpts,true)+f('projectId','Dự án','select',extra||'', [{value:'',label:'Không gắn dự án'},...projectOpts])+f('amount','Số tiền dự trù (VND)','number','',null,true)+f('status','Trạng thái','select','Đang theo dõi',[{value:'Đang theo dõi',label:'Đang theo dõi'},{value:'Đã duyệt',label:'Đã duyệt'}]);break;
case'voucher':fields=f('name','Tên chứng từ','text','',null,true)+f('kind','Loại biểu mẫu','select','expense',FORMS.map(([value,label])=>({value,label})),true)+f('companyId','Đơn vị','select',db.operating_units[0]?.id,companyOpts,true)+f('projectId','Dự án','select',extra||'', [{value:'',label:'Không gắn dự án'},...projectOpts])+f('budgetItemId','Hạng mục dự trù','select','',[{value:'',label:'Không gắn hạng mục'},...db.budget_items.map(b=>({value:b.id,label:b.name}))])+f('amount','Số tiền (VND)','number','',null,true)+f('note','Diễn giải','textarea','',null,false,true);break;
case'payment':fields=f('name','Nội dung thanh toán','text','',null,true)+f('voucherId','Chứng từ','select',db.vouchers[0]?.id||'',voucherOpts,true)+f('amount','Số tiền (VND)','number','',null,true)+f('date','Ngày thanh toán','date',today(),null,true)+f('status','Trạng thái','select','Đã ghi nhận',[{value:'Đã ghi nhận',label:'Đã ghi nhận'},{value:'Chờ thanh toán',label:'Chờ thanh toán'}]);break;
case'leave':fields=f('employeeName','Nhân sự','text',currentUser.name,null,true)+f('type','Loại nghỉ','select','Phép năm',['Phép năm','Nghỉ không lương','Nghỉ ốm','Khác'].map(x=>({value:x,label:x})))+f('start','Từ ngày','date',today(),null,true)+f('end','Đến ngày','date',today(),null,true)+f('reason','Lý do','textarea','',null,true,true);break;
case'daily':fields=f('name','Công việc','text','',null,true)+f('date','Ngày','date',today(),null,true)+f('team','Tổ / đơn vị','text','')+f('projectId','Dự án','select','',[{value:'',label:'Không gắn dự án'},...projectOpts])+f('owner','Người phụ trách','text',currentUser.name,null,true)+f('status','Trạng thái','select','Chưa bắt đầu',['Chưa bắt đầu','Đang thực hiện','Hoàn thành'].map(x=>({value:x,label:x})))+f('note','Ghi chú','textarea','',null,false,true);break;
case'notification':fields=f('title','Tiêu đề','text','',null,true)+f('body','Nội dung','textarea','',null,true,true)+f('date','Ngày','date',today());break;
case'legal':fields=f('name','Tên pháp nhân','text','',null,true)+f('taxCode','Mã số thuế','text','')+f('address','Địa chỉ','text',CONFIG.ORG.hq)+f('phone','Điện thoại','tel','')+f('email','Email','email','');break;
}
showModal(title,`<form id="record-form" onsubmit="event.preventDefault();saveRecord()"><div class="form-grid">${fields}</div><input type="hidden" name="__type" value="${type}"><input type="hidden" name="__id" value="${id||''}"><input type="hidden" name="__extra" value="${extra||''}"></form>`,true)}
function showModal(title,body,withForm=false){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="btn small" onclick="closeModal()">Đóng ×</button></div><div class="modal-body">${body}</div>${withForm?'<div class="modal-foot"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="document.getElementById(\'record-form\').requestSubmit()">Lưu bản ghi</button></div>':''}</div></div>`}function closeModal(){document.getElementById('modal-root').innerHTML='';modalState=null}
function saveRecord(){let form=document.getElementById('record-form');if(!form.reportValidity())return;let fd=new FormData(form),x=Object.fromEntries(fd.entries()),type=x.__type,id=x.__id,extra=x.__extra;delete x.__type;delete x.__id;delete x.__extra;for(let k of ['count','progress','budget','amount','opening','stock','quantity'])if(x[k]!==undefined&&x[k]!=='')x[k]=Number(x[k]);else if(x[k]==='')x[k]=null;if(x.start&&x.end&&x.end<x.start){toast('Ngày kết thúc không được trước ngày bắt đầu.');return}if(type==='project'&&(!(Number(x.budget)>0))){toast('Ngân sách dự án phải lớn hơn 0.');return}if(type==='project'&&x.progress!=null&&(x.progress<0||x.progress>100)){toast('Tiến độ phải từ 0 đến 100%.');return}if(type==='project'&&x.budget==null){toast('Ngân sách dự án phải lớn hơn 0.');return}
let coll=({company:'operating_units',project:'projects',employee:'employees',client:'clients',supplier:'suppliers',material:'materials',task:'tasks',budget:'budgets',voucher:'vouchers',payment:'payments',leave:'leave_requests',daily:'daily_plans',notification:'notifications',legal:'legal_entities'})[type];if(type==='movement'){let m=db.materials.find(a=>a.id===x.materialId);if(!m){toast('Không tìm thấy vật tư.');return}if(x.type==='Xuất'&&Number(x.quantity)>m.stock){toast(`Không thể xuất ${x.quantity}; tồn hiện tại chỉ ${m.stock}.`);return}if(!(Number(x.quantity)>0)){toast('Số lượng phải lớn hơn 0.');return}m.stock+=x.type==='Nhập'?Number(x.quantity):-Number(x.quantity);let rec={id:uid('move'),...x,quantity:Number(x.quantity),user:currentUser.name};db.stock_movements.push(rec);audit(x.type==='Nhập'?'Nhập kho':'Xuất kho','stock_movements',rec.id,`${m.name}: ${x.quantity}; tồn mới ${m.stock}`);closeModal();render();toast('Đã ghi nhận giao dịch kho.');return}
if(type==='voucher'){x.id=id||uid('vch');x.number='CT-'+String(db.vouchers.length+1).padStart(4,'0');x.status='Chờ duyệt';x.createdBy=currentUser.name;x.createdAt=today();}if(type==='leave'){if(x.end<x.start){toast('Ngày kết thúc không được trước ngày bắt đầu.');return}x.id=id||uid('leave');x.employeeId=x.employeeName;x.status='Chờ duyệt';x.createdAt=today()}if(type==='daily')x.id=id||uid('daily');if(type==='notification'){x.id=id||uid('notice');x.author=currentUser.name}if(type==='task'){x.id=id||uid('task');x.projectId=x.projectId||extra}if(type==='payment')x.id=id||uid('payment');if(type==='budget'){x.id=id||uid('budget');x.spent=0}if(type==='legal')x.id=id||uid('legal');if(type==='company'){x.id=id||uid('unit');x.count=x.count==null?null:x.count;x.clients=[];x.shared=false}if(type==='project'){x.id=id||uid('project');x.progress=x.progress==null?null:x.progress;x.budget=Number(x.budget);x.note=x.note||'';if(!x.name.trim()){toast('Tên dự án là bắt buộc.');return}}if(type==='employee')x.id=id||uid('emp');if(type==='client'){x.id=id||uid('client');x.source='Người dùng nhập'}if(type==='supplier')x.id=id||uid('supplier');if(type==='material'){x.id=id||uid('mat');x.illustrative=false}
if(!coll){toast('Không xác định được loại bản ghi.');return}let existing=id?db[coll].findIndex(z=>z.id===id):-1;if(existing>=0){db[coll][existing]={...db[coll][existing],...x};audit('Sửa',coll,id,`Cập nhật ${x.name||x.title||x.employeeName||id}`)}else{db[coll].push(x);audit('Tạo',coll,x.id,`Tạo ${x.name||x.title||x.employeeName||type}`)}if(type==='project'&&x.companyId){let c=db.operating_units.find(c=>c.id===x.companyId);if(c)c.projectCount=db.projects.filter(p=>p.companyId===c.id).length}closeModal();render();toast('Đã lưu bản ghi.')}
function approveVoucher(id){let v=db.vouchers.find(x=>x.id===id);if(!v||v.status!=='Chờ duyệt')return;if(!(Number(v.amount)>0)){toast('Số tiền chứng từ phải lớn hơn 0.');return}v.status='Đã duyệt';v.approvedBy=currentUser.name;v.approvedAt=new Date().toISOString();if(v.budgetItemId){let b=db.budget_items.find(x=>x.id===v.budgetItemId);if(b)b.spent=(b.spent||0)+Number(v.amount)}if(v.projectId){let p=db.projects.find(x=>x.id===v.projectId);if(p){p.spent=(p.spent||0)+Number(v.amount);let b=db.budgets.find(x=>x.projectId===p.id);if(b)b.spent=(b.spent||0)+Number(v.amount)}}audit('Duyệt','vouchers',id,`Đã duyệt ${v.number} số tiền ${fmtMoney(v.amount)}; cập nhật đã chi theo dự án / hạng mục nếu có liên kết`);render();toast('Đã duyệt chứng từ và cập nhật số đã chi nếu có liên kết ngân sách.')}
function rejectVoucher(id){let v=db.vouchers.find(x=>x.id===id);if(!v)return;v.status='Từ chối';audit('Từ chối','vouchers',id,v.number);render();toast('Đã từ chối chứng từ.')}
function decideLeave(id,statusValue){let l=db.leave_requests.find(x=>x.id===id);if(!l)return;l.status=statusValue;audit(statusValue==='Đã duyệt'?'Duyệt đơn nghỉ phép':'Từ chối đơn nghỉ phép','leave_requests',id,`${l.employeeName}: ${fmtDate(l.start)} – ${fmtDate(l.end)}`);render();toast('Đã cập nhật trạng thái đơn nghỉ phép.')}
function punchClock(mode){let date=today(),name=currentUser.name,rec=db.attendance_records.find(a=>a.date===date&&(a.employeeName||a.employeeId)===name);if(!rec){rec={id:uid('att'),date,employeeId:name,employeeName:name,companyId:currentUser.companyId};db.attendance_records.push(rec)}let time=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',hour12:false});if(mode==='out'||(!mode&&rec.checkIn&&!rec.checkOut)){rec.checkOut=time;audit('Ra ca','attendance_records',rec.id,`${name} ra ca lúc ${time}`);toast('Đã ghi nhận ra ca lúc '+time)}else{if(rec.checkIn){toast('Đã có giờ vào ca hôm nay.');return}rec.checkIn=time;audit('Vào ca','attendance_records',rec.id,`${name} vào ca lúc ${time}`);toast('Đã ghi nhận vào ca lúc '+time)}render()}
function saveSettings(){db.settings.holidays=Number(document.getElementById('setting-holidays').value)||11;db.settings.overtime15=Number(document.getElementById('setting-ot15').value)||1.5;db.settings.overtime20=Number(document.getElementById('setting-ot20').value)||2;let lim=document.getElementById('setting-limit').value;db.settings.approvalLimit=lim===''?null:Number(lim);audit('Cập nhật','settings','settings','Cập nhật cài đặt');render();toast('Đã lưu cài đặt.')}

function animateKPIs(){document.querySelectorAll('[data-count]').forEach(el=>{let target=Number(el.dataset.count)||0;if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=target.toLocaleString('vi-VN');return}let t0=null,dur=900;function step(t){if(t0==null)t0=t;let p=Math.max(0,Math.min(1,(t-t0)/dur)),e=1-Math.pow(1-p,3);el.textContent=Math.round(target*e).toLocaleString('vi-VN');if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)})}

const BOD_MEMBERS=['Nguyễn Bình An Tâm','Đào Thế Kiệt','Nguyễn Huỳnh Ngọc Hà','Nguyễn Ngọc Hoàng Thái Bảo','Lê Thị Cẩm Phượng','Võ Thị Ngọc Hạnh','Trần Thị Nam Mỹ','Lê Thị Phương Hà','Nguyễn Quang Minh'];
function daysUntil(d){if(!d)return null;let t=new Date(today()+'T00:00:00'),x=new Date(d+'T00:00:00');if(isNaN(x))return null;return Math.round((x-t)/86400000)}
function nextBirthdayIn(e){if(!e.birthDate)return null;let b=new Date(e.birthDate+'T00:00:00');if(isNaN(b))return null;let t=new Date(today()+'T00:00:00'),n=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());return Math.round((n-t)/86400000)}
function attentionItems(){let items=[],T=today();
db.tasks.filter(t=>t.due&&t.due<T&&t.status!=='Hoàn thành').forEach(t=>items.push({tag:'VIỆC QUÁ HẠN',label:t.name,sub:'Phụ trách: '+(t.owner||'—')+' · Hạn '+fmtDate(t.due),action:"go('tasks')"}));
db.projects.filter(p=>p.end&&p.end<T&&p.status!=='Đã hoàn thành').forEach(p=>items.push({tag:'DỰ ÁN TRỄ',label:p.name,sub:companyName(p.companyId)+' · Kết thúc '+fmtDate(p.end),action:`openProject('${p.id}')`}));
let pv=db.vouchers.filter(v=>v.status==='Chờ duyệt');if(pv.length)items.push({tag:'CHỨNG TỪ',label:pv.length+' chứng từ đang chờ duyệt',sub:pv.map(v=>v.number).join(', '),action:"go('vouchers')"});
let pl=db.leave_requests.filter(x=>x.status==='Chờ duyệt');if(pl.length)items.push({tag:'NGHỈ PHÉP',label:pl.length+' đơn nghỉ phép đang chờ duyệt',sub:pl.map(x=>x.employeeName).join(', '),action:"go('leave')"});
db.materials.filter(m=>Number(m.stock)<10).forEach(m=>items.push({tag:'TỒN KHO THẤP',label:m.name,sub:'Tồn hiện tại: '+m.stock+' '+(m.unit||''),action:"go('materials')"}));
db.employees.forEach(e=>{let d=nextBirthdayIn(e);if(d!=null&&d<=7)items.push({tag:'SINH NHẬT',label:'Sinh nhật '+e.name,sub:companyName(e.companyId)+' · '+(d===0?'Hôm nay':'Còn '+d+' ngày'),action:`openEmployee('${e.id}')`})});
(db.meetings||[]).forEach(m=>{let d=daysUntil(m.date);if(d!=null&&d>=0&&d<=7)items.push({tag:'CUỘC HỌP',label:m.title,sub:fmtDate(m.date)+' · '+(m.time||''),action:`openMeeting('${m.id}')`})});
(db.contracts||[]).forEach(c=>{let d=daysUntil(c.endDate);if(d!=null&&d>=0&&d<=30)items.push({tag:'HỢP ĐỒNG',label:c.code+' — '+c.partner,sub:'Hết hạn '+fmtDate(c.endDate)+' (còn '+d+' ngày)',action:"go('contracts')"})});
return items}

function okrCreate(){let t=document.getElementById('ok-title').value.trim();if(!t)return toast('Nhập mục tiêu');let lv=document.getElementById('ok-level').value,isUnit=db.operating_units.some(c=>c.id===lv);let pv=document.getElementById('ok-prog').value;db.okrs=db.okrs||[];db.okrs.push({id:uid('okr'),title:t,level:isUnit?companyName(lv):lv,companyId:isUnit?lv:'',progress:pv===''?null:Math.max(0,Math.min(100,Number(pv))),krs:document.getElementById('ok-krs').value.split('\n').map(x=>x.trim()).filter(Boolean)});saveDB();toast('Đã thêm mục tiêu');render()}
function renderCashflow(){let ps=db.projects.filter(p=>p.budget!=null);let tb=ps.reduce((a,p)=>a+Number(p.budget||0),0),ts=ps.reduce((a,p)=>a+Number(p.spent||0),0);let max=Math.max(1,...ps.map(p=>Number(p.budget||0)));let months={};db.payments.forEach(p=>{let k=(p.date||'').slice(0,7);if(k)months[k]=(months[k]||0)+Number(p.amount||0)});let mk=Object.keys(months).sort();let approved=db.vouchers.filter(v=>v.status==='Đã duyệt').reduce((a,v)=>a+Number(v.amount||0),0);return `${pageHead('Ngân sách & dòng tiền','Dự trù đối chiếu đã chi theo dự án; dòng tiền thực tế ghi nhận từ các khoản thanh toán.','')}<div class="grid kpis"><div class="kpi"><div class="kpi-top">TỔNG DỰ TRÙ</div><div class="kpi-num" style="font-size:19px">${fmtMoney(tb)}</div><div class="kpi-foot">${ps.length} dự án có dự trù</div></div><div class="kpi"><div class="kpi-top">TỔNG ĐÃ CHI</div><div class="kpi-num" style="font-size:19px">${fmtMoney(ts)}</div><div class="kpi-foot">${tb?Math.round(ts/tb*100):0}% dự trù</div></div><div class="kpi"><div class="kpi-top">CÒN LẠI</div><div class="kpi-num" style="font-size:19px">${fmtMoney(tb-ts)}</div></div><div class="kpi"><div class="kpi-top">ĐÃ DUYỆT CHƯA THANH TOÁN</div><div class="kpi-num" style="font-size:19px">${fmtMoney(approved)}</div><div class="kpi-foot">Nhu cầu chi gần nhất</div></div></div><div class="panel"><div class="panel-head"><h3>DỰ TRÙ VS ĐÃ CHI THEO DỰ ÁN</h3></div><div class="table-wrap"><table><thead><tr><th>DỰ ÁN</th><th>ĐƠN VỊ</th><th>DỰ TRÙ</th><th>ĐÃ CHI</th><th>% DÙNG</th><th>SO SÁNH</th></tr></thead><tbody>${ps.map(p=>{let pct=p.budget?Math.round(Number(p.spent||0)/Number(p.budget)*100):0;return `<tr><td><b style="cursor:pointer" onclick="openProject('${p.id}')">${esc(p.name)}</b></td><td>${esc(companyName(p.companyId))}</td><td>${fmtMoney(p.budget)}</td><td>${fmtMoney(p.spent||0)}</td><td>${status(pct>=90?'Đã dùng '+pct+'%':'Đã dùng '+pct+'%')}</td><td><div class="cf-bar"><i class="bar-grow" style="width:${Math.round(Number(p.budget||0)/max*100)}%;background:#B8B2A0"></i></div><div class="cf-bar" style="margin-top:4px"><i class="bar-grow" style="width:${Math.round(Number(p.spent||0)/max*100)}%;background:${pct>=90?'#C62828':'#2E7D32'}"></i></div></td></tr>`}).join('')||'<tr><td colspan="6">Chưa có dự án nào có số dự trù.</td></tr>'}</tbody></table></div></div><div class="panel" style="margin-top:14px"><div class="panel-head"><h3>DÒNG TIỀN RA THỰC TẾ THEO THÁNG</h3><span class="sub">Từ thanh toán đã ghi nhận</span></div>${mk.length?`<div class="bars">${mk.map(k=>`<div class="bar-col"><div class="bar-val">${fmtMoney(months[k])}</div><div class="bar-track"><i class="bar-up" style="height:${Math.max(6,Math.round(months[k]/Math.max(...Object.values(months))*100))}%"></i></div><div class="bar-lab">${k.slice(5)}/${k.slice(0,4)}</div></div>`).join('')}</div>`:'<div class="empty">Chưa có thanh toán nào được ghi nhận.</div>'}</div>`}

function renderRisks(){let all=[...autoRisks(),...(db.risks||[]).map(r=>({...r,src:'Thủ công'}))];let L=['Thấp','Trung bình','Cao'];let cell=(lk,im)=>{let n=all.filter(r=>r.likelihood===lk&&r.impact===im).length;let bg=lk==='Cao'&&im==='Cao'?'#F6D5D2':(lk==='Thấp'&&im==='Thấp')?'#E4EFE2':(lk==='Cao'||im==='Cao')?'#FBEED3':'#F5F1E3';return `<div class="heat-cell" style="background:${bg}">${n?n+' rủi ro':'—'}<div style="font-weight:600;font-size:10px;color:#6d6a5e;margin-top:4px">${lk} × ${im}</div></div>`};return `${pageHead('Rủi ro & bản đồ nhiệt','Sổ rủi ro toàn Group: tín hiệu tự động từ dữ liệu vận hành và rủi ro ghi nhận thủ công.',btn('＋ Thêm rủi ro','document.getElementById(\'risk-form\').style.display=document.getElementById(\'risk-form\').style.display===\'none\'?\'block\':\'none\'','primary'))}<div class="grid two"><div class="panel"><div class="panel-head"><h3>BẢN ĐỒ NHIỆT (KHẢ NĂNG × ẢNH HƯỞNG)</h3></div><div class="heat">${L.slice().reverse().map(lk=>L.map(im=>cell(lk,im)).join('')).join('')}</div></div><div class="panel" id="risk-form" style="display:none"><div class="panel-head"><h3>THÊM RỦI RO</h3></div><div class="form-grid"><div class="field span2"><label>Tên rủi ro *</label><input id="rk-name"></div><div class="field"><label>Đơn vị</label><select id="rk-comp"><option value="">Toàn Group</option>${db.operating_units.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Người phụ trách</label><input id="rk-owner"></div><div class="field"><label>Khả năng</label><select id="rk-lk"><option>Thấp</option><option selected>Trung bình</option><option>Cao</option></select></div><div class="field"><label>Mức ảnh hưởng</label><select id="rk-im"><option>Thấp</option><option selected>Trung bình</option><option>Cao</option></select></div><div class="field span2"><label>Biện pháp xử lý</label><textarea id="rk-mit"></textarea></div></div><div style="margin-top:10px">${btn('Lưu rủi ro','riskCreate()','primary')}</div></div></div><div class="panel" style="margin-top:14px"><div class="panel-head"><h3>SỔ RỦI RO</h3><span class="sub">${all.length} rủi ro</span></div><div class="table-wrap"><table><thead><tr><th>RỦI RO</th><th>ĐƠN VỊ</th><th>KHẢ NĂNG</th><th>ẢNH HƯỞNG</th><th>NGUỒN</th><th>PHỤ TRÁCH</th><th>BIỆN PHÁP</th></tr></thead><tbody>${all.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.companyId?esc(companyName(r.companyId)):'Toàn Group'}</td><td>${status(r.likelihood)}</td><td>${status(r.impact)}</td><td>${esc(r.src||'Thủ công')}</td><td>${esc(r.owner||'—')}</td><td>${esc(r.mitigation||'—')}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có rủi ro nào.</td></tr>'}</tbody></table></div></div>`}

}</td><td>${btn('Sửa',`ctrEdit('${c.id}')`,'small')} ${btn('Xóa',`ctrDel('${c.id}')`,'small')}</td></tr>`}).join('')||'<tr><td colspan="8">Chưa có hợp đồng nào.</td></tr>'}</tbody></table></div></div>`}

function renderOrgchart(){let total=db.employees.length;let unitNode=c=>{let emps=db.employees.filter(e=>e.companyId===c.id);return `<div class="org-node" style="border-left:5px solid ${c.color}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><b style="cursor:pointer" onclick="openCompany('${c.id}')">${esc(c.name)}</b><div class="sub">Đứng đầu: ${esc(c.leader||'—')} · ${emps.length} nhân sự</div></div><button class="btn small" onclick="orgOpen['${c.id}']=!orgOpen['${c.id}'];render()">${orgOpen[c.id]?'Thu gọn':'Nhân sự'}</button></div>${orgOpen[c.id]?`<div class="list" style="margin-top:8px">${emps.map(e=>`<div class="list-row" style="cursor:pointer" onclick="openEmployee('${e.id}')"><div class="person"><div class="avatar">${initials(e.name)}</div><div><strong>${esc(e.name)}</strong><small>${esc(e.position||'')}</small></div></div></div>`).join('')||'<div class="sub">Chưa có nhân sự trong danh bạ.</div>'}</div>`:''}</div>`};
let wp=db.operating_units.filter(c=>c.group==='WePlus Group'),ww=db.operating_units.filter(c=>c.group==='WeWall Group'),bo=db.employees.filter(e=>!e.companyId);
return `${pageHead('Sơ đồ tổ chức','Cây tổ chức Tgroup theo dữ liệu thật: Group, đơn vị, người đứng đầu và nhân sự. Bấm vào đơn vị để mở trang Công ty 360°.','')}<div class="org-node" style="background:linear-gradient(120deg,#082A1B,#0E3A26);color:#fff"><b style="font-size:16px">TGROUP ECOSYSTEM</b><div style="color:#D9C98A;font-size:11.5px;margin-top:3px">Chủ tịch: Nguyễn Bình An Tâm · ${total} nhân sự · ${db.operating_units.length} đơn vị thành viên</div></div><div class="org-kids"><div class="org-node" style="border-left:5px solid #C9A227"><b>WEPLUS GROUP</b><div class="sub">${wp.reduce((a,c)=>a+db.employees.filter(e=>e.companyId===c.id).length,0)} nhân sự · ${wp.length} đơn vị</div><div class="org-kids">${wp.map(unitNode).join('')}</div></div><div class="org-node" style="border-left:5px solid #6B4F2E"><b>WEWALL GROUP</b><div class="sub">${ww.reduce((a,c)=>a+db.employees.filter(e=>e.companyId===c.id).length,0)} nhân sự · ${ww.length} đơn vị</div><div class="org-kids">${ww.map(unitNode).join('')}</div></div><div class="org-node" style="border-left:5px solid #8A877D"><b>KHỐI DÙNG CHUNG</b><div class="sub">${bo.length} nhân sự · ${DEPARTMENTS.length} phòng/ban</div><div class="org-kids">${DEPARTMENTS.map(d=>`<div class="org-node"><b>${esc(d.name)}</b><div class="sub">${d.members.map(esc).join(' · ')}</div></div>`).join('')}${bo.map(e=>`<div class="org-node" style="cursor:pointer" onclick="openEmployee('${e.id}')"><b>${esc(e.name)}</b><div class="sub">${esc(e.position||'')}</div></div>`).join('')}</div></div></div>`}
function renderPipeline(){let cols=[['Đang có dự án triển khai',[]],['Khách hàng / Đối tác hiện hữu',[]],['Đã hoàn tất dự án',[]]];db.clients.forEach(cl=>{let ps=db.projects.filter(p=>p.companyId===cl.companyId);let col=ps.some(p=>['Đang thực hiện','Đang chuẩn bị'].includes(p.status))?0:(ps.some(p=>p.status==='Đã hoàn thành')?2:1);cols[col][1].push({cl,ps})});return `${pageHead('Pipeline khách hàng','Khách hàng được xếp theo trạng thái dự án thực tế với đơn vị phục vụ.','')}<div class="pipe-grid">${cols.map(([name,items])=>`<div class="pipe-col"><div style="display:flex;justify-content:space-between"><b>${name}</b><span class="tag" style="font-size:10px;font-weight:800;padding:2px 8px;border-radius:12px;background:#F3E9C8;color:#8A6D1F">${items.length}</span></div>${items.map(({cl,ps})=>`<div class="pipe-card" onclick="${ps.length?`openProject('${ps[0].id}')`:"go('clients')"}"><b>${esc(cl.name)}</b><div class="sub">Đơn vị phục vụ: ${esc(companyName(cl.companyId))}</div>${ps.length?`<div class="sub" style="margin-top:4px">Dự án: ${ps.map(p=>esc(p.name)).join(' · ')}</div>`:'<div class="sub" style="margin-top:4px">Chưa gắn dự án</div>'}</div>`).join('')||'<div class="empty">Chưa có khách hàng ở trạng thái này.</div>'}</div>`).join('')}</div>`}

function boot(){saveDB();document.getElementById('app').innerHTML=shell();if(loginVisible)renderLogin();else document.getElementById('modal-root').innerHTML='';}
boot();
</script></body></html>
