HB_DATA.wewall.chapters.push(['Quy định chấm công, nghỉ phép và kỷ luật lao động (The Wall)',["Nguồn: văn bản của Công ty TNHH Kiến Trúc Xây Dựng The Wall — nạp vào hệ thống ngày 22/10/2026.", "CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM", "Độc lập - Tự do - Hạnh phúc", "---------------***---------------", "QUY ĐỊNH CHẤM CÔNG, NGHỈ PHÉP VÀ KỶ LUẬT LAO ĐỘNG", "CHƯƠNG I: QUY ĐỊNH VỀ CHẤM CÔNG VÀ THỜI GIAN LÀM VIỆC", "Điều 1: Thời giờ làm việc chính thức", "- Thời gian làm việc: Từ Thứ Hai đến hết Sáng Thứ Bảy.", "- Buổi sáng: Từ 08:30 đến 12:00.", "- Nghỉ trưa: Từ 12:00 đến 13:00 (Nghỉ giữa ca không tính vào giờ làm việc).", "- Buổi chiều: Từ 13:00 đến 17:30.", "Điều 2: Quy định về chấm công", "- Tất cả cán bộ nhân viên (CBNV) bắt buộc phải thực hiện chấm công khi đến văn phòng và khi ra về thông qua hệ thống máy quét vân tay.", "- Số ca công và giờ công thực tế hiển thị trên hệ thống là căn cứ để tính lương hàng tháng.", "- Trường hợp quên chấm công do lỗi chủ quan, hoặc đi công trình bên ngoài, CBNV phải gửi đơn xác nhận công được ký duyệt bởi quản lý trực tiếp trong vòng 24 giờ kể từ thời điểm phát sinh lỗi.", "CHƯƠNG II: QUY ĐỊNH VỀ NGHỈ PHÉP, NGHỈ LỄ VÀ VIỆC RIÊNG", "Điều 3: Nghỉ phép năm hưởng lương", "- Mỗi CBNV ký hợp đồng lao động chính thức có 12 ngày phép năm hưởng nguyên lương đối với một năm làm việc. Nhân viên làm việc chưa đủ năm thì số ngày phép được tính theo tỷ lệ tháng làm việc thực tế.", "- Ngày phép năm không dùng hết trong năm sẽ được bảo lưu tối đa đến ngày 31/03 của năm kế tiếp.", "Điều 4: Quy trình và thời hạn báo trước khi nghỉ phép", "- Nghỉ dưới 01 ngày: Phải gửi đơn xin phép và được duyệt trước tối thiểu 24 giờ.", "- Nghỉ từ 02 đến 03 ngày liên tiếp: Phải gửi đơn xin phép và được duyệt trước tối thiểu 03 ngày làm việc.", "- Nghỉ từ 04 ngày liên tiếp trở lên hoặc nghỉ dài ngày: Phải gửi đơn xin phép và được duyệt trước tối thiểu 07 ngày làm việc.", "- Các trường hợp đột xuất do tai nạn, ốm đau cấp tính phải thông báo trực tiếp qua điện thoại cho quản lý trực tiếp trước 08:30 sáng của ngày nghỉ và bổ sung giấy tờ y tế hợp lệ sau khi đi làm trở lại.", "CHƯƠNG III: HÌNH THỨC KỶ LUẬT LAO ĐỘNG VÀ XỬ LÝ VI PHẠM", "Điều 5: Hành vi đi trễ, về sớm và tự ý nghỉ việc", "- Đi trễ hoặc về sớm không có lý do chính đáng được xác nhận bởi cấp trên được coi là vi phạm nội quy lao động.", "- Vi phạm quá 03 lần/tháng sẽ bị hạ bậc thi đua xét thưởng tháng. Thời gian thiếu hụt do đi trễ, về sớm sẽ bị trừ vào quỹ thời gian tính lương tương ứng.", "- Tự ý nghỉ việc không phép 03 ngày liên tiếp hoặc 05 ngày cộng dồn trong vòng 01 tháng mà không có lý do bất khả kháng sẽ chịu hình thức xử lý kỷ luật cao nhất là Sa thải theo đúng Bộ Luật Lao động hiện hành.", "Điều 6: Thẩm quyền và các hình thức xử lý kỷ luật", "CHƯƠNG IV: ĐIỀU KHOẢN THI HÀNH", "Điều 7: Hiệu lực và trách nhiệm", "- Quy định này có hiệu lực thi hành kể từ ngày ký phát hành chính thức.", "- Toàn thể cán bộ nhân viên công ty có trách nhiệm tìm hiểu, quán triệt và nghiêm túc chấp hành nghiêm chỉnh các điều khoản trong văn bản này.", "Ngày ..... tháng ..... năm 2026", "Cấp độ | Hành vi vi phạm | Hình thức xử lý kỷ luật áp dụng", "Cấp độ 1 | Đi muộn/về sớm từ 4 lần/tháng trở lên; | Khiển trách bằng lời nói trực tiếp, ghi nhận biên bản nhắc nhở.", "Cấp độ 2 | Tái diễn vi phạm cấp độ 1; không hoàn thành tiến độ công việc được giao quá 2 lần không có lý do. | Khiển trách bằng văn bản gửi toàn phòng ban, cắt thưởng thi đua.", "Cấp độ 3 | Gây thiệt hại tài sản công ty (dưới 5 triệu VNĐ); có hành vi xúc phạm đồng nghiệp, khách hàng. | Kéo dài thời hạn nâng lương không quá 06 tháng hoặc chuyển làm công việc khác.", "Cấp độ 4 | Nghỉ việc tự ý không phép quá thời hạn; gây thiệt hại nghiêm trọng tài sản (>10 triệu VNĐ); tiết lộ bí mật công nghệ kinh doanh. | Áp dụng hình thức Sa thải, chấm dứt hợp đồng lao động ngay lập tức.", "NGƯỜI LẬP BIỂU", "(Ký, ghi rõ họ tên) | BAN GIÁM ĐỐC ĐẠI DIỆN", "(Ký tên, đóng dấu)"]],['Quy chế lương, thưởng và các chế độ phúc lợi (The Wall)',["Nguồn: Quy chế của Công ty TNHH Kiến Trúc Xây Dựng The Wall — nạp vào hệ thống ngày 22/10/2026.", "QUY CHẾ", "LƯƠNG, THƯỞNG VÀ CÁC CHẾ ĐỘ PHÚC LỢI ĐỐI VỚI NHÂN VIÊN CHÍNH THỨC THUỘC CÔNG TY TNHH KIẾN TRÚC XÂY DỰNG THE WALL", "HỘI ĐỒNG THÀNH VIÊN", "Căn cứ vào Bộ Luật Lao Động số: 45/2019/QH14, được Quốc Hội thông qua ngày 20 tháng 11 năm 2019 và có hiệu lực thi hành từ ngày 01 tháng 01 năm 2021;", "Căn cứ vào Nghị định 145/2020/NĐ-CP ngày 14/12/2020 của Chính phủ quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động;", "Căn cứ Luật Doanh nghiệp số 59/2020/QH14 được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam thông qua ngày 17/06/2020; (Nếu công ty là Hội đồng thành viên)", "Căn cứ Điều lệ Công ty TNHH Kiến trúc Xây dựng The Wall;", "Căn cứ vào Quy chế Tài chính ban hành kèm theo quyết định số .........................................................về chế độ Tài chính của Công ty TNHH Kiến trúc Xây dựng The Wall;", "Theo đề nghị của Giám đốc điều hành.", "CHƯƠNG I", "QUY ĐỊNH CHUNG", "Điều 1. Mục đích, đối tượng và phạm vi áp dụng", "Quy chế này quy định các nguyên tắc và các chế độ lương, thưởng phúc lợi của Công ty TNHH Kiến trúc Xây dựng The Wall đối với Cán bộ nhân viên nhằm đảm bảo thực hiện thống nhất chính sách đãi ngộ, công bằng, dân chủ, công khai.", "Điều 2. Giải thích từ ngữ", "Trong Quy chế này, trừ trường hợp ngữ cảnh cụ thể có quy định khác, các từ ngữ bên dưới được hiểu như sau:", "1. Công ty: Công ty TNHH Kiến trúc Xây dựng The Wall.", "2. CBNV: là người lao động đang làm việc dưới hình thức có ký kết hợp đồng lao động với Công ty.", "3. Đơn vị: bao gồm các Phòng ban báo cáo trực tiếp cho Giám Đốc; Chi nhánh; Văn phòng đại diện hoặc các Đơn vị khác do Công ty thành lập từng thời kỳ.", "4. HĐTV: Hội Đồng Thành Viên của Công ty.", "5. GĐ: Giám Đốc của Công ty.", "6. NS: Phòng Nhân sự của Công ty.", "7. Cấp có thẩm quyền phê duyệt: là người có thẩm quyền cao nhất để ra quyết định phê duyệt cuối cùng.", "Điều 3. Cơ cấu tiền lương, thưởng và các chế độ phúc lợi", "1. Tiền lương là khoản tiền công ty trả cho CBNV để thực hiện công việc theo thỏa thuận và là cơ sở để đóng Bảo hiểm xã hội, bao gồm:", "a. Mức lương theo công việc (lương theo hợp đồng): là mức lương được quy định tại Điều 8 Quy chế này.", "b. Phụ cấp: là khoản tiền bù đắp các yếu tố về điều kiện lao động, tính chất phức tạp của công việc, điều kiện sinh hoạt, mức độ thu hút lao động chưa được tính đến hoặc tính chưa đầy đủ trong mức lương theo công việc.", "2. Tiền thưởng: bao gồm thưởng hiệu quả công việc và thưởng doanh thu.", "3. Hỗ trợ: gồm tiền ăn giữa ca, hỗ trợ điện thoại, trang phục, đi lại và nhà ở theo quy định được ghi thành mục riêng trong HĐLĐ, không phải tính đóng BHXH bắt buộc hoặc theo luật quy định. Trường hợp người lao động làm việc không đủ tháng, các khoản hỗ trợ này sẽ được chi trả theo thỏa thuận dựa trên số ngày làm việc thực tế. Riêng đối với những ngày làm việc bên ngoài (outside), nếu đã được quản lý trực tiếp lo chi phí ăn uống thì phần tiền ăn giữa ca của những ngày đó sẽ không được tính.", "4. Các chế độ phúc lợi khác: là những chế độ phúc lợi bằng tiền hoặc không bằng tiền mà CBNV nhận được ngoài các khoản quy định tại Khoản 1 và 2 Điều này nhằm thu hút, khích lệ và giữ chân CBNV.", "Điều 4. Nguyên tắc xây dựng và quản lý tiền lương, thưởng, phúc lợi", "Đảm bảo tính công bằng trong nội bộ Công ty, nâng cao tính cạnh tranh nhằm thu hút, khích lệ và giữ chân CBNV có năng lực tại Công ty.", "Liên kết hệ thống lương, thưởng, phúc lợi với hệ thống quản lý kết quả công việc.", "Thông qua việc chi trả lương, thưởng đến các CBNV có thành tích hiệu quả làm việc tốt.", "Xây dựng quy chế tiền lương, thưởng, phúc lợi căn cứ trên kế hoạch kinh doanh của Công ty, sử dụng hiệu quả ngân sách nhân sự được phê duyệt.", "Mọi trường hợp chưa quy định trong Quy chế này sẽ thực hiện theo phê duyệt của Chủ tịch HĐTV và quy định của pháp luật.", "Mức thưởng doanh thu, thưởng hiệu quả công việc (nếu đạt 100%) của mỗi nhân sự được xác định cụ thể theo phân cấp trách nhiệm công việc hoặc quyết định giao mục tiêu của Ban Giám đốc.", "Điều 5. Cơ sở xây dựng tiền lương, thưởng, phúc lợi", "Hệ thống cấp bậc chức vụ.", "Mô tả công việc.", "Thang bảng lương.", "Hệ thống quản lý kết quả công việc.", "Tham khảo hoặc so sánh với thị trường lao động tương đồng.", "Điều 6. Trách nhiệm của các bên có liên quan", "Phòng nhân sự", "Xây dựng, trình Cấp có thẩm quyền ban hành quy chế, quy định và các chính sách liên quan đến lương, thưởng và phúc lợi.", "Chịu trách nhiệm giải đáp thắc mắc liên quan, lưu trữ văn bản, hỗ trợ CBNV các thủ tục liên quan đúng theo quy định của Công ty và pháp luật Việt Nam.", "Kiến nghị và tham mưu cho Cấp có thẩm quyển các vấn đề liên quan đến chế độ lương, thưởng và phúc lợi trên cơ sở công bằng và hiệu quả.", "Phòng Kế toán Tài chính", "Theo dõi chi phí nhân sự và các chi phí khác có liên quan đến các chế độ đãi ngộ cho CBNV.", "Hướng dẫn Phòng Nhân sự và các phòng ban khác có liên quan xây dựng các chính sách và quản lý chi phí nhân sự theo đúng quy định của Công ty và pháp luật Việt Nam.", "Các đơn vị tại Công ty", "Phối hợp với phòng Nhân sự để thông tin, hướng dẫn CBNV hiểu, áp dụng và tuân thủ các chính sách đãi ngộ.", "Điều 7. Thẩm quyền quyết định mức tiền lương, phụ cấp, hỗ trợ và phúc lợi đối với CBNV", "Lưu ý", "Đề xuất cao hơn chính sách hiện hành: là các đề xuất cao hơn quy định hiện hành hoặc phê duyệt của Cấp có thẩm quyền tại Công ty.", "Đề xuất ngoài chính sách hiện hành: là đề xuất chưa từng được quy định hoặc đối tượng áp dụng không nằm trong phạm vi được đề cập tại bất kỳ quy định hiện hành hoặc phê duyệt nào của Cấp có thẩm quyền tại Công ty.", "Các vị trí thuộc thẩm quyền quyết định của Chủ tịch HĐTV gồm: Phó Tổng Giám Đốc; Kế Toán trưởng; Giám Đốc Tài chính; Phó Giám Đốc/Giám Đốc Khối; Phó Giám Đốc/Giám Đốc Trung tâm; Trưởng phòng thuộc Tổng Giám Đốc; Giám Đốc Chi nhánh, (Tổng) Giám Đốc Công ty con; Trưởng Văn phòng Đại diện; Thư ký Hội đồng Thành viên và các chức danh khác thuộc thẩm quyền của Chủ tịch Hội đồng Thành viên theo quy định của Công ty từng thời kỳ.", "Chương II. LƯƠNG", "Điều 8. Khái niệm và cấu trúc thu nhập", "Tiền lương: là số tiền mà người sử dụng lao động trả cho người lao động theo thỏa thuận để thực hiện công việc, bao gồm mức lương theo công việc, phụ cấp lương và các khoản bổ sung khác (Khoản 1 điều 90 Bộ luật lao động 2019).", "Cấu trúc tổng thu nhập thực nhận:", "Bao gồm Mức lương theo công việc", "Các khoản hỗ trợ/trợ cấp, phúc lợi", "Thưởng doanh thu: Được xác định theo kết quả kinh doanh, số lượng và chất lượng sản phẩm/dịch vụ hoàn thành theo quy định của từng bộ phận.", "Thưởng hiệu quả công việc: Được đánh giá và chi trả dựa trên năng suất, mức độ hoàn thành chỉ tiêu công việc thực tế của người lao động.", "Tăng ca (nếu có).", "Điều 9. Mức lương theo công việc và nguyên tắc tính lương theo thời gian", "Mức lương theo công việc:", "Là mức lương chi trả cho CBNV căn cứ vào số tiền ghi trên Hợp đồng lao động theo vị trí công việc hoặc chức danh.", "Mức lương theo công việc được xây dựng phù hợp với Hệ thống thang bảng lương của Công ty dựa trên các yếu tố cấp bậc, chức năng công việc; được Giám đốc và Chủ tịch Hội đồng thành viên phê duyệt; đảm bảo không thấp hơn mức lương tối thiểu vùng hiện hành do Chính phủ quy định.", "Lương trong thời gian thử việc: Bằng 85% Mức lương chính thức của vị trí công việc đó.", "Công thức tính lương thời gian:", "Điều 10. Tiền lương làm thêm giờ và làm việc vào ban đêm", "Nguyên tắc chung: Tiền lương làm thêm giờ, làm việc vào ban đêm của người lao động được chi trả theo đúng quy định của pháp luật lao động hiện hành.", "Đối tượng và hình thức áp dụng: Thực hiện theo phân công, phê duyệt bằng văn bản của Công ty đối với từng nhóm vị trí công việc.", "Phương thức chi trả: Được tổng hợp, đối soát dựa trên số giờ làm việc thực tế được cấp có thẩm quyền phê duyệt và chi trả cùng kỳ lương hàng tháng.", "Phúc lợi khi làm thêm giờ: Ngoài chế độ tính tiền lương tăng ca theo luật quy định còn được hỗ trợ tiền ăn bằng tiền ăn ca hàng ngày.", "Cách tính lương làm thêm giờ:", "Ngày thường (150%)", "Ngày nghỉ hàng tuần (200%)", "Ngày lễ/tết/ngày nghỉ có hưởng lương (300%)", "Làm việc vào ban đêm (cộng thêm ít nhất 30%)", "Điều 11. Kỳ hạn, Chu kỳ chấm công và Hình thức trả lương", "Kỳ hạn trả lương: Tiền lương và các khoản thu nhập của CBNV được thanh toán một lần từ ngày 01 - 05 của tháng liền sau. Trường hợp ngày trả lương trùng vào ngày nghỉ tuần hoặc ngày lễ, tết thì công ty thực hiện chi trả vào ngày làm việc liền kề trước đó.", "Chu kỳ chấm công: Được tính từ ngày 26 của tháng liền trước đến hết ngày 25 của tháng hiện tại.", "Các khái niệm công trong bảng chấm công:", "Ngày công chuẩn: Là tổng số ngày làm việc bình thường trong chu kỳ chấm công theo lịch thực tế (không bao gồm ngày nghỉ hàng tuần Thứ Bảy/ Chủ Nhật hoặc theo lịch phân ca).", "Ngày công tính lương: Là tổng số ngày đi làm thực tế của CBNV cộng với các ngày nghỉ hưởng nguyên lương theo luật định, ngày đi công tác, học tập, hội nghị được cấp thẩm quyền phê duyệt.", "Hình thức chi trả: Thanh toán bằng hình thức chuyển khoản qua tài khoản ngân hàng bằng đồng Việt Nam (VND) do CBNV đứng tên mở tại ngân hàng thương mại.", "Điều 12. Các khoản giảm trừ vào lương", "Hàng tháng, trước khi thực hiện chi trả lương cho người lao động, Công ty thực hiện khấu trừ các khoản sau:", "Bảo hiểm bắt buộc: Trích đóng bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp thuộc trách nhiệm chi trả của người lao động theo tỷ lệ (%) quy định của pháp luật trên mức tiền lương đóng bảo hiểm được phê duyệt.", "Thuế thu nhập cá nhân (TNCN): Khấu trừ thuế TNCN của CBNV theo biểu thuế và các quy định của Luật Thuế TNCN hiện hành.", "Các khoản giảm trừ khác: Tiền bồi thường thiệt hại vật chất (nếu có), tiền hoàn trả tạm ứng hoặc các khoản giảm trừ khác dựa trên thỏa thuận bằng văn bản giữa CBNV và Công ty phù hợp với quy định pháp luật.", "Điều 13. Cơ chế điều chỉnh lương", "Căn cứ xét điều chỉnh lương:", "Kết quả hoạt động kinh doanh và định hướng chiến lược của Công ty.", "Ngân sách tăng quỹ lương hàng năm được phê duyệt.", "Kết quả đánh giá hiệu suất hoàn thành công việc (KPIs) của CBNV.", "Biến động và mức độ cạnh tranh của thị trường lao động.", "Hình thức thực hiện:", "Điều chỉnh định kỳ: Được xem xét tiến hành hằng năm theo đề xuất của phòng Nhân sự, có sự thẩm định của Giám đốc và phê duyệt cuối cùng bởi Chủ tịch Hội đồng thành viên.", "Điều chỉnh đột xuất: Đối với các trường hợp nhân sự đặc biệt xuất sắc hoặc thay đổi vị trí công việc nằm ngoài kỳ điều chỉnh định kỳ, quy trình sẽ thực hiện theo Quy định thay đổi tình trạng nhân sự và đánh giá thử thách của Công ty.", "Chương III. CÁC KHOẢN HỖ TRỢ VÀ PHÚC LỢI", "Điều 14. Hỗ trợ đi lại", "Bản chất: Là khoản hỗ trợ chi phí nhằm chia sẻ gánh nặng đi lại, di chuyển từ nơi ở đến nơi làm việc của cán bộ nhân viên (CBNV) trong quá trình thực hiện công việc. Khoản chi này thuộc danh mục phúc lợi, không mang tính chất tiền lương và không làm căn cứ tính đóng BHXH bắt buộc.", "Đối tượng áp dụng: Áp dụng cho toàn bộ CBNV nhằm phục vụ công việc.", "Mức hỗ trợ: Thực hiện theo Quy định về chế độ hỗ trợ đi lại do Giám đốc hoặc Chủ tịch Hội đồng thành viên (HĐTV) phê duyệt, phù hợp với Quy chế tài chính của Công ty trong từng thời kỳ.", "Hình thức áp dụng và Phương thức chi trả:", "Hỗ trợ thuê xe: Thực hiện điều động và thanh toán theo Quy trình quản lý và sử dụng xe của Công ty từng thời kỳ.", "Hỗ trợ taxi: Cấp phát thẻ taxi công vụ với hạn mức chi tiêu cụ thể được phê duyệt cho từng chức danh, vị trí.", "Hỗ trợ xăng xe: Áp dụng hình thức khoán cố định hàng tháng theo từng cấp bậc vị trí công việc và được trả trong cùng kỳ lương. Cụ thể như sau:", "Giám đốc điều hành: 5.000.000 đồng/người/tháng", "Giám đốc chuyên môn, Trưởng phòng, KTT: 2.000.000 đồng/người/tháng", "Trưởng nhóm: 600.000 đồng/người/tháng", "CBNV: 500.000 đồng/người/tháng", "Hỗ trợ xe, hỗ trợ vận hành xe và hỗ trợ đi lại bằng tiền: Được chi trả bằng tiền cùng kỳ lương hàng tháng, tính tỷ lệ dựa trên số Ngày công tính lương thực tế trong tháng của CBNV.", "Điều 15. Hỗ trợ tiền ăn giữa ca", "Bản chất: Là khoản hỗ trợ chi phí bữa ăn trong ca làm việc cho Ban Giám đốc, CBNV, không tính vào quỹ lương đóng BHXH bắt buộc và được miễn thuế TNCN theo quy định hiện hành.", "Đối tượng áp dụng: Ban Giám đốc và toàn bộ CBNV đang làm việc thực tế tại Công ty.", "Mức hỗ trợ:", "Giám đốc điều hành: 200.000 đồng/ngày", "Các Giám đốc chuyên môn: 100.000 đồng/ngày", "Trưởng phòng, trưởng nhóm, CBNV: 50.000 VNĐ/ngày.", "Phương thức tính trả:", "Khoản hỗ trợ được tổng hợp và thanh toán cùng kỳ lương hàng tháng dựa trên số ngày công tính lương thực tế (bao gồm ngày đi làm thực tế, ngày đi công tác, học tập, hội nghị phục vụ cho mục đích công việc theo sự phê duyệt của cấp có thẩm quyền).", "Các ngày nghỉ không đi làm (gồm nghỉ phép năm, nghỉ lễ, tết, nghỉ hưởng chế độ BHXH hoặc nghỉ việc riêng không lương) không được tính hưởng khoản hỗ trợ này.", "Điều 16. Hỗ trợ điện thoại", "Bản chất: Là khoản hỗ trợ đồng loạt nhằm tối ưu hóa hiệu quả thông tin liên lạc nội bộ và phục vụ vận hành dòng công việc chung của công ty. Khoản chi này bảo đảm duy trì kết nối thông suốt giữa toàn thể CBNV với Công ty, Khách hàng, Đối tác hoặc các Cơ quan chức năng theo nhiệm vụ được giao.", "Khoản chi này không làm căn cứ tính đóng BHXH và được miễn thuế TNCN trong phạm vi định mức khoán chi của Công ty.", "Trường hợp CBNV nghỉ không lương hoặc nghỉ hưởng chế độ BHXH trọn tháng tính theo chu kỳ chấm công sẽ không được áp dụng mức hỗ trợ này.", "Mức hỗ trợ và Phương thức chi trả:", "Các Giám đốc/ Trưởng phòng: 1.000.000 đồng/tháng", "CBNV: 500.000 đồng/tháng", "Điều 17. Hỗ trợ tiền trang phục", "Bản chất: Là khoản phúc lợi hỗ trợ bằng tiền để CBNV tự mua sắm, may đo hoặc bảo dưỡng quần áo phục vụ quá trình làm việc, xây dựng hình ảnh chuyên nghiệp cho Công ty. Khoản hỗ trợ này độc lập hoàn toàn với tiền lương, không tính vào quỹ lương đóng BHXH bắt buộc và được miễn thuế TNCN theo quy định hiện hành.", "Đối tượng áp dụng: Toàn bộ người lao động đã ký Hợp đồng lao động chính thức có thời hạn từ 03 tháng trở lên.", "Mức hỗ trợ và Hình thức: Chuyển khoản cùng kỳ lương hàng tháng với mức:", "Giám đốc, TP, KTT: 1.500.000 VNĐ/người/tháng", "Trưởng nhóm, trưởng dự án: 1.000.000 VNĐ/người/tháng", "Cán bộ CNV: 400.000 VNĐ/người/tháng", "Nguyên tắc tính hưởng: Được khoán theo tháng làm việc.", "Điều 18. Hỗ trợ nhà ở", "Bản chất: Là khoản phụ cấp phúc lợi được chi trả nhằm hỗ trợ một phần chi phí sinh hoạt, ổn định chỗ ở cho CBNV, giúp nhân sự an tâm công tác và gắn bó lâu dài với Công ty. Khoản hỗ trợ không làm căn cứ để tính đóng BHXH bắt buộc và nộp thuế TNCN theo quy định hiện hành.", "Đối tượng áp dụng: Áp dụng đối với tất cả CBNV chính thức có phát sinh chi phí thuê nhà hoặc ở xa trụ sở làm việc.", "Mức hỗ trợ: được chuyển khoản cùng kỳ lương hàng tháng, được quy định cụ thể như sau:", "Giám đốc điều hành: 5.000.000 đồng/tháng", "Giám đốc chuyên môn: 2.000.000 đồng/tháng.", "Trưởng phòng, KTT, trưởng nhóm: 1.500.000 đồng/tháng", "CBNV: 1.000.000 đồng/tháng", "Chương V. TIỀN THƯỞNG", "Điều 19. Thưởng theo kết quả doanh thu kinh doanh", "Bản chất: Là khoản thu nhập biến đổi, không cố định, phụ thuộc hoàn toàn vào kết quả hoàn thành chỉ tiêu doanh số của Công ty, Bộ phận và Cá nhân người lao động trong từng kỳ đánh giá. Khoản thưởng này không mang tính chất tiền lương và không làm căn cứ tính đóng BHXH bắt buộc.", "Điều kiện áp dụng chung:", "Công ty đạt tỷ lệ hoàn thành kế hoạch doanh thu tối thiểu theo hạn mức được Chủ tịch HĐTV phê duyệt đầu năm tài chính.", "Người lao động (NLĐ) không vi phạm kỷ luật lao động từ mức Cảnh cáo trở lên trong kỳ tính thưởng.", "Cơ chế xác định mức thưởng:", "Mức thưởng doanh số thực nhận của từng nhân sự được tính toán dựa trên công thức tổng quát:", "Mức thưởng doanh thu = Doanh thu thực tế đạt được x Tỷ lệ trích thưởng (%) x Hệ số vị trí/đóng góp", "Trong đó: Tỷ lệ trích thưởng (%) và Hệ số đóng góp (H) của từng phòng ban, vị trí công việc sẽ không quy định cố định tại Quy chế này, mà được ban hành linh hoạt thông qua \"Chính sách thưởng doanh số hằng năm/hằng quý\" do Giám đốc phê duyệt dựa trên tình hình thị trường và biên lợi nhuận của Công ty.", "Phương thức chi trả và quyết toán:", "Để khích lệ tinh thần làm việc, hằng tháng Phòng Nhân sự phối hợp với Phòng Kế toán Tài chính tính toán và trình Giám đốc phê duyệt tạm ứng trước một phần mức thưởng doanh số (dựa trên kết quả tháng liền trước) để chi trả cùng kỳ lương.", "Kết thúc kỳ kế toán tài chính (hoặc cuối năm), Công ty sẽ tiến hành đối soát, tổng hợp doanh thu thực tế để thực hiện quyết toán cuối cùng: Chi trả bổ sung phần tiền thưởng còn thiếu hoặc thực hiện khấu trừ/kết chuyển đối với phần tiền đã chi vượt mức tạm ứng của NLĐ.", "Đối với trường hợp NLĐ chấm dứt HĐLĐ trước thời điểm quyết toán: Quyền lợi thưởng phát sinh sẽ được giải quyết dựa trên tỷ lệ thời gian làm việc thực tế và mức độ đóng góp cụ thể, do Giám đốc xem xét quyết định tối sau cùng.", "Quyết toán cuối năm: Sau khi kết thúc năm tài chính và có kết quả tổng kết hoạt động kinh doanh chính thức, phòng Nhân sự phối hợp với phòng Kế toán Tài chính đối chiếu với điều kiện tại Khoản 2 Điều này để trình Giám đốc quyết toán. Công ty sẽ thực hiện chi trả phần chênh lệch còn thiếu hoặc tiến hành truy thu/kết chuyển chi phí đối với phần đã chi vượt mức tương ứng theo quy định tại Khoản 3 Điều này.", "Điều 20: Thưởng theo Hiệu quả công việc (Thưởng KPI):", "Bản chất: Là khoản thưởng nhằm ghi nhận, khuyến khích năng suất, chất lượng và tiến độ hoàn thành mục tiêu công việc (KPIs) được giao của từng CBNV.", "Căn cứ và Tiêu chí đánh giá:", "Hiệu quả công việc của CBNV được đánh giá định kỳ dựa trên Hệ thống chỉ số đo lường hiệu suất (KPIs) bao gồm 04 nhóm tiêu chí cốt lõi:", "Khối lượng công việc (Q1): Tỷ lệ phần trăm công việc đã hoàn thành so với kế hoạch hoặc mô tả công việc được giao.", "Chất lượng công việc (Q2): Mức độ chính xác, tính hiệu quả và giá trị thực tế mang lại cho tổ chức.", "Tiến độ (P): Tốc độ hoàn thành công việc (đúng hạn, sớm hạn hay trễ hạn).", "Ý thức kỷ luật (D): Sự chấp hành nội quy lao động, văn hóa doanh nghiệp và quy trình phối hợp nội bộ.", "Cơ chế xác định mức thưởng linh hoạt:", "Mức tiền thưởng hiệu quả công việc tối đa (Mức thưởng trần khi đạt 100% KPIs) của từng chức danh/cấp bậc nhân sự sẽ do Giám đốc quyết định và điều chỉnh linh hoạt theo từng giai đoạn kinh doanh. Số tiền thưởng thực nhận hằng kỳ được tính theo công thức:", "Thưởng HQCV = Mức quỹ thưởng công việc được giao x Hệ số xếp loại hiệu suất.", "Điều 21. Thưởng cuối năm (Thưởng Tết)", "Mục đích: Là khoản thưởng phúc lợi cuối năm nhằm ghi nhận sự gắn bó, đồng hành và đóng góp hiệu quả của CBNV vào mục tiêu phát triển chung của Công ty trong năm làm việc.", "Điều kiện áp dụng: CBNV làm việc chính thức tại Công ty và không có thông báo chấm dứt hợp đồng lao động (hoặc không trong quá trình giải quyết nghỉ việc) tại thời điểm Công ty công bố và chi trả tiền thưởng, đồng thời thỏa mãn các chỉ tiêu xét thưởng cụ thể theo từng niên độ.", "Hình thức thực hiện: Định kỳ vào cuối năm tài chính, phòng Nhân sự chịu trách nhiệm xây dựng phương án chi trả chi tiết trình Giám đốc và Chủ tịch HĐTV phê duyệt về: đối tượng nhận thưởng, tiêu chí đánh giá, mức thưởng cụ thể cho từng cấp bậc, thời gian chi trả và các nội dung phát sinh có liên quan.", "Chương VI. CÁC CHẾ ĐỘ PHÚC LỢI", "Điều 22. Chế độ chúc mừng kết hôn (Mừng đám cưới)", "Bản chất: Là khoản tiền chúc mừng phúc lợi của Công ty gửi đến cán bộ nhân viên (CBNV) khi xác lập quan hệ hôn nhân hợp pháp. Khoản chi này không mang tính chất tiền lương, không làm căn cứ tính đóng BHXH.", "Mức chi trả: 1.000.000 VNĐ/CBNV (Một triệu đồng chẵn).", "Điều kiện và đối tượng áp dụng: CBNV được hưởng chế độ khi đáp ứng đầy đủ các điều kiện sau:", "Có thời gian làm việc thực tế tại Công ty tại thời điểm đăng ký kết hôn.", "Cung cấp bản sao hợp lệ Giấy chứng nhận kết hôn cho phòng Nhân sự trong thời hạn tối đa 30 ngày kể từ ngày cơ quan có thẩm quyền cấp giấy.", "Trường hợp cả vợ và chồng đều là CBNV đang làm việc tại Công ty, mỗi cá nhân đều được hưởng độc lập khoản tiền mừng này theo đúng định mức.", "Phương thức thực hiện: Phòng Nhân sự có trách nhiệm tiếp nhận, kiểm tra hồ sơ minh chứng và tổng hợp chi trả chuyển khoản vào tài khoản của CBNV cùng kỳ lương của tháng nhận đủ hồ sơ hợp lệ.", "Điều 23: Chế độ mừng sinh nhật hàng năm", "Mục đích: Là khoản chúc mừng gửi đến CBNV nhân dịp sinh nhật nhằm ghi nhận sự gắn bó, đồng hành và đóng góp hiệu quả vào mục tiêu phát triển chung của Công ty trong năm làm việc.", "Đối tượng hưởng: Toàn bộ nhân sự chính thức của công ty", "Mức chi trả:", "Cấp quản lý: 500.000 đồng/người", "Cấp nhân viên: 300.000 đồng/người", "Điều 24. Chế độ kiểm tra sức khỏe định kỳ hàng năm", "Mục đích: Nhằm bảo vệ sức khỏe người lao động, giúp CBNV tầm soát sớm bệnh tật để có phương án điều trị kịp thời và duy trì năng lượng làm việc ổn định tại doanh nghiệp.", "Hình thức thực hiện:", "Hàng năm, căn cứ vào tình hình hoạt động kinh doanh và ngân sách phúc lợi, phòng Nhân sự xây dựng phương án phối hợp với các cơ sở y tế đủ điều kiện hoạt động để tổ chức khám sức khỏe định kỳ cho toàn thể CBNV.", "Tiêu chuẩn, danh mục gói khám và quy trình thực hiện được thiết kế phù hợp với các quy định do Bộ Y tế ban hành, trình Giám đốc và Chủ tịch Hội đồng thành viên (HĐTV) xem xét, phê duyệt từng thời kỳ.", "Chi phí thăm khám:", "Chi phí kiểm tra sức khỏe do Công ty chi trả trực tiếp cho cơ sở y tế với hạn mức quy định tối đa trong khoảng từ 1.000.000 – 1.200.000 đồng/người. Thời gian tổ chức cụ thể do Phòng Nhân sự thông báo hằng năm tùy thuộc vào kế hoạch vận hành của Công ty.", "Chi phí này sẽ được hạch toán vào chi phí phúc lợi được trừ theo luật thuế và không tính vào thu nhập chịu thuế TNCN của người lao động.", "Điều 25: Team Builiding hàng năm", "Mục đích: Nhằm tái tạo sức lao động, gắn kết tinh thần tập thể và nâng cao văn hóa doanh nghiệp.", "Đối tượng áp dụng: Áp dụng cho toàn bộ cán bộ nhân viên (CBNV) chính thức có thâm niên làm việc tại công ty từ 03 tháng trở lên tính đến thời điểm tổ chức.", "Đối với nhân sự đang trong quá trình thử việc hoặc có thâm niên dưới 03 tháng, việc tham gia sẽ do Trưởng bộ phận đề xuất và Ban Giám đốc phê duyệt quyết định.", "Tần suất và Định mức chi phí:", "Tần suất: Công ty tổ chức chương trình Team building kết hợp nghỉ mát tập trung hằng năm với tần suất 01 lần/năm.", "Định mức chi phí: Hạn mức ngân sách tối đa áp dụng là 2.000.000 - 3.000.000 đ/người/chuyến.", "Điều 26. Các chế độ phúc lợi và hỗ trợ an sinh khác", "Nguyên tắc chung: Ngoài các khoản phúc lợi cố định quy định tại Quy chế này, Công ty có thể áp dụng linh hoạt các chế độ phúc lợi khác (như: thăm hỏi ốm đau, thai sản, hiếu hỉ, tặng quà các ngày Lễ, Tết, Ngày Quốc tế Phụ nữ, Ngày Quốc tế Thiếu nhi cho con CBNV...) nhằm gia tăng sự gắn kết và nâng cao đời sống tinh thần cho nhân sự.", "Thẩm quyền phê duyệt: Căn cứ vào hiệu quả hoạt động kinh doanh thực tế, phòng Nhân sự chịu trách nhiệm xây dựng phương án chi tiết (bao gồm: mục đích, đối tượng, tiêu chí đánh giá, hạn mức chi, phương thức và thời gian thực hiện) trình Giám đốc và Chủ tịch HĐTV phê duyệt bằng văn bản trước khi triển khai áp dụng.", "Điều 27. Các chế độ phúc lợi khác", "Ngoài các phúc lợi được quy định tại Quy chế này, Công ty có thể áp dụng các chế độ phúc lợi khác nhằm tăng mức độ gắn kết, nâng cao tinh thần làm việc của CBNV.", "Căn cứ vào tình hình hoạt động của Công ty, phòng nhân sự xây dựng tiêu chí, điều kiện, đối tượng áp dụng, mức thưởng, hình thức và thời gian chi thưởng để GĐ và Chủ tịch HĐTV xem xét và phê duyệt", "Chương VII. ĐIỀU KHOẢN THI HÀNH", "Điều 28. Điều khoản thi hành", "Hiệu lực thi hành: Quy chế này có hiệu lực áp dụng kể từ ngày 01/04/2026 và thay thế toàn bộ các văn bản, quy định, quy chế trước đây của Công ty liên quan đến tiền lương, tiền thưởng và các chế độ phúc lợi khác đối với người lao động tại Công ty.", "Nguyên tắc áp dụng pháp luật: Những vấn đề về lao động, tiền lương, hỗ trợ và phúc lợi chưa được đề cập trong Quy chế này sẽ được thực hiện theo đúng các quy định của pháp luật lao động hiện hành và các quy định nội bộ khác của Công ty. Trường hợp có bất kỳ nội dung nào trong Quy chế này mâu thuẫn hoặc trái với quy định của pháp luật hiện hành thì nội dung đó đương nhiên hết hiệu lực và thực hiện theo luật định.", "Thẩm quyền sửa đổi, bổ sung: Việc sửa đổi, bổ sung, thay thế hoặc bãi bỏ một phần hoặc toàn bộ Quy chế này do phòng Nhân sự tổng hợp đề xuất và phải được Chủ tịch Hội đồng thành viên (HĐTV) xem xét, ra quyết định ban hành bằng văn bản.", "Trách nhiệm thi hành: Giám đốc, các Trưởng phòng/Ban/Bộ phận và toàn thể CBNV đang làm việc tại Công ty chịu trách nhiệm thi hành nghiêm túc các quy định tại Quy chế này.", "TM CÔNG TY TNHH KIẾN TRÚC XÂY DỰNG THE WALL", "CHỦ TỊCH HỘI ĐỒNG THÀNH VIÊN", "Nơi nhân :", "- HĐTV", "- Giám đốc;", "- Trưởng các phòng ban;", "- Phụ trách Nhân sự (để thông báo cho", "toàn thể Nhân viên được biết)", "CÔNG TY TNHH KIẾN TRÚC XÂY DỰNG THE WALL", "Số 01- QCTL/2026 | CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM", "Độc lập – Tự do – Hạnh phúc", "-----o0o-----", "| TP.HCM, ngày 28 tháng 03 năm 2026", "Diễn giải | Trong phạm vi khung lương và/hoặc chính sách hiện hành | Cao hơn phạm vi khung lương và/hoặc cao hơn chính sách hiện hành | Ngoài chính sách hiện hành", "1/ Tất cả CBNV | Chủ tịch HĐTV | Chủ tịch HĐTV | Chủ tịch HĐTV", "2/ Từ trưởng phòng trở xuống, trừ các vị trí thuộc thẩm quyền của Chủ tịch HĐTV | Giám đốc | Chủ tịch HĐTV | Chủ tịch HĐTV", "3/ Từ trưởng bộ phận trở xuống | Trưởng phòng Nhân sự | Giám đốc | Giám đốc và theo ngân sách tương ứng với qui định tại Qui chế Tài chính", "4/ Các vị trí nhân viên còn lại | Trưởng phòng phụ trách có đơn vị nhân sự được tuyển dụng | Trưởng phòng Nhân sự | Giám đốc và theo ngân sách tương ứng với qui định tại Qui chế Tài chính"]]);
const HB_WP_TABS=[{"id":"t0","nav":"THÔNG TIN CHUNG","title":"THÔNG TIN CHUNG","subsections":[{"title":"WEPLUS GROUP","status":"","src":"","blocks":[{"t":"text","x":"WePlus là nền tảng kết nối và cộng hưởng năng lực trong hệ sinh thái Tgroup, nơi các đơn vị thành viên cùng phát huy thế mạnh, nguồn lực và chuyên môn để mở rộng năng lực của toàn hệ thống, kiến tạo những giá trị lớn hơn cho khách hàng và nâng tầm vị thế Tgroup trong nước và quốc tế."},{"t":"companies","items":[{"name":"ePlus","intro":"ePlus được thành lập từ năm 2009, là công ty sự kiện và marketing với triết lý \"Value-Driven\" — kiến tạo giá trị cho ngành, cho khách hàng và cho con người. ePlus cung cấp dịch vụ sản xuất sự kiện, quản lý dự án và hoạch định chiến lược truyền thông, đo lường thành công bằng sự hài lòng của khách hàng và sự trưởng thành của đội ngũ.","org":"","services":""},{"name":"Engage+","intro":"Được thành lập từ năm 2016, Engage+ chuyên về tổ chức sự kiện, activation và trải nghiệm thương hiệu. Với tư duy sáng tạo và năng lực triển khai vững vàng, Engage+ biến mỗi ý tưởng thành những khoảnh khắc đáng nhớ, kết nối thương hiệu với công chúng bằng cảm xúc chân thật.","org":"","services":""},{"name":"Enabler+","intro":"Enabler+ đồng hành cùng doanh nghiệp trên hành trình phát triển bền vững — từ nghiên cứu và phát triển sản phẩm, sản xuất linh hoạt đến chiến lược đưa thương hiệu Việt vươn ra thị trường quốc tế. Với tinh thần vượt lên tư duy thông thường, Enabler+ kiến tạo chuỗi giá trị bền vững qua các lĩnh vực sức khỏe & làm đẹp, chăm sóc thú cưng, sản phẩm di sản và vật liệu thân thiện môi trường.","org":"","services":""},{"name":"GolfCare+","intro":"GolfCare+ là đội ngũ trực thuộc ePlus — đơn vị thành viên của Tgroup, tập trung vào nhóm khách hàng cao cấp, kết nối Golf & MICE và mạng lưới khách hàng cấp cao của Ban Lãnh đạo, hướng đến trải nghiệm chuyên nghiệp và gia tăng giá trị cho khách hàng, đối tác trong hệ sinh thái Tgroup.","org":"","services":""},{"name":"Nguyễn Mộc (khối Quảng Cáo)","intro":"Được thành lập từ năm 2010, Nguyễn Mộc là đơn vị sản xuất và thi công với bề dày kinh nghiệm — từ các sản phẩm event, hệ thống trưng bày tại showroom và cửa hàng đến sản phẩm nội thất cho những dự án biệt thự, nhà ở — luôn đáp ứng những tiêu chuẩn khắt khe về chất lượng và tiến độ.","org":"","services":""}]}]}]},{"id":"t1","nav":"QUY ĐỊNH CHUNG","title":"QUY ĐỊNH CHUNG","subsections":[{"title":"Lời nói đầu","status":"","src":"","blocks":[{"t":"text","x":"WePlus là nền tảng kết nối và cộng hưởng năng lực trong hệ sinh thái Tgroup. Toàn thể thành viên WePlus cùng thống nhất những giá trị cốt lõi sau đây:"},{"t":"list","items":["Chung mục tiêu - sẻ chia trách nhiệm - kiến tạo thành quả.","Giao tiếp chuẩn mực, lịch sự, văn minh trong mọi tình huống.","Tương trợ, phối hợp chặt chẽ vì mục tiêu chung của tổ chức.","Tích cực tham gia các hoạt động chung của công ty."]}]},{"title":"Điều 1. Phạm vi điều chỉnh và đối tượng áp dụng","status":"","src":"","blocks":[{"t":"khoan","items":["Quy chế này quy định thống nhất về tổ chức quản lý và chính sách đãi ngộ áp dụng trong toàn WePlus Group.","Quy chế này áp dụng đối với toàn thể nhân viên làm việc tại các đơn vị thành viên: Engage+, ePlus, Enabler+, GolfCare+, Nguyễn Mộc (khối Quảng Cáo).","Mọi quy định nội bộ của đơn vị thành viên không được trái với các nội dung thuộc Mức A của Quy chế này."]}]},{"title":"Điều 2. Nguyên tắc thống nhất","status":"","src":"","blocks":[{"t":"text","x":"Các nội dung của Quy chế được phân thành ba mức thống nhất:"},{"t":"table","head":["Mức","Nội dung","Ví dụ"],"rows":[["Mức A — Chuẩn chung bắt buộc","Toàn WePlus áp dụng thống nhất; đơn vị thành viên không được sửa đổi.","Thời giờ làm việc, chấm công, phép năm 12 ngày."],["Mức B — Khung chung","WePlus quy định khung và biên độ; đơn vị thành viên được linh hoạt trong phạm vi cho phép và báo cáo Phòng Nhân sự & Pháp chế.","Làm việc từ xa (tối đa 02 ngày/tháng), ngân sách sinh nhật (mức trần), định mức công tác phí."],["Mức C — Đặc thù đơn vị","Đơn vị thành viên tự quy định phù hợp đặc thù kinh doanh; nộp Phòng Nhân sự & Pháp chế lưu hồ sơ.","Hoa hồng và thưởng dự án theo từng đơn vị."]]}]},{"title":"Điều 3. Thẩm quyền ban hành, sửa đổi, bổ sung","status":"","src":"","blocks":[{"t":"khoan","items":["Ban Giám đốc là cấp có thẩm quyền duy nhất ban hành, sửa đổi, bổ sung Quy chế này.","Phòng Nhân sự & Pháp chế chủ trì rà soát định kỳ, tổng hợp các đề xuất sửa đổi để trình Ban Giám đốc xem xét, quyết định.","Giám đốc đơn vị thành viên được ban hành quy định nội bộ đối với các nội dung thuộc Mức B, Mức C; không được ban hành nội dung trái với Mức A."]}]},{"title":"Điều 4. Hiệu lực thi hành và rà soát định kỳ","status":"","src":"","blocks":[{"t":"khoan","items":["Quy chế này có hiệu lực kể từ ngày ký ban hành (số hiệu dự kiến: QC-WP-2026-01; ngày hiệu lực do Ban Giám đốc điền khi phê duyệt).","Định kỳ 12 tháng một lần, Phòng Nhân sự & Pháp chế chủ trì rà soát, đề xuất sửa đổi cho phù hợp với tình hình thực tế.","Kể từ ngày Quy chế có hiệu lực, các quy định riêng của từng đơn vị hết hiệu lực đối với những nội dung đã được Quy chế điều chỉnh; các nội dung đặc thù của đơn vị (Mức C) tiếp tục thực hiện và gửi Phòng Nhân sự & Pháp chế để lưu hồ sơ."]}]}]},{"id":"t2","nav":"QUY TẮC LÀM VIỆC CHUNG","title":"QUY TẮC LÀM VIỆC CHUNG","subsections":[{"title":"Điều 5. Thời giờ làm việc","status":"","src":"","blocks":[{"t":"khoan","items":["Thời giờ làm việc chuẩn: từ 09 giờ 00 đến 18 giờ 00 từ thứ 2 đến thứ 6; thời gian nghỉ trưa từ 12 giờ 00 đến 13 giờ 00 (không tính vào thời giờ làm việc).","Nhân viên được đến muộn tối đa 30 phút so với giờ chuẩn nếu đã đăng ký trước với quản lý trực tiếp, với điều kiện vẫn bảo đảm đủ 08 giờ làm việc trong ngày.","Ngày tham gia tổ chức sự kiện: thực hiện theo lịch điều phối của dự án; áp dụng chế độ nghỉ bù quy định tại Điều 14."]}]},{"title":"Điều 6. Chấp hành thời giờ làm việc","status":"","src":"","blocks":[{"t":"khoan","items":["Giờ làm việc được ghi nhận qua hệ thống chấm công; vào làm sau 10 giờ 00 hoặc ra về trước 17 giờ 30 phải được quản lý trực tiếp chấp thuận.","Đi muộn, về sớm, vắng mặt không lý do được tổng hợp hằng tháng và xử lý theo quy định về kỷ luật lao động tại Điều 11.","Xử lý theo quy định tại nội quy lao động."]}]},{"title":"Điều 7. Chấm công","status":"","src":"","blocks":[{"t":"khoan","items":["Nhân viên thực hiện chấm công vào và ra bằng vân tay tại cửa ra vào trụ sở làm việc.","Việc chấm công được phân công như sau: nhân viên — hệ thống ghi nhận tự động; quản lý trực tiếp — xác nhận các trường hợp giải trình (đi muộn, làm thêm giờ, công tác); Phòng Nhân sự — tổng hợp, chốt bảng công và chuyển tính lương."]}]},{"title":"Điều 8. Trang phục","status":"","src":"","blocks":[{"t":"khoan","items":["Nhân viên mặc trang phục lịch sự, gọn gàng, kín đáo, phù hợp môi trường làm việc công sở.","Không mặc trang phục phản cảm."]}]},{"title":"Điều 9. Nội quy văn phòng","status":"","src":"","blocks":[{"t":"khoan","items":["Khi ra ngoài trong giờ làm việc phải thông báo cho quản lý trực tiếp.","Giữ gìn vệ sinh và trả lại nguyên trạng phòng họp, pantry, khu vực dùng chung sau khi sử dụng; tài liệu, thiết bị dùng chung để đúng nơi quy định.","Sử dụng và bảo quản đúng cách thiết bị, tài sản công ty được giao; người ra về cuối cùng kiểm tra tắt điện, điều hòa, khóa cửa.","Giữ trật tự tại khu vực làm việc chung, tôn trọng không gian tập trung của đồng nghiệp; chuẩn mực trong trang phục và giao tiếp khi tiếp khách, đối tác tại văn phòng."]}]},{"title":"Điều 10. Bảo mật thông tin và dữ liệu","status":"","src":"","blocks":[{"t":"khoan","items":["Không tiết lộ thông tin khách hàng, tài chính, nhân sự, chiến lược kinh doanh ra bên ngoài khi chưa được ủy quyền bằng văn bản của người có thẩm quyền.","Không sử dụng tài sản trí tuệ, dữ liệu, mối quan hệ khách hàng của công ty cho mục đích cá nhân hoặc cho đơn vị khác.","Bảo vệ dữ liệu cá nhân, dữ liệu khách hàng và dữ liệu nội bộ theo quy định pháp luật; không sao chép, phát tán hoặc đưa dữ liệu nội bộ ra khỏi hệ thống của công ty khi chưa được phê duyệt.","Có trách nhiệm bảo mật tài khoản, mật khẩu các thiết bị công ty được giao; không cài đặt phần mềm không rõ nguồn gốc.","Khi phát hiện dấu hiệu rò rỉ thông tin hoặc sự cố dữ liệu, báo ngay cho quản lý trực tiếp và Phòng Nhân sự & Pháp chế.","Khi chấm dứt hợp đồng lao động: bàn giao đầy đủ dữ liệu, thiết bị; nghĩa vụ bảo mật chi tiết được quy định trong hợp đồng lao động hoặc thỏa thuận bảo mật riêng.","Vi phạm Điều này được xử lý theo quy định tại Điều 11; trường hợp gây thiệt hại phải bồi thường theo quy định pháp luật."]}]},{"title":"Điều 11. Xử lý vi phạm","status":"","src":"","blocks":[{"t":"khoan","items":["Tùy tính chất, mức độ vi phạm, đơn vị áp dụng biện pháp xử lý phù hợp theo Nội quy lao động, quy định pháp luật và Quy chế này, bao gồm nhắc nhở, yêu cầu khắc phục hoặc xử lý kỷ luật lao động.","Các hình thức kỷ luật lao động gồm: khiển trách; kéo dài thời hạn nâng lương không quá 06 tháng; sa thải.","Việc xử lý kỷ luật lao động phải đúng căn cứ, trình tự, thủ tục theo quy định tại Nội quy lao động."]}]},{"title":"Điều 12. An toàn lao động và xử lý sự cố","status":"draft","src":"","blocks":[{"t":"khoan","items":["Nhân viên tuân thủ các quy định về phòng cháy, chữa cháy, an toàn điện và thoát hiểm tại nơi làm việc; tham gia đầy đủ các buổi tập huấn, diễn tập khi được yêu cầu.","Giữ gìn vệ sinh, an toàn khu vực làm việc; không tự ý di chuyển, tháo gỡ thiết bị an toàn, phòng cháy, chữa cháy.","Khi xảy ra sự cố (tai nạn lao động, cháy nổ, mất điện, sự cố an ninh, an toàn thông tin): ưu tiên bảo đảm an toàn con người, báo ngay cho quản lý trực tiếp và bộ phận liên quan, bảo vệ hiện trường, tài sản của công ty.","Không tự ý xử lý sự cố vượt quá thẩm quyền, chức năng của mình; phối hợp đầy đủ khi đơn vị điều tra, khắc phục sự cố."]}]}]},{"id":"t3","nav":"NGHỈ PHÉP & CHẾ ĐỘ NGHỈ","title":"NGHỈ PHÉP & CHẾ ĐỘ NGHỈ","subsections":[{"title":"Điều 13. Thủ tục nghỉ phép","status":"","src":"","blocks":[{"t":"khoan","items":["Thời hạn báo trước (trừ trường hợp đột xuất): nghỉ từ 01 đến 02 ngày, báo trước ít nhất 03 ngày làm việc; nghỉ từ 03 đến 05 ngày, báo trước ít nhất 07 ngày; nghỉ trên 05 ngày, báo trước ít nhất 14 ngày.","Hình thức đăng ký: biểu mẫu tại tab Cổng nghỉ phép của Sổ tay.","Để bảo đảm hoạt động liên tục, nhân viên chủ động sắp xếp kế hoạch nghỉ phép với quản lý trực tiếp; không quá 50% nhân sự của một nhóm cùng nghỉ trong một thời điểm, trừ trường hợp đặc biệt được Giám đốc chấp thuận.","Nếu không tuân thủ theo quy định trên thì mặc định là nghỉ không có lý do chính đáng, người lao động sẽ không được tính lương, đồng thời công ty có quyền đơn phương chấm dứt hợp đồng lao động theo quy định Bộ luật Lao động 2019."]}]},{"title":"Điều 14. Làm việc từ xa và nghỉ bù sự kiện","status":"","src":"","blocks":[{"t":"khoan","items":["Tham gia tổ chức sự kiện vào ngày nghỉ hằng tuần được ghi nhận làm thêm giờ theo quy định pháp luật. Đơn vị và nhân viên thỏa thuận hình thức bù đắp: nghỉ bù từ 0,5 đến 01 ngày trong tuần kế tiếp hoặc hưởng chế độ làm thêm giờ theo luật, do quản lý trực tiếp xác nhận theo lịch sự kiện. [Mức B]","Làm việc từ xa [Mức B]: tối đa 02 ngày/tháng, báo trước ít nhất 01 ngày cho quản lý trực tiếp; đơn vị phân bổ phù hợp đặc thù công việc."]}]},{"title":"Điều 15. Nghỉ việc riêng","status":"","src":"","blocks":[{"t":"text","x":"<strong>1. Nghỉ việc riêng hưởng nguyên lương</strong>"},{"t":"table","head":["Trường hợp","Chế độ"],"rows":[["Bản thân kết hôn","03 ngày, mừng 1.000.000 đồng"],["Con (con đẻ, con nuôi) kết hôn","01 ngày"],["Tang chế (bố mẹ đẻ, bố mẹ nuôi (cả bên chồng và bên vợ), vợ hoặc chồng, con đẻ/con nuôi chết)","03 ngày; vòng hoa chia buồn"],["Đối với lao động nữ quay lại làm việc sau sinh, đang nuôi con dưới 12 tháng tuổi","Được về sớm mỗi ngày 60 phút."]]},{"t":"text","x":"<strong>2. Nghỉ chế độ</strong>"},{"t":"table","head":["Đối tượng","Chế độ"],"rows":[["Nhân viên nữ sinh con","Nghỉ 06 tháng đối với con đầu, trường hợp sinh con thứ 2 được nghỉ 07 tháng. Trường hợp sinh đôi cứ mỗi con thêm thì được nghỉ thêm 1 tháng."],["Nhân viên nam có vợ sinh con","Được nghỉ 05 ngày đối với sinh thường, 07 ngày đối với sinh mổ hoặc sinh con dưới 32 tuần tuổi."],["Nhân viên nam có vợ sinh con thứ 2","Nghỉ 10 ngày làm việc"],["Nhân viên nam có vợ sinh đôi","Nghỉ 10 ngày làm việc (sinh đôi mà sinh mổ thì được nghỉ 14 ngày)"]]}]},{"title":"Điều 16. Nghỉ phép năm","status":"","src":"","blocks":[{"t":"khoan","items":["Nhân viên làm đủ 12 tháng được hưởng 12 ngày phép năm. Nhân viên chưa làm đủ 12 tháng: mỗi tháng làm việc được hưởng 01 ngày phép, đồng thời nhân viên sẽ được thêm 1-2 ngày phép tương ứng thời gian thử việc sau khi ký HĐLĐ chính thức.","Cứ đủ 05 năm làm việc cho một đơn vị sử dụng lao động, nhân viên được tăng thêm 01 ngày phép năm.","Mức phép năm quy định tại khoản 1 là mức tối thiểu theo pháp luật lao động; không đơn vị nào được quy định thấp hơn.","Với nhân viên ký HĐLĐ chính thức từ ngày 15 trở về trước sẽ được tính 01 ngày phép trong tháng; ký sau ngày 15 sẽ không được tính ngày phép cho tháng đó."]}]}]},{"id":"t4","nav":"ĐÃI NGỘ & PHÚC LỢI","title":"LƯƠNG, THƯỞNG & PHÚC LỢI","subsections":[{"title":"Điều 17. Hợp đồng lao động","status":"","src":"","blocks":[{"t":"khoan","items":["Thời gian thử việc, tiền lương thử việc và việc ký hợp đồng lao động chính thức thực hiện theo Bộ luật Lao động 2019.","Khi chấm dứt hợp đồng lao động, nhân viên có trách nhiệm bàn giao đầy đủ công việc, tài sản, dữ liệu cho người tiếp nhận theo hướng dẫn của quản lý trực tiếp, hoàn tất trước ngày nghỉ việc."]}]},{"title":"Điều 18. Tiền lương","status":"","src":"","blocks":[{"t":"khoan","items":["Tiền lương được chi trả bằng hình thức chuyển khoản qua ngân hàng HDBank, trong khoảng thời gian từ ngày 01 đến ngày 10 của tháng kế tiếp.","Tiền lương, phụ cấp và các khoản thu nhập khác của nhân viên là thông tin bảo mật của đơn vị; nhân viên không tiết lộ cho bên thứ ba khi chưa được sự đồng ý của đơn vị, trừ trường hợp pháp luật có quy định khác."]}]},{"title":"Điều 19. Phát triển nhân sự","status":"draft","src":"","blocks":[{"t":"khoan","items":["Công ty xây dựng lộ trình phát triển nghề nghiệp cho từng nhóm vị trí, làm cơ sở cho việc đánh giá, bổ nhiệm và quy hoạch nhân sự.","Nhân viên được đánh giá hiệu quả công việc định kỳ, làm căn cứ xem xét tăng lương, thưởng, bổ nhiệm và đào tạo.","Công ty tổ chức hoặc cử nhân viên tham gia các chương trình đào tạo, bồi dưỡng nâng cao chuyên môn, kỹ năng phù hợp với yêu cầu công việc.","Nhân viên chủ động đề xuất nhu cầu đào tạo, phát triển bản thân với quản lý trực tiếp và Phòng Nhân sự."]}]},{"title":"Điều 20. Phúc lợi","status":"","src":"","blocks":[{"t":"table","head":["Chế độ","Mức chung"],"rows":[["Khám sức khỏe định kỳ","1.200.000 đồng/người/năm"],["Gắn kết đội ngũ","3.000.000 đồng/người/năm"],["Sinh nhật","Nhân viên 300.000 đồng · Quản lý 500.000 đồng"]]}]},{"title":"Điều 21. Thưởng dự án [Mức C]","status":"","src":"","blocks":[{"t":"khoan","items":["Chế độ thưởng dự án thực hiện theo quy định nội bộ của từng đơn vị thành viên, phù hợp với đặc thù kinh doanh của đơn vị.","Đơn vị thành viên xây dựng quy chế thưởng dự án của đơn vị mình, trình Ban Giám đốc phê duyệt trước khi ban hành và áp dụng.","Không áp dụng một thang thưởng chung cho toàn Group."]}]},{"title":"Điều 22. Công tác phí [Mức B]","status":"","src":"","blocks":[{"t":"khoan","items":["Ăn uống (ngày công tác tỉnh): nhân viên 180.000 đồng; quản lý 250.000 đồng; giám đốc 300.000 đồng (ngày/người). Ngày tham gia tổ chức sự kiện: công ty bố trí ăn uống theo thực tế, không áp dụng định mức.","Khách sạn: nhân viên 350.000 đồng; quản lý 500.000 đồng; giám đốc 700.000 đồng (đêm).","Đón tiễn sân bay: thanh toán theo chi phí thực tế, tối đa 100.000 đồng/chiều; không thanh toán thêm trong trường hợp đã sử dụng xe hoặc ứng dụng của công ty.","Đi lại trong tỉnh: trần 150.000 đồng/ngày; ưu tiên sử dụng ứng dụng công nghệ có hóa đơn; chỉ thuê xe máy khi ứng dụng không khả dụng và được quản lý trực tiếp chấp thuận.","Grab/Be phục vụ công việc: thống nhất 01 ứng dụng theo hợp đồng của công ty; hạn mức hằng tháng: giám đốc 1.500.000 đồng; quản lý/trưởng nhóm 1.000.000 đồng; nhân viên theo từng chuyến được phê duyệt.","Định mức tại Điều này là khung chuẩn của Group; đơn vị thành viên được điều chỉnh linh hoạt theo đặc thù từng dự án trong phạm vi khung cho phép và báo cáo Phòng Nhân sự & Pháp chế."]}]},{"title":"Điều 23. Trách nhiệm thi hành","status":"","src":"","blocks":[{"t":"khoan","items":["Phòng Nhân sự & Pháp chế chịu trách nhiệm hướng dẫn, đôn đốc thực hiện Quy chế này; tổng hợp các vướng mắc phát sinh để báo cáo Ban Giám đốc xem xét, quyết định."]}]}]},{"id":"t5","nav":"TIỆN ÍCH","title":"TIỆN ÍCH","subsections":[{"title":"Tính công tác phí","status":"","src":"","blocks":[{"t":"text","x":"Công cụ ước tính công tác phí theo định mức quy định tại Điều 22."},{"t":"calc"}]}]}];
const HB_WP_RATES={"levels":[["Staff/Junior/Senior/Assistant",180000,350000],["Manager",250000,500000],["Director",300000,700000]],"airport":100000};
function hbBlock(b){if(b.t==='text')return `<div class="hb-text">${esc(b.x||'').replace(/\n/g,'<br>')}</div>`;if(b.t==='list')return `<ul class="hb-list">${(b.items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;if(b.t==='khoan')return `<ol class="hb-khoan">${(b.items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;if(b.t==='table')return `<div class="table-wrap"><table><thead><tr>${(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(b.rows||[]).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;if(b.t==='companies')return (b.items||[]).map(c=>`<div class="hb-company"><b>${esc(c.name)}</b><p>${esc(c.intro||'')}</p>${c.services?`<p><b>Dịch vụ:</b> ${esc(c.services)}</p>`:''}</div>`).join('');if(b.t==='calc')return hbCalcHTML();return ''}
function hbCalcHTML(){return `<div class="form-grid"><div class="field"><label>Cấp bậc</label><select id="hbLv" onchange="hbCalcUpdate()">${HB_WP_RATES.levels.map((l,ix)=>`<option value="${ix}">${esc(l[0])}</option>`).join('')}</select></div><div class="field"><label>Số ngày công tác</label><input id="hbDay" type="number" min="0" value="2" oninput="hbCalcUpdate()"></div><div class="field"><label>Số đêm lưu trú</label><input id="hbNight" type="number" min="0" value="1" oninput="hbCalcUpdate()"></div><div class="field"><label>Hỗ trợ ga/sân bay</label><select id="hbAir" onchange="hbCalcUpdate()"><option value="0">Không</option><option value="1">1 chiều</option><option value="2">Khứ hồi</option></select></div></div><div class="hb-calc-res" id="hbCalcRes"></div>`}
function hbCalcUpdate(){let lv=document.getElementById('hbLv'),re=document.getElementById('hbCalcRes');if(!lv||!re)return;let l=HB_WP_RATES.levels[+lv.value],d=Math.max(0,+document.getElementById('hbDay').value||0),n=Math.max(0,+document.getElementById('hbNight').value||0),a=+document.getElementById('hbAir').value;let f=l[1]*d,h=l[2]*n,ap=HB_WP_RATES.airport*a;re.innerHTML=`Ăn uống: <b>${fmtMoney(f)}</b> · Khách sạn: <b>${fmtMoney(h)}</b> · Sân bay: <b>${fmtMoney(ap)}</b><br>Tổng tối đa: <b style="font-size:17px">${fmtMoney(f+h+ap)}</b>`}

function hbWpIsOpen(tid,ix){let m=window.hbWpOpen||{};let k=tid+':'+ix;return k in m?m[k]:ix===0}
function hbWpToggle(tid,ix){window.hbWpOpen=window.hbWpOpen||{};window.hbWpOpen[tid+':'+ix]=!hbWpIsOpen(tid,ix);render()}
function renderHbWpTabs(){let cur=window.hbWpTab||'t0';let tab=HB_WP_TABS.find(t=>t.id===cur)||HB_WP_TABS[0];if(tab.id==='t5')setTimeout(()=>hbCalcUpdate(),30);let bar=`<div class="tabs">${HB_WP_TABS.map((t,ix)=>`<button class="${t.id===tab.id?'active':''}" onclick="window.hbWpTab='${t.id}';render()">${['I','II','III','IV','V','VI'][ix]}. ${esc(t.nav)}</button>`).join('')}</div>`;let body=tab.subsections.map((sb,ix)=>{let op=hbWpIsOpen(tab.id,ix);return `<div class="hb-sec"><div class="hb-sec-head" onclick="hbWpToggle('${tab.id}',${ix})"><h3>${esc(sb.title)}</h3><span>${op?'\u25BE':'\u25B8'}</span></div>${op?`<div class="hb-sec-body">${(sb.blocks||[]).map(hbBlock).join('')}</div>`:''}</div>`}).join('');return bar+body}
function renderHandbook(kind){let hb=HB_DATA[kind];return `${pageHead(hb.name,`Sổ tay chính thức của Group — tra cứu các phần và nội dung áp dụng cho toàn bộ nhân sự thuộc ${hb.name.replace('Handbook ','')}.`,'')}${(kind==='weplus'||kind==='wewall')?'':`<div class="hb-cover ${hb.cls}"><div style="font-size:12px;font-weight:700;color:#D6BE8B">TGROUP ECOSYSTEM · SỔ TAY NHÂN VIÊN VÀ VẬN HÀNH</div><h2>${hb.name}</h2><div style="color:#C9D4CB;max-width:720px;line-height:1.65;font-size:13.5px">${hb.desc}</div><div class="hb-chips"><span>Phiên bản 1.0</span><span>Hiệu lực từ 2026</span><span>${hb.units}</span></div></div>`}${kind==='weplus'?renderHbWpTabs():''}${kind==='wewall'?renderHbWwTabs():''}${(kind==='weplus'||kind==='wewall')?'':hb.chapters.map((c,idx)=>`<div class="hb-ch"><button class="hb-ch-head" onclick="hbOpen=hbOpen===${idx}?'':${idx};render()"><span class="no">${idx+1}</span><b>Phần ${idx+1} · ${esc(c[0])}</b><span style="color:#8A877D">${hbOpen===idx?'▾':'▸'}</span></button>${hbOpen===idx?`<div class="hb-ch-body"><ul>${c[1].map(li=>`<li>${esc(li)}</li>`).join('')}</ul></div>`:''}</div>`).join('')}<div class="panel" style="margin-top:16px"><div class="panel-head"><h3>VĂN BẢN LIÊN QUAN</h3></div><p class="sub" style="line-height:1.7">Nội dung chi tiết và chế tài thực hiện theo Quy chế, Quy trình tại mục <a href="#" onclick="event.preventDefault();go('processes')">Quy trình và Quy chế</a>. Sổ tay được Phòng Nhân sự và Pháp chế rà soát và cập nhật định kỳ; phiên bản mới nhất luôn là bản đang hiển thị trên hệ thống.</p></div>`}

function cmPost(){let t=document.getElementById('cm-text');if(!t||!t.value.trim())return;let feed=document.getElementById('cm-feed');let ini=currentUser.name.split(' ').map(x=>x[0]).slice(-2).join('');let d=document.createElement('div');d.className='cm-post';d.dataset.chan='chiase';d.innerHTML=`<div class="cm-ava" style="background:var(--green)">${ini}</div><div style="flex:1"><b>${esc(currentUser.name)}</b><span class="cm-tag">Chia sẻ</span><div style="font-size:12px;color:var(--muted)">${esc(currentUser.role)} · Vừa xong</div><p>${esc(t.value.trim())}</p><div class="cm-acts"><span data-n="0" onclick="cmLike(this)">♡ Thích · 0</span><span>Bình luận</span><span>Chia sẻ</span></div></div>`;feed.prepend(d);t.value='';toast('Đã chia sẻ lên Community Tgroup')}

function cmFilter(c,el){cmChan=c;document.querySelectorAll('.cm-chan[data-c]').forEach(x=>x.classList.remove('on'));el.classList.add('on');document.querySelectorAll('#cm-feed .cm-post').forEach(pst=>{pst.style.display=(c==='all'||pst.dataset.chan===c)?'flex':'none'})}

function renderProcesses(){let head=pageHead('Quy trình & Quy chế','Các quy trình vận hành chuẩn và hệ thống văn bản quy chế của toàn Group.','');let tabs=`<div class="tabs"><button class="${procTab==='Quy trình'?'active':''}" onclick="procTab='Quy trình';render()">QUY TRÌNH</button><button class="${procTab==='Quy chế'?'active':''}" onclick="procTab='Quy chế';render()">QUY CHẾ & QUY ĐỊNH</button></div>`;if(procTab==='Quy trình'){let open=PROCESSES.find(p=>p.id===procOpen);return `${head}${tabs}<div class="grid proc-grid">${PROCESSES.map(p=>`<div class="proc-card" onclick="procOpen=procOpen==='${p.id}'?'':'${p.id}';render()"><div class="pc-ico">${p.icon}</div><b>${esc(p.name)}</b><p>${esc(p.desc)}</p><div style="margin-top:10px"><span class="tag">${p.steps.length} bước</span></div></div>`).join('')}</div>${open?`<div class="panel" style="margin-top:15px"><div class="panel-head"><div><h3>${esc(open.name).toUpperCase()}</h3><p>${esc(open.desc)}</p></div><button class="btn small" onclick="procOpen='';render()">Đóng</button></div><div class="steps">${open.steps.map((st,i)=>`<div class="step"><div class="step-n">${i+1}</div><div class="step-body"><b>${esc(st[0])}</b><span class="step-role">${esc(st[1])}</span><p>${esc(st[2])}</p>${st[3]?`<div style="margin-top:7px">${btn(st[3][1],`go('${st[3][0]}')`,'small')}</div>`:''}</div></div>`).join('')}</div></div>`:''}`}let openD=DOCS.find(d=>d.code===docOpen);return `${head}${tabs}<div class="panel"><div class="table-wrap"><table><thead><tr><th>MÃ</th><th>TÊN VĂN BẢN</th><th>NHÓM</th><th>HIỆU LỰC</th><th>PHỤ TRÁCH</th><th>TÓM TẮT</th></tr></thead><tbody>${DOCS.map(d=>`<tr style="cursor:pointer" onclick="docOpen=docOpen==='${d.code}'?'':'${d.code}';render()"><td><b>${d.code}</b></td><td><b>${esc(d.name)}</b></td><td>${esc(d.group)}</td><td>${status(d.eff)}</td><td>${esc(d.owner)}</td><td style="max-width:340px">${esc(d.sum)}</td></tr>`).join('')}</tbody></table></div></div>${openD?`<div class="panel" style="margin-top:14px"><div class="panel-head"><div><h3>${openD.code} — ${esc(openD.name).toUpperCase()}</h3><p>${esc(openD.owner)} · ${esc(openD.eff)}</p></div><button class="btn small" onclick="docOpen='';render()">Đóng</button></div><p style="line-height:1.7;color:#45443F">${esc(openD.sum)}</p><div class="steps" style="margin-top:8px">${openD.points.map(pt=>`<div class="tc-item" style="white-space:normal;padding:6px 0;border-bottom:1px dashed #E7E2D2">• ${esc(pt)}</div>`).join('')}</div></div>`:''}`}

</script><script>
(function(){function fit(el){var max=parseFloat(el.getAttribute('data-fit'))||13;if(!el.clientWidth||!el.scrollWidth)return;var size=max;el.style.setProperty('font-size',size+'px','important');var w=el.scrollWidth,c=el.clientWidth;if(!w||!c)return;size=max*(c/w)*0.995;if(size>max)size=max;if(size<6)size=6;el.style.setProperty('font-size',size+'px','important');var n=0;while(el.scrollWidth>el.clientWidth&&size>6&&n<24){size-=0.2;el.style.setProperty('font-size',size+'px','important');n++}}
function all(){document.querySelectorAll('[data-fit]').forEach(fit)}
window.addEventListener('resize',all);window.addEventListener('orientationchange',all);
new MutationObserver(function(){all()}).observe(document.documentElement,{childList:true,subtree:true});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(all);
document.addEventListener('DOMContentLoaded',function(){all();setTimeout(all,400);setTimeout(all,1200)});})();
</script></body></html>
