ụng lao động (Viết tắt là NSDLĐ)", "CÔNG TY TNHH KIẾN TRÚC XÂY DỰNG THE WALL", "Địa chỉ: 1086/4 Nguyễn Duy Trinh, Phường Long Trường, Tp. Hồ Chí Minh", "Đại diện: Ông Nguyễn Ngọc Hoàng Thái Bảo\t\tChức vụ: Giám đốc", "MST: 0316801077", "Bên B: Người lao động (Viết tắt là NLĐ)", "Ông/bà:", "Ngày sinh:", "Giới tính:\tSố điện thoại: .............................", "Địa chỉ thường trú:", "Số CCCD: ........................... Cấp ngày:\t    Tại: CTCCSQLHCVTTXH", "Sau khi bàn bạc thống nhất, các bên đồng ý ký kết Hợp đồng này với các điều khoản và điều kiện cụ thể như sau:", "Điều 1. Công việc và địa điểm làm việc:", "Công việc:", "Vị trí công việc:", "Phòng ban:", "Báo cáo công việc trực tiếp cho:", "Cấp bậc: Nhân viên", "Công việc phải làm: Theo bảng mô tả công việc (phụ lục mô tả chi tiết công việc)", "Địa điểm làm việc:", "NLĐ làm việc tại địa chỉ: 15 đường 14, khu dân cư Nam Long, P Tân Thuận, Tp. Hồ Chí Minh", "Điều 2. Thời hạn của hợp đồng lao động:", "Loại hợp đồng lao động: HĐLĐ có thời hạn 12 tháng", "Bắt đầu từ ngày: …..tháng…... năm .... đến hết ngày….... tháng…... năm...", "Điều 3. Thời gian làm việc:", "Thời gian làm việc chính thức: Từ Thứ 2 – Thứ 7.", "Sáng: Từ 8h30 – 12h", "Chiều: Từ 13h – 17h30", "Thứ 7: Từ 8h30 – 12h", "Nghỉ giữa ca: Từ 12h – 13h, thời gian nghỉ giữa ca không được tính vào thời giờ làm việc.", "Điều 4. Nghĩa vụ và quyền lợi của NLĐ", "Nghĩa vụ:", "Hoàn thành những công việc đã cam kết trong hợp đồng lao động.", "Chấp hành lệnh điều hành sản xuất kinh doanh, nội quy kỷ luật lao động, an toàn lao động....", "NLĐ có trách nhiệm trả lại cho Công ty các dụng cụ lao động được trang bị lúc làm việc.", "Quyền lợi:", "Mức lương, phụ cấp lương, các khoản bổ sung khác:", "Mức lương theo công việc: 5.690.000 đồng/tháng", "Các khoản hỗ trợ:", "Cơm trưa:", "Giám đốc/ giám đốc điều hành: 200.000 đồng/ngày", "Các cấp giám đốc chuyên môn: 100.000 đồng/ngày", "Trưởng phòng, trưởng nhóm, CBNV: 50.000 đồng/ngày", "Điện thoại:", "Giám đốc/ Trưởng phòng: 1.000.000 đồng/tháng", "Chuyên viên/ nhân viên: 500.000 đồng/tháng", "Trang phục:", "Giám đốc: 1.500.000 đồng/tháng", "Trưởng phòng/ KTT: 1.000.000 đồng/tháng", "CBNV: 400.000 đồng/tháng", "Thưởng doanh số: được áp dụng thực hiện theo Quy chế lương thưởng của Công ty.", "Đối với nhân sự nghỉ việc trong năm, Phòng Nhân sự sẽ đánh giá quá trình làm việc và mức độ hoàn thành nhiệm vụ để quyết định phương án xử lý thu hồi hoặc giữ nguyên khoản tiền thưởng này.", "Tiền lương làm thêm giờ: được tính theo đơn giá tiền lương hoặc tiền lương thực trả theo quy định của pháp luật.", "Chế độ nghỉ ngơi:", "Nghỉ hàng năm (phép năm): 12 ngày/năm", "NLĐ làm việc trong công ty cứ 05 năm được cộng thêm 01 ngày phép năm", "Nghỉ Lễ, Tết: NLĐ được nghỉ 12 ngày/năm", "Hình thức trả lương: Chuyển khoản.", "Tiền lương được trả một tháng một lần. Tiền lương được công ty trả trực tiếp, đầy đủ và đúng thời hạn cho NLĐ căn cứ vào thời gian làm việc thực tế của NLĐ trong tháng đó.", "Trường hợp đặc biệt do thiên tai, hỏa hoạn hoặc lý do bất khả kháng khác mà công ty đã tìm mọi biện pháp khắc phục nhưng không thể trả lương đúng thời hạn thì không được trả chậm quá 01 tháng.", "Thời hạn trả lương: Từ ngày 01 đến ngày 05 hàng tháng. Trường hợp thời điểm trả lương trùng ngày lễ, ngày nghỉ theo quy định thì được trả vào ngày làm việc tiếp theo.", "Chế độ nâng lương:", "Theo quy chế lương, thưởng của công ty.", "Các khoản bổ sung, phúc lợi khác:", "Hàng năm NLĐ được đi du lịch kết hợp team building, sinh nhật theo quy định của công ty.", "Điều 5. Nghĩa vụ và quyền hạn của người sử dụng lao động", "Nghĩa vụ:", "Bảo đảm việc làm và thực hiện đầy đủ những điều đã cam kết trong hợp đồng lao động.", "Thanh toán đầy đủ, đúng thời hạn các chế độ và quyền lợi cho NLĐ theo hợp đồng lao động, thỏa ước lao động tập thể (nếu có).", "Quyền hạn:", "Điều hành NLĐ hoàn thành công việc theo hợp đồng (bố trí, điều chuyển, tạm ngừng việc)", "Tạm hoãn, chấm dứt hợp đồng lao động, kỷ luật NLĐ theo quy định của pháp luật và nội quy lao động của doanh nghiệp.", "Điều 6. An toàn, vệ sinh lao động:", "Công ty bố trí nơi làm việc, trang thiết bị làm việc (bàn ghế, máy tính, thiết bị văn phòng) bảo đảm an toàn, vệ sinh lao động theo quy định của pháp luật.", "NLĐ có trách nhiệm chấp hành nội quy an toàn, vệ sinh lao động, phòng cháy chữa cháy, giữ gìn và sử dụng đúng cách tài sản, thiết bị được giao, và báo ngay cho Công ty khi phát hiện nguy cơ mất an toàn.", "Điều 7. Bảo hiểm xã hội, Bảo hiểm y tế, Bảo hiểm thất nghiệp:", "Trách nhiệm tham gia", "Nghĩa vụ bắt buộc: Công ty và NLĐ có nghĩa vụ tham gia BHXH, BHYT, BHTN bắt buộc theo đúng quy định của pháp luật lao động hiện hành.", "Thời điểm tham gia: Việc đóng bảo hiểm được thực hiện kể từ tháng đầu tiên hai bên ký kết Hợp đồng lao động chính thức.", "Tỷ lệ và mức đóng", "Mức lương đóng bảo hiểm: Là mức lương chính được quy định trong Hợp đồng lao động, không thấp hơn mức lương tối thiểu vùng do Nhà nước quy định.", "Tỷ lệ trích đóng: Công ty và NLĐ cùng đóng theo tỷ lệ phần trăm (%) quy định của pháp luật tại thời điểm đóng.", "Phương thức trừ lương: Hàng tháng, Công ty tự động trích từ tiền lương của NLĐ phần chi phí thuộc trách nhiệm đóng của NLĐ để nộp cho cơ quan Bảo hiểm xã hội.", "Quyền lợi và thủ tục", "Hưởng chế độ: NLĐ được hưởng các chế độ ốm đau, thai sản, tai nạn lao động, hưu trí, khám chữa bệnh và trợ cấp thất nghiệp theo luật định.", "Chốt và trả sổ: Khi chấm dứt hợp đồng lao động hợp pháp, Công ty có trách nhiệm hoàn thành thủ tục chốt sổ BHXH và trả lại cho NLĐ theo quy định.", "Điều 8. Bảo mật", "NLĐ có trách nhiệm giữ bí mật tuyệt đối toàn bộ thông tin mật của Công ty bao gồm: dữ liệu khách hàng, bí mật kinh doanh, mã nguồn, kế hoạch tài chính, chiến lược kinh doanh và các thông tin khác phát sinh trong quá trình làm việc. NLĐ không được phép sao chép, cung cấp hoặc tiết lộ cho bất kỳ bên thứ ba nào nếu không có sự đồng ý bằng văn bản của Công ty.", "Thời hạn bảo mật: Nghĩa vụ bảo mật thông tin nêu trên có hiệu lực ngay khi NLĐ bắt đầu làm việc và tiếp tục duy trì 05 năm sau khi Hợp đồng lao động này chấm dứt.", "Xử lý vi phạm: Trường hợp NLĐ vi phạm quy định bảo mật, gây thiệt hại đến uy tín, tài chính hoặc hoạt động kinh doanh của Công ty, NLĐ sẽ bị xử lý kỷ luật lao động theo Nội quy công ty, đồng thời phải bồi thường toàn bộ thiệt hại thực tế phát sinh và chịu trách nhiệm trước pháp luật.", "Điều 9. Điều khoản thi hành", "Các điều khoản khác không ghi trong hợp đồng này như trách nhiệm vật chất, bồi thường thiệt hại, kỷ luật lao động, giải quyết tranh chấp lao động và các vấn đề khác có liên quan thì thực hiện theo quy định tại Bộ luật Lao động 2019, tại Nghị định 145/2020/NĐ-CP và các văn bản hướng dẫn thi hành.", "Trường hợp các bên tiến hành ký phụ lục hợp đồng thì phụ lục có giá trị thực hiện như hợp đồng. Trường hợp, phụ lục hợp đồng có điều khoản xung đột với hợp đồng thì áp dụng theo phụ lục.", "Hợp đồng lao động được làm thành 02 (hai) bản có giá trị ngang nhau, mỗi bên giữ 01 (một) bản và có hiệu lực từ ngày ….. tháng…..năm 20... Khi hai bên ký kết phụ lục hợp đồng lao động thì nội dung của phụ lục hợp đồng lao động cũng có giá trị như các nội dung của bản hợp đồng lao động này.", "Hợp đồng này làm tại trụ sở của công ty ngày    tháng     năm 20", "NLĐ\tNgười sử dụng lao động", "(Ký và ghi rõ họ tên)\t(Ký, đóng dấu và ghi rõ họ tên)"]}, {"id": "tpl-phu-luc", "name": "Phụ lục hợp đồng lao động", "unit": "thewall", "note": "Mẫu The Wall — kèm theo hợp đồng lao động", "lines": ["PHỤ LỤC 01", "(Kèm theo hợp đồng lao động số:      /HĐLĐ/TW ngày          )", "Chúng tôi, một bên là,", "CÔNG TY TNHH KIẾN TRÚC XÂY DỰNG THE WALL", "Địa chỉ: 1086/4 Nguyễn Duy Trinh, Phường Long Trường, Tp. Hồ Chí Minh", "Đại diện: Ông Nguyễn Ngọc Hoàng Thái Bảo\t\tChức vụ: Giám đốc", "MST: 0316801077", "Và một bên là,", "Ông/Bà:                          \tQuốc tịch: Việt Nam", "Ngày sinh:", "Địa chỉ thường trú:", "Số CCCD:                                           Cấp ngày:", "Nơi cấp: CTCCS QLHCVTTXH", "Thỏa thuận ký kết phụ lục hợp đồng lao động điều chỉnh nội dung điều khoản trong hợp đồng sau đây:", "-", "-", "-", "THỜI GIAN ÁP DỤNG:", "Áp dụng từ ngày 01/10/2025", "NGƯỜI LAO ĐỘNG | NGƯỜI SỬ DỤNG LAO ĐỘNG", "|"]}, {"id": "tpl-bo-nhiem", "name": "Quyết định bổ nhiệm", "unit": "thewall", "note": "Mẫu The Wall", "lines": ["QUYẾT ĐỊNH", "Về việc ………………..", "GIÁM ĐỐC CÔNG TY TNHH KIẾN TRÚC XÂY DỰNG THE WALL", "Căn cứ giấy chứng nhận đăng ký doanh nghiệp số 0316801077 lần đầu ngày 13 tháng 04 năm 2021;", "Căn cứ vào điều lệ, Quy chế, Quy định liên quan của Công ty TNHH Kiến trúc Xây dựng The Wall;", "Căn cứ vào yêu cầu hoạt động kinh doanh;", "Căn cứ vào nhu cầu cán bộ điều hành tổ chức của Công ty;", "Căn cứ vào trách nhiệm và quyền hạn của Giám đốc Công ty,", "QUYẾT ĐỊNH:", "Điều 1. Nay bổ nhiệm Bà: TRẦN THỊ NAM MỸ", "CCCD: 042178000460  Ngày cấp: 26/12/2021 Nơi cấp: CTCCSQLHCVTTXH", "Hộ khẩu thường trú: 43/23 Đường số 1, Long Trường, TP. Thủ Đức, TP. HCM", "Giữ chức vụ: Kế Toán Trưởng của Công ty TNHH Engage Plus.", "Điều 2. Bà TRẦN THỊ NAM MỸ có trách nhiệm và quyền hạn sau:", "Quản lý hoạt động của bộ phận kế toán;", "Giám sát việc quyết toán;", "Đảm bảo tính hợp pháp trong sổ sách kế toán;", "Lập báo cáo tài chính;", "Tham gia phân tích và dự báo nguồn tài chính;", "Nhiệm vụ khác;", "Điều 3. Bà TRẦN THỊ NAM MỸ được hưởng mức lương và trợ cấp theo Quy chế lương thưởng của Công ty.", "Điều 4. Bà TRẦN THỊ NAM MỸ và những người có liên quan chịu trách nhiệm thi hành Quyết định này.", "Quyết định có hiệu lực kể từ ngày ký.", "Nơi nhận:                                                                      GIÁM ĐỐC", "Như điều 4;                                                                                          (Ký tên, đóng dấu)", "Lưu: VT.", "NGUYỄN NGỌC HOÀNG THÁI BẢO", "| CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM", "Độc lập – Tự do – Hạnh phúc", "Số: | Tp.HCM, ngày    tháng     năm 2026", "|"]}];
function printTemplate(id){let t=DOC_TEMPLATES.find(x=>x.id===id);if(!t)return;let le=legalOf(window._formCo||t.unit||'thewall');let rep=(le.representative||'').replace(/^(Ông|Bà)\s+/,'');let fill=l=>{let x=String(l);x=x.split('CÔNG TY TNHH KIẾN TRÚC XÂY DỰNG THE WALL').join((le.name||'').toUpperCase());x=x.split('CÔNG TY TNHH TƯ VẤN THIẾT KẾ KIẾN TRÚC XÂY DỰNG BỨC TƯỜNG').join((le.name||'').toUpperCase());x=x.split('0316801077').join(le.tax_code||'');x=x.split('0309309523').join(le.tax_code||'');x=x.split('1086/4 Nguyễn Duy Trinh, Phường Long Trường, Tp. Hồ Chí Minh').join(le.address||'');x=x.split('1086/4 Nguyễn Duy Trinh, Phường Long Trường, Thành phố Hồ Chí Minh, Việt Nam').join(le.address||'');x=x.split('NGUYỄN NGỌC HOÀNG THÁI BẢO').join(rep.toUpperCase());return x};let body=t.lines.map((l,ix)=>{let x=esc(fill(l));let letters=l.replace(/[^A-Za-zÀ-ỹ]/g,'');let up=letters.length>3&&l.toUpperCase()===l;if(ix<4)return '<p class="c"><b>'+x+'</b></p>';if(up||/^(Điều|CHƯƠNG|PHẦN)\s/.test(l))return '<p class="h">'+x+'</p>';return '<p>'+x+'</p>'}).join('');let html='<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>'+esc(t.name)+'</title><style>body{font-family:Arial,sans-serif;color:#111;margin:0;padding:16mm 15mm;font-size:13px}p{text-align:justify;line-height:1.65;margin:4px 0;vertical-align:middle}.c{text-align:center}.h{font-weight:bold;margin:13px 0 4px}.note{margin-top:26px;font-size:11px;font-style:italic;color:#555;border-top:1px solid #ccc;padding-top:8px}@media print{body{padding:12mm}}</style></head><body>'+body+'<p class="note">Mẫu tham khảo, nạp từ văn bản gốc của đơn vị — kiểm tra và hoàn thiện nội dung trước khi ký. Đơn vị phát hành: '+esc(le.name||'')+'.</p><script>window.onload=()=>window.print()<\/script></body></html>';let w=window.open('','_blank');if(!w){toast('Trình duyệt chặn cửa sổ in. Cho phép pop-up để in mẫu.');return}w.document.open();w.document.write(html);w.document.close();audit('In mẫu văn bản','forms',id,t.name)}
function renderForms(){return `${pageHead('Biểu mẫu & in ấn','Mở xem trước, in A4; mẫu đang dùng cấu trúc nghiệp vụ chung. File QLDA chuẩn chưa có trong bộ tệp hiện tại.', '')}<div class="notice">Biểu mẫu phát hành theo pháp nhân của từng đơn vị. Chọn biểu mẫu để xem trước và in.</div><div class="panel" style="margin-bottom:14px"><div class="field" style="margin:0"><label>Đơn vị phát hành — phiếu in ra mang tên pháp nhân của đơn vị này</label><select id="form-co" onchange="window._formCo=this.value">${COMPANY_SEED.map(c=>`<option value="${c.id}" ${(window._formCo||'engage')===c.id?'selected':''}>${esc(c.name)} — ${esc(c.legal)}</option>`).join('')}</select></div></div><div class="grid companies-grid">${FORMS.map(([id,name])=>`<div class="panel"><div class="panel-head"><div><h3>${name.toUpperCase()}</h3><p>Mẫu A4 · Có vùng ký duyệt</p></div><span class="tag">PDF/In</span></div><p style="color:#777;font-size:12px">Biểu mẫu ${name.toLowerCase()} theo nghiệp vụ TGROUP OS.</p>${btn('Xem trước & in',`printForm('${id}')`,'primary')}</div>`).join('')}<div class="panel" style="margin-top:14px"><div class="panel-head"><div><h3>THƯ VIỆN MẪU HỢP ĐỒNG VÀ VĂN BẢN</h3><p>Mẫu thật của The Wall và Bức Tường — khi in, tên pháp nhân/MST/địa chỉ/đại diện tự điền theo đơn vị phát hành đã chọn ở trên</p></div><span class="tag">${DOC_TEMPLATES.length} mẫu</span></div><div class="grid companies-grid">${DOC_TEMPLATES.map(t=>`<div class="panel"><div class="panel-head"><div><h3>${esc(t.name).toUpperCase()}</h3><p>${esc(t.note||'')}</p></div><span class="tag">In A4</span></div>${btn('Xem trước & in',`printTemplate('${t.id}')`,'primary')}</div>`).join('')}</div></div></div>`}
function renderNotifications(){let notices=[...db.notifications];let birthdays=db.employees.filter(e=>e.birthDate&&e.birthDate.slice(5)===today().slice(5));return `${pageHead('Thông báo nội bộ','Thông báo vận hành và sinh nhật được tính từ dữ liệu nhân sự đã import.',btn('＋ Tạo thông báo','openModal(\'notification\')','primary'))}<div class="panel"><div class="panel-head"><h3>SINH NHẬT HÔM NAY</h3><span class="tag">${birthdays.length}</span></div>${birthdays.map(e=>`<p>${esc(e.name)} · ${esc(companyName(e.companyId))}</p>`).join('')||'<div class="empty">Chưa có dữ liệu sinh nhật phù hợp.</div>'}</div><div class="panel" style="margin-top:14px"><div class="panel-head"><h3>THÔNG BÁO</h3><span class="tag">${notices.length}</span></div>${notices.slice().reverse().map(n=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(n.title)}</b><p style="color:#777;margin:6px 0">${esc(n.body||'')}</p><small style="color:#999">${fmtDate(n.date||today())} · ${esc(n.author||'—')}</small></div>`).join('')||'<div class="empty">Chưa có thông báo nội bộ.</div>'}</div>`}
function auditTable(list){return `<div class="table-wrap"><table><thead><tr><th>THỜI GIAN</th><th>NGƯỜI THAO TÁC</th><th>HÀNH ĐỘNG</th><th>ĐỐI TƯỢNG</th><th>NỘI DUNG</th></tr></thead><tbody>${list.slice(0,200).map(a=>`<tr><td>${esc(new Date(a.at).toLocaleString('vi-VN'))}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.entity)}</td><td>${esc(a.detail||a.entityId||'—')}</td></tr>`).join('')||'<tr><td colspan="5">Chưa có lịch sử thao tác.</td></tr>'}</tbody></table></div>`}
function renderAudit(){return `${pageHead('Lịch sử hệ thống','Audit log ghi thao tác tạo, sửa, xóa, duyệt, nhập kho, xuất kho.',btn('Xuất CSV','exportCSV(\'audit_log\')'))}<div class="filters"><input placeholder="Lọc người thao tác, hành động, đối tượng…" value="${esc(listFilter)}" oninput="listFilter=this.value;render()"></div><div class="panel">${auditTable(db.audit_log.filter(a=>norm([a.user,a.action,a.entity,a.detail].join(' ')).includes(norm(listFilter))))}</div>`}
function renderSettings(){return `${pageHead('Cài đặt hệ thống','Cấu hình dùng chung toàn hệ thống.',btn('Lưu cài đặt','saveSettings()','primary'))}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="panel"><h3>QUY ĐỊNH CHẤM CÔNG</h3><div class="field"><label>Ngày lễ mặc định</label><input id="setting-holidays" type="number" value="${db.settings.holidays}"></div><div class="field"><label>Hệ số tăng ca 1</label><input id="setting-ot15" type="number" step="0.1" value="${db.settings.overtime15}"></div><div class="field"><label>Hệ số tăng ca 2</label><input id="setting-ot20" type="number" step="0.1" value="${db.settings.overtime20}"></div><div class="field"><label>Hạn mức duyệt (VND)</label><input id="setting-limit" type="number" placeholder="Chưa thiết lập" value="${db.settings.approvalLimit??''}"></div></div><div class="panel"><h3>DỮ LIỆU & SAO LƯU</h3><p style="color:#777">Lưu tại trình duyệt hiện tại bằng localStorage. Không đồng bộ giữa thiết bị.</p><div class="actions" style="margin-top:12px">${btn('Xuất JSON','exportData()','primary')}${btn('Nhập JSON','document.getElementById(\'import-file\').click()')}<input type="file" id="import-file" class="hidden" accept="application/json,.json" onchange="importData(this.files[0])">${btn('Nạp lại dữ liệu gốc','resetData()','danger')}</div><p style="font-size:11px;color:#999;margin-top:14px">Dữ liệu được lưu trong trình duyệt của thiết bị này.</p></div><div class="panel"><h3>PHÁP NHÂN</h3><p>${db.legal_entities.length} bản ghi pháp nhân. Cấu trúc pháp nhân tách khỏi công ty thành viên.</p>${btn('＋ Thêm pháp nhân','openModal(\'legal\')')}</div><div class="panel"><h3>TÀI KHOẢN/VAI TRÒ</h3>${USERS.map(u=>`<p style="border-bottom:1px solid var(--line);padding-bottom:8px">${esc(u.name)} <span style="float:right">${status(u.role)}</span></p>`).join('')}</div></div>`}
function renderWorker(){let mine=db.attendance_records.filter(a=>(a.employeeName||a.employeeId)===currentUser.name);return `${pageHead('Chấm công nhân sự','Giao diện tối giản cho vai trò Thợ.', '')}<div class="detail-hero" style="margin-bottom:18px"><div class="avatar" style="width:54px;height:54px">${initials(currentUser.name)}</div><div><h2>${esc(currentUser.name)}</h2><div class="sub">${esc(companyName(currentUser.companyId))} · Vai trò Thợ</div></div></div><div class="worker-actions"><button class="worker-action" onclick="punchClock('in')"><span class="big">↘</span>VÀO CA</button><button class="worker-action" onclick="punchClock('out')"><span class="big">↗</span>RA CA</button><button class="worker-action" onclick="openModal('leave')"><span class="big">▤</span>XIN NGHỈ PHÉP</button><button class="worker-action" onclick="go('attendance')"><span class="big">◷</span>XEM CÔNG</button></div><div class="section-title">CHẤM CÔNG GẦN ĐÂY</div><div class="panel">${mine.length?`<div class="table-wrap"><table><thead><tr><th>NGÀY</th><th>VÀO CA</th><th>RA CA</th><th>GHI CHÚ</th></tr></thead><tbody>${mine.slice().reverse().map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${esc(a.checkIn||'—')}</td><td>${esc(a.checkOut||'—')}</td><td>${esc(a.note||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có bản ghi chấm công.</div>'}</div>`}

function openModal(type,id=null,extra=null){let item=null;const map={company:'operating_units',project:'projects',employee:'employees',client:'clients',supplier:'suppliers',material:'materials'};if(map[type]&&id)item=db[map[type]].find(x=>x.id===id);modalState={type,id,extra,item};let title=({company:'Công ty thành viên',project:'Dự án',task:'Công việc',employee:'Nhân sự',client:'Khách hàng',supplier:'Nhà cung cấp',material:'Vật tư',movement:'Phiếu nhập/xuất kho',budget:'Dự trù ngân sách',voucher:'Chứng từ',payment:'Thanh toán',leave:'Đơn xin nghỉ phép',daily:'Kế hoạch công việc ngày',notification:'Thông báo',legal:'Pháp nhân'})[type]||'Tạo bản ghi';let fields='';const f=(name,label,kind='text',value='',opts=null,required=false,span=false)=>`<div class="field ${span?'span2':''}"><label>${label}${required?' *':''}</label>${kind==='select'?`<select name="${name}" ${required?'required':''}>${(opts||[]).map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:kind==='textarea'?`<textarea name="${name}" ${required?'required':''}>${esc(value)}</textarea>`:`<input name="${name}" type="${kind}" value="${esc(value)}" ${required?'required':''} ${kind==='number'?'step="any"':''}>`}</div>`;const companyOpts=db.operating_units.map(c=>({value:c.id,label:c.name}));const projectOpts=db.projects.map(p=>({value:p.id,label:p.name}));const employeeOpts=[{value:currentUser.name,label:currentUser.name},...db.employees.map(e=>({value:e.name,label:e.name}))];const warehouseOpts=db.warehouses.map(w=>({value:w.id,label:w.name}));const materialOpts=db.materials.map(m=>({value:m.id,label:m.name+' (tồn '+m.stock+')'}));const voucherOpts=db.vouchers.map(v=>({value:v.id,label:v.number||v.name}));const statusOpts=['Chờ duyệt','Đã duyệt','Đã chi','Từ chối'].map(x=>({value:x,label:x}));
switch(type){case'company':fields=f('name','Tên đơn vị','text',item?.name||'',null,true)+f('group','Group','select',item?.group||'WePlus Group',['WePlus Group','WeWall Group'].map(x=>({value:x,label:x})),true)+f('leader','Người phụ trách','text',item?.leader||'',null,true)+f('legal','Pháp nhân','text',item?.legal||'')+f('industry','Ngành nghề','text',item?.industry||'')+f('count','Số nhân sự','number',item?.count??'')+f('color','Màu nhận diện','text',item?.color||'#CAB079')+f('short','Monogram','text',item?.short||'',null,true);break;
case'project':fields=f('name','Tên dự án','text',item?.name||'',null,true)+f('companyId','Đơn vị','select',item?.companyId||extra||db.operating_units[0]?.id,companyOpts,true)+f('owner','Người phụ trách chính','text',item?.owner||'',null,true)+f('status','Trạng thái','select',item?.status||'Đang chuẩn bị',['Đang chuẩn bị','Đang thực hiện','Đã hoàn thành','Trễ hạn','Tạm dừng'].map(x=>({value:x,label:x})),true)+f('start','Ngày bắt đầu','date',item?.start||'')+f('end','Ngày kết thúc','date',item?.end||'')+f('progress','Tiến độ (%)','number',item?.progress??'')+f('budget','Ngân sách (VND)','number',item?.budget??'')+f('note','Ghi chú','textarea',item?.note||'',null,false,true);break;
case'task':fields=f('name','Tên công việc','text','',null,true)+f('projectId','Dự án','select',extra||db.projects[0]?.id,projectOpts,true)+f('owner','Người phụ trách','text',currentUser.name,null,true)+f('due','Hạn hoàn thành','date',today())+f('status','Trạng thái','select','Chưa bắt đầu',['Chưa bắt đầu','Đang thực hiện','Hoàn thành'].map(x=>({value:x,label:x})))+f('note','Ghi chú','textarea','',null,false,true);break;
case'employee':fields=f('name','Họ và tên','text',item?.name||'',null,true)+f('companyId','Đơn vị','select',item?.companyId||db.operating_units[0]?.id,companyOpts,true)+f('position','Chức vụ','text',item?.position||'')+f('phone','Số điện thoại','tel',item?.phone||'')+f('email','Email','email',item?.email||'')+f('birthDate','Ngày sinh','date',item?.birthDate||'')+f('startDate','Ngày vào làm','date',item?.startDate||'');break;
case'client':fields=f('name','Tên khách hàng/đối tác','text',item?.name||'',null,true)+f('companyId','Đơn vị phụ trách','select',item?.companyId||db.operating_units[0]?.id,companyOpts,true)+f('industry','Ngành','text',item?.industry||'')+f('contact','Người liên hệ','text',item?.contact||'')+f('history','Lịch sử làm việc','textarea',item?.history||'',null,false,true);break;
case'supplier':fields=f('name','Tên nhà cung cấp','text','',null,true)+f('category','Nhóm hàng/dịch vụ','text','')+f('contact','Người liên hệ','text','')+f('phone','Điện thoại','tel','')+f('email','Email','email','')+f('note','Ghi chú','textarea','',null,false,true);break;
case'material':fields=f('name','Tên vật tư','text',item?.name||'',null,true)+f('category','Nhóm vật tư','select',item?.category||'Gỗ',['Gỗ','Sắt và inox','Sơn','Nhôm kính','Vật tư sự kiện'].map(x=>({value:x,label:x})),true)+f('warehouseId','Kho','select',item?.warehouseId||'wh-workshop',warehouseOpts,true)+f('opening','Tồn đầu kỳ','number',item?.opening??0,null,true)+f('stock','Tồn hiện tại','number',item?.stock??0,null,true);break;
case'movement':fields=f('type','Loại giao dịch','select','Nhập',[{value:'Nhập',label:'Nhập kho'},{value:'Xuất',label:'Xuất kho'}],true)+f('materialId','Vật tư','select',db.materials[0]?.id,materialOpts,true)+f('warehouseId','Kho','select',db.materials[0]?.warehouseId||'wh-workshop',warehouseOpts,true)+f('quantity','Số lượng','number','',null,true)+f('projectId','Dự án nhận (nếu xuất)','select','',[{value:'',label:'Không gắn dự án'},...projectOpts])+f('date','Ngày','date',today(),null,true)+f('note','Ghi chú','textarea','',null,false,true);break;
case'budget':fields=f('name','Tên hạng mục dự trù','text','',null,true)+f('companyId','Đơn vị','select',db.operating_units[0]?.id,companyOpts,true)+f('projectId','Dự án','select',extra||'', [{value:'',label:'Không gắn dự án'},...projectOpts])+f('amount','Số tiền dự trù (VND)','number','',null,true)+f('status','Trạng thái','select','Đang theo dõi',[{value:'Đang theo dõi',label:'Đang theo dõi'},{value:'Đã duyệt',label:'Đã duyệt'}]);break;
case'voucher':fields=f('name','Tên chứng từ','text','',null,true)+f('kind','Loại biểu mẫu','select','expense',FORMS.map(([value,label])=>({value,label})),true)+f('companyId','Đơn vị','select',db.operating_units[0]?.id,companyOpts,true)+f('projectId','Dự án','select',extra||'', [{value:'',label:'Không gắn dự án'},...projectOpts])+f('budgetItemId','Hạng mục dự trù','select','',[{value:'',label:'Không gắn hạng mục'},...db.budget_items.map(b=>({value:b.id,label:b.name}))])+f('amount','Số tiền (VND)','number','',null,true)+f('note','Diễn giải','textarea','',null,false,true);break;
case'payment':fields=f('name','Nội dung thanh toán','text','',null,true)+f('voucherId','Chứng từ','select',db.vouchers[0]?.id||'',voucherOpts,true)+f('amount','Số tiền (VND)','number','',null,true)+f('date','Ngày thanh toán','date',today(),null,true)+f('status','Trạng thái','select','Đã ghi nhận',[{value:'Đã ghi nhận',label:'Đã ghi nhận'},{value:'Chờ thanh toán',label:'Chờ thanh toán'}]);break;
case'leave':fields=f('employeeName','Nhân sự','text',currentUser.name,null,true)+f('type','Loại nghỉ','select','Phép năm',['Phép năm','Nghỉ không lương','Nghỉ ốm','Khác'].map(x=>({value:x,label:x})))+f('start','Từ ngày','date',today(),null,true)+f('end','Đến ngày','date',today(),null,true)+f('reason','Lý do','textarea','',null,true,true);break;
case'daily':fields=f('name','Công việc','text','',null,true)+f('date','Ngày','date',today(),null,true)+f('team','Tổ/đơn vị','text','')+f('projectId','Dự án','select','',[{value:'',label:'Không gắn dự án'},...projectOpts])+f('owner','Người phụ trách','text',currentUser.name,null,true)+f('status','Trạng thái','select','Chưa bắt đầu',['Chưa bắt đầu','Đang thực hiện','Hoàn thành'].map(x=>({value:x,label:x})))+f('note','Ghi chú','textarea','',null,false,true);break;
case'notification':fields=f('title','Tiêu đề','text','',null,true)+f('body','Nội dung','textarea','',null,true,true)+f('date','Ngày','date',today());break;
case'legal':fields=f('name','Tên pháp nhân','text','',null,true)+f('taxCode','Mã số thuế','text','')+f('address','Địa chỉ','text',CONFIG.ORG.hq)+f('phone','Điện thoại','tel','')+f('email','Email','email','');break;
}
showModal(title,`<form id="record-form" onsubmit="event.preventDefault();saveRecord()"><div class="form-grid">${fields}</div><input type="hidden" name="__type" value="${type}"><input type="hidden" name="__id" value="${id||''}"><input type="hidden" name="__extra" value="${extra||''}"></form>`,true)}
function showModal(title,body,withForm=false){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="btn small" onclick="closeModal()">Đóng ×</button></div><div class="modal-body">${body}</div>${withForm?'<div class="modal-foot"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="document.getElementById(\'record-form\').requestSubmit()">Lưu bản ghi</button></div>':''}</div></div>`}function closeModal(){document.getElementById('modal-root').innerHTML='';modalState=null}
function saveRecord(){let form=document.getElementById('record-form');if(!form.reportValidity())return;let fd=new FormData(form),x=Object.fromEntries(fd.entries()),type=x.__type,id=x.__id,extra=x.__extra;delete x.__type;delete x.__id;delete x.__extra;for(let k of ['count','progress','budget','amount','opening','stock','quantity'])if(x[k]!==undefined&&x[k]!=='')x[k]=Number(x[k]);else if(x[k]==='')x[k]=null;if(x.start&&x.end&&x.end<x.start){toast('Ngày kết thúc không được trước ngày bắt đầu.');return}if(type==='project'&&(!(Number(x.budget)>0))){toast('Ngân sách dự án phải lớn hơn 0.');return}if(type==='project'&&x.progress!=null&&(x.progress<0||x.progress>100)){toast('Tiến độ phải từ 0 đến 100%.');return}if(type==='project'&&x.budget==null){toast('Ngân sách dự án phải lớn hơn 0.');return}
let coll=({company:'operating_units',project:'projects',employee:'employees',client:'clients',supplier:'suppliers',material:'materials',task:'tasks',budget:'budgets',voucher:'vouchers',payment:'payments',leave:'leave_requests',daily:'daily_plans',notification:'notifications',legal:'legal_entities'})[type];if(type==='movement'){let m=db.materials.find(a=>a.id===x.materialId);if(!m){toast('Không tìm thấy vật tư.');return}if(x.type==='Xuất'&&Number(x.quantity)>m.stock){toast(`Không thể xuất ${x.quantity}; tồn hiện tại chỉ ${m.stock}.`);return}if(!(Number(x.quantity)>0)){toast('Số lượng phải lớn hơn 0.');return}m.stock+=x.type==='Nhập'?Number(x.quantity):-Number(x.quantity);let rec={id:uid('move'),...x,quantity:Number(x.quantity),user:currentUser.name};db.stock_movements.push(rec);audit(x.type==='Nhập'?'Nhập kho':'Xuất kho','stock_movements',rec.id,`${m.name}: ${x.quantity}; tồn mới ${m.stock}`);closeModal();render();toast('Đã ghi nhận giao dịch kho.');return}

function printProjectReport(onlyId){

const BOD_MEMBERS=['Nguyễn Bình An Tâm','Đào Thế Kiệt','Nguyễn Huỳnh Ngọc Hà','Nguyễn Ngọc Hoàng Thái Bảo','Lê Thị Cẩm Phượng','Võ Thị Ngọc Hạnh','Trần Thị Nam Mỹ','Lê Thị Phương Hà','Nguyễn Quang Minh'];
function daysUntil(d){if(!d)return null;let t=new Date(today()+'T00:00:00'),x=new Date(d+'T00:00:00');if(isNaN(x))return null;return Math.round((x-t)/86400000)}
function nextBirthdayIn(e){if(!e.birthDate)return null;let b=new Date(e.birthDate+'T00:00:00');if(isNaN(b))return null;let t=new Date(today()+'T00:00:00'),n=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());return Math.round((n-t)/86400000)}
function attentionItems(){let items=[],T=today();
db.tasks.filter(t=>t.due&&t.due<T&&t.status!=='Hoàn thành').forEach(t=>items.push({tag:'VIỆC QUÁ HẠN',label:t.name,sub:'Phụ trách: '+(t.owner||'—')+' · Hạn '+fmtDate(t.due),action:"go('tasks')"}));
db.projects.filter(p=>p.end&&p.end<T&&p.status!=='Đã hoàn thành').forEach(p=>items.push({tag:'DỰ ÁN TRỄ',label:p.name,sub:companyName(p.companyId)+' · Kết thúc '+fmtDate(p.end),action:`openProject('${p.id}')`}));
let pv=db.vouchers.filter(v=>v.status==='Chờ duyệt');if(pv.length)items.push({tag:'CHỨNG TỪ',label:pv.length+' chứng từ đang chờ duyệt',sub:pv.map(v=>v.number).join(', '),action:"go('vouchers')"});
let pl=db.leave_requests.filter(x=>x.status==='Chờ duyệt');if(pl.length)items.push({tag:'NGHỈ PHÉP',label:pl.length+' đơn nghỉ phép đang chờ duyệt',sub:pl.map(x=>x.employeeName).join(', '),action:"go('leave')"});
db.materials.filter(m=>Number(m.stock)<10).forEach(m=>items.push({tag:'TỒN KHO THẤP',label:m.name,sub:'Tồn hiện tại: '+m.stock+' '+(m.unit||''),action:"go('materials')"}));
db.employees.forEach(e=>{let d=nextBirthdayIn(e);if(d!=null&&d<=7)items.push({tag:'SINH NHẬT',label:'Sinh nhật '+e.name,sub:companyName(e.companyId)+' · '+(d===0?'Hôm nay':'Còn '+d+' ngày'),action:`openEmployee('${e.id}')`})});
(db.meetings||[]).forEach(m=>{let d=daysUntil(m.date);if(d!=null&&d>=0&&d<=7)items.push({tag:'CUỘC HỌP',label:m.title,sub:fmtDate(m.date)+' · '+(m.time||''),action:`openMeeting('${m.id}')`})});
(db.contracts||[]).forEach(c=>{let d=daysUntil(c.endDate);if(d!=null&&d>=0&&d<=30)items.push({tag:'HỢP ĐỒNG',label:c.code+' — '+c.partner,sub:'Hết hạn '+fmtDate(c.endDate)+' (còn '+d+' ngày)',action:"go('contracts')"})});
return items}

function okrCreate(){let t=document.getElementById('ok-title').value.trim();if(!t)return toast('Nhập mục tiêu');let lv=document.getElementById('ok-level').value,isUnit=db.operating_units.some(c=>c.id===lv);let pv=document.getElementById('ok-prog').value;db.okrs=db.okrs||[];db.okrs.push({id:uid('okr'),title:t,level:isUnit?companyName(lv):lv,companyId:isUnit?lv:'',progress:pv===''?null:Math.max(0,Math.min(100,Number(pv))),krs:document.getElementById('ok-krs').value.split('\n').map(x=>x.trim()).filter(Boolean)});saveDB();toast('Đã thêm mục tiêu');render()}
function renderCashflow(){let ps=db.projects.filter(p=>p.budget!=null);let tb=ps.reduce((a,p)=>a+Number(p.budget||0),0),ts=ps.reduce((a,p)=>a+Number(p.spent||0),0);let max=Math.max(1,...ps.map(p=>Number(p.budget||0)));let months={};db.payments.forEach(p=>{let k=(p.date||'').slice(0,7);if(k)months[k]=(months[k]||0)+Number(p.amount||0)});let mk=Object.keys(months).sort();let approved=db.vouchers.filter(v=>v.status==='Đã duyệt').reduce((a,v)=>a+Number(v.amount||0),0);return `${pageHead('Ngân sách & dòng tiền','Dự trù đối chiếu đã chi theo dự án; dòng tiền thực tế ghi nhận từ các khoản thanh toán.','')}<div class="grid kpis"><div class="kpi"><div class="kpi-top">TỔNG DỰ TRÙ</div><div class="kpi-num" style="font-size:19px">${fmtMoney(tb)}</div><div class="kpi-foot">${ps.length} dự án có dự trù</div></div><div class="kpi"><div class="kpi-top">TỔNG ĐÃ CHI</div><div class="kpi-num" style="font-size:19px">${fmtMoney(ts)}</div><div class="kpi-foot">${tb?Math.round(ts/tb*100):0}% dự trù</div></div><div class="kpi"><div class="kpi-top">CÒN LẠI</div><div class="kpi-num" style="font-size:19px">${fmtMoney(tb-ts)}</div></div><div class="kpi"><div class="kpi-top">ĐÃ DUYỆT CHƯA THANH TOÁN</div><div class="kpi-num" style="font-size:19px">${fmtMoney(approved)}</div><div class="kpi-foot">Nhu cầu chi gần nhất</div></div></div><div class="panel"><div class="panel-head"><h3>DỰ TRÙ VÀ ĐÃ CHI THEO DỰ ÁN</h3></div><div class="table-wrap"><table><thead><tr><th>DỰ ÁN</th><th>CÔNG TY</th><th>DỰ TRÙ</th><th>ĐÃ CHI</th><th>% DÙNG</th><th>SO SÁNH</th></tr></thead><tbody>${ps.map(p=>{let pct=p.budget?Math.round(Number(p.spent||0)/Number(p.budget)*100):0;return `<tr><td><b style="cursor:pointer" onclick="openProject('${p.id}')">${esc(p.name)}</b></td><td>${esc(companyName(p.companyId))}</td><td>${fmtMoney(p.budget)}</td><td>${fmtMoney(p.spent||0)}</td><td>${status(pct>=90?'Đã dùng '+pct+'%':'Đã dùng '+pct+'%')}</td><td><div class="cf-bar"><i class="bar-grow" style="width:${Math.round(Number(p.budget||0)/max*100)}%;background:#B8B2A0"></i></div><div class="cf-bar" style="margin-top:4px"><i class="bar-grow" style="width:${Math.round(Number(p.spent||0)/max*100)}%;background:${pct>=90?'#C62828':'#2E7D32'}"></i></div></td></tr>`}).join('')||'<tr><td colspan="6">Chưa có dự án nào có số dự trù.</td></tr>'}</tbody></table></div></div><div class="panel" style="margin-top:14px"><div class="panel-head"><h3>DÒNG TIỀN RA THỰC TẾ THEO THÁNG</h3></div>${mk.length?`<div class="bars">${mk.map(k=>`<div class="bar-col"><div class="bar-val">${fmtMoney(months[k])}</div><div class="bar-track"><i class="bar-up" style="height:${Math.max(6,Math.round(months[k]/Math.max(...Object.values(months))*100))}%"></i></div><div class="bar-lab">${k.slice(5)}/${k.slice(0,4)}</div></div>`).join('')}</div>`:'<div class="empty">Chưa có thanh toán nào được ghi nhận.</div>'}</div>`}
function autoRisks(){let out=[],T=today();db.projects.filter(p=>p.end&&p.end<T&&p.status!=='Đã hoàn thành').forEach(p=>out.push({name:'Dự án quá hạn chưa hoàn thành: '+p.name,companyId:p.companyId,likelihood:'Cao',impact:'Cao',owner:p.owner||'',mitigation:'Rà soát tiến độ và chốt mốc hoàn thành mới',src:'Dự án'}));db.budgets.filter(b=>Number(b.amount)>0&&Number(b.spent||0)/Number(b.amount)>=0.9).forEach(b=>out.push({name:'Dự án đã dùng ≥90% dự trù: '+(db.projects.find(p=>p.id===b.projectId)?.name||b.name),companyId:b.companyId,likelihood:'Cao',impact:'Cao',owner:'',mitigation:'Kiểm soát phát sinh, duyệt bổ sung trước khi chi tiếp',src:'Ngân sách'}));db.materials.filter(m=>Number(m.stock)<10).forEach(m=>out.push({name:'Vật tư tồn thấp: '+m.name+' (tồn '+m.stock+')',companyId:m.companyId,likelihood:'Trung bình',impact:'Trung bình',owner:'',mitigation:'Lên kế hoạch nhập bổ sung',src:'Kho vận'}));let pv=db.vouchers.filter(v=>v.status==='Chờ duyệt').length;if(pv)out.push({name:'Có '+pv+' chứng từ đang chờ duyệt',companyId:'',likelihood:'Trung bình',impact:'Thấp',owner:'Huỳnh Thị Bạch Tuyết',mitigation:'Duyệt hoặc phản hồi trong ngày',src:'Chứng từ'});let pl=db.leave_requests.filter(x=>x.status==='Chờ duyệt').length;if(pl)out.push({name:'Có '+pl+' đơn nghỉ phép đang chờ duyệt',companyId:'',likelihood:'Thấp',impact:'Thấp',owner:'Trần Thị Nam Mỹ',mitigation:'Duyệt đơn và sắp xếp người thay thế',src:'Nhân sự'});return out}
function renderRisks(){let all=[...autoRisks(),...(db.risks||[]).map(r=>({...r,src:'Thủ công'}))];let L=['Thấp','Trung bình','Cao'];let cell=(lk,im)=>{let n=all.filter(r=>r.likelihood===lk&&r.impact===im).length;let bg=lk==='Cao'&&im==='Cao'?'#F6D5D2':(lk==='Thấp'&&im==='Thấp')?'#E4EFE2':(lk==='Cao'||im==='Cao')?'#F4ECDA':'#F3EEE5';return `<div class="heat-cell" style="background:${bg}">${n?n+' rủi ro':'—'}<div style="font-weight:600;font-size:11px;color:#6d6a5e;margin-top:4px">${lk} × ${im}</div></div>`};return `${pageHead('Rủi ro & bản đồ nhiệt','Sổ rủi ro toàn Group: tín hiệu tự động từ dữ liệu vận hành và rủi ro ghi nhận thủ công.',btn('＋ Thêm rủi ro','document.getElementById(\'risk-form\').style.display=document.getElementById(\'risk-form\').style.display===\'none\'?\'block\':\'none\'','primary'))}<div class="grid two"><div class="panel"><div class="panel-head"><h3>BẢN ĐỒ NHIỆT (KHẢ NĂNG × ẢNH HƯỞNG)</h3></div><div class="heat">${L.slice().reverse().map(lk=>L.map(im=>cell(lk,im)).join('')).join('')}</div></div><div class="panel" id="risk-form" style="display:none"><div class="panel-head"><h3>THÊM RỦI RO</h3></div><div class="form-grid"><div class="field span2"><label>Tên rủi ro *</label><input id="rk-name"></div><div class="field"><label>Đơn vị</label><select id="rk-comp"><option value="">Toàn Group</option>${db.operating_units.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Người phụ trách</label><input id="rk-owner"></div><div class="field"><label>Khả năng</label><select id="rk-lk"><option>Thấp</option><option selected>Trung bình</option><option>Cao</option></select></div><div class="field"><label>Mức ảnh hưởng</label><select id="rk-im"><option>Thấp</option><option selected>Trung bình</option><option>Cao</option></select></div><div class="field span2"><label>Biện pháp xử lý</label><textarea id="rk-mit"></textarea></div></div><div style="margin-top:10px">${btn('Lưu rủi ro','riskCreate()','primary')}</div></div></div><div class="panel" style="margin-top:14px"><div class="panel-head"><h3>SỔ RỦI RO</h3><span class="sub">${all.length} rủi ro</span></div><div class="table-wrap"><table><thead><tr><th>RỦI RO</th><th>CÔNG TY</th><th>KHẢ NĂNG</th><th>ẢNH HƯỞNG</th><th>NGUỒN</th><th>PHỤ TRÁCH</th><th>BIỆN PHÁP</th></tr></thead><tbody>${all.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.companyId?esc(companyName(r.companyId)):'Toàn Group'}</td><td>${status(r.likelihood)}</td><td>${status(r.impact)}</td><td>${esc(r.src||'Thủ công')}</td><td>${esc(r.owner||'—')}</td><td>${esc(r.mitigation||'—')}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có rủi ro nào.</td></tr>'}</tbody></table></div></div>`}

function radarItems(days){let out=[],T=today();db.projects.forEach(p=>{let d=daysUntil(p.end);if(d!=null&&d>=0&&d<=days)out.push({type:'Dự án kết thúc',name:p.name,when:p.end,d,action:`openProject('${p.id}')`})});db.tasks.forEach(t=>{let d=daysUntil(t.due);if(d!=null&&d>=0&&d<=days&&t.status!=='Hoàn thành')out.push({type:'Công việc đến hạn',name:t.name,when:t.due,d,action:"go('tasks')"})});(db.contracts||[]).forEach(c=>{let d=daysUntil(c.endDate);if(d!=null&&d>=0&&d<=days)out.push({type:'Hợp đồng hết hạn',name:c.code+' — '+c.partner,when:c.endDate,d,action:"go('contracts')"})});(db.meetings||[]).forEach(m=>{let d=daysUntil(m.date);if(d!=null&&d>=0&&d<=days)out.push({type:'Cuộc họp',name:m.title,when:m.date,d,action:`openMeeting('${m.id}')`})});db.employees.forEach(e=>{let d=nextBirthdayIn(e);if(d!=null&&d<=days)out.push({type:'Sinh nhật nhân sự',name:e.name+' — '+companyName(e.companyId),when:'',d,action:`openEmployee('${e.id}')`})});return out.sort((a,b)=>a.d-b.d)}
function renderRadar(){let items=radarItems(radarDays);return `${pageHead('Công việc đến hạn','Mọi mốc sắp đến hạn trong '+radarDays+' ngày tới, tổng hợp từ dự án, công việc, hợp đồng, cuộc họp và nhân sự.','')}<div class="filters">${[30,60,90].map(d=>`<button class="btn ${radarDays===d?'primary':''}" onclick="radarDays=${d};render()">${d} ngày</button>`).join('')}</div><div class="panel"><div class="table-wrap"><table><thead><tr><th>LOẠI</th><th>NỘI DUNG</th><th>NGÀY</th><th>CÒN</th></tr></thead><tbody>${items.map(i=>`<tr style="cursor:pointer" onclick="${i.action}"><td>${status(i.type)}</td><td><b>${esc(i.name)}</b></td><td>${i.when?fmtDate(i.when):'—'}</td><td><b>${i.d===0?'Hôm nay':i.d+' ngày'}</b></td></tr>`).join('')||'<tr><td colspan="4">Không có mốc nào đến hạn trong khoảng đã chọn.</td></tr>'}</tbody></table></div></div>`}

const PAY_PERIODS=[{id:'2026-09',label:'09/2026',status:'Đã chi trả'},{id:'2026-10',label:'10/2026',status:'Đã duyệt'}];
const PAY_BASE={engage:14500000,eplus:15500000,enabler:12500000,golfcare:13500000,'nguyenmoc-ads':12000000,thewall:16500000,buctuong:15000000,'nguyenmoc-interior':11500000,greenwall:11000000,shared:18000000};
const PAY_ALLOW={engage:.10,eplus:.10,enabler:.09,golfcare:.10,'nguyenmoc-ads':.09,thewall:.11,buctuong:.10,'nguyenmoc-interior':.08,greenwall:.08,shared:.12};
const PAY_OT={engage:.10,eplus:.06,enabler:.12,golfcare:.09,'nguyenmoc-ads':.10,thewall:.05,buctuong:.05,'nguyenmoc-interior':.18,greenwall:.08,shared:.02};
const PAY_ROLE_BASE={'Developer':30000000,'Chủ tịch':60000000,'Giám đốc công ty':38000000,'HR':22000000,'Kế toán':20000000};
function payHash(str){let h=7;for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0}return h}
function payUnit(cid,period){let base0=PAY_BASE[cid]||12000000;let h=payHash(cid+'|'+period);let base=Math.round(base0*(1+((h%5)-2)*0.004)/1000)*1000;let allow=Math.round(base*(PAY_ALLOW[cid]||.10)/1000)*1000;let ot=Math.round(base*(PAY_OT[cid]||.06)*(0.9+((h>>3)%5)*0.05)/1000)*1000;let ded=Math.round(base*0.105/1000)*1000;return{base,allow,ot,ded,net:base+allow+ot-ded}}
function payrollRows(period){let rows=db.operating_units.map(c=>{let n=db.employees.filter(e=>e.companyId===c.id).length;let u=payUnit(c.id,period);return{cid:c.id,name:c.name,color:c.color,n,base:u.base*n,allow:u.allow*n,ot:u.ot*n,ded:u.ded*n,net:u.net*n}});let sn=db.employees.filter(e=>!e.companyId).length;if(sn){let u=payUnit('shared',period);rows.push({cid:'shared',name:'Khối hỗ trợ và phát triển',color:'#666666',n:sn,base:u.base*sn,allow:u.allow*sn,ot:u.ot*sn,ded:u.ded*sn,net:u.net*sn})}return rows}
function payslipFor(user,period){let base0=PAY_ROLE_BASE[user.role]||15000000;let h=payHash(user.name+'|'+period);let base=Math.round(base0*(1+((h%3)-1)*0.003)/1000)*1000;let allow=Math.round(base*0.10/1000)*1000;let otR=user.role==='Giám đốc công ty'?0.08:user.role==='Developer'?0.05:0.03;let ot=Math.round(base*otR/1000)*1000;let ded=Math.round(base*0.105/1000)*1000;return{base,allow,ot,ded,net:base+allow+ot-ded}}

['Chấm công và tính lương Nguyễn Mộc',['Giờ hành chính 7:30–17:00, Thứ 2 đến Thứ 7.','Tăng ca: hệ số 1,5 trong tuần sau 17:00 và Chủ nhật trong giờ hành chính; hệ số 2,0 Chủ nhật sau 17:00.','Phụ cấp: xăng xe 30.000đ cho điểm đầu, cộng 15.000đ từ điểm thứ hai; cơm trưa 30.000đ; cơm tăng ca 20.000đ khi tăng ca trên 2 giờ.','Chấm công qua ứng dụng; quên chấm công báo Quản lý trong ngày hôm sau để xem xét tính công.']],
