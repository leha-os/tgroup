y)", "ĐIỀU 2: THỜI GIAN THỰC HIỆN", "Thời gian thực hiện :", "40 ngày ( không tính Chủ Nhật )", "Ngày bắt đầu : 12/08/2026", "Ngày kết thúc : 26/09/2026", "Tiến độ thi công chi tiết sẽ theo biên bản làm việc trực tiếp tại công trình.", "Trong trường hợp tiến độ Bên B nhanh hơn dự kiến, Bên B tự sắp xếp nhân sự nhưng không ảnh hưởng các dự án khác bên B đang tham gia trong hệ thống công ty.", "Trong trường hợp cần đẩy nhanh tiến độ 2 Bên phối hợp chốt việc tăng nhân sự thi công The Wall quyết định về nhân công.", "Nhân sự tối thiểu tại dự án : 8 người / ngày.", "Trường hợp Bên B không bố trí đủ tối thiểu 08 nhân sự/ngày theo cam kết, Bên A có quyền yêu cầu Bên B bổ sung nhân sự trong thời hạn 24 giờ. Nếu Bên B không khắc phục, Bên A có quyền thuê nhân sự/đơn vị khác thực hiện và khấu trừ toàn bộ chi phí phát sinh vào giá trị thanh toán của Bên B.", "Nếu điều kiện mặt bằng bên A đáp ứng đầy đủ - bên B không đáp ứng đúng tiến độ sẽ phạt 1.000.000 vnđ / ngày trễ tiến độ. Nếu Bên B chậm tiến độ quá 10 ngày mà không có lý do chính đáng hoặc không khắc phục theo yêu cầu của Bên A thì Bên A có quyền đơn phương chấm dứt Hợp đồng; Bên B phải chịu phạt vi phạm (nếu có), bồi thường thiệt hại và chỉ được thanh toán giá trị khối lượng đã được nghiệm thu, sau khi trừ các khoản bồi thường, chi phí khắc phục và nghĩa vụ tài chính khác theo Hợp đồng.", "Trong các trường hợp phát sinh việc ngoài ý muốn tại dự án làm ảnh hưởng tiến độ Bên A và Bên B sẽ trao đổi thống nhất tiến độ lại bằng biên bản cam kết tại dự án.", "ĐIỀU 3: KHỐI LƯỢNG, GIÁ TRỊ HỢP ĐỒNG & HÌNH THỨC THANH TOÁN", "Hợp đồng : 192.460.265 ( chưa bao gồm VAT)", "Bằng chữ: .................................................................................................................................", "* Khối lượng thi công nghiệm thu thực tế tại công trình.", "Bên B có trách nhiệm cung cấp giàn giáo, mâm.. Trong quá trình thi công bên B chịu trách nhiệm quản lý giàn giáo, mâm mà Bên B đã cung cấp. Trong trường hợp thất thoát trong quá trình thi công bên A sẽ không chịu trách nhiệm đền bù.", "Đơn giá trên sẽ không thay đổi trong suốt thời gian thực hiện hợp đồng.", "Giá trị Hợp đồng là giá trị tạm tính theo khối lượng dự kiến. Giá trị thanh toán cuối cùng được xác định trên cơ sở khối lượng thực tế được Bên A nghiệm thu và đơn giá cố định tại Hợp đồng. Bên B không được yêu cầu thanh toán đối với khối lượng chưa được Bên A nghiệm thu bằng văn bản.", "Mọi khối lượng phát sinh ngoài phạm vi Hợp đồng chỉ được thực hiện và thanh toán khi có văn bản chấp thuận trước của Bên A.", "Trường hợp Bên B ngừng thi công, bỏ dở công trình, vi phạm nghiêm trọng hoặc Hợp đồng bị chấm dứt do lỗi của Bên B, Bên B có nghĩa vụ hoàn trả toàn bộ số tiền tạm ứng chưa được cấn trừ trong thời hạn 03 ngày kể từ ngày Bên A có yêu cầu . Bên A có quyền cấn trừ mọi khoản tiền Bên B phải trả vào bất kỳ khoản thanh toán nào còn lại.", "Hình thức thanh toán:", "Việc thanh toán được thực hiện trên cơ sở khối lượng nghiệm thu thực tế, hồ sơ thanh toán hợp lệ và hóa đơn ( nếu có ) như sau :", "Đợt 1: Trong vòng 7 ngày kể từ ngày Hợp đồng có hiệu lực, Bên A tạm ứng cho Bên B 30% giá trị Hợp đồng.", "Đợt 2: Khi Bên B hoàn thành 70% khối lượng công việc theo Hợp đồng và được Bên A nghiệm thu, Bên A thanh toán cho Bên B đến 90% giá trị khối lượng nghiệm thu thực tế lũy kế, sau khi khấu trừ giá trị đã tạm ứng và các khoản phải khấu trừ khác (nếu có). Hồ sơ nghiệm thu bao gồm:", "Biên bản nghiệm thu khối lượng thực tế đạt 70% được giám sát bên A ký xác nhận.", "Đợt 3: Khi Bên B hoàn thành 90% khối lượng công việc theo Hợp đồng và được Bên A nghiệm thu, Bên A thanh toán cho Bên B đến 90% giá trị khối lượng nghiệm thu thực tế lũy kế, sau khi khấu trừ giá trị đã tạm ứng và các khoản phải khấu trừ khác (nếu có).", "Biên bản nghiệm thu khối lượng thực tế đạt 90% được giám sát bên A ký xác nhận.", "Quyết toán: Sau khi công trình được nghiệm thu hoàn thành, bàn giao đưa vào sử dụng và hai bên ký Biên bản quyết toán, Bên A thanh toán để tổng giá trị đã thanh toán đạt 95% giá trị quyết toán.", "Biên bản nghiệm thu khối lượng thực tế đã hoàn thành đạt chất lượng được giám sát bên A ký xác nhận.", "Bảo hành: Bên A giữ lại  5% bảo hành sẽ thanh toán cho Bên B sau 12 tháng, tính từ thời gian ký biên bản nghệm thu và bàn giao.", "Trong thời gian 12 tháng bảo hành kể từ ngày hoàn tất công trình (căn cứ vào biên bản nghiệm thu và bàn giao). Trong thời gian bảo hành Bên B sẽ sửa chữa tất cả các hư hỏng, khuyết tật do sản phẩm và kỹ thuật mà Bên B đã thi công.", "ĐIỀU 4: PHẦN NGHIỆM THU", "Nghiệm thu 3 bên : Giám sát Bên A - Giám sát bên B – TVGS của CĐT.", "Việc TVGS/Chủ đầu tư ký nghiệm thu không đồng nghĩa với việc Bên A mặc nhiên phải thanh toán cho Bên B nếu hồ sơ thanh toán chưa đầy đủ hoặc Bên B còn nghĩa vụ phải khắc phục.", "Sau mỗi công đoạn thi công Bên B phải báo trước cho Bên A 24 giờ để tiến hành kiểm tra, nghiệm thu mới được thi công. Mọi công việc bị che khuất phải được nghiệm thu trước khi triển khai công việc tiếp theo.", "Bên A có trách nhiệm nghiệm thu cho Bên B. Nghiệm thu được ghi trong sổ nhật ký công trình.", "Hợp đồng này coi như được thanh lý sau khi các Bên đã hoàn tất tất cả các nghĩa vụ theo Hợp đồng.", "ĐIỀU 5: CHẤT LƯỢNG – TIÊU CHUẨN KỸ THUẬT.", "Bên B bảo đảm thi công đúng theo yêu cầu về chất lượng, kỹ thuật của sản phẩm được quy định trong các hồ sơ tiêu chuẩn kỹ thuật và các bản vẽ thi công của dự án do Bên A cung cấp.", "Bên B phải tuân thủ tất cả các thủ tục về quản lý chất lượng, an toàn, tiến độ, nghiệm thu, ... các quy định khác của Bên A, Tư vấn và Chủ đầu tư trong quá trình chuẩn bị thi công, thi công và vệ sinh sau cùng để nghiệm thu bàn giao.", "Bên B tự lo nhân lực, phương tiện thi công. Tự quản lý máy móc, vật tư, thiết bị trong quá trình thi công.", "Bên B có trách nhiệm chuẩn bị đầy đủ thiết bị, nhân lực và điều kiện cần thiết để đảm bảo cho việc thi công an toàn, đạt tiến độ và chất lượng.", "Bên B có trách nhiệm tự sửa chữa, tháo dỡ hoặc thi công lại các hạng mục không đạt yêu cầu và chịu mọi chi phí phát sinh do lỗi của mình.", "Bên B có trách nhiệm cung cấp vật tư đúng chủng loại, thương hiệu, mã sản phẩm, màu sắc và tiêu chuẩn kỹ thuật theo hồ sơ được Bên A phê duyệt. Không được tự ý thay đổi chủng loại, thương hiệu hoặc vật tư tương đương nếu chưa có văn bản chấp thuận của Bên A. Bên A có quyền từ chối nghiệm thu và yêu cầu Bên B thay thế toàn bộ vật tư không phù hợp.", "ĐIỀU 6: ĐẢM BẢO AN TOÀN LAO ĐỘNG", "Bên B chịu trách nhiệm thực hiện các nghĩa vụ của người sử dụng lao động đối với người lao động thuộc phạm vi quản lý của Bên B theo quy định của pháp luật", "Bên B có trách nhiệm tuân thủ đầy đủ quy định của pháp luật về an toàn, vệ sinh lao động, phòng cháy chữa cháy, bảo vệ môi trường, nội quy công trường và các quy định về an toàn do Bên A ban hành.", "Bên B chịu trách nhiệm quản lý người lao động thuộc phạm vi quản lý của mình; trang bị đầy đủ phương tiện bảo hộ, tổ chức huấn luyện và giám sát việc chấp hành các quy định về an toàn lao động.", "Trường hợp Bên B vi phạm quy định về an toàn lao động hoặc để xảy ra tai nạn, sự cố do lỗi của Bên B hoặc người lao động thuộc Bên B quản lý thì Bên B phải chịu trách nhiệm theo quy định của pháp luật và bồi thường mọi thiệt hại phát sinh do lỗi của mình.", "Bên A có quyền yêu cầu Bên B tạm ngừng thi công, khắc phục vi phạm hoặc đình chỉ thi công đối với các trường hợp không bảo đảm an toàn. Mọi chi phí phát sinh do lỗi của Bên B sẽ do Bên B chịu và được khấu trừ vào giá trị thanh toán theo Hợp đồng.", "ĐIỀU 7: TRÁCH NHIỆM CÁC BÊN", "Trách nhiệm Bên A:", "Bàn giao cho bên B mặt bằng cho bên B thi công và bản vẽ, tiêu chuẩn kỹ thuật có đóng dấu phát hành của bên A.", "Phổ biến nội quy công trường cho bên B.", "Cử cán bộ kỹ thuật giám sát công trình, cán bộ phụ trách an toàn lao động kiểm tra đôn đốc việc chấp hành công tác an toàn lao động trong suốt thời gian thi công.", "Hỗ trợ bên B về điều kiện thi công tại công trường như cung cấp điện, nước phục vụ thi công tùy theo tình hình và điều kiện công trường.", "Thanh toán cho bên B theo quy định tại theo hợp đồng.", "Có quyền không nghiệm thu, quyết toán những công việc do Bên B thực hiện không đảm bảo chất lượng.", "Trách nhiệm Bên B:", "Có đủ tư cách pháp lý, năng lực, nhân sự và điều kiện để thực hiện công việc theo Hợp đồng.", "Thi công đúng hồ sơ thiết kế, biện pháp thi công, tiêu chuẩn kỹ thuật, chất lượng, mỹ thuật và tiến độ đã được Bên A phê duyệt.", "Chịu sự quản lý, điều hành, giám sát của Bên A; bố trí đầy đủ nhân sự quản lý và nhân công đáp ứng yêu cầu thi công.", "Chịu trách nhiệm sửa chữa, tháo dỡ hoặc thi công lại các hạng mục không đạt yêu cầu; mọi chi phí và thiệt hại phát sinh do lỗi của Bên B.", "Trường hợp Bên B không đáp ứng tiến độ, nhân lực hoặc chất lượng thi công, Bên A có quyền bổ sung nhân lực hoặc thuê đơn vị khác thực hiện; mọi chi phí phát sinh do Bên B chịu và được khấu trừ vào giá trị thanh toán.", "Bảo quản vật tư, thiết bị do Bên A giao; bồi thường mọi mất mát, hư hỏng do lỗi của Bên B.", "Tuân thủ đầy đủ các quy định của pháp luật và nội quy công trường về an toàn lao động, phòng cháy chữa cháy, vệ sinh môi trường, an ninh trật tự và chịu mọi trách nhiệm đối với các vi phạm do mình gây ra.", "Phối hợp với Bên A và các đơn vị liên quan trong quá trình thi công; kịp thời thông báo các sai sót về hồ sơ thiết kế hoặc điều kiện thi công để xử lý.", "Thực hiện vệ sinh công trường sau khi thi công; trường hợp không thực hiện, Bên A có quyền tổ chức thực hiện và khấu trừ chi phí phát sinh vào giá trị thanh toán của Bên B.", "Trường hợp Bên B vi phạm nghĩa vụ theo Hợp đồng hoặc đơn phương chấm dứt Hợp đồng trái quy định thì phải chịu phạt vi phạm (nếu có) và bồi thường toàn bộ thiệt hại thực tế phát sinh cho Bên A theo quy định của Hợp đồng và pháp luật.", "Trong thời gian thi công hoặc trong thời gian bảo hành, khi phát sinh sự cố Trong vòng 24 giờ kể từ khi nhận được thông báo của Bên A, Bên B phải có mặt để kiểm tra. Trong vòng 02 ngày kể từ ngày nhận thông báo, Bên B phải triển khai khắc phục. Trường hợp Bên B không thực hiện hoặc thực hiện không đạt yêu cầu, Bên A có quyền thuê đơn vị khác sửa chữa và khấu trừ toàn bộ chi phí vào tiền bảo hành hoặc các khoản Bên A còn phải thanh toán cho Bên B.", "ĐIỀU 8: VI PHẠM HỢP ĐỒNG VÀ BỒI THƯỜNG THIỆT HẠI", "Bên nào vi phạm nghĩa vụ theo Hợp đồng dẫn đến thiệt hại cho bên còn lại thì phải chịu trách nhiệm khắc phục toàn bộ hậu quả, bồi thường mọi thiệt hại thực tế phát sinh và các chi phí hợp lý liên quan theo quy định của Hợp đồng và pháp luật.", "Trường hợp Bên B vi phạm về tiến độ thi công, chất lượng công việc, an toàn lao động, vệ sinh công trường, không bố trí đủ nhân lực theo yêu cầu hoặc tự ý ngừng thi công, Bên A có quyền:", "Yêu cầu Bên B khắc phục trong thời hạn do Bên A ấn định;", "Yêu cầu Bên B tăng cường nhân lực, máy móc, vật tư hoặc tổ chức thi công tăng ca để đảm bảo tiến độ mà không làm phát sinh chi phí đối với Bên A;", "Trường hợp Bên B không khắc phục hoặc khắc phục không đạt yêu cầu, Bên A được quyền trực tiếp hoặc thuê đơn vị khác thực hiện toàn bộ hoặc một phần công việc để bảo đảm tiến độ, chất lượng công trình mà không cần sự đồng ý của Bên B.", "Mọi chi phí phát sinh do việc Bên A thực hiện hoặc thuê đơn vị khác khắc phục, bao gồm nhưng không giới hạn ở chi phí nhân công, vật tư, máy móc, quản lý, chi phí sửa chữa, hoàn thiện, khắc phục lỗi, chậm tiến độ và các thiệt hại liên quan sẽ do Bên B chịu. Bên A có quyền khấu trừ các khoản chi phí này vào giá trị thanh toán, tiền bảo hành, tiền giữ lại hoặc các khoản tiền khác còn phải thanh toán cho Bên B; nếu không đủ thì Bên B có trách nhiệm thanh toán phần còn thiếu trong vòng 05 (năm) ngày làm việc kể từ khi nhận được thông báo của Bên A.", "Ngoài nghĩa vụ bồi thường thiệt hại nêu trên, Bên B còn phải chịu phạt vi phạm Hợp đồng bằng 08% giá trị phần nghĩa vụ hợp đồng bị vi phạm, trừ trường hợp pháp luật có quy định khác.", "ĐIỀU 9: TẠM NGỪNG VÀ CHẤM DỨT HỢP ĐỒNG", "Bên A có quyền tạm ngừng thi công hoặc đơn phương chấm dứt Hợp đồng khi Bên B thuộc một trong các trường hợp sau:", "Chậm tiến độ thi công và không khắc phục theo thời hạn Bên A yêu cầu;", "Thi công không đảm bảo chất lượng, không khắc phục hoặc tái diễn lỗi sau khi đã được yêu cầu sửa chữa;", "Vi phạm quy định về an toàn lao động, phòng cháy chữa cháy hoặc gây mất an toàn, ảnh hưởng đến công trình, con người hoặc tài sản;", "Không bố trí đủ nhân lực, vật tư, thiết bị theo yêu cầu làm ảnh hưởng đến tiến độ chung của công trình;", "Tự ý ngừng thi công, bỏ dở công việc hoặc từ chối thực hiện chỉ đạo hợp lý của Bên A;", "Vi phạm nghiêm trọng các nghĩa vụ khác theo Hợp đồng mà không khắc phục trong thời hạn 03 (ba) ngày kể từ khi nhận được thông báo bằng văn bản của Bên A.", "Khi Bên A chấm dứt Hợp đồng, Bên B có trách nhiệm trong vòng 24 giờ kể từ khi nhận được thông báo:", "Dừng thi công, bàn giao hiện trường, hồ sơ, vật tư, thiết bị (nếu có) và các tài sản thuộc Bên A;", "Phối hợp với Bên A xác nhận khối lượng công việc đã thực hiện. Trường hợp Bên B không phối hợp hoặc từ chối ký biên bản sau khi được Bên A mời hợp lệ 02 (hai) lần thì Bên A có quyền lập biên bản đơn phương, thuê đơn vị tư vấn hoặc các bên liên quan xác nhận hiện trạng làm căn cứ quyết toán và Bên B có trách nhiệm chấp hành.", "Sau khi chấm dứt Hợp đồng, Bên A có quyền thuê đơn vị khác tiếp tục thực hiện phần công việc còn lại. Mọi chi phí phát sinh, thiệt hại, khoản chênh lệch chi phí do việc thay thế nhà thầu và các tổn thất khác phát sinh từ lỗi của Bên B sẽ do Bên B chịu. Bên A được quyền khấu trừ các khoản này vào giá trị thanh toán, tiền giữ lại bảo hành hoặc các khoản tiền khác còn phải thanh toán cho Bên B; nếu không đủ, Bên B có trách nhiệm thanh toán phần còn thiếu trong vòng 05 (năm) ngày làm việc kể từ ngày nhận được yêu cầu của Bên A.", "ĐIỀU 10: GIẢI QUYẾT TRANH CHẤP", "Mọi tranh chấp phát sinh từ hoặc liên quan đến Hợp đồng này trước hết sẽ được các bên ưu tiên giải quyết thông qua thương lượng và hòa giải trên tinh thần hợp tác trong thời hạn 15 (mười lăm) ngày kể từ ngày một bên thông báo bằng văn bản về tranh chấp.", "Trường hợp hết thời hạn nêu trên mà các bên không đạt được thỏa thuận, tranh chấp sẽ được giải quyết tại Tòa án nhân dân có thẩm quyền nơi Bên A đặt trụ sở.", "Trong thời gian giải quyết tranh chấp, Bên B vẫn phải tiếp tục thực hiện các nghĩa vụ không bị tranh chấp theo Hợp đồng và không được tự ý dừng hoặc chậm trễ việc thi công nếu chưa có văn bản chấp thuận của Bên A.", "Mọi chi phí phát sinh liên quan đến việc giải quyết tranh chấp (bao gồm nhưng không giới hạn ở án phí, lệ phí, chi phí luật sư, chi phí giám định, định giá và các chi phí hợp lý khác) sẽ do bên thua kiện chịu, trừ trường hợp Tòa án có quyết định khác.", "Mọi sửa đổi, bổ sung Hợp đồng phải được lập thành văn bản và có xác nhận của hai bên.", "Hợp đồng này được lập thành 02 bản có giá trị pháp lý ngang nhau, Bên A giữ 01 bản, Bên B giữ 01 bản có giá trị kể từ ngày ký.", "ĐẠI DIỆN BÊN A | ĐẠI DIỆN BÊN B"]}, {"id": "tpl-thi-cong", "name": "Hợp đồng thi công xây dựng", "unit": "thewall", "note": "Mẫu The Wall — thi công phần thô và hoàn thiện", "lines": ["CỘNG HOÀ XÃ HỘI CHỦ NGHĨA VIỆT NAM", "Độc lập - Tự do - Hạnh phúc", "HỢP ĐỒNG THI CÔNG XÂY DỰNG", "Số: ........./........./HĐTC/..................", "GÓI THẦU: THI CÔNG PHẦN THÔ & HOÀN THIỆN", "CÔNG TRÌNH: TÒA NHÀ VĂN PHÒNG", "ĐỊA ĐIỂM: SỐ 17 ĐƯỜNG NGUYỄN VĂN LINH, PHƯỜNG TÂN THUẬN,TP.HCM", "Giữa", "ÔNG: ..................................................", "Và", "CÔNG TY TNHH  KT XD THE WALL", "Thành Phố Hồ Chí Minh, năm 2026", "Căn cứ Bộ luật dân sự số 91/2015/QH13 ngày 24/11/2015.", "Căn cứ Luật Xây dựng Luật xây dựng số 35/2025/QH15 ban hành ngày 10/12/2025.", "Căn cứ vào nhu cầu của Bên A và khả năng của Bên B.", "Hôm nay, ngày ...... tháng ....... năm 20..., Chúng tôi gồm các bên dưới đây:", "BÊN A:  CHỦ ĐẦU TƯ", "Đại diện\t:", "Địa chỉ\t:", "Số CCCD\t:                                  cấp ngày", "Và", "BÊN B: CÔNG TY TNHH TV TK KT XD BỨC TƯỜNG", "(sau đây được gọi là “Nhà thầu”)", "Đại diện\t: Ông NGUYỄN NGỌC HOÀNG THÁI BẢO", "Chức vụ\t: Giám đốc", "Địa chỉ\t: 15 đường 14, Khu Dân Cư Nam Long, Phường Tân Thuận,Tp. HCM", "Tài khoản\t: 0067 0407 000 9340 tại ngân hàng HDBank-CN Cộng Hoà", "Mã số thuế\t: 0309309523", "(Bên A và Bên B được gọi riêng là “Bên” và gọi chung là “các Bên”).", "Sau khi nghiên cứu thực tế mặt bằng hiện trường, hồ sơ thiết kế, mục đích, nhu cầu sử dụng công trình của Chủ đầu tư, các Bên cùng nhau bàn bạc, thỏa thuận thống nhất ký kết Hợp Đồng thi công xây dựng cho gói thầu “ Thi công phần thô và hoàn thiện” (Sau đây gọi tắt là “Hợp Đồng”) gồm các điều khoản và điều kiện sau đây:", "Điều 1. Nội dung và phạm vi khối lượng công việc", "Bên A đồng ý giao và Bên B đồng ý nhận “Thi công phần thô và hoàn thiện ” cho Công trình Tòa nhà văn phòng tại số 17 Nguyễn Văn Linh, phường Tân Thuận, TP.HCM theo Hồ sơ thiết kế Bên A phê duyệt bao gồm các công việc như sau (sau đây được gọi là “Phạm Vi Công Việc”).", "Thực hiện hồ sơ thiết kế kiến trúc", "Thi công đào đất, ép cọc, ép cừ,…", "Thi công GCLD copha, cốt thép, bê tông.", "Thi công xây, trát tường ngăn trong nhà toàn bộ công trình.", "Thi công chống thấm, cán nền, trát dầm cột,...", "Thi công điện nước phần thô", "Thi công sơn nước .", "Thi công lan can ban công mặt tiền.", "Thi công cửa nhôm kính mặt tiền.", "Nhân công ốp lát", "Lắp đặt thiết bị", "Vận chuyển đất, xà bần, vệ sinh bàn giao.", "Che chắn đảm bảo an toàn, vệ sinh môi trường trong suốt quá trình thi công theo đúng quy định pháp luật, Khu dân cư.", "Phối hợp các nhà thầu liên quan để hoàn thành Phạm vi công việc.", "Thực hiện các công việc liên quan khác để hoàn thành gói thầu theo hồ sơ thiết kế, đảm bảo đúng tiến độ bao gồm công tác chuẩn bị.", "Thay mặt Bên A phối hợp với Ban quản lý khu dân cư, các quan chức năng có liên quan để công tác thi công được liên tục, đảm bảo công việc đúng tiến độ.", "Nội dung công việc, khối lượng, đơn giá và danh mục vật liệu theo nội dung Phụ lục số 01 kèm theo Hợp Đồng này.", "Bên B đồng ý rằng, trong quá trình thực hiện Phạm Vi Công Việc, Bên B phải tuân thủ theo các tiêu chuẩn, hướng dẫn thiết kế của Bên A đã được các bên thống nhất trong bản vẽ được duyệt và các tiêu chuẩn, quy chuẩn, quy định pháp luật hiện hành của Việt Nam.", "Trong trường hợp Bên A yêu cầu Bên B thực hiện các công việc khác nằm ngoài Phạm Vi Công Việc của Hợp Đồng quy định tại Điều này, các Bên sẽ thỏa thuận và ký kết các phụ lục hợp đồng tương ứng. Thời gian thực hiện phụ lục hợp đồng sẽ được cộng thêm vào tiến độ thi công.", "Điều 2. Thời gian và tiến độ thực hiện Hợp đồng", "2.1.\tThời gian, tiến độ thực hiện Hợp đồng", "Thời gian thực hiện Hợp Đồng: trong vòng 12 tháng (chưa bao gồm các ngày chủ nhật, ngày lễ, ngày nghỉ theo quy định của Luật Lao động, và không bao gồm thời gian nghỉ tết, ...) kể từ ngày ký hợp đồng và Bên A bàn giao mặt bằng cho Bên B, có giấy phép thi công của cơ quan chủ quản (nếu có) và kể từ ngày bên B nhận được tiền tạm ứng đợt 1. Thời gian thực hiện chưa bao gồm thời gian dừng chờ do cơ quan quản lý yêu cầu do sai thiết kế (nếu có);  Thời gian thực hiện Hợp đồng được gia hạn tương ứng trong trường hợp: Bên A chậm bàn giao mặt bằng, chậm cung cấp hồ sơ thiết kế, thay đổi thiết kế, phát sinh khối lượng, chậm nghiệm thu, chậm thanh toán, hoặc xảy ra sự kiện bất khả kháng.", "Bên B phải lập bảng tiến độ tổng thể để trình cho Bên A phê duyệt trong vòng..... ngày sau ngày khởi công.", "Bên B cũng phải trình tiến độ thi công đã được sửa đổi nếu tiến độ thi công trước đó không phù hợp với tiến độ thực tế hoặc không phù hợp với nghĩa vụ của Bên B.", "Bên B được phép điều chỉnh tiến độ chi tiết theo tuần, tháng nhưng phải phù hợp với tiến độ tổng thể của Hợp đồng.", "2.2.\tGia hạn thời gian hoàn thành", "Bên  B chỉ được phép gia hạn thời gian hoàn thành nếu do một trong những lý do:", "Có sự thay đổi phạm vi công việc, thiết kế, biện pháp thi công theo yêu cầu của Bên A làm ảnh hưởng đến tiến độ thực hiện Hợp đồng.", "Do ảnh hưởng của các trường hợp bất khả kháng như: ảnh hưởng của động đất, bão, lũ, lụt, sóng thần, hoả hoạn, dịch bệnh hoặc các sự kiện bất khả kháng khác;", "Bên A tạm ứng/ thanh toán chậm.", "Sự chậm trễ, trở ngại trên công trường do Bên A, nhân lực của Bên A hay các Bên khác của Bên A gây ra như: việc bàn giao mặt bằng không đúng với các thoả thuận trong Hợp đồng, các thủ tục liên quan ảnh hưởng đến tiến độ thực hiện Hợp đồng mà không do lỗi của Bên B gây ra.", "Những ngày nghỉ lễ bắt buộc theo quy định của nhà nước CHXDCN Việt Nam.", "Công trình bị tạm dừng do các quyết định tạm dừng từ cơ quan quản lý các cấp mà không do lỗi hoặc thuộc trách nhiệm của Bên B.", "Các trường hợp khác do hai Bên đàm phán thống nhất.", "Điều 3.\tGiá trị Hợp Đồng, hình thức hợp đồng, tạm ứng và thanh toán.", "3.1.\tGiá trị Hợp đồng:", "(Bằng chữ: Mười hai tỷ bảy trăm triệu chín trăm sáu mươi bốn ngàn chín trăm năm mươi bảy đồng).", "Chi tiết đơn giá Hợp Đồng được kèm theo Phụ lục số 01 đính kèm Hợp Đồng này.", "3.2      Loại Hợp Đồng: nghiệm thu theo khối lượng thực tế thi công", "3.3      Hợp đồng đã bao gồm:", "Thuế giá trị gia tăng 08%.", "Chi phí để thực hiện toàn bộ Phạm Vi Công Việc theo Hợp Đồng;", "Chi phí bảo hành công trình 12 tháng kể từ ngày Công trình thi công hoàn thành và nghiệm thu bàn giao cho Bên B.", "Các chi phí nhân sự, phương tiện, và tiện ích công trường của Bên B phục vụ cho việc thi công bao gồm nhưng không giới hạn các chi phí sau:", "Chi phí dọn dẹp, thu gom, vận chuyển rác thải do bên B và các nhà thầu của bên B thi công đến vị trí quy định trong công trường và vận chuyển ra khỏi công trình;", "Chi phí bảo vệ vật tư và thiết bị của Bên B tại công trường;", "Chi phí cho các tiện ích khác phục vụ cán bộ, công nhân của Bên B trên công trường như điện, nước, vệ sinh, ...;", "Và các chi phí khác liên quan để Bên B thực hiện và hoàn thành Phạm Vi Công Việc của Hợp đồng.", "3.4      Hợp đồng chưa bao gồm:", "Toàn bộ các chi phí khác không thuộc Phụ lục số 01 đính kèm của Hợp đồng này.", "Các hạng mục phát sinh thay đổi kiến trúc được sự trao đổi và chấp thuận của hai Bên bằng văn bản, hoặc tài liệu điện tử tương đương văn bản như email, zalo..", "Chi phí hoàn công.", "Chi phí quản lý hàng tháng mà Bên A phải đóng cho cơ quan sở tại (nếu có).", "Chi phí cho các tiện ích khác phục vụ cán bộ, công nhân của các đơn vị nhà thầu của Bên A trên công trường như điện, nước, bảo vệ, vệ sinh công trình, rác thi công.", "3.5    Điều chỉnh giá trị Hợp Đồng", "Giá trị của Hợp Đồng không được điều chỉnh, thay đổi và không phụ thuộc vào bất kỳ sự thay đổi nào (tăng hoặc giảm) về chi phí vật liệu, tỷ giá ngoại tệ, nhân công, máy móc, bảo hiểm, phí vận chuyển, thuế hải quan và các khoản thuế khác cũng như các khoản tương tự trong toàn bộ thời hạn Hợp Đồng, ngoại trừ các trường hợp được quy định tại Điểm b) Khoản này.", "Các trường hợp điều chỉnh giá trị Hợp Đồng:", "Trừ khi có yêu cầu khác của Bên A, việc phát sinh tăng hoặc giảm giá trị Hợp Đồng chỉ được thực hiện khi xảy ra một trong các trường hợp sau:", "Bên A thay đổi thiết kế và/hoặc điều chỉnh nội dung, Phạm Vi Công Việc;", "Bên A muốn tăng khối lượng/hạng mục ngoài Phạm Vi Công Việc hoặc cắt giảm khối lượng hoặc hạng mục công việc và có thông báo đến Bên B trước khi Bên B bắt đầu triển khai thực hiện công việc đó; Việc cắt giảm khối lượng công việc trong trường hợp này không được quá 30% giá trị hợp đồng mà hai bên đã ký kết.", "Các công việc mà trên thực tế Bên B hoàn toàn không thực hiện hoặc thực hiện không đầy đủ Phạm Vi Công Việc mà các Bên đã thỏa thuận tại Phụ lục số 01 mà không phải do bất cứ nguyên nhân nào từ bên A (như điều chỉnh thiết kế hoặc theo ý Bên A) và Bên A có quyền khấu trừ giá trị phần công việc chưa được thực hiện hoặc thực hiện không đầy đủ vào tổng giá trị của Hợp Đồng quy định tại Khoản 3.6.2 Điều này;", "Cách thức xác định đơn giá và khối lượng điều chỉnh:", "Khi có công việc phát sinh ngoài phạm vi Hợp Đồng đã ký kết thì các Bên phải xác định rõ về khối lượng công việc bổ sung và đơn giá áp dụng.", "Công việc phát sinh đã có đơn giá trong Hợp Đồng tùy theo từng trường hợp và tính chất công việc phát sinh mà áp dụng đơn giá trong Hợp Đồng đã ký. Đối với các công việc phát sinh chưa có đơn giá trong Hợp Đồng thì đơn giá mới được xác định trên cơ sở thoả thuận của các Bên và phù hợp với quy định của pháp luật;", "3.6 Thanh toán", "3.6.1  Bên A sẽ thanh giá trị hợp đồng bằng chuyển khoản cho Bên B với thông tin tài khoản bên dưới:", "………………………………………..", "Nội dung:", "3.6.2  Bên A thanh toán cho Bên B với các đợt thanh toán như sau:", "Tạm ứng đợt 1: Bên A tạm ứng cho Bên B 30% giá trị Hợp đồng tương đương số tiền ....................... vnđ (..................) sau khi Hợp đồng được ký kết.", "Tạm ứng  đợt 2: Bên A tạm ứng cho Bên B 10% giá trị Hợp đồng tương đương số tiền ..................... vnđ (........................) sau khi bên B hoàn thành thi công bê tông cốt thép sàn tầng trệt khối nhà chính.", "Tạm ứng  đợt 3: Bên A tạm ứng cho Bên B 10% giá trị Hợp đồng tương đương số tiền ..................... vnđ (........................) sau khi bên B hoàn thành thi công bê tông cốt thép sàn tầng 5 khối nhà chính.", "Tạm ứng  đợt 4: Bên A tạm ứng cho Bên B 10% giá trị Hợp đồng tương đương số tiền ..................... vnđ (........................) sau khi bên B hoàn thành thi công bê tông cốt thép sàn mái khối nhà chính.", "Tạm ứng đợt 5: Bên A tạm ứng cho Bên B 10% giá trị Hợp đồng tương đương số tiền ..................... vnđ (........................) sau khi bên B thi công phần trước hoàn công bao gồm: hoàn thành xây tường (trừ hộp gen) và 50% điện nước phần thô.", "Tạm ứng đợt 6: Bên A tạm ứng cho Bên B 10% giá trị Hợp đồng tương đương số tiền ..................... vnđ (.......................) sau khi bên B hoàn thành phần thô và điện nước trước hoàn công.", "Tạm ứng đợt 7: Bên A tạm ứng cho Bên B 10% giá trị Hợp đồng tương đương số tiền ..................... vnđ (.......................) sau khi bên B hoàn thành hạng mục trước hoàn công bao gồm: lắp đặt hoàn thành thang máy (chưa kiểm định), 50% hạng mục vách kính & lan can kính, 50% hạng mục sơn nước.", "Tạm ứng đợt 7: Bên A tạm ứng cho Bên B 05% giá trị Hợp đồng tương đương số tiền ..................... vnđ (.......................) sau khi bên B hoàn thành 90% hạng mục ốp lát khối nhà chính.", "Quyết toán Hợp đồng: Bên A thanh toán cho Bên B giá trị hợp đồng còn lại sau khi Bên A nhận đầy đủ hồ sơ thanh quyết toán.", "Đối với các đợt tạm ứng, quyết toán nêu trên:", "Nếu hồ sơ đã hợp lệ bên A phải thanh toán cho bên B trong vòng 5 ngày kể từ ngày nhận được hồ sơ hợp lệ, nếu cho rằng hồ sơ chưa hợp lệ bên A phải thông báo cho bên B sửa đổi bổ sung hồ sơ trong vòng 2 ngày kể từ ngày nhận hồ sơ, nếu quá 2 ngày mà bên A không báo gì thì xem như hồ sơ hợp lệ. Quá thời hạn nêu trên được xem là thanh toán quá hạn, bên B được quyền áp dụng các chế tài về thanh toán trễ hạn, quá hạn đối với bên A.", "Thời gian bảo hành công trình là 12 tháng. Trong thời gian bảo hành tính từ ngày nghiệm thu bàn giao công trình đưa vào sử dụng, nếu có bất cứ sự cố gì xảy ra do lỗi thi công của Bên B thì Bên B phải cho tiến hành sửa chữa, chi phí sửa chữa do Bên B thanh toán 100%.", "3.6.3 Đồng tiền và hình thức thanh toán", "Đồng tiền thanh toán: Giá Hợp đồng sẽ được thanh toán bằng đồng tiền Việt Nam (VNĐ).", "Hình thức thanh toán: Thanh toán bằng hình thức chuyển khoản.", "3.6.4 Hồ sơ tạm ứng/ thanh toán:", "Hồ sơ tạm ứng/ thanh toán theo từng đợt gồm:", "Giấy đề nghị tạm ứng/ thanh toán.", "Hợp đồng photo.", "Biên bản nghiệm thu hoàn thành từng giai đoạn phù hợp với từng đợt thanh toán của Hợp đồng có xác nhận của Bên A (hoặc) đại diện của Bên A & đại diện Bên B.", "Riêng đối với đợt 1, không cần biên bản nghiệm thu hoàn thành công việc.", "Hồ sơ quyết toán bao gồm:", "Giấy đề nghị thanh toán.", "Bảng nghiệm thu khối lượng hoàn thành.", "Bảng xác định giá trị khối lượng công việc hoàn thành theo Hợp đồng đề nghị thanh toán có xác nhận của đại diện Bên A và đại diện của Bên B.", "Khi có khối lượng phát sinh ngoài Hợp đồng, Bên B gửi Bảng tính giá trị khối lượng phát sinh (nếu có) ngoài phạm vi Hợp đồng đã ký có xác nhận của đại diện Bên A và đại diện của Bên B. Hoặc bổ sung phụ lục Hợp đồng đính kèm đề nghị thanh toán có xác nhận đại diện hai bên.", "Hóa đơn thuế GTGT (nếu có)", "Điều 4.\tYêu cầu về chất lượng sản phẩm và nghiệm thu, bàn giao sản phẩm Hợp đồng thi công xây dựng", "4.1.\tYêu cầu về chất lượng sản phẩm của Hợp đồng thi công xây dựng :", "Công trình phải được thi công theo đúng hồ sơ thiết kế bản vẽ thi công đã được Bên A phê duyệt, các chỉ dẫn kỹ thuật được mô tả trong hồ sơ thiết kế;", "Bên B đảm bảo vật tư, thiết bị do Bên B cung cấp cho công trình phải đáp ứng theo đúng chủng loại báo giá đã được Bên A phê duyệt, các chỉ dẫn kỹ thuật được mô tả trong hồ sơ thiết kế; vật tư, thiết bị đảm bảo phải mới 100%; có nguồn gốc xuất xứ  rõ ràng.", "Bên A có quyền kiểm tra xuất xứ, nhãn mác hàng hóa, công bố sự phù hợp về chất lượng của nhà sản xuất, chứng nhận sự phù hợp chất lượng theo quy định của Luật chất lượng sản phẩm hàng hóa.", "4.2.\tKiểm tra, giám sát của Bên A :", "Bên B phải tạo mọi điều kiện cho người của Bên A hoặc Tư vấn giám sát của Bên A để tiến hành các hoạt động này, bao gồm cả việc cho phép ra vào, cung cấp các phương tiện, các giấy phép và thiết bị an toàn. Những hoạt động này không làm giảm đi bất cứ nghĩa vụ hoặc trách nhiệm nào của Bên B.", "4.3.\tNghiệm thu sản phẩm các công việc hoàn thành", "Bên A chỉ nghiệm thu các sản phẩm của Hợp đồng khi các sản phẩm đáp ứng yêu cầu về chất lượng theo quy định tại khoản 4.1 và các quy định hiện hành khác. Nếu không nghiệm thu bên A phải có văn bản nêu rõ lý do và lỗi cần khắc phục, hai bên thống nhất thời gian khắc phục hợp lý để nghiệm thu lại.", "Đối với những công việc theo yêu cầu phải được nghiệm thu trước khi chuyển qua các công việc khác, Bên B phải mời Bên A tiến hành nghiệm thu trước khi tiến hành các công việc tiếp theo.", "4.4.\tNghiệm thu, bàn giao công trình và các hạng mục công trình", "Sau khi các công việc theo Hợp đồng được hoàn thành, thì Bên B sẽ thông báo cho Bên A để tiến hành nghiệm thu công trình.", "Bên B thông báo cho Bên A để nghiệm thu công trình ít nhất là 01 ngày trước khi hạng mục hoàn thành, công trình được hoàn thành và sẵn sàng để bàn giao. Nếu công trình được chia thành các hạng mục, Bên B có thể đề nghị nghiệm thu theo hạng mục. Trong vòng 01 ngày làm việc kể từ ngày nhận được đề nghị nghiệm thu, nếu Bên A không tổ chức nghiệm thu hoặc không có ý kiến bằng văn bản thì công việc được xem như đã được nghiệm thu.", "Sau khi công trình đủ điều kiện để nghiệm thu, hai bên lập biên bản nghiệm thu, bàn giao công trình hoàn thành theo Hợp đồng. Nếu có những công việc nhỏ còn tồn đọng lại và các sai sót về cơ bản không làm ảnh hưởng đến việc sử dụng công trình thì những tồn đọng này được ghi trong biên bản nghiệm thu, bàn giao công trình và Bên B phải có trách nhiệm hoàn thành những tồn đọng này bằng chi phí của mình.", "Trường hợp công trình chưa đủ điều kiện để nghiệm thu, bàn giao; các bên xác định lý do và nêu cụ thể những công việc mà Bên B phải làm để hoàn thành công trình.", "4.5.\tTrách nhiệm của Bên B đối với các sai sót", "Bên B phải hoàn thành các công việc còn tồn đọng vào ngày đã nêu trong biên bản nghiệm thu, bàn giao trong khoảng thời gian hợp lý mà Bên A yêu cầu và chi phí thực hiện là chi phí của Bên B.", "Nếu Bên B không sửa chữa được các sai sót hay hư hỏng Bên A có thể tự tiến hành công việc hoặc thuê người khác sửa chữa và Bên B phải chịu chi phí, tuy nhiên Bên A chỉ được thuê đơn vị khác thực hiện sau khi có văn bản yêu cầu, Bên B không khắc phục trong thời hạn hợp lý và hai bên đã xác nhận lỗi của Bên B. Chi phí khắc phục phải có chứng từ hợp lệ và mức chi phí hợp lý", "Nếu sai sót hoặc hư hỏng không thể sửa chữa tốt ngay trên công trường được và được Bên A đồng ý, Bên B có thể chuyển khỏi công trường thiết bị hoặc cấu kiện bị sai sót hay hư hỏng để sửa chữa.", "4.6.\tNhững nghĩa vụ chưa được hoàn thành", "Sau khi đã cấp biên bản nghiệm thu, bàn giao; mỗi bên sẽ phải chịu trách nhiệm hoàn thành các nghĩa vụ vẫn chưa được thực hiện tại thời điểm đó. Hợp đồng vẫn được coi là có hiệu lực đối với nội dung và phạm vi của những nghĩa vụ chưa được hoàn thành.", "Điều 5.\tQuyền và nghĩa vụ của Bên A", "5.1.\tQuyền của Bên A", "Tạm ngừng thi công xây dựng công trình và yêu cầu khắc phục hậu quả khi Bên B vi phạm nghiêm trọng các quy định về chất lượng công trình, an toàn lao động, bảo vệ môi trường và phòng chống cháy nổ đã được nhắc nhở bằng văn bản mà không khắc phục. Việc tạm ngừng phải được khôi phục khi bên B đã tiến hành khắc phục vi phạm đó.", "Kiểm tra chất lượng thực hiện công việc, công trường thi công nhưng không được làm cản trở hoạt động bình thường của Bên .", "Tổ chức giám sát thi công xây dựng công trình;", "Kiểm tra biện pháp bảo đảm an toàn lao động, bảo vệ môi trường, phòng chống cháy nổ của Bên B.", "Xem xét và chấp thuận kịp thời bằng văn bản các đề xuất liên quan đến thiết kế, thi công của Bên B trong quá trình thi công xây dựng công trình.", "Chỉ định mặt bằng để Bên B làm kho chứa vật tư, dụng cụ thiết bị thi công, Bên B tự bảo quản vật tư thiết bị của mình trong suốt thời gian thực hiện hợp đồng.", "5.2.\tNghĩa vụ của Bên A", "Bàn giao toàn bộ hoặc từng phần mặt bằng xây dựng cho Bên B quản lý, sử dụng phù hợp với tiến độ đã lập và các thoả thuận của Hợp đồng.", "Có trách nhiệm ký xác nhận các văn bản phát sinh, báo giá hạng mục phát sinh, biên bản nghiệm thu khối lượng, hạng mục thi công trong vòng 03 ngày kể từ khi nhận được thông báo yêu cầu nghiệm thu từ Bên B.", "Thanh toán cho Bên B theo tiến độ thanh toán trong Hợp đồng.", "Cung cấp kịp thời hồ sơ thiết kế và các tài liệu có liên quan, và quy định của pháp luật có liên quan.", "Nghiệm thu, thanh toán, quyết toán hợp đồng đúng thời hạn theo quy định.", "Quy định rõ nhiệm vụ, quyền hạn của các Bên tư vấn giám sát.", "Bên A phải có sẵn để cung cấp cho Bên B toàn bộ các số liệu liên quan mà Bên A có về điều kiện địa chất, địa chất thủy văn và những nội dung của công tác khảo sát về công trường, bao gồm cả các yếu tố môi trường liên quan đến Hợp đồng.", "Cung cấp nguồn điện, nguồn nước tại công trình phục vụ cho công tác thi công của Bên B. Đóng phí điện nước sinh hoạt hàng ngày (nếu CĐT sử dụng).", "Thông báo cho các đơn vị thầu phụ ký hợp đồng thi công trực tiếp với Bên A về chi phí quản lý tại công trình cho Bên B;", "Thanh toán phí quản lý hàng tháng của Bên A (nếu có).", "Các nghĩa vụ khác theo quy định của pháp luật.", "Điều 6.\tQuyền và nghĩa vụ chung của Bên B", "6.1.\tQuyền của Bên B", "Được quyền từ chối thực hiện công việc ngoài phạm vi Hợp đồng khi chưa được hai bên thống nhất và những yêu cầu trái pháp luật của Bên A;.", "Được quyền tạm ngưng thi công các hạng mục tiếp theo nếu Bên A chưa ký biên bản nghiệm thu hạng mục Bên B đã thi công. Thời gian tạm ngưng được cộng thêm vào tiến độ chung.", "Được quyền tạm ngưng thi công (thời gian tạm ngưng được cộng thêm vào tiến độ chung) nếu bên A chậm thanh toán so với thời hạn quy định tại điều 3.6.2", "Được thay đổi các biện pháp thi công sau khi được Bên A chấp thuận nhằm đẩy nhanh tiến độ, bảo đảm chất lượng, an toàn, hiệu quả công trình trên cơ sở giá Hợp đồng đã ký kết.", "Được quyền yêu cầu Bên A bàn giao mặt bằng để thi công xây dựng công trình.", "Được quyền thu phí quản lý 10% đối với các thầu phụ khác mà làm việc và ký hợp đồng thi công trực tiếp với Bên A (nếu có).", "Được quyền đòi bồi thường thiệt hại khi Bên A chậm bàn giao mặt bằng và các thiệt hại khác do lỗi của các thầu phụ khác mà Bên A làm việc trực tiếp gây ra.", "Các quyền khác theo quy định của pháp luật có liên quan.", "6.2.\tNghĩa vụ của Bên B", "Bên B phải cung cấp nhân lực, vật liệu, máy móc, thiết bị thi công và các điều kiện vật chất liên quan khác đủ số lượng và chủng loại theo phụ lục Hợp đồng để thực hiện các công việc theo nội dung Hợp đồng đã ký kết.", "Bên B phải thi công xây dựng công trình đúng thiết kế bản vẽ thi công đã được Bên A phê duyệt.", "Quản lý người lao động trên công trường, bảo đảm an toàn, an ninh trật tự, không gây ảnh hưởng đến các khu dân cư xung quanh.", "Chịu trách nhiệm về chất lượng thi công xây dựng công trình do mình đảm nhận. Sửa chữa sai sót trong công trình đối với những công việc do mình thi công.", "Có trách nhiệm đền bù thiệt hại và khắc phục sự cố bằng kinh phí của Bên B nếu trong quá trình thi công xây dựng công trình làm ảnh hưởng hoặc hư hại đến các công trình công cộng, nhà dân khu vực xung quanh.", "Phối hợp với các Bên B khác cùng thực hiện trên công trường.", "Gửi bảng yêu cầu cung cấp vật tư cho Bên A ít nhất trước thời điểm cần vật tư thi công 7 ngày nếu vật tư đó cho Bên A cung cấp.", "Di chuyển vật tư, máy móc, thiết bị và những tài sản khác của mình ra khỏi công trường sau khi công trình đã được nghiệm thu, bàn giao.", "Hoàn trả mặt bằng theo đúng thỏa thuận trong hợp đồng.", "Giữ bí mật thông tin liên quan đến hợp đồng hoặc pháp luật có quy định.", "Bên B không được thực hiện bán thầu công trình cho bất cứ Bên B nào khác.", "Có trách nhiệm phối hợp với các Bên B khác của Bên A để lập tiến độ tổng thể của dự án.", "Bên B có trách nhiệm phối hợp với các Bên B khác của Bên A để thực hiện tốt công trình.", "Bên B chấp thuận với Bên A về việc phối hợp với các bên để thực hiện hồ sơ hoàn công công trình cho đến khi cơ quan nhà nước cấp được giấy hồ sơ hoàn công công trình, và công trình đưa vào hoạt động.", "Các nghĩa vụ khác theo quy định của pháp luật.", "6.3.\tNhân lực của Bên B", "Bên B có trách nhiệm bố trí nhân sự có trình độ chuyên môn, kỹ năng và kinh nghiệm phù hợp với yêu cầu của Hợp đồng và công việc. Trong trường hợp Bên A có căn cứ hợp lý cho rằng nhân sự của Bên B không đáp ứng yêu cầu về chuyên môn, vi phạm quy định về an toàn lao động, phòng cháy chữa cháy, bảo vệ môi trường hoặc có hành vi ảnh hưởng nghiêm trọng đến tiến độ, chất lượng công trình, Bên A có quyền có văn bản hoặc thông báo bằng hình thức phù hợp đề nghị Bên B xem xét thay thế nhân sự đó, đồng thời nêu rõ lý do và các tài liệu (nếu có) làm căn cứ.", "Việc thay thế nhân sự thuộc quyền quản lý của Bên B. Bên B có trách nhiệm thông báo cho Bên A về nhân sự thay thế để phối hợp trong quá trình thực hiện Hợp đồng. Hai Bên sẽ phối hợp, trao đổi trên tinh thần thiện chí nhằm bảo đảm nhân sự được bố trí đáp ứng yêu cầu của công việc và không làm ảnh hưởng đến tiến độ, chất lượng công trình. Bên B có trách nhiệm tổ chức quản lý nhân sự của mình và thực hiện các biện pháp cần thiết để bảo đảm an ninh, trật tự, an toàn lao động và bảo vệ tài sản trên công trường theo quy định của pháp luật và Hợp đồng.", "6.4.\tThiết bị Bên B", "Bên B phải chịu trách nhiệm đối với toàn bộ thiết bị của mình.", "6.5.\tHợp tác", "Bên B phải có trách nhiệm thực hiện việc hợp tác phối hợp trong công việc đối với: nhân lực của Bên A, Tư vấn giám sát của Bên A và các Bên B khác do Bên A thuê", "6.6.\tĐịnh vị các mốc", "Bên B phải định vị công trình theo các mốc và cao trình theo bản vẽ thiết kế được Bên A phê duyệt. Bên B sẽ chịu trách nhiệm về việc định vị đúng tất cả các hạng mục của công trình và phải điều chỉnh sai sót về vị trí, cao độ, kích thước hoặc căn tuyến của công trình.", "6.7.\tHoạt động của Bên B trên công trường", "Bên B phải giới hạn các hoạt động của mình trong phạm vi công trường và khu vực bổ sung mà Bên B có và được Bên A đồng ý là nơi làm việc. Bên B phải có sự chú ý cần thiết để giữ cho thiết bị của Bên B và nhân lực của Bên B chỉ hoạt động trong phạm vi công trường và các khu vực bổ sung và giữ cho không lấn sang khu vực lân cận. Trong thời gian thi công công trình, Bên B phải giữ cho công trường không có các cản trở không cần thiết, và phải cất giữ hoặc sắp xếp thiết bị hoặc vật liệu thừa của mình. Bên B phải dọn sạch rác và dỡ bỏ công trình tạm ra khỏi công trường khi không cần nữa.", "Sau khi biên bản nghiệm thu bàn giao đưa vào sử dụng công trình đã được cấp, Bên B phải dọn sạch và đưa đi tất cả thiết bị của Bên B, nguyên vật liệu thừa, phế thải xây dựng, rác rưởi và công trình tạm. Bên B phải để lại những khu vực đó của công trường và công trình trong trạng thái sạch sẽ và an toàn. Tuy nhiên, Nhà Bên B có thể để lại công trường, trong giai đoạn thông báo sai sót, những vật tư thiết bị cần để Bên B hoàn thành nghĩa vụ theo Hợp đồng.", "Điều 7.\tAn toàn lao động, bảo vệ môi trường và phòng chống cháy nổ và quan hệ với địa phương.", "7.1.\tAn toàn lao động", "Bên B có trách nhiệm tổ chức thực hiện các biện pháp bảo đảm an toàn lao động, vệ sinh môi trường theo quy định của pháp luật và chịu trách nhiệm đối với các thiệt hại, tai nạn lao động phát sinh do lỗi của mình trong quá trình thực hiện Hợp đồng.", "Bên A có trách nhiệm bảo đảm điều kiện mặt bằng, hạ tầng, các thông tin liên quan đến công trình thuộc phạm vi quản lý của mình và phối hợp với Bên B trong việc thực hiện các biện pháp bảo đảm an toàn lao động. Trường hợp tai nạn hoặc thiệt hại phát sinh do lỗi của Bên A, lỗi của đơn vị khác do Bên A quản lý hoặc do nguyên nhân khách quan, bất khả kháng thì Bên B không phải chịu trách nhiệm đối với phần thiệt hại tương ứng.", "Trong trường hợp xảy ra sự cố, hai Bên có trách nhiệm phối hợp xác định nguyên nhân, mức độ thiệt hại và trách nhiệm của từng Bên trên cơ sở hồ sơ, tài liệu, biên bản hiện trường và quy định của pháp luật.", "Biện pháp an toàn, nội quy về an toàn lao động phải được thể hiện công khai trên công trường xây dựng để mọi người biết và chấp hành; những vị trí nguy hiểm trên công trường phải bố trí người hướng dẫn, cảnh báo đề phòng tai nạn.", "Các bên có liên quan phải thường xuyên kiểm tra giám sát công tác an toàn lao động trên công trường. Tổ chức, cá nhân để xảy ra vi phạm về an toàn lao động thuộc phạm vi quản lý của mình phải chịu trách nhiệm trước pháp luật.", "Bên B thi công xây dựng có trách nhiệm đào tạo, hướng dẫn, phổ biến các quy định về an toàn lao động cho người lao động của mình.", "Bên B thi công xây dựng có trách nhiệm cấp đầy đủ các trang bị bảo hộ lao động, an toàn lao động cho người lao động.", "Kiểm tra và báo cáo kịp thời cho đại diện của Bên A các nguy cơ mất an toàn cho người và thiết bị tại công trường.", "Khi có sự cố về an toàn lao động do lỗi của mình, Bên B thi công xây dựng và các bên có liên quan có trách nhiệm tổ chức xử lý và báo cáo cơ quan quản lý nhà nước về an toàn lao động theo quy định của pháp luật đồng thời chịu trách nhiệm khắc phục và bồi thường những thiệt hại do Bên B không bảo đảm an toàn lao động gây ra.", "7.2.\tBảo vệ môi trường", "Bên B thi công xây dựng phải thực hiện các biện pháp bảo đảm về môi trường cho người lao động trên công trường và bảo vệ môi trường xung quanh bao gồm có biện pháp bao che, thu dọn phế thải đưa đến đúng nơi quy định.", "Trong quá trình vận chuyển vật liệu xây dựng, phế thải phải có biện pháp che chắn bảo đảm an toàn, vệ sinh môi trường.", "Các bên phải có trách nhiệm kiểm tra giám sát việc thực hiện bảo vệ môi trường xây dựng, đồng thời chịu sự kiểm tra giám sát của cơ quan quản lý nhà nước về môi trường. Trường hợp Bên B thi công xây dựng không tuân thủ các quy định về bảo vệ môi trường thì Bên A, cơ quan quản lý nhà nước về môi trường có quyền tạm ngừng thi công xây dựng và yêu cầu Bên B thực hiện đúng biện pháp bảo vệ môi trường.", "Tổ chức, cá nhân để xảy ra các hành vi làm tổn hại đến môi trường trong quá trình thi công xây dựng công trình phải chịu trách nhiệm trước pháp luật và bồi thường thiệt hại do lỗi của mình gây ra.", "Bên B phải quy định và cam kết toàn bộ công nhân thực hiện trong dự án phải chấp hành hành vệ sinh đúng nơi quy định.", "7.3.\tPhòng chống cháy nổ:", "Các bên tham gia hợp đồng xây dựng phải tuân thủ các quy định của nhà nước về phòng chống cháy nổ.", "Phải tuân thủ mọi qui định về an toàn điện, phòng chống cháy nổ tại công trường.", "Phải quản lý chặt chẽ các thiết bị điện và các vật liệu dễ cháy nổ.", "Điều 8.\tĐiện, nước và an ninh công trường", "8.1.\tĐiện, nước trên công trường", "Bên B có quyền sử dụng việc cung cấp điện, nước và dịch vụ khác có thể có trên công trường cho mục đích thi công công trình; Bên B có trách nhiệm bảo vệ nguồn điện, nước để phục vụ thi công công trình. Bên B phải tự mình chịu rủi ro và dùng chi phí của mình, cung cấp máy móc thiết bị cần thiết để sử dụng những dịch vụ này.", "Bên B sẽ thanh toán trực tiếp theo hóa đơn thực tế cho điện lực, đơn vị cung cấp nước. Bên B phải có trách nhiệm tiết kiện điện, nước.", "8.2.\tAn ninh công trường", "Bên B phải chịu trách nhiệm về việc cho phép những người không có nhiệm vụ vào công trường và thực hiện đăng ký tạm trú tạm vắng với chính quyền sở tại (nếu có).", "Những người có nhiệm vụ được vào công trường gồm nhân lực của Bên B và của Bên A và những người khác do Bên A (hoặc người thay mặt) thông báo cho Bên B biết.", "Điều 9.\tTạm ngừng và chấm dứt Hợp đồng bởi Bên A", "9.1.\tTạm ngừng thực hiện công việc của Hợp đồng bởi Bên A", "Trường hợp Bên B vi phạm nghĩa vụ theo Hợp đồng, Bên A có quyền thông báo bằng văn bản yêu cầu Bên B khắc phục các vi phạm hoặc sai sót trong thời hạn hợp lý, hoặc thời hạn khác do Hai Bên thống nhất tùy theo tính chất và mức độ của vi phạm.", "Bên A chỉ được quyền quyết định tạm ngừng thực hiện một phần hoặc toàn bộ công việc theo Hợp đồng khi đồng thời đáp ứng các điều kiện sau:", "Có căn cứ xác định Bên B vi phạm nghiêm trọng các nghĩa vụ về chất lượng, an toàn lao động hoặc tiến độ theo Hợp đồng;", "Vi phạm đó ảnh hưởng trực tiếp đến chất lượng công trình, an toàn hoặc tiến độ chung của dự án một cách nghiêm trọng;", "Bên B đã nhận được văn bản yêu cầu khắc phục nhưng không khắc phục hoặc không có biện pháp khắc phục phù hợp trong thời hạn quy định.", "Trước khi tạm ngừng thực hiện Hợp đồng, Bên A phải thông báo bằng văn bản cho Bên B trước ít nhất 05 (năm) ngày làm việc, trong đó nêu rõ:", "Nội dung vi phạm;", "Căn cứ xác định vi phạm;", "Biện pháp khắc phục yêu cầu; Thời hạn cuối cùng để Bên B hoàn thành việc khắc phục.", "Trường hợp Bên B chứng minh được việc chậm tiến độ hoặc không đáp ứng yêu cầu xuất phát từ lỗi của Bên A, do thay đổi thiết kế, chậm bàn giao mặt bằng, chậm cung cấp vật tư, chậm phê duyệt hồ sơ, phát sinh khối lượng hoặc các nguyên nhân khách quan, bất khả kháng thì Bên A không được lấy đó làm căn cứ để tạm ngừng Hợp đồng. Hai Bên sẽ thống nhất điều chỉnh tiến độ và các chi phí phát sinh (nếu có).", "Trường hợp Bên A tạm ngừng thực hiện Hợp đồng không đúng quy định hoặc không có căn cứ, Bên A phải chịu trách nhiệm đối với các thiệt hại thực tế, hợp lý phát sinh cho Bên B do việc tạm ngừng gây ra và gia hạn tương ứng thời gian thực hiện Hợp đồng.", "9.2.\tChấm dứt Hợp đồng bởi Bên A", "Bên A chỉ được quyền chấm dứt Hợp đồng khi Bên B có hành vi vi phạm nghiêm trọng nghĩa vụ theo Hợp đồng và đã được Bên A thông báo bằng văn bản yêu cầu khắc phục nhưng không khắc phục trong thời hạn hợp lý theo quy định của Hợp đồng.", "Bên A có quyền chấm dứt Hợp đồng trong các trường hợp sau:", "Bên B tự ý từ bỏ việc thực hiện Hợp đồng hoặc có văn bản chính thức thể hiện việc không tiếp tục thực hiện Hợp đồng.", "Không có lý do chính đáng mà Bên B ngừng thực hiện công việc liên tục từ 30 (ba mươi) ngày trở lên mặc dù Bên A đã có văn bản yêu cầu tiếp tục thực hiện.", "Bên B chuyển nhượng toàn bộ Hợp đồng hoặc giao thầu phụ phần công việc bị pháp luật hoặc Hợp đồng cấm mà không được Bên A chấp thuận bằng văn bản.", "Tiến độ thi công bị chậm trên 90 (chín mươi) ngày hoàn toàn do lỗi của Bên B và không thuộc các trường hợp được gia hạn tiến độ theo Hợp đồng, bao gồm nhưng không giới hạn: chậm bàn giao mặt bằng, thay đổi thiết kế, phát sinh khối lượng, chậm phê duyệt hồ sơ, chậm thanh toán của Bên A, ảnh hưởng từ các nhà thầu khác hoặc sự kiện bất khả kháng.", "Bên B bị Tòa án có thẩm quyền ra quyết định tuyên bố phá sản theo quy định của pháp luật và việc này làm cho Bên B không còn khả năng tiếp tục thực hiện Hợp đồng.", "Trước khi chấm dứt Hợp đồng, Bên A phải gửi thông báo bằng văn bản cho Bên B trước ít nhất 07 (bảy) ngày làm việc, trong đó nêu rõ:", "Hành vi vi phạm;", "Căn cứ xác định vi phạm;", "Yêu cầu khắc phục;", "Thời hạn cuối cùng để khắc phục.", "Chỉ khi hết thời hạn nêu trên mà Bên B không khắc phục hoặc không có biện pháp khắc phục phù hợp thì Bên A mới được quyền chấm dứt Hợp đồng.", "Trường hợp Hợp đồng bị chấm dứt, Hai Bên có trách nhiệm lập biên bản xác nhận hiện trạng công trình, nghiệm thu khối lượng công việc đã hoàn thành và thanh toán đầy đủ cho Bên B giá trị khối lượng đã được thực hiện, bao gồm cả các chi phí hợp lý phát sinh mà Bên B có quyền được hưởng theo Hợp đồng.", "Việc Bên A yêu cầu Bên B rời khỏi công trường chỉ được thực hiện sau khi hoàn tất việc kiểm kê tài sản, xác nhận khối lượng, lập biên bản bàn giao hiện trường và bảo đảm quyền thu hồi máy móc, thiết bị, vật tư, tài liệu thuộc sở hữu của Bên B. Bên A không được cản trở việc thu hồi tài sản hợp pháp của Bên B.", "9.3.\tThanh toán khi chấm dứt Hợp đồng", "Sau khi thông báo chấm dứt hợp đồng theo khoản 9.2 của Hợp đồng đã có hiệu lực, Bên A lập tức thanh toán cho Bên B đối với các hạng mục Bên B đã hoàn thành theo đúng tiêu chuẩn, chất lượng theo quy định tại Hợp đồng này trong thời hạn 5 ngày kể từ ngày hai bên ký quyết toán/thanh lý hợp đồng.", "Điều 10.\tChấm dứt Hợp đồng bởi Bên B", "10.1.\tChấm dứt Hợp đồng bởi Bên B", "Bên B được quyền chấm dứt Hợp đồng nếu :", "Bên B không nhận được số tiền được thanh toán trong vòng 30 ngày kể từ ngày đến hạn thanh toán theo điều 3 của hợp đồng.", "Công trình ngưng thi công quá 30 ngày do lỗi của Bên A.", "Trong bất cứ sự kiện hoặc trường hợp nào được nêu trên, Bên B có thể, bằng thông báo trước 03 ngày cho Bên A để chấm dứt Hợp đồng. Tuy nhiên trong trường hợp Bên A bị phá sản, vỡ nợ Bên B có thể thông báo chấm dứt Hợp đồng ngay lập tức.", "Hợp đồng bị chấm dứt trong các trường hợp nêu trên , Bên A có trách nhiệm:", "Thanh toán đầy đủ giá trị khối lượng công việc đã được thực hiện, nghiệm thu hoặc đủ điều kiện nghiệm thu;", "Thanh toán các chi phí hợp lý mà Bên B đã phát sinh để thực hiện Hợp đồng, bao gồm chi phí nhân công, máy móc, vật tư, huy động và tháo dỡ thiết bị, bảo quản công trình (nếu có);", "Bồi thường các thiệt hại thực tế, hợp lý phát sinh cho Bên B theo quy định của Hợp đồng và pháp luật.", "Trong thời gian Bên A chậm thanh toán hoặc vi phạm nghiêm trọng nghĩa vụ theo Hợp đồng, Bên B có quyền tạm ngừng thực hiện công việc sau khi đã thông báo bằng văn bản cho Bên A theo quy định của Hợp đồng mà không bị xem là vi phạm tiến độ hoặc vi phạm Hợp đồng.", "10.2.\tThanh toán khi chấm dứt Hợp đồng", "Sau khi thông báo chấm dứt hợp đồng theo khoản 10.1 của Hợp đồng đã có hiệu lực, trong vòng 07 ngày làm việc Bên A sẽ thanh toán cho Bên B đối với các hạng mục Bên B đã hoàn thành .", "Điều 11.\tBảo hành", "Sau khi nhận được biên bản nghiệm thu công trình, hạng mục công trình để đưa vào sử dụng, Bên B phải:", "Thực hiện bảo hành công trình trong thời gian 12 tháng.", "Trong thời gian bảo hành công trình Bên B có trách nhiệm phải khắc phục, sửa chữa mọi sai sót, thay thế sản phẩm hư hỏng, khiếm khuyết do lỗi của Bên B gây ra trong quá trình thi công công trình bằng chi phí của Bên B. Và lỗi do Bên B gây ra phải được kiểm định, xác nhận từ Bên A và Bên B. Nếu đúng lỗi của Bên B  thì việc sửa chữa các lỗi này phải được bắt đầu trong vòng 03 ngày làm việc sau khi nhận được thông báo của Bên A, thời gian hoàn thành phụ thuộc vào tính chất và mức độ hư hại của hạng mục cần sửa chữa. Nếu quá thời hạn này mà Bên B không bắt đầu thực hiện các công việc sửa chữa thì Bên A có quyền thuê một Bên B khác (bên thứ ba) thực hiện các công việc này và toàn bộ chi phí cho việc sửa chữa để chi trả cho bên thứ ba sẽ do Bên B chịu, tuy nhiên Chi phí bên thứ 3 sửa chữa hợp lý, hợp lệ và có đầy đủ chứng từ sẽ do Bên B chịu trong phạm vi thiệt hại do lỗi của Bên B gây ra, đồng thời bên B phải nhận được và đồng ý thông báo trước đó về việc này. Trường hợp Bên B không đồng ý về nguyên nhân hoặc chi phí sửa chữa thì Hai Bên sẽ thương lượng giải quyết;", "Bên B được ngân hàng bảo lãnh hoàn trả phí bảo hành công trình sau khi kết thúc thời hạn bảo hành.", "Điều 12.\tRủi ro và Bất khả kháng", "12.1.\tRủi ro và Bất khả kháng", "Rủi ro là nguy cơ ảnh hưởng tiêu cực đến việc thực hiện Hợp đồng.", "Bất khả kháng là một sự kiện rủi ro không thể chống đỡ nổi khi nó xảy ra và không thể lường trước khi ký kết Hợp đồng như: động đất, bão, lũ, lụt, lốc, sóng thần, lở đất hay hoạt động núi lửa, chiến tranh, dịch bệnh.", "Khi một Bên bị rơi vào tình trạng bất khả kháng, thì phải thông báo bằng văn bản cho bên kia trong thời gian sớm nhất có thể nhưng không chậm quá 02 ngày làm việc.", "12.2.\tHậu quả của các rủi ro", "Nếu và trong chừng mực nào đó mọi rủi ro được liệt kê trong khoản 12.1 của Hợp đồng này dẫn đến mất mát hay hư hỏng cho công trình, bất động sản, vật tư thiết bị hay các tài liệu của Bên B, thì Bên B phải ngay lập tức gửi thông báo cho Bên A hoặc ngược lại.", "12.3.\tBồi thường rủi ro", "Nếu do lỗi bên nào gây ra bên đó chịu trách nhiệm.", "Bên nào có lỗi gây ra thiệt hại cho Bên còn lại hoặc cho bên thứ ba trong quá trình thực hiện Hợp đồng thì phải chịu trách nhiệm bồi thường đối với phần thiệt hại do lỗi của mình gây ra theo quy định của pháp luật và Hợp đồng này.", "Việc xác định lỗi, nguyên nhân, phạm vi thiệt hại và trách nhiệm bồi thường phải được Hai Bên phối hợp kiểm tra, lập biên bản xác nhận hoặc căn cứ vào kết luận của đơn vị tư vấn giám sát, đơn vị kiểm định độc lập hoặc cơ quan nhà nước có thẩm quyền trong trường hợp Hai Bên không thống nhất.", "Bên yêu cầu bồi thường có trách nhiệm chứng minh thiệt hại thực tế phát sinh, mối quan hệ nhân quả giữa hành vi vi phạm và thiệt hại, đồng thời áp dụng các biện pháp hợp lý để hạn chế tổn thất.", "Bên gây thiệt hại chỉ phải bồi thường đối với các thiệt hại thực tế, trực tiếp, hợp lý và có chứng từ hợp lệ. Không Bên nào phải chịu trách nhiệm đối với các thiệt hại các khoản bồi thường mang tính suy đoán, trừ khi pháp luật có quy định khác hoặc Hai Bên có thỏa thuận khác bằng văn bản.", "Bên B không phải chịu trách nhiệm đối với các thiệt hại phát sinh từ lỗi của Bên A, lỗi của các nhà thầu khác do Bên A quản lý, việc Bên A sử dụng công trình không đúng hướng dẫn, các thay đổi do Bên A thực hiện sau khi bàn giao hoặc các trường hợp bất khả kháng theo quy định của Hợp đồng và pháp luật.", "Trường hợp thiệt hại phát sinh do lỗi của cả Hai Bên thì trách nhiệm bồi thường sẽ được phân chia tương ứng với mức độ lỗi của mỗi Bên.", "12.4.\tThông báo về bất khả kháng", "Nếu một bên bị cản trở thực hiện bất cứ nghĩa vụ của mình theo Hợp đồng do tình trạng bất khả kháng, bên đó phải gửi thông báo cho bên kia về sự việc hoặc trường hợp gây nên tình trạng bất khả kháng và phải nêu rõ các nghĩa vụ, công việc đã và sẽ bị cản trở. Thông báo phải được gửi sớm nhất (nhưng không chậm quá 2 ngày làm việc) sau khi bên đó nhận biết được tình trạng, hoặc lẽ ra đã nhận biết được về sự việc hoặc trường hợp gây nên tình trạng bất khả kháng.", "Bên đó, khi đã thông báo, phải được miễn cho việc thực hiện công việc thuộc nghĩa vụ trong thời gian mà tình trạng bất khả kháng cản trở việc thực hiện của họ.", "Dẫu cho có các quy định nào khác của khoản này, thì bất khả kháng cũng không áp dụng đối với các nghĩa vụ thanh toán tiền của bất cứ bên nào cho bên kia theo Hợp đồng.", "12.5.\tChấm dứt Hợp đồng do bất khả kháng, thanh toán, hết trách nhiệm", "Nếu việc thực hiện công trình cơ bản đang được tiến hành bị cản trở liên tục trong thời gian 10 ngày do bất khả kháng đã được thông báo hoặc trong nhiều khoảng thời gian mà tổng số là trên 25 ngày do bất khả kháng đã được thông báo, thì một trong hai bên có thể gửi thông báo chấm dứt Hợp đồng cho bên kia. Trong trường hợp này, việc chấm dứt Hợp đồng sẽ có hiệu lực 07 ngày sau khi có thông báo.", "Đối với trường hợp chấm dứt này, Bên A phải thanh toán cho Bên B:", "Các khoản thanh toán cho bất kỳ công việc nào đã được thực hiện mà giá đã được nêu trong Hợp đồng và đã được Đại diện Bên A nghiệm thu.", "Chi phí cho thiết bị và vật tư được đặt hàng cho công trình đã được chuyển tới cho Bên B, hoặc những thứ Bên B có trách nhiệm chấp nhận giao hàng: thiết bị và vật tư này sẽ trở thành tài sản (và là rủi ro) của Bên A khi đã được Bên A thanh toán, và Bên B sẽ để cho Bên A tuỳ ý sử dụng.", "Mọi chi phí hoặc trách nhiệm khác mà trong trường hợp bất khả kháng Bên B phải chịu để hoàn thành công trình.", "Chi phí di chuyển các công trình tạm và thiết bị của Bên B khỏi công trình và trả lại các hạng mục thiết bị này cho công trình của Bên B.", "Chi phí bồi thường cho đội ngũ nhân viên và các người lao động được Bên B thuê cho toàn bộ thời gian liên quan đến công trình vào thời điểm chấm dứt Hợp đồng.", "Điều 13.\tPhạt vi phạm hợp đồng", "Phạt chậm tiến độ nếu do lỗi của bên B: Bên B thi công trễ tiến độ so với tiến độ tổng thể đã được phê duyệt thì Bên B sẽ bị phạt 0.05% giá trị phần nghĩa vụ bị vi phạm cho 1 ngày trễ hạn, nhưng giá trị phạt tối đa không vượt quá 8% giá trị phần nghĩa vụ Hợp đồng bị vi phạm trong", "Việc áp dụng phạt chậm tiến độ đối với bên B phải loại trừ các trường hợp phát sinh từ những nguyên nhân sau:", "Bên A Chậm bàn giao mặt bằng;", "Bên A Chậm phê duyệt bản vẽ/shop drawing;", "Bên A Thay đổi thiết kế;", "Điều chỉnh Phát sinh khối lượng;", "Bên A Chậm thanh toán;", "Do sự kiện Bất khả kháng...", "Phạt thanh toán chậm: Bên A thanh toán chậm so với tiến độ thanh toán nêu tại Điều 3 của Hợp đồng thì Bên A sẽ bị phạt sẽ bị phạt 0.05% giá trị nghĩa vụ bị vi phạm trong Hợp đồng cho 1 ngày trễ hạn, nhưng giá trị phạt tối đa không vượt quá 8 % giá trị phần nghĩa vụ hợp đồng bị vi phạm.", "Bên nào vi phạm nghĩa vụ theo Hợp đồng và gây thiệt hại cho Bên còn lại thì phải bồi thường các thiệt hại thực tế, trực tiếp, hợp lý phát sinh do hành vi vi phạm của mình theo quy định của pháp luật.", "Bên yêu cầu bồi thường có trách nhiệm chứng minh hành vi vi phạm, thiệt hại thực tế phát sinh và mối quan hệ nhân quả giữa hành vi vi phạm và thiệt hại.", "Đối với việc chậm thanh toán theo thời hạn quy định tại điều 3.6.2, ngoài khoản phạt chậm thanh toán, bên A còn phải thanh toán lãi chậm trả theo quy định pháp luật.", "Điều 14.\tKhiếu nại và xử lý các tranh chấp", "14.1.\tKhiếu nại", "Khiếu nại trong quá trình thực hiện hợp đồng xây dựng trong hợp đồng này được hiểu là khi một bên phát hiện bên kia thực hiện không đúng hoặc không thực hiện nghĩa vụ theo đúng hợp đồng thì có quyền yêu cầu bên kia thực hiện đúng nội dung hợp đồng đã ký. Khi đó bên phát hiện có quyền khiếu nại bên kia về nội dung này.", "Khi một bên khiếu nại bên kia thì phải đưa ra các căn cứ, dẫn chứng cụ thể để làm sáng tỏ những nội dung khiếu nại.", "Trong vòng 30 ngày kể từ khi phát hiện những nội dung không phù hợp với hợp đồng đã ký, bên phát hiện phải thông báo ngay cho bên kia về những nội dung đó và khiếu nại về các nội dung này. Ngoài khoảng thời gian này nếu không bên nào có khiếu nại thì các bên phải thực hiện theo đúng những thỏa thuận đã ký.", "Trong vòng 30 ngày kể từ ngày nhận được khiếu nại, bên nhận được khiếu nại phải đưa ra những căn cứ, dẫn chứng về những nội dung cho rằng việc khiếu nại của bên kia là không phù hợp với hợp đồng đã ký, nếu những căn cứ và dẫn chứng không thuyết phục, không hợp lý thì phải chấp thuận với những khiếu nại của bên kia. Ngoài khoảng thời gian này nếu bên nhận được khiếu nại không có ý kiến thì coi như đã chấp thuận với những nội dung khiếu nại do bên kia đưa ra.", "14.2.\tXử lý các tranh chấp", "Khi có tranh chấp phát sinh trong quá trình thực hiện Hợp đồng, các bên sẽ cố gắng thương lượng để giải quyết bằng biện pháp hòa giải.", "Trường hợp Hai Bên không giải quyết được bằng thương lượng, tranh chấp sẽ được giải quyết tại Trung tâm Trọng tài Quốc tế Việt Nam (VIAC) theo Quy tắc tố tụng trọng tài của VIAC đang có hiệu lực tại thời điểm giải quyết tranh chấp hoặc đưa vụ việc ra giải quyết tại tòa án có thẩm quyền.", "Điều 15.\tQuyết toán và thanh lý Hợp đồng", "15.1.\tQuyết toán Hợp đồng", "Trong vòng 10 ngày sau khi nhận được biên bản nghiệm thu đã hoàn thành toàn bộ nội dung công việc theo quy định của Hợp đồng, Bên B sẽ trình cho Bên A hồ sơ quyết toán Hợp đồng bao gồm các tài liệu sau:", "Biên bản nghiệm thu hoàn thành toàn bộ công việc thuộc phạm vi Hợp đồng.", "Bảng xác nhận giá trị khối lượng công việc phát sinh (nếu có) ngoài phạm vi Hợp đồng.", "Bảng tính giá trị quyết toán Hợp đồng (gọi là quyết toán A-B), trong đó nêu rõ phần đã thanh toán và giá trị còn lại mà Bên A có trách nhiệm thanh toán cho Bên B.", "Hóa đơn Giá trị gia tăng.", "15.2.\tThanh lý Hợp đồng", "Hợp đồng được thanh lý trong trường hợp:", "Các bên hoàn thành các nghĩa vụ theo Hợp đồng đã ký;", "Hợp đồng bị chấm dứt (huỷ bỏ) theo quy định của Điều 9 của Hợp đồng, Điều 10 của Hợp đồng.", "Việc thanh lý Hợp đồng phải được hoàn tất trong thời hạn 14 ngày kể từ ngày các bên tham gia Hợp đồng hoàn thành các nghĩa vụ theo Hợp đồng hoặc Hợp đồng bị chấm dứt (huỷ bỏ).", "Điều 16.\tHiệu lực của Hợp đồng", "16.1.\tThời điểm có hiệu lực của Hợp đồng:", "Hợp đồng này có hiệu lực kể từ ngày ký Hợp đồng.", "16.2.\tTính pháp lý của Hợp đồng xây dựng:", "Hợp đồng có hiệu lực là cơ sở pháp lý mà Bên A, Bên B và các bên liên quan có nghĩa vụ thực hiện.", "Hợp đồng có hiệu lực là cơ sở để giải quyết tranh chấp giữa các bên. Các tranh chấp phát sinh ngoài Hợp đồng sẽ được giải quyết trên cơ sở các quy định của pháp luật có liên quan.", "Điều 17.\tĐiều khoản chung", "Hai bên cam kết thực hiện đúng những điều đã quy định trong Hợp đồng này.", "Hợp đồng này được lập thành 02 bản. Mỗi bên giữ 01 bản, có giá trị pháp lý như nhau.", "- Giá trị Hợp đồng (chưa bao gồm VAT) | : 12.317.591.449 VNĐ", "- Tiền thuế VAT 08% | :      383.373.508 VNĐ", "- Giá trị hợp đồng (Bao gồm thuế VAT) | : 12.700.964.957 VNĐ", "Bên A | ĐẠI DIỆN BÊN B", "| NGUYỄN NGỌC HOÀNG THÁI BẢO"]}, {"id": "tpl-thiet-ke", "name": "Hợp đồng thiết kế", "unit": "buctuong", "note": "Mẫu Bức Tường — triển khai hồ sơ thi công kiến trúc, kết cấu, MEP", "lines": ["PHẦN 1- CÁC CĂN CỨ KÝ KẾT HỢP ĐỒNG", "Căn cứ Bộ luật Dân sự số 91/2015/QH13 ngày 24/11/2015 của Quốc hội khoá XIII, kỳ họp thứ 10.", "Căn cứ Luật Xây dựng Luật xây dựng số 35/2025/QH15 ban hành ngày 10/12/2025.", "Căn cứ vào khả năng và nhu cầu của hai Bên.", "PHẦN 2- CÁC ĐIỀU KHOẢN VÀ ĐIỀU KIỆN CỦA HỢP ĐỒNG", "Hôm nay, ngày .... tháng .... năm 2026, hai Bên chúng tôi gồm có:", "BÊN A: CHỦ ĐẦU TƯ", "Đại diện          : ......................................................................................................", "Địa chỉ\t: ......................................................................................................", "Mã số thuế\t: ......................................................................................................", "Điện thoại       : ......................................................................................................", "BÊN B: CÔNG TY TNHH TƯ VẤN THIẾT KẾ KIẾN TRÚC XÂY DỰNG BỨC TƯỜNG", "Đại diện\t: Ông NGUYỄN NGỌC HOÀNG THÁI BẢO  Chức vụ: Giám Đốc", "Địa chỉ \t\t: 15 Đường số 14, Khu dân cư Nam Long, Phường Tân Thuận, Tp. HCM", "Mã số thuế\t: 0309309523", "TK Ngân hàng: 006704070009340 - Ngân hàng HD BANK", "Tên tài khoản\t: Công ty TNHH Tư vấn thiết kế Kiến Trúc Xây Dựng Bức Tường", "Sau khi thỏa thuận, hai Bên cùng thống nhất ký Hợp đồng thiết kế với nội dung:", "Điều 1: NỘI DUNG HỢP ĐỒNG", "Bên A đồng ý giao và Bên B đồng ý nhận lập Triển khai hồ sơ thi công Kiến trúc – Kết cấu – MEP cho công trình NEM Office. Nội dung thiết kế được đính kèm tại Phụ lục 1 của Hợp đồng này", "Điều 2: THỜI GIAN THỰC HIỆN", "- Thời gian thực hiện Hợp đồng: The Wall sẽ gửi tiến độ công việc chi tiết (dự kiến) sau khi tạm ứng đợt 1. Tiến độ sẽ không bao gồm thời gian chỉnh sửa/ điều chỉnh theo góp ý của CĐT", "- Trong vòng 02 ngày làm việc kể từ khi Bên B giao sản phẩm từng giai đoạn, Bên A phải có phản hồi bằng văn bản hoặc phản hồi qua email/zalo về việc đồng ý hay ý kiến về sản phẩm bên B bàn giao . Quá thời hạn này mà Bên A không phản hồi thì xem như đã phê duyệt giai đoạn đó.", "- Bên B điều chỉnh phương án theo ý kiến đóng góp của Bên A (nếu có – không quá 3 lần). Mỗi lần chỉnh sửa 03 ngày tùy theo ý kiến chỉnh sửa của CĐT (không bao gồm thứ 7, chủ nhật).", "- Bên A và Bên B ký biên bản thống nhất thiết kế sơ phác và phương án để tiến hành triển khai hồ sơ thiết kế bản vẽ thi công.", "- Nếu Bên A có thay đổi yêu cầu thiết kế sau khi đã thống nhất thiết kế của giai đoạn này mà yêu cầu Bên B phải tiến hành thực hiện lại công việc như trên thì xem như là khoản phát sinh và thời gian phát sinh. Và khoản phí cũng như khoảng thời gian phát sinh này sẽ do các Bên đồng thuận bằng thỏa thuận.", "Điều 3: GIÁ TRỊ HỢP ĐỒNG:", "Tổng giá trị Hợp đồng", "Giá trị Thiết kế bao gồm toàn bộ nội dung công việc quy định tại Điều 1 là: 491.452.920VND", "(Bằng chữ: Bốn trăm chín mươi mốt triệu bốn trăm năm mươi hai ngàn chín trăm hai mươi đồng./.)", "Hợp đồng chưa bao gồm: Chi phí các hạng mục phát sinh không có trong Phụ lục 01 đính kèm trong Hợp đồng này.", "Giá trị Hợp đồng trên bao gồm chi phí giám sát tác giả và tư vấn chọn vật liệu hoàn thiện.", "Giá trị Hợp đồng là giá trị không thay đổi trong suốt thời gian thực hiện Hợp đồng với điều kiện Bên B chỉ thiết kế theo đúng nội dung thỏa thuận mà hai Bên đã xác nhận và đính kèm theo Hợp đồng này.", "Giá trị Hợp đồng chỉ thay đổi trong các điều kiện sau:", "- Bên A thay đổi yêu cầu thiết kế đột ngột sau khi đã bàn bạc thống nhất từng giai đoạn bằng biên bản làm việc trước đó mà Bên B đã thực hiện công việc thiết kế theo yêu cầu cũ.", "- Diện tích thiết kế, quy mô thiết kế tăng giảm do yêu cầu lại của Bên A. Nếu quy mô và diện tích tăng thêm thì sẽ là phát sinh tăng và ngược lại nếu quy mô, diện tích giảm hơn sẽ là phát sinh giảm và điều này chỉ có giá trị chỉ khi Bên A đưa yêu cầu thay đổi trước khi Bên B thực hiện công việc thiết kế, nếu Bên A đưa ra yêu cầu sau khi Bên B đã thực hiện công việc thì dù có tăng hoặc giảm quy mô, diện tích thì cũng xem như là phát sinh tăng vì lúc này Bên B phải thực hiện lại công việc từ đầu. Phí phát sinh tăng/giảm sẽ được hai Bên thống nhất bằng biên bản làm việc cho từng trường hợp cụ thể.", "Điều 4: PHƯƠNG THỨC VÀ THỜI HẠN THANH TOÁN", "Bên A thanh toán cho Bên B theo tiến độ chi tiết như sau:", "Lần 1: Tạm ứng 40% giá trị Hợp đồng, tương đương với số tiền 196,581,168 VND (Bằng chữ: Một trăm chín mươi sáu triệu năm trăm tám mươi mốt ngàn một trăm sáu mươi tám đồng./.) sau khi Quý khách hàng xác nhận báo giá và ký kết Hợp đồng giữa hai Bên.", "- Lần 2: Thanh toán 40% giá trị HĐ tương đương với số tiền 196,581,168 VND (Bằng chữ: Một trăm chín mươi sáu triệu năm trăm tám mươi mốt ngàn một trăm sáu mươi tám đồng./.) sau khi phê duyệt phương án bố trí lại công năng.", "- Lần 3: Thanh toán 20% giá trị HĐ tương đương với số tiền 98,290,584 VND (Bằng chữ: Chín mươi tám triệu hai trăm chín mươi ngàn năm trăm tám mươi bốn đồng./.) sau khi hoàn thành và bàn giao toàn bộ hồ sơ chi tiết bảng vẽ kỹ thuật thi công Kiến trúc, Kết cấu và MEP liên quan.", "Bên A sẽ thanh toán phí thiết kế bằng chuyển khoản cho Bên B với thông tin tài khoản bên dưới:", "Số tài khoản:", "Tại ngân hàng:", "Tên tài khoản:", "Các khoản thanh toán trên sẽ được thực hiện trong vòng ba (03) ngày kể từ ngày Bên A nhận được Đề nghị Tạm ứng/ Đề nghị thanh toán của Bên B và với điều kiện là Bên B đã hoàn thành các công đoạn thiết kế tương ứng.", "Các khoản thanh toán sẽ được chuyển cho Bên B theo thông tin trên Đề nghị Tạm ứng/ Đề nghị thanh toán.", "Trường hợp bên A chậm thanh toán theo quy định tại Điều này thì Bên B có quyền tạm dừng toàn bộ công việc thiết kế; Thời gian thực hiện hợp đồng được gia hạn tương ứng với thời gian chậm thanh toán.", "Điều 5: QUYỀN VÀ TRÁCH NHIỆM CỦA BÊN A", "Bên A được toàn quyền sử dụng Hồ sơ thiết kế này để thuê bất kỳ một công ty nào đó thi công.", "Thanh toán cho Bên B theo đúng tiến độ thanh toán đã thỏa thuận tại Điều 4 của Hợp đồng này.", "Bên A nhất quán trong các yêu cầu thiết kế trong suốt quá trình thực hiện Hợp đồng.", "Điều 6: QUYỀN VÀ TRÁCH NHIỆM BÊN B", "Chịu hoàn toàn trách nhiệm của một nhà thầu thiết kế đối với hồ sơ thiết kế do mình lập, cử người có kinh nghiệm có chuyên môn cho từng giai đoạn thiết kế tương ứng để hoàn thành công việc thiết kế theo tiêu chuẩn ngành và luật pháp Việt Nam.", "Chịu trách nhiệm về chất lượng thiết kế và kịp thời chỉnh sửa bản vẽ thiết kế phù hợp thực tiễn nếu có sai sót trong quá trình thiết kế ảnh hưởng đến quá trình thi công xây dựng công trình.", "Giữ bí mật thông tin liên quan đến Hợp đồng hoặc pháp luật có quy định.Bên B có quyền chấm dứt Hợp đồng nếu Bên A vi phạm nghĩa vụ thanh toán của mình theo quy định tại Điều 4 của Hợp đồng này.", "Bên B có trách nhiệm thiết kế công trình đúng kỹ thuật, mỹ thuật, giải trình các yêu cầu hợp lý và chấp nhận kết quả thẩm tra của đơn vị tư vấn thẩm tra đối với hồ sơ thiết kế được lập theo Hợp đồng này.", "Bên B có trách nhiệm thực hiện thiết kế theo đúng tiến độ như ở điều 2 của Hợp đồng.", "Điều 7: BÀN GIAO VÀ THANH LÝ HỢP ĐỒNG", "Sau khi Các Bên tiến hành nghiệm thu, bàn giao hồ sơ thiết kế và ký biên bản thanh lý Hợp đồng thiết kế, Bên A có trách nhiệm hoàn thành nghĩa vụ thanh toán của mình theo Điều 4 của Hợp đồng này.", "Bên B sẽ tiến hành ký biên bản cam kết giám sát tác giả (nội dung này sẽ không cần thực hiện khi Bên B tiếp tục được Bên A giao thực hiện xây dựng công trình) với các thỏa thuận sau khi bàn bạc và thống nhất hình thức giám sát tác quyền.", "Hồ sơ thiết kế Bên B giao cho Bên A là 01 (một) bộ hồ sơ đóng tập các bản vẽ 2D; 3D khổ A3 (297 x 420).", "Điều 8: CHẤM DỨT HỢP ĐỒNG", "Hợp đồng này sẽ chấm dứt nếu xảy ra một trong các trường hợp sau:", "Hợp đồng được thanh lý theo quy định tại Điều 7 của Hợp đồng này; hoặc", "Bên A yêu cầu thay đổi thiết kế mà theo ý kiến của Bên B thì những yêu cầu thay đổi thiết kế này không phù hợp với thực tiễn ngành và luật pháp Việt Nam không cho phép; nếu điều này xảy ra thì Bên B có quyền từ chối thực hiện công việc thiết kế tiếp theo mà không cần phải trả lại bất kỳ chi phí tạm ứng trước đó nào của Bên A.", "Trường hợp bất khả kháng quy định tại Điều 9 dưới đây.", "Hai Bên thỏa thuận chấm dứt Hợp đồng trước thời hạn", "Điều 9: SỰ KIỆN BẤT KHẢ KHÁNG", "Sự kiện bất khả kháng là sự kiện xảy ra ngoài sự kiểm soát hợp lý của Các Bên sau khi đã áp dụng các biện pháp cần thiết mà một Bên hoặc Các Bên không thể thực hiện được nghĩa vụ của mình theo Hợp đồng này. Các Sự kiện bất khả kháng bao gồm nhưng không giới hạn bởi: thay đổi về mặt chính sách của nhà nước, chiến tranh, bạo loạn, tình trạng khẩn cấp, đình công, hoả hoạn, động đất, lụt bão, sét đánh, sóng thần và các thiên tai khác.", "Nếu một Bên bị cản trở không thể thực hiện nghĩa vụ của mình theo Hợp đồng này vì Sự kiện bất khả kháng thì Bên đó phải thông báo cho Bên kia bằng văn bản trong vòng 03 (ba) ngày kể từ ngày xảy ra Sự kiện bất khả kháng. Bên bị ảnh hưởng của Sự kiện bất khả kháng cũng với Các Bên sẽ nỗ lực để hạn chế và kiểm soát mức độ thiệt hại của Sự kiện bất khả kháng. Bên không bị ảnh hưởng của Sự kiện bất khả kháng có thể gửi yêu cầu chấm dứt Hợp đồng này nếu Bên bị ảnh hưởng bởi Sự kiện bất khả kháng không khắc phục được trong vòng 10 (mười) ngày kể từ ngày xảy ra Sự kiện bất khả kháng.", "Thời gian ngừng thiết kế do sự kiện bất khả kháng sẽ không được tính vào tiến độ thiết kế Công trình.", "Điều 10: LUẬT ÁP DỤNG VÀ GIẢI QUYẾT TRANH CHẤP", "Hợp đồng này được giải thích và điều chỉnh theo pháp luật của Việt nam.", "Tất cả các tranh chấp phát sinh từ Hợp đồng này sẽ được giải quyết thông qua hoà giải thiện chí giữa các Bên. Nếu sau ba mươi (30) ngày kể từ ngày xảy ra tranh chấp mà tranh chấp không được giải quyết thông qua hoà giải, tranh chấp sẽ được giải quyết tại tòa án có thẩm quyền tại Thành phố Hồ Chí Minh.", "Trong quá trình giải quyết tranh chấp, các Bên vẫn phải tuân thủ các nghĩa vụ của mình trong quá trình thực hiện Hợp đồng này.", "Điều 11: CAM KẾT CHUNG", "Hai Bên cần chủ động thông báo cho nhau tiến độ thực hiện Hợp đồng. Nếu có vấn đề gì bất lợi phát sinh, các Bên phải kịp thời thông báo cho nhau biết để tích cực giải quyết. (Nội dung được ghi lại dưới hình thức biên bản).", "Hợp đồng này là một thỏa thuận toàn vẹn giữa Các Bên và hủy bỏ, thay thế tất cả các thỏa thuận, dàn xếp, Hợp đồng hay tuyên bố trước đó dưới bất kỳ hình thức nào, dù bằng văn bản hoặc lời nói, được giao kết giữa Các Bên và có đối tượng tương tự như đối tượng của Hợp đồng này. Mọi sự sửa đổi hay bổ sung vào bản Hợp đồng này phải được sự đồng ý của cả hai Bên và được lập thành văn bản mới có giá trị hiệu lực.", "Bất kỳ phần, điều khoản hoặc quy định nào của Hợp đồng này bị xem là không hợp pháp, không có giá trị, không có hiệu lực hoặc không thể thực thi theo quy định của pháp luật Việt Nam sẽ được xem như không có giá trị thi hành giữa Các Bên, và các điều khoản còn lại của Hợp đồng này vẫn giữ nguyên giá trị và hiệu lực.", "Hợp đồng này có hiệu lực từ ngày ký cho đến khi Hợp đồng chấm dứt theo quy định tại (Điều 8) trên đây. Hợp đồng này được lập thành hai (02) bản, Bên A giữ 01 bản, Bên B giữ 01 bản, và có giá trị pháp lý như nhau.", "Sau khi đọc lại lần cuối cùng và thống nhất với những nội dung đã ghi trong Hợp đồng, hai Bên cùng ký tên dưới đây.", "NGUYỄN NGỌC HOÀNG THÁI BẢO", "Phụ lục 1", "(Đính kèm theo Hợp đồng số 100726/HĐTK/TW-NEM)", "THÀNH PHẦN HỒ SƠ  - NỘI DUNG CÔNG VIỆC THIẾT KẾ", "ĐẠI DIỆN BÊN A | ĐẠI DIỆN BÊN B", "NỘI DUNG CÔNG VIỆC | KIẾN TRÚC – KẾT CẤU - MEP | KIẾN TRÚC – KẾT CẤU - MEP", "BẢN VẼ TRIỂN KHAI KIẾN TRÚC PHẦN THÔ | BẢN VẼ TRIỂN KHAI KIẾN TRÚC PHẦN THÔ |", "Chi tiết thi công phối cảnh mặt tiền. | Chi tiết thi công phối cảnh mặt tiền. |", "Mặt bằng kích thước. | Mặt bằng kích thước. |", "Mặt bằng định vị cửa, thống kê cửa. | Mặt bằng định vị cửa, thống kê cửa. |", "Chi tiết mặt cắt công trình. | Chi tiết mặt cắt công trình. |", "Chi tiết cầu thang, tam cấp, lan can, tay vịn. | Chi tiết cầu thang, tam cấ
