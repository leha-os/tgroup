/* v1.1 PRO: company cards, group sections, motion */
.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:#1E5A44;border-radius:3px}.sidebar::-webkit-scrollbar-track{background:transparent}
.company-band{height:6px}
.company-card{padding:18px}
.company-card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(30,26,15,.13);border-color:#CAB079}
.company-card .mono{width:52px;height:52px;font-size:15px;border-radius:8px}
.company-name{font-size:15px}
.company-legal{font-size:11px;color:#8a877d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:290px;margin-top:3px}
.group-badge{font-size:10.5px;font-weight:800;letter-spacing:0;color:#fff;padding:5px 9px;border-radius:20px;white-space:nowrap;align-self:flex-start}
.company-meta4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 12px}
.company-meta4 small{display:block;color:#8a877d;font-size:8.5px;letter-spacing:0;margin-bottom:4px}
.company-meta4 strong{font-size:14px}
.company-leader{display:flex;gap:9px;align-items:center;padding:10px 0;border-top:1px solid #f0eee8}
.company-leader small{display:block;color:#8a877d;font-size:8.5px;letter-spacing:0}
.company-leader strong{font-size:12.5px}
.group-section-head{font-size:17px;font-weight:800;letter-spacing:0;display:flex;align-items:center;gap:10px;margin:22px 0 13px;padding-left:12px;border-left:5px solid #CAB079;color:#1A1A1A}
.group-section-head span{font-size:12px;color:#8a877d;font-weight:600;letter-spacing:0}
.detail-hero .mono{width:72px;height:72px;font-size:20px;border-radius:10px}
.detail-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi,.alert-card,.panel{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.kpi:hover,.alert-card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(30,26,15,.13);border-color:#CAB079}
.btn{transition:all .18s ease}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.nav button{transition:all .18s ease}.nav button:hover{transform:translateX(2px)}
.content{animation:viewIn .45s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.progress span,.mini-bar span{transform-origin:left;animation:barGrow .9s ease both}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{transform-origin:bottom;animation:barUp .8s ease both}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.donut{animation:donutIn 1s ease both}
@keyframes donutIn{from{transform:rotate(-25deg);opacity:.35}to{transform:rotate(0);opacity:1}}
.modal{animation:modalIn .28s ease both}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}

/* ===== TGROUP OS v1.2.0 — Lớp trình bày Command Center ===== */
:root{--shadow:0 10px 30px rgba(24,32,18,.08),0 2px 6px rgba(24,32,18,.05);--shadow-lg:0 18px 42px rgba(7,35,26,.16),0 4px 12px rgba(24,32,18,.07)}
body{font-size:13.5px}
.content{padding:28px 30px 38px}
.page-head h1{font-size:31px;letter-spacing:0}
.page-head{margin-bottom:22px}
.kpi-num{font-size:38px;letter-spacing:0}
.kpi,.panel,.company-card,.alert-card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.kpi:hover,.company-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.panel-head h3{font-size:13.5px;letter-spacing:0}
thead th{position:sticky;top:0;z-index:2;background:#faf9f5}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{transition:background .12s ease}
.nav-badge{margin-left:auto;background:linear-gradient(160deg,#B79753 0%,#D1B985 55%,#B79753 100%);color:#241C0B;font-size:10.5px;font-weight:850;border-radius:20px;padding:2px 7px;line-height:1.5;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.avatar{background:linear-gradient(135deg,#E7D7B6,#D1B987);color:#614B1C}
.btn.primary{background:linear-gradient(160deg,#CAB079 0%,#D6BE8B 55%,#CAB079 100%);border-color:#AD8735;box-shadow:0 2px 8px rgba(193,153,67,.35)}
.status{letter-spacing:0}
/* Hero */
.hero{position:relative;border-radius:18px;padding:26px 28px 24px;color:#E7ECE7;background:radial-gradient(640px 300px at 88% -10%,rgba(193,153,67,.30),transparent 60%),radial-gradient(520px 280px at 4% 118%,rgba(46,125,50,.38),transparent 62%),linear-gradient(120deg,#072219,#0C392D 55%,#11472E);overflow:hidden;margin-bottom:17px;box-shadow:var(--shadow-lg)}
.hero:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.028) 46px 47px);pointer-events:none}
.hero-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
.hero .eyebrow{color:#E8DABC;margin-bottom:8px}
.hero h2{font-size:31px;line-height:1.12;margin:0 0 7px;font-weight:850;letter-spacing:0;color:#fff}
.hero .hsub{color:#BCD2C0;font-size:12.5px;max-width:640px;line-height:1.6}
.hero-date{text-align:right;color:#cfe0d2;font-size:12px;line-height:1.7}
.hero-date b{display:block;color:#E8DABC;font-size:15px;letter-spacing:0}
.hero-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:21px;position:relative;z-index:1}
.hero-kpi{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:15px 16px 13px;cursor:pointer;transition:background .15s ease,transform .15s ease}
.hero-kpi:hover{background:rgba(255,255,255,.10);transform:translateY(-2px)}
.hk-top{font-size:11.5px;letter-spacing:0;color:#CFE0D2;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.hk-num{font-size:41px;font-weight:850;line-height:1.06;margin:7px 0 2px;background:linear-gradient(180deg,#D6BE8B,#CAB079);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:0}
.hk-sub{font-size:11.5px;color:#A9C3AE}
.spark{display:flex;align-items:flex-end;gap:3px;height:24px;margin-top:10px}
.spark i{flex:1;background:linear-gradient(180deg,rgba(223,198,143,.95),rgba(193,153,67,.55));border-radius:2px 2px 0 0;min-height:3px}
/* Dieu hanh hom nay */
.today-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:17px}
.today-card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease;min-width:0}
.today-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.today-card.red{border-top-color:rgba(255,255,255,.15)}.today-card.blue{border-top-color:rgba(255,255,255,.15)}.today-card.green{border-top-color:rgba(255,255,255,.15)}
.tc-top{font-size:11.5px;font-weight:850;letter-spacing:0;color:#A88C4E;display:flex;justify-content:space-between;align-items:center}
.tc-big{font-size:25px;font-weight:850;letter-spacing:0;margin:7px 0 3px;color:var(--ink)}
.tc-item{font-size:12px;color:#5D5B54;padding:2.5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-item b{color:#2D2D2A}
/* Co cau tap doan */
.group-band{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:17px}
.gb-block{border-radius:15px;padding:18px 19px;color:#fff;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease}
.gb-block:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.gb-block:after{content:"";position:absolute;right:-24px;top:-24px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.09)}
.gb-block .gb-name{font-size:12.5px;font-weight:850;letter-spacing:0}
.gb-block .gb-num{font-size:35px;font-weight:850;letter-spacing:0;margin:8px 0 2px}
.gb-block .gb-sub{font-size:12px;opacity:.85;line-height:1.6}
.gb-wp{background:linear-gradient(120deg,#0A2E21,#17503D)}
.gb-ww{background:linear-gradient(120deg,#0A2E21,#17503D)}
.gb-sh{background:linear-gradient(120deg,#33332E,#5A5A52)}
/* Bang xep hang/bars */
.bar-mini{height:6px;background:#EF EDE6;background:#EFEDE6;border-radius:99px;overflow:hidden;min-width:96px}
.bar-mini i{display:block;height:100%;background:linear-gradient(90deg,#CFAE67,#A28037);border-radius:99px}
.rank-mono{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:12px;flex:0 0 auto}
/* Cover band cong ty */
.company-band{height:64px;margin:-15px -15px 13px;background:linear-gradient(115deg,var(--co),color-mix(in srgb,var(--co) 55%,#0C3B2E));display:flex;align-items:flex-end;justify-content:flex-end;padding:8px 12px;overflow:hidden}
.company-band span{font-size:34px;font-weight:900;letter-spacing:0;color:rgba(255,255,255,.35);line-height:1}
/* Login stats */
.login-stats{display:flex;gap:30px;margin-top:34px;flex-wrap:wrap}
.login-stats b{display:block;font-size:27px;font-weight:850;background:linear-gradient(180deg,#D6BE8B,#CAB079);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.login-stats span{font-size:10.5px;letter-spacing:0;color:#BCD2C0;font-weight:800}
/* Switch tu dong hoa */
.switch{width:45px;height:25px;border-radius:99px;background:#D8D4C6;border:0;position:relative;transition:background .15s ease;flex:0 0 auto;padding:0}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s ease;box-shadow:0 1px 4px rgba(0,0,0,.28)}
.switch.on{background:#2E7D32}
.switch.on:after{left:23px}
.rule-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.rule-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px}
.rule-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
.rule-head b{font-size:12.5px;line-height:1.45}
.rule-meta{display:grid;gap:5px;font-size:12px;color:#5D5B54;line-height:1.55}
.rule-meta b{color:#A88C4E;font-size:10.5px;letter-spacing:0;margin-right:6px}
.chan{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;background:#EEF3EE;color:#2E7D32;white-space:nowrap}
.chan.email{background:#EAF0FF;color:#2456A6}.chan.zalo{background:#E8F4FD;color:#0B6FA4}
/* Lich sinh nhat */
.view-toggle{display:inline-flex;background:#EF EDE6;background:#EFEDE6;border-radius:9px;padding:3px;gap:3px}
.view-toggle button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:750;color:#777}
.view-toggle button.active{background:#fff;color:#7A5F1D;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.cal-title{font-size:16px;font-weight:850;letter-spacing:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow{text-align:center;font-size:11px;font-weight:850;letter-spacing:0;color:#A88C4E;padding:5px 0}
.cal-cell{min-height:98px;border:1px solid var(--line);border-radius:11px;padding:7px;background:#fff;min-width:0}
.cal-cell.dim{opacity:.35;background:#FAF9F5}
.cal-cell.today{border:2px solid var(--gold);background:#FAF7EF}
.cal-day{font-size:12.5px;font-weight:850;margin-bottom:5px;color:#45443F}
.cal-cell.today .cal-day{color:#A88C4E}
.cal-chip{display:flex;align-items:center;gap:5px;background:#F3ECDE;border:1px solid #E2D4B6;border-radius:20px;padding:2px 8px 2px 2px;font-size:10.5px;font-weight:750;cursor:pointer;margin-bottom:4px;max-width:100%;overflow:hidden;white-space:nowrap}
.cal-chip:hover{background:#EBE0C9}
.cal-chip .avatar{width:18px;height:18px;font-size:8px;flex:0 0 auto}
.cal-more{font-size:10.5px;color:#A88C4E;font-weight:850;padding-left:4px}
/* Lich tap doan */
.year-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.month-cell{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 14px;min-width:0}
.month-cell h4{margin:0 0 9px;font-size:13px;font-weight:850;letter-spacing:0;color:#0C3B2E}
.evt{display:flex;gap:7px;font-size:11.5px;padding:3.5px 0;line-height:1.45;color:#45443F}
.evt i{width:8px;height:8px;border-radius:50%;margin-top:4px;flex:0 0 auto}
.evt small{display:block;color:#999;font-size:10.5px}
.evt-none{font-size:11.5px;color:#B9B6AA;padding:3px 0}
/* Stepper quy trinh */
.steps{display:grid}
.step{display:flex;gap:14px;position:relative;padding:0 0 20px}
.step:before{content:"";position:absolute;left:15px;top:36px;bottom:1px;width:2px;background:#E7E2D2}
.step:last-child:before{display:none}
.step:last-child{padding-bottom:2px}
.step-n{width:32px;height:32px;border-radius:50%;background:linear-gradient(160deg,#12492F,#0C3B2E);color:#E8DABC;font-weight:850;display:grid;place-items:center;flex:0 0 auto;z-index:1;font-size:12.5px;box-shadow:0 3px 8px rgba(12,59,46,.3)}
.step-body{flex:1;min-width:0;padding-top:5px}
.step-body b{font-size:12.5px}
.step-role{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;background:#F4F1E7;color:#6B5830;margin-left:8px;white-space:nowrap}
.step-body p{margin:5px 0 0;color:#5D5B54;font-size:12.5px;line-height:1.6}
.proc-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.proc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease}
.proc-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.proc-card .pc-ico{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#E7D7B6,#D1B987);display:grid;place-items:center;font-size:17px;color:#614B1C;margin-bottom:11px}
.proc-card b{font-size:13px;display:block;margin-bottom:5px}
.proc-card p{margin:0;color:#777;font-size:12px;line-height:1.6}
/* Phieu luong/ca nhan */
.ring{width:104px;height:104px;border-radius:50%;position:relative;flex:0 0 auto}
.ring:after{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%}
.ring-c{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c b{font-size:16px}.ring-c span{font-size:10px;color:#888}
.slip-row{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px dashed #E7E2D2;font-size:13px}
.slip-row.total{border-bottom:0;border-top:2px solid var(--gold);font-weight:850;font-size:13.5px;margin-top:4px;padding-top:12px}
.me-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1180px){.hero-kpis,.today-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.year-grid,.proc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rule-grid,.me-grid{grid-template-columns:1fr}.group-band{grid-template-columns:1fr}}
@media (max-width:720px){.hero-kpis,.today-grid,.year-grid,.proc-grid{grid-template-columns:1fr}.cal-cell{min-height:74px}.hero{padding:20px}.hero h2{font-size:24px}}

// BRIEF: Sidebar thu gọn/mở rộng theo nhóm lớn | Collapsible sidebar groups
// EDITABLE: key lưu trạng thái, nhóm mặc định mở | storage key, default-open groups
// FIX AT: navGroupsHTML / toggleNavGroup
function navGroupsHTML(badges){
  // Đọc trạng thái đóng/mở đã lưu / read saved fold state
  let saved={};
  try{saved=JSON.parse(localStorage.getItem('tgroup_nav_fold')||'{}')}catch(e){}
  return NAV.filter(([lb,items])=>items.some(n=>allowed(n[0]))).map(([label,items])=>{
    // Mục con được phép xem / visible child items
    let list=items.filter(n=>allowed(n[0]));
    // Nhóm chứa trang hiện tại luôn mở / group of current page stays open
    let open=list.some(n=>n[0]===currentPage)||saved[label]===false;
    // Tổng badge hiện khi nhóm đóng / badge total shown when closed
    let sum=list.reduce((a,n)=>a+(badges[n[0]]||0),0);
    let kids=list.map(n=>{let st=PAGE_STATUS[n[0]]||'';if(st==='soon')return `<button class="nav-soon ${currentPage===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span><span class="lb">${n[2]}</span><span class="soon-chip">COMING SOON</span></button>`;return `<button class="${currentPage===n[0]?'active':''}" ${st==='dev'?'title="Đang phát triển"':''} onclick="go('${n[0]}')"><span class="ico">${n[1]}</span><span class="lb">${n[2]}</span>${st==='dev'?'<span class="dev-dot"></span>':''}${badges[n[0]]?`<span class="nav-badge">${badges[n[0]]}</span>`:''}</button>`}).join('');
    return `<div class="nav-group${open?'':' is-closed'}" data-grp="${esc(label)}"><button class="nav-label nav-toggle" aria-expanded="${open}" onclick="toggleNavGroup(this)"><span>${label}</span>${sum?`<span class="nav-badge nav-badge-grp">${sum}</span>`:''}<i class="nav-chev"></i></button><div class="nav-body"><div class="nav">${kids}</div></div></div>`;
  }).join('');
}
// Đóng/mở một nhóm và lưu lại / toggle one group and persist
function toggleNavGroup(btn){
  let g=btn.parentElement,closed=g.classList.toggle('is-closed');
  btn.setAttribute('aria-expanded',String(!closed));
  let saved={};
  try{saved=JSON.parse(localStorage.getItem('tgroup_nav_fold')||'{}')}catch(e){}
  saved[g.getAttribute('data-grp')]=closed;

function pageLabel(p){const map={overview:'Tổng quan',companies:'Công ty thành viên',projects:'Dự án',tasks:'Công việc',employees:'Hồ sơ nhân sự',clients:'Khách hàng',suppliers:'Nhà cung cấp',warehouses:'Kho',materials:'Vật tư',budgets:'Ngân sách dự án',vouchers:'Chứng từ',payments:'Thanh toán',leave:'Cổng Nghỉ Phép',attendance:'Chấm công','daily-plans':'Kế hoạch ngày',forms:'Biểu mẫu in',notifications:'Thông báo',audit:'Lịch sử hệ thống',settings:'Cài đặt',worker:'Tổng quan thợ',search:'Kết quả tìm kiếm',attention:'Trung tâm cảnh báo',meetings:'Họp Ban Giám đốc','meeting-detail':'Chi tiết cuộc họp',okr:'OKR toàn Group',cashflow:'Ngân sách & dòng tiền',risks:'Rủi ro & bản đồ nhiệt',radar:'Công việc đến hạn',contracts:'Hợp đồng',orgchart:'Sơ đồ tổ chức',pipeline:'Cơ hội khách hàng',payroll:'Lương & thu nhập',automation:'Tự động hóa',myspace:'Bàn làm việc',birthdays:'Sinh nhật nhân sự','group-calendar':'Lịch chung toàn hệ sinh thái','handbook-weplus':'Handbook WePlus Group','handbook-wewall':'Handbook WeWall Group',processes:'Quy trình & Quy chế'};return map[p]||p}
function setPage(p){if(!allowed(p)){toast('Vai trò hiện tại không có quyền truy cập module này.');return}currentPage=p;selectedCompany=null;selectedProject=null;selectedEmployee=null;render() }function go(p){if(!allowed(p)){toast('Tài khoản của bạn không có quyền xem mục này');return}setPage(p);document.getElementById('sidebar')?.classList.remove('open')}

function fitNav(){document.querySelectorAll('.nav button').forEach(el=>{let lb=el.querySelector('.lb');if(!lb||!lb.clientWidth)return;el.style.removeProperty('font-size');let fs=parseFloat(getComputedStyle(el).fontSize)||14;let guard=0;while(lb.scrollWidth>lb.clientWidth&&fs>11&&guard<16){fs-=0.5;el.style.setProperty('font-size',fs+'px','important');guard++}})}


function cselSync(sel){let w=sel.closest('.csel');if(!w)return;let o=sel.options[sel.selectedIndex];let t=w.querySelector('.csel-txt');if(t)t.textContent=o?o.textContent:'';w.querySelectorAll('.csel-item').forEach((it,ix)=>it.classList.toggle('sel',ix===sel.selectedIndex))}
function enhanceSelects(){document.querySelectorAll('select:not([data-csel])').forEach(sel=>{if(sel.multiple)return;sel.dataset.csel='1';let w=document.createElement('div');w.className='csel';if(sel.style.width)w.style.width=sel.style.width;sel.parentNode.insertBefore(w,sel);w.appendChild(sel);sel.style.display='none';let b=document.createElement('button');b.type='button';b.className='csel-btn';b.innerHTML='<span class="csel-txt"></span><span class="csel-arw">\u25BE</span>';b.onclick=function(e){e.stopPropagation();let was=w.classList.contains('open');document.querySelectorAll('.csel.open').forEach(x=>x.classList.remove('open'));if(!was)w.classList.add('open')};w.appendChild(b);if(sel.disabled){w.classList.add('csel-dis');b.disabled=true}let list=document.createElement('div');list.className='csel-list';Array.from(sel.options).forEach((o,ix)=>{let it=document.createElement('div');it.className='csel-item';it.textContent=o.textContent;it.onclick=function(e){e.stopPropagation();sel.selectedIndex=ix;sel.dispatchEvent(new Event('change',{bubbles:true}));sel.dispatchEvent(new Event('input',{bubbles:true}));cselSync(sel);w.classList.remove('open')};list.appendChild(it)});w.appendChild(list);cselSync(sel)})}
document.addEventListener('click',()=>{document.querySelectorAll('.csel.open').forEach(x=>x.classList.remove('open'))});
let __cselT=null;new MutationObserver(()=>{clearTimeout(__cselT);__cselT=setTimeout(enhanceSelects,60)}).observe(document.documentElement,{childList:true,subtree:true});
document.addEventListener('DOMContentLoaded',()=>setTimeout(enhanceSelects,300));
function fitTitles(){document.querySelectorAll('.page-head h1').forEach(h=>{let head=h.closest('.page-head');if(!head)return;let avail=head.clientWidth;h.style.removeProperty('font-size');h.style.maxWidth=avail+'px';let fs=parseFloat(getComputedStyle(h).fontSize)||32;let g=0;while(h.scrollWidth>avail&&fs>19&&g++<24){fs-=1;h.style.setProperty('font-size',fs+'px','important')}})}
function fitNames(){document.querySelectorAll('.company-name').forEach(el=>{el.style.removeProperty('font-size');let fs=parseFloat(getComputedStyle(el).fontSize)||20;let guard=0;while(el.scrollWidth>el.clientWidth&&fs>12&&guard<24){fs-=0.5;el.style.setProperty('font-size',fs+'px','important');guard++}})}
function injectSTT(root){if(!root)return;root.querySelectorAll('table').forEach(tb=>{if(tb.closest('.hb-sec-body')||tb.closest('.calendar')||tb.dataset.sttDone)return;let hr=tb.querySelector('thead tr');if(!hr)return;let first=hr.querySelector('th,td');if(!first)return;if(/^(STT|SỐ|#)$/i.test((first.textContent||'').trim()))return;let th=document.createElement('th');th.textContent='STT';th.className='stt';let hrows=tb.querySelectorAll('thead tr').length;if(hrows>1)th.rowSpan=hrows;hr.insertBefore(th,hr.firstChild);let n=0;tb.querySelectorAll('tbody tr').forEach(tr=>{let c=tr.querySelector('td,th');if(!c)return;if(c.colSpan>1){c.colSpan=c.colSpan+1;return}let td=document.createElement('td');td.className='stt';td.textContent=(++n);tr.insertBefore(td,tr.firstChild)});tb.dataset.sttDone='1'})}
function render(){setTimeout(()=>{fitNames();fitNav();fitTitles()},0);setTimeout(fitTitles,350);if(!loginVisible&&!allowed(currentPage))currentPage=landingPage();const root=document.getElementById('app');root.innerHTML=shell();injectSTT(root);if(loginVisible)renderLogin();requestAnimationFrame(animateKPIs);}
function toggleMenu(){document.getElementById('sidebar')?.classList.toggle('open')}function doLogout(){sessionStorage.removeItem('tgroup_os_session');sessionStorage.removeItem('tgroup_os_user');sessionStorage.removeItem('tgroup_os_intro');loginVisible=true;currentUser=USERS[0];render()}
function onGlobalSearch(v){globalQuery=v;let el=document.querySelector('.global-search input');if(el&&el.value!==v)el.value=v}
function toast(msg){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3200)}
function soonBanner(){return PAGE_STATUS[currentPage]==='soon'?'<div class="soon-banner"><b>COMING SOON</b> — Trang đang được phát triển và sẽ sớm đưa vào hoạt động chính thức. Bạn vẫn có thể mở xem tham khảo.</div>':''}
function pageHead(title,sub,actions=''){return `${soonBanner()}<div class="page-head"><div><h1>${title}</h1>${/^(Từ khóa|Xin chào)/.test(String(sub))?`<div class="sub">${sub}</div>`:''}</div><div class="actions">${actions}</div></div>`}function btn(label,onclick,cls=''){return `<button class="btn ${cls}" onclick="${onclick}">${label}</button>`}function status(s){return `<span class="status ${statusClass(s)}">${esc(s)}</span>`}function progressCell(n){if(n==null)return '<span style="color:#888">Chưa có dữ liệu</span>';return `<div class="progress-cell"><div><span>Tiến độ</span><b>${n}%</b></div><div class="progress"><span style="width:${Math.max(0,Math.min(100,n))}%"></span></div></div>`}
function renderPage(){if(!allowed(currentPage))currentPage=landingPage();switch(currentPage){case'group-weplus':return renderGroupSpace('WePlus Group');case'group-wewall':return renderGroupSpace('WeWall Group');case'reports':return renderReports();case'users':return renderUsers();case'syslog':return renderSyslog();case'overview':return renderOverview();case'companies':return selectedCompany?renderCompanyDetail(selectedCompany):renderCompanies();case'projects':return selectedProject?renderProjectDetail(selectedProject):renderProjects();case'tasks':return renderTasks();case'employees':return selectedEmployee?renderEmployeeDetail(selectedEmployee):renderEmployees()+empStamp();case'clients':return renderClients();case'suppliers':return renderSuppliers();case'warehouses':return renderWarehouses();case'materials':return renderMaterials();case'budgets':return renderBudgets();case'vouchers':return renderVouchers();case'payments':window.finTab='payments';return renderVouchers();case'leave':return renderLeave();case'attendance':return renderAttendance();case'daily-plans':return renderDailyPlans();case'forms':return renderForms();case'notifications':return renderNotifications();case'audit':return renderAudit();case'settings':return renderSettings()+renderSettingsExtra();case'worker':return renderWorker();case'attention':return renderAttention();case'meetings':return renderMeetings();case'meeting-detail':return renderMeetingDetail();case'okr':return renderOKR();case'cashflow':return renderCashflow();case'risks':return renderRisks();case'radar':return renderRadar();case'contracts':window.projTab='contracts';return renderProjects();case'orgchart':return renderOrgchart();case'pipeline':return renderPipeline();case'payroll':return renderPayroll();case'automation':return renderAutomation();case'myspace':window._mpTab='ban-lam-viec';return renderMyProfile();case'myprofile':return renderMyProfile();case'group-calendar':return renderGroupCalendar();case'community':return renderCommunity();case'processes':return renderProcesses();case'search':return renderSearch();case'handbook-weplus':return renderHandbook('weplus');case'handbook-wewall':return renderHandbook('wewall');default:return renderOverview()}}
function sparkBars(vals){let max=Math.max(...vals,1);return `<span class="spark">${vals.map(v=>`<i style="height:${Math.max(12,Math.round(v/max*100))}%"></i>`).join('')}</span>`}
function areaChartSVG(months){let ks=Object.keys(months).sort();if(!ks.length)return '<div class="empty">Chưa có dữ liệu dòng tiền theo tháng.</div>';let vals=ks.map(k=>months[k]);let max=Math.max(...vals,1);let W=560,H=150,PL=6,PB=20,PT=12;let x=i=>PL+i*(W-PL*2)/Math.max(1,ks.length-1);let y=v=>PT+(H-PT-PB)*(1-v/max);let pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');let area=`${PL},${H-PB} ${pts} ${x(vals.length-1)},${H-PB}`;return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block"><defs><linearGradient id="cfGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CAB079" stop-opacity=".38"/><stop offset="1" stop-color="#CAB079" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#cfGrad)"/><polyline points="${pts}" fill="none" stroke="#A28037" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.4" fill="#fff" stroke="#A28037" stroke-width="2"/><text x="${x(i)}" y="${H-5}" text-anchor="${i===0?'start':i===vals.length-1?'end':'middle'}" font-size="10" fill="#8a877d">${ks[i].slice(5)}/${ks[i].slice(2,4)}</text><text x="${x(i)}" y="${Math.max(10,y(v)-9)}" text-anchor="${i===0?'start':i===vals.length-1?'end':'middle'}" font-size="9.5" font-weight="700" fill="#614B1C">${(v/1e9).toFixed(2).replace('.',',')} tỷ</text>`).join('')}</svg>`}

function scopedEmployees(){if(['Developer','Chủ tịch','HR','Kế toán'].includes(currentUser.role))return db.employees;let ids=visibleCompanies().map(c=>c.id);return db.employees.filter(e=>ids.includes(e.companyId))}

function renderSettingsExtra(){let last=localStorage.getItem('tg_last_backup');let lastTxt=last?fmtDate(last.slice(0,10)):'Chưa có bản sao lưu nào';let old=!last||(Date.now()-new Date(last).getTime()>7*864e5);let l0=legalOf('engage');return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:16px"><div class="panel"><div class="panel-head"><h3>SAO LƯU DỮ LIỆU</h3></div><p style="font-size:13px;color:#666">Bản sao lưu gần nhất: <b>${lastTxt}</b></p>${old?'<div class="notice">Đã quá 7 ngày chưa sao lưu — nên xuất 1 bản ngay.</div>':''}<div style="display:flex;gap:8px;flex-wrap:wrap">${btn('Xuất JSON','exportData()','primary')}${btn('Xuất Excel','exportExcel5()')}</div><p style="font-size:12px;color:#888;margin-top:8px">JSON dùng để khôi phục hệ thống; Excel theo Mẫu 5 để đọc và đối chiếu. Bản sao lưu đầy đủ được lưu trữ ở kho riêng theo chính sách của hệ thống.</p></div><div class="panel"><div class="panel-head"><h3>THÔNG TIN PHÁP NHÂN</h3></div><div class="field"><label>Công ty</label><select id="legal-co" onchange="fillLegalForm(this.value)">${COMPANY_SEED.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Tên pháp lý đầy đủ</label><input id="legal-name" value="${esc(l0.name||'')}"></div><div class="field"><label>Mã số thuế</label><input id="legal-tax" value="${esc(l0.tax_code||'')}"></div><div class="field"><label>Địa chỉ</label><input id="legal-addr" value="${esc(l0.address||'')}"></div><div class="field"><label>Số điện thoại</label><input id="legal-phone" value="${esc(l0.phone||'')}"></div><div class="field"><label>WEBSITE</label><input id="legal-web" placeholder="www..."></div><div class="field"><label>Người đại diện</label><input id="legal-rep" value="${esc(l0.representative||'')}"></div>${btn('Lưu thông tin pháp nhân','saveLegalCfg()','primary')}<p style="font-size:12px;color:#888;margin-top:8px">Admin của từng công ty tự cập nhật tại đây khi đổi tên, địa chỉ hoặ ody=`<div class="panel"><div class="panel-head"><h3>DỰ ÁN ${group.toUpperCase()}</h3><span class="tag">${projs.length} dự án</span></div><div class="table-wrap"><table><thead><tr><th>DỰ ÁN</th><th>CÔNG TY</th><th>TRẠNG THÁI</th><th>TIẾN ĐỘ</th></tr></thead><tbody>${projs.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(companyName(x.companyId))}</td><td>${esc(x.status||'')}</td><td>${x.progress||0}%</td></tr>`).join('')}</tbody></table></div></div>`}else if(cur==='handbook'){body=group==='WePlus Group'?renderHbWpTabs():renderHbWwAccordion()}else if(cur==='quytrinh'){body=`<div class="notice">Quy trình vận hành là chuẩn chung của hệ sinh thái; quy chế riêng của ${group} nằm ở tab Handbook.</div><div class="grid proc-grid">${PROCESSES.map(pr=>`<div class="proc-card"><h4>${esc(pr.name)}</h4><p>${esc(pr.desc||'')}</p><span class="tag">${(pr.steps||[]).length} bước</span></div>`).join('')}</div><div style="margin-top:12px">${btn('Mở trang Quy trình và Quy chế',"go('processes')",'primary')}</div>`}return `${head}<div class="tabs tabs-l1">${tabs}</div>${body}`}
function repBar(label,val,max,valTxt,color){let pct=max?Math.round(val/max*100):0;return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${label}</span><b>${valTxt}</b></div><div class="rep-bar"><i style="width:${pct}%;${color?'background:'+color:''}"></i></div></div>`}
function renderReports(){let byCo=COMPANY_SEED.map(c=>({name:c.name,n:db.employees.filter(e=>e.companyId===c.id).length})).filter(x=>x.n>0);let maxE=Math.max(...byCo.map(x=>x.n),1);let stCount={};db.projects.forEach(x=>stCount[x.status]=(stCount[x.status]||0)+1);let maxS=Math.max(...Object.values(stCount),1);let byProj={};db.budgets.forEach(b=>{if(!b.projectId)return;byProj[b.projectId]=byProj[b.projectId]||{a:0,sp:0};byProj[b.projectId].a+=b.amount||0;byProj[b.projectId].sp+=b.spent||0});let finA=Object.values(byProj).reduce((a,v)=>a+v.a,0),finS=Object.values(byProj).reduce((a,v)=>a+v.sp,0),finPaid=db.vouchers.filter(v=>v.status==='Đã chi').reduce((a,v)=>a+(Number(v.amount)||0),0),prPer=PAY_PERIODS[PAY_PERIODS.length-1],prNet=payrollRows(prPer.id).reduce((a,r)=>a+r.net,0),grpN=g=>db.projects.filter(x=>{let c=COMPANY_SEED.find(z=>z.id===x.companyId);return c&&c.group===g}).length;let topP=Object.entries(byProj).map(([pid,v])=>({name:(db.projects.find(x=>x.id===pid)||{}).name||pid,a:v.a,sp:v.sp})).sort((a,b)=>b.a-a.a).slice(0,6);let maxA=Math.max(...topP.map(x=>x.a),1);let vs={};db.vouchers.forEach(v=>vs[v.status]=(vs[v.status]||0)+1);let vtot=db.vouchers.length||1;let cols=['#0C3B2E','#C9A227','#B3261E','#5C5A52','#2E7D32'];let acc=0;let segs=Object.entries(vs).map(([k,v],i)=>{let a0=(acc/vtot*360).toFixed(1);acc+=v;let a1=(acc/vtot*360).toFixed(1);return cols[i%5]+' '+a0+'deg '+a1+'deg'}).join(',');let lt={};db.leave_requests.forEach(r=>lt[r.type]=(lt[r.type]||0)+1);let maxL=Math.max(...Object.values(lt),1);return `${pageHead('Báo cáo tổng quan hệ sinh thái','Số liệu tổng hợp toàn hệ sinh thái trình bày theo biểu đồ — dành cho Chủ tịch và Developer.','')}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(330px,1fr))"><div class="panel"><div class="panel-head"><h3>NHÂN SỰ THEO CÔNG TY</h3><span class="tag">${db.employees.length} người</span></div>${byCo.map(x=>repBar(esc(x.name),x.n,maxE,x.n+' người')).join('')}</div><div class="panel"><div class="panel-head"><h3>DỰ ÁN THEO TRẠNG THÁI</h3><span class="tag">${db.projects.length} dự án</span></div>${Object.entries(stCount).map(([k,v])=>repBar(esc(k),v,maxS,v+' dự án')).join('')}</div><div class="panel"><div class="panel-head"><h3>NGÂN SÁCH THEO DỰ ÁN — ĐÃ CHI/DỰ TRÙ</h3></div>${topP.map(x=>repBar(esc(x.name),x.sp,maxA,fmtMoney(x.sp)+' / '+fmtMoney(x.a),'#C9A227')).join('')}</div><div class="panel"><div class="panel-head"><h3>CHỨNG TỪ THEO TRẠNG THÁI</h3><span class="tag">${db.vouchers.length} chứng từ</span></div><div style="display:flex;gap:18px;align-items:center"><div class="rep-donut" style="background:conic-gradient(${segs})"></div><div>${Object.entries(vs).map(([k,v],i)=>`<div style="font-size:13px;margin-bottom:6px"><span class="rep-dot" style="background:${cols[i%5]}"></span>${esc(k)}: <b>${v}</b></div>`).join('')}</div></div></div><div class="panel"><div class="panel-head"><h3>ĐƠN NGHỈ PHÉP THEO LOẠI</h3><span class="tag">${db.leave_requests.length} đơn</span></div>${Object.entries(lt).map(([k,v])=>repBar(esc(k),v,maxL,v+' đơn')).join('')}</div></div><div class="grid" style="grid-template-columns:1fr 1fr;gap:15px;margin-top:15px"><div class="panel"><div class="panel-head"><h3>TÀI CHÍNH TỔNG QUAN</h3></div><div class="mini-stat"><span>Tổng dự trù dự án</span><b>${fmtMoney(finA)}</b></div><div class="mini-stat"><span>Thực chi theo hạng mục</span><b>${fmtMoney(finS)}</b></div><div class="mini-stat"><span>Đã chi theo chứng từ</span><b>${fmtMoney(finPaid)}</b></div><div class="mini-stat"><span>Còn phải chi</span><b>${fmtMoney(finA-finPaid)}</b></div><div class="mini-stat"><span>Quỹ lương kỳ ${prPer.label} — thực lãnh</span><b>${fmtMoney(prNet)}</b></div></div><div class="panel"><div class="panel-head"><h3>DỰ ÁN THEO NHÓM NGÀNH</h3></div><div class="mini-stat"><span>Sự kiện và truyền thông — WePlus Group</span><b>${grpN('WePlus Group')} dự án</b></div><div class="mini-stat"><span>Thi công và xây dựng — WeWall Group</span><b>${grpN('WeWall Group')} dự án</b> async function clearBusinessData(){if(!await appConfirm({title:'Bắt đầu vận hành chính thức?',msg:'Toàn bộ dữ liệu mẫu (nhân sự, dự án, chứng từ, ngân sách, đơn nghỉ phép...) sẽ bị xóa sạch. Cấu hình, thông tin pháp nhân, tài khoản và phân quyền được giữ nguyên. Sau thao tác này, dữ liệu mẫu không tự quay lại khi khôi phục.',ok:'Xóa dữ liệu mẫu',danger:true}))return;['employees','projects','clients','suppliers','vouchers','budgets','leave_requests','attendance_records','notifications','meetings','contracts','stock_movements','daily_plans','audit','audit_log'].forEach(k=>{if(Array.isArray(db[k]))db[k]=[]});db.golive=true;saveDB();logSys('Bắt đầu vận hành','Xóa dữ liệu mẫu, chuyển hệ thống sang trạng thái vận hành chính thức');toast('Đã xóa dữ liệu mẫu. Hệ thống sẵn sàng nạp dữ liệu thật.');render()}

async function readXlsxRows(buf){let u8=new Uint8Array(buf);let dv=new DataView(buf);let eocd=-1;for(let i=u8.length-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}if(eocd<0)throw new Error('File xlsx không hợp lệ');let total=dv.getUint16(eocd+10,true);let off=dv.getUint32(eocd+16,true);let files={};for(let n=0;n<total;n++){if(dv.getUint32(off,true)!==0x02014b50)break;let method=dv.getUint16(off+10,true);let csize=dv.getUint32(off+20,true);let nlen=dv.getUint16(off+28,true);let elen=dv.getUint16(off+30,true);let clen=dv.getUint16(off+32,true);let lho=dv.getUint32(off+42,true);let name=new TextDecoder().decode(u8.slice(off+46,off+46+nlen));let lnlen=dv.getUint16(lho+26,true);let lelen=dv.getUint16(lho+28,true);let start=lho+30+lnlen+lelen;let comp=u8.slice(start,start+csize);let data;if(method===0){data=comp}else{let ds=new DecompressionStream('deflate-raw');data=new Uint8Array(await new Response(new Blob([comp]).stream().pipeThrough(ds)).arrayBuffer())}files[name]=new TextDecoder().decode(data);off+=46+nlen+elen+clen}let ss=[];if(files['xl/sharedStrings.xml']){let d=new DOMParser().parseFromString(files['xl/sharedStrings.xml'],'text/xml');ss=Array.from(d.querySelectorAll('si')).map(si=>Array.from(si.querySelectorAll('t')).map(t=>t.textContent).join(''))}let sheetName=Object.keys(files).find(k=>/xl\/worksheets\/sheet1\.xml$/.test(k))||Object.keys(files).find(k=>k.indexOf('xl/worksheets/')===0);if(!sheetName)throw new Error('Không thấy sheet dữ liệu trong file');let d=new DOMParser().parseFromString(files[sheetName],'text/xml');let rows=[];d.querySelectorAll('row').forEach(r=>{let arr=[];r.querySelectorAll('c').forEach(c=>{let ref=c.getAttribute('r')||'';let col=ref.replace(/[0-9]/g,'');let idx=0;for(let ch of col)idx=idx*26+(ch.charCodeAt(0)-64);idx--;let v=c.querySelector('v');let ist=c.querySelector('is t');let val=ist?ist.textContent:(v?v.textContent:'');if(c.getAttribute('t')==='s'&&val!=='')val=ss[parseInt(val)]||'';arr[idx]=val});rows.push(arr)});return rows}

const LV_FORM=`<div class="panel" style="margin-bottom:16px"><div class="form-grid"><div class="field" style="grid-column:1/-1"><label>Email</label><div style="display:flex;gap:8px"><input id="lvEmail" type="email" placeholder="Nhập email đã đăng ký" style="flex:1"><button type="button" class="btn primary" onclick="lvVerify()">XÁC THỰC</button></div></div><p id="lvMsg" style="grid-column:1/-1;margin:4px 0 0;font-size:15.5px;font-weight:800;line-height:1.4"></p><div class="field"><label>Họ và tên</label><input id="lvName" readonly style="background:#F7F4EA"></div><div class="field"><label>Công ty</label><input id="lvDept" readonly style="background:#F7F4EA"></div><div class="field"><label>Chức vụ</label><input id="lvPosition" readonly style="background:#F7F4EA"></div><div class="field"><label>Số điện thoại</label><input id="lvPhone" readonly style="background:#F7F4EA"></div><div class="field" style="grid-column:1/-1"><label>Người duyệt</label><input id="lvApprover" readonly style="background:#F7F4EA"></div><div class="field"><label>Nghỉ từ ngày</label><input id="lvFrom" type="date" disabled onchange="lvCalc()"></div><div class="field"><label>Nghỉ đến ngày</label><input id="lvTo" type="date" disabled onchange="lvCalc()"></div><div class="field"><label>Tổng số ngày nghỉ</label><input id="lvDays" readonly style="background:#F7F4EA"></div><div class="field"><label>Loại phép</label><select id="lvType" disabled><option>Nghỉ phép</option><option>Nghỉ không lương</option><option>Nghỉ hưởng chế độ</option></select></div><div class="field" style="grid-column:1/-1"><label>Lý do</label><textarea id="lvReason" maxlength="1000" disabled></textarea></div><div class="field"><label>Phép năm (đã dùng/còn lại)</label><input id="lvUsed" readonly placeholder="—" style="background:#F7F4EA"></div><div class="field" style="grid-column:1/-1"><label>Người nhận bàn giao</label><input id="lvHandover" maxlength="200" disabled></div><button type="button" class="btn primary" id="lvSubmit" disabled onclick="lvSubmitForm()" style="grid-column:1/-1;padding:12px">GỬI ĐƠN XIN NGHỈ</button></div></div>`;
let lvEmp=null;
function lvSet(id,v){let el=document.getElementById(id);if(el)el.value=v}
function lvVerify(){let em=(document.getElementById('lvEmail').value||'').trim().toLowerCase();let msg=document.getElementById('lvMsg');let e=db.employees.find(x=>(x.email||'').toLowerCase()===em);if(!e){lvEmp=null;msg.textContent='Không tìm thấy email trong danh bạ nhân sự. Kiểm tra lại email đã đăng ký.';msg.style.color='#B32121';return}lvEmp=e;lvSet('lvName',e.name);lvSet('lvDept',companyName(e.companyId));lvSet('lvPosition',e.position||'');lvSet('lvPhone',e.phone||'');let u=db.operating_units.find(x=>x.id===e.companyId);lvSet('lvApprover',u?(u.leader||''):'');let b=(db.leave_balances||{})[e.name];lvSet('lvUsed',b?b.used+' đã dùng / '+Math.max(0,(b.total||12)-b.used)+' còn lại':'—');['lvFrom','lvTo','lvType','lvReason','lvHandover','lvSubmit'].forEach(id=>{let el=document.getElementById(id);if(!el)return;el.disabled=false;if(el.tagName==='SELECT'){let w=el.closest('.csel');if(w){w.classList.remove('csel-dis');let bb=w.querySelector('.csel-btn');if(bb)bb.disabled=false}}});msg.textContent='Đã xác thực: '+e.name;msg.style.color='#26732D'}
function lvCalc(){let f=document.getElementById('lvFrom').value,t=document.getElementById('lvTo').value;let d=document.getElementById('lvDays');if(!d)return;if(f&&t){let n=Math.round((new Date(t+'T00:00:00')-new Date(f+'T00:00:00'))/86400000)+1;d.value=n>0?n+' ngày':'0 ngày'}else d.value=''}
function lvSubmitForm(){if(!lvEmp){toast('Cần xác thực email trước khi gửi đơn.');return}let f=document.getElementById('lvFrom').value,t=document.getElementById('lvTo').value;if(!f||!t){toast('Chưa chọn ngày nghỉ.');return}if(t<f){toast('Ngày kết thúc không được trước ngày bắt đầu.');return}db.leave_requests.unshift({id:uid('leave'),employeeId:lvEmp.id,employeeName:lvEmp.name,type:document.getElementById('lvType').value,start:f,end:t,reason:document.getElementById('lvReason').value.trim(),handover:document.getElementById('lvHandover').value.trim(),status:'Chờ duyệt',createdBy:currentUser.name,createdAt:today()});saveDB();audit('Tạo đơn nghỉ phép','leave','',lvEmp.name);lvEmp=null;render();toast('Đã gửi đơn xin nghỉ.')}
