function renderEdit(){
  const btn=el('button','fixed bottom-5 right-5 z-[100] px-4 py-2 rounded-full text-[10px] font-semibold flex items-center gap-2','');
  btn.style.background=THEME_GLOBAL.colors.black; btn.style.color='white'; btn.id='editBtn';
  btn.innerHTML=`<span class="w-2 h-2 rounded-full" style="background:${THEME_GLOBAL.colors.bronzeLight}"></span><span>${EDIT_CONFIG.btnText}</span>`;
  document.body.appendChild(btn);
  const modal=el('div','fixed inset-0 z-[100] hidden items-center justify-center',''); modal.style.background='rgba(0,0,0,0.6)'; modal.style.backdropFilter='blur(8px)'; modal.id='editModal';
  modal.innerHTML=`<div class="bg-white rounded-[14px] p-4 w-[90%] max-w-[320px] border" style="border-color:${THEME_GLOBAL.colors.border}"><div class="text-[12px] font-semibold">Nhập mật khẩu chỉnh sửa</div><input id="passInput" type="password" placeholder="279279" class="mt-2 w-full px-3 py-2 rounded-full border text-[11px] outline-none" style="border-color:${THEME_GLOBAL.colors.border}"/><div id="passErr" class="mt-2 text-[10px] text-red-500 hidden">Sai mật khẩu</div><div class="mt-3 flex gap-2 justify-end"><button id="cancelPass" class="px-3 py-1.5 rounded-full border text-[10px]" style="border-color:${THEME_GLOBAL.colors.border}">Hủy</button><button id="confirmPass" class="px-3 py-1.5 rounded-full bg-black text-white text-[10px]">Xác nhận</button></div></div>`;
  document.body.appendChild(modal);
  const toolbar=el('div','fixed top-[56px] left-0 right-0 z-[90] hidden items-center justify-between px-4 h-[36px]',''); toolbar.style.background=`linear-gradient(90deg, ${THEME_GLOBAL.colors.bronzeDark}, ${THEME_GLOBAL.colors.bronzeLight})`; toolbar.id='editToolbar';
  toolbar.innerHTML=`<div class="flex items-center gap-2 text-[10px] font-semibold text-white"><span class="w-2 h-2 rounded-full bg-white animate-pulse"></span><span>${EDIT_CONFIG.editingText}</span></div><div class="flex gap-2"><button id="saveEdit" class="px-3 py-1 rounded-full bg-white text-black text-[10px] font-semibold">Lưu</button><button id="exitEdit" class="px-3 py-1 rounded-full bg-black/20 text-white text-[10px] border border-white/20">Thoát</button></div>`;
  document.body.appendChild(toolbar);
  function enable(){ window.__editMode=true; document.querySelectorAll('[data-editable]').forEach(n=>{n.setAttribute('contenteditable','true'); n.style.outline='1px dashed '+THEME_GLOBAL.colors.bronzeLight;}); toolbar.classList.remove('hidden'); toolbar.classList.add('flex'); modal.classList.add('hidden'); modal.classList.remove('flex');}
  function disable(){ window.__editMode=false; document.querySelectorAll('[data-editable]').forEach(n=>{n.setAttribute('contenteditable','false'); n.style.outline='none';}); toolbar.classList.add('hidden');}
  function save(){ const data={}; document.querySelectorAll('[data-editable]').forEach((n,i)=>{data[i]=n.innerHTML;}); localStorage.setItem(EDIT_CONFIG.storageKey, JSON.stringify(data)); const t=el('div','fixed bottom-16 left-1/2 -translate-x-1/2 px-3 py-1.5 rounded-full bg-black text-white text-[10px] z-[100]','Đã lưu'); document.body.appendChild(t); setTimeout(()=>t.remove(),1600); }
  const saved=localStorage.getItem(EDIT_CONFIG.storageKey); if(saved){ try{ const d=JSON.parse(saved); const nodes=document.querySelectorAll('[data-editable]'); Object.keys(d).forEach(k=>{ if(nodes[k]) nodes[k].innerHTML=d[k]; }); }catch(e){} }
  btn.addEventListener('click',()=>{modal.classList.remove('hidden'); modal.classList.add('flex'); document.getElementById('passInput').focus();});
  document.getElementById('cancelPass').addEventListener('click',()=>modal.classList.add('hidden'));
  document.getElementById('confirmPass').addEventListener('click',()=>{ const v=document.getElementById('passInput').value; if(v===EDIT_CONFIG.password) enable(); else document.getElementById('passErr').classList.remove('hidden'); });
  document.getElementById('passInput').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('confirmPass').click(); });
  document.getElementById('saveEdit').addEventListener('click',save);
  document.getElementById('exitEdit').addEventListener('click',()=>{save(); disable();});
}

// PAGE SWIPE FADE LOGIC - keyword TGROUP_PAGE_SWIPE_FADE_2027
function initPageEffect(){
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');
      }
    });
  }, { threshold: PAGE_EFFECT_CONFIG.threshold });

  document.querySelectorAll('.fade-wrap').forEach(el=>observer.observe(el));

  // indicator dots right side
  if(PAGE_EFFECT_CONFIG.showIndicator){
    const ind = document.createElement('div');
    ind.className='fixed right-4 top-1/2 -translate-y-1/2 z-[80] hidden md:flex flex-col gap-3';
    ind.id='pageIndicator';
    const sections = document.querySelectorAll('.page-section');
    sections.forEach((s,i)=>{
      const dot = document.createElement('button');
      dot.className='indicator-dot';
      dot.dataset.target = s.id;
      dot.addEventListener('click',()=>{ s.scrollIntoView({behavior:'smooth'}); });
      ind.appendChild(dot);
    });
    document.body.appendChild(ind);
    // update active dot on scroll
    const dotObserver = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          document.querySelectorAll('.indicator-dot').forEach(d=>d.classList.remove('active'));
          const active = document.querySelector(`.indicator-dot[data-target="${e.target.id}"]`);
          if(active) active.classList.add('active');
        }
      });
    }, { threshold: 0.5 });
    sections.forEach(s=>dotObserver.observe(s));
  }
}
